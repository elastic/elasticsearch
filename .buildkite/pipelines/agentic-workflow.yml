---
# yaml-language-server: $schema=https://raw.githubusercontent.com/buildkite/pipeline-schema/main/schema.json
#
# elasticsearch-agentic-workflow
#
# On-demand agentic CI workflows powered by the self-contained archimedes CLI
# (https://github.com/elastic/elasticsearch-infra, archimedes/). archimedes runs
# directly on the agent — no remote pipeline trigger and no agent config in this
# repo. It is baked into the elasticsearch-* agent images; the pre-command hook
# resolves it and injects secrets when USE_ARCHIMEDES=true (see
# .buildkite/scripts/archimedes-env.sh).
#
# Supported workflows:
#   test-analysis          — analyse a test-failure issue        (needs ISSUE_URL)
#   pull-request-fix       — self-heal a failing pull request    (needs PR_URL)
#   pull-request-creation  — implement a task and open a PR      (needs ISSUE_URL)
#
# Trigger from the UI (fill the input step) or via the Buildkite API with the
# vars pre-set so the input step is skipped, e.g.:
#   curl -X POST ".../pipelines/elasticsearch-agentic-workflow/builds" \
#     -H "Authorization: Bearer $BUILDKITE_API_TOKEN" \
#     -d '{"branch":"main","env":{
#            "WORKFLOW":"test-analysis",
#            "ISSUE_URL":"https://github.com/elastic/elasticsearch/issues/150989"}}'

# Surface trigger vars at pipeline level so env() in step `if` conditions can
# see them on API-triggered builds.
env:
  WORKFLOW:  "${WORKFLOW:-}"
  ISSUE_URL: "${ISSUE_URL:-}"
  PR_URL:    "${PR_URL:-}"
  # Which archimedes to run. Unset (the default) uses whatever the agent image
  # baked, with no network access.
  #
  # No floor is pinned here on purpose. The image bake tracks the LATEST release
  # and the image is rebuilt daily, so the baked CLI is always recent enough for
  # the input step below (which needs the meta-data support added in 0.48.0).
  # Pinning a floor would be worse than useless: once the bake moves past it,
  # every job would DOWNGRADE to the pinned version and pay a full reinstall.
  #
  # Set `latest` to force the newest release, or `<x.y.z>` to pin an exact one
  # when reproducing an older build.
  ARCHIMEDES_VERSION: "${ARCHIMEDES_VERSION:-}"

steps:
  # ── Collect inputs (UI-triggered builds only) ───────────────────────────────
  # Skipped when WORKFLOW is already set, so API/scheduled builds run unattended.
  - input: ":robot_face: Which agentic workflow?"
    key: archimedes-input
    if: build.env("WORKFLOW") == null || build.env("WORKFLOW") == ""
    fields:
      - select: "Workflow"
        key: WORKFLOW
        options:
          - label: "test-analysis — analyse a test-failure issue"
            value: "test-analysis"
          - label: "pull-request-fix — self-heal a failing pull request"
            value: "pull-request-fix"
          - label: "pull-request-creation — implement a task and open a PR"
            value: "pull-request-creation"
      - text: "Issue URL"
        key: ISSUE_URL
        required: false
        hint: "Required for test-analysis and pull-request-creation."
      - text: "PR URL"
        key: PR_URL
        required: false
        hint: "Required for pull-request-fix."

  # ── Run archimedes ───────────────────────────────────────────────────────────
  - label: ":robot_face: Archimedes"
    key: archimedes-run
    depends_on: archimedes-input
    allow_dependency_failure: false
    timeout_in_minutes: 60
    env:
      USE_ARCHIMEDES: "true"
      ARCHIMEDES_SESSION_DIR: "/tmp/archimedes-sessions"
    agents:
      provider:       gcp
      image:          family/elasticsearch-ubuntu-2404
      # The archimedes-run agent is an I/O-bound orchestrator (LLM/gh/git calls); it does
      # NOT build Elasticsearch — reproduction runs on its own n4-standard-64 job.
      # 4 vCPU is plenty; the full-history mirror checkout is the only heavy step.
      machineType:    n4-standard-4
      diskType:       hyperdisk-balanced
      buildDirectory: /dev/shm/bk
    retry:
      automatic:
        # Spot preemption only. GCP_PREEMPTION_EXIT_CODE (47) is exported by the
        # pre-command hook, and `archimedes ci` resumes from the uploaded session
        # artifact. -1/255 cover the agent being lost or hard-killed.
        #
        # Deliberately NOT "*": a genuine agent failure (bad prompt, schema
        # violation, LLM error) is deterministic, so retrying it just pays the
        # full LLM cost twice and hides the failure.
        - exit_status: 47
          limit: 1
        - exit_status: -1
          limit: 1
        - exit_status: 255
          limit: 1
    # Single entry point: `archimedes ci` owns the whole CI envelope — input
    # validation, session download/upload (spot-preemption resume), the in-process
    # sandbox, dispatch to the analyze/fix-pr/create workflow, and the start/finish
    # progress annotations.
    #
    # It resolves WORKFLOW/ISSUE_URL/PR_URL from flags, then env, then Buildkite
    # build meta-data — so the input step above needs no shell bridging, and
    # API-triggered builds that pre-set the env vars keep working unchanged.
    # Needs archimedes >= 0.48.0 for the meta-data source; the agent image bakes
    # the latest release daily, so that is satisfied without pinning here.
    command: archimedes ci

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/buildkite/pipeline-schema/main/schema.json
#
# elasticsearch-agentic-workflow
#
# On-demand agentic CI workflows powered by the self-contained archimedes CLI
# (https://github.com/elastic/elasticsearch-infra, archimedes/). archimedes runs
# directly on the agent — no remote pipeline trigger and no agent config in this
# repo. The elasticsearch-* agent image preinstalls both Node.js and archimedes;
# the pre-command hook activates that baked runtime and injects secrets when
# USE_ARCHIMEDES=true.
#
# Supported workflows:
#   test-analysis           — analyse a test-failure issue        (needs ISSUE_URL)
#   bug-analysis            — analyse a bug issue                 (needs ISSUE_URL)
#   review-test-analysis    — grade a prior analysis after close  (needs ISSUE_URL)
#   review-bug-analysis     — grade a prior bug analysis on close (needs ISSUE_URL)
#   pull-request-fix        — self-heal a failing pull request    (needs PR_URL)
#   pull-request-creation   — implement a task and open a PR      (needs ISSUE_URL)
#   lucene-merge-conflicts  — merge main → lucene_snapshot_*      (needs TARGET_BRANCH)
#                             Daily lucene-snapshot/update-branch.yml (on main,
#                             TARGET_BRANCH=lucene_snapshot_11) triggers this.
#                             The lucene_snapshot schedule still uses the old merge.
#                             Clean + compile-green: push to the snapshot branch.
#                             Agent edits: open a PR.
#   lucene-snapshot-update  — bump lucene_snapshot_* to a new Lucene snapshot
#                             (needs TARGET_BRANCH + LUCENE_SNAPSHOT_VERSION).
#                             Daily lucene-snapshot/build-snapshot.yml (on main,
#                             TARGET_BRANCH=lucene_snapshot_11) triggers this.
#                             Green compile: push. Compile-fix: open a PR.
#
# Trigger from the UI (fill the input step) or via the Buildkite API with the
# vars pre-set so the input step is skipped, e.g.:
#   curl -X POST ".../pipelines/elasticsearch-agentic-workflow/builds" \
#     -H "Authorization: Bearer $BUILDKITE_API_TOKEN" \
#     -d '{"branch":"main","env":{
#            "WORKFLOW":"test-analysis",
#            "ISSUE_URL":"https://github.com/elastic/elasticsearch/issues/150989"}}'
#
# archimedes now comes from the preinstalled agent image distribution added in
# elastic/ci-agent-images@2f818101b1310722e0e76b03536dadf02663a7a1. This
# production pipeline intentionally does no runtime bootstrap of Node.js or
# archimedes, so unreleased archimedes testing must happen on a separate
# non-production pipeline without production credentials. See
# https://github.com/elastic/elasticsearch/issues/159040.

# Surface trigger vars at pipeline level so env() in step `if` conditions can
# see them on API-triggered builds.
#
# The CI agent configuration the archimedes step runs on is overridable via the
# ARCHIMEDES_AGENT_* trigger vars (image/machine type/disk type), defaulting to
# the standard elasticsearch-ubuntu-2404 / n4-standard-4 orchestrator shape.
# lucene-merge-conflicts and lucene-snapshot-update compile in-process, so they
# default to n4-standard-16 (not the analysis-shaped 4). They share
# concurrency_group archimedes-lucene/${TARGET_BRANCH} so a bump and a merge
# cannot both push lucene_snapshot_* at once; the later job waits.
env:
  WORKFLOW:                                "${WORKFLOW:-}"
  ISSUE_URL:                               "${ISSUE_URL:-}"
  PR_URL:                                  "${PR_URL:-}"
  TARGET_BRANCH:                           "${TARGET_BRANCH:-}"
  LUCENE_SNAPSHOT_VERSION:                 "${LUCENE_SNAPSHOT_VERSION:-}"
  LUCENE_SHA:                              "${LUCENE_SHA:-}"
  ARCHIMEDES_TRIAGE_MODE:                  "${ARCHIMEDES_TRIAGE_MODE:-}"
  ARCHIMEDES_AGENT_IMAGE:                  "${ARCHIMEDES_AGENT_IMAGE:-family/elasticsearch-ubuntu-2404}"
  ARCHIMEDES_AGENT_MACHINE_TYPE:           "${ARCHIMEDES_AGENT_MACHINE_TYPE:-n4-standard-4}"
  ARCHIMEDES_LUCENE_MERGE_MACHINE_TYPE:    "${ARCHIMEDES_LUCENE_MERGE_MACHINE_TYPE:-n4-standard-16}"
  ARCHIMEDES_LUCENE_SNAPSHOT_MACHINE_TYPE: "${ARCHIMEDES_LUCENE_SNAPSHOT_MACHINE_TYPE:-n4-standard-16}"
  ARCHIMEDES_AGENT_DISK_TYPE:              "${ARCHIMEDES_AGENT_DISK_TYPE:-hyperdisk-balanced}"

steps:
  # ── Run archimedes ───────────────────────────────────────────────────────────
  - label: ":robot_face: Archimedes — :workflow:"
    key: archimedes-run
    if: build.env("WORKFLOW") != "lucene-merge-conflicts" && build.env("WORKFLOW") != "lucene-snapshot-update"
    timeout_in_minutes: 60
    env:
      USE_ARCHIMEDES: "true"
      ARCHIMEDES_SESSION_DIR: "/tmp/archimedes-sessions"
    agents:
      provider:       gcp
      # Agent config is overridable via the ARCHIMEDES_AGENT_* trigger vars (see
      # the pipeline-level env block). Defaults: the archimedes-run agent is an
      # I/O-bound orchestrator (LLM/gh/git calls); it does NOT build Elasticsearch
      # — reproduction runs on its own n4-standard-64 job. 4 vCPU is plenty; the
      # full-history mirror checkout is the only heavy step.
      image:          "${ARCHIMEDES_AGENT_IMAGE}"
      machineType:    "${ARCHIMEDES_AGENT_MACHINE_TYPE}"
      diskType:       "${ARCHIMEDES_AGENT_DISK_TYPE}"
      buildDirectory: /dev/shm/bk
    retry:
      automatic:
        - exit_status: "*"
          limit: 1
    # Single entry point: `archimedes ci` owns the whole CI envelope — input
    # validation, session download/upload (spot-preemption resume), the in-process
    # sandbox, dispatch to the analyze/fix-pr/create workflow, and the start/finish
    # progress annotations. It reads WORKFLOW/ISSUE_URL/PR_URL from the step env
    # (set above), so no YAML interpolation is needed. This is all a consuming
    # repo (e.g. elasticsearch-serverless) needs beyond activating the baked
    # archimedes runtime.
    command: archimedes ci

  # lucene-merge-conflicts compiles in-process (unlike analysis, which fans out
  # reproduction). Worst case is resolve 20 + compile 50 + compile-fix 50 plus
  # prepare/finish/checkout; 150 covers that. Machine type defaults to
  # n4-standard-16 so a manual New Build does not land on the analysis-shaped 4.
  # concurrency_group serializes daily + manual runs for the same snapshot branch
  # (two in-flight jobs can both push before either opens a PR). Retry is agent
  # loss only — a 150-minute compile should not re-run a real failure.
  - label: ":robot_face: Archimedes — lucene-merge-conflicts"
    key: archimedes-lucene-merge
    if: build.env("WORKFLOW") == "lucene-merge-conflicts"
    timeout_in_minutes: 150
    concurrency: 1
    concurrency_group: "archimedes-lucene/${TARGET_BRANCH}"
    env:
      USE_ARCHIMEDES: "true"
      ARCHIMEDES_SESSION_DIR: "/tmp/archimedes-sessions"
    agents:
      provider:       gcp
      image:          "${ARCHIMEDES_AGENT_IMAGE}"
      machineType:    "${ARCHIMEDES_LUCENE_MERGE_MACHINE_TYPE}"
      diskType:       "${ARCHIMEDES_AGENT_DISK_TYPE}"
      buildDirectory: /dev/shm/bk
    retry:
      automatic:
        - exit_status: "-1"
          signal_reason: none
          limit: 1
        - signal_reason: agent_stop
          limit: 1
    command: archimedes ci

  # lucene-snapshot-update compiles in-process. Worst case is prepare (incl.
  # verification-metadata gradle) + compile 50 + compile-fix 50; 150 covers that.
  # Machine type defaults to n4-standard-16 so a manual New Build does not land
  # on the analysis-shaped 4. Shares concurrency_group with lucene-merge-conflicts
  # (the later job waits; it is not skipped). Retry is agent loss only.
  - label: ":robot_face: Archimedes — lucene-snapshot-update"
    key: archimedes-lucene-snapshot-update
    if: build.env("WORKFLOW") == "lucene-snapshot-update"
    timeout_in_minutes: 150
    concurrency: 1
    concurrency_group: "archimedes-lucene/${TARGET_BRANCH}"
    env:
      USE_ARCHIMEDES: "true"
      ARCHIMEDES_SESSION_DIR: "/tmp/archimedes-sessions"
    agents:
      provider:       gcp
      image:          "${ARCHIMEDES_AGENT_IMAGE}"
      machineType:    "${ARCHIMEDES_LUCENE_SNAPSHOT_MACHINE_TYPE}"
      diskType:       "${ARCHIMEDES_AGENT_DISK_TYPE}"
      buildDirectory: /dev/shm/bk
    retry:
      automatic:
        - exit_status: "-1"
          signal_reason: none
          limit: 1
        - signal_reason: agent_stop
          limit: 1
    command: archimedes ci

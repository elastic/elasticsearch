---
# yaml-language-server: $schema=https://raw.githubusercontent.com/buildkite/pipeline-schema/main/schema.json
#
# elasticsearch-agentic-workflow
#
# On-demand agentic CI workflows powered by the self-contained archimedes CLI
# (https://github.com/elastic/elasticsearch-infra, archimedes/). archimedes runs
# directly on the agent — no remote pipeline trigger and no agent config in this
# repo. The elasticsearch-* agent image preinstalls both Node.js and archimedes;
# the pre-command hook activates that baked runtime and injects secrets when
# USE_ARCHIMEDES=true.
#
# Supported workflows:
#   test-analysis           — analyse a test-failure issue        (needs ISSUE_URL)
#   bug-analysis            — analyse a bug issue                 (needs ISSUE_URL)
#   review-test-analysis    — grade a prior analysis after close  (needs ISSUE_URL)
#   review-bug-analysis     — grade a prior bug analysis on close (needs ISSUE_URL)
#   pull-request-fix        — self-heal a failing pull request    (needs PR_URL)
#   pull-request-creation   — implement a task and open a PR      (needs ISSUE_URL)
#
# Trigger from the UI (fill the input step) or via the Buildkite API with the
# vars pre-set so the input step is skipped, e.g.:
#   curl -X POST ".../pipelines/elasticsearch-agentic-workflow/builds" \
#     -H "Authorization: Bearer $BUILDKITE_API_TOKEN" \
#     -d '{"branch":"main","env":{
#            "WORKFLOW":"test-analysis",
#            "ISSUE_URL":"https://github.com/elastic/elasticsearch/issues/150989"}}'
#
# archimedes now comes from the preinstalled agent image distribution added in
# elastic/ci-agent-images@2f818101b1310722e0e76b03536dadf02663a7a1. This
# production pipeline intentionally does no runtime bootstrap of Node.js or
# archimedes, so unreleased archimedes testing must happen on a separate
# non-production pipeline without production credentials. See
# https://github.com/elastic/elasticsearch/issues/159040.

# Surface trigger vars at pipeline level so env() in step `if` conditions can
# see them on API-triggered builds.
env:
  WORKFLOW:                "${WORKFLOW:-}"
  ISSUE_URL:               "${ISSUE_URL:-}"
  PR_URL:                  "${PR_URL:-}"
  ARCHIMEDES_TRIAGE_MODE:  "${ARCHIMEDES_TRIAGE_MODE:-}"

steps:
  # ── Run archimedes ───────────────────────────────────────────────────────────
  - label: ":robot_face: Archimedes — review graph acceptance"
    key: archimedes-run
    timeout_in_minutes: 60
    env:
      USE_ARCHIMEDES: "true"
      ARCHIMEDES_SESSION_DIR: "/tmp/archimedes-sessions"
    agents:
      provider:       gcp
      image:          family/elasticsearch-ubuntu-2404
      # The archimedes-run agent is an I/O-bound orchestrator (LLM/gh/git calls); it does
      # NOT build Elasticsearch — reproduction runs on its own n4-standard-64 job.
      # 4 vCPU is plenty; the full-history mirror checkout is the only heavy step.
      machineType:    n4-standard-4
      diskType:       hyperdisk-balanced
      buildDirectory: /dev/shm/bk
    retry:
      automatic:
        - exit_status: "*"
          limit: 1
    # Dedicated acceptance branch: use the installed graph launcher with comments
    # disabled. Trigger this pipeline on this branch with ISSUE_URL set to a
    # closed Elasticsearch issue that received a prior test-analysis comment.
    # Optional ARCHIMEDES_ACCEPTANCE_GH_TOKEN overrides the hook's admin token
    # after secret provisioning; supply a SAML-authorized read-only token.
    # Double dollars defer expansion until job execution, after pre-command.
    command: |
      set -euo pipefail
      : "$${ISSUE_URL:?Set ISSUE_URL to the closed issue to review}"

      bin="$$(readlink -f "$$(command -v archimedes)")"
      runtime="$$(dirname "$$(dirname "$$bin")")"

      unset ARCHIMEDES_PROVIDER ARCHIMEDES_MODEL
      unset ARCHIMEDES_FALLBACK ARCHIMEDES_FALLBACKS

      if [[ -n "$${ARCHIMEDES_ACCEPTANCE_GH_TOKEN:-}" ]]; then
        export GH_TOKEN="$$ARCHIMEDES_ACCEPTANCE_GH_TOKEN"
        unset ARCHIMEDES_ACCEPTANCE_GH_TOKEN
      fi

      node "$$runtime/workflows/review-test-analysis/graph/ci-acceptance.mjs" \
        --issue-url "$$ISSUE_URL" \
        --checkout-dir "$$BUILDKITE_BUILD_CHECKOUT_PATH" \
        --run-dir "/tmp/archimedes-review-acceptance-$$BUILDKITE_JOB_ID-$${BUILDKITE_RETRY_COUNT:-0}"

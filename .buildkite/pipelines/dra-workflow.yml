steps:
  - label: ":package: Build and stage elasticsearch"
    key: dra-prep
    command: .buildkite/scripts/dra-workflow.sh
    env:
      USE_MAVEN_GPG: "true"
      USE_MAVEN_S3_CREDENTIALS: "true"
      USE_PROD_DOCKER_CREDENTIALS: "true"
    agents:
      provider: gcp
      image: family/elasticsearch-ubuntu-2204
      machineType: custom-32-98304
      localSsds: 1
      localSsdInterface: nvme
      diskSizeGb: 350
    plugins:
      - elastic/dra-prep#v0.1.6:
          product_id: elasticsearch
          stack_version: set-at-runtime
          workflow: "${DRA_WORKFLOW:-snapshot}"
  # The hadoop build depends on the ES artifact
  # So let's trigger the hadoop build any time we build a new staging artifact
  - trigger: elasticsearch-hadoop-dra-workflow
    async: true
    depends_on: dra-prep
    build:
      branch: "${BUILDKITE_BRANCH}"
      env:
        DRA_WORKFLOW: staging
        USE_PROD_DOCKER_CREDENTIALS: "true"
    if: build.env('DRA_WORKFLOW') == 'staging'

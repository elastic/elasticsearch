steps:
  - label: Require lucene_snapshot branch
    command: |
      if [[ "${BUILDKITE_BRANCH}" != lucene_snapshot* ]]; then
        echo "This pipeline only runs on lucene_snapshot* branches (got ${BUILDKITE_BRANCH})"
        exit 1
      fi
    timeout_in_minutes: 5
  - wait
  - trigger: "elasticsearch-agentic-workflow"
    label: ":robot_face: lucene-merge-conflicts"
    async: false
    build:
      message: "lucene-merge-conflicts: main → ${BUILDKITE_BRANCH}"
      branch: "main"
      env:
        WORKFLOW: "lucene-merge-conflicts"
        TARGET_BRANCH: "${BUILDKITE_BRANCH}"
        # compileJava / compileTestJava / spotless run on this agent, not a
        # forked n4-standard-64 reproduction job.
        ARCHIMEDES_AGENT_MACHINE_TYPE: "n4-standard-16"

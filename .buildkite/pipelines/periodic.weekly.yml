steps:
  - group: ipv6-tests
    steps:
      - label: "{{matrix.GRADLE_TASK}} / ipv6-tests"
        command: .ci/scripts/run-gradle.sh --continue -Djava.net.preferIPv6Addresses=true -Dbwc.checkout.align=true -Dorg.elasticsearch.build.cache.push=true -Dignore.tests.seed -Dscan.capture-file-fingerprints {{matrix.GRADLE_TASK}}
        timeout_in_minutes: 300
        agents:
          provider: aws
          imagePrefix: elasticsearch-aws-ubuntu-2404-nvidia
          instanceType: m7a.8xlarge
          diskSizeGb: 150
          diskType: gp3
          diskName: /dev/sda1
          buildDirectory: /dev/shm/bk
          ipv6Only: true
        env:
          GRADLE_TASK: "{{matrix.GRADLE_TASK}}"
          JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv6Addresses=true"
          _JAVA_OPTIONS: "-Djava.net.preferIPv6Addresses=true"
          USE_IPV6_TESTING: "true"
        matrix:
          setup:
            GRADLE_TASK:
              - checkPart1
              - checkPart2
              - checkPart3
              - checkPart4
              - checkPart5
              - checkPart6
  # Fails on ESQL golden test version labels that fell below the compatibility floor, so the
  # cleanup gets auto-filed instead of accumulating. See x-pack/plugin/esql/src/test/java/org/
  # elasticsearch/xpack/esql/optimizer/GoldenTestsReadme.MD, "Failure cheat-sheet".
  - label: esql-golden-tests-gc-sweep
    command: .ci/scripts/run-gradle.sh :x-pack:plugin:esql:test --tests "*GoldenTests" -Dgolden.gc.strict=true
    timeout_in_minutes: 120
    agents:
      provider: gcp
      image: family/elasticsearch-ubuntu-2404
      diskSizeGb: 350
      machineType: custom-32-98304

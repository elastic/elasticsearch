# Schedule and pipeline registration live in catalog-info.yaml.
# Shared release/runtime defaults: .buildkite/scripts/promcheck-common.sh.
env:
  PROMCHECK_RESULTS_URL: https://overview-elastic-cloud-com.es.us-east-1.aws.found.io
  PROMCHECK_RESULTS_NAMESPACE: experimental
  PROMCHECK_RESULTS_SECRET: secret/ci/elastic-elasticsearch/promcheck-results
steps:
  - label: prometheus-nightly
    key: prometheus-nightly
    command: .buildkite/scripts/prometheus-nightly.sh
    timeout_in_minutes: 120
    artifact_paths:
      - "/tmp/prometheus-nightly-output/*"
    agents:
      provider: gcp
      image: family/elasticsearch-ubuntu-2404
      machineType: n1-standard-8
      docker: "true"
      diskType: pd-ssd
      buildDirectory: /dev/shm/bk

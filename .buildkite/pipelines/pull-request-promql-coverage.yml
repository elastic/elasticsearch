# Compares PromQL compliance with Prometheus between a pull request and its merge base. The pull request pipeline
# triggers it for PRs labelled :StorageEngine/PromQL, and the build bot posts the report as a PR comment.
env:
  PROMCHECK_VER: "0.9.1+prometheus-3.13.1"
  PROMCHECK_TEST_INSTANCE_TIMEOUT: "900"
steps:
  - label: validate-promql-coverage
    key: validate-promql-coverage
    command: .buildkite/scripts/validate-promql-coverage.sh
    timeout_in_minutes: 120
    retry:
      automatic:
        - exit_status: -1
          limit: 2
        - exit_status: 137
          limit: 2
    artifact_paths:
      - "/tmp/validate-promql-coverage-output/*"
    agents:
      provider: gcp
      image: family/elasticsearch-ubuntu-2404
      machineType: n1-standard-8
      docker: "true"
      diskType: pd-ssd
      buildDirectory: /dev/shm/bk

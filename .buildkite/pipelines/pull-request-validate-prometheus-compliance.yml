# Reuses the existing promcheck pipeline and its permissions. Schedules run nightly;
# other builds compare a PR, unless PROMCHECK_MODE=nightly is explicitly requested.
env:
  PROMCHECK_VER: "0.11.0+prometheus-3.13.1"
  PROMCHECK_TEST_INSTANCE_TIMEOUT: "900"
  PROMCHECK_CORPUS: grafanalabs-top100
steps:
  # The PR build bot posts this note before the comparison finishes.
  - label: notify
    key: notify
    if: build.source != "schedule" && build.env("PROMCHECK_MODE") != "nightly"
    command: .buildkite/scripts/validate-prometheus-compliance.sh notify
  - label: validate-prometheus-compliance
    key: validate-prometheus-compliance
    if: build.source != "schedule" && build.env("PROMCHECK_MODE") != "nightly"
    command: .buildkite/scripts/validate-prometheus-compliance.sh
    timeout_in_minutes: &promcheck-timeout 120
    retry:
      automatic:
        - exit_status: -1
          limit: 2
        - exit_status: 137
          limit: 2
    artifact_paths:
      - "/tmp/validate-prometheus-compliance-output/*"
    agents: &promcheck-agents
      provider: gcp
      image: family/elasticsearch-ubuntu-2404
      machineType: n1-standard-8
      docker: "true"
      diskType: pd-ssd
      buildDirectory: /dev/shm/bk
  - label: elastic / prometheus / nightly
    key: prometheus-nightly
    if: build.source == "schedule" || build.env("PROMCHECK_MODE") == "nightly"
    command: .buildkite/scripts/prometheus-nightly.sh
    timeout_in_minutes: *promcheck-timeout
    artifact_paths:
      - "/tmp/prometheus-nightly-output/*"
    env:
      PROMCHECK_RESULTS_URL: https://overview-elastic-cloud-com.es.us-east-1.aws.found.io
      PROMCHECK_RESULTS_NAMESPACE: experimental
      PROMCHECK_RESULTS_SECRET: secret/ci/elastic-elasticsearch/promcheck-results
    agents: *promcheck-agents

# Detects mismatches between Prometheus and Elasticsearch on a pull request and its merge base. Runs standalone:
# a 'buildkite run promcheck' PR comment triggers it (see .buildkite/pull-requests.json), and the build
# bot posts the report as a PR comment when this build ends.
env:
  PROMCHECK_VER: "0.11.0+prometheus-3.13.1"
  PROMCHECK_TEST_INSTANCE_TIMEOUT: "900"
steps:
  - label: validate-prometheus-compliance
    key: validate-prometheus-compliance
    command: .buildkite/scripts/validate-prometheus-compliance.sh
    timeout_in_minutes: 120
    retry:
      automatic:
        - exit_status: -1
          limit: 2
        - exit_status: 137
          limit: 2
    artifact_paths:
      - "/tmp/validate-prometheus-compliance-output/*"
    agents:
      provider: gcp
      image: family/elasticsearch-ubuntu-2404
      machineType: n4-standard-16
      docker: "true"
      diskType: hyperdisk-balanced
      buildDirectory: /dev/shm/bk

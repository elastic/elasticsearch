config:
  skip-labels:
    - ">test-mute"
    - ":Delivery/Packaging"
  # Only run for changes that can affect the packages. Otherwise this sample runs in the merge queue (see
  # .buildkite/scripts/merge-queue/pipeline.ts); the full matrices run with :Delivery/Packaging and in periodic-packaging.
  any-included-regions:
    - ^distribution/.*
    - ^qa/packaging/.*
    - ^\.ci/scripts/packaging-test\..*
    - ^\.buildkite/pipelines/pull-request/packaging-.*
    # Security auto-configuration and the certificate tools are exercised by the packaging tests
    - ^x-pack/plugin/security/cli/.*
    # Bundled JDK version
    - ^build-tools-internal/version\.properties$
    - ^build-tools/src/main/java/org/elasticsearch/gradle/(Distribution|ElasticsearchDistribution).*
    - ^build-tools/src/main/java/org/elasticsearch/gradle/distribution/.*
    - ^build-tools-internal/src/main/java/org/elasticsearch/gradle/internal/(distribution|docker)/.*
    - ^build-tools-internal/src/main/java/org/elasticsearch/gradle/internal/(DistributionArchive|DockerBase|InternalDistribution|Jdk|SymbolicLinkPreservingTar).*
    - ^build-tools-internal/src/main/java/org/elasticsearch/gradle/internal/test/DistroTestPlugin\.java$
steps:
  - group: packaging-tests-unix-sample
    steps:
      - label: "{{matrix.image}} / {{matrix.PACKAGING_TASK}} / packaging-tests-unix-sample"
        key: "packaging-tests-unix-sample"
        command: ./.ci/scripts/packaging-test.sh $$PACKAGING_TASK
        timeout_in_minutes: 300
        matrix:
          setup:
            image:
              - rhel-8
              - ubuntu-2404
            PACKAGING_TASK:
              - destructiveDistroTest.docker
              - destructiveDistroTest.packages
              - destructiveDistroTest.archives
        agents:
          provider: gcp
          image: family/elasticsearch-{{matrix.image}}
          diskSizeGb: 350
          machineType: n4-standard-8
          diskType: hyperdisk-balanced
          preemptible: true
          spotZones: "asia-south2-a,asia-south2-b,asia-south2-c,europe-west2-a,europe-west2-b,europe-west2-c,northamerica-northeast2-b,northamerica-northeast2-c,southamerica-east1-a,southamerica-east1-b,southamerica-east1-c"
        env:
          PACKAGING_TASK: "{{matrix.PACKAGING_TASK}}"

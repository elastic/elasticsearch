name: release-notes
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review, converted_to_draft]
  push:
    branches: [main]
permissions: {}
jobs:
  release-notes:
    permissions:
      contents: read
      id-token: write
      pull-requests: read
      packages: read
    uses: elastic/docs-actions/.github/workflows/release-notes.yml@v1
    with:
      # Fail breaking-change PRs whose description or changelog entry lacks Impact and Action.
      require-impact-action: true
      # Skip the checks and the PR comment on drafts. Needs ready_for_review above.
      skip-drafts: true

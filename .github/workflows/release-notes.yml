name: Release notes

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches: [main]

permissions: {}

jobs:
  release-notes:
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    uses: elastic/docs-actions/.github/workflows/release-notes.yml@v1

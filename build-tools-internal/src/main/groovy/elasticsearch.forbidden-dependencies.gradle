// we do not want any of these dependencies on the compilation classpath
// because they could then be used within Elasticsearch
List<String> FORBIDDEN_DEPENDENCY_GROUPS = [
  'com.google.guava'
]

Closure checkDeps = { Configuration configuration, List<String> forbiddenGroups ->
  configuration.resolutionStrategy.eachDependency {
    if (forbiddenGroups.contains(it.target.group)) {
      throw new GradleException("Dependency '${it.target.group}:${it.target.name}' on configuration '${configuration.name}' is not allowed. " +
        "If it is needed as a transitive dependency, try adding it to the runtime classpath")
    }
  }
}

subprojects {
  if (project.path.startsWith(':test:fixtures:') || project.path.equals(':build-tools')) {
    // fixtures are allowed to use whatever dependencies they want...
    return
  }
  pluginManager.withPlugin('java') {
    List<String> forbiddenGroups = FORBIDDEN_DEPENDENCY_GROUPS
    if (project.path in [':x-pack:plugin:esql-datasource-gcs', ':qa:vector']) {
      // google-cloud-storage signatures carry checker-framework @NonNull type annotations on Guava types.
      // JDK 25 javac requires those classes on the compile classpath to attach the annotations, so Guava is
      // allowed at compile time here. These modules still must not use Guava directly.
      // repository-gcs instead adds Guava to the javac classpath via a detached configuration (see its
      // build.gradle), keeping it off the compile-classpath configuration so the ban below still applies.
      forbiddenGroups = forbiddenGroups - 'com.google.guava'
    }
    checkDeps(configurations.compileClasspath, forbiddenGroups)
    checkDeps(configurations.testCompileClasspath, forbiddenGroups)
  }
}

import org.elasticsearch.gradle.internal.run.InternalRunPlugin
import org.elasticsearch.gradle.internal.run.RunTask

project.pluginManager.apply(InternalRunPlugin)

tasks.register("run", RunTask) {
  description = 'Runs elasticsearch in the foreground'
  group = 'Verification'
  impliesSubProjects = true

  setting 'xpack.security.enabled', 'true'
  // Not enabled by default in the build, otherwise all integration tests will download the databases from our geoip download service:
  systemProperty 'ingest.geoip.downloader.enabled.default', 'true'
  keystore 'bootstrap.password', 'password'
  keystore 'cluster.state.encryption.password.local-dev', 'local-dev-password'
  keystore 'cluster.state.encryption.active_password_id', 'local-dev'
  user username: 'elastic-admin', password: 'elastic-password', role: '_es_test_root'
  jvmArgs(
    // Arrow memory allocator needs access to java.nio internals
    '--add-opens=java.base/java.nio=ALL-UNNAMED',
    // UninitializedArrays needs reflective access to jdk.internal.misc.Unsafe
    '--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED'
  )
}

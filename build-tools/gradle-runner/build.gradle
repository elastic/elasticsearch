plugins {
  id 'java'
  id 'groovy'
  id 'elasticsearch.versions'
  id 'elasticsearch.formatting'
}

group = "org.elasticsearch.gradle"
version = versions.getProperty("elasticsearch")

java {
  targetCompatibility = versions.get("minimumRuntimeJava")
  sourceCompatibility = versions.get("minimumRuntimeJava")
}

repositories {
  mavenCentral()
  maven {
    url = "https://repo.gradle.org/gradle/libs-releases"
  }
}

dependencies {
  implementation "org.gradle:gradle-tooling-api:9.5.0"
  implementation buildLibs.jackson.core

  testImplementation localGroovy()
  testImplementation platform(buildLibs.spock.platform)
  testImplementation(buildLibs.spock.core) {
    exclude module: "groovy"
  }
  testImplementation platform(buildLibs.junit.platform)
  testImplementation buildLibs.junit.jupiter
  testRuntimeOnly buildLibs.junit.vintage
  testRuntimeOnly buildLibs.junit.platform.launcher
}

/**
 * Passes absolute paths to the test JVM without making them task inputs. As regular system properties they would
 * be part of the build cache key, which then differs for every checkout location.
 */
class NonInputPathsArgumentProvider implements CommandLineArgumentProvider {
  private final Provider<RegularFile> runnerJar
  private final File rootProjectDir

  NonInputPathsArgumentProvider(Provider<RegularFile> runnerJar, File rootProjectDir) {
    this.runnerJar = runnerJar
    this.rootProjectDir = rootProjectDir
  }

  @Override
  Iterable<String> asArguments() {
    return [
      "-Drunner.jar=${runnerJar.get().asFile.absolutePath}".toString(),
      "-Droot.project.dir=${rootProjectDir.absolutePath}".toString()
    ]
  }
}

tasks.named('test') {
  useJUnitPlatform()
  // The test runs the runner JAR as a subprocess against the real repo
  def runnerJar = tasks.named('jar').flatMap { it.archiveFile }
  inputs.files(runnerJar).withPropertyName('runnerJar').withPathSensitivity(PathSensitivity.NAME_ONLY)
  jvmArgumentProviders.add(new NonInputPathsArgumentProvider(runnerJar, rootProject.projectDir.parentFile))
  // The specs run Gradle and CI scripts against the whole Elasticsearch checkout, none of which is a declared input.
  // A cached result could therefore be reused for a checkout with different build logic, so never cache it.
  outputs.doNotCacheIf('Runs against the whole Elasticsearch checkout, which is not a declared input') { true }
}

tasks.named("jar").configure {
  archiveFileName = "${project.name}.jar"
  manifest {
    attributes 'Main-Class': 'org.elasticsearch.gradle.runner.GradleRunner'
  }
  from {
    configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
  }
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

import org.elasticsearch.gradle.internal.distribution.BundledJdkPlatforms
import org.elasticsearch.gradle.internal.distribution.TokenExpansions

apply plugin: 'elasticsearch.internal-distribution-archive-setup'

// must match the bundled JDKs registered in :distribution, see BundledJdkPlatforms
boolean darwinX64Supported = BundledJdkPlatforms.isSupported('darwin', 'x64', BundledJdkPlatforms.bundledJdkMajor(buildParams))

CopySpec archiveFiles(String distributionType, String os, String architecture, boolean isTestDistro) {
  return copySpec {
    into("elasticsearch-${version}") {
      into('lib') {
        with esDistributionLayout.lib(os, architecture, true)
      }
      into('config') {
        dirPermissions {
          unix 0750
        }
        filePermissions {
          unix 0660
        }
        with esDistributionLayout.config(distributionType, isTestDistro)
        from {
          dirPermissions {
            unix 0750
          }
          jvmOptionsDir.getParent()
        }
      }
      into('bin') {
        with esDistributionLayout.bin(distributionType, isTestDistro)
      }
      into("darwin".equals(os) ? 'jdk.app' : 'jdk') {
        if (isTestDistro == false) {
          with esDistributionLayout.jdk(os, architecture)
        }
      }
      into('') {
        from {
          dirPermissions {
            unix 0755
          }
          logsDir.getParent()
        }
      }
      into('') {
        from {
          dirPermissions {
            unix 0755
          }
          pluginsDir.getParent()
        }
      }
      from(layout.settingsDirectory.asFile) {
        filePermissions {
          unix(0644)
        }
        include 'README.asciidoc'
      }
      from(layout.settingsDirectory.file('licenses').asFile) {
        include TokenExpansions.licenseFileName(isTestDistro)
        filePermissions {
          unix(0644)
        }
        rename { 'LICENSE.txt' }
      }

      with esDistributionLayout.notice(isTestDistro)
      into('modules') {
        if (isTestDistro) {
          with esDistributionLayout.integTestModules()
        } else {
          with esDistributionLayout.modules(os, architecture)
        }
      }
    }
  }
}

distribution_archives {
  integTestZip {
    content {
      archiveFiles('zip', null, null, true)
    }
  }

  windowsZip {
    archiveClassifier = 'windows-x86_64'
    content {
      archiveFiles('zip', 'windows', 'x64', false)
    }
  }

  if (darwinX64Supported) {
    darwinTar {
      archiveClassifier = 'darwin-x86_64'
      content {
        archiveFiles('tar', 'darwin', 'x64', false)
      }
    }
  }

  darwinAarch64Tar {
    archiveClassifier = 'darwin-aarch64'
    content {
      archiveFiles('tar', 'darwin', 'aarch64', false)
    }
  }

  linuxAarch64Tar {
    archiveClassifier = 'linux-aarch64'
    content {
      archiveFiles('tar', 'linux', 'aarch64', false)
    }
  }

  linuxTar {
    archiveClassifier = 'linux-x86_64'
    content {
      archiveFiles('tar', 'linux', 'x64', false)
    }
  }
}

subprojects {
  apply plugin: 'distribution'
  if (it.name != 'darwin-tar' || darwinX64Supported) {
    apply plugin: 'elasticsearch.internal-distribution-archive-check'
  }

  group = "org.elasticsearch.distribution.default"
}

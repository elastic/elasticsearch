pr: 147289
summary: Change ES|QL time-series aggregate windows from future-looking to past-looking samples, matching common analytics behavior and helping visualization tools avoid cutoffs at the end of charts
type: bug
highlight:
  notable: true
  title: ES|QL window functions now use trailing semantics instead of following
  body: |-
    ES|QL time-series aggregations now use trailing (past-looking) windows instead of forward-looking
    ones. This is a breaking change that aligns ES|QL with common observability semantics and removes
    reliance on future samples.

    Results may differ from previous versions, but are now easier to interpret and avoid chart cutoffs
    or missing values at the end of time ranges in visualization tools.

area: TSDB
highlight:
  body: |-
    ## Summary

    Add `IndexMode.TSDB` as a new, first-class enum value that behaves
    identically to `TIME_SERIES` (delegates every overridden method), so
    `index.mode: tsdb` is now accepted anywhere `index.mode: time_series` is
    — without renaming or changing anything about existing `time_series`
    indices, which keep emitting/persisting exactly as before (`time_series`
    remains the canonical output string; `tsdb` is a preferred alias).

  notable: true
  title: Add `IndexMode.TSDB` as a preferred alias for TIME_SERIES

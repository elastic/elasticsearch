pr: 154825
summary: Validate `deployment_id` (and `model_id` used as its default) against character-id
  rules when starting a trained model deployment
area: Machine Learning
type: breaking
breaking:
  area: REST API
  title: Validate `deployment_id` against character-id rules when starting a trained model deployment
  details: "Starting a trained model deployment now validates `deployment_id` the same way `model_id`\
    \ is validated, using `MlStrings.isValidId` (a leading `.` and trailing `_SNAPSHOT`\
    \ are tolerated for packaged/default models, mirroring `model_id` validation). Previously\
    \ no such validation was applied to `deployment_id`."
  impact: "Calls to the start trained model deployment API with a `deployment_id` (or a `model_id`\
    \ used as the default `deployment_id`) that does not satisfy `MlStrings.isValidId` will now\
    \ be rejected with a validation error instead of being accepted."
  notable: false
issues: []

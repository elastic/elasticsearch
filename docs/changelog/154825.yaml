area: Machine Learning
breaking:
  area: REST API
  details: "Starting a trained model deployment now validates that `deployment_id`\
    \ (which defaults to `model_id`) is safe to use as a single filesystem path component:\
    \ it must not be empty, must not be `.` or `..`, and must not contain a `/` or\
    \ `\\` character or a NUL character. Both `/` and `\\` are rejected regardless\
    \ of the node's platform, since this validation runs cluster-wide and cannot depend\
    \ on which node handles the request. Unlike `model_id`, `deployment_id` is deliberately\
    \ not restricted to `model_id`'s lowercase-alphanumeric character set or its 64-character\
    \ length limit, so that existing inference endpoint ids used verbatim as `deployment_id`\
    \ keep working. Previously no such validation was applied to `deployment_id`."
  impact: "Calls to the start trained model deployment API with a `deployment_id`\
    \ (or a `model_id` used as the default `deployment_id`) that is empty, `.`, `..`,\
    \ or contains a `/` or `\\` character (on any platform) or a NUL character will\
    \ now be rejected with a validation error instead of being accepted. On Linux\
    \ and macOS in particular, `\\` was previously accepted as an ordinary character\
    \ in `deployment_id`/`model_id` and will now be rejected."
  notable: false
  title: Validate `deployment_id` for path safety when starting a trained model deployment

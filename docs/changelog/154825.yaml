pr: 154825
summary: "Default `xpack.ml.trained_models.sandbox_enabled` to false for staged 9.6\
  \ PyTorch inference sandboxing rollout, and validate `deployment_id` for path safety\
  \ when starting a trained model deployment"
area: Machine Learning
type: breaking
breaking:
  area: REST API
  title: Validate `deployment_id` for path safety when starting a trained model deployment
  details: "Starting a trained model deployment now validates that `deployment_id`\
    \ (which defaults to `model_id`) is safe to use as a single filesystem path\
    \ component: it must not be empty, must not be `.` or `..`, and must not contain\
    \ a path separator or NUL character. This is the same character-safety rule\
    \ already enforced where the isolated per-child IPC directory path is constructed.\
    \ Unlike `model_id`, `deployment_id` is deliberately not restricted to `model_id`'s\
    \ lowercase-alphanumeric character set or its 64-character length limit, so that\
    \ existing inference endpoint ids used verbatim as `deployment_id` keep working.\
    \ Previously no such validation was applied to `deployment_id`."
  impact: "Calls to the start trained model deployment API with a `deployment_id`\
    \ (or a `model_id` used as the default `deployment_id`) that is empty, `.`, `..`,\
    \ or contains a path separator or NUL character will now be rejected with a\
    \ validation error instead of being accepted."
  notable: false

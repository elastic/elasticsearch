area: Snapshot/Restore
deprecation:
  area: Cluster and node setting
  details: |-
    The Upgrade Assistant now reports S3 snapshot repositories that rely on deprecated, backwards-compatible client
    configuration. This includes endpoints without a URL scheme, a missing region (guessed from the endpoint or falling
    back to `us-east-1`), and a repository whose named S3 client cannot be resolved on the node.
  impact: |-
    Configure an explicit region and a scheme-prefixed endpoint on the S3 client, and ensure the repository's `client`
    setting names a client that exists on every node, before the next major release.
  title: Report deprecated S3 client configuration in the Upgrade Assistant
issues: []
pr: 159186
summary: Report deprecated S3 client configuration in the Upgrade Assistant
type: deprecation

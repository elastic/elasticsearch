area: TSDB
breaking:
  area: TSDB
  details: |-
    Elasticsearch introduces the minimum data stream lifecycle which performs only the operations
    that are necessary for the health of the data stream, such as rolling over and tail merge. It will be enabled
    for time series data streams that have no data stream lifecycle of their own and it will be effective only
    if an ILM policy is not configured or `prefer_ilm` is false. The behaviour is controlled by the new dynamic
    cluster setting `data_streams.lifecycle.minimum.enabled`, which defaults to `true`. Keep in mind, the minimum
    lifecycle does not apply operations that can change the data set, such as downsampling or retention.
  impact: |-
    Time series data streams that were previously left unmanaged will now be rolled over and tail merged by data stream
    lifecycle. Users who rely on these data streams never being rolled over automatically, for example because they roll
    them over by an external process, might see additional backing indices being created. Time series data streams that
    have an ILM policy and `index.lifecycle.prefer_ilm: false`, but no data stream lifecycle, move from ILM to the minimum
    lifecycle, so ILM phases such as delete or downsample stop running for them.
    To restore the previous behavior, set `data_streams.lifecycle.minimum.enabled` to `false`, for example
    `PUT _cluster/settings { "persistent": { "data_streams.lifecycle.minimum.enabled": false } }`.
    The setting is dynamic, so no restart is required.
  notable: false
  title: Time series data streams without a lifecycle are managed by a minimum data
    stream lifecycle
issues: []
pr: 161049
summary: Introduce the setting to enable minimum lifecycle
type: breaking

pr: 161562
summary: Read an external dataset's column the same way whoever supplied its type
area: ES|QL
type: bug
issues: []
breaking:
  area: ES|QL
  title: An external dataset column that cannot be read now follows the error mode
  details: >-
    A column whose type in a file cannot be read as the type a query uses was previously returned
    as nulls for its whole length, under every error mode, unless the dataset declared that
    column's type. It now follows the mode that was asked for. Under the default `fail_fast` the
    query fails naming the column and the file, where it previously returned a column of nulls and
    a warning. Under `skip_row` the file's rows are dropped, and under `null_field` the column is
    nulled as before. Separately, a column whose values the query's type can hold is now converted
    per value rather than nulled, so queries that returned nulls for a widened or narrowed column
    now return its values. Separately again, `esql.external.schema_max_fields` and a
    dataset's `schema_max_fields` now bound the schema a read resolves and nothing else. A read
    whose schema is already settled, by a declaration or by the first file under `first_file_wins`,
    resolves none: it reads a file's header or a sample of its fields only to locate that schema's
    columns, and is bounded by the widest schema the setting accepts rather than by its value. So a
    file with more columns than the cap allows is now read through a narrower settled schema, where
    a file reached under `first_file_wins` behind a narrower first file was refused. Where the
    schema was declared, a CSV or TSV file like that was read before as well, but with no bound at
    all on the header it read.
  impact: >-
    Queries over external datasets whose files disagree with the query's column types, or whose
    files drift from the first file under first-file-wins schema resolution, may now fail where
    they returned nulls and a warning. Setting the dataset's error mode to `null_field` keeps the
    previous null-filling behaviour. A file with more columns than
    `esql.external.schema_max_fields` allows, reached under `first_file_wins` behind a narrower
    first file, is now read rather than refused. In the other direction, a dataset that declares its
    columns over a CSV or TSV file with more columns than `esql.external.schema_max_fields` can be
    set to — 100,000 — is now refused, where the header it read was previously unbounded. Affects
    deployments where ES|QL federation is enabled.
  notable: false

area: Columnar
highlight:
  body: |-
    Indices in the `columnar` and `logsdb_columnar` index modes now store the doc values of
    `keyword`, `text` and `match_only_text` fields in a new columnar doc values format, which
    further reduces their storage footprint. The format is used by default for indices created
    on this version. Existing indices keep the format they were written with.

    To create an index without the new format, set the `index.columnar_codec.enabled` index
    setting to `false` when you create the index. To stop all new columnar indices in a cluster
    from using it, set the dynamic `cluster.columnar_codec.enabled` cluster setting to `false`.
    Neither setting changes indices that already exist.
  notable: true
  title: New doc values format for string fields in columnar indices
issues: []
pr: 161944
summary: Use the columnar doc values format by default in columnar index modes
type: feature

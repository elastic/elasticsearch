summary: "Fix full-text functions in `STATS ... WHERE` undercounting when grouped by a date bucket. Previously, a `MATCH`, `MATCH_PHRASE` or `:` filter in queries like `STATS COUNT(*) WHERE MATCH(message, \"error\") BY BUCKET(@timestamp, 1 hour)` could count too few matches, and some buckets returned 0."

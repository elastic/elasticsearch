highlight:
  notable: true
  title: ES|QL Data Federation is enabled by default in technical preview
  body: |-
    [{{esql}} Data Federation](/reference/query-languages/esql/esql-data-federation.md)
    is now enabled by default in technical preview on non-serverless deployments.
    To turn it off, set `esql.federation.enabled` to `false`. It requires an
    Enterprise or trial license.

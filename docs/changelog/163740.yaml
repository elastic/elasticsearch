pr: 163740
summary: "ESQL:DS: Enable federation by default"
area: ES|QL
type: enhancement
issues: []
highlight:
  notable: true
  title: ES|QL Data Federation is enabled by default
  body: |-
    ES|QL Data Federation is now enabled by default on stateful deployments. Set
    `esql.federation.enabled` to `false` to turn it off. An Enterprise or trial
    license is still required, and the feature remains unavailable on Windows.

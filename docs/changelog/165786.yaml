area: Authorization
breaking:
  area: Authorization
  details: "Field level security now always shows `@timestamp` on standalone `time_series`\
    \ indices and on data stream backing indices, in every index mode. A time series\
    \ index needs `@timestamp` to build the `_id` of its documents. For a data stream\
    \ backing index, showing `@timestamp` is a data stream policy. Failure store indices\
    \ are not affected. Standalone indices in other index modes, such as `logsdb`\
    \ and `logsdb_columnar`, are not affected. A role whose `grant` list does not\
    \ include `@timestamp` can now read it on these indices. A role whose `except`\
    \ list matches `@timestamp`, for example `@timestamp` or `@*`, can no longer read\
    \ these indices. When a user has several roles, a role that grants `@timestamp`\
    \ restores access. For an API key, the rule applies to the key and to its owner."
  impact: "Read requests, such as search, get and ES|QL, from roles and API keys whose\
    \ `except` list matches `@timestamp` fail with a security exception on these indices.\
    \ Background tasks that use these credentials, such as transforms, ML datafeeds\
    \ and watches, can fail too. To restore access, remove `@timestamp` from the `except`\
    \ list."
  notable: false
  title: Field level security always shows `@timestamp` on time series indices and
    data stream backing indices
issues: []
pr: 165786
summary: "Always show `@timestamp` under field level security on time series indices\
  \ and data stream backing indices, which fixes a wrong `_id` in search results and\
  \ an ES|QL `METADATA _id` failure for roles that hide it"
type: bug

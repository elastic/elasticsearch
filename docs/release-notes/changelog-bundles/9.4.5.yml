  - pr: 155279
    summary: |-
      When `number_of_replicas` is specified in the ILM `allocate` action, `auto_expand_replicas` is now explicitly removed from the index settings.
      Previously, if an index had `auto_expand_replicas` configured, this setting would remain in place even after the `allocate` action ran, overriding the specified `number_of_replicas` and causing the action to have no effect on the actual replica count.
      With this change, specifying `number_of_replicas` in an `allocate` action will always take effect by also clearing `auto_expand_replicas`.
      If you want `auto_expand_replicas` to continue taking effect after the `allocate` action runs, remove the `number_of_replicas` setting from that action.
    area: ILM
    type: breaking
    issues:
      - 150407
    breaking:
      area: ILM
      title: ILM allocate action now removes auto_expand_replicas when number_of_replicas is set
      details: "When `number_of_replicas` is specified in the ILM `allocate` action, the `auto_expand_replicas` setting is now explicitly removed from the index. Previously, a pre-existing `auto_expand_replicas` setting would remain and override the configured `number_of_replicas`, causing the action to have no effect on the replica count."
      impact: "Indices that have `auto_expand_replicas` set and pass through an ILM `allocate` action with `number_of_replicas` configured will have `auto_expand_replicas` removed. If you rely on `auto_expand_replicas` continuing to take effect after the `allocate` action, remove the `number_of_replicas` setting from that action."
      notable: false
      essSettingChange: false

  - pr: 155279
    summary: "When `number_of_replicas` is specified in the ILM `allocate` action, `auto_expand_replicas` is now explicitly removed from the index settings."
    area: ILM
    type: breaking
    issues:
      - 150407
    breaking:
      area: ILM
      title: ILM allocate action now removes auto_expand_replicas when number_of_replicas is set
      details: "When `number_of_replicas` is specified in the ILM `allocate` action, the `auto_expand_replicas` setting is now explicitly removed from the index. Previously, a pre-existing `auto_expand_replicas` setting would remain and override the configured `number_of_replicas`, causing the action to have no effect on the replica count."
      impact: "Indices that have `auto_expand_replicas` set and pass through an ILM `allocate` action with `number_of_replicas` configured have `auto_expand_replicas` removed. If you rely on `auto_expand_replicas` continuing to take effect after the `allocate` action, remove the `number_of_replicas` setting from that action."
      notable: false
      essSettingChange: false

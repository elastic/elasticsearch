  description: Fixes circuit breaker accounting for T-Digest percentile aggregations. High-cardinality `terms` plus `percentiles` queries now trip the breaker instead of exhausting heap.
  areas:
  - Aggregations
  prs:
  - https://github.com/elastic/elasticsearch/pull/155586

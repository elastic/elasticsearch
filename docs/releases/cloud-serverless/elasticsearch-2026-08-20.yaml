  description: Fixes missing request-breaker accounting for deferred aggregation collectors used by rare-terms, auto-date-histogram, and variable-width-histogram aggregations, which could exhaust heap.
  areas:
  - Aggregations
  prs:
  - https://github.com/elastic/elasticsearch/pull/155600

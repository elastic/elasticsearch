  type: bug-fix
  title: Fix search failures when excluding source vectors
  products:
  - product: cloud-serverless
    target: 2026-08-20
  - product: elasticsearch
  description: Fixes searches that failed with a too-complex regex error when excluding vector fields from `_source` on indices with many field patterns, including indices with no vector fields.

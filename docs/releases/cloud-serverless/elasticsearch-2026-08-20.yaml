- file:
    name: 156325.yaml
    checksum: 62b0e694c14e940476fc498fce9c1686beb081e9
  type: enhancement
  title: Speed up vector merge scoring on the stateless indexing tier
  products:
  - product: cloud-serverless
    target: 2026-08-20
  - product: elasticsearch
  description: Improves HNSW merge scoring on stateless indexing nodes by scoring vector data on memory segments instead of copying each vector onto the heap.
  areas:
  - Performance
  - Vector search
  prs:
  - https://github.com/elastic/elasticsearch/pull/156325
  issues:
  - '# PRIVATE: https://github.com/elastic/elasticsearch-serverless/issues/6066'
  - '# PRIVATE: https://github.com/elastic/elasticsearch-serverless/issues/6087'

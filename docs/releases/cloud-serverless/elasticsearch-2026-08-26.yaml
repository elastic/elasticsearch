- file:
    name: 152703.yaml
    checksum: 702b992b5103518fea922000c7136e12f6ecb4b8
  type: breaking-change
  title: Ingest pipelines are now subject to size and count limits
  products:
  - product: cloud-serverless
    target: 2026-08-26
  - product: elasticsearch
  description: 'Enforces three dynamic settings when a pipeline is created or updated: `ingest.pipeline.max_pipelines` (default 10000), `ingest.pipeline.max_pipeline_size` (default 1mb), and `ingest.pipeline.max_total_metadata_size` (default 25mb). Existing pipelines are never invalidated.'
  impact: A request to create or update an ingest pipeline that would exceed one of these limits is rejected with an HTTP 400 error naming the setting. Most deployments will see no change. Existing pipelines continue to work and can be replaced by a definition no larger than the one they supersede.
  action: If you hit a limit, delete unused pipelines or raise the relevant setting with the cluster update settings API. On Elastic Cloud Serverless these settings are not self-configurable; request an increase through support.
  subtype: configuration
  areas:
  - Ingest node
  prs:
  - https://github.com/elastic/elasticsearch/pull/152703

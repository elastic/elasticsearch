apply plugin: 'elasticsearch.build'
apply plugin: 'elasticsearch.publish'

dependencies {
  api "org.apache.lucene:lucene-core:${versions.lucene}"
  // Vectorized numeric range scan (ESVectorUtil.inRangeBitmask). simdvec has no server dependency, so
  // columnar -> simdvec stays acyclic even once server depends on columnar.
  implementation project(":libs:simdvec")

  testImplementation(project(":test:framework")) {
    exclude group: 'org.elasticsearch', module: 'columnar'
  }
}

// The library is a Lucene codec and uses Lucene idioms (e.g. lucene-core IOUtils), so only the JDK
// signatures apply; the ES-wide signatures would forbid Lucene APIs this library legitimately builds on.
tasks.named('forbiddenApisMain').configure {
  replaceSignatureFiles 'jdk-signatures'
}
tasks.named('forbiddenApisTest').configure {
  replaceSignatureFiles 'jdk-signatures'
}

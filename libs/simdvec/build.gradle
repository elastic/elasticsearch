import org.elasticsearch.gradle.internal.nativelibs.BuildNativeLibsTask
import org.elasticsearch.gradle.internal.precommit.CheckForbiddenApisTask

apply plugin: 'elasticsearch.publish'
apply plugin: 'elasticsearch.build'
apply plugin: 'elasticsearch.foreign-api'
apply plugin: 'java-test-fixtures'

dependencies {
  implementation project(':libs:lucene-store')
  implementation project(':libs:native')
  implementation project(':libs:logging')
  implementation "org.apache.lucene:lucene-core:${versions.lucene}"

  testImplementation(testArtifact(project(':x-pack:plugin:searchable-snapshots')))
  testImplementation(testFixtures(project(':libs:native')))
  testImplementation(project(":test:framework")) {
    exclude group: 'org.elasticsearch', module: 'native'
  }
  testFixturesImplementation(project(":test:framework")) {
    exclude group: 'org.elasticsearch', module: 'native'
  }
}

tasks.named('compileJava').configure {
  options.compilerArgs << '--add-modules=jdk.incubator.vector'
  options.compilerArgs << '--add-reads=org.elasticsearch.simdvec=jdk.incubator.vector'
  // Suppress the "using incubating module(s)" mandatory warning that javac emits for
  // jdk.incubator.vector. On JDK 21 this warning has no named lint category and cannot
  // be individually suppressed. -nowarn is scoped to this submodule only.
  // TODO: replace with -Xlint:-incubating when the compile toolchain moves to JDK 22+
  options.compilerArgs << '-nowarn'
}

tasks.named('javadoc').configure {
  options.addStringOption("-add-modules", "jdk.incubator.vector")
  options.addStringOption("-add-reads", "org.elasticsearch.simdvec=jdk.incubator.vector")
}

tasks.withType(CheckForbiddenApisTask).configureEach {
  ignoreMissingClasses = true
}

tasks.named('test').configure {
  if (buildParams.getRuntimeJavaVersion().map{ it.majorVersion.toInteger() }.get() >= 21) {
    jvmArgs '--add-modules=jdk.incubator.vector'
  }
}

tasks.withType(CheckForbiddenApisTask).configureEach {
  replaceSignatureFiles 'jdk-signatures'
}

// --- Native library build (libvec) ---
// VEC_NATIVE_BUILD controls how the native C++ library is obtained:
//   'artifactory' (default) — binary fetched from Artifactory by :libs:native:native-libraries
//   'docker'                — cross-compiled for all platforms inside the Docker toolchain
//   'host'                  — compiled for the current platform using the host compiler
def nativeBuildMode = providers.environmentVariable('VEC_NATIVE_BUILD').orElse('artifactory')

if (nativeBuildMode.get() != 'artifactory') {
  def nativeLibsDir = layout.buildDirectory.dir('native-libs')

  def buildVecNative = tasks.register('buildVecNative', BuildNativeLibsTask) {
    group = 'native'
    description = 'Builds libvec from source into the platform layout consumed by extractLibs'
    sourceFiles.from(fileTree('native') { include 'src/vec/**', 'Makefile' })
    nativeDir.set(layout.projectDirectory.dir('native'))
    mode.set(nativeBuildMode)
    toolchainImage.set('docker.elastic.co/elasticsearch-infra/es-native-cross-toolchain:3')
    outputDir.set(nativeLibsDir)

    // cross-compiles every platform into the Makefile's own tree, which is then gathered below
    dockerCommand.set(['make', 'all'])
    collect.put('build/libs/vec/shared/aarch64/libvec.dylib', 'darwin-aarch64/libvec.dylib')
    collect.put('build/libs/vec/shared/aarch64/libvec.so', 'linux-aarch64/libvec.so')
    collect.put('build/libs/vec/shared/amd64/libvec.so', 'linux-x64/libvec.so')

    // builds the current platform straight into the destination, so there is nothing to gather
    hostCommand.set(nativeLibsDir.map { dest -> ['make', 'local-install', "DEST=${dest.asFile.absolutePath}".toString()] })

    environment.putAll(providers.environmentVariable('CLANG_CXX').map { [CLANG_CXX: it] }.orElse([:]))
  }

  configurations.consumable('nativeVecLibs') {
    attributes.attribute(ArtifactTypeDefinition.ARTIFACT_TYPE_ATTRIBUTE, ArtifactTypeDefinition.DIRECTORY_TYPE)
  }
  artifacts {
    nativeVecLibs buildVecNative.flatMap { it.outputDir }
  }
}

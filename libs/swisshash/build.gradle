import org.elasticsearch.gradle.internal.precommit.CheckForbiddenApisTask

apply plugin: 'elasticsearch.build'
apply plugin: 'elasticsearch.publish'

dependencies {
  implementation project(':libs:x-content')
  implementation project(':server')

  testImplementation(project(":test:framework")) {
    exclude group: 'org.elasticsearch', module: 'swisshash'
  }
}

// A static reference to the Vector API would cause an unsuppressible warning in downstream
// builds, so we add the required module read edge dynamically. ElasticsearchJavaBasePlugin
// pins compileJava to the minimum runtime JDK (21), where the incubating-module warning has
// no named lint category. Use a JDK 25 compiler so -Xlint:-incubating works while --release
// 21 (set globally) keeps Java 21 classfiles. Task-level configure runs after configureEach,
// so this toolchain override wins over the JDK 21 pin in ElasticsearchJavaBasePlugin.
def vectorCompileToolchain = JavaLanguageVersion.of(25)

tasks.named('compileJava').configure {
  javaCompiler = javaToolchains.compilerFor { languageVersion = vectorCompileToolchain }
  options.compilerArgs << '--add-modules=jdk.incubator.vector'
  options.compilerArgs << '--add-reads=org.elasticsearch.swisshash=jdk.incubator.vector'
  options.compilerArgs << '-Xlint:-incubating'
}

tasks.named('javadoc').configure {
  options.addStringOption("-add-modules", "jdk.incubator.vector")
  options.addStringOption("-add-reads", "org.elasticsearch.swisshash=jdk.incubator.vector")
}

tasks.withType(CheckForbiddenApisTask).configureEach {
  ignoreMissingClasses = true
}

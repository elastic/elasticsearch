setup:
  - do:
     bulk:
        refresh: true
        index: test
        body:
          - '{"index": {}}'
          - '{"name": "one"}'
          - '{"index": {}}'
          - '{"name": "two"}'
          - '{"index": {}}'
          - '{"name": "two"}'

---
simple:
  - do:
      search:
        index: test
        body:
          size: 0
          query:
            match:
              name: two
          aggs:
            g:
              global: {}
              aggs:
                t:
                  terms:
                    field: name.keyword

  - match: { aggregations.g.doc_count: 3 }
  - length: { aggregations.g.t.buckets: 2 }
  - match: { aggregations.g.t.buckets.0.key: two }
  - match: { aggregations.g.t.buckets.1.key: one }

---
profile:
  - requires:
      cluster_features: ["gte_v7.13.0"]
      reason: fix introduced in 7.13.0

  - do:
      search:
        index: test
        body:
          profile: true
          size: 0
          query:
            match:
              name: two
          aggs:
            g:
              global: {}
              aggs:
                t:
                  terms:
                    field: name.keyword

  - match: { aggregations.g.doc_count: 3 }
  - length: { aggregations.g.t.buckets: 2 }
  - match: { aggregations.g.t.buckets.0.key: two }
  - match: { aggregations.g.t.buckets.1.key: one }
  - match: { profile.shards.0.aggregations.0.description: g }

---
global under terms:
  - requires:
      capabilities:
        - method: POST
          path: /_search
          capabilities: [ global_under_adapting_agg_error ]
      test_runner_features: [capabilities]
      reason: "global under a terms aggregation returns a 400"
  - do:
      catch: bad_request
      search:
        index: test
        body:
          size: 0
          aggs:
            t:
              terms:
                field: name.keyword
              aggs:
                g:
                  global: {}

  - match: { error.root_cause.0.type: illegal_argument_exception }
  - match: { error.root_cause.0.reason: "Aggregation [t] cannot have a global sub-aggregation [g]. Global aggregations can only be defined as top level aggregations" }

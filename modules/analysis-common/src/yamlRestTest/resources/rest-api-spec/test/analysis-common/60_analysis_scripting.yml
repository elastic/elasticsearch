## Test analysis scripts

"condition":
    - do:
        indices.analyze:
          body:
            text: "Vorsprung Durch Technik"
            tokenizer: "whitespace"
            filter:
              - type: condition
                filter: [ "lowercase" ]
                script:
                  source: "token.term.length() > 5"

    - length: { tokens: 3 }
    - match: { tokens.0.token: "vorsprung" }
    - match: { tokens.1.token: "Durch" }
    - match: { tokens.2.token: "technik" }

---
"condition-vars":
    - do:
        indices.analyze:
          body:
            text: "Vorsprung Durch Technik"
            tokenizer: "whitespace"
            filter:
              - type: condition
                filter: [ "lowercase" ]
                script:
                  source: "token.position >= 1 && token.positionIncrement > 0 && token.startOffset > 0 && token.endOffset > 0 && (token.positionLength == 1 || token.type == \"a\" || token.keyword)"

    - length: { tokens: 3 }
    - match: { tokens.0.token: "Vorsprung" }
    - match: { tokens.1.token: "durch" }
    - match: { tokens.2.token: "technik" }

---
"script_filter":
    - do:
        indices.analyze:
          body:
            text: "Vorsprung Durch Technik"
            tokenizer: "whitespace"
            filter:
              - type: predicate_token_filter
                script:
                  source: "token.term.length() > 5"

    - length: { tokens: 2 }
    - match: { tokens.0.token: "Vorsprung" }
    - match: { tokens.1.token: "Technik" }

---
"script_filter_position":
    - do:
        indices.analyze:
          body:
            text: "a b c d e f g h"
            tokenizer: "whitespace"
            filter:
              - type: predicate_token_filter
                script:
                  source: "token.position >= 4"

    - length: { tokens: 4 }
    - match: { tokens.0.token: "e" }
    - match: { tokens.1.token: "f" }
    - match: { tokens.2.token: "g" }
    - match: { tokens.3.token: "h" }


---
"condition wrapping updateable synonyms loads and reloads them":
    - do:
        synonyms.put_synonym:
          id: condition_set
          body:
            synonyms_set:
              - id: r1
                synonyms: "foo => bar"

    - do:
        indices.create:
          index: condition_synonyms
          body:
            settings:
              index:
                analysis:
                  filter:
                    syn:
                      type: synonym
                      synonyms_set: condition_set
                      updateable: true
                    cond:
                      type: condition
                      filter: [ "syn" ]
                      script:
                        source: "true"
                  analyzer:
                    a:
                      tokenizer: standard
                      filter: [ "cond" ]
            mappings:
              properties:
                f:
                  type: text
                  analyzer: standard
                  search_analyzer: a

    - do:
        indices.analyze:
          index: condition_synonyms
          body:
            analyzer: a
            text: foo
    - match: { tokens.0.token: bar }

    - do:
        synonyms.put_synonym_rule:
          set_id: condition_set
          rule_id: r1
          body:
            synonyms: "foo => baz"

    - do:
        indices.analyze:
          index: condition_synonyms
          body:
            analyzer: a
            text: foo
    - match: { tokens.0.token: baz }

---
"condition wrapping updateable synonyms is rejected at index time":
    - do:
        catch: bad_request
        indices.create:
          index: condition_synonyms_index_time
          body:
            settings:
              index:
                analysis:
                  filter:
                    syn:
                      type: synonym
                      synonyms: [ "foo => bar" ]
                      updateable: true
                    cond:
                      type: condition
                      filter: [ "syn" ]
                      script:
                        source: "true"
                  analyzer:
                    a:
                      tokenizer: standard
                      filter: [ "cond" ]
            mappings:
              properties:
                f:
                  type: text
                  analyzer: a
    - match: { error.root_cause.0.reason: "analyzer [a] contains filters [cond] that are not allowed to run in index time mode." }

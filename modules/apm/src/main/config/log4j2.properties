# The OTel SDK logs every metrics and spans export that fails to reach the endpoint. Failed metric batches are buffered
# on disk and replayed, and export failures of both are reported by the SDK's otel.sdk.exporter.* and otel.sdk.processor.* metrics.
logger.otel_grpc_exporter.name = io.opentelemetry.exporter.otlp.internal.GrpcExporter
logger.otel_grpc_exporter.filter.regex.type = RegexFilter
logger.otel_grpc_exporter.filter.regex.regex = Failed to export (metrics|spans)\\. The request could not be executed\\.
logger.otel_grpc_exporter.filter.regex.onMatch = DENY
logger.otel_grpc_exporter.filter.regex.onMismatch = NEUTRAL

# Spans dropped because the processor queue is full are reported by otel.sdk.processor.span.processed{error.type=queue_full}.
logger.otel_batch_span_processor.name = io.opentelemetry.sdk.trace.export.BatchSpanProcessor
logger.otel_batch_span_processor.filter.regex.type = RegexFilter
logger.otel_batch_span_processor.filter.regex.regex = BatchSpanProcessor dropped \\d+ span\\(s\\) since the last export because the queue is full \\(maxQueueSize=\\d+\\)
logger.otel_batch_span_processor.filter.regex.onMatch = DENY
logger.otel_batch_span_processor.filter.regex.onMismatch = NEUTRAL

org.elasticsearch.telemetry.apm:
  # required by BufferingMetricExporter (disk executor + gauges enumerating the buffer directory)
  - manage_threads
  - files:
      - relative_path: "telemetry-buffer"
        relative_to: data
        mode: read
      # container.id fallback for cgroup v2 (OtelSdkResource#mountInfoContainerId)
      - path: "/proc/self/mountinfo"
        mode: read
      - path_setting: telemetry.logs.ssl.certificate_authorities
        basedir_if_relative: config
        mode: read
      - path_setting: telemetry.logs.ssl.certificate
        basedir_if_relative: config
        mode: read
      - path_setting: telemetry.logs.ssl.key
        basedir_if_relative: config
        mode: read
# PemTrustConfig/PemKeyConfig perform the actual cert/key file reads in the sslconfig module, so the
# file-read entitlement must be granted here as well as to the apm module that resolves the settings.
org.elasticsearch.sslconfig:
  - files:
      - path_setting: telemetry.logs.ssl.certificate_authorities
        basedir_if_relative: config
        mode: read
      - path_setting: telemetry.logs.ssl.certificate
        basedir_if_relative: config
        mode: read
      - path_setting: telemetry.logs.ssl.key
        basedir_if_relative: config
        mode: read
opentelemetry.disk.buffering:
  - files:
      - relative_path: "telemetry-buffer"
        relative_to: data
        mode: read_write

io.opentelemetry.sdk.metrics:
  - manage_threads

io.opentelemetry.sdk.trace:
  - manage_threads

io.opentelemetry.sdk.logs:
  - manage_threads

io.opentelemetry.exporter.sender.okhttp.internal:
  - manage_threads

okhttp3:
  - manage_threads
  - outbound_network

okio:
  - manage_threads

io.opentelemetry.instrumentation.runtime_telemetry:
  - manage_threads

io.opentelemetry.sdk.common:
  - manage_threads

---
"roaring_bitmap aggregation on an integer field returns a portable bitmap and normal total hits":

  - do:
      indices.create:
        index: test_roaring_bitmap_aggregation
        body:
          mappings:
            properties:
              id:
                type: integer

  - do:
      bulk:
        refresh: true
        index: test_roaring_bitmap_aggregation
        body:
          - '{"index": {}}'
          - '{"id": 5}'
          - '{"index": {}}'
          - '{"id": 10}'
          - '{"index": {}}'
          - '{"id": 5}'

  - do:
      search:
        index: test_roaring_bitmap_aggregation
        body:
          size: 0
          track_total_hits: true
          aggs:
            ids:
              roaring_bitmap:
                field: id

  - match: { hits.total.value: 3 }
  - match: { hits.total.relation: "eq" }
  # portable 32-bit Roaring serialization of the distinct set {5, 10}
  - match: { aggregations.ids.value: "OjAAAAEAAAAAAAEAEAAAAAUACgA=" }
  - is_false: aggregations.ids.cardinality


              category:
                type: keyword

  - do:
      bulk:
        refresh: true
        index: test_roaring_bitmap_aggregation_index_terms_filtered
        body:
          - '{"index": {}}'
          - '{"id": 5, "category": "odd"}'
          - '{"index": {}}'
          - '{"id": 10, "category": "even"}'
          - '{"index": {}}'
          - '{"id": 15, "category": "odd"}'

  - do:
      headers:
        Content-Type: application/json
        Accept: application/json
      search:
        index: test_roaring_bitmap_aggregation_index_terms_filtered
        body:
          size: 0
          query:
            term:

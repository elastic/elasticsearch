---
setup:
  - requires:
      reason: "Derived metrics on data streams were added in 9.6+"
      test_runner_features: [ capabilities, allowed_warnings ]
      capabilities:
        - method: PUT
          path: /_data_stream/{target}/_options
          capabilities: [ 'data_stream_options.derived_metrics' ]

  - do:
      allowed_warnings:
        - "index template [source-derived-metrics-template] has index patterns [source-derived-metrics-ds] matching patterns from existing older templates [global] with patterns (global => [*]); this template [source-derived-metrics-template] will take precedence during new index creation"
      indices.put_index_template:
        name: source-derived-metrics-template
        body:
          index_patterns: [ source-derived-metrics-ds ]
          data_stream: { }
          template:
            settings:
              number_of_replicas: 0
            data_stream_options:
              derived_metrics:
                enabled: true
                builtin: [ "ingest.*" ]
                default_interval: "10s"
                dimensions: [ "service.name" ]

  - do:
      indices.create_data_stream:
        name: source-derived-metrics-ds

---
teardown:
  - do:
      indices.delete_data_stream:
        name: source-derived-metrics-ds
        ignore: 404

  - do:
      indices.delete_index_template:
        name: source-derived-metrics-template
        ignore: 404

---
"Derived metrics configured in a template are applied to the data stream":
  - do:
      indices.get_data_stream_options:
        name: "source-derived-metrics-ds"
  - length: { data_streams: 1 }
  - match: { data_streams.0.name: source-derived-metrics-ds }
  - match: { data_streams.0.options.derived_metrics.enabled: true }
  - match: { data_streams.0.options.derived_metrics.builtin: [ "ingest.*" ] }
  - match: { data_streams.0.options.derived_metrics.default_interval: "10s" }
  - match: { data_streams.0.options.derived_metrics.dimensions: [ "service.name" ] }

---
"Set user metrics through the data stream options API":
  - do:
      indices.put_data_stream_options:
        name: "source-derived-metrics-ds"
        body:
          derived_metrics:
            default_interval: "30s"
            destinations:
              1m:
                lifecycle:
                  data_retention: "90d"
            dimensions: [ "service.name", "cloud.region" ]
            metrics:
              - name: "http.errors"
                type: counter
                when:
                  range:
                    http.response.status_code:
                      gte: 500
                dimensions: [ "http.request.method" ]
              - name: "queue.depth"
                type: gauge
                value:
                  field: "queue.depth"
                aggregation: max
                interval: "1m"
  - is_true: acknowledged

  - do:
      indices.get_data_stream_options:
        name: "source-derived-metrics-ds"
  - match: { data_streams.0.options.derived_metrics.default_interval: "30s" }
  - match: { data_streams.0.options.derived_metrics.destinations.1m.lifecycle.data_retention: "90d" }
  - match: { data_streams.0.options.derived_metrics.dimensions: [ "service.name", "cloud.region" ] }
  - length: { data_streams.0.options.derived_metrics.metrics: 2 }
  - match: { data_streams.0.options.derived_metrics.metrics.0.name: "http.errors" }
  - match: { data_streams.0.options.derived_metrics.metrics.0.type: counter }
  - match: { data_streams.0.options.derived_metrics.metrics.0.value: 1.0 }
  - match: { data_streams.0.options.derived_metrics.metrics.1.name: "queue.depth" }
  - match: { data_streams.0.options.derived_metrics.metrics.1.aggregation: max }
  - match: { data_streams.0.options.derived_metrics.metrics.1.interval: "1m" }

---
"Derived metrics can be disabled":
  - do:
      indices.put_data_stream_options:
        name: "source-derived-metrics-ds"
        body:
          derived_metrics:
            enabled: false
  - is_true: acknowledged

  - do:
      indices.get_data_stream_options:
        name: "source-derived-metrics-ds"
  - match: { data_streams.0.options.derived_metrics.enabled: false }

---
"Reserved and unsupported derived metrics are rejected":
  - do:
      catch: /uses reserved \[ingest\.\*\] namespace/
      indices.put_data_stream_options:
        name: "source-derived-metrics-ds"
        body:
          derived_metrics:
            metrics:
              - name: "ingest.docs.count"
                type: counter

  - do:
      catch: /unsupported derived metrics predicate operator \[wildcard\]/
      indices.put_data_stream_options:
        name: "source-derived-metrics-ds"
        body:
          derived_metrics:
            metrics:
              - name: "http.requests"
                type: counter
                when:
                  wildcard:
                    http.request.method: "GE*"

  - do:
      catch: /which is not declared in \[destinations\]/
      indices.put_data_stream_options:
        name: "source-derived-metrics-ds"
        body:
          derived_metrics:
            metrics:
              - name: "http.requests"
                type: counter
                interval: "5m"

  - do:
      catch: /only supports \[aggregation\] for gauge metrics/
      indices.put_data_stream_options:
        name: "source-derived-metrics-ds"
        body:
          derived_metrics:
            metrics:
              - name: "http.requests"
                type: counter
                aggregation: max

---
"Deleting data stream options removes derived metrics":
  - do:
      indices.delete_data_stream_options:
        name: "source-derived-metrics-ds"
  - is_true: acknowledged

  - do:
      indices.get_data_stream_options:
        name: "source-derived-metrics-ds"
  - match: { data_streams.0.name: source-derived-metrics-ds }
  - is_false: data_streams.0.options.derived_metrics

---
"Histogram metrics are accepted and mapped as exponential histograms":
  - do:
      indices.put_data_stream_options:
        name: "source-derived-metrics-ds"
        body:
          derived_metrics:
            enabled: true
            default_interval: "10s"
            metrics:
              - name: "http.request.duration"
                type: histogram
                value:
                  field: "event.duration"
  - is_true: acknowledged

  - do:
      indices.get_data_stream_options:
        name: "source-derived-metrics-ds"
  - match: { data_streams.0.options.derived_metrics.metrics.0.name: "http.request.duration" }
  - match: { data_streams.0.options.derived_metrics.metrics.0.type: "histogram" }
  - match: { data_streams.0.options.derived_metrics.metrics.0.value.field: "event.duration" }

  # The managed destination maps the distribution as an exponential_histogram, whose mapper ships in x-pack-analytics. Asserting it here
  # rather than only in the integration test is the point: this suite runs against the real distribution, so it proves the template we
  # install is one a real node accepts.
  - do:
      indices.get_index_template:
        name: "derived-metrics@template"
  - match: { index_templates.0.index_template.template.mappings.properties.metric.properties.histogram.type: "exponential_histogram" }
  - match: { index_templates.0.index_template.template.mappings.properties.metric.properties.histogram.time_series_metric: "histogram" }

---
"Destination settings can be overridden through the custom component template":
  # The managed template keeps index.mode and routing_path on the index template itself, where composition puts them beyond a component
  # template's reach, and puts only the negotiable settings in derived-metrics@settings. So derived-metrics@custom can change the shard
  # count without being able to break the time series configuration the emitter depends on.
  - do:
      cluster.get_component_template:
        name: "derived-metrics@settings"
  - match: { component_templates.0.component_template.template.settings.index.number_of_shards: "1" }

  - do:
      indices.get_index_template:
        name: "derived-metrics@template"
  - match: { index_templates.0.index_template.composed_of: [ "derived-metrics@settings", "derived-metrics@custom" ] }
  - match: { index_templates.0.index_template.ignore_missing_component_templates: [ "derived-metrics@custom" ] }
  - match: { index_templates.0.index_template.template.settings.index.mode: "time_series" }
  # the negotiable settings are not on the index template, or nothing in composed_of could ever override them
  - is_false: index_templates.0.index_template.template.settings.index.number_of_shards

  - do:
      cluster.put_component_template:
        name: "derived-metrics@custom"
        body:
          template:
            settings:
              number_of_shards: 3
  - is_true: acknowledged

  - do:
      indices.simulate_index_template:
        name: "derived-metrics-source-derived-metrics-ds-10s"
  - match: { template.settings.index.number_of_shards: "3" }
  # and the settings the feature cannot work without are untouched
  - match: { template.settings.index.mode: "time_series" }

  - do:
      cluster.delete_component_template:
        name: "derived-metrics@custom"

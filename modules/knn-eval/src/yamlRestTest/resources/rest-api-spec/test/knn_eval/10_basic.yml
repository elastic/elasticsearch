setup:
  - requires:
      cluster_features: "mapper.bbq_disk_support"
      reason: "the bbq_disk index_options this API is meant to be used with"

  - do:
      indices.create:
        index: knn_eval_test
        body:
          settings:
            index:
              number_of_shards: 1
          mappings:
            properties:
              emb:
                type: dense_vector
                dims: 64
                index: true
                similarity: l2_norm
                index_options:
                  type: bbq_disk

  # Every vector is base + id * step, so all 30 sit on a line and the L2 distance between i and j is exactly |i - j| * |step|. The
  # nearest neighbour of document 1 is therefore document 2 with a clear margin over 3, so the expected hit ids below do not depend on
  # tie breaking.
  - do:
      bulk:
        index: knn_eval_test
        refresh: true

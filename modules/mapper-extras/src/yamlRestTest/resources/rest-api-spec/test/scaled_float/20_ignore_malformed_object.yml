---
"Ignore malformed object with stored source":
  - do:
      indices.create:
        index: test
        body:
          mappings:
            properties:
              usage:
                type: scaled_float
                scaling_factor: 100
                ignore_malformed: true
              tag:
                type: keyword

  - do:
      index:
        index: test
        id: "1"
        refresh: true
        body:
          usage:
            output_tokens: "237"
          tag: t1

  - do:
      search:
        index: test
        body:
          query:
            term:
              tag: t1

  - match: { hits.total.value: 1 }
  - match: { hits.hits.0._id: "1" }
  - match: { hits.hits.0._ignored: [ "usage" ] }
  - match: { hits.hits.0._source.usage.output_tokens: "237" }

  - do:
      indices.get_mapping:
        index: test

  - is_false: test.mappings.properties.output_tokens

---
"Ignore malformed object with synthetic source":
  - requires:
      cluster_features: [ "mapper.source.mode_from_index_setting" ]
      reason: "Source mode configured through index setting"

  - do:
      indices.create:
        index: test
        body:
          settings:
            index:
              mapping.source.mode: synthetic
          mappings:
            properties:
              usage:
                type: scaled_float
                scaling_factor: 100
                ignore_malformed: true
              tag:
                type: keyword

  - do:
      index:
        index: test
        id: "1"
        refresh: true
        body:
          usage:
            output_tokens: "237"
          tag: t1

  - do:
      search:
        index: test
        body:
          query:
            term:
              tag: t1

  - match: { hits.total.value: 1 }
  - match: { hits.hits.0._id: "1" }
  - match: { hits.hits.0._ignored: [ "usage" ] }
  - match: { hits.hits.0._source.usage.output_tokens: "237" }
  - match: { hits.hits.0._source.tag: t1 }

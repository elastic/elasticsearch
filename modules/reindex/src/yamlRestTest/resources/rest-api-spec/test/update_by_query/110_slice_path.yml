setup:
  - requires:
      cluster_features: ["index.slice_indexing"]
      reason: "requires slice indexing support"

  - do:
      indices.create:
        index: sliced
        body:
          settings:
            index.slice.enabled: true
  - do:
      index:
        index:  sliced
        id:     "1"
        _slice: tenant-a
        body:   { "company": "cat" }
  - do:
      index:
        index:  sliced
        id:     "2"
        _slice: tenant-a
        body:   { "company": "dog" }
  - do:
      index:
        index:  sliced
        id:     "3"
        _slice: tenant-b
        body:   { "company": "cow" }
  - do:
      indices.refresh: {}

---
"Update by query with a single slice in the path":
  - do:
      update_by_query:
        index:   sliced
        _slice:  tenant-b
        refresh: true
        body:
          script:
            lang: painless
            source: ctx._source.company = "updated"
  - match: {updated: 1}
  - match: {failures: []}

  - do:
      get:
        index:  sliced
        id:     "3"
        _slice: tenant-b
  - match: {_slice: tenant-b}
  - match: {_source.company: updated}

  - do:
      get:
        index:  sliced
        id:     "1"
        _slice: tenant-a
  - match: {_source.company: cat}

---
"Update by query with multiple slices in the path":
  - do:
      update_by_query:
        index:   sliced
        _slice:  tenant-a,tenant-b
        refresh: true
  - match: {updated: 3}
  - match: {failures: []}

  - do:
      count:
        index: sliced
  - match: {count: 3}

---
"Update by query with _all in the path":
  - do:
      update_by_query:
        index:   sliced
        _slice:  _all
        refresh: true
  - match: {updated: 3}
  - match: {failures: []}

  - do:
      count:
        index: sliced
  - match: {count: 3}

---
"Update by query with a slice in the path matches nothing on a non-sliced index":
  - do:
      index:
        index:   plain
        id:      "1"
        refresh: true
        body:    { "company": "cat" }

  - do:
      update_by_query:
        index:   plain
        _slice:  tenant-a
        refresh: true
  - match: {updated: 0}
  - match: {failures: []}

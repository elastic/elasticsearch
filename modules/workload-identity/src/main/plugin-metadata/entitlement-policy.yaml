org.elasticsearch.workloadidentity:
  - outbound_network
  - manage_threads
# Apache HttpComponents 5.x async transport. The NIO reactor opens sockets from its own
# event-loop threads (org.apache.httpcomponents.core5.httpcore5), while SSL/TLS handshake
# and connection establishment originate from org.apache.httpcomponents.client5.httpclient5.
# Without these entitlements TLS handshake and connection establishment fail at runtime with
# NotEntitledException. Mirrors the grants x-pack/plugin/core makes for the same modules.
org.apache.httpcomponents.client5.httpclient5:
  - outbound_network
  - manage_threads
org.apache.httpcomponents.core5.httpcore5:
  - outbound_network
  - manage_threads
org.apache.httpcomponents.core5.httpcore5.h2:
  - manage_threads

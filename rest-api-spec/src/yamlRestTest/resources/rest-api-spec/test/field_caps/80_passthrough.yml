---
setup:
  - requires:
      cluster_features: "field_caps.passthrough"
      reason: "field_caps flags passthrough objects and flattened fields"

  - do:
      indices.create:
        index: passthrough_index1
        body:
          mappings:
            properties:
              attributes:
                type: passthrough
                priority: 10
                properties:
                  host.name:
                    type: keyword
              resource:
                properties:
                  attributes:
                    type: passthrough
                    priority: 20
                    properties:
                      host.name:
                        type: keyword
              plain:
                properties:
                  field:
                    type: keyword

  # same passthrough objects as passthrough_index1
  - do:
      indices.create:
        index: passthrough_index2
        body:
          mappings:
            properties:
              attributes:
                type: passthrough
                priority: 10
                properties:
                  host.name:
                    type: keyword
              resource:
                properties:
                  attributes:
                    type: passthrough
                    priority: 20
                    properties:
                      host.name:
                        type: keyword

  # resource.attributes is a plain object
  - do:
      indices.create:
        index: passthrough_index3
        body:
          mappings:
            properties:
              attributes:
                type: passthrough
                priority: 10
                properties:
                  host.name:
                    type: keyword
              resource:
                properties:
                  attributes:
                    properties:
                      host.name:
                        type: keyword

  # An index with different mappings, which should not interfere with passthrough resolution
  - do:
      indices.create:
        index: unrelated_index4
        body:
          mappings:
            properties:
              unrelated_object:
                properties:
                  host.name:
                    type: keyword

  # flattened fields with and without passthrough
  - do:
      indices.create:
        index: flattened_index5
        body:
          mappings:
            properties:
              labels:
                type: flattened
                passthrough:
                  priority: 30
                properties:
                  service.name:
                    type: keyword
              plain_labels:
                type: flattened

---
"Passthrough objects are flagged":
  - do:
      field_caps:
        include_empty_fields: true
        index: passthrough_index1,unrelated_index4
        fields: [ "attributes.*", "resource.*", "plain.*" ]

  - match: { fields.attributes.object.type: object }
  - match: { fields.attributes.object.passthrough: true }
  - is_false: fields.attributes.object.non_passthrough_indices

  - match: { fields.resource\.attributes.object.type: object }
  - match: { fields.resource\.attributes.object.passthrough: true }
  - is_false: fields.resource\.attributes.object.non_passthrough_indices

  # plain objects, including the parent of a passthrough object, are explicitly reported as not passthrough
  - match: { fields.resource.object.type: object }
  - match: { fields.resource.object.passthrough: false }
  - is_false: fields.resource.object.non_passthrough_indices

  - match: { fields.plain.object.type: object }
  - match: { fields.plain.object.passthrough: false }

  # sub-fields of passthrough objects are regular leaf fields, which carry no passthrough status at all
  - match: { fields.attributes\.host\.name.keyword.type: keyword }
  - is_false: fields.attributes\.host\.name.keyword.passthrough

---
"Passthrough objects in all indices":
  - do:
      field_caps:
        include_empty_fields: true
        index: passthrough_index1,passthrough_index2,unrelated_index4
        fields: [ "attributes.*", "resource.*" ]

  - match: { fields.attributes.object.passthrough: true }
  - is_false: fields.attributes.object.non_passthrough_indices

  - match: { fields.resource\.attributes.object.passthrough: true }
  - is_false: fields.resource\.attributes.object.non_passthrough_indices

---
"Passthrough objects in some indices only":
  - do:
      field_caps:
        include_empty_fields: true
        index: passthrough_index1,passthrough_index2,passthrough_index3,unrelated_index4
        fields: [ "attributes.*", "resource.*" ]

  - match: { fields.attributes.object.passthrough: true }
  - is_false: fields.attributes.object.non_passthrough_indices

  - match: { fields.resource\.attributes.object.type: object }
  - match: { fields.resource\.attributes.object.passthrough: false }
  - match: { fields.resource\.attributes.object.non_passthrough_indices: [ "passthrough_index3" ] }

---
"Passthrough flattened fields are flagged":
  - do:
      field_caps:
        include_empty_fields: true
        index: flattened_index5
        fields: [ "labels*", "plain_labels", "service.name" ]

  - match: { fields.labels.flattened.type: flattened }
  - match: { fields.labels.flattened.passthrough: true }
  - is_false: fields.labels.flattened.non_passthrough_indices

  # a flattened field without passthrough could have been one, so it is explicitly reported as not passthrough
  - match: { fields.plain_labels.flattened.type: flattened }
  - match: { fields.plain_labels.flattened.passthrough: false }

  # typed sub-fields and their root-level aliases are regular leaf fields
  - match: { fields.labels\.service\.name.keyword.type: keyword }
  - is_false: fields.labels\.service\.name.keyword.passthrough
  - match: { fields.service\.name.keyword.type: keyword }
  - is_false: fields.service\.name.keyword.passthrough

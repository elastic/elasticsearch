---
"master_is_stable is green with verbose details":
  - requires:
      cluster_features: "gte_v8.7.0"
      reason: "the API path changed in 8.7"

  - do:
      health_report:
        feature: master_is_stable

  - is_true: cluster_name
  - match:   { indicators.master_is_stable.status: "green" }
  - match:   { indicators.master_is_stable.symptom: "The cluster has a stable master node" }
  - is_true: indicators.master_is_stable.details.current_master.node_id
  - is_true: indicators.master_is_stable.details.current_master.name
  - is_true: indicators.master_is_stable.details.recent_masters.0.node_id
  - is_true: indicators.master_is_stable.details.recent_masters.0.name
  # Green responses omit impacts and diagnosis
  - is_false: indicators.master_is_stable.impacts
  - is_false: indicators.master_is_stable.diagnosis
  # Feature drill-down returns only this indicator
  - is_false: indicators.shards_availability

---
"master_is_stable omits details when verbose is false":
  - requires:
      cluster_features: "gte_v8.7.0"
      reason: "the API path changed in 8.7"

  - do:
      health_report:
        feature: master_is_stable
        verbose: false

  - is_true: cluster_name
  - match:   { indicators.master_is_stable.status: "green" }
  - match:   { indicators.master_is_stable.symptom: "The cluster has a stable master node" }
  - is_false: indicators.master_is_stable.details
  - is_false: indicators.master_is_stable.impacts
  - is_false: indicators.master_is_stable.diagnosis

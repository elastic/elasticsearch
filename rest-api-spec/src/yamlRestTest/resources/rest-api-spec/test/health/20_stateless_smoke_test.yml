---
"stateless cluster health smoke test":
  - requires:
      test_runner_features: capabilities
      capabilities:
        - method: GET
          path: /_health_report
          capabilities: [ stateless ]
      reason: "only run the stateless health tests when on stateless"

  - do:
      health_report: { }

    # All core indicators are covered by 10_stateful_smoke_test so no sense duplicating here

    # Stateless specific indicator
  - is_true: indicators.blob_store.status
  - is_true: indicators.blob_store.symptom

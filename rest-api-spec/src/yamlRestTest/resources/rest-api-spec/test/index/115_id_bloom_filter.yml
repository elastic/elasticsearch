---
"Index with _id bloom filter enabled":
  - requires:
      cluster_features: ["mapper.id_field.bloom_filter_mapping_attribute"]
      reason: _id bloom_filter mapping parameter was added in this version

  - do:
      indices.create:
          index: test_1
          body:
              mappings:
                  _id:
                      bloom_filter: true
                  _data_stream_timestamp:
                      enabled: true
                  properties:
                      "@timestamp":
                          type: date

  - do:
      indices.get_mapping:
          index: test_1

  - match:   { test_1.mappings._id.bloom_filter: true }

  - do:
      index:
          index:   test_1
          id:      "1"
          refresh: true
          body:    { "@timestamp": "2026-01-01T00:00:00Z", foo: bar }

  - match:   { _id:      "1" }
  - match:   { _version: 1   }

  - do:
      index:
          index:   test_1
          id:      "1"
          refresh: true
          body:    { "@timestamp": "2026-01-01T00:00:01Z", foo: baz }

  - match:   { _id:      "1" }
  - match:   { _version: 2   }

  - do:
      get:
          index:  test_1
          id:     "1"

  - match:   { _id:      "1" }
  - match:   { _version: 2   }
  - match:   { _source.foo: baz }

---
"Index with _id bloom filter disabled":
  - requires:
      cluster_features: ["mapper.id_field.bloom_filter_mapping_attribute"]
      reason: _id bloom_filter mapping parameter was added in this version

  - do:
      indices.create:
          index: test_1
          body:
              mappings:
                  _id:
                      bloom_filter: false

  - do:
      indices.get_mapping:
          index: test_1

  - match:   { test_1.mappings._id.bloom_filter: false }

  - do:
      index:
          index:   test_1
          id:      "1"
          refresh: true
          body:    { foo: bar }

  - match:   { _version: 1 }

  - do:
      index:
          index:   test_1
          id:      "1"
          refresh: true
          body:    { foo: baz }

  - match:   { _version: 2 }

  - do:
      get:
          index:  test_1
          id:     "1"

  - match:   { _id:      "1" }
  - match:   { _source.foo: baz }

---
"_id bloom filter cannot be changed":
  - requires:
      cluster_features: ["mapper.id_field.bloom_filter_mapping_attribute"]
      reason: _id bloom_filter mapping parameter was added in this version

  - do:
      indices.create:
          index: test_1
          body:
              mappings:
                  properties:
                      foo:
                          type: keyword

  - do:
      catch: /Cannot update parameter \[bloom_filter\]/
      indices.put_mapping:
          index: test_1
          body:
              _id:
                  bloom_filter: true

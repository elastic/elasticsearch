setup:
  - requires:
      test_runner_features: [capabilities]
      capabilities:
        - method: PUT
          path: /{index}
          capabilities: [slice_indexing]
      reason: slice-enabled indices scope _id by slice

  - do:
      indices.create:
          index: slice_index
          body:
              settings:
                  number_of_shards: 1
                  index.slice.enabled: true
              mappings:
                  properties:
                      value:
                          type: keyword

---
"Same _id in different slices are distinct documents":
  - do:
      index:
          index:  slice_index
          id:     "1"
          _slice: a
          refresh: true
          body:   { value: va }
  - match: { _id: "1" }
  - match: { result: created }

  - do:
      index:
          index:  slice_index
          id:     "1"
          _slice: b
          refresh: true
          body:   { value: vb }
  - match: { _id: "1" }
  - match: { result: created }

  # GET is scoped to the slice and returns the plain _id
  - do:
      get:
          index:  slice_index
          id:     "1"
          _slice: a
  - match: { _id: "1" }
  - match: { _source.value: va }

  - do:
      get:
          index:  slice_index
          id:     "1"
          _slice: b
  - match: { _id: "1" }
  - match: { _source.value: vb }

  # a slice-scoped search sees only its slice; a search without a slice is rejected
  - do:
      search:
          index:  slice_index
          _slice: a
          body:   { query: { match_all: {} } }
  - match: { hits.total.value: 1 }
  - match: { hits.hits.0._id: "1" }
  - match: { hits.hits.0._source.value: va }

  - do:
      catch: /\[_slice\] is required when \[index.slice.enabled\] is true/
      search:
          index:  slice_index
          body:   { query: { match_all: {} } }

  # an ids query is slice-scoped too
  - do:
      search:
          index:  slice_index
          _slice: b
          body:   { query: { ids: { values: ["1"] } } }
  - match: { hits.total.value: 1 }
  - match: { hits.hits.0._source.value: vb }

---
"A slice search spans multiple comma-separated indices":
  - do:
      indices.create:
          index: slice_index_2
          body:
              settings:
                  number_of_shards: 1
                  index.slice.enabled: true
              mappings:
                  properties:
                      value:
                          type: keyword

  # the same slice holds a doc in each index
  - do:
      index:
          index:  slice_index
          id:     "1"
          _slice: a
          refresh: true
          body:   { value: va1 }
  - do:
      index:
          index:  slice_index_2
          id:     "1"
          _slice: a
          refresh: true
          body:   { value: va2 }

  # searching both indices in a single slice path request returns hits from each
  - do:
      search:
          index:  slice_index,slice_index_2
          _slice: a
          body:   { query: { match_all: {} } }
  - match: { hits.total.value: 2 }

  # the hits come from both indices
  - do:
      search:
          index:  slice_index,slice_index_2
          _slice: a
          body:   { query: { match_all: {} }, sort: [ { _index: asc } ] }
  - match: { hits.total.value: 2 }
  - match: { hits.hits.0._index: slice_index }
  - match: { hits.hits.0._source.value: va1 }
  - match: { hits.hits.1._index: slice_index_2 }
  - match: { hits.hits.1._source.value: va2 }

---
"Overwrite and delete are scoped to the slice":
  - do:
      index:
          index:  slice_index
          id:     "1"
          _slice: a
          refresh: true
          body:   { value: va }
  - do:
      index:
          index:  slice_index
          id:     "1"
          _slice: b
          refresh: true
          body:   { value: vb }

  # overwriting _id 1 in slice a leaves slice b untouched
  - do:
      index:
          index:  slice_index
          id:     "1"
          _slice: a
          refresh: true
          body:   { value: va2 }
  - match: { result: updated }
  - match: { _version: 2 }

  - do:
      get:
          index:  slice_index
          id:     "1"
          _slice: a
  - match: { _source.value: va2 }

  - do:
      get:
          index:  slice_index
          id:     "1"
          _slice: b
  - match: { _source.value: vb }

  # deleting _id 1 in slice a leaves slice b intact
  - do:
      delete:
          index:  slice_index
          id:     "1"
          _slice: a
          refresh: true
  - match: { result: deleted }

  - do:
      catch: missing
      get:
          index:  slice_index
          id:     "1"
          _slice: a

  # delete and update of the now-missing (slice a, id 1) report missing/404, not a wrong-slice error
  - do:
      catch: missing
      delete:
          index:  slice_index
          id:     "1"
          _slice: a

  - do:
      catch: missing
      update:
          index:  slice_index
          id:     "1"
          _slice: a
          body:   { doc: { value: vX } }

  - do:
      get:
          index:  slice_index
          id:     "1"
          _slice: b
  - match: { _source.value: vb }

---
"An id present only in another slice is filtered out":
  - do:
      index:
          index:  slice_index
          id:     "only-a"
          _slice: a
          refresh: true
          body:   { value: va }

  # the id exists in slice a but not slice b; reads/writes in slice b must miss, proving other slices are filtered out
  - do:
      catch: missing
      get:
          index:  slice_index
          id:     "only-a"
          _slice: b

  - do:
      search:
          index:  slice_index
          _slice: b
          body:   { query: { ids: { values: ["only-a"] } } }
  - match: { hits.total.value: 0 }

  - do:
      catch: missing
      delete:
          index:  slice_index
          id:     "only-a"
          _slice: b

  - do:
      catch: missing
      update:
          index:  slice_index
          id:     "only-a"
          _slice: b
          body:   { doc: { value: vb } }

  # slice a is untouched by the missing-slice operations
  - do:
      get:
          index:  slice_index
          id:     "only-a"
          _slice: a
  - match: { _source.value: va }

---
"A slice is a filter: an index without slices matches nothing, a sliced index needs one":
  - do:
      indices.create:
          index: plain_index
          body:
              settings:
                  number_of_shards: 1
              mappings:
                  properties:
                      value:
                          type: keyword

  # routing is given only because an index created after a slice-enabled one is reported as requiring it (#167192)
  - do:
      index:
          index:  plain_index
          id:     "1"
          routing: r
          refresh: true
          body:   { value: plain }
  - do:
      index:
          index:  slice_index
          id:     "1"
          _slice: a
          refresh: true
          body:   { value: va }

  # an index without slices holds no document of any slice
  - do:
      search:
          index:  plain_index
          _slice: a
          body:   { query: { match_all: {} } }
  - match: { hits.total.value: 0 }

  # over a mix of indices only the sliced index contributes
  - do:
      search:
          index:  plain_index,slice_index
          _slice: a
          body:   { query: { match_all: {} } }
  - match: { hits.total.value: 1 }
  - match: { hits.hits.0._index: slice_index }
  - match: { hits.hits.0._slice: a }

  # without a slice the mix is rejected as a whole, whether the sliced index is named or matched by a pattern
  - do:
      catch: /\[_slice\] is required when \[index.slice.enabled\] is true for search request targeting \[plain_index,slice_index\]/
      search:
          index:  plain_index,slice_index
          body:   { query: { match_all: {} } }

  - do:
      catch: /\[_slice\] is required when \[index.slice.enabled\] is true/
      search:
          index:  "*_index"
          body:   { query: { match_all: {} } }

  # the index without slices is searched on its own as before
  - do:
      search:
          index:  plain_index
          body:   { query: { match_all: {} } }
  - match: { hits.total.value: 1 }

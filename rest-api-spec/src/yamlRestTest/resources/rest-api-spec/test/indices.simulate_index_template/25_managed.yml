---
"Test simulate index template setting managed field is rejected":
  - requires:
      test_runner_features: capabilities
      capabilities:
        - method: POST
          path: /_index_template/_simulate_index/{name}
          capabilities: [ index_template_managed_field ]
      reason: "Index template managed field is reserved and cannot be set by a user"

  - do:
      catch: bad_request
      indices.simulate_index_template:
        name: test
        body:
          index_patterns: [ "test-*" ]
          template:
            settings:
              number_of_shards: 1
          managed: true
  - match: { status: 400 }
  - match: { error.reason: "[managed] is a system-managed field and cannot be set by a user" }

---
setup:
  - requires:
      test_runner_features: [ capabilities ]
      capabilities:
        - method: PUT
          path: /{index}
          capabilities: [ columnar_index_modes ]
      cluster_features: [ "mapper.keyword.columnar_default_high_cardinality" ]
      reason: "columnar mode keyword fields default to high-cardinality doc values"

---
# Tests for index sort on keyword fields with cardinality:high.
#
# High-cardinality keyword fields use BinaryDocValues (MultiValuedBinaryDocValuesField).
# MultiValuedBinaryDocValuesSortField sorts by the minimum value across a document's
# values, consistent with how SortedSetSortField behaves with a MIN selector.
#
# columnar mode is used so the sort field actually defaults to high cardinality;
# cardinality is not user-configurable via doc_values.cardinality.

"Index sort on high cardinality keyword field - single values":

  - do:
      indices.create:
        index: test_single
        body:
          settings:
            number_of_shards: 1
            refresh_interval: -1
            index.mode: columnar
            index.sort.field: name
            routing.rebalance.enable: "none"
          mappings:
            properties:
              name:
                type: keyword

  - do:
      cluster.health:
        index: test_single
        wait_for_events: languid
        wait_for_no_initializing_shards: true

  - do:
      index:
        index: test_single
        id: "1"
        body: { "name": "charlie" }
  - do:
      index:
        index: test_single
        id: "2"
        body: { "name": "alice" }
  - do:
      index:
        index: test_single
        id: "3"
        body: { "name": "bob" }

  - do:
      indices.refresh:
        index: test_single

  - do:
      indices.forcemerge:
        index: test_single
        max_num_segments: 1

  - do:
      indices.refresh:
        index: test_single

  # After forcemerge _doc order reflects the index sort (ascending by name):
  # "alice" (id=2), "bob" (id=3), "charlie" (id=1).
  - do:
      search:
        rest_total_hits_as_int: true
        index: test_single
        body:
          sort: _doc

  - match: { hits.total: 3 }
  - length: { hits.hits: 3 }
  - match: { hits.hits.0._id: "2" }
  - match: { hits.hits.1._id: "3" }
  - match: { hits.hits.2._id: "1" }

---
"Index sort on high cardinality keyword field - mixed single and multi values":

  - do:
      indices.create:
        index: test_mixed
        body:
          settings:
            number_of_shards: 1
            refresh_interval: -1
            index.mode: columnar
            index.sort.field: name
            routing.rebalance.enable: "none"
          mappings:
            properties:
              name:
                type: keyword

  - do:
      cluster.health:
        index: test_mixed
        wait_for_events: languid
        wait_for_no_initializing_shards: true

  # Single-value: sort key = "charlie"
  - do:
      index:
        index: test_mixed
        id: "1"
        body: { "name": "charlie" }
  # Single-value: sort key = "alice"
  - do:
      index:
        index: test_mixed
        id: "2"
        body: { "name": "alice" }
  # Multi-value: stored sorted as ["bob","zebra"], sort key = min = "bob"
  - do:
      index:
        index: test_mixed
        id: "3"
        body: { "name": ["zebra", "bob"] }
  # Multi-value: stored sorted as ["alpha","delta"], sort key = min = "alpha"
  - do:
      index:
        index: test_mixed
        id: "4"
        body: { "name": ["delta", "alpha"] }

  - do:
      indices.refresh:
        index: test_mixed

  - do:
      indices.forcemerge:
        index: test_mixed
        max_num_segments: 1

  - do:
      indices.refresh:
        index: test_mixed

  # Ascending order by minimum value:
  # "alice" (id=2), "alpha" (id=4), "bob" (id=3), "charlie" (id=1).
  - do:
      search:
        rest_total_hits_as_int: true
        index: test_mixed
        body:
          sort: _doc

  - match: { hits.total: 4 }
  - length: { hits.hits: 4 }
  - match: { hits.hits.0._id: "2" }
  - match: { hits.hits.1._id: "4" }
  - match: { hits.hits.2._id: "3" }
  - match: { hits.hits.3._id: "1" }

---
"Index sort on high cardinality keyword field - explicit mode=min":

  - do:
      indices.create:
        index: test_mode_min
        body:
          settings:
            number_of_shards: 1
            refresh_interval: -1
            index.mode: columnar
            index.sort.field: name
            index.sort.mode: min
            routing.rebalance.enable: "none"
          mappings:
            properties:
              name:
                type: keyword

  - do:
      cluster.health:
        index: test_mode_min
        wait_for_events: languid
        wait_for_no_initializing_shards: true

  # Single-value: sort key (min) = "charlie"
  - do:
      index:
        index: test_mode_min
        id: "1"
        body: { "name": "charlie" }
  # Single-value: sort key (min) = "alice"
  - do:
      index:
        index: test_mode_min
        id: "2"
        body: { "name": "alice" }
  # Multi-value: stored sorted as ["bob","zebra"], min = "bob"
  - do:
      index:
        index: test_mode_min
        id: "3"
        body: { "name": ["zebra", "bob"] }
  # Multi-value: stored sorted as ["alpha","delta"], min = "alpha"
  - do:
      index:
        index: test_mode_min
        id: "4"
        body: { "name": ["delta", "alpha"] }

  - do:
      indices.refresh:
        index: test_mode_min

  - do:
      indices.forcemerge:
        index: test_mode_min
        max_num_segments: 1

  - do:
      indices.refresh:
        index: test_mode_min

  # Ascending order by minimum value:
  # "alice" (id=2), "alpha" (id=4), "bob" (id=3), "charlie" (id=1).
  - do:
      search:
        rest_total_hits_as_int: true
        index: test_mode_min
        body:
          sort: _doc

  - match: { hits.total: 4 }
  - length: { hits.hits: 4 }
  - match: { hits.hits.0._id: "2" }
  - match: { hits.hits.1._id: "4" }
  - match: { hits.hits.2._id: "3" }
  - match: { hits.hits.3._id: "1" }

---
"Index sort on high cardinality keyword field - explicit mode=max":

  - do:
      indices.create:
        index: test_mode_max
        body:
          settings:
            number_of_shards: 1
            refresh_interval: -1
            index.mode: columnar
            index.sort.field: name
            index.sort.mode: max
            routing.rebalance.enable: "none"
          mappings:
            properties:
              name:
                type: keyword

  - do:
      cluster.health:
        index: test_mode_max
        wait_for_events: languid
        wait_for_no_initializing_shards: true

  # Single-value: sort key (max) = "charlie"
  - do:
      index:
        index: test_mode_max
        id: "1"
        body: { "name": "charlie" }
  # Single-value: sort key (max) = "alice"
  - do:
      index:
        index: test_mode_max
        id: "2"
        body: { "name": "alice" }
  # Multi-value: stored sorted as ["bob","zebra"], max = "zebra"
  - do:
      index:
        index: test_mode_max
        id: "3"
        body: { "name": ["zebra", "bob"] }
  # Multi-value: stored sorted as ["alpha","delta"], max = "delta"
  - do:
      index:
        index: test_mode_max
        id: "4"
        body: { "name": ["delta", "alpha"] }

  - do:
      indices.refresh:
        index: test_mode_max

  - do:
      indices.forcemerge:
        index: test_mode_max
        max_num_segments: 1

  - do:
      indices.refresh:
        index: test_mode_max

  # Ascending order by maximum value:
  # "alice" (id=2), "charlie" (id=1), "delta" (id=4), "zebra" (id=3).
  - do:
      search:
        rest_total_hits_as_int: true
        index: test_mode_max
        body:
          sort: _doc

  - match: { hits.total: 4 }
  - length: { hits.hits: 4 }
  - match: { hits.hits.0._id: "2" }
  - match: { hits.hits.1._id: "1" }
  - match: { hits.hits.2._id: "4" }
  - match: { hits.hits.3._id: "3" }

---
# Indexes across several segments (refresh: true) so the force merge sorts from the column rather than the indexing buffer,
# with a document whose only value is null among multi-valued ones: that document writes a count but no binary value.
"Index sort on high cardinality keyword field - mode=max asc, missing=_first, null values":

  - requires:
      cluster_features: [ "mapper.multi_valued_binary_index_sort_sparse_fix" ]
      reason: "index sort with min/max mode used to fail on documents without a sort value"

  - do:
      indices.create:
        index: test_max_nulls
        body:
          settings:
            number_of_shards: 1
            refresh_interval: -1
            index.mode: columnar
            index.sort.field: name
            index.sort.mode: max
            index.sort.missing: _first
            routing.rebalance.enable: "none"
          mappings:
            properties:
              name:
                type: keyword

  - do:
      cluster.health:
        index: test_max_nulls
        wait_for_events: languid
        wait_for_no_initializing_shards: true

  # max = "charlie"
  - do:
      index:
        index: test_max_nulls
        id: "1"
        body: { "name": "charlie" }
  # max = "delta"
  - do:
      index:
        index: test_max_nulls
        id: "2"
        refresh: true
        body: { "name": ["delta", "alpha"] }
  # only a null: missing
  - do:
      index:
        index: test_max_nulls
        id: "3"
        body: { "name": [null] }
  # max = "bob", the null is skipped
  - do:
      index:
        index: test_max_nulls
        id: "4"
        refresh: true
        body: { "name": ["bob", null] }
  # max = "echo", the null is skipped
  - do:
      index:
        index: test_max_nulls
        id: "5"
        refresh: true
        body: { "name": [null, "echo", "alice"] }

  - do:
      indices.forcemerge:
        index: test_max_nulls
        max_num_segments: 1

  - do:
      indices.refresh:
        index: test_max_nulls

  # Missing first, then ascending by maximum value:
  # (missing) (id=3), "bob" (id=4), "charlie" (id=1), "delta" (id=2), "echo" (id=5).
  - do:
      search:
        rest_total_hits_as_int: true
        index: test_max_nulls
        body:
          sort: _doc

  - match: { hits.total: 5 }
  - length: { hits.hits: 5 }
  - match: { hits.hits.0._id: "3" }
  - match: { hits.hits.1._id: "4" }
  - match: { hits.hits.2._id: "1" }
  - match: { hits.hits.3._id: "2" }
  - match: { hits.hits.4._id: "5" }

---
"Index sort on high cardinality ip field":

  - requires:
      cluster_features: [ "mapper.columnar.ip_inline_array_order_binary_doc_values" ]
      reason: "ip fields use binary doc values in columnar mode"

  - do:
      indices.create:
        index: test_ip
        body:
          settings:
            number_of_shards: 1
            refresh_interval: -1
            index.mode: columnar
            index.sort.field: addr
            routing.rebalance.enable: "none"
          mappings:
            properties:
              addr:
                type: ip

  - do:
      cluster.health:
        index: test_ip
        wait_for_events: languid
        wait_for_no_initializing_shards: true

  - do:
      index:
        index: test_ip
        id: "1"
        body: { "addr": "10.0.0.2" }
  # min = 10.0.0.1
  - do:
      index:
        index: test_ip
        id: "2"
        refresh: true
        body: { "addr": ["192.168.0.1", "10.0.0.1"] }
  - do:
      index:
        index: test_ip
        id: "3"
        body: { "addr": "2001:db8::1" }
  - do:
      index:
        index: test_ip
        id: "4"
        refresh: true
        body: { "addr": "1.2.3.4" }

  - do:
      indices.forcemerge:
        index: test_ip
        max_num_segments: 1

  - do:
      indices.refresh:
        index: test_ip

  # Ascending by minimum address, compared as 16-byte addresses so IPv4 sorts before IPv6:
  # 1.2.3.4 (id=4), 10.0.0.1 (id=2), 10.0.0.2 (id=1), 2001:db8::1 (id=3).
  - do:
      search:
        rest_total_hits_as_int: true
        index: test_ip
        body:
          sort: _doc

  - match: { hits.total: 4 }
  - length: { hits.hits: 4 }
  - match: { hits.hits.0._id: "4" }
  - match: { hits.hits.1._id: "2" }
  - match: { hits.hits.2._id: "1" }
  - match: { hits.hits.3._id: "3" }

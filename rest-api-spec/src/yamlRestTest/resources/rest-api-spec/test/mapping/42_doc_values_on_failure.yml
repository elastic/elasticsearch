---
"nullability=false with on_failure=ignore accepts a missing field (logsdb_columnar)":
  - requires:
      test_runner_features: [ capabilities ]
      capabilities:
        - method: PUT
          path: /{index}
          capabilities: [ columnar_index_modes ]
      cluster_features: ["mapper.doc_values.on_failure"]
      reason: "._on_failure sidecar wired into synthetic source reconstruction"

  - do:
      indices.create:
        index: test_on_failure_nullability_missing
        body:
          settings:
            index.mode: logsdb_columnar
            index.mapping.source.mode: synthetic
          mappings:
            properties:
              kw:
                type: keyword
                doc_values:
                  nullability: false
                  on_failure: ignore

  # A document that omits the field is accepted instead of rejected: the field is marked ignored.
  - do:
      index:
        index: test_on_failure_nullability_missing
        id: "1"
        body:
          "@timestamp": "2024-01-01T00:00:00Z"

  - do:
      indices.refresh:
        index: test_on_failure_nullability_missing

  - do:
      get:
        index: test_on_failure_nullability_missing
        id: "1"
        stored_fields: [ _ignored ]
  - match: { _ignored: [ "kw" ] }

  - do:
      get:
        index: test_on_failure_nullability_missing
        id: "1"
  - is_false: _source.kw

  # Negative control: a document that provides the field is accepted without any _ignored entry.

---
"on_failure=ignore accepts multi-valued document and redirects extra values":
  - requires:
      test_runner_features: [ capabilities ]
      capabilities:
        - method: PUT
          path: /{index}
          capabilities: [ columnar_index_modes, doc_values_on_failure ]
      reason: "doc_values on_failure=ignore requires columnar index mode and the doc_values_on_failure feature flag"

  - do:
      indices.create:
        index: test_on_failure_ignore
        body:
          settings:
            index.mode: logsdb_columnar
          mappings:
            properties:
              kw:
                type: keyword
                doc_values:
                  multi_value: false
                  on_failure: ignore

  # Indexing a single value must succeed.
  - do:
      index:
        index: test_on_failure_ignore
        id: "1"
        refresh: true
        body:
          "@timestamp": "2024-01-01T00:00:00Z"
          kw: "val1"

  # Indexing multiple values must also succeed (on_failure=ignore).
  - do:
      index:
        index: test_on_failure_ignore
        id: "2"
        refresh: true
        body:
          "@timestamp": "2024-01-01T00:00:00Z"
          kw: ["val1", "val2"]

  - do:
      indices.refresh:
        index: test_on_failure_ignore

  # The first value is searchable.
  - do:
      search:
        index: test_on_failure_ignore
        body:
          query:
            term:
              kw: "val1"

  - match: { hits.total.value: 2 }

  # The redirected (second) value is NOT searchable on the parent field.
  - do:
      search:
        index: test_on_failure_ignore
        body:
          query:
            term:
              kw: "val2"

  - match: { hits.total.value: 0 }

  # The document with the violation is recorded in _ignored.
  - do:
      search:
        index: test_on_failure_ignore
        body:
          query:
            term:
              _ignored: "kw"

  - match: { hits.total.value: 1 }
  - match: { hits.hits.0._id: "2" }

---
"on_failure=ignore multi-field receives all values; parent only keeps first":
  - requires:
      test_runner_features: [ capabilities ]
      capabilities:
        - method: PUT
          path: /{index}
          capabilities: [ columnar_index_modes, doc_values_on_failure ]
      reason: "doc_values on_failure=ignore requires columnar index mode and the doc_values_on_failure feature flag"

  - do:
      indices.create:
        index: test_on_failure_multifield
        body:
          settings:
            index.mode: logsdb_columnar
          mappings:
            properties:
              parent:
                type: keyword
                doc_values:
                  multi_value: false
                  on_failure: ignore
                fields:
                  child:
                    type: keyword

  - do:
      index:
        index: test_on_failure_multifield
        id: "1"
        body:
          "@timestamp": "2024-01-01T00:00:00Z"
          parent: ["a", "b"]

  - do:
      indices.refresh:
        index: test_on_failure_multifield

  # The parent keeps only the first value.
  - do:
      search:
        index: test_on_failure_multifield
        body:
          query:
            term:
              parent: "a"

  - match: { hits.total.value: 1 }

  # The second value is NOT searchable on the parent.
  - do:
      search:
        index: test_on_failure_multifield
        body:
          query:
            term:
              parent: "b"

  - match: { hits.total.value: 0 }

  # The multi-field child indexes all values — both are searchable.
  - do:
      search:
        index: test_on_failure_multifield
        body:
          query:
            term:
              parent.child: "a"

  - match: { hits.total.value: 1 }

  - do:
      search:
        index: test_on_failure_multifield
        body:
          query:
            term:
              parent.child: "b"

  - match: { hits.total.value: 1 }

  # _ignored contains the parent but not the child (child applied no constraint).
  - do:
      search:
        index: test_on_failure_multifield
        body:
          query:
            term:
              _ignored: "parent"

  - match: { hits.total.value: 1 }

  - do:
      search:
        index: test_on_failure_multifield
        body:
          query:
            term:
              _ignored: "parent.child"

  - match: { hits.total.value: 0 }

---
"on_failure=fail (default) on multi-field rejects document even when parent ignores":
  - requires:
      test_runner_features: [ capabilities ]
      capabilities:
        - method: PUT
          path: /{index}
          capabilities: [ columnar_index_modes, doc_values_on_failure ]
      reason: "doc_values on_failure=ignore requires columnar index mode and the doc_values_on_failure feature flag"

  - do:
      indices.create:
        index: test_on_failure_child_fail
        body:
          settings:
            index.mode: logsdb_columnar
          mappings:
            properties:
              parent:
                type: keyword
                doc_values:
                  multi_value: false
                  on_failure: ignore
                fields:
                  child:
                    type: keyword
                    doc_values:
                      multi_value: false
                      # on_failure defaults to "fail"

  # Indexing a multi-valued array is rejected because the child field's on_failure is "fail".
  - do:
      catch: /configured with \[multi_value=false\] but encountered multiple values in the same document/
      index:
        index: test_on_failure_child_fail
        id: "1"
        body:
          "@timestamp": "2024-01-01T00:00:00Z"
          parent: ["a", "b"]

---
"on_failure=ignore redirects extra values to ._on_failure sidecar (synthetic source)":
  - requires:
      test_runner_features: [ capabilities ]
      capabilities:
        - method: PUT
          path: /{index}
          capabilities: [ columnar_index_modes ]
      cluster_features: ["mapper.doc_values.on_failure"]
      reason: "._on_failure sidecar wired into synthetic source reconstruction"

  - do:
      indices.create:
        index: test_on_failure_synthetic
        body:
          settings:
            index.mode: logsdb_columnar
            index.mapping.source.mode: synthetic
          mappings:
            properties:
              kw:
                type: keyword
                doc_values:
                  multi_value: false
                  on_failure: ignore

  # Multiple values: first goes to primary column, rest to ._on_failure; _source reconstructs full array in encounter order.
  - do:
      index:
        index: test_on_failure_synthetic
        id: "1"
        body:
          "@timestamp": "2024-01-01T00:00:00Z"
          kw: ["val1", "val2", "val3"]

  # Single value: no sidecar needed; _source returns a scalar.
  - do:
      index:
        index: test_on_failure_synthetic
        id: "2"
        body:
          "@timestamp": "2024-01-01T00:00:00Z"
          kw: "only"

  - do:
      indices.refresh:
        index: test_on_failure_synthetic

  - do:
      get:
        index: test_on_failure_synthetic
        id: "1"

  - match: { _source.kw: ["val1", "val2", "val3"] }

  - do:
      get:
        index: test_on_failure_synthetic
        id: "2"

  - match: { _source.kw: "only" }

  # The sidecar is not surfaced to search / fields: only the primary doc-value is visible.
  - do:
      search:
        index: test_on_failure_synthetic
        body:
          query:
            term:
              kw: "val2"
  - match: { hits.total.value: 0 }

  - do:
      search:
        index: test_on_failure_synthetic
        body:
          query:
            term:
              kw: "val1"
  - match: { hits.total.value: 1 }


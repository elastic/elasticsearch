"on_failure=ignore leading null without null_value (logsdb_columnar)":
  - requires:
      test_runner_features: [ capabilities ]
      capabilities:
        - method: PUT
          path: /{index}
          capabilities: [ columnar_index_modes ]
      cluster_features: ["mapper.doc_values.on_failure"]
      reason: "._on_failure sidecar wired into synthetic source reconstruction"

  - do:
      indices.create:
        index: test_on_failure_leading_null
        body:
          settings:
            index.mode: logsdb_columnar
            index.mapping.source.mode: synthetic
          mappings:
            properties:
              kw:
                type: keyword
                doc_values:
                  multi_value: false
                  on_failure: ignore

  # Leading null, no null_value: the null is discarded without consuming the single-value slot,
  # so "val1" is the first real value and is indexed normally — no violation.
  - do:
      index:
        index: test_on_failure_leading_null
        id: "1"
        body:
          "@timestamp": "2024-01-01T00:00:00Z"
          kw: [null, "val1"]

  # [null, null] with no null_value: both nulls discarded — field is absent from _source.
  - do:
      index:
        index: test_on_failure_leading_null
        id: "2"
        body:
          "@timestamp": "2024-01-01T00:00:00Z"
          kw: [null, null]

  - do:
      indices.refresh:
        index: test_on_failure_leading_null

  # id "1": "val1" indexed normally, _source is a scalar and term query finds it.
  - do:
      get:
        index: test_on_failure_leading_null
        id: "1"
  - match: { _source.kw: "val1" }

  - do:
      search:
        index: test_on_failure_leading_null
        body:
          query:
            term:
              kw: "val1"
  - match: { hits.total.value: 1 }

  # id "2": both nulls discarded, field absent from _source.
  - do:
      get:
        index: test_on_failure_leading_null
        id: "2"
  - is_false: _source.kw


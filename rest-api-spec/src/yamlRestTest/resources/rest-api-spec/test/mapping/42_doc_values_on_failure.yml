---
"on_failure=ignore leading null with null_value (logsdb_columnar)":
  - requires:
      test_runner_features: [ capabilities ]
      capabilities:
        - method: PUT
          path: /{index}
          capabilities: [ columnar_index_modes ]
      cluster_features: ["mapper.doc_values.on_failure"]
      reason: "._on_failure sidecar wired into synthetic source reconstruction"

  - do:
      indices.create:
        index: test_on_failure_leading_null_value
        body:
          settings:
            index.mode: logsdb_columnar
            index.mapping.source.mode: synthetic
          mappings:
            properties:
              kw:
                type: keyword
                null_value: "NULL"
                doc_values:
                  multi_value: false
                  on_failure: ignore

  # Leading null with null_value="NULL": the null claims the slot and is substituted by "NULL"
  # in parseCreateField, so "NULL" goes to the primary column (searchable). "val1" then violates
  # and goes to ._on_failure. _source reconstructs as ["NULL", "val1"].
  - do:
      index:
        index: test_on_failure_leading_null_value
        id: "1"
        body:
          "@timestamp": "2024-01-01T00:00:00Z"
          kw: [null, "val1"]

  # [null, null] with null_value: first null becomes "NULL" in the primary column; second null
  # violates and is encoded into ._on_failure as JSON null. _source: ["NULL", null].
  - do:
      index:
        index: test_on_failure_leading_null_value
        id: "2"
        body:
          "@timestamp": "2024-01-01T00:00:00Z"
          kw: [null, null]

  - do:
      indices.refresh:
        index: test_on_failure_leading_null_value

  - do:
      get:
        index: test_on_failure_leading_null_value
        id: "1"
  - match: { _source.kw: ["NULL", "val1"] }

  # "NULL" reached the primary column in both docs (each has a leading null); "val1" went to
  # ._on_failure and is not searchable.
  - do:
      search:
        index: test_on_failure_leading_null_value
        body:
          query:
            term:
              kw: "NULL"
  - match: { hits.total.value: 2 }

  - do:
      search:
        index: test_on_failure_leading_null_value
        body:
          query:
            term:
              kw: "val1"
  - match: { hits.total.value: 0 }

  - do:
      get:
        index: test_on_failure_leading_null_value
        id: "1"
        stored_fields: [ _ignored ]
  - match:
      _ignored:
        - kw

  - do:
      get:
        index: test_on_failure_leading_null_value
        id: "2"
  - match: { _source.kw: ["NULL", null] }

  - do:
      get:
        index: test_on_failure_leading_null_value
        id: "2"
        stored_fields: [ _ignored ]
  - match:
      _ignored:
        - kw


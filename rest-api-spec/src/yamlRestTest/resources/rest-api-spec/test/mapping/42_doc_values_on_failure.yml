---
"on_failure=ignore trailing null round-trips":
  - requires:
      test_runner_features: [ capabilities ]
      capabilities:
        - method: PUT
          path: /{index}
          capabilities: [ columnar_index_modes ]
      cluster_features: ["mapper.doc_values.on_failure"]
      reason: "._on_failure sidecar wired into synthetic source reconstruction"

  - do:
      indices.create:
        index: test_on_failure_trailing_null
        body:
          settings:
            index.mode: logsdb_columnar
            index.mapping.source.mode: synthetic
          mappings:
            properties:
              kw:
                type: keyword
                doc_values:
                  multi_value: false
                  on_failure: ignore

  # Trailing null: ["val1", null] — the null is stored in ._on_failure and round-trips.
  - do:
      index:
        index: test_on_failure_trailing_null
        id: "1"
        body:
          "@timestamp": "2024-01-01T00:00:00Z"
          kw: ["val1", null]

  - do:
      indices.refresh:
        index: test_on_failure_trailing_null

  - do:
      get:
        index: test_on_failure_trailing_null
        id: "1"

  - match: { _source.kw: ["val1", null] }

---
"on_failure=ignore mapping serialization roundtrip":
  - requires:
      test_runner_features: [ capabilities ]
      capabilities:
        - method: PUT
          path: /{index}
          capabilities: [ columnar_index_modes ]
      cluster_features: ["mapper.doc_values.on_failure"]
      reason: "._on_failure sidecar wired into synthetic source reconstruction"

  - do:
      indices.create:
        index: test_on_failure_mapping_roundtrip
        body:
          settings:
            index.mode: logsdb_columnar
          mappings:
            properties:
              kw:
                type: keyword
                doc_values:
                  multi_value: false
                  on_failure: ignore

  - do:
      indices.get_mapping:
        index: test_on_failure_mapping_roundtrip

  - match: { test_on_failure_mapping_roundtrip.mappings.properties.kw.doc_values.multi_value: false }
  - match: { test_on_failure_mapping_roundtrip.mappings.properties.kw.doc_values.on_failure: "ignore" }

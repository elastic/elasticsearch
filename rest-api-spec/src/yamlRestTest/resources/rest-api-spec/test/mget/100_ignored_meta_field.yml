---
"_ignored field through mget api by default":
  - requires:
      test_runner_features: [ capabilities ]
      capabilities:
        - method: GET
          path: /_mget
          capabilities: [ ignored_meta_field_by_default ]
      reason: "mget returns _ignored by default"

  - do:
      indices.create:
        index: test
        body:
          mappings:
            properties:
              keyword:
                type: keyword
                ignore_above: 5
              value:
                type: long
                ignore_malformed: true

  - do:
      index:
        index:   test
        id:      1
        refresh: true
        body:
          keyword: foo
          value: 23
  - do:
      index:
        index:   test
        id:      2
        refresh: true
        body:
          keyword: foobar
          value: missing
  - do:
      index:
        index:   test
        id:      3
        refresh: true
        body:
          keyword: foo
          value: ops

  - do:
      mget:
        index: test
        body:
          ids: [ "1", "2", "3" ]

  - match: { docs.0._id: "1" }
  - match: { docs.0.found: true }
  - is_false: docs.0._ignored
  - match: { docs.1._id: "2" }
  - match: { docs.1.found: true }
  - match: { docs.1._ignored: [ keyword, value ] }
  - match: { docs.2._id: "3" }
  - match: { docs.2.found: true }
  - match: { docs.2._ignored: [ value ] }

  - do:
      mget:
        index: test
        stored_fields: [ keyword ]
        body:
          ids: [ "2" ]

  - match: { docs.0._id: "2" }
  - match: { docs.0._ignored: [ keyword, value ] }

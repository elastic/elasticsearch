setup:
  - requires:
      cluster_features: [ "search.vectors.nested_knn_inner_hits_match_query_phase_scoring" ]
      test_runner_features: close_to
      reason: "older nodes score inner_hits against the quantized vectors while the query phase rescores against the full-precision ones, so this cannot hold on a mixed cluster"

  - do:
      indices.create:
        index: nested_bbq
        body:
          settings:
            index:
              number_of_shards: 1
          mappings:
            properties:
              nested:
                type: nested
                properties:
                  vector:
                    type: dense_vector
                    dims: 64
                    index: true
                    similarity: cosine
                    index_options:
                      type: bbq_hnsw

  # A single bulk request, then a force-merge down to one segment. Both matter: bbq quantizes each vector as a
  # residual against a per-segment centroid, so vectors spread one-per-segment are quantized almost losslessly
  # and the discrepancy this test guards against becomes invisible.
  - do:
      bulk:
        index: nested_bbq
        refresh: true
        body:
          - {"index": {"_index": "nested_bbq", "_id": "0"}}
          - {"nested": [{"vector": [0.9329, -0.1185, -0.9850, 0.8220, 0.8785, 0.1645, 0.3431, -0.8321, 0.5330, -0.5264, -0.9384, 0.5775, -0.3078, 0.2466, 0.2316, -0.7029, -0.6338, -0.7712, -0.9708, -0.0265, 0.9298, -0.8709, 0.0822, -0.0682, 0.2029, -0.8221, 0.1580, -0.4608, 0.1129, 0.2893, -0.0379, -0.2895, -0.5017, 0.8670, -0.0932, 0.0603, -0.9614, 0.0162, -0.9884, -0.7125, -0.0543, -0.2453, -0.8916, 0.1751, -0.6720, 0.1147, -0.7115, 0.8746, 0.5420, 0.9139, -0.7175, -0.3892, -0.9208, -0.4464, 0.6130, -0.6453, -0.6909, 0.9094, -0.6909, 0.6678, -0.9179, -0.2276, -0.3008, -0.3166]}, {"vector": [0.6329, -0.0481, 0.5658, -0.0583, 0.6347, 0.7631, -0.1208, 0.5621, 0.6295, -0.4086, -0.7522, -0.6288, -0.1279, -0.7611, 0.0596, 0.6588, -0.0296, 0.6355, 0.3128, 0.2821, -0.3093, 0.4053, 0.6199, -0.6857, 0.8160, -0.4613, -0.6903, 0.6810, 0.4403, 0.5871, -0.1067, -0.8585, -0.2095, -0.9045, -0.4277, -0.9240, 0.0134, -0.8247, 0.8657, 0.3988, -0.3660, 0.8901, -0.8675, -0.4851, -0.8540, -0.1474, -0.5962, -0.2067, 0.4097, 0.7747, 0.0010, 0.6371, -0.2775, 0.7174, 0.0301, 0.4048, -0.6506, 0.1690, -0.3964, 0.6257, 0.0687, -0.0008, 0.5467, 0.0981]}]}

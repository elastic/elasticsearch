---
"nested kNN inner_hits are scored like the query phase on a quantized field":
  # bbq_hnsw defaults to rescore_vector.oversample: 3, so the query phase rescores its candidates against the
  # full-precision vectors. inner_hits re-runs the child query in the fetch phase and must score it the same way:
  # scoring one phase against the quantized vectors and the other against the full-precision vectors makes the
  # parent _score disagree with the child score reported beneath it.
  - do:
      search:
        index: nested_bbq
        body:
          size: 5
          _source: false
          query:
            nested:
              path: nested
              score_mode: max
              query:
                knn:
                  field: nested.vector
                  query_vector: [-0.2090, -0.2050, -0.5496, 0.6793, -0.2826, -0.4887, -0.7277, -0.7264, 0.9310, 0.7188, -0.0860, -0.1288, -0.2131, -0.2163, -0.8604, -0.3848, 0.2061, -0.8908, -0.9079, 0.3966, -0.8640, 0.4356, -0.5395, -0.6274, 0.3929, -0.8469, 0.5026, 0.5071, 0.1668, -0.2664, -0.7197, -0.1072, -0.8032, 0.5332, -0.1175, -0.0458, -0.1066, 0.0348, -0.7224, 0.0461, 0.9479, 0.6037, -0.5873, 0.9047, 0.0013, -0.5275, 0.7703, -0.7447, -0.2886, -0.9970, 0.7127, -0.9090, -0.7026, 0.6523, 0.8429, 0.5186, -0.5711, 0.5142, -0.3756, -0.3235, 0.2737, -0.2159, -0.8694, -0.4509]
                  num_candidates: 20
              inner_hits: { size: 2, _source: false }

  # knn returns at most k parents, so assert a floor rather than the full doc count
  - gt: { hits.total.value: 2 }

  # Under score_mode: max the parent score is the best child's score, so every returned parent must expose that
  # child and report the same score for it.
  - gt: { hits.hits.0.inner_hits.nested.hits.total.value: 0 }
  - gt: { hits.hits.1.inner_hits.nested.hits.total.value: 0 }
  - gt: { hits.hits.2.inner_hits.nested.hits.total.value: 0 }

  # close_to rather than match: the parent score and the inner hit score are computed at different call sites and
  # can differ in the last bit, which varies with the SIMD instructions used for the dot product. The tolerance is
  # far wider than that difference needs, while still staying an order of magnitude below the smallest gap a
  # quantized inner hit score would show.
  - set: { hits.hits.0._score: parent_score_0 }
  - close_to: { hits.hits.0.inner_hits.nested.hits.max_score: { value: $parent_score_0, error: 0.0001 } }

  - set: { hits.hits.1._score: parent_score_1 }
  - close_to: { hits.hits.1.inner_hits.nested.hits.max_score: { value: $parent_score_1, error: 0.0001 } }

  - set: { hits.hits.2._score: parent_score_2 }
  - close_to: { hits.hits.2.inner_hits.nested.hits.max_score: { value: $parent_score_2, error: 0.0001 } }

  # A `similarity` threshold is evaluated once in the query phase and again when inner_hits re-runs the child
  # query. If the two phases score at different fidelity, a child accepted by the first check can be rejected by
  # the second, and the parent is returned with an empty inner_hits - indistinguishable, to a client, from a
  # parent that genuinely has no matching child.
  - do:
      search:
        index: nested_bbq
        body:
          size: 5
          _source: false
          query:
            nested:
              path: nested
              score_mode: max
              query:
                knn:
                  field: nested.vector
                  query_vector: [-0.2090, -0.2050, -0.5496, 0.6793, -0.2826, -0.4887, -0.7277, -0.7264, 0.9310, 0.7188, -0.0860, -0.1288, -0.2131, -0.2163, -0.8604, -0.3848, 0.2061, -0.8908, -0.9079, 0.3966, -0.8640, 0.4356, -0.5395, -0.6274, 0.3929, -0.8469, 0.5026, 0.5071, 0.1668, -0.2664, -0.7197, -0.1072, -0.8032, 0.5332, -0.1175, -0.0458, -0.1066, 0.0348, -0.7224, 0.0461, 0.9479, 0.6037, -0.5873, 0.9047, 0.0013, -0.5275, 0.7703, -0.7447, -0.2886, -0.9970, 0.7127, -0.9090, -0.7026, 0.6523, 0.8429, 0.5186, -0.5711, 0.5142, -0.3756, -0.3235, 0.2737, -0.2159, -0.8694, -0.4509]
                  num_candidates: 20
                  similarity: 0.08
              inner_hits: { size: 2, _source: false }

  - gt: { hits.total.value: 0 }
  - gt: { hits.hits.0.inner_hits.nested.hits.total.value: 0 }
  - set: { hits.hits.0._score: threshold_score_0 }
  - close_to: { hits.hits.0.inner_hits.nested.hits.max_score: { value: $threshold_score_0, error: 0.0001 } }

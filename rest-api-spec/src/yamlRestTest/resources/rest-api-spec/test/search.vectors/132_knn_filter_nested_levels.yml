"Filters on root fields two levels above the vector":

  # term on a doc values only long
  - do:
      search:
        index: books
        body: {"_source": false, "knn": {"field": "chapters.paragraphs.vector", "query_vector": [0, 0], "k": 10, "num_candidates": 100, "filter": {"term": {"pages": 100}}, "inner_hits": {"name": "inner", "size": 10, "_source": true}}}


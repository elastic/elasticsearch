setup:
  - requires:
      capabilities:
        - method: POST
          path: /_search
          capabilities: [ knn_filter_nested_levels ]
      test_runner_features: [ "capabilities" ]
      reason: "Capability for resolving the nested level of knn filters required"
  - do:
      indices.create:
        index: books
        body:
          settings:
            index:
              number_of_shards: 1
          mappings:
            properties:
              genre: { type: keyword }
              published: { type: date }
              pages: { type: long, index: false }
              summary: { type: match_only_text }
              tags: { type: flattened }
              authors:
                type: nested
                properties:
                  name: { type: keyword }
              chapters:
                type: nested
                properties:
                  cid: { type: keyword }
                  language: { type: keyword }
                  title: { type: keyword }
                  body: { type: match_only_text }
                  meta: { type: flattened }
                  vector: { type: dense_vector, dims: 2, similarity: l2_norm, index_options: { type: flat } }
                  paragraphs:
                    type: nested
                    properties:
                      pid: { type: keyword }
                      text: { type: keyword }
                      body: { type: text }
                      kind: { type: keyword, index: false }
                      score: { type: float }
                      vector: { type: dense_vector, dims: 2, similarity: l2_norm, index_options: { type: flat } }
  - do:
      index:
        index: books
        id: "1"
        body: {"genre": "nature", "published": "2001-01-01", "pages": 100, "summary": "wild animals", "tags": {"color": "green"}, "authors": [{"name": "ann"}], "chapters": [{"cid": "c1", "language": "fr", "title": "intro", "body": "le debut", "meta": {"level": "easy"}, "vector": [1, 0], "paragraphs": [{"pid": "p1", "text": "alpha", "body": "red green", "kind": "a", "score": 1.0, "vector": [1, 0]}, {"pid": "p2", "text": "beta", "body": "blue sky", "kind": "b", "score": 2.0, "vector": [1, 1]}]}, {"cid": "c2", "language": "en", "title": "middle", "body": "the middle", "meta": {"level": "hard"}, "vector": [2, 0], "paragraphs": [{"pid": "p3", "text": "gamma", "body": "green red", "score": 3.0, "vector": [2, 0]}]}]}
  - do:
      index:
        index: books
        id: "2"
        body: {"genre": "novel", "published": "2010-06-01", "pages": 300, "summary": "a long story", "tags": {"color": "red"}, "authors": [{"name": "bob"}], "chapters": [{"cid": "c3", "language": "fr", "title": "intro", "body": "un roman", "meta": {"level": "easy"}, "vector": [3, 0], "paragraphs": [{"pid": "p4", "text": "alpha", "body": "red green", "kind": "b", "score": 4.0, "vector": [2, 1]}]}, {"cid": "c4", "language": "de", "title": "outro", "body": "the end", "meta": {"level": "hard"}, "vector": [4, 0], "paragraphs": [{"pid": "p5", "text": "beta", "body": "red blue", "kind": "a", "score": 5.0, "vector": [2, 2]}]}]}
  - do:
      index:
        index: books
        id: "3"
        body: {"genre": "nature", "published": "2020-03-01", "pages": 50, "summary": "small birds", "tags": {"color": "green"}, "authors": [{"name": "ann"}, {"name": "bob"}], "chapters": [{"cid": "c5", "language": "en", "title": "intro", "body": "un debut", "meta": {"level": "easy"}, "vector": [5, 0], "paragraphs": [{"pid": "p6", "text": "alpha", "body": "green green", "kind": "a", "score": 6.0, "vector": [3, 0]}]}]}
  - do:
      indices.refresh: {}

---
"Filters on the vector's own nested fields of any query type":

  # prefix
  - do:
      search:
        index: books
        body: {"_source": false, "knn": {"field": "chapters.paragraphs.vector", "query_vector": [0, 0], "k": 10, "num_candidates": 100, "filter": {"prefix": {"chapters.paragraphs.text": "al"}}, "inner_hits": {"name": "inner", "size": 10, "_source": true}}}

  - match: { hits.total.value: 3 }
  - match: { hits.hits.0._id: "1" }
  - length: { hits.hits.0.inner_hits.inner.hits.hits: 1 }
  - match: { hits.hits.0.inner_hits.inner.hits.hits.0._source.pid: "p1" }
  - match: { hits.hits.1._id: "2" }
  - length: { hits.hits.1.inner_hits.inner.hits.hits: 1 }
  - match: { hits.hits.1.inner_hits.inner.hits.hits.0._source.pid: "p4" }
  - match: { hits.hits.2._id: "3" }
  - length: { hits.hits.2.inner_hits.inner.hits.hits: 1 }
  - match: { hits.hits.2.inner_hits.inner.hits.hits.0._source.pid: "p6" }

  - do:
      search:
        index: books
        body: {"_source": false, "query": {"nested": {"path": "chapters", "query": {"nested": {"path": "chapters.paragraphs", "query": {"knn": {"field": "chapters.paragraphs.vector", "query_vector": [0, 0], "k": 10, "num_candidates": 100, "filter": {"prefix": {"chapters.paragraphs.text": "al"}}}}}}}}}

  - match: { hits.total.value: 3 }
  - match: { hits.hits.0._id: "1" }
  - match: { hits.hits.1._id: "2" }
  - match: { hits.hits.2._id: "3" }

  # wildcard
  - do:
      search:
        index: books
        body: {"_source": false, "knn": {"field": "chapters.paragraphs.vector", "query_vector": [0, 0], "k": 10, "num_candidates": 100, "filter": {"wildcard": {"chapters.paragraphs.text": "*eta"}}, "inner_hits": {"name": "inner", "size": 10, "_source": true}}}

  - match: { hits.total.value: 2 }
  - match: { hits.hits.0._id: "1" }
  - length: { hits.hits.0.inner_hits.inner.hits.hits: 1 }
  - match: { hits.hits.0.inner_hits.inner.hits.hits.0._source.pid: "p2" }
  - match: { hits.hits.1._id: "2" }
  - length: { hits.hits.1.inner_hits.inner.hits.hits: 1 }
  - match: { hits.hits.1.inner_hits.inner.hits.hits.0._source.pid: "p5" }

  - do:
      search:
        index: books
        body: {"_source": false, "query": {"nested": {"path": "chapters", "query": {"nested": {"path": "chapters.paragraphs", "query": {"knn": {"field": "chapters.paragraphs.vector", "query_vector": [0, 0], "k": 10, "num_candidates": 100, "filter": {"wildcard": {"chapters.paragraphs.text": "*eta"}}}}}}}}}

  - match: { hits.total.value: 2 }
  - match: { hits.hits.0._id: "1" }
  - match: { hits.hits.1._id: "2" }

  # regexp
  - do:
      search:
        index: books
        body: {"_source": false, "knn": {"field": "chapters.paragraphs.vector", "query_vector": [0, 0], "k": 10, "num_candidates": 100, "filter": {"regexp": {"chapters.paragraphs.text": "g.*"}}, "inner_hits": {"name": "inner", "size": 10, "_source": true}}}

  - match: { hits.total.value: 1 }
  - match: { hits.hits.0._id: "1" }
  - length: { hits.hits.0.inner_hits.inner.hits.hits: 1 }
  - match: { hits.hits.0.inner_hits.inner.hits.hits.0._source.pid: "p3" }

  - do:
      search:
        index: books
        body: {"_source": false, "query": {"nested": {"path": "chapters", "query": {"nested": {"path": "chapters.paragraphs", "query": {"knn": {"field": "chapters.paragraphs.vector", "query_vector": [0, 0], "k": 10, "num_candidates": 100, "filter": {"regexp": {"chapters.paragraphs.text": "g.*"}}}}}}}}}

  - match: { hits.total.value: 1 }
  - match: { hits.hits.0._id: "1" }

  # fuzzy
  - do:
      search:
        index: books
        body: {"_source": false, "knn": {"field": "chapters.paragraphs.vector", "query_vector": [0, 0], "k": 10, "num_candidates": 100, "filter": {"fuzzy": {"chapters.paragraphs.text": {"value": "bata", "fuzziness": 1}}}, "inner_hits": {"name": "inner", "size": 10, "_source": true}}}

  - match: { hits.total.value: 2 }
  - match: { hits.hits.0._id: "1" }
  - length: { hits.hits.0.inner_hits.inner.hits.hits: 1 }
  - match: { hits.hits.0.inner_hits.inner.hits.hits.0._source.pid: "p2" }
  - match: { hits.hits.1._id: "2" }
  - length: { hits.hits.1.inner_hits.inner.hits.hits: 1 }
  - match: { hits.hits.1.inner_hits.inner.hits.hits.0._source.pid: "p5" }

  - do:
      search:
        index: books
        body: {"_source": false, "query": {"nested": {"path": "chapters", "query": {"nested": {"path": "chapters.paragraphs", "query": {"knn": {"field": "chapters.paragraphs.vector", "query_vector": [0, 0], "k": 10, "num_candidates": 100, "filter": {"fuzzy": {"chapters.paragraphs.text": {"value": "bata", "fuzziness": 1}}}}}}}}}}

  - match: { hits.total.value: 2 }
  - match: { hits.hits.0._id: "1" }
  - match: { hits.hits.1._id: "2" }

  # match_phrase
  - do:
      search:
        index: books
        body: {"_source": false, "knn": {"field": "chapters.paragraphs.vector", "query_vector": [0, 0], "k": 10, "num_candidates": 100, "filter": {"match_phrase": {"chapters.paragraphs.body": "red green"}}, "inner_hits": {"name": "inner", "size": 10, "_source": true}}}

  - match: { hits.total.value: 2 }
  - match: { hits.hits.0._id: "1" }
  - length: { hits.hits.0.inner_hits.inner.hits.hits: 1 }
  - match: { hits.hits.0.inner_hits.inner.hits.hits.0._source.pid: "p1" }
  - match: { hits.hits.1._id: "2" }
  - length: { hits.hits.1.inner_hits.inner.hits.hits: 1 }
  - match: { hits.hits.1.inner_hits.inner.hits.hits.0._source.pid: "p4" }

  - do:
      search:
        index: books
        body: {"_source": false, "query": {"nested": {"path": "chapters", "query": {"nested": {"path": "chapters.paragraphs", "query": {"knn": {"field": "chapters.paragraphs.vector", "query_vector": [0, 0], "k": 10, "num_candidates": 100, "filter": {"match_phrase": {"chapters.paragraphs.body": "red green"}}}}}}}}}

  - match: { hits.total.value: 2 }
  - match: { hits.hits.0._id: "1" }
  - match: { hits.hits.1._id: "2" }

  # exists on a doc values only field
  - do:
      search:
        index: books
        body: {"_source": false, "knn": {"field": "chapters.paragraphs.vector", "query_vector": [0, 0], "k": 10, "num_candidates": 100, "filter": {"exists": {"field": "chapters.paragraphs.kind"}}, "inner_hits": {"name": "inner", "size": 10, "_source": true}}}

  - match: { hits.total.value: 3 }
  - match: { hits.hits.0._id: "1" }
  - length: { hits.hits.0.inner_hits.inner.hits.hits: 2 }
  - match: { hits.hits.0.inner_hits.inner.hits.hits.0._source.pid: "p1" }
  - match: { hits.hits.0.inner_hits.inner.hits.hits.1._source.pid: "p2" }
  - match: { hits.hits.1._id: "2" }
  - length: { hits.hits.1.inner_hits.inner.hits.hits: 2 }
  - match: { hits.hits.1.inner_hits.inner.hits.hits.0._source.pid: "p4" }
  - match: { hits.hits.1.inner_hits.inner.hits.hits.1._source.pid: "p5" }
  - match: { hits.hits.2._id: "3" }
  - length: { hits.hits.2.inner_hits.inner.hits.hits: 1 }
  - match: { hits.hits.2.inner_hits.inner.hits.hits.0._source.pid: "p6" }

  - do:
      search:
        index: books
        body: {"_source": false, "query": {"nested": {"path": "chapters", "query": {"nested": {"path": "chapters.paragraphs", "query": {"knn": {"field": "chapters.paragraphs.vector", "query_vector": [0, 0], "k": 10, "num_candidates": 100, "filter": {"exists": {"field": "chapters.paragraphs.kind"}}}}}}}}}

  - match: { hits.total.value: 3 }
  - match: { hits.hits.0._id: "1" }
  - match: { hits.hits.1._id: "2" }
  - match: { hits.hits.2._id: "3" }

  # term on a doc values only field
  - do:
      search:
        index: books
        body: {"_source": false, "knn": {"field": "chapters.paragraphs.vector", "query_vector": [0, 0], "k": 10, "num_candidates": 100, "filter": {"term": {"chapters.paragraphs.kind": "b"}}, "inner_hits": {"name": "inner", "size": 10, "_source": true}}}

  - match: { hits.total.value: 2 }
  - match: { hits.hits.0._id: "1" }
  - length: { hits.hits.0.inner_hits.inner.hits.hits: 1 }
  - match: { hits.hits.0.inner_hits.inner.hits.hits.0._source.pid: "p2" }
  - match: { hits.hits.1._id: "2" }
  - length: { hits.hits.1.inner_hits.inner.hits.hits: 1 }
  - match: { hits.hits.1.inner_hits.inner.hits.hits.0._source.pid: "p4" }

  - do:
      search:
        index: books
        body: {"_source": false, "query": {"nested": {"path": "chapters", "query": {"nested": {"path": "chapters.paragraphs", "query": {"knn": {"field": "chapters.paragraphs.vector", "query_vector": [0, 0], "k": 10, "num_candidates": 100, "filter": {"term": {"chapters.paragraphs.kind": "b"}}}}}}}}}

  - match: { hits.total.value: 2 }
  - match: { hits.hits.0._id: "1" }
  - match: { hits.hits.1._id: "2" }

  # range on a float
  - do:
      search:
        index: books
        body: {"_source": false, "knn": {"field": "chapters.paragraphs.vector", "query_vector": [0, 0], "k": 10, "num_candidates": 100, "filter": {"range": {"chapters.paragraphs.score": {"gte": 4}}}, "inner_hits": {"name": "inner", "size": 10, "_source": true}}}

  - match: { hits.total.value: 2 }
  - match: { hits.hits.0._id: "2" }
  - length: { hits.hits.0.inner_hits.inner.hits.hits: 2 }
  - match: { hits.hits.0.inner_hits.inner.hits.hits.0._source.pid: "p4" }
  - match: { hits.hits.0.inner_hits.inner.hits.hits.1._source.pid: "p5" }
  - match: { hits.hits.1._id: "3" }
  - length: { hits.hits.1.inner_hits.inner.hits.hits: 1 }
  - match: { hits.hits.1.inner_hits.inner.hits.hits.0._source.pid: "p6" }

  - do:
      search:
        index: books
        body: {"_source": false, "query": {"nested": {"path": "chapters", "query": {"nested": {"path": "chapters.paragraphs", "query": {"knn": {"field": "chapters.paragraphs.vector", "query_vector": [0, 0], "k": 10, "num_candidates": 100, "filter": {"range": {"chapters.paragraphs.score": {"gte": 4}}}}}}}}}}

  - match: { hits.total.value: 2 }
  - match: { hits.hits.0._id: "2" }
  - match: { hits.hits.1._id: "3" }

  # must_not only
  - do:
      search:
        index: books
        body: {"_source": false, "knn": {"field": "chapters.paragraphs.vector", "query_vector": [0, 0], "k": 10, "num_candidates": 100, "filter": {"bool": {"must_not": {"term": {"chapters.paragraphs.text": "alpha"}}}}, "inner_hits": {"name": "inner", "size": 10, "_source": true}}}

  - match: { hits.total.value: 2 }
  - match: { hits.hits.0._id: "1" }
  - length: { hits.hits.0.inner_hits.inner.hits.hits: 2 }
  - match: { hits.hits.0.inner_hits.inner.hits.hits.0._source.pid: "p2" }

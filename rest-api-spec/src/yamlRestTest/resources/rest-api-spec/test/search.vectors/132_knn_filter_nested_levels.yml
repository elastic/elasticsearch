        index: books
        body: {"_source": false, "query": {"nested": {"path": "chapters", "query": {"nested": {"path": "chapters.paragraphs", "query": {"knn": {"field": "chapters.paragraphs.vector", "query_vector": [0, 0], "k": 10, "num_candidates": 100, "filter": {"term": {"tags.color": "green"}}}}}}}}}


setup:
  - requires:
      cluster_features: [ "mapper.exclude_source_vectors_from_ignored_source" ]
      reason: 'excluded vectors are left out of _ignored_source'
      test_runner_features: [ close_to ]

  - do:
      indices.create:
        index: test
        body:
          settings:
            index:
              mapping.source.mode: synthetic
              mapping.exclude_source_vectors: true
              mapping.synthetic_source_keep: arrays
          mappings:
            properties:
              vector:
                type: dense_vector
                dims: 3
                similarity: l2_norm
                synthetic_source_keep: all
              cos:
                type: dense_vector
                dims: 3
                similarity: cosine
                synthetic_source_keep: all
              b64:
                type: dense_vector
                dims: 3
                similarity: l2_norm
                synthetic_source_keep: all
              obj:
                synthetic_source_keep: all
                properties:
                  vector:
                    type: dense_vector
                    dims: 3
                    similarity: l2_norm
              arr:
                properties:
                  k:
                    type: keyword
                  vector:
                    type: dense_vector
                    dims: 3
                    similarity: l2_norm
              nested:
                type: nested
                synthetic_source_keep: all
                properties:
                  k:
                    type: keyword
                  vector:
                    type: dense_vector
                    dims: 3
                    similarity: l2_norm

  # Every vector is kept by synthetic_source_keep: by its own mapping, its object's, or the index setting for arrays of objects.
  # Rebuilt from the index, [1, 3.14159265358979, -2] comes back as float32, [1.0, 3.1415927, -2.0], rather than as the indexed
  # text. cos is not unit length: it is indexed normalized and rebuilt scaled back by its magnitude. b64 is
  # [1.0, 3.1415927, -2.0] as base64 encoded big-endian floats.
  - do:
      index:
        index: test
        id: "1"
        refresh: true
        body:
          vector: [ 1, 3.14159265358979, -2 ]
          cos: [ 3, 4, 0 ]
          b64: P4AAAEBJD9vAAAAA
          obj: { vector: [ 1, 3.14159265358979, -2 ] }
          arr: [ { k: first }, { k: second, vector: [ 1, 3.14159265358979, -2 ] } ]
          nested: [ { k: first }, { k: second, vector: [ 1, 3.14159265358979, -2 ] } ]

---
"excluded vectors are rebuilt from the index":
  - do:
      search:
        index: test
        body:
          _source:
            exclude_vectors: false

  - match: { hits.hits.0._source.vector: [ 1.0, 3.1415927, -2.0 ] }
  - close_to: { hits.hits.0._source.cos.0: { value: 3.0, error: 0.00001 } }
  - close_to: { hits.hits.0._source.cos.1: { value: 4.0, error: 0.00001 } }
  - close_to: { hits.hits.0._source.cos.2: { value: 0.0, error: 0.00001 } }
  - match: { hits.hits.0._source.b64: [ 1.0, 3.1415927, -2.0 ] }
  - match: { hits.hits.0._source.obj: { vector: [ 1.0, 3.1415927, -2.0 ] } }
  # as with a stored _source, a vector in an array of objects is patched into the first object
  - match: { hits.hits.0._source.arr: [ { k: first, vector: [ 1.0, 3.1415927, -2.0 ] }, { k: second } ] }
  # nested objects are patched by offset
  - match: { hits.hits.0._source.nested: [ { k: first }, { k: second, vector: [ 1.0, 3.1415927, -2.0 ] } ] }

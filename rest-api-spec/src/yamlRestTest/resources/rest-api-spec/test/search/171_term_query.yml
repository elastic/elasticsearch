---
"case insensitive term query on blank keyword is consistent":
  - requires:
      cluster_features: [ "gte_v8.16.0" ]
      reason: "query consistency bug fix in 8.16.0"
  - do:
      indices.create:
          index: index_with_blank_keyword
          body:
              settings:
                  number_of_shards: 1
              mappings:
                  properties:
                      keyword_field:
                          type: keyword
  - do:
      bulk:
          refresh: true
          body:
              - '{"index": {"_index": "index_with_blank_keyword", "_id": "1"}}'
              - '{"keyword_field": ""}'

  - do:
      search:
          rest_total_hits_as_int: true
          index: index_with_blank_keyword
          body: {"query" : {"term" : {"keyword_field" : {"value":  ""}}}}

  - match: { hits.total: 1 }

  - do:
      search:
        rest_total_hits_as_int: true
        index: index_with_blank_keyword
        body: { "query": { "term": { "keyword_field": {"value": "", "case_insensitive": true } } } }

  - match: { hits.total: 1 }

---
"split_queries_on_whitespace with built-in and custom lowercase normalizers":
  - requires:
      capabilities:
        - method: POST
          path: /_search
          capabilities: [ lowercase_normalizer_splits_on_whitespace ]
      test_runner_features: [ capabilities ]
      reason: "built-in lowercase normalizer ignored split_queries_on_whitespace"
  - do:
      indices.create:
        index: lowercase_split
        body:
          settings:
            number_of_shards: 1
            analysis:
              normalizer:
                custom_lc:
                  type: custom
                  filter: [ lowercase ]
          mappings:
            properties:
              builtin:
                type: keyword
                normalizer: lowercase
                split_queries_on_whitespace: true
              custom:
                type: keyword
                normalizer: custom_lc
                split_queries_on_whitespace: true
  - do:
      index:
        index: lowercase_split
        id: "1"
        refresh: true
        body: { "builtin": "Foo", "custom": "Foo" }

  - do:
      search:
        rest_total_hits_as_int: true
        index: lowercase_split
        body: { "query": { "match": { "builtin": "FOO bar" } } }
  - match: { hits.total: 1 }

  - do:
      search:
        rest_total_hits_as_int: true
        index: lowercase_split
        body: { "query": { "match": { "builtin": { "query": "FOO bar", "operator": "and" } } } }
  - match: { hits.total: 0 }

  - do:
      search:
        rest_total_hits_as_int: true
        index: lowercase_split
        body: { "query": { "match": { "custom": "FOO bar" } } }
  - match: { hits.total: 1 }

  - do:
      search:
        rest_total_hits_as_int: true
        index: lowercase_split
        body: { "query": { "match": { "custom": { "query": "FOO bar", "operator": "and" } } } }
  - match: { hits.total: 0 }

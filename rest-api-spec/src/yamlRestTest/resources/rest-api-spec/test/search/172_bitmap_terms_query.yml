---
"Bitmap terms query on BKD-indexed integer field":
  - requires:
      capabilities:
        - method: POST
          path: /_search
          capabilities: [ terms_query_bitmap_format ]
      test_runner_features: capabilities
      reason: "bitmap format for terms query requires capabilities"

  - do:
      indices.create:
        index: test_bitmap_bkd
        body:
          mappings:
            properties:
              num:
                type: integer

  - do:
      bulk:
        refresh: true
        index: test_bitmap_bkd
        body:
          - '{"index": {}}'
          - '{"num": 1}'
          - '{"index": {}}'
          - '{"num": 2}'
          - '{"index": {}}'
          - '{"num": 3}'
          - '{"index": {}}'
          - '{"num": 4}'
          - '{"index": {}}'
          - '{"num": 5}'

  - do:
      search:
        rest_total_hits_as_int: true
        index: test_bitmap_bkd
        body:
          query:
            terms:
              # bitmap {1, 3, 5}
              num: "OjAAAAEAAAAAAAIAEAAAAAEAAwAFAA=="
              format: bitmap
  - match: { hits.total: 3 }

  - do:
      search:
        rest_total_hits_as_int: true
        index: test_bitmap_bkd
        body:
          query:
            terms:
              # bitmap {10} — not in index
              num: "OjAAAAEAAAAAAAAAEAAAAAoA"
              format: bitmap
  - match: { hits.total: 0 }

  - do:
      search:
        rest_total_hits_as_int: true
        index: test_bitmap_bkd
        body:
          query:
            terms:
              # bitmap {1, 2, 3}
              num: "OjAAAAEAAAAAAAIAEAAAAAEAAgADAA=="
              format: bitmap
  - match: { hits.total: 3 }

---
"Bitmap terms query on index_terms integer field":
  - requires:
      capabilities:
        - method: POST
          path: /_search
          capabilities: [ terms_query_bitmap_format ]
      test_runner_features: capabilities
      reason: "bitmap format for terms query requires capabilities"

  - do:
      indices.create:
        index: test_bitmap_idx_terms
        body:
          mappings:
            properties:
              num:
                type: integer
                index_terms: true

  - do:
      bulk:
        refresh: true
        index: test_bitmap_idx_terms
        body:
          - '{"index": {}}'
          - '{"num": 1}'
          - '{"index": {}}'
          - '{"num": 2}'
          - '{"index": {}}'
          - '{"num": 3}'
          - '{"index": {}}'
          - '{"num": 4}'
          - '{"index": {}}'
          - '{"num": 5}'

  - do:
      search:
        rest_total_hits_as_int: true
        index: test_bitmap_idx_terms
        body:
          query:
            terms:
              # bitmap {1, 3, 5}
              num: "OjAAAAEAAAAAAAIAEAAAAAEAAwAFAA=="
              format: bitmap
  - match: { hits.total: 3 }

  - do:
      search:
        rest_total_hits_as_int: true
        index: test_bitmap_idx_terms
        body:
          query:
            terms:
              # bitmap {10} — not in index
              num: "OjAAAAEAAAAAAAAAEAAAAAoA"
              format: bitmap
  - match: { hits.total: 0 }

---
"Bitmap format rejected on non-integer field":
  - requires:
      capabilities:
        - method: POST
          path: /_search
          capabilities: [ terms_query_bitmap_format ]
      test_runner_features: capabilities
      reason: "bitmap format for terms query requires capabilities"

  - do:
      indices.create:
        index: test_bitmap_nonint
        body:
          mappings:
            properties:
              kw:
                type: keyword

  - do:
      catch: bad_request
      search:
        index: test_bitmap_nonint
        body:
          query:
            terms:
              # bitmap {10}
              kw: "OjAAAAEAAAAAAAAAEAAAAAoA"
              format: bitmap

---
"Bitmap format rejected on index-disabled field":
  - requires:
      capabilities:
        - method: POST
          path: /_search
          capabilities: [ terms_query_bitmap_format ]
      test_runner_features: capabilities
      reason: "bitmap format for terms query requires capabilities"

  - do:
      indices.create:
        index: test_bitmap_noindex
        body:
          mappings:
            properties:
              num:
                type: integer
                index: false

  - do:
      catch: bad_request
      search:
        index: test_bitmap_noindex
        body:
          query:
            terms:
              # bitmap {10}
              num: "OjAAAAEAAAAAAAAAEAAAAAoA"
              format: bitmap

setup:

  - do:
      indices.create:
        index: index1
        body:
          mappings:
            properties:
              foo:
                type: keyword

  - do:
      bulk:
        refresh: true
        body:
        - '{ "index" : { "_index" : "index1", "_id" : "1" } }'
        - '{ "foo": "bar"}'

---
"test negative size throws IAE":

  - do:
      catch: /\[size\] parameter cannot be negative, found \[-5\]/
      search:
        index: index1
        rest_total_hits_as_int: true
        size: -5

---
"test negative terminate_after throws IAE":

  - do:
      catch: /illegal_argument_exception/
      search:
        index: index1
        rest_total_hits_as_int: true
        terminate_after: -1

---
"test script field without a script is a bad request":

  - do:
      catch: bad_request
      search:
        index: index1
        body:
          script_fields:
            field: {}

  - do:
      catch: bad_request
      search:
        index: index1
        body:
          script_fields:
            field:
              ignore_failure: true

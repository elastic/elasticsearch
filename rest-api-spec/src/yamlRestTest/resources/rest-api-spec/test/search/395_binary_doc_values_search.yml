---
setup:
  - requires:
      cluster_features: ["mapper.keyword.store_high_cardinality_in_binary_doc_values"]
      reason: "testing binary doc values search"

  - do:
      indices.create:
        index:  test
        body:
          mappings:
            dynamic: false
            properties:
              keyword:
                type: keyword
                index: false
                doc_values:
                  cardinality: high

  - do:
      index:
        index: test
        id: "1"
        body:
          keyword: "key1"

  - do:
      index:
        index: test
        id: "2"
        body:
          keyword: "key2"
  - do:
      indices.refresh: {}

---
"Test match query on keyword field where only binary doc values are enabled":

  - do:
      search:
        index: test
        body: { query: { match: { keyword: { query: "key1" } } } }
  - length:   { hits.hits: 1  }

---
"Test terms query on keyword field where only binary doc values are enabled":

  - do:
      search:
        index: test
        body: { query: { terms: { keyword: [ "key1", "key2" ] } } }
  - length:   { hits.hits: 2  }

---
"Test range query on keyword field where only binary doc values are enabled":

  - do:
      search:
        index: test
        body: { query: { range: { keyword: { gte: "key1" } } } }
  - length:   { hits.hits: 2  }

---
"Test fuzzy query on keyword field where only binary doc values are enabled":

  - do:
      search:
        index: test
        body: { query: { fuzzy: { keyword: { value: "kay1", fuzziness: 1 } } } }
  - length:   { hits.hits: 1  }

---
"Test prefix query on keyword field where only binary doc values are enabled":

  - do:
      search:
        index: test
        body: { query: { prefix: { keyword: { value: "key" } } } }
  - length:   { hits.hits: 2  }

---
"Test case insensitive term query on keyword field where only binary doc values are enabled":

  - do:
      search:
        index: test
        body: { query: { term: { keyword: { value: "KeY1", case_insensitive: true } } } }
  - length:   { hits.hits: 1  }

---
"Test wildcard query on keyword field where only binary doc values are enabled":

  - do:
      search:
        index: test
        body: { query: { wildcard: { keyword: { value: "k*1" } } } }
  - length:   { hits.hits: 1  }

---
"Test wildcard contains query on keyword field where only binary doc values are enabled":

  - do:
      search:
        index: test
        body: { query: { wildcard: { keyword: { value: "*ey*" } } } }
  - length:   { hits.hits: 2  }

---
"Test wildcard contains query matches single doc":

  - do:
      search:
        index: test
        body: { query: { wildcard: { keyword: { value: "*ey1*" } } } }
  - length:   { hits.hits: 1  }
  - match: { hits.hits.0._id: "1" }

---
"Test wildcard contains query no match":

  - do:
      search:
        index: test
        body: { query: { wildcard: { keyword: { value: "*xyz*" } } } }
  - length:   { hits.hits: 0  }

---
"Test case insensitive wildcard query on keyword field where only binary doc values are enabled":

  - do:
      search:
        index: test
        body: { query: { wildcard: { keyword: { value: "K*1", case_insensitive: true } } } }
  - length:   { hits.hits: 1  }

---
"Test case insensitive wildcard contains query":

  - do:
      search:
        index: test
        body: { query: { wildcard: { keyword: { value: "*EY*", case_insensitive: true } } } }
  - length:   { hits.hits: 2  }

---
"Test regexp query on keyword field where only binary doc values are enabled":

  - do:
      search:
        index: test
        body: { query: { regexp: { keyword: { value: "k.*1" } } } }
  - length:   { hits.hits: 1  }

---
"Test sort on keyword field where only binary doc values are enabled":

  - do:
      search:
        index: test
        body: { sort: [ { keyword: { "order": "desc" } } ] }
  - length:   { hits.hits: 2  }
  - match: { hits.hits.0.sort.0: key2 }
  - match: { hits.hits.1.sort.0: key1 }


---
"Test collapse on keyword field where only binary doc values are enabled":

  - do:
      indices.create:
        index: test_collapse
        body:
          settings:
            index.number_of_shards: 1
          mappings:
            properties:
              "@timestamp":
                type: date
              keyword:
                type: keyword
                index: false
                doc_values:
                  cardinality: high

  - do:
      bulk:
        index: test_collapse
        refresh: true
        body:
          - { "index": { } }
          - { "@timestamp": "2024-01-01T00:00:00Z", "keyword": "key1" }
          - { "index": { } }
          - { "@timestamp": "2024-01-02T00:00:00Z", "keyword": "key2" }
          - { "index": { } }
          - { "@timestamp": "2024-01-03T00:00:00Z", "keyword": "key1" }

  - do:
      search:
        index: test_collapse
        body:
          collapse:
            field: keyword
          sort:
            - "@timestamp": asc
          size: 10

  - match:  { hits.total.value: 3 }
  - length: { hits.hits: 2 }
  - match:  { hits.hits.0.fields.keyword.0: "key1" }
  - match:  { hits.hits.0._source.@timestamp: "2024-01-01T00:00:00Z" }
  - match:  { hits.hits.1.fields.keyword.0: "key2" }

---
"Test collapse rejects a multi valued keyword field where only binary doc values are enabled":

  - do:
      indices.create:
        index: test_collapse_multi
        body:
          settings:
            index.number_of_shards: 1
          mappings:
            properties:
              "@timestamp":
                type: date
              keyword:
                type: keyword
                index: false
                doc_values:
                  cardinality: high

  - do:
      index:
        index: test_collapse_multi
        refresh: true
        body:
          "@timestamp": "2024-01-01T00:00:00Z"
          keyword: [ "key1", "key2" ]

  - do:
      catch: /the grouping field must be single valued/
      search:
        index: test_collapse_multi
        body:
          collapse:
            field: keyword
          sort:
            - "@timestamp": asc
          size: 10

setup:
  - requires:
      test_runner_features: [ capabilities ]
      capabilities:
        - method: PUT
          path: /{index}
          capabilities: [ columnar_index_modes ]
      cluster_features: [ "mapper.columnar.bare_null_is_absence" ]
      reason: "columnar index mode and bare null handling required"

  - do:
      indices.create:
        index: test
        body:
          settings:
            index.mode: columnar
            index.number_of_shards: 1
            index.mapping.source.mode: synthetic
          mappings:
            properties:
              kwd:
                type: keyword
                index: false
              kwd_indexed:
                type: keyword
                index: true
              txt:
                type: text
              lng:
                type: long
              dt:
                type: date

  - do:
      bulk:
        index: test
        refresh: true
        body:
          - '{ "index": { "_id": "value" } }'
          - '{ "kwd": "a", "kwd_indexed": "a", "txt": "a", "lng": 1, "dt": "2026-01-01T00:00:00.000Z" }'
          - '{ "index": { "_id": "null_in_array" } }'
          - '{ "kwd": [ null ], "kwd_indexed": [ null ], "txt": [ null ], "lng": [ null ], "dt": [ null ] }'
          - '{ "index": { "_id": "only_nulls" } }'
          - '{ "kwd": [ null, null ], "kwd_indexed": [ null, null ], "txt": [ null, null ], "lng": [ null, null ], "dt": [ null, null ] }'
          - '{ "index": { "_id": "mixed" } }'
          - '{ "kwd": [ "a", null, "b" ], "kwd_indexed": [ "a", null, "b" ], "txt": [ "a", null, "b" ], "lng": [ 1, null, 2 ], "dt": [ "2026-01-01T00:00:00.000Z", null, "2026-01-02T00:00:00.000Z" ] }'
          - '{ "index": { "_id": "bare_null" } }'
          - '{ "kwd": null, "kwd_indexed": null, "txt": null, "lng": null, "dt": null }'
          - '{ "index": { "_id": "empty_array" } }'
          - '{ "kwd": [], "kwd_indexed": [], "txt": [], "lng": [], "dt": [] }'
          - '{ "index": { "_id": "missing" } }'
          - '{ "other": "c" }'
          - '{ "index": { "_id": "leading_null" } }'
          - '{ "kwd": [ null, "a" ], "kwd_indexed": [ null, "a" ], "txt": [ null, "a" ], "lng": [ null, 1 ], "dt": [ null, "2026-01-01T00:00:00.000Z" ] }'
          - '{ "index": { "_id": "trailing_null" } }'
          - '{ "kwd": [ "a", null ], "kwd_indexed": [ "a", null ], "txt": [ "a", null ], "lng": [ 1, null ], "dt": [ "2026-01-01T00:00:00.000Z", null ] }'
          - '{ "index": { "_id": "both_ends_null" } }'
          - '{ "kwd": [ null, "a", null ], "kwd_indexed": [ null, "a", null ], "txt": [ null, "a", null ], "lng": [ null, 1, null ], "dt": [ null, "2026-01-01T00:00:00.000Z", null ] }'

---
exists in the default index mode matches only documents with a non-null value:
  - do:
      indices.create:
        index: control
        body:
          settings:
            index.number_of_shards: 1
          mappings:
            properties:
              kwd:
                type: keyword
              lng:
                type: long

  - do:
      bulk:
        index: control
        refresh: true
        body:
          - '{ "index": { "_id": "value" } }'
          - '{ "kwd": "a", "lng": 1 }'
          - '{ "index": { "_id": "null_in_array" } }'
          - '{ "kwd": [ null ], "lng": [ null ] }'
          - '{ "index": { "_id": "only_nulls" } }'
          - '{ "kwd": [ null, null ], "lng": [ null, null ] }'
          - '{ "index": { "_id": "mixed" } }'
          - '{ "kwd": [ "a", null, "b" ], "lng": [ 1, null, 2 ] }'
          - '{ "index": { "_id": "bare_null" } }'
          - '{ "kwd": null, "lng": null }'
          - '{ "index": { "_id": "empty_array" } }'
          - '{ "kwd": [], "lng": [] }'
          - '{ "index": { "_id": "missing" } }'
          - '{ "other": "c" }'
          - '{ "index": { "_id": "leading_null" } }'
          - '{ "kwd": [ null, "a" ], "lng": [ null, 1 ] }'
          - '{ "index": { "_id": "trailing_null" } }'
          - '{ "kwd": [ "a", null ], "lng": [ 1, null ] }'
          - '{ "index": { "_id": "both_ends_null" } }'
          - '{ "kwd": [ null, "a", null ], "lng": [ null, 1, null ] }'

  - do:
      search:
        index: control
        body:
          query: { exists: { field: kwd } }
          sort: [ _doc ]
          track_total_hits: true
          _source: false

  - match: { hits.total.value: 5 }
  - length: { hits.hits: 5 }
  - match: { hits.hits.0._id: value }
  - match: { hits.hits.1._id: mixed }
  - match: { hits.hits.2._id: leading_null }
  - match: { hits.hits.3._id: trailing_null }
  - match: { hits.hits.4._id: both_ends_null }

  - do:
      search:
        index: control
        body:
          query: { exists: { field: lng } }
          sort: [ _doc ]
          track_total_hits: true
          _source: false

  - match: { hits.total.value: 5 }
  - length: { hits.hits: 5 }
  - match: { hits.hits.0._id: value }
  - match: { hits.hits.1._id: mixed }
  - match: { hits.hits.2._id: leading_null }
  - match: { hits.hits.3._id: trailing_null }
  - match: { hits.hits.4._id: both_ends_null }

  - do:
      count:
        index: control
        body:
          query: { exists: { field: kwd } }

  - match: { count: 5 }

  - do:
      count:
        index: control
        body:
          query: { exists: { field: lng } }

  - match: { count: 5 }

---
exists matches only documents with a non-null value on a keyword field without an index:
  - skip:
      awaits_fix: "https://github.com/elastic/elasticsearch/issues/165521"
      reason: "exists matches documents that hold only nulls"

  - do:
      search:
        index: test
        body:
          query: { exists: { field: kwd } }
          sort: [ _doc ]
          track_total_hits: true
          _source: false

  - match: { hits.total.value: 5 }
  - length: { hits.hits: 5 }
  - match: { hits.hits.0._id: value }
  - match: { hits.hits.1._id: mixed }
  - match: { hits.hits.2._id: leading_null }
  - match: { hits.hits.3._id: trailing_null }
  - match: { hits.hits.4._id: both_ends_null }

  - do:
      count:
        index: test
        body:
          query: { exists: { field: kwd } }

  - match: { count: 5 }

  - do:
      count:
        index: test
        body:
          query: { bool: { must_not: { exists: { field: kwd } } } }

  - match: { count: 5 }


---
value_count and missing aggregations treat documents with only nulls as having no keyword value:
  - do:
      search:
        index: test
        body:
          size: 0
          aggs:
            values: { value_count: { field: kwd } }
            without: { missing: { field: kwd } }

  - match: { aggregations.values.value: 6 }
  - match: { aggregations.without.doc_count: 5 }


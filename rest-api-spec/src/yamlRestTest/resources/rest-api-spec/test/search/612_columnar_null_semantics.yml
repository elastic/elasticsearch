---
exists count stays the same after a deletion and a merge on string fields:
  - skip:
      awaits_fix: "https://github.com/elastic/elasticsearch/issues/165521"
      reason: "exists matches documents that hold only nulls"

  - do:
      count:
        index: test
        body:
          query: { exists: { field: kwd_indexed } }

  - match: { count: 5 }

  - do:
      count:
        index: test
        body:
          query: { exists: { field: txt } }

  - match: { count: 5 }

  - do:
      delete:
        index: test
        id: missing
        refresh: true

  - do:
      count:
        index: test
        body:
          query: { exists: { field: kwd_indexed } }

  - match: { count: 5 }

  - do:
      count:
        index: test
        body:
          query: { exists: { field: txt } }

  - match: { count: 5 }

  - do:
      indices.forcemerge:
        index: test
        max_num_segments: 1

  - do:
      count:
        index: test
        body:
          query: { exists: { field: kwd_indexed } }

  - match: { count: 5 }

  - do:
      count:
        index: test
        body:
          query: { exists: { field: txt } }

  - match: { count: 5 }

---
sort puts documents with only nulls among the documents with no keyword value:
  - do:
      search:
        index: test
        body:
          query: { match_all: {} }
          sort: [ { kwd: { missing: _first } }, _doc ]
          _source: false

  - match: { hits.hits.0._id: null_in_array }
  - match: { hits.hits.1._id: only_nulls }
  - match: { hits.hits.2._id: bare_null }
  - match: { hits.hits.3._id: empty_array }
  - match: { hits.hits.4._id: missing }
  - match: { hits.hits.5._id: value }
  - match: { hits.hits.6._id: mixed }
  - match: { hits.hits.7._id: leading_null }
  - match: { hits.hits.8._id: trailing_null }
  - match: { hits.hits.9._id: both_ends_null }


setup:
  - requires:
      test_runner_features: [ capabilities ]
      capabilities:
        - method: PUT
          path: /{index}
          capabilities: [ columnar_index_modes ]
      cluster_features: [ "mapper.columnar.bare_null_is_absence" ]
      reason: "columnar index mode and bare null handling required"

  - do:
      indices.create:
        index: test
        body:
          settings:
            index.mode: columnar
            index.number_of_shards: 1
            index.mapping.source.mode: synthetic
            index.batch_indexing: false
          mappings:
            properties:
              kwd_indexed:
                type: keyword
                index: true
              lng:
                type: long

  - do:
      bulk:
        index: test
        refresh: true
        body:
          - '{ "index": { "_id": "value" } }'
          - '{ "kwd_indexed": "a", "lng": 1 }'
          - '{ "index": { "_id": "null_in_array" } }'
          - '{ "kwd_indexed": [ null ], "lng": [ null ] }'
          - '{ "index": { "_id": "only_nulls" } }'
          - '{ "kwd_indexed": [ null, null ], "lng": [ null, null ] }'
          - '{ "index": { "_id": "mixed" } }'
          - '{ "kwd_indexed": [ "a", null, "b" ], "lng": [ 1, null, 2 ] }'
          - '{ "index": { "_id": "bare_null" } }'
          - '{ "kwd_indexed": null, "lng": null }'
          - '{ "index": { "_id": "empty_array" } }'
          - '{ "kwd_indexed": [], "lng": [] }'
          - '{ "index": { "_id": "missing" } }'
          - '{ "other": "c" }'
          - '{ "index": { "_id": "leading_null" } }'
          - '{ "kwd_indexed": [ null, "a" ], "lng": [ null, 1 ] }'
          - '{ "index": { "_id": "trailing_null" } }'
          - '{ "kwd_indexed": [ "a", null ], "lng": [ 1, null ] }'
          - '{ "index": { "_id": "both_ends_null" } }'
          - '{ "kwd_indexed": [ null, "a", null ], "lng": [ null, 1, null ] }'

---
exists matches only documents with a non-null value on an indexed keyword field:
  - skip:
      awaits_fix: "https://github.com/elastic/elasticsearch/issues/165521"
      reason: "exists matches documents that hold only nulls"

  - do:
      search:
        index: test
        body:
          query: { exists: { field: kwd_indexed } }
          sort: [ _doc ]
          track_total_hits: true
          _source: false

  - match: { hits.total.value: 5 }
  - length: { hits.hits: 5 }
  - match: { hits.hits.0._id: value }
  - match: { hits.hits.1._id: mixed }
  - match: { hits.hits.2._id: leading_null }
  - match: { hits.hits.3._id: trailing_null }
  - match: { hits.hits.4._id: both_ends_null }

  - do:
      count:
        index: test
        body:
          query: { exists: { field: kwd_indexed } }

  - match: { count: 5 }

---
exists matches only documents with a non-null value on a long field:
  - do:
      search:
        index: test
        body:
          query: { exists: { field: lng } }
          sort: [ _doc ]
          track_total_hits: true
          _source: false

  - match: { hits.total.value: 5 }
  - length: { hits.hits: 5 }
  - match: { hits.hits.0._id: value }
  - match: { hits.hits.1._id: mixed }
  - match: { hits.hits.2._id: leading_null }
  - match: { hits.hits.3._id: trailing_null }
  - match: { hits.hits.4._id: both_ends_null }

  - do:
      count:
        index: test
        body:
          query: { exists: { field: lng } }

  - match: { count: 5 }

---
synthetic source drops the null elements of an indexed keyword field:
  - skip:
      awaits_fix: "https://github.com/elastic/elasticsearch/issues/ISSUE_TO_BE_FILED"
      reason: "synthetic source keeps null array elements today, and the proposed rule drops them at indexing"

  - do:
      search:
        index: test
        body:
          query: { match_all: {} }
          sort: [ _doc ]
          _source: kwd_indexed

  - length: { hits.hits: 10 }
  - match: { hits.hits.0._source.kwd_indexed: a }
  - match: { hits.hits.1._source: {} }
  - match: { hits.hits.2._source: {} }
  - match: { hits.hits.3._source.kwd_indexed: [ a, b ] }
  - match: { hits.hits.4._source: {} }
  - match: { hits.hits.5._source: {} }
  - match: { hits.hits.6._source: {} }
  - match: { hits.hits.7._source.kwd_indexed: a }
  - match: { hits.hits.8._source.kwd_indexed: a }
  - match: { hits.hits.9._source.kwd_indexed: a }

---
synthetic source drops the null elements of a long field:
  - skip:
      awaits_fix: "https://github.com/elastic/elasticsearch/issues/ISSUE_TO_BE_FILED"
      reason: "synthetic source keeps null array elements today, and the proposed rule drops them at indexing"

  - do:
      search:
        index: test
        body:
          query: { match_all: {} }
          sort: [ _doc ]
          _source: lng

  - length: { hits.hits: 10 }
  - match: { hits.hits.0._source.lng: 1 }
  - match: { hits.hits.1._source: {} }
  - match: { hits.hits.2._source: {} }
  - match: { hits.hits.3._source.lng: [ 1, 2 ] }
  - match: { hits.hits.4._source: {} }
  - match: { hits.hits.5._source: {} }
  - match: { hits.hits.6._source: {} }
  - match: { hits.hits.7._source.lng: 1 }
  - match: { hits.hits.8._source.lng: 1 }
  - match: { hits.hits.9._source.lng: 1 }

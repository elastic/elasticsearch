setup:
  - requires:
      test_runner_features: [ capabilities ]
      capabilities:
        - method: PUT
          path: /{index}
          capabilities: [ columnar_index_modes ]
      cluster_features: [ "mapper.columnar.bare_null_is_absence" ]
      reason: "columnar index mode and bare null handling required"

  - do:
      indices.create:
        index: test
        body:
          settings:
            index.mode: columnar
            index.number_of_shards: 1
          mappings:
            properties:
              obj:
                properties:
                  kwd:
                    type: keyword
                  lng:
                    type: long

  - do:
      bulk:
        index: test
        refresh: true
        body:
          - '{ "index": { "_id": "value" } }'
          - '{ "obj": { "kwd": "a", "lng": 1 } }'
          - '{ "index": { "_id": "bare_null" } }'
          - '{ "obj": { "kwd": null, "lng": null } }'
          - '{ "index": { "_id": "objects_null_then_value" } }'
          - '{ "obj": [ { "kwd": null, "lng": null }, { "kwd": "a", "lng": 1 } ] }'
          - '{ "index": { "_id": "objects_null_only" } }'
          - '{ "obj": [ { "kwd": null, "lng": null } ] }'
          - '{ "index": { "_id": "field_array_null" } }'
          - '{ "obj": { "kwd": [ null ], "lng": [ null ] } }'
          - '{ "index": { "_id": "missing" } }'
          - '{ "other": "c" }'

---
exists matches only objects with a non-null keyword value:
  - skip:
      awaits_fix: "https://github.com/elastic/elasticsearch/issues/165521"
      reason: "exists matches documents that hold only nulls"

  - do:
      search:
        index: test
        body:
          query: { exists: { field: obj.kwd } }
          sort: [ _doc ]
          track_total_hits: true
          _source: false

  - match: { hits.total.value: 2 }
  - length: { hits.hits: 2 }
  - match: { hits.hits.0._id: value }
  - match: { hits.hits.1._id: objects_null_then_value }

---
exists matches only objects with a non-null long value:
  - do:
      search:
        index: test
        body:
          query: { exists: { field: obj.lng } }
          sort: [ _doc ]
          track_total_hits: true
          _source: false

  - match: { hits.total.value: 2 }
  - length: { hits.hits: 2 }
  - match: { hits.hits.0._id: value }
  - match: { hits.hits.1._id: objects_null_then_value }

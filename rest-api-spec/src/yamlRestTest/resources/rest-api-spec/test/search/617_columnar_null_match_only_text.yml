---
synthetic source keeps every null slot of a match_only_text field:
  - do:
      search:
        index: test
        body:
          query: { match_all: {} }
          sort: [ _doc ]
          _source: mot

  - length: { hits.hits: 10 }
  - match: { hits.hits.0._source.mot: a }
  - match: { hits.hits.1._source.mot: [ null ] }
  - match: { hits.hits.2._source.mot: [ null, null ] }
  - match: { hits.hits.3._source.mot: [ a, null, b ] }
  - match: { hits.hits.4._source: {} }
  - match: { hits.hits.5._source: {} }
  - match: { hits.hits.6._source: {} }
  - match: { hits.hits.7._source.mot: [ null, a ] }
  - match: { hits.hits.8._source.mot: [ a, null ] }
  - match: { hits.hits.9._source.mot: [ null, a, null ] }

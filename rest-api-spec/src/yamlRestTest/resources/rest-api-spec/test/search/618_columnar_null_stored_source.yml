                dbl:
                  type: double
                dn:
                  type: date_nanos
                bin:
                  type: binary
                sf:
                  type: scaled_float
                  scaling_factor: 100
                mot:
                  type: match_only_text
                geo:
                  type: geo_point
                other:
                  type: keyword

  - do:
      indices.create:
        index: stored_source_rows

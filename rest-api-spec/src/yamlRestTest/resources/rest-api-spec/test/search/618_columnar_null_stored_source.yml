setup:
  - requires:
      test_runner_features: [ capabilities ]
      capabilities:
        - method: PUT
          path: /{index}
          capabilities: [ columnar_index_modes ]
      cluster_features: [ "mapper.columnar.bare_null_is_absence", "mapper.columnar.doc_values_no_op" ]
      reason: "columnar index mode, bare null handling and the index.batch_indexing setting required"

  - do:
      indices.create:
        index: synthetic_source
        body:
          settings:
            index.mode: columnar
            index.number_of_shards: 1
            index.mapping.source.mode: synthetic
          mappings:
            properties:
                kwd:
                  type: keyword
                txt:
                  type: text
                lng:
                  type: long
                dt:
                  type: date
                addr:
                  type: ip
                flag:
                  type: boolean
                byt:
                  type: byte
                shrt:
                  type: short
                intg:
                  type: integer
                hf:
                  type: half_float
                flt:
                  type: float
                dbl:
                  type: double
                dn:
                  type: date_nanos
                bin:
                  type: binary
                sf:
                  type: scaled_float
                  scaling_factor: 100
                mot:
                  type: match_only_text
                geo:
                  type: geo_point
                other:
                  type: keyword

  - do:
      indices.create:
        index: stored_source
        body:
          settings:
            index.mode: columnar
            index.number_of_shards: 1
            index.mapping.source.mode: columnar_stored

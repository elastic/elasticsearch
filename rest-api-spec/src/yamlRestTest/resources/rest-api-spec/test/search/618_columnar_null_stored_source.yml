---
columnar_stored returns the same source as synthetic for every field type on both indexing paths:
  - do:
      search:
        index: synthetic_source
        filter_path: hits.hits._source
        body:
          query: { match_all: {} }
          sort: [ _doc ]

  - length: { hits.hits: 10 }
  - set: { hits.hits: synthetic_sources }

  - do:
      search:
        index: stored_source
        filter_path: hits.hits._source
        body:
          query: { match_all: {} }
          sort: [ _doc ]

  - match: { hits.hits: $synthetic_sources }

  - do:
      search:
        index: stored_source_rows
        filter_path: hits.hits._source
        body:
          query: { match_all: {} }
          sort: [ _doc ]

  - match: { hits.hits: $synthetic_sources }


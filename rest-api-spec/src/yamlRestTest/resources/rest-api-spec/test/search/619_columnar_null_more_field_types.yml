---
value_count and missing aggregations treat documents with only nulls as having no value:
  - do:
      search:
        index: test
        body:
          size: 0
          aggs:
            values_byt: { value_count: { field: byt } }
            without_byt: { missing: { field: byt } }
            values_sht: { value_count: { field: sht } }
            without_sht: { missing: { field: sht } }
            values_int: { value_count: { field: int } }
            without_int: { missing: { field: int } }
            values_hfl: { value_count: { field: hfl } }
            without_hfl: { missing: { field: hfl } }
            values_flt: { value_count: { field: flt } }
            without_flt: { missing: { field: flt } }
            values_dbl: { value_count: { field: dbl } }
            without_dbl: { missing: { field: dbl } }
            values_sfl: { value_count: { field: sfl } }
            without_sfl: { missing: { field: sfl } }
            values_dtn: { value_count: { field: dtn } }
            without_dtn: { missing: { field: dtn } }
            values_bin: { value_count: { field: bin } }
            without_bin: { missing: { field: bin } }

  - match: { aggregations.values_byt.value: 6 }
  - match: { aggregations.without_byt.doc_count: 5 }
  - match: { aggregations.values_sht.value: 6 }
  - match: { aggregations.without_sht.doc_count: 5 }
  - match: { aggregations.values_int.value: 6 }
  - match: { aggregations.without_int.doc_count: 5 }
  - match: { aggregations.values_hfl.value: 6 }
  - match: { aggregations.without_hfl.doc_count: 5 }
  - match: { aggregations.values_flt.value: 6 }
  - match: { aggregations.without_flt.doc_count: 5 }
  - match: { aggregations.values_dbl.value: 6 }
  - match: { aggregations.without_dbl.doc_count: 5 }
  - match: { aggregations.values_sfl.value: 6 }
  - match: { aggregations.without_sfl.doc_count: 5 }
  - match: { aggregations.values_dtn.value: 6 }
  - match: { aggregations.without_dtn.doc_count: 5 }
  - match: { aggregations.values_bin.value: 6 }
  - match: { aggregations.without_bin.doc_count: 5 }


setup:
  - requires:
      test_runner_features: [ capabilities ]
      capabilities:
        - method: PUT
          path: /{index}
          capabilities: [ columnar_index_modes ]
      cluster_features: [ "mapper.columnar.bare_null_is_absence" ]
      reason: "columnar index mode and bare null handling required"

  - do:
      indices.create:
        index: test
        body:
          settings:
            index.mode: columnar
            index.number_of_shards: 1
            index.mapping.source.mode: synthetic
          mappings:
            properties:
              byt:
                type: byte
              sht:
                type: short
              int:
                type: integer
              hfl:
                type: half_float
              flt:
                type: float
              dbl:
                type: double
              sfl:
                type: scaled_float
                scaling_factor: 10
              dtn:
                type: date_nanos
              bin:
                type: binary
                doc_values: true

  - do:
      bulk:
        index: test
        refresh: true
        body:
          - '{ "index": { "_id": "value" } }'
          - '{ "byt": 1, "sht": 1, "int": 1, "hfl": 1.5, "flt": 1.5, "dbl": 1.5, "sfl": 1.5, "dtn": "2026-01-01T00:00:00.000Z", "bin": "YQ==" }'
          - '{ "index": { "_id": "null_in_array" } }'
          - '{ "byt": [null], "sht": [null], "int": [null], "hfl": [null], "flt": [null], "dbl": [null], "sfl": [null], "dtn": [null], "bin": [null] }'
          - '{ "index": { "_id": "only_nulls" } }'
          - '{ "byt": [null, null], "sht": [null, null], "int": [null, null], "hfl": [null, null], "flt": [null, null], "dbl": [null, null], "sfl": [null, null], "dtn": [null, null], "bin": [null, null] }'
          - '{ "index": { "_id": "mixed" } }'
          - '{ "byt": [1, null, 2], "sht": [1, null, 2], "int": [1, null, 2], "hfl": [1.5, null, 2.5], "flt": [1.5, null, 2.5], "dbl": [1.5, null, 2.5], "sfl": [1.5, null, 2.5], "dtn": ["2026-01-01T00:00:00.000Z", null, "2026-01-02T00:00:00.000Z"], "bin": ["YQ==", null, "Yg=="] }'
          - '{ "index": { "_id": "bare_null" } }'
          - '{ "byt": null, "sht": null, "int": null, "hfl": null, "flt": null, "dbl": null, "sfl": null, "dtn": null, "bin": null }'
          - '{ "index": { "_id": "empty_array" } }'
          - '{ "byt": [], "sht": [], "int": [], "hfl": [], "flt": [], "dbl": [], "sfl": [], "dtn": [], "bin": [] }'
          - '{ "index": { "_id": "missing" } }'
          - '{ "other": "c" }'
          - '{ "index": { "_id": "leading_null" } }'
          - '{ "byt": [null, 1], "sht": [null, 1], "int": [null, 1], "hfl": [null, 1.5], "flt": [null, 1.5], "dbl": [null, 1.5], "sfl": [null, 1.5], "dtn": [null, "2026-01-01T00:00:00.000Z"], "bin": [null, "YQ=="] }'
          - '{ "index": { "_id": "trailing_null" } }'
          - '{ "byt": [1, null], "sht": [1, null], "int": [1, null], "hfl": [1.5, null], "flt": [1.5, null], "dbl": [1.5, null], "sfl": [1.5, null], "dtn": ["2026-01-01T00:00:00.000Z", null], "bin": ["YQ==", null] }'
          - '{ "index": { "_id": "both_ends_null" } }'
          - '{ "byt": [null, 1, null], "sht": [null, 1, null], "int": [null, 1, null], "hfl": [null, 1.5, null], "flt": [null, 1.5, null], "dbl": [null, 1.5, null], "sfl": [null, 1.5, null], "dtn": [null, "2026-01-01T00:00:00.000Z", null], "bin": [null, "YQ==", null] }'

---
exists matches only documents with a non-null value on a byte field:
  - do:
      search:
        index: test
        body:
          query: { exists: { field: byt } }
          sort: [ _doc ]
          track_total_hits: true
          _source: false

  - match: { hits.total.value: 5 }
  - length: { hits.hits: 5 }
  - match: { hits.hits.0._id: value }
  - match: { hits.hits.1._id: mixed }
  - match: { hits.hits.2._id: leading_null }
  - match: { hits.hits.3._id: trailing_null }
  - match: { hits.hits.4._id: both_ends_null }

  - do:
      count:
        index: test
        body:
          query: { exists: { field: byt } }

  - match: { count: 5 }

  - do:
      count:
        index: test
        body:
          query: { bool: { must_not: { exists: { field: byt } } } }

  - match: { count: 5 }


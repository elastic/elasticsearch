          - '{ "index": { "_index": "standard_ship", "_id": "tantive_iv" } }'
          - '{ "crew": { "passengers": [ "princess leia", "luke skywalker" ], "copilot": "chewbacca" } }'
          - '{ "index": { "_index": "columnar_ship", "_id": "millennium_falcon" } }'
          - '{ "crew": { "pilot": "han solo", "copilot": "chewbacca" } }'
          - '{ "index": { "_index": "columnar_ship", "_id": "x_wing" } }'
          - '{ "crew": { "pilot": "luke skywalker", "droid": [ "r2-d2", "r2-d2" ] } }'
          - '{ "index": { "_index": "columnar_ship", "_id": "tantive_iv" } }'

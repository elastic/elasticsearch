setup:
  - requires:
      test_runner_features: [ capabilities ]
      capabilities:
        - method: PUT
          path: /{index}
          capabilities: [ columnar_index_modes ]
      cluster_features: [ "mapper.flattened.columnar_root_values" ]
      reason: "columnar index mode and the flattened root values fix required"

  - do:
      indices.create:
        index: standard_ship
        body:
          settings:
            index.number_of_shards: 1
          mappings:
            properties:
              crew:
                type: flattened

  - do:
      indices.create:
        index: columnar_ship
        body:
          settings:
            index.mode: columnar
            index.number_of_shards: 1
          mappings:
            properties:
              crew:
                type: flattened

---
one slot, one role:
  - do:
      bulk:
        refresh: true
        body:
          - '{ "index": { "_index": "standard_ship", "_id": "millennium_falcon" } }'
          - '{ "crew": { "pilot": "han solo" } }'
          - '{ "index": { "_index": "columnar_ship", "_id": "millennium_falcon" } }'
          - '{ "crew": { "pilot": "han solo" } }'

  - is_false: errors

  - do:
      search:
        index: standard_ship
        body: { size: 0, aggs: { crew_members: { value_count: { field: crew } }, crew_names: { terms: { field: crew } } } }
  - set: { aggregations.crew_members.value: expected_count }
  - set: { aggregations.crew_names.buckets: expected_names }

  - do:
      search:
        index: columnar_ship
        body: { size: 0, aggs: { crew_members: { value_count: { field: crew } }, crew_names: { terms: { field: crew } } } }
  - match: { aggregations.crew_members.value: $expected_count }
  - match: { aggregations.crew_names.buckets: $expected_names }


  - is_false: errors

  - do:
      search:
        index: standard_ship
        body: { size: 0, aggs: { crew_members: { value_count: { field: crew } }, crew_names: { terms: { field: crew } } } }
  - set: { aggregations.crew_members.value: expected_count }
  - set: { aggregations.crew_names.buckets: expected_names }
  - match: { aggregations.crew_members.value: 7 }
  - length: { aggregations.crew_names.buckets: 5 }
  - match: { aggregations.crew_names.buckets.0.key: chewbacca }
  - match: { aggregations.crew_names.buckets.0.doc_count: 2 }
  - match: { aggregations.crew_names.buckets.1.key: luke skywalker }
  - match: { aggregations.crew_names.buckets.1.doc_count: 2 }

  - do:
      search:
        index: columnar_ship
        body: { size: 0, aggs: { crew_members: { value_count: { field: crew } }, crew_names: { terms: { field: crew } } } }
  - match: { aggregations.crew_members.value: $expected_count }
  - match: { aggregations.crew_names.buckets: $expected_names }

---
sort and docvalue_fields on the root field:
  - do:
      bulk:
        refresh: true
        body:
          - '{ "index": { "_index": "standard_ship", "_id": "millennium_falcon" } }'
          - '{ "crew": { "pilot": "han solo", "copilot": "chewbacca" } }'
          - '{ "index": { "_index": "standard_ship", "_id": "x_wing" } }'
          - '{ "crew": { "pilot": "luke skywalker", "droid": [ "r2-d2", "r2-d2" ] } }'
          - '{ "index": { "_index": "standard_ship", "_id": "tantive_iv" } }'
          - '{ "crew": { "passengers": [ "princess leia", "luke skywalker" ], "copilot": "chewbacca" } }'
          - '{ "index": { "_index": "columnar_ship", "_id": "millennium_falcon" } }'
          - '{ "crew": { "pilot": "han solo", "copilot": "chewbacca" } }'
          - '{ "index": { "_index": "columnar_ship", "_id": "x_wing" } }'
          - '{ "crew": { "pilot": "luke skywalker", "droid": [ "r2-d2", "r2-d2" ] } }'
          - '{ "index": { "_index": "columnar_ship", "_id": "tantive_iv" } }'
          - '{ "crew": { "passengers": [ "princess leia", "luke skywalker" ], "copilot": "chewbacca" } }'

  - is_false: errors

  - do:
      search:
        index: standard_ship
        filter_path: hits.hits._id,hits.hits.sort,hits.hits.fields
        body: { _source: false, docvalue_fields: [ crew ], sort: [ { crew: { order: asc, mode: max } }, { _doc: asc } ] }
  - set: { hits.hits: expected_hits }
  - length: { hits.hits: 3 }

  - do:
      search:
        index: columnar_ship
        filter_path: hits.hits._id,hits.hits.sort,hits.hits.fields
        body: { _source: false, docvalue_fields: [ crew ], sort: [ { crew: { order: asc, mode: max } }, { _doc: asc } ] }
  - match: { hits.hits: $expected_hits }

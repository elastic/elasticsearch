setup:
  - requires:
      test_runner_features: [ capabilities ]
      capabilities:
        - method: PUT
          path: /{index}
          capabilities: [ columnar_index_modes ]
      cluster_features: [ "mapper.flattened.columnar_root_values" ]
      reason: "columnar index mode and the flattened root values fix required"

  - do:
      indices.create:
        index: columnar_ship
        body:
          settings:
            index.mode: columnar
            index.number_of_shards: 1
          mappings:
            properties:
              crew:
                type: flattened

---
one slot per document:
  - do:
      bulk:
        refresh: true
        body:
          - '{ "index": { "_index": "columnar_ship", "_id": "millennium_falcon" } }'
          - '{ "crew": { "pilot": "han solo" } }'
          - '{ "index": { "_index": "columnar_ship", "_id": "dagobah_x_wing" } }'
          - '{ "crew": { "motto": "Do or do not. There is no try. Fear is the path to the dark side. Fear leads to anger. Anger leads to hate. Hate leads to suffering. Always in motion is the future." } }'
          - '{ "index": { "_index": "columnar_ship", "_id": "tantive_iv" } }'
          - '{ "crew": { "passengers": [ "princess leia" ] } }'
          - '{ "index": { "_index": "columnar_ship", "_id": "x_wing" } }'
          - '{ "crew": { "droid": "r2-d2" } }'

  - is_false: errors

  - do:
      search:
        index: columnar_ship
        body: { size: 0, aggs: { crew_members: { value_count: { field: crew } }, crew_names: { terms: { field: crew } } } }
  - match: { aggregations.crew_members.value: 4 }
  - match: { aggregations.crew_names.buckets: [ { key: "Do or do not. There is no try. Fear is the path to the dark side. Fear leads to anger. Anger leads to hate. Hate leads to suffering. Always in motion is the future.", doc_count: 1 }, { key: han solo, doc_count: 1 }, { key: princess leia, doc_count: 1 }, { key: r2-d2, doc_count: 1 } ] }

---
two slots, two roles with one value each:
  - do:
      bulk:
        refresh: true
        body:
          - '{ "index": { "_index": "columnar_ship", "_id": "millennium_falcon" } }'
          - '{ "crew": { "pilot": "han solo", "copilot": "chewbacca" } }'

  - is_false: errors

  - do:
      search:
        index: columnar_ship
        body: { size: 0, aggs: { crew_members: { value_count: { field: crew } }, crew_names: { terms: { field: crew } } } }
  - match: { aggregations.crew_members.value: 2 }
  - match: { aggregations.crew_names.buckets: [ { key: chewbacca, doc_count: 1 }, { key: han solo, doc_count: 1 } ] }

---
two slots, one role with two values:
  - do:
      bulk:
        refresh: true
        body:
          - '{ "index": { "_index": "columnar_ship", "_id": "millennium_falcon" } }'
          - '{ "crew": { "passengers": [ "luke skywalker", "princess leia" ] } }'

  - is_false: errors

  - do:
      search:
        index: columnar_ship
        body: { size: 0, aggs: { crew_members: { value_count: { field: crew } }, crew_names: { terms: { field: crew } } } }
  - match: { aggregations.crew_members.value: 2 }
  - match: { aggregations.crew_names.buckets: [ { key: luke skywalker, doc_count: 1 }, { key: princess leia, doc_count: 1 } ] }

---
the same value under several documents and keys:
  - do:
      bulk:
        refresh: true
        body:
          - '{ "index": { "_index": "columnar_ship", "_id": "millennium_falcon" } }'
          - '{ "crew": { "pilot": "han solo", "copilot": "chewbacca" } }'
          - '{ "index": { "_index": "columnar_ship", "_id": "x_wing" } }'
          - '{ "crew": { "pilot": "luke skywalker", "droid": [ "r2-d2", "r2-d2" ] } }'
          - '{ "index": { "_index": "columnar_ship", "_id": "tantive_iv" } }'
          - '{ "crew": { "passengers": [ "princess leia", "luke skywalker" ], "copilot": "chewbacca" } }'

  - is_false: errors

  - do:
      search:
        index: columnar_ship
        body: { size: 0, aggs: { crew_members: { value_count: { field: crew } }, crew_names: { terms: { field: crew } } } }
  - match: { aggregations.crew_members.value: 7 }
  - match: { aggregations.crew_names.buckets: [ { key: chewbacca, doc_count: 2 }, { key: luke skywalker, doc_count: 2 }, { key: han solo, doc_count: 1 }, { key: princess leia, doc_count: 1 }, { key: r2-d2, doc_count: 1 } ] }

---
sort and docvalue_fields on the root field:
  - do:
      bulk:
        refresh: true
        body:
          - '{ "index": { "_index": "columnar_ship", "_id": "millennium_falcon" } }'
          - '{ "crew": { "pilot": "han solo", "copilot": "chewbacca" } }'
          - '{ "index": { "_index": "columnar_ship", "_id": "x_wing" } }'
          - '{ "crew": { "pilot": "luke skywalker", "droid": [ "r2-d2", "r2-d2" ] } }'
          - '{ "index": { "_index": "columnar_ship", "_id": "tantive_iv" } }'
          - '{ "crew": { "passengers": [ "princess leia", "luke skywalker" ], "copilot": "chewbacca" } }'

  - is_false: errors

  - do:
      search:
        index: columnar_ship
        filter_path: hits.hits._id,hits.hits.sort,hits.hits.fields
        body: { _source: false, docvalue_fields: [ crew ], sort: [ { crew: { order: asc, mode: max } }, { _doc: asc } ] }
  - match:
      hits.hits:
        - { _id: millennium_falcon, sort: [ han solo, 0 ], fields: { crew: [ chewbacca, han solo ] } }
        - { _id: tantive_iv, sort: [ princess leia, 2 ], fields: { crew: [ chewbacca, luke skywalker, princess leia ] } }
        - { _id: x_wing, sort: [ r2-d2, 1 ], fields: { crew: [ luke skywalker, r2-d2 ] } }

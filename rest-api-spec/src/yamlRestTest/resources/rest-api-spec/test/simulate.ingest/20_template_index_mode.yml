---
"Simulate with a logsdb template that has no mappings":
  - requires:
      test_runner_features: [ allowed_warnings, headers ]
      cluster_features: [ "mapper.columnar.template_mode_validation_fix" ]
      reason: "simulate validates the mappings with the index mode of the template"

  # Index creation adds the default mapping of logsdb, which requires @timestamp, even when the template has no mappings.
  - do:
      allowed_warnings:
        - "index template [logsdb-sim-template] has index patterns [logsdb-sim*] matching patterns from existing older templates [global] with patterns (global => [*]); this template [logsdb-sim-template] will take precedence during new index creation"
      indices.put_index_template:
        name: logsdb-sim-template
        body:
          index_patterns: [ "logsdb-sim*" ]
          template:
            settings:
              index.mode: logsdb

  - do:
      headers:
        Content-Type: application/json
      simulate.ingest:
        body: >
          {
            "docs": [
              { "_index": "logsdb-sim-index", "_id": "1", "_source": { "message": "no timestamp" } }
            ]
          }
  - length: { docs: 1 }
  - match: { docs.0.doc.error.reason: "/.*data\\ stream\\ timestamp\\ field\\ \\[@timestamp\\]\\ is\\ missing.*/" }

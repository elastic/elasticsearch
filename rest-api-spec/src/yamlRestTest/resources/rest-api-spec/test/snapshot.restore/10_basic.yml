---
setup:

  - do:
      snapshot.create_repository:
        repository: test_repo_restore_1
        body:
          type: fs
          settings:
            location: "test_repo_restore_1_loc"

  - do:
      indices.create:
        index: test_index
        body:
          settings:
            number_of_shards:   1
            number_of_replicas: 0

  - do:
      cluster.health:
        wait_for_status: green

---
"Create a snapshot with single index and then restore it":

  - skip:
      features: ["allowed_warnings"]

  - do:
      snapshot.create:
        repository: test_repo_restore_1
        snapshot: test_snapshot_1
        wait_for_completion: true
        body:
          indices: "test_index"
          feature_states: ["none"]

  - match: { snapshot.snapshot: test_snapshot_1 }
  - match: { snapshot.state : SUCCESS }
  - match: { snapshot.shards.successful: 1 }
  - match: { snapshot.shards.failed : 0 }
  - is_true: snapshot.version
  - gt: { snapshot.version_id: 0}

  - do:
      indices.close:
        index : test_index

  - do:
      snapshot.restore:
        repository: test_repo_restore_1
        snapshot: test_snapshot_1
        wait_for_completion: true
        body:
          "index_settings":
            "index.routing.rebalance.enable": "none"

  - do:
      indices.recovery:
        index: test_index

  - match: { test_index.shards.0.type: SNAPSHOT }
  - match: { test_index.shards.0.stage: DONE }
  - match: { test_index.shards.0.index.files.recovered: 1}
  - gt:    { test_index.shards.0.index.size.recovered_in_bytes: 0}
  - match: { test_index.shards.0.index.files.reused: 0}
  - match: { test_index.shards.0.index.size.reused_in_bytes: 0}

---
"Restore over an open index with restore_over_open_index":

  - requires:
      cluster_features: ["indices.recovery.restore_over_open_index_recreates_index_service"]
      reason: "restoring over an open index requires every node to support recreating the index service for the transition"

  - skip:
      features: ["allowed_warnings"]

  - do:
      snapshot.create:
        repository: test_repo_restore_1
        snapshot: test_snapshot_open
        wait_for_completion: true
        body:
          indices: "test_index"
          feature_states: ["none"]

  - match: { snapshot.snapshot: test_snapshot_open }
  - match: { snapshot.state : SUCCESS }

  # note: unlike the other scenarios in this file, test_index is deliberately left open here
  - do:
      snapshot.restore:
        repository: test_repo_restore_1
        snapshot: test_snapshot_open
        wait_for_completion: true
        body:
          indices: "test_index"
          restore_over_open_index: true

  - do:
      indices.recovery:
        index: test_index

  - match: { test_index.shards.0.type: SNAPSHOT }
  - match: { test_index.shards.0.stage: DONE }

  # the index was never closed, so it must still accept ordinary requests once the restore completes
  - do:
      search:
        index: test_index
        body:
          query:
            match_all: {}

---
"Create a snapshot and then restore single index from it":

  - skip:
      features: ["allowed_warnings"]

  - do:
      snapshot.create:
        repository: test_repo_restore_1
        snapshot: test_snapshot_2
        wait_for_completion: true
        body:
          "index_settings":
            "index.routing.rebalance.enable": "none"

  - match: { snapshot.snapshot: test_snapshot_2 }
  - match: { snapshot.state : SUCCESS }
  # snapshot can contain system indices and have shards.successful >=1
  - gt: { snapshot.shards.successful: 0 }
  - match: { snapshot.shards.failed : 0 }
  - is_true: snapshot.version
  - gt: { snapshot.version_id: 0}

  - do:
      indices.close:
        index : test_index

  - do:
      snapshot.restore:
        repository: test_repo_restore_1
        snapshot: test_snapshot_2
        wait_for_completion: true
        body:
          indices: "test_index"

  - do:
      indices.recovery:
        index: test_index

  - match: { test_index.shards.0.type: SNAPSHOT }
  - match: { test_index.shards.0.stage: DONE }
  - match: { test_index.shards.0.index.files.recovered: 1}
  - gt:    { test_index.shards.0.index.size.recovered_in_bytes: 0}
  - match: { test_index.shards.0.index.files.reused: 0}
  - match: { test_index.shards.0.index.size.reused_in_bytes: 0}

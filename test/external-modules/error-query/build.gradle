import org.elasticsearch.gradle.testclusters.StandaloneRestIntegTestTask

apply plugin: 'elasticsearch.internal-yaml-rest-test'
apply plugin: 'elasticsearch.internal-java-rest-test'

esplugin {
  description = 'A test module that exposes a way to simulate search shard failures and warnings'
  classname ='org.elasticsearch.test.errorquery.ErrorQueryPlugin'
}

restResources {
  restApi {
    include '_common', 'indices', 'index', 'cluster', 'search'
  }
}

dependencies {
  clusterModules project(':x-pack:plugin:esql')
  // esql extends eql-action, which extends ql; ql and mapper-version are two levels deep in the extended-plugin
  // chain (esql -> eql-action -> ql -> mapper-version, and esql -> esql-core -> mapper-version), so the rest-test
  // tooling (which only auto-resolves one level) cannot find them. Declare both explicitly or the node won't start.
  clusterModules project(':x-pack:plugin:ql')
  clusterModules project(':x-pack:plugin:mapper-version')
  clusterModules project(':x-pack:plugin:autoscaling')
  clusterModules project(':x-pack:plugin:ilm')
}

tasks.withType(StandaloneRestIntegTestTask).configureEach {
  def isSnapshot = buildParams.snapshotBuild
  onlyIf("snapshot build") { isSnapshot }
}

apply plugin: 'elasticsearch.java'
apply plugin: 'elasticsearch.cache-test-fixtures'
apply plugin: 'elasticsearch.deploy-test-fixtures'

description = 'Testcontainers fixture for old Elasticsearch versions'

def fixtureVersion = '1.0'

dockerFixtures {
  create('old-elasticsearch-5-0-0') {
    dockerContext = project.file('src/main/resources/docker/5.0.0')
    version = fixtureVersion
    baseImages = ['eclipse-temurin:8-jdk']
  }
  create('old-elasticsearch-5-6-16') {
    dockerContext = project.file('src/main/resources/docker/5.6.16')
    version = fixtureVersion
    baseImages = ['eclipse-temurin:8-jdk']
  }
  create('old-elasticsearch-6-0-0') {
    dockerContext = project.file('src/main/resources/docker/6.0.0')
    version = fixtureVersion
    baseImages = ['eclipse-temurin:8-jdk']
  }
  create('old-elasticsearch-6-8-20') {
    dockerContext = project.file('src/main/resources/docker/6.8.20')
    version = fixtureVersion
    baseImages = ['eclipse-temurin:8-jdk']
  }
}

configurations.all {
  exclude group: 'org.hamcrest', module: 'hamcrest-core'
}

dependencies {
  testImplementation project(':test:framework')
  api "junit:junit:${versions.junit}"
  api project(':test:fixtures:testcontainer-utils')
  api("org.testcontainers:testcontainers:${versions.testcontainer}") {
    transitive = false
  }
  api("com.carrotsearch.randomizedtesting:randomizedtesting-runner:${versions.randomizedrunner}") {
    transitive = false
  }

  runtimeOnly "org.slf4j:slf4j-simple:${versions.slf4j}"
  runtimeOnly("org.hamcrest:hamcrest:${versions.hamcrest}")
}

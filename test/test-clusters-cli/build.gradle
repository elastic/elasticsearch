// Command line entrypoint for starting a local Elasticsearch cluster with the test-clusters library outside of a test,
// used by the `run` Gradle tasks. Deliberately kept separate from :test:test-clusters so test authors don't depend on it.
apply plugin: 'elasticsearch.java'

dependencies {
  implementation project(':test:test-clusters')
  implementation "org.apache.logging.log4j:log4j-api:${versions.log4j}"
  runtimeOnly "org.apache.logging.log4j:log4j-core:${versions.log4j}"

  testImplementation "junit:junit:${versions.junit4}"
  testImplementation "org.hamcrest:hamcrest:${versions.hamcrest}"
}

status = error

appender.console.type = Console
appender.console.name = console
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = [cluster-runner] %m%n

rootLogger.level = info
rootLogger.appenderRef.console.ref = console

# Output of CLI tools (keystore, users, plugin install) is captured by the library and is only interesting on failure
logger.process_output.name = process-output
logger.process_output.level = warn

apply plugin: 'elasticsearch.internal-es-plugin'
apply plugin: 'elasticsearch.internal-cluster-test'
apply plugin: 'elasticsearch.internal-java-rest-test'
apply plugin: 'elasticsearch.internal-yaml-rest-test'

esplugin {
  name = 'x-pack-context-engine'
  description = 'Elasticsearch Expanded Pack Plugin - Context Engine'
  classname = 'org.elasticsearch.xpack.contextengine.ContextEnginePlugin'
  extendedPlugins = ['x-pack-core']
}

base {
  archivesName = 'x-pack-context-engine'
}

dependencies {
  compileOnly project(path: xpackModule('core'))
  testImplementation(testArtifact(project(xpackModule('core'))))
  testImplementation project(":test:framework")

  clusterModules project(':modules:data-streams')
  clusterModules project(xpackModule('inference'))
  clusterPlugins project(':x-pack:plugin:inference:qa:test-service-plugin')
}

restResources {
  restApi {
    include '_common', 'cluster', 'context_engine', 'features', 'index', 'indices', 'inference', 'nodes'
  }
}

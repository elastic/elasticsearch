"Context Engine loaded":
    - skip:
          features: contains
    - do:
          cluster.state: {}

    # Get master node id
    - set: { master_node: master }

    - do:
          nodes.info: {}

    - contains:  { nodes.$master.modules: { name: x-pack-context-engine } }

---
"Context Engine feature registered":
    - skip:
          features: contains
    - do:
          features.get_features: {}

    - contains:  { features: { name: context_engine } }

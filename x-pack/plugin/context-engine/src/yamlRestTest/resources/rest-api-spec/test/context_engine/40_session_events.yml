teardown:
  - do:
      features.reset_features: {}

---
"Save event rejects an event without required fields":
  - do:
      catch: bad_request
      context_engine.save_event:
        body:
          session_id: "session-1"
          transcript: "user: hello"

  - match: { status: 400 }
  - match: { error.type: action_request_validation_exception }
  - match: { error.reason: "/.*\\[user_id\\].*\\[agent_id\\].*/" }

---
"Save event stores the event and get returns it newest first":
  - do:
      context_engine.save_event:
        body:
          session_id: "session-1"
          round_id: "round-1"
          user_id: "user-1"
          agent_id: "agent-1"
          space: "default"
          ai_index_id: ["ai-index-1"]
          transcript: "user: hello\nagent: hi"

  - set: { id: first_id }
  - is_true: id
  - is_true: "@timestamp"
  - match: { session_id: "session-1" }
  - match: { round_id: "round-1" }
  - match: { transcript: "user: hello\nagent: hi" }

  - do:
      context_engine.save_event:
        body:
          id: "event-2"
          session_id: "session-1"
          round_id: "round-2"
          user_id: "user-1"
          agent_id: "agent-1"
          space: "default"
          ai_index_id: ["ai-index-2"]
          transcript: "user: thanks\nagent: welcome"

  - match: { id: "event-2" }

  - do:
      context_engine.get_session_events:
        session_id: "session-1"

  - match: { count: 2 }
  - match: { results.0.id: "event-2" }
  - match: { results.0.round_id: "round-2" }
  - match: { results.1.id: $first_id }
  - match: { results.1.round_id: "round-1" }

  - do:
      context_engine.get_session_events:
        session_id: "session-1"
        ai_index_id: "ai-index-1"

  - match: { count: 1 }
  - match: { results.0.id: $first_id }

  - do:
      context_engine.get_session_events:
        session_id: "session-1"
        size: 1

  - match: { count: 1 }
  - match: { results.0.id: "event-2" }

  - do:
      context_engine.get_session_events:
        session_id: "no-such-session"

  - match: { count: 0 }

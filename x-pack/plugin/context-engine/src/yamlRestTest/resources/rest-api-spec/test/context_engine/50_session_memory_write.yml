setup:
  - do:
      inference.put:
        task_type: embedding
        inference_id: test-embedding
        body: >
          {
            "service": "text_embedding_test_service",
            "service_settings": {
              "model": "my_model",
              "dimensions": 10,
              "similarity": "cosine",
              "api_key": "abc64"
            },
            "task_settings": {
            }
          }

  - do:
      inference.put:
        task_type: rerank
        inference_id: test-rerank
        body: >
          {
            "service": "test_reranking_service",
            "service_settings": {
              "model_id": "my_model",
              "api_key": "abc64"
            },
            "task_settings": {
              "use_text_length": true
            }
          }

---
teardown:
  - do:
      features.reset_features: {}

  - do:
      inference.delete:
        inference_id: test-embedding
        ignore: 404

  - do:
      inference.delete:
        inference_id: test-rerank
        ignore: 404

---
"Remember stores text and image memories and list returns them newest first":
  - do:
      context_engine.remember:
        body:
          session_id: "session-1"
          user_id: "user-1"
          agent_id: "agent-1"
          space: "default"
          ai_index_id: ["ai-index-1"]
          type: "statement"
          content: "The user prefers dark mode."
          attributes: { source: "test" }

  - set: { id: text_id }
  - is_true: id
  - is_true: "@timestamp"
  - match: { content: "The user prefers dark mode." }

  - do:
      context_engine.remember:
        body:
          id: "memory-image"
          session_id: "session-1"
          user_id: "user-1"
          agent_id: "agent-1"
          type: "statement"
          content: "A whiteboard photo from the planning session."
          media:
            - type: "image"
              value: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg=="

  - match: { id: "memory-image" }
  - match: { media.0.type: "image" }

  - do:
      context_engine.remember:
        body:
          id: "memory-media-only"
          session_id: "session-1"
          user_id: "user-1"
          agent_id: "agent-1"
          media:
            - type: "image"
              value: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg=="

  - match: { id: "memory-media-only" }

  - do:
      context_engine.remember:
        body:
          id: "memory-url"
          session_id: "session-1"
          user_id: "user-1"
          agent_id: "agent-1"
          content: "A diagram fetched by URL."
          media:
            - type: "image"
              format: "url"
              value: "https://example.com/diagram.png"

  - match: { id: "memory-url" }
  - match: { media.0.format: "url" }

  - do:
      context_engine.list_session_memory:
        session_id: "session-1"

  - match: { count: 4 }
  - match: { results.0.id: "memory-url" }
  - match: { results.0.media.0.format: "url" }
  - match: { results.0.media.0.value: "https://example.com/diagram.png" }
  - match: { results.1.id: "memory-media-only" }
  - match: { results.2.id: "memory-image" }
  - match: { results.2.media.0.type: "image" }
  - match: { results.3.id: $text_id }
  - match: { results.3.content: "The user prefers dark mode." }
  - match: { results.3.attributes.source: "test" }

  - do:
      context_engine.list_session_memory:
        session_id: "session-1"
        ai_index_id: "ai-index-1"

  - match: { count: 1 }
  - match: { results.0.id: $text_id }

---
"Remember rejects a memory with neither content nor media":
  - do:
      catch: bad_request
      context_engine.remember:
        body:
          session_id: "session-1"
          user_id: "user-1"
          agent_id: "agent-1"

  - match: { error.reason: "/.*one\\sof\\s\\[content\\]\\sor\\s\\[media\\].*/" }

---
"Search finds memories by text and by image and honors filters":
  - do:
      context_engine.remember:
        body:
          id: "search-text"
          session_id: "session-2"
          user_id: "user-1"
          agent_id: "agent-1"
          space: "default"
          ai_index_id: ["ai-index-1"]
          content: "The user prefers dark mode."

  - do:
      context_engine.remember:
        body:
          id: "search-image"
          session_id: "session-2"
          user_id: "user-2"
          agent_id: "agent-1"
          space: "default"
          media:
            - type: "image"
              value: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg=="

  - do:
      context_engine.search_session_memory:
        body:
          query: "dark mode"
          session_id: "session-2"

  - match: { count: 2 }
  - is_true: results.0._score
  - is_true: results.0.memory.id

  - do:
      context_engine.search_session_memory:
        body:
          query:
            type: "image"
            value: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg=="
          session_id: "session-2"

  - match: { count: 2 }

  - do:
      context_engine.search_session_memory:
        body:
          query: "dark mode"
          session_id: "session-2"
          user_id: "user-2"

  - match: { count: 1 }
  - match: { results.0.memory.id: "search-image" }

  - do:
      context_engine.search_session_memory:
        body:
          query: "dark mode"
          session_id: "session-2"
          ai_index_id: "ai-index-1"
          size: 1

  - match: { count: 1 }
  - match: { results.0.memory.id: "search-text" }

  - do:
      context_engine.search_session_memory:
        body:
          query: "anything"
          session_id: "no-such-session"

  - match: { count: 0 }

---
"List honors every filter and returns newest first":
  - do:
      context_engine.remember:
        body:
          id: "list-older"
          session_id: "session-3"
          user_id: "user-1"
          agent_id: "agent-1"
          space: "default"
          ai_index_id: ["ai-index-1"]
          content: "The user prefers dark mode."

  - do:
      context_engine.remember:
        body:
          id: "list-newer"
          session_id: "session-3"
          user_id: "user-2"
          agent_id: "agent-1"
          space: "default"
          content: "The user is in Boston."

  - do:
      context_engine.list_session_memory:
        session_id: "session-3"

  - match: { count: 2 }
  - match: { results.0.id: "list-newer" }
  - match: { results.1.id: "list-older" }

  - do:
      context_engine.list_session_memory:
        user_id: "user-1"
        agent_id: "agent-1"
        space: "default"
        ai_index_id: "ai-index-1"

  - match: { count: 1 }
  - match: { results.0.id: "list-older" }

  - do:
      context_engine.list_session_memory:
        session_id: "session-3"
        size: 1

  - match: { count: 1 }
  - match: { results.0.id: "list-newer" }

---
"Search rejects an empty query":
  - do:
      catch: bad_request
      context_engine.search_session_memory:
        body:
          query: ""

  - match: { error.reason: "/.*\\[query\\]\\scannot\\sbe\\sempty.*/" }

---
"Search reranks every text and media document and scores a memory by its best one":
  - do:
      context_engine.remember:
        body:
          id: "rank-text"
          session_id: "session-3"
          user_id: "user-1"
          agent_id: "agent-1"
          content: "The user prefers dark mode."

  - do:
      context_engine.remember:
        body:
          id: "rank-pdf"
          session_id: "session-3"
          user_id: "user-1"
          agent_id: "agent-1"
          content: "Slide deck from the offsite, with the budget approved for Q3 and the hiring plan for the new team."
          media:
            - type: "pdf"
              value: "data:application/pdf;base64,QnVkZ2V0IGFwcHJvdmVkIGZvciBRMy4="

  - do:
      context_engine.remember:
        body:
          id: "rank-pdf-only"
          session_id: "session-3"
          user_id: "user-1"
          agent_id: "agent-1"
          media:
            - type: "pdf"
              value: "data:application/pdf;base64,QnVkZ2V0IGFwcHJvdmVkIGZvciBRMy4="

  # The test reranker scores a document by 1 / its length: the 28-character text wins and the 98-character content follows.
  # PDFs are not rerankable, so the PDF-only memory comes last with a zero score.
  - do:
      context_engine.search_session_memory:
        body:
          query: "The user prefers dark mode."
          session_id: "session-3"

  - match: { count: 3 }
  - match: { results.0.memory.id: "rank-text" }
  - match: { results.1.memory.id: "rank-pdf" }
  - match: { results.2.memory.id: "rank-pdf-only" }
  - match: { results.2._score: 0.0 }

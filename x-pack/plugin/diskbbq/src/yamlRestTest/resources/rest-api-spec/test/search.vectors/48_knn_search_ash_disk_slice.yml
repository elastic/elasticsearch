  - match: { hits.total.value: 4 }
  - length: { hits.hits: 4 }
  - contains: { hits.hits: { _id: "1" } }
  - contains: { hits.hits: { _id: "2" } }
  - contains: { hits.hits: { _id: "3" } }
  - contains: { hits.hits: { _id: "4" } }
---
"ASH KNN search without slice defaults to _all on slice-enabled index":

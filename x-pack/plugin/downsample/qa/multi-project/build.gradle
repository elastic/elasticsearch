apply plugin: 'elasticsearch.internal-java-rest-test'

dependencies {
  clusterModules project(xpackModule('downsample'))
  clusterModules project(xpackModule('mapper-aggregate-metric'))
  clusterModules project(xpackModule('analytics'))
  clusterModules project(':modules:data-streams')
  clusterModules project(':test:external-modules:test-multi-project')
}

tasks.withType(Test).configureEach {
  it.systemProperty "tests.multi_project.enabled", true
}

// the test-only multi-project module is not available in release builds
tasks.named('javaRestTest') {
  def isSnapshot = buildParams.snapshotBuild
  it.onlyIf("snapshot build") { isSnapshot }
}

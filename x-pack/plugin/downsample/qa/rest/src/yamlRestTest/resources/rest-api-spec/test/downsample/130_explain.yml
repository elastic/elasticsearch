---
setup:
  - requires:
      cluster_features: ["downsample.system_index_orchestration"]
      reason: "the explain API reads the downsample state index"

  - do:
      indices.create:
        index: source
        body:
          settings:
            number_of_shards: 2
            number_of_replicas: 0
            index:
              mode: time_series
              routing_path: [metricset]
              time_series:
                start_time: 2021-04-28T00:00:00Z
                end_time: 2021-04-29T00:00:00Z
          mappings:
            properties:
              "@timestamp":
                type: date
              metricset:
                type: keyword
                time_series_dimension: true
              value:
                type: double
                time_series_metric: gauge

  - do:
      bulk:
        refresh: true
        index: source
        body:
          - '{"index": {}}'
          - '{"@timestamp": "2021-04-28T18:50:04.467Z", "metricset": "pod", "value": 10}'
          - '{"index": {}}'
          - '{"@timestamp": "2021-04-28T18:55:04.467Z", "metricset": "pod", "value": 20}'
          - '{"index": {}}'
          - '{"@timestamp": "2021-04-28T19:50:04.467Z", "metricset": "node", "value": 30}'

  - do:
      indices.put_settings:
        index: source
        body:
          index.blocks.write: true

---
"Explain a downsampled index":
  - do:
      indices.downsample:
        index: source
        target_index: source-downsample
        body: >
          {
            "fixed_interval": "1h"
          }
  - is_true: acknowledged

  - do:
      indices.explain_downsample:
        index: source-downsample

  - match: { indices.source-downsample.index: source-downsample }
  - match: { indices.source-downsample.state: completed }
  - match: { indices.source-downsample.phase: done }
  - match: { indices.source-downsample.downsample_status: success }
  - match: { indices.source-downsample.orchestration: system_index }
  - match: { indices.source-downsample.source_index: source }
  - match: { indices.source-downsample.interval: 1h }
  - match: { indices.source-downsample.config.fixed_interval: 1h }
  - is_true: indices.source-downsample.created_at_millis
  - match: { indices.source-downsample.attempt: 0 }
  - match: { indices.source-downsample.shards_summary.total: 2 }
  - match: { indices.source-downsample.shards_summary.completed: 2 }
  - match: { indices.source-downsample.shards_summary.running: 0 }
  - match: { indices.source-downsample.progress.in_num_docs_received: 3 }
  - match: { indices.source-downsample.progress.out_num_docs_indexed: 2 }
  - length: { indices.source-downsample.shards: 2 }
  - match: { indices.source-downsample.shards.0.shard: 0 }
  - match: { indices.source-downsample.shards.0.status: completed }
  - match: { indices.source-downsample.shards.1.shard: 1 }
  - match: { indices.source-downsample.shards.1.status: completed }
  - is_true: indices.source-downsample.shards.0.node
  - is_true: indices.source-downsample.shards.0.progress

---
"Explain all indices leaves out the ones that are not downsampled":
  - do:
      indices.downsample:
        index: source
        target_index: source-downsample
        body: >
          {
            "fixed_interval": "1h"
          }
  - is_true: acknowledged

  - do:
      indices.explain_downsample: {}

  - is_true: indices.source-downsample
  - is_false: indices.source

  - do:
      indices.explain_downsample:
        index: source

  - match: { indices: {} }

---
"Explain only the downsamples of a source index":
  - do:
      indices.create:
        index: other-source
        body:
          settings:
            number_of_shards: 1
            number_of_replicas: 0
            index:
              mode: time_series
              routing_path: [metricset]
              time_series:
                start_time: 2021-04-28T00:00:00Z
                end_time: 2021-04-29T00:00:00Z
              blocks.write: true
          mappings:
            properties:
              "@timestamp":
                type: date
              metricset:
                type: keyword
                time_series_dimension: true
              value:
                type: double
                time_series_metric: gauge

  - do:
      indices.downsample:
        index: source
        target_index: source-1h
        body: >
          {
            "fixed_interval": "1h"
          }
  - is_true: acknowledged

  - do:
      indices.downsample:
        index: source
        target_index: source-1d
        body: >
          {
            "fixed_interval": "1d"
          }
  - is_true: acknowledged

  - do:
      indices.downsample:
        index: other-source
        target_index: other-source-1h
        body: >
          {
            "fixed_interval": "1h"
          }
  - is_true: acknowledged

  - do:
      indices.explain_downsample:
        source_index: source

  - length: { indices: 2 }
  - match: { indices.source-1h.source_index: source }
  - match: { indices.source-1h.interval: 1h }
  - match: { indices.source-1d.source_index: source }
  - match: { indices.source-1d.interval: 1d }

  - do:
      indices.explain_downsample:
        index: "*-1h"
        source_index: source,other-source

  - length: { indices: 2 }
  - is_true: indices.source-1h
  - is_true: indices.other-source-1h

---
"Explain a missing index":
  - do:
      catch: missing
      indices.explain_downsample:
        index: does-not-exist

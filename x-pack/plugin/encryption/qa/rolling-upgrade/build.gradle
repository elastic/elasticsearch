apply plugin: 'elasticsearch.internal-java-rest-test'
apply plugin: 'elasticsearch.bwc-test'

// each phase sets the password of the node the next phase upgrades, so a retry must rerun the phases that passed
smartRetry.pruneIndividualTests.set(false)

// the cluster state encryption key was added in 9.5.0; the current version has no older nodes to wait for
def currentVersion = buildParams.bwcVersions.currentVersion
buildParams.bwcVersions.withWireCompatible(v -> v.onOrAfter("9.5.0") && v.before(currentVersion)) { bwcVersion, baseName ->
  restTests.register(bwcTaskName(bwcVersion)) {
    usesBwcDistribution(bwcVersion)
    systemProperty("tests.old_cluster_version", bwcVersion)
    maxParallelForks = 1
  }
}

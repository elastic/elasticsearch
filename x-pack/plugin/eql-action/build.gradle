evaluationDependsOn(xpackModule('core'))

apply plugin: 'elasticsearch.internal-es-plugin'

esplugin {
  name = 'x-pack-eql-action'
  description = 'Transport request/response classes for EQL search, shared by x-pack-eql and x-pack-esql'
  classname = 'org.elasticsearch.xpack.eql.action.plugin.EqlActionPlugin'
  extendedPlugins = ['x-pack-ql']
}

base {
  archivesName = 'x-pack-eql-action'
}

dependencies {
  // ql is provided at runtime via extendedPlugins (it also brings x-pack-core and mapper-version through its own
  // extended chain), so declare it (and core) compileOnly here rather than bundling a duplicate copy.
  compileOnly project(path: xpackModule('core'))
  compileOnly project(path: xpackModule('ql'))

  testImplementation project(':test:framework')
  testImplementation(testArtifact(project(xpackModule('core'))))
  testImplementation(testArtifact(project(xpackModule('ql'))))
}

# All cluster rights
# All operations on all indices
# Run as all users
test-admin:
  cluster:
    - all
  indices:
    - names: '*'
      privileges: [ all ]
  run_as:
    - '*'

user1:
  cluster:
    - cluster:monitor/main
  indices:
    - names: ['index-user1', 'index' ]
      privileges:
        - read
        - write
        - create_index
        - indices:admin/refresh

user2:
  cluster:
    - cluster:monitor/main
  indices:
    - names: [ 'index-user2', 'index' ]
      privileges:
        - read
        - write
        - create_index
        - indices:admin/refresh

eql_constant_reader:
  cluster:
    - cluster:monitor/main
  indices:
    - names: eql-constant-visible
      privileges: [read]
      field_security:
        grant: ["@timestamp", event_type, marker, constant_value]
    - names: eql-constant-hidden
      privileges: [read]
      field_security:
        grant: ["@timestamp", event_type, marker]

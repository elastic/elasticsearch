apply plugin: 'elasticsearch.internal-es-plugin'
apply plugin: 'elasticsearch.internal-test-artifact'
apply plugin: 'elasticsearch.publish'
apply plugin: 'elasticsearch.esql-release'

esplugin {
  name = 'x-pack-esql-core'
  description = 'Elasticsearch infrastructure plugin for ESQL'
  classname = 'org.elasticsearch.xpack.esql.core.plugin.EsqlCorePlugin'
  // mapper-version is extended (not bundled) so its classes have a single identity shared with any other
  // module that also uses mapper-version (e.g. x-pack-ql). This avoids jar hell when a plugin's classloader
  // chain reaches both esql-core and ql (e.g. the ESQL EQL command, where esql extends both esql-core and eql->ql).
  extendedPlugins = ['x-pack-core', 'mapper-version']
}

base {
  archivesName = 'x-pack-esql-core'
}

dependencies {
  // Provided by the extended 'mapper-version' module at runtime (see esplugin.extendedPlugins); compileOnly
  // here so esql-core does not bundle its own copy and duplicate mapper-version across the distribution.
  compileOnly project(path: xpackModule('mapper-version'))
  api "org.locationtech.jts:jts-core:${versions.jts}"
  testImplementation project(':test:framework')
  testImplementation(testArtifact(project(xpackModule('core'))))
  testImplementation project(path: xpackModule('mapper-version'))
}

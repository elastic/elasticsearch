apply plugin: 'elasticsearch.internal-es-plugin'
apply plugin: 'elasticsearch.internal-test-artifact'
apply plugin: 'elasticsearch.publish'
apply plugin: 'elasticsearch.esql-release'

esplugin {
  name = 'x-pack-esql-core'
  description = 'Elasticsearch infrastructure plugin for ESQL'
  classname = 'org.elasticsearch.xpack.esql.core.plugin.EsqlCorePlugin'
  extendedPlugins = ['x-pack-core', 'mapper-version']
}

base {
  archivesName = 'x-pack-esql-core'
}

dependencies {
  // mapper-version is provided at runtime as a standalone module (declared in extendedPlugins), not bundled,
  // so its Version class is not duplicated on the classpath of plugins that also load it transitively (e.g. esql via eql/ql).
  compileOnly project(path: xpackModule('mapper-version'))
  api "org.locationtech.jts:jts-core:${versions.jts}"
  testImplementation project(':test:framework')
  testImplementation(testArtifact(project(xpackModule('core'))))
}

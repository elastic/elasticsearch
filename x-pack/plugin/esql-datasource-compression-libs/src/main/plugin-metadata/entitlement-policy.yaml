# One stanza per bundled native-loading compression library, scoped to its auto-module name.
# When adding a new native-loading lib here, also update `module-info.java` (see the "four
# coordinated edits" javadoc on that file). Pure-Java libraries (e.g. aircompressor) do not
# need a stanza. The `/proc/self/maps` read covers musl detection: on Linux x86_64,
# snappy-java scans that file for `/ld-musl-` or `/libc.musl-` before choosing its
# native library. A denied read is reported as an IOException and treated as glibc.
#
# Note: the previous `com.github.luben.zstd_jni` stanza was removed when both Parquet's cold
# byte[] path and the .csv.zst / .ndjson.zstd streaming codec were ported to Panama FFI's
# libzstd binding (see PanamaZstd). zstd-jni is no longer on the production runtime classpath.
org.xerial.snappy:
  - load_native_libraries
  - files:
    - path: "/proc/self/maps"
      mode: "read"

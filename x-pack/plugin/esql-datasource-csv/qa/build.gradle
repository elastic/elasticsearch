ext.vectorVariantFormat = 'csv'
ext.vectorVariantRoot = file("${csvIcebergFixtureRoot}/iceberg-fixtures")
ext.vectorVariantMainClass = 'org.elasticsearch.xpack.esql.datasources.CsvFixtureGenerator'

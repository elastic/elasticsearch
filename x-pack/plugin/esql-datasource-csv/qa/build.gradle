// Generate multifile CSV fixtures by splitting employees.csv into 3 parts (analogous to
// the Parquet 3-way split in esql-datasource-parquet/qa/build.gradle). This enables the
// shared external-multifile.csv-spec tests to run for CSV format. The split preserves raw
// line content (no parsing) so multi-value bracket syntax and typed headers stay intact.
def multifileSplitDir = file("${csvIcebergFixtureRoot}/iceberg-fixtures/multifile_split")
def multifileEmployeesCsv = testFixturesProject.file('src/main/resources/data/employees.csv')
def multifileSplitParts = fixtureMatrix.splitParts
tasks.register('generateMultifileCsvSplit_employees') {
  dependsOn testFixturesProject.tasks.named('processResources')
  inputs.file(multifileEmployeesCsv)
  outputs.dir(multifileSplitDir)
  doLast {
    def lines = multifileEmployeesCsv.readLines('UTF-8')
    if (lines.isEmpty()) {
      throw new GradleException("Source CSV is empty: ${multifileEmployeesCsv}")
    }
    def header = lines[0]
    def data = lines.subList(1, lines.size())
    int total = data.size()
    int partSize = ((total + multifileSplitParts - 1).intdiv(multifileSplitParts))
    multifileSplitDir.mkdirs()
    def baseName = multifileEmployeesCsv.name.replaceFirst(/\.csv$/, '')
    for (int part = 0; part < multifileSplitParts; part++) {
      int from = part * partSize
      int to = Math.min(from + partSize, total)
      if (from >= total) {
        break
      }
      def fileName = String.format(Locale.ROOT, "%s_%02d.csv", baseName, part)
      def out = new File(multifileSplitDir, fileName)
      out.withWriter('UTF-8') { w ->
        w.writeLine(header)
        for (int i = from; i < to; i++) {
          w.writeLine(data[i])
        }
      }
    }
  }
}

// Same basenames as syncCsvIcebergFixtures — external-basic.csv-spec uses {{employees}}, {{web_logs}}, {{books}}.
def csvBasenamesForTsv = fixtureMatrix.datasetsFor('tsv')

def generateStandaloneTsvTasks = []
csvBasenamesForTsv.each { baseName ->
  def taskName = "generateStandaloneTsv_${baseName}"
  def csvSynced = file("${csvIcebergFixtureRoot}/iceberg-fixtures/standalone/${baseName}.csv")
  def tsvOut = file("${tsvFixtureOutputRoot}/iceberg-fixtures/standalone/${baseName}.tsv")
  tasks.register(taskName, JavaExec) {
    dependsOn tasks.named('syncCsvIcebergFixtures'), serverProject.tasks.named('compileTsvFixtureGeneratorJava')
    classpath = serverProject.configurations.tsvFixtureGenerator + serverProject.sourceSets.tsvFixtureGenerator.output
    mainClass = 'org.elasticsearch.xpack.esql.datasources.TsvFixtureGenerator'
    args = [csvSynced.path, tsvOut.path]
    inputs.file(csvSynced)
    outputs.file(tsvOut)
    systemProperty 'slf4j.provider', 'org.slf4j.nop.NOPServiceProvider'
    systemProperty 'slf4j.internal.verbosity', 'WARN'
  }
  generateStandaloneTsvTasks.add(tasks.named(taskName))
}

// Multifile-split TSV fixtures: employees.csv split into multifile_split/employees_NN.tsv, layout.split.parts ways.
// Used by the shared external-multifile.csv-spec and external-multifile-resolution.csv-spec when
// TsvFormatSpecIT's readScriptSpec is broadened to include them.
def tsvMultifileSplitDir = file("${tsvFixtureOutputRoot}/iceberg-fixtures/multifile_split")
def tsvMultifileSplitCsv = testFixturesProject.file('src/main/resources/data/employees.csv')
tasks.register('generateMultifileSplitTsv_employees', JavaExec) {
  dependsOn serverProject.tasks.named('compileTsvFixtureGeneratorJava')
  dependsOn testFixturesProject.tasks.named('processResources')
  classpath = serverProject.configurations.tsvFixtureGenerator + serverProject.sourceSets.tsvFixtureGenerator.output
  mainClass = 'org.elasticsearch.xpack.esql.datasources.TsvFixtureGenerator'
  args = [tsvMultifileSplitCsv.path, tsvMultifileSplitDir.path, fixtureMatrix.splitParts as String]
  inputs.file(tsvMultifileSplitCsv)
  outputs.dir(tsvMultifileSplitDir)
  systemProperty 'slf4j.provider', 'org.slf4j.nop.NOPServiceProvider'
  systemProperty 'slf4j.internal.verbosity', 'WARN'
}
generateStandaloneTsvTasks.add(tasks.named('generateMultifileSplitTsv_employees'))

// Multifile-UBN TSV fixtures: per-file conversion of the two divergent-order CSVs into
// multifile_ubn/multifile_ubn_{a,b}.tsv, so csv-declared-schema-multifile.csv-spec — whose whole
// point is that a declaration makes the reconciliation mode irrelevant — runs on TSV too rather
// than only on the format its fixtures happened to be materialized in.
['multifile_ubn_a', 'multifile_ubn_b'].each { baseName ->
  def taskName = "generateMultifileUbnTsv_${baseName}"
  def ubnCsv = file("${csvIcebergFixtureRoot}/iceberg-fixtures/multifile_ubn/${baseName}.csv")
  def ubnTsv = file("${tsvFixtureOutputRoot}/iceberg-fixtures/multifile_ubn/${baseName}.tsv")
  tasks.register(taskName, JavaExec) {
    dependsOn tasks.named('syncCsvIcebergMultifileUbnFixtures'), serverProject.tasks.named('compileTsvFixtureGeneratorJava')
    classpath = serverProject.configurations.tsvFixtureGenerator + serverProject.sourceSets.tsvFixtureGenerator.output
    mainClass = 'org.elasticsearch.xpack.esql.datasources.TsvFixtureGenerator'
    args = [ubnCsv.path, ubnTsv.path]
    inputs.file(ubnCsv)
    outputs.file(ubnTsv)
    systemProperty 'slf4j.provider', 'org.slf4j.nop.NOPServiceProvider'
    systemProperty 'slf4j.internal.verbosity', 'WARN'
  }
  generateStandaloneTsvTasks.add(tasks.named(taskName))
}

// Every layout the matrix declares, for TSV. Standalone, multifile_split and multifile_ubn are
// registered above; the rest arrive from the shared declaration.
def generateCsvHiveTasks = []

ext.fixtureLayoutFormat = 'tsv'
ext.fixtureLayoutRoot = file("${tsvFixtureOutputRoot}/iceberg-fixtures")
ext.fixtureLayoutMainClass = 'org.elasticsearch.xpack.esql.datasources.TsvFixtureGenerator'
ext.fixtureLayoutGenerator = 'tsvFixtureGenerator'
ext.fixtureLayoutSkip = ['multifile_split', 'multifile_ubn'] as Set
ext.serverProject = serverProject
ext.testFixturesProject = testFixturesProject
ext.testFixturesDataDir = testFixturesProject.file('src/main/resources/data')
ext.fixtureLayoutTasks = generateStandaloneTsvTasks
apply from: project(xpackModule('esql:qa:fixture-common')).file('fixture-layouts.gradle')

// CSV's hive layout: the one CSV layout that needs row-level work rather than a copy, so it
// goes through a generator like the other formats. Only hive -- the rest are Sync tasks above.
ext.fixtureLayoutFormat = 'csv'
ext.fixtureLayoutRoot = file("${csvIcebergFixtureRoot}/iceberg-fixtures")
ext.fixtureLayoutMainClass = 'org.elasticsearch.xpack.esql.datasources.CsvFixtureGenerator'
ext.fixtureLayoutGenerator = 'csvFixtureGenerator'
// Named explicitly, not derived: a derived set would silently absorb any layout added later,
// which is the drift this change exists to remove. CSV registers its authored layouts as Sync
// copies above, so only hive comes from the registrar.
ext.fixtureLayoutSkip = ['multifile', 'multifile_ubn', 'multifile_type_drift', 'multifile_temporal',
                         'multifile_perm', 'multifile_split'] as Set
ext.fixtureLayoutTasks = generateCsvHiveTasks
apply from: project(xpackModule('esql:qa:fixture-common')).file('fixture-layouts.gradle')


ds_loc_admin:
  cluster:
    - all
  indices:
    - names: '*'
      privileges: [ all ]
  run_as:
    - '*'
  global:
    data_source:
      - names: [ '*' ]
        privileges: [ manage ]

ds_loc_reader:
  cluster: []
  indices:
    - names: [ 'ds_loc_*' ]
      privileges: [ 'read' ]

ds_loc_metadata_reader:
  cluster: []
  indices:
    - names: [ 'ds_loc_*' ]
      privileges: [ 'read_dataset_metadata' ]

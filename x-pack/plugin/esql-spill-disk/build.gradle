apply plugin: 'elasticsearch.internal-es-plugin'
apply plugin: 'elasticsearch.esql-release'

esplugin {
  name = 'esql-spill-disk'
  description = 'Local disk backend for ES|QL spilling'
  classname = 'org.elasticsearch.xpack.esql.spill.disk.DiskSpillPlugin'
  extendedPlugins = ['x-pack-esql']
  deploymentTarget = 'STATEFUL_ONLY'
}

base {
  archivesName = 'esql-spill-disk'
}

dependencies {
  compileOnly project(':server')
  compileOnly project(xpackModule('esql:compute'))
  testImplementation project(xpackModule('esql:compute:test'))
}

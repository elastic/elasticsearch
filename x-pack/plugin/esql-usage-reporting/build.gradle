apply plugin: 'elasticsearch.internal-es-plugin'
apply plugin: 'elasticsearch.publish'

esplugin {
  name = 'esql-usage-reporting'
  description = 'Reports ES|QL Data Federation usage to the Elastic Usage API on hosted deployments'
  classname = 'org.elasticsearch.xpack.esql.usage.EsqlUsageReportingPlugin'
  extendedPlugins = ['x-pack-esql', 'x-pack-core']
  // Serverless has its own collector: running both would meter the same queries twice.
  deploymentTarget = 'STATEFUL_ONLY'
}

base {
  archivesName = 'esql-usage-reporting'
}

dependencies {
  compileOnly project(':server')
  compileOnly project(path: xpackModule('core'))
  compileOnly project(path: xpackModule('esql'))

  testImplementation project(':test:framework')
  testImplementation(testArtifact(project(xpackModule('core'))))
}

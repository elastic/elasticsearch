/*
 * Tooling shared by every external-source fixture generator, and the one place the
 * fixture matrix is declared.
 *
 * This module exists because the shared pieces had no home. `CsvFixtureParser` and
 * `SplitPartitioner` ended up inside the esql-datasource-csv PLUGIN -- a production
 * artifact -- because the canonical fixture source format happens to be CSV. Four
 * generators' build-time classpaths therefore depend on a query-time plugin to get
 * two classes that have nothing to do with reading CSV at query time.
 *
 * The cost of that accident is visible in the fixture matrix: what was shared spread
 * to every format, and what was not did not. Hive bucketing stayed inside
 * ParquetFixtureGenerator, so hive fixtures exist for Parquet alone.
 *
 * Dependency-free by design, and it must stay that way: the ORC and Parquet generator
 * configurations deliberately isolate their Hadoop jars, and anything this module drags
 * in would land on those classpaths.
 */
apply plugin: 'elasticsearch.build'

base {
  archivesName = 'x-pack-esql-fixture-common'
}

dependencies {
  // Test-only. The main source set stays dependency-free: these never reach the generator
  // classpaths, which deliberately isolate their Hadoop jars.
  testImplementation "com.carrotsearch.randomizedtesting:randomizedtesting-runner:${versions.randomizedrunner}"
  testImplementation "junit:junit:${versions.junit4}"
  testImplementation "org.hamcrest:hamcrest:${versions.hamcrest}"
  testImplementation project(':test:framework')
}

tasks.named('forbiddenApisMain').configure {
  // Pure JDK, no Elasticsearch types -- it has to be loadable from every generator's
  // isolated classpath.
  replaceSignatureFiles 'jdk-signatures'
}

// The dimension contract gate. Static half on precommit; see the script for why the artifact
// half rides csvSpecTests in the consuming modules instead.
apply from: "dimension-contract.gradle"

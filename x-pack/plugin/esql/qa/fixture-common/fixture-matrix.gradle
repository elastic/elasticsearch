/*
 * Reads fixture-matrix.properties and hands back the datasets a format must materialise.
 *
 * Apply it from a QA build.gradle:
 *   apply from: project(xpackModule('esql:qa:fixture-common')).file('fixture-matrix.gradle')
 *   def datasets = fixtureMatrix.datasetsFor('parquet')
 *
 * The point is that the list is derived, not written down again. Seven lists across six build
 * files used to be maintained by hand, and three had independently converged on the same four
 * datasets; a dataset added to one was invisible to the rest. (An eighth list, in the iceberg
 * module, is deliberately left alone: it feeds Iceberg TABLE fixtures, not one of these formats.)
 */

def matrixFile = buildscript.sourceFile.parentFile.toPath()
  .resolve('src/main/resources/org/elasticsearch/xpack/esql/datasources/fixtures/fixture-matrix.properties').toFile()
assert matrixFile.exists(): "fixture matrix not found at ${matrixFile}"

def props = new Properties()
matrixFile.withInputStream { props.load(it) }

// The format axis, declared in the properties file so both sides agree on it.
def allFormats = props.getProperty('formats').split(',').collect { it.trim() }.findAll { it.isEmpty() == false }

def datasetsByFormat = allFormats.collectEntries { [(it): []] }
// Datasets declared "*" -- the ones every format carries. A module that deliberately runs a
// reduced set asks for these by name rather than repeating them.
def baselineDatasets = []

// A dataset key is dataset.<name> and nothing more. Attribute keys carry a further dot segment
// (.reason, .write_dialect, ...), and treating one as a dataset name mis-parses its value as a format
// list -- adding write_dialect broke exactly that way, reporting a dataset called
// 'apps.write_dialect' restricted to a format called 'none'. Both parsers of this file must agree on
// the key grammar; this side now filters on shape rather than on a list of known suffixes.
props.stringPropertyNames()
  .findAll { it.startsWith('dataset.') && it.substring('dataset.'.length()).contains('.') == false }
  .sort()
  .each { key ->
    def name = key.substring('dataset.'.length())
    def value = props.getProperty(key).trim()
    def formats
    if (value == '*') {
      formats = allFormats
      baselineDatasets << name
    } else {
      // Opting out is a claim, and a claim needs a reason. This is the gate that keeps a
      // restriction from being quietly widened into "we just never got round to it".
      def reason = props.getProperty("${key}.reason")
      if (reason == null || reason.trim().isEmpty()) {
        throw new GradleException(
          "Dataset '${name}' is restricted to [${value}] but declares no reason. Add " +
          "'${key}.reason = rule: <why no format can carry it>' or " +
          "'${key}.reason = gap: <why it has not been propagated yet>' to ${matrixFile.name}."
        )
      }
      formats = value.split(',').collect { it.trim() }.findAll { it.isEmpty() == false }
      def unknown = formats - allFormats
      if (unknown.isEmpty() == false) {
        throw new GradleException("Dataset '${name}' names unknown format(s) ${unknown}; known formats are ${allFormats}.")
      }
    }
    formats.each { datasetsByFormat[it] << name }
  }

// A per-format override keyed on a format the axis does not declare is a typo, not a no-op: the
// layout would silently fall back to its default sources and generate a plausible wrong fixture.
props.stringPropertyNames().findAll { it.startsWith('layout.') && it.contains('.sources.') }.each { key ->
  def suffix = key.substring(key.indexOf('.sources.') + '.sources.'.length())
  if (suffix.endsWith('.reason')) {
    suffix = suffix.substring(0, suffix.length() - '.reason'.length())
  }
  if (allFormats.contains(suffix) == false) {
    throw new GradleException(
      "'${key}' names format '${suffix}', which is not in the declared format axis ${allFormats}. " +
      "A per-format source override keyed on an unknown format would be ignored silently."
    )
  }
  // Same trap on the other coordinate: 'layout.multifile_ubnX.sources.parquet' has a valid format
  // suffix, so the check above passes, and the layout half is never matched to anything.
  def layoutName = key.substring('layout.'.length(), key.indexOf('.sources.'))
  if (props.getProperty("layout.${layoutName}.dir") == null) {
    throw new GradleException(
      "'${key}' names layout '${layoutName}', which declares no 'layout.${layoutName}.dir'. " +
      "A source override keyed on an unknown layout would be ignored silently."
    )
  }
}

ext.fixtureMatrix = [
  /** Datasets this format must materialise, in declaration order. */
  datasetsFor: { String format ->
    if (datasetsByFormat.containsKey(format) == false) {
      throw new GradleException("Unknown fixture format '${format}'; known formats are ${allFormats}.")
    }
    return datasetsByFormat[format].asImmutable()
  },
  /** The directory a layout occupies -- the same name the spec suites resolve templates to. */
  layoutDir: { String layout ->
    def dir = props.getProperty("layout.${layout}.dir")
    if (dir == null) {
      throw new GradleException("undeclared fixture layout '${layout}' in ${matrixFile.name}.")
    }
    return dir.trim()
  },
  /** Layouts built from authored source files, as opposed to the derived ones. */
  authoredLayouts: { ->
    props.stringPropertyNames()
      .findAll { it.startsWith('layout.') && it.endsWith('.sources') }
      .collect { it.substring('layout.'.length(), it.length() - '.sources'.length()) }
      .sort()
      .asImmutable()
  },
  /** A layout's source files for one format, falling back to the layout's default set. */
  layoutSources: { String layout, String format ->
    if (allFormats.contains(format) == false) {
      throw new GradleException("unknown fixture format '${format}'; declared formats are ${allFormats}.")
    }
    def perFormatKey = "layout.${layout}.sources.${format}"
    def perFormat = props.getProperty(perFormatKey)
    def value = perFormat != null ? perFormat : props.getProperty("layout.${layout}.sources")
    if (value == null) {
      throw new GradleException("layout '${layout}' declares no sources in ${matrixFile.name}.")
    }
    def sources = value.split(',').collect { it.trim() }.findAll { it.isEmpty() == false }
    // An empty per-format list says this cell is knowingly not generated. Same rule as a
    // restricted dataset: opting out is a claim, and a claim needs a reason.
    if (sources.isEmpty()) {
      def reason = props.getProperty("${perFormatKey}.reason")
      if (reason == null || reason.trim().isEmpty()) {
        throw new GradleException(
          "layout '${layout}' generates nothing for format '${format}' but declares no reason. " +
          "Add '${perFormatKey}.reason = gap: <why>' to ${matrixFile.name}."
        )
      }
    }
    return sources.asImmutable()
  },
  /** The dataset a derived layout is re-laid-out from. */
  derivedFrom: { String layout ->
    def value = props.getProperty("layout.${layout}.derived_from")
    if (value == null) {
      throw new GradleException("layout '${layout}' is not derived from a dataset in ${matrixFile.name}.")
    }
    return value.trim()
  },
  /**
   * Every layout declaring bucket_by + partition_column, i.e. the partitioned (hive-family) layouts.
   * Keyed off the declaration rather than hard-coded to 'hive', so declaring a new partitioned layout
   * is enough to have it generated -- hive_shadow was generated by a hand-written task precisely
   * because the old helpers could only name one layout.
   */
  partitionedLayouts: { ->
    props.stringPropertyNames()
         .findAll { it.startsWith('layout.') && it.endsWith('.bucket_by') }
         .collect { it.substring('layout.'.length(), it.length() - '.bucket_by'.length()) }
         .sort()
  },
  /** The payload column the given partitioned layout buckets on. */
  layoutBucketBy: { String layout ->
    def v = props.getProperty("layout.${layout}.bucket_by")
    if (v == null) { throw new GradleException("layout [${layout}] declares no bucket_by") }
    v.trim()
  },
  /** The path-derived partition column the given partitioned layout writes into directory names. */
  layoutPartitionColumn: { String layout ->
    def v = props.getProperty("layout.${layout}.partition_column")
    if (v == null) { throw new GradleException("layout [${layout}] declares no partition_column") }
    v.trim()
  },
  /** The datasets every format carries, for modules that deliberately run a reduced set. */
  baseline: { -> baselineDatasets.asImmutable() },
  /** How many files a split layout produces. */
  splitParts: Integer.parseInt(props.getProperty('layout.split.parts').trim()),
  allFormats: allFormats.asImmutable(),
]

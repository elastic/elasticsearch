#
# The fixture matrix: which datasets exist in which formats, declared once.
#
# Read at configuration time by every esql-datasource-*/qa/build.gradle to decide which
# generation tasks to register, and at run time by AbstractExternalSourceSpecTestCase to
# resolve a {{template}} to a path. One declaration, two consumers, so the set a module
# generates and the set the suites look for cannot drift apart.
#
# A dataset exists in every format unless something prevents it. "*" says exactly that,
# and it is the value you want: add a sixth format tomorrow and every "*" dataset is
# materialised in it without editing this file. Naming formats explicitly opts OUT, so a
# restriction has to be argued for -- every restricted entry carries a .reason, and the
# build fails if one is missing.
#
# A .reason is one of two kinds, and they are not the same thing:
#   rule -- the format cannot carry the data. Nothing to fix; this cell will never exist.
#   gap  -- nobody has propagated it yet. This IS work, and the reason says so.
#

dataset.employees = *
dataset.web_logs = *
dataset.books = *
dataset.employees_no_mv = *

dataset.nested_events = orc, parquet
dataset.nested_events.reason = rule: dotted columns (event.action, event.outcome) are nested \
  groups. CSV, TSV and NDJSON have no nested representation -- a dotted header there is just \
  a flat column name, which tests something else entirely.

dataset.uint32_pushdown = parquet
dataset.uint32_pushdown.reason = rule: uint32/uint16 are Parquet logical types with no text \
  form, so the columns cannot round-trip through a text format.

dataset.uint64_pushdown = parquet
dataset.uint64_pushdown.reason = rule: uint64 has no text form, same as uint32_pushdown.

dataset.apps = csv
dataset.apps.reason = gap: nothing about the version type stops the other formats carrying \
  it; it was materialised for CSV and never propagated.

dataset.mv_sample = csv, tsv
dataset.mv_sample.reason = gap: multi-value tags have a native representation in every \
  target format (NDJSON arrays, Parquet and ORC LIST), so this belongs everywhere. It was \
  written with the bracket syntax the text generators share and never propagated.

#
# How many files a split layout produces. Seven call sites pass this number today, one of
# them as a bare integer and one buried behind a codec argument, which is exactly why it
# belongs here rather than in each of them.
#
layout.split.parts = 3

# What the dataset registration endpoint must refuse, and the message it must refuse with.
#
# A case names the settings it registers, so it states the combination outright rather than deriving
# it. Most pin one setting. The ones at the bottom pin two that are each accepted alone and refused
# together -- an error budget with no error mode, a probe window only too wide at that probe count --
# which is the shape a crossing that varies settings one at a time never reaches.
#
# They are not dimensions for that reason: there is nothing to derive. A dimension earns a verdict
# against every other dimension so a generator can decide what to cross; a refusal already says.
#
# The message is the assertion, not decoration. A case that checks only the status passes when a
# setting it never varied is refused for an unrelated reason, and downstream the two are the same
# green tick. Every message below is a SUBSTRING of what the component emits, chosen to name the
# offending setting and the constraint it broke -- so a reworded sentence survives and a changed rule
# does not.
#
# Every message here was read out of the component that emits it, not written from what it ought to
# say. A contract asserting a message nobody implements is a suite that goes red on correct code.
#
# Shape:
#   case.<name>.settings.<key>   a dataset setting to register; repeat for a combination
#   case.<name>.message   a substring the refusal must contain
#   case.<name>.emitter   the symbol the message was read from, so the next reader can check it
#   case.<name>.format    optional; the format the dataset is registered as (default: csv)

# --- coordinator-level range checks -------------------------------------------------------------
#
# DataSourceValidationUtils.validateInt, reached from FileDataSourceValidator for schema_sample_size
# with bounds [1, SCHEMA_SAMPLE_SIZE_MAX]. Two different bad values, two different messages: a
# non-numeric value never reaches the range check, so a suite that asserted one message for both
# would pass while the parse and the bound were the same branch.

case.dataset.setting.schema_sample_size.negative.settings.schema_sample_size = -1
case.dataset.setting.schema_sample_size.negative.message = [schema_sample_size] must be between 1 and 20000, got [-1]
case.dataset.setting.schema_sample_size.negative.emitter = DataSourceValidationUtils.validateInt

case.dataset.setting.schema_sample_size.zero.settings.schema_sample_size = 0
case.dataset.setting.schema_sample_size.zero.message = [schema_sample_size] must be between 1 and 20000, got [0]
case.dataset.setting.schema_sample_size.zero.emitter = DataSourceValidationUtils.validateInt

# The upper bound exists because it must not sit below the readers' own default of 20000, or the
# validator forbids the value the reader uses when the user says nothing. One above it is the edge
# that pins which side of the bound is inclusive.
case.dataset.setting.schema_sample_size.above_max.settings.schema_sample_size = 20001
case.dataset.setting.schema_sample_size.above_max.message = [schema_sample_size] must be between 1 and 20000, got [20001]
case.dataset.setting.schema_sample_size.above_max.emitter = DataSourceValidationUtils.validateInt

case.dataset.setting.schema_sample_size.not_a_number.settings.schema_sample_size = foo
case.dataset.setting.schema_sample_size.not_a_number.message = [schema_sample_size] must be a number, got [foo]
case.dataset.setting.schema_sample_size.not_a_number.emitter = DataSourceValidationUtils.validateInt

# --- coordinator-level range checks, the other bounded integer --------------------------------
#
# skip_rows takes the same validateInt path with its own bound, which is what makes it worth
# carrying: the two settings share the code and would share a defect, so a contract naming only one
# of them would go green on a change that broke both.

case.dataset.setting.skip_rows.negative.settings.skip_rows = -1
case.dataset.setting.skip_rows.negative.message = [skip_rows] must be between 0 and 1000, got [-1]
case.dataset.setting.skip_rows.negative.emitter = DataSourceValidationUtils.validateInt

case.dataset.setting.skip_rows.above_max.settings.skip_rows = 1001
case.dataset.setting.skip_rows.above_max.message = [skip_rows] must be between 0 and 1000, got [1001]
case.dataset.setting.skip_rows.above_max.emitter = DataSourceValidationUtils.validateInt

case.dataset.setting.skip_rows.not_a_number.settings.skip_rows = later
case.dataset.setting.skip_rows.not_a_number.message = [skip_rows] must be a number, got [later]
case.dataset.setting.skip_rows.not_a_number.emitter = DataSourceValidationUtils.validateInt

# --- combinations ------------------------------------------------------------------------------
#
# The refusals worth having at registration. Each setting below is accepted on its own; what is
# refused is the pair. A contract of one setting per case cannot reach either of these, and neither
# can a crossing that only varies settings independently.

# ErrorPolicy.validateRegistrationBudget. An error budget with nothing to spend it on: max_errors and
# max_error_ratio each need an explicit error_mode, because the budget decides how many bad rows are
# tolerated and the mode decides what tolerating one means.
case.dataset.combination.error_budget_without_mode.settings.max_errors = 10
case.dataset.combination.error_budget_without_mode.message = [max_errors] and [max_error_ratio] each require an explicit [error_mode]
case.dataset.combination.error_budget_without_mode.emitter = ErrorPolicy.validateRegistrationBudget

case.dataset.combination.error_ratio_without_mode.settings.max_error_ratio = 0.1
case.dataset.combination.error_ratio_without_mode.message = [max_errors] and [max_error_ratio] each require an explicit [error_mode]
case.dataset.combination.error_ratio_without_mode.emitter = ErrorPolicy.validateRegistrationBudget

# FileSplitProvider.validateProbeBudget. Neither value is out of range; their product is. This is the
# shape a per-setting bound check cannot catch, and the message names both settings because the user
# has to choose which one to lower.
case.dataset.combination.probe_budget_exceeded.settings.split_probe_window = 64mb
case.dataset.combination.probe_budget_exceeded.settings.max_split_probes = 1000
case.dataset.combination.probe_budget_exceeded.message = Invalid combination of [split_probe_window]
case.dataset.combination.probe_budget_exceeded.emitter = FileSplitProvider.validateProbeBudget

# Two more rules that read several settings. Both are dependencies rather than bounds: the value is
# fine, and what makes it invalid is another setting's value, or its absence.

# PartitionConfig.validate. Template detection has nothing to match against without the template.
case.dataset.combination.template_detection_without_path.settings.partition_detection = template
case.dataset.combination.template_detection_without_path.message = [partition_detection] is [template] but no [partition_path] was given
case.dataset.combination.template_detection_without_path.emitter = PartitionConfig.validate

# FileOrderConfig.validate. File ordering only means anything when the first file decides the schema;
# under any other resolution the order the files are read in does not change the answer, so asking
# for one is a mistake rather than a preference.
case.dataset.combination.file_order_without_first_file_wins.settings.file_sort_by = name
case.dataset.combination.file_order_without_first_file_wins.settings.schema_resolution = union_by_name
case.dataset.combination.file_order_without_first_file_wins.message = [file_sort_by] and [file_order] are only valid when effective schema resolution is first_file_wins
case.dataset.combination.file_order_without_first_file_wins.emitter = FileOrderConfig.validate

# --- single-setting vocabulary checks -----------------------------------------------------------
#
# DataSourceValidationUtils.validateEnum names the accepted values back, which is the part worth
# pinning: a message that only said the value was wrong would leave the user guessing the vocabulary.

case.dataset.setting.partition_detection.unknown_value.settings.partition_detection = sideways
case.dataset.setting.partition_detection.unknown_value.message = [partition_detection] must be one of
case.dataset.setting.partition_detection.unknown_value.emitter = DataSourceValidationUtils.validateEnum

# --- accepted at registration, failing at query --------------------------------------------------
#
# Registration performs no I/O, so it cannot know the bytes disagree with the settings. These cases
# pin both halves at once: the PUT must succeed, and the query must fail with the message below. A
# PUT that starts refusing one means registration acquired I/O.

case.dataset.format.parquet_declared_over_text_bytes.settings.format = parquet
case.dataset.format.parquet_declared_over_text_bytes.resource = noext
case.dataset.format.parquet_declared_over_text_bytes.outcome = query_fails
case.dataset.format.parquet_declared_over_text_bytes.message = as a Parquet file: 
case.dataset.format.parquet_declared_over_text_bytes.emitter = ParquetFormatReader.ParquetReadFailures.wrap

# --- blocked on a filed defect -------------------------------------------------------------------
#
# A case here asserts behaviour the product does not have yet. It names the issue that will make it
# pass, and the suite skips it until then. The citation is what closes the loop: without it the case
# sits excluded long after the defect is fixed, which loses exactly the coverage it was written to add.

# A resource written as a filesystem path rather than a URI is refused, correctly. What this case
# pins is the SECOND error that comes with it: schema_sample_size is a valid CSV setting, and it is
# reported as unknown only because the failed resource left the format unresolved and the accepted
# vocabulary collapsed to the coordinator keys. A user reading it deletes the setting, fixes the
# path, and registers a dataset silently missing what they asked for.
#
# `absent` is the whole assertion. The registration IS refused, so a status-only case passes today,
# and so does one asserting only the schemes message. What must change is that the second error stops
# being emitted.
case.dataset.resource.path_not_uri_reports_settings_unknown.settings.schema_sample_size = 500
case.dataset.resource.path_not_uri_reports_settings_unknown.resource = simple.csv
case.dataset.resource.path_not_uri_reports_settings_unknown.resource_form = path
case.dataset.resource.path_not_uri_reports_settings_unknown.message = [resource] must use one of the supported URI schemes
case.dataset.resource.path_not_uri_reports_settings_unknown.absent = unknown setting [schema_sample_size]
case.dataset.resource.path_not_uri_reports_settings_unknown.emitter = FileDataSourceValidator.validateResource
case.dataset.resource.path_not_uri_reports_settings_unknown.blocked_by = elastic/esql-planning#1999

# --- accepted, and actually taking effect --------------------------------------------------------
#
# The outcome no status can detect. A setting that is accepted, plumbed to the reader and then ignored
# returns rows exactly as one that worked does. What separates them is the shape of the result, which
# needs bytes that parse differently under the declared value than under the default.
#
# simple.csv is `a,b` over two comma-separated rows. Read with the declared delimiter it is ONE column
# named `a,b`; read with the default comma -- which is what an ignored setting gives -- it is two
# columns, `a` and `b`. So the column list is the whole assertion, and it fails in the direction that
# matters: a setting that stops being honoured produces the two-column shape.
case.dataset.setting.delimiter.takes_effect.settings.delimiter = |
case.dataset.setting.delimiter.takes_effect.outcome = query_succeeds
case.dataset.setting.delimiter.takes_effect.columns.0 = a,b

# --- the canaries the previous CRUD suite carried ------------------------------------------------
#
# Every one of these was already a case in DataSourceCrudAcceptCombinationsIT, where it asserted that
# a 400 came back and nothing about why. Each now pins the message, and they are worth keeping as a
# set because they reach five different validators: two size parsers, a charset lookup, a character
# parser and an enum.

case.dataset.setting.segment_size.below_minimum.settings.segment_size = 1b
case.dataset.setting.segment_size.below_minimum.format = ndjson
case.dataset.setting.segment_size.below_minimum.message = segment_size must be >= 64kb, got: 1b
case.dataset.setting.segment_size.below_minimum.emitter = NdJsonFormatReader.validateSegmentSize

# A different branch from the bound above: an unparseable size never reaches the comparison, so a
# suite asserting one message for both would pass while the parse and the bound were one check.
case.dataset.setting.segment_size.unparseable.settings.segment_size = foobar
case.dataset.setting.segment_size.unparseable.format = ndjson
case.dataset.setting.segment_size.unparseable.message = failed to parse setting [segment_size] with value [foobar] as a size in bytes
case.dataset.setting.segment_size.unparseable.emitter = NdJsonFormatReader.validateSegmentSize

case.dataset.setting.encoding.unknown_charset.settings.encoding = UTF-99
case.dataset.setting.encoding.unknown_charset.message = Invalid encoding [UTF-99]
case.dataset.setting.encoding.unknown_charset.emitter = CsvFormatOptions

# The refusal names what a delimiter may be, which is the part worth pinning: a message saying only
# that the value was wrong would leave the user guessing whether a tab or an escape is allowed.
case.dataset.setting.delimiter.multi_character.settings.delimiter = ||
case.dataset.setting.delimiter.multi_character.message = Invalid character value for [delimiter] [||]: expected a single character
case.dataset.setting.delimiter.multi_character.emitter = CsvFormatOptions

case.dataset.setting.error_mode.unknown_value.settings.error_mode = sideways
case.dataset.setting.error_mode.unknown_value.message = Invalid value for [error_mode]: [sideways]; supported values are [fail_fast, skip_row, null_field]
case.dataset.setting.error_mode.unknown_value.emitter = ErrorPolicy.fromConfig

# --- accepted, and the reader decides what it means ----------------------------------------------
#
# The previous suite carried del_empty with the comment "accepted at PUT; reader treats as format
# default", and asserted only that rows came back -- which is true whether the reader honours the
# value or substitutes its own. Pinned here as a result shape instead: an empty delimiter reads
# simple.csv on the comma default, so it is TWO columns. If the reader ever started honouring the
# empty string the file would parse as one column and this goes red, which is the point.
case.dataset.setting.delimiter.empty_falls_back_to_default.settings.delimiter =
case.dataset.setting.delimiter.empty_falls_back_to_default.outcome = query_succeeds
case.dataset.setting.delimiter.empty_falls_back_to_default.columns.0 = a
case.dataset.setting.delimiter.empty_falls_back_to_default.columns.1 = b
case.dataset.setting.delimiter.empty_falls_back_to_default.same_as_default = the claim IS that an empty delimiter is indistinguishable from declaring none, so this case must match the no-settings result rather than differ from it

# header_row=false makes the first line data rather than names, so the columns are positional. The
# previous suite varied this axis and asserted rows came back, which both settings produce.
case.dataset.setting.header_row.false_makes_the_header_a_row.settings.header_row = false
case.dataset.setting.header_row.false_makes_the_header_a_row.outcome = query_succeeds
case.dataset.setting.header_row.false_makes_the_header_a_row.columns.0 = col0
case.dataset.setting.header_row.false_makes_the_header_a_row.columns.1 = col1

# --- effect vectors: one setting, bytes that parse differently under it --------------------------
#
# Each case writes its own bytes, and the discriminating characters are in the HEADER. That is the
# trick that makes column names sufficient: if the setting is ignored the line splits somewhere else
# and the COLUMN NAMES change, so nothing has to assert cell values to see it.
#
# A case here is only worth having if the data reads differently under the declared value than under
# the default. On data that parses the same either way it passes while testing nothing.

# Honoured: two columns. Ignored (comma default): one column called `a|b`.
case.dataset.effect.delimiter.pipe.content = a|b\n1|foo\n
case.dataset.effect.delimiter.pipe.settings.delimiter = |
case.dataset.effect.delimiter.pipe.outcome = query_succeeds
case.dataset.effect.delimiter.pipe.columns.0 = a
case.dataset.effect.delimiter.pipe.columns.1 = b

case.dataset.effect.delimiter.semicolon.content = a;b\n1;foo\n
case.dataset.effect.delimiter.semicolon.settings.delimiter = ;
case.dataset.effect.delimiter.semicolon.outcome = query_succeeds
case.dataset.effect.delimiter.semicolon.columns.0 = a
case.dataset.effect.delimiter.semicolon.columns.1 = b

case.dataset.effect.delimiter.tab.content = a\tb\n1\tfoo\n
case.dataset.effect.delimiter.tab.settings.delimiter = \t
case.dataset.effect.delimiter.tab.outcome = query_succeeds
case.dataset.effect.delimiter.tab.columns.0 = a
case.dataset.effect.delimiter.tab.columns.1 = b

# A commented first line. Honoured: the header is the second line, so `a` and `b`. Ignored: the
# comment line is the header and the columns are named after it.
case.dataset.effect.comment.hash.content = #generated\na,b\n1,foo\n
case.dataset.effect.comment.hash.settings.comment = #
case.dataset.effect.comment.hash.outcome = query_succeeds
case.dataset.effect.comment.hash.columns.0 = a
case.dataset.effect.comment.hash.columns.1 = b

# trim_spaces reaches VALUES, not column names: names are trimmed whatever it says, which is why the
# first version of this case -- padded header, asserting the names came back bare -- passed without
# testing anything and was caught by the discrimination check. The padding is in the data now.
case.dataset.effect.trim_spaces.on.content = a,b\n  x  ,  2  \n
case.dataset.effect.trim_spaces.on.settings.trim_spaces = true
case.dataset.effect.trim_spaces.on.outcome = query_succeeds
case.dataset.effect.trim_spaces.on.columns.0 = a
case.dataset.effect.trim_spaces.on.columns.1 = b
case.dataset.effect.trim_spaces.on.rows.0.0 = x
case.dataset.effect.trim_spaces.on.rows.0.1 = 2

# column_prefix SYNTHESIZES names, so it only reaches anything when there is no header to take them
# from -- which makes this a crossing rather than a single-setting effect. Honoured: the generated
# names carry the declared prefix. Ignored: they carry the default `col`.
case.dataset.crossing.header_row_column_prefix.synthesized.content = 1,foo\n2,bar\n
case.dataset.crossing.header_row_column_prefix.synthesized.settings.header_row = false
case.dataset.crossing.header_row_column_prefix.synthesized.settings.column_prefix = c_
case.dataset.crossing.header_row_column_prefix.synthesized.outcome = query_succeeds
case.dataset.crossing.header_row_column_prefix.synthesized.columns.0 = c_0
case.dataset.crossing.header_row_column_prefix.synthesized.columns.1 = c_1

# --- crossings: two settings that interact in the READER, not in any validator -------------------
#
# These are the ones no amount of reading the validator finds, because nothing refuses them -- the
# two settings meet in the parser. The header carries a field that contains the delimiter, so the
# question is whether the second setting protects it.

# delimiter x quote. Honoured together: two columns, the first called `a;b`. If quote is ignored the
# field splits and there are three columns instead.
case.dataset.crossing.delimiter_quote.single.content = 'a;b';c\n1;2\n
case.dataset.crossing.delimiter_quote.single.settings.delimiter = ;
case.dataset.crossing.delimiter_quote.single.settings.quote = '
case.dataset.crossing.delimiter_quote.single.outcome = query_succeeds
case.dataset.crossing.delimiter_quote.single.columns.0 = a;b
case.dataset.crossing.delimiter_quote.single.columns.1 = c

# delimiter x quote, with the default double quote, so the pair differs only in the quote character.
case.dataset.crossing.delimiter_quote.double.content = "a;b";c\n1;2\n
case.dataset.crossing.delimiter_quote.double.settings.delimiter = ;
case.dataset.crossing.delimiter_quote.double.outcome = query_succeeds
case.dataset.crossing.delimiter_quote.double.columns.0 = a;b
case.dataset.crossing.delimiter_quote.double.columns.1 = c

# delimiter x header_row. The positional names must reflect the delimiter's split, so a column count
# of two is itself the assertion: under the comma default this line is one field.
case.dataset.crossing.delimiter_header_row.positional.content = x|y\n1|foo\n
case.dataset.crossing.delimiter_header_row.positional.settings.delimiter = |
case.dataset.crossing.delimiter_header_row.positional.settings.header_row = false
case.dataset.crossing.delimiter_header_row.positional.outcome = query_succeeds
case.dataset.crossing.delimiter_header_row.positional.columns.0 = col0
case.dataset.crossing.delimiter_header_row.positional.columns.1 = col1

# Three settings that all have to land: the delimiter decides how many fields there are, header_row
# decides that the names are generated, and column_prefix decides what they are called. Any one of
# them being ignored changes the answer.
case.dataset.crossing.delimiter_header_row_column_prefix.all_three.content = 1|foo\n2|bar\n
case.dataset.crossing.delimiter_header_row_column_prefix.all_three.settings.delimiter = |
case.dataset.crossing.delimiter_header_row_column_prefix.all_three.settings.header_row = false
case.dataset.crossing.delimiter_header_row_column_prefix.all_three.settings.column_prefix = c_
case.dataset.crossing.delimiter_header_row_column_prefix.all_three.outcome = query_succeeds
case.dataset.crossing.delimiter_header_row_column_prefix.all_three.columns.0 = c_0
case.dataset.crossing.delimiter_header_row_column_prefix.all_three.columns.1 = c_1

# Honoured: the first two lines are skipped, so the header is `a,b`. Ignored: the preamble's first
# line is the header and the columns are named after it.
case.dataset.effect.skip_rows.preamble.content = generated by something\nrun at some time\na,b\n1,foo\n
case.dataset.effect.skip_rows.preamble.settings.skip_rows = 2
case.dataset.effect.skip_rows.preamble.outcome = query_succeeds
case.dataset.effect.skip_rows.preamble.columns.0 = a
case.dataset.effect.skip_rows.preamble.columns.1 = b

# The encoding case the previous CRUD suite recorded as a TODO: its fixtures were all ASCII, so its
# encoding axis verified that the setting was accepted and plumbed, never that it decoded anything.
#
# The header carries the copyright sign, written as the single byte 0xA9 -- valid in ISO-8859-1 and
# not valid UTF-8. Honoured: the column is named with that character. Ignored: the reader decodes as
# UTF-8, the byte is invalid, and the name carries a replacement character instead.
case.dataset.effect.encoding.latin1_header.content = a©b,c\n1,2\n
case.dataset.effect.encoding.latin1_header.content_charset = ISO-8859-1
case.dataset.effect.encoding.latin1_header.settings.encoding = ISO-8859-1
case.dataset.effect.encoding.latin1_header.outcome = query_succeeds
case.dataset.effect.encoding.latin1_header.columns.0 = a©b
case.dataset.effect.encoding.latin1_header.columns.1 = c

# --- effect vectors whose whole effect is inside a cell -------------------------------------------
#
# The header is identical whether or not these settings are honoured, so a column-name assertion
# cannot see them. Rows are declared cell by cell for the same reason columns are: a value can
# contain anything the bytes contain.

# Honoured: the sentinel becomes null, rendered as the string "null" through the REST response.
# Ignored: it comes back as the literal text.
case.dataset.effect.null_value.sentinel.content = a,b\nNA,foo\n
case.dataset.effect.null_value.sentinel.settings.null_value = NA
case.dataset.effect.null_value.sentinel.outcome = query_succeeds
case.dataset.effect.null_value.sentinel.columns.0 = a
case.dataset.effect.null_value.sentinel.columns.1 = b
case.dataset.effect.null_value.sentinel.rows.0.0 = null
case.dataset.effect.null_value.sentinel.rows.0.1 = foo

# A NON-default quote character, so the setting is what decides the parse. The doubled quote inside a
# quoted field is the quoting dialect's own escape: honoured, the value holds one quote character;
# ignored, the default double quote applies, nothing is quoted, and the single quotes are literal text.
case.dataset.effect.quote.doubled_inside_field.content = a,b\n'x''y',2\n
case.dataset.effect.quote.doubled_inside_field.settings.quote = '
case.dataset.effect.quote.doubled_inside_field.outcome = query_succeeds
case.dataset.effect.quote.doubled_inside_field.columns.0 = a
case.dataset.effect.quote.doubled_inside_field.columns.1 = b
case.dataset.effect.quote.doubled_inside_field.rows.0.0 = x'y
case.dataset.effect.quote.doubled_inside_field.rows.0.1 = 2

# A quoted field carrying the delimiter. The header is plain, so both parses give two columns and only
# the value shows which happened: honoured it is one field containing a comma, ignored the row has
# three fields against a two-column header.
case.dataset.effect.quote.protects_delimiter_in_value.content = a,b\n'x,y',2\n
case.dataset.effect.quote.protects_delimiter_in_value.settings.quote = '
case.dataset.effect.quote.protects_delimiter_in_value.outcome = query_succeeds
case.dataset.effect.quote.protects_delimiter_in_value.columns.0 = a
case.dataset.effect.quote.protects_delimiter_in_value.columns.1 = b
case.dataset.effect.quote.protects_delimiter_in_value.rows.0.0 = x,y
case.dataset.effect.quote.protects_delimiter_in_value.rows.0.1 = 2

# What the dataset registration endpoint must refuse, and the message it must refuse with.
#
# A case names the settings it registers, so it states the combination outright rather than deriving
# it. Most pin one setting. The ones at the bottom pin two that are each accepted alone and refused
# together -- an error budget with no error mode, a probe window only too wide at that probe count --
# which is the shape a crossing that varies settings one at a time never reaches.
#
# They are not dimensions for that reason: there is nothing to derive. A dimension earns a verdict
# against every other dimension so a generator can decide what to cross; a refusal already says.
#
# The message is the assertion, not decoration. A case that checks only the status passes when a
# setting it never varied is refused for an unrelated reason, and downstream the two are the same
# green tick. Every message below is a SUBSTRING of what the component emits, chosen to name the
# offending setting and the constraint it broke -- so a reworded sentence survives and a changed rule
# does not.
#
# Every message here was read out of the component that emits it, not written from what it ought to
# say. A contract asserting a message nobody implements is a suite that goes red on correct code.
#
# Shape:
#   case.<name>.settings.<key>   a dataset setting to register; repeat for a combination
#   case.<name>.message   a substring the refusal must contain
#   case.<name>.emitter   the symbol the message was read from, so the next reader can check it
#   case.<name>.format    optional; the format the dataset is registered as (default: csv)

# --- coordinator-level range checks -------------------------------------------------------------
#
# DataSourceValidationUtils.validateInt, reached from FileDataSourceValidator for schema_sample_size
# with bounds [1, SCHEMA_SAMPLE_SIZE_MAX]. Two different bad values, two different messages: a
# non-numeric value never reaches the range check, so a suite that asserted one message for both
# would pass while the parse and the bound were the same branch.

case.dataset.setting.schema_sample_size.negative.settings.schema_sample_size = -1
case.dataset.setting.schema_sample_size.negative.message = [schema_sample_size] must be between 1 and 20000, got [-1]
case.dataset.setting.schema_sample_size.negative.emitter = DataSourceValidationUtils.validateInt

case.dataset.setting.schema_sample_size.zero.settings.schema_sample_size = 0
case.dataset.setting.schema_sample_size.zero.message = [schema_sample_size] must be between 1 and 20000, got [0]
case.dataset.setting.schema_sample_size.zero.emitter = DataSourceValidationUtils.validateInt

# The upper bound exists because it must not sit below the readers' own default of 20000, or the
# validator forbids the value the reader uses when the user says nothing. One above it is the edge
# that pins which side of the bound is inclusive.
case.dataset.setting.schema_sample_size.above_max.settings.schema_sample_size = 20001
case.dataset.setting.schema_sample_size.above_max.message = [schema_sample_size] must be between 1 and 20000, got [20001]
case.dataset.setting.schema_sample_size.above_max.emitter = DataSourceValidationUtils.validateInt

case.dataset.setting.schema_sample_size.not_a_number.settings.schema_sample_size = foo
case.dataset.setting.schema_sample_size.not_a_number.message = [schema_sample_size] must be a number, got [foo]
case.dataset.setting.schema_sample_size.not_a_number.emitter = DataSourceValidationUtils.validateInt

# --- coordinator-level range checks, the other bounded integer --------------------------------
#
# skip_rows takes the same validateInt path with its own bound, which is what makes it worth
# carrying: the two settings share the code and would share a defect, so a contract naming only one
# of them would go green on a change that broke both.

case.dataset.setting.skip_rows.negative.settings.skip_rows = -1
case.dataset.setting.skip_rows.negative.message = [skip_rows] must be between 0 and 1000, got [-1]
case.dataset.setting.skip_rows.negative.emitter = DataSourceValidationUtils.validateInt

case.dataset.setting.skip_rows.above_max.settings.skip_rows = 1001
case.dataset.setting.skip_rows.above_max.message = [skip_rows] must be between 0 and 1000, got [1001]
case.dataset.setting.skip_rows.above_max.emitter = DataSourceValidationUtils.validateInt

case.dataset.setting.skip_rows.not_a_number.settings.skip_rows = later
case.dataset.setting.skip_rows.not_a_number.message = [skip_rows] must be a number, got [later]
case.dataset.setting.skip_rows.not_a_number.emitter = DataSourceValidationUtils.validateInt

# --- combinations ------------------------------------------------------------------------------
#
# The refusals worth having at registration. Each setting below is accepted on its own; what is
# refused is the pair. A contract of one setting per case cannot reach either of these, and neither
# can a crossing that only varies settings independently.

# ErrorPolicy.validateRegistrationBudget. An error budget with nothing to spend it on: max_errors and
# max_error_ratio each need an explicit error_mode, because the budget decides how many bad rows are
# tolerated and the mode decides what tolerating one means.
case.dataset.combination.error_budget_without_mode.settings.max_errors = 10
case.dataset.combination.error_budget_without_mode.message = [max_errors] and [max_error_ratio] each require an explicit [error_mode]
case.dataset.combination.error_budget_without_mode.emitter = ErrorPolicy.validateRegistrationBudget

case.dataset.combination.error_ratio_without_mode.settings.max_error_ratio = 0.1
case.dataset.combination.error_ratio_without_mode.message = [max_errors] and [max_error_ratio] each require an explicit [error_mode]
case.dataset.combination.error_ratio_without_mode.emitter = ErrorPolicy.validateRegistrationBudget

# FileSplitProvider.validateProbeBudget. Neither value is out of range; their product is. This is the
# shape a per-setting bound check cannot catch, and the message names both settings because the user
# has to choose which one to lower.
case.dataset.combination.probe_budget_exceeded.settings.split_probe_window = 64mb
case.dataset.combination.probe_budget_exceeded.settings.max_split_probes = 1000
case.dataset.combination.probe_budget_exceeded.message = Invalid combination of [split_probe_window]
case.dataset.combination.probe_budget_exceeded.emitter = FileSplitProvider.validateProbeBudget

# Two more rules that read several settings. Both are dependencies rather than bounds: the value is
# fine, and what makes it invalid is another setting's value, or its absence.

# PartitionConfig.validate. Template detection has nothing to match against without the template.
case.dataset.combination.template_detection_without_path.settings.partition_detection = template
case.dataset.combination.template_detection_without_path.message = [partition_detection] is [template] but no [partition_path] was given
case.dataset.combination.template_detection_without_path.emitter = PartitionConfig.validate

# FileOrderConfig.validate. File ordering only means anything when the first file decides the schema;
# under any other resolution the order the files are read in does not change the answer, so asking
# for one is a mistake rather than a preference.
case.dataset.combination.file_order_without_first_file_wins.settings.file_sort_by = name
case.dataset.combination.file_order_without_first_file_wins.settings.schema_resolution = union_by_name
case.dataset.combination.file_order_without_first_file_wins.message = [file_sort_by] and [file_order] are only valid when effective schema resolution is first_file_wins
case.dataset.combination.file_order_without_first_file_wins.emitter = FileOrderConfig.validate

# --- single-setting vocabulary checks -----------------------------------------------------------
#
# DataSourceValidationUtils.validateEnum names the accepted values back, which is the part worth
# pinning: a message that only said the value was wrong would leave the user guessing the vocabulary.

case.dataset.setting.partition_detection.unknown_value.settings.partition_detection = sideways
case.dataset.setting.partition_detection.unknown_value.message = [partition_detection] must be one of
case.dataset.setting.partition_detection.unknown_value.emitter = DataSourceValidationUtils.validateEnum

# --- accepted at registration, failing at query --------------------------------------------------
#
# Registration performs no I/O, so it cannot know the bytes disagree with the settings. These cases
# pin both halves at once: the PUT must succeed, and the query must fail with the message below. A
# PUT that starts refusing one means registration acquired I/O.

case.dataset.format.parquet_declared_over_text_bytes.settings.format = parquet
case.dataset.format.parquet_declared_over_text_bytes.resource = noext
case.dataset.format.parquet_declared_over_text_bytes.outcome = query_fails
case.dataset.format.parquet_declared_over_text_bytes.message = as a Parquet file: 
case.dataset.format.parquet_declared_over_text_bytes.emitter = ParquetFormatReader.ParquetReadFailures.wrap

# --- blocked on a filed defect -------------------------------------------------------------------
#
# A case here asserts behaviour the product does not have yet. It names the issue that will make it
# pass, and the suite skips it until then. The citation is what closes the loop: without it the case
# sits excluded long after the defect is fixed, which loses exactly the coverage it was written to add.

# A resource written as a filesystem path rather than a URI is refused, correctly. What this case
# pins is the SECOND error that comes with it: schema_sample_size is a valid CSV setting, and it is
# reported as unknown only because the failed resource left the format unresolved and the accepted
# vocabulary collapsed to the coordinator keys. A user reading it deletes the setting, fixes the
# path, and registers a dataset silently missing what they asked for.
#
# `absent` is the whole assertion. The registration IS refused, so a status-only case passes today,
# and so does one asserting only the schemes message. What must change is that the second error stops
# being emitted.
case.dataset.resource.path_not_uri_reports_settings_unknown.settings.schema_sample_size = 500
case.dataset.resource.path_not_uri_reports_settings_unknown.resource = simple.csv
case.dataset.resource.path_not_uri_reports_settings_unknown.resource_form = path
case.dataset.resource.path_not_uri_reports_settings_unknown.message = [resource] must use one of the supported URI schemes
case.dataset.resource.path_not_uri_reports_settings_unknown.absent = unknown setting [schema_sample_size]
case.dataset.resource.path_not_uri_reports_settings_unknown.emitter = FileDataSourceValidator.validateResource
case.dataset.resource.path_not_uri_reports_settings_unknown.blocked_by = elastic/esql-planning#1999

# --- accepted, and actually taking effect --------------------------------------------------------
#
# The outcome no status can detect. A setting that is accepted, plumbed to the reader and then ignored
# returns rows exactly as one that worked does. What separates them is the shape of the result, which
# needs bytes that parse differently under the declared value than under the default.
#
# simple.csv is `a,b` over two comma-separated rows. Read with the declared delimiter it is ONE column
# named `a,b`; read with the default comma -- which is what an ignored setting gives -- it is two
# columns, `a` and `b`. So the column list is the whole assertion, and it fails in the direction that
# matters: a setting that stops being honoured produces the two-column shape.
case.dataset.setting.delimiter.takes_effect.settings.delimiter = |
case.dataset.setting.delimiter.takes_effect.outcome = query_succeeds
case.dataset.setting.delimiter.takes_effect.columns.0 = a,b

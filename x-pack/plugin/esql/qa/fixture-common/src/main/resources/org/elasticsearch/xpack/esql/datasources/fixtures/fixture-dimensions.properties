# --- format-specific config keys -------------------------------------------------------------------
#
# The keys the CRUD validator treats as belonging to a particular format, so that a dataset carrying one
# must resolve a format before it can be registered. globCannotCarryAFormatKey asks this to decide
# whether a `?` glob dataset would hit elastic/esql-planning#1841.
#
# A MIRROR of the plugins' FormatSpec.configKeys(), and named as one rather than dressed up as a
# derivation. It cannot be derived: FileDataSourceValidator.allFormatConfigKeys is private, its resolver
# is built from the plugin registry at node start, and fixture-common cannot depend on the format
# plugins. An earlier version computed the set from dimensions carrying `applies_to` and claimed in its
# javadoc to be "asking the product"; it was asking a different registry -- which slots VARY, not which
# keys are format-specific -- and came out six keys short. column_prefix was among the missing, and two
# routed specs declare it; they escaped a 400 only because the same directives also declare header_row.
#
# Drift is loud in one direction and quiet in the other. A key the plugins add and this list lacks shows
# up as a dataset that registers and then 400s -- visible. A key here that the plugins drop only over-
# filters, which is silent, so the list is checked against the declared dimensions by
# testEveryFormatScopedDimensionKeyIsDeclaredFormatSpecific.
#
# csv/tsv: CsvDataSourcePlugin.FORMAT_CONFIG_KEYS. ndjson adds segment_size
# (NdJsonDataSourcePlugin.FORMAT_CONFIG_KEYS). parquet and orc register none.
format_specific_keys = delimiter, mode, quote, escape, comment, null_value, encoding, datetime_format, \
    max_field_size, multi_value_syntax, header_row, column_prefix, trim_spaces, schema_sample_size, \
    segment_size

# --- tiers ----------------------------------------------------------------------------------------
#
# Which battery a value earns a place in. Everything expressible runs in the nightly; a value named
# `ci:` ALSO runs in the battery that gates every pull request, and has to cite the defect that
# earned it. A per-format entry overrides a bare one, exactly as absences do -- which is how a value
# that is the default on one format can still be a selection on another.
#
# The selection is an argument about yield, not about size. It was drawn by counting where this
# project's filed correctness defects actually cluster and taking the value combinations those
# clusters are reachable through, so every line below names a place the reader has been broken --
# not a place it could be. Pairwise completion is enough for it: every defect cited here is
# reachable by a PAIR of values, or by one value against a case that pins a key.
#
# Nothing here can claim a cell the matrix does not run. A `tier` on a value declared gap, rule or
# bug fails the parse, because promoting an absent cell announces coverage that cannot exist --
# the silent pass this whole contract is built to prevent, wearing a selection's clothes.

# A declaration changes the row-width check, the split gate and the compressed read all at once,
# and it is the largest single cluster of filed defects in the corpus.
dimension.dataset.schema_mode.tier.declared_closed = ci: elastic/esql-planning#1842, elastic/esql-planning#1105 -- \
    a declared closed schema changes row-width checking, the split gate and the compressed read

# The cold control against a warm default. The corpus warms itself -- cases over one file run back to
# back -- so without an `off` vector every listing and schema result is read from cache after the
# first case, and the derivation path that produced it is never exercised twice.
dimension.cluster.cache_enabled.tier.off = ci: elastic/esql-planning#1167, elastic/esql-planning#1142 -- \
    the corpus warms itself, so nothing re-derives a listing or a schema unless the cache is off

# Escaped mode is the one dialect built around escaping and the one that gets it wrong: the header
# splitter, the record splitter and the value decoder honour escape-protects-next-byte, the data-row
# split does not. Plain and quoted are each the other format's default, so selecting each on the
# format where it is NOT the default is what makes the pair reachable at all.
dimension.data.text_mode.tier.escaped = ci: elastic/esql-planning#1880, elastic/esql-planning#1101 -- \
    escaped mode disagrees with itself about escapes between the header split and the data-row split
dimension.data.text_mode.tier.plain.csv = ci: elastic/esql-planning#1054 -- \
    plain is tsv's default and csv's variation; the tokenizer arms disagree on whitespace
dimension.data.text_mode.tier.quoted.tsv = ci: elastic/esql-planning#683 -- \
    quoted is csv's default and tsv's variation, and tsv's quote handling is separately reachable

# web_logs carries a semicolon inside data, so a semicolon delimiter puts the delimiter and the data
# in conflict -- which is exactly the shape #1880 splits wrongly.
dimension.data.delimiter.tier.semicolon = ci: elastic/esql-planning#1880, elastic/esql-planning#1636 -- \
    the one non-default delimiter any dataset also carries inside its data

# Bracket multi-values need quote-aware tokenisation, so they reach the tokenizer through a path no
# other value does.
dimension.data.mv_syntax.tier.brackets = ci: elastic/esql-planning#1842, elastic/esql-planning#1051 -- \
    brackets need quote-aware tokenisation, reaching the scanner by a path no other value takes

# Both non-default reconciliations, because they fail in opposite directions: strict rejects what
# union accepts, first_file_wins silently keeps the wrong one.
dimension.dataset.schema_resolution.tier.strict = ci: elastic/esql-planning#1823 -- \
    strict rejects a sparse file union accepts, and the rejection path is separate
dimension.dataset.schema_resolution.tier.first_file_wins = ci: elastic/esql-planning#1403 -- \
    first_file_wins keeps one file's schema silently, so a disagreement shows up as wrong data

# The compressed read is a separate code path from the plain one, and gzip is the codec every
# text format actually ships against.
dimension.data.text_codec.tier.gzip = ci: elastic/esql-planning#1105, elastic/esql-planning#1109 -- \
    the compressed read is its own path, and gzip is the codec the text formats ship against

# Explicit hive detection, not the auto default: auto and hive take different decisions on the same
# tree, and the pruning layers disagree about which one they were given.
dimension.dataset.partition_detection.tier.hive = ci: elastic/esql-planning#1544, elastic/esql-planning#1324 -- \
    explicit hive and auto take different decisions on the same tree

# A glob disables pushdown, so every pushdown path is reached twice -- once with it and once without.
# Declared per format rather than bare because the formats do not cite the same defects: parquet cites
# the pushdown mis-pruning, orc the superset-mask negation, and the text formats the pattern defects
# filed against csv resources. A bare entry would flatten five separate arguments into one unattributed
# claim, and the citation is the whole point of a `ci:` line.
dimension.layout.path_shape.tier.glob.csv = ci: elastic/esql-planning#1794, elastic/esql-planning#1795 -- \
    the pattern defects were filed against csv resources, and a glob disables pushdown
dimension.layout.path_shape.tier.glob.tsv = ci: elastic/esql-planning#1794, elastic/esql-planning#1795 -- \
    the pattern defects were filed against csv resources, and tsv shares the reader
dimension.layout.path_shape.tier.glob.ndjson = ci: elastic/esql-planning#1794, elastic/esql-planning#1795 -- \
    a glob disables pushdown, so the pushdown paths are reached with and without it
dimension.layout.path_shape.tier.glob.parquet = ci: elastic/esql-planning#1794, elastic/esql-planning#1155 -- \
    a glob disables pushdown, so parquet's pushdown paths are reached with and without it
dimension.layout.path_shape.tier.glob.orc = ci: elastic/esql-planning#1795, elastic/esql-planning#1775 -- \
    a glob disables pushdown, so orc's pushdown paths are reached with and without it

# Row-error policy, where skip_row carries more filed defects than null_field and shares the policy
# path with it.
dimension.dataset.error_mode.tier.skip_row = ci: elastic/esql-planning#1842, elastic/esql-planning#1148 -- \
    skip_row carries the row-error policy path, which null_field shares and fewer defects reach

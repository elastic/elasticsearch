# storage_scheme's non-default values are carried by the SUITE, not by a vector. Every case already runs
# against every backend -- the /S3, /GCS, /AZURE suffix in a test name is that crossing -- and the suite
# now reads this declaration to build its backend list. So the dimension earns its place as the mapping
# scheme -> backend, while no vector pins it: seamServes refuses the backend seam by design.
# Declared per value rather than once, because the audit's unit is the cell.
dimension.storage_scheme.rule.gs = rule: the backend axis is crossed by the suite, not pinned by a vector
dimension.storage_scheme.rule.wasbs = rule: the backend axis is crossed by the suite, not pinned by a vector
dimension.storage_scheme.rule.http = rule: the backend axis is crossed by the suite, not pinned by a vector
dimension.storage_scheme.rule.file = rule: the backend axis is crossed by the suite, not pinned by a vector

# template needs a partition_path, and the template that path carries describes the layout on disk, so no
# constant here can supply it -- which is what dimension.partition_detection.derived.template records.
# It was reported reachable until the audit stopped keeping its own copy of seamServes: the copy's
# directive arm omitted the derived-value condition the crossing enforces.
dimension.partition_detection.rule.template = rule: requires a partition_path describing the on-disk \
    layout, which no constant value can supply

# Whether the external-source caches are on. A second identical query reads an entirely different path
# with them on, which is why cache identity has already produced defects in this area -- a warm COUNT(*)
# serving another dataset's number is a fixed bug in this branch's own history.
#
# Bound to cluster_setting, not pragma: it is a cluster-wide setting the suite updates around a case and
# puts back. Only DYNAMIC settings can be carried this way. Of the fourteen esql.external.* settings just
# three are dynamic -- this, max_glob_expansion and max_discovered_files -- and the rest are NodeScope and
# would need a cluster per value, which is the `cluster` seam's problem.
#
# Format-agnostic, so it reaches every format. That matters most for parquet, which declares no
# format-specific settings at all and so depends entirely on dimensions like this one.
dimension.cache_enabled.values = on, off
dimension.cache_enabled.default = on
dimension.cache_enabled.binds = cluster_setting
dimension.cache_enabled.key = esql.external.cache.enabled
dimension.cache_enabled.value.on = true
dimension.cache_enabled.value.off = false


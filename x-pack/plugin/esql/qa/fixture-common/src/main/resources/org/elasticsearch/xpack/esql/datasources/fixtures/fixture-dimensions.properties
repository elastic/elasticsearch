# --- typed absences -------------------------------------------------------------------------------
# Every cell below is off its effective default and cannot be reached by any named vector today. The
# audit fails the build on an absence that is not declared here, and equally on an entry whose cell
# HAS become reachable -- so deleting an entry is how a seam's arrival gets verified.
#
# "Reachable" means a vector can select it. Several values below are exercised every day by the
# hand-configured suites; that is not the same claim, and the wording says which is which.

# Backends: the blob fixtures serve anonymously. Nothing local enforces a credential, so a vector
# asking for one would pass for the wrong reason -- the read would succeed with no auth performed.
dimension.datasource.auth_mode.gap.auto = gap: no fixture backend enforces credentials, so an auth vector cannot be distinguished from anonymous
dimension.datasource.auth_mode.gap.static_credentials = gap: same -- needs a fixture that rejects unauthenticated reads before this can assert anything
dimension.datasource.auth_mode.rule.federated_identity = rule: needs a cloud identity-provider endpoint; no local fixture can impersonate one
dimension.datasource.auth_mode.rule.managed_identity = rule: needs a cloud instance-metadata endpoint; no local fixture can impersonate one

# Clusters: these are node settings, so a vector cannot pin them per query -- each value needs its own
# configured cluster, and the vector has to select the cluster rather than the request.
dimension.cluster.cluster_size.gap.multi = gap: the multi-node suite exists but no vector routes to it
dimension.cluster.direct_block.gap.off = gap: a node-level setting; needs its own cluster before a vector can select it

# Pragmas: distribution has a declared key and no seam that applies it. The key alone is deliberately
# not enough -- see FixtureContractAudit.PRAGMA_SEAM_WIRED.

# ORC fixtures are generated for every layout and 360 ORC vectors derive, but no ORC vector suite
# consumes them. Declared rather than left to look like coverage because the directory is full.

# Resolver seam: the same bytes asked for a different way. Not wired yet.
# comma_list stays absent, and for a reason that is not "unwired": a one-element comma list resolves
# identically to exact, so on the standalone templates the vector regime reads it would assert nothing.
# It is meaningful only where a template names several files, which needs the multifile layouts to be
# vector-selectable first.
dimension.layout.path_shape.rule.comma_list = rule: a one-element comma list is indistinguishable from exact, and standalone templates name one file

# A `?` glob cannot be registered on the text formats: FileDataSourceValidator.extractObjectName truncates
# the object key at the first `?`, applying URL query semantics to an object-store key, so the extension is
# gone before format inference runs. The error only fires when a format-specific setting is present.
#
# There is no per-format absence for this any more, on any format. It used to be blanket on csv and tsv,
# and that was true only because withJsonForSource injected trim_spaces into every text dataset, so a
# format-specific key was always there. Injection is data-driven now -- only datasets whose rows are
# actually padded get it -- so five of the ten declared datasets carry no format-specific key and register
# under a glob perfectly well. csv and tsv generate 398 and 376 glob vectors.
#
# Read that vector count for what it is. A vector is expressible; how many CASES it reaches is a separate
# question, and on csv the answer is small: three of those five datasets are read only by parquet suites,
# and web_logs is never read from a text spec without an explicit multi_value_syntax. tsv is where the
# reopened cell is broad, because employees_no_mv is unpadded there and it is the most-routed template in
# the corpus.
#
# What remains is a per-CASE question, not a per-format one, and there are two of them. Does THIS dataset,
# under THIS vector, end up carrying a format-specific key? globCannotCarryAFormatKey asks it at the
# crossing, consulting format_specific_keys, the case's own directive, the vector's injections, and
# whether the harness adds one. And would the shape reach the resolver at all? Only the STANDALONE branch
# of resolveTemplatePath applies it -- every other layout resolves through its own declared glob -- so
# pathShapeCannotCarry drops a pair whose sources are all non-standalone, which would otherwise read the
# exact-path bytes under a name saying glob. Deleting the first filter is the verification when #1841 is
# fixed; the second is not about the defect and stays.

# ORC's cell is not blocked by the defect above. It registers no format-specific config keys at all --
# OrcDataSourcePlugin declares FormatSpec.of("orc", ".orc"), whose key set is empty -- so #1841 has nothing
# to truncate, which puts ORC in parquet's position rather than csv's. The cell was previously declared a
# rule on the grounds that no suite consumed ORC vectors; OrcVectorSpecIT consumes them now, so the reason
# no longer holds and the shape is served.

# Fixture dialects: no generator renders a non-default text dialect. csv fixtures are written quoted and
# tsv plain, and nothing writes the other spellings -- so these are absent bytes, not absent wiring.
# Per-format on purpose: quoted IS the default for csv, so this absence exists only on tsv. A bare
# entry would be declaring the baseline missing, which the parser rejects outright.
# csv renders these now; tsv does not, because TsvFixtureGenerator has no --vector-variants mode yet.
# Per-format rather than bare, so the csv half stays deleted and the tsv half stays visible -- a bare
# entry would have to be re-added wholesale and would hide that csv already works.
# csv RENDERS headerless bytes -- the generator writes them and they are correct. What is missing is a
# spec that can read them: a headerless CSV synthesizes col0..colN, so every existing case naming emp_no
# or gender fails to resolve, which is the reader behaving correctly. Covering this cell needs a spec
# written against synthesized names, not more generation. Bytes without a reader is exactly the ORC
# situation, and a capability row here would claim coverage nothing can exercise.
dimension.data.header_row.rule.false.csv = rule: csv-headerless pins header_row in its own dataset directive and asserts against the synthesized col0..colN names, so the behaviour is covered directly; a vector pinning it would be filtered by directivePins on that spec and would name columns no other spec's expectations have
dimension.data.header_row.gap.false.tsv = gap: csv-headerless is a CSV-only spec and tsv has no counterpart, so nothing asserts against synthesized col0..colN names on tsv. Unlike the csv cell this is a genuine gap -- someone must write the spec, not merely wire a vector
# The bracket data DOES exist -- employees.csv is written with bracket multi-values and the suites read
# it. What is missing is a vector that can select the dialect, which is a different claim.

# Text codecs: gzip/zstd/bzip2 variants are produced at fixture-load time and the compressed SUITES run
# them every build. They are absent from the VECTOR regime only.
dimension.data.text_codec.rule.brotli = rule: the available brotli library decompresses only, so no fixture can be written

# Parquet codecs: all five off-default values are generated and run by the compressed parquet suites.
# lz4_legacy was the last holdout, and not because the codec is unreadable: PlainCompressionCodecFactory
# registers Lz4HadoopFramedBytesDecompressor for it, so ES|QL reads it and deliberately refuses to WRITE
# it (getCompressor(LZ4) throws). No ES|QL-side writer could ever produce the fixture. Stock parquet-java
# can, once lz4-java is on the generator classpath -- parquet-hadoop reaches for LZ4Factory to write it.


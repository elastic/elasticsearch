# CsvFormatReader warns on exactly `parsedMode == ESCAPED && quoting`, and an explicit quote override is
# what turns quoting on -- so naming a quote in escaped mode silently retires the C-style decode (\N to
# null, \t to tab) that escaped mode exists for. The reader says so on the response header, which is a
# warning a spec asserting none will fail on. Only single is disjoint: double is the default, renders
# nothing, and is therefore never explicitly set.
pair.quote.text_mode.value_disjoint = single:escaped
pair.quote.text_mode.value_disjoint.why = CsvFormatReader warns that a quote override in escaped mode turns quoting on and disables the escaped-mode decode

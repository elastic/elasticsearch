# ES|QL external-datasource test dimensions and their pairwise interactions.
# Groups are DERIVED from the pair verdicts as maximal cliques -- never hand-written.
# An `independent` verdict is a licence to skip cells, so it carries its mechanism.
#
# binds -- how a value becomes real, and therefore what it costs:
#   fixture   changes the bytes on disk, so the vector requires a generated fixture
#   directive becomes a key in the dataset WITH clause; free, pure spec text
#   backend   selects the storage backend the suite already cross-products
#   pragma    becomes a query pragma
#   cluster   is a node setting, so the vector needs its own cluster configuration
#

dimension.format.values = csv, tsv, ndjson, orc, parquet
dimension.format.default = csv
dimension.format.binds = fixture
dimension.text_mode.values = quoted, escaped, plain
dimension.text_mode.default = quoted
dimension.text_mode.binds = fixture
# A fixture written in a non-default dialect is unreadable unless the directive says so, so a
# fixture-bound value still needs a reader key -- the bytes and the announcement are one change.
dimension.text_mode.read_key = mode
# The reader rejects brackets outright with any non-quoting mode -- the bracket scanner needs
# quote-aware tokenisation. Neither value is absent on its own, so no per-cell gap can say this;
# only the PAIR is unconstructible, and without declaring it the derivation emits 688 vectors that
# look expressible and can never run.
pair.mv_syntax.text_mode.value_disjoint = brackets:plain, brackets:escaped
pair.mv_syntax.text_mode.value_disjoint.why = CsvFormatReader rejects multi_value_syntax=brackets with any non-quoting mode
# The reader default is per-extension, not global: .tsv reads plain, .csv reads quoted. Without
# this every tsv vector would claim to vary a slot that was already at its baseline.
dimension.text_mode.default.tsv = plain
dimension.text_mode.applies_to = csv, tsv
dimension.mv_syntax.values = none, brackets
dimension.mv_syntax.default = none
dimension.mv_syntax.binds = fixture
dimension.mv_syntax.read_key = multi_value_syntax
dimension.mv_syntax.applies_to = csv, tsv

# The field separator itself. This is the parsing grammar rather than a transport detail, which is why
# it sits with the dialect dimensions: text_mode decides HOW a field is delimited from its neighbours
# (quoting vs escaping), and delimiter decides WHAT the boundary is. The two interact -- a value holding
# the delimiter is exactly what quoting exists for -- so the pair is worth crossing rather than fixing
# one and varying the other.
#
# The slot names a character rather than spelling it, because `,` is the values list's own separator and
# a bare tab is invisible in a properties file. value.<v> carries the real spelling through to the
# reader setting; the generator maps the same names to the char it renders with.
#
# tsv defaults to tab and csv to comma: same dimension, different baseline, exactly as text_mode does.
# A csv fixture rendered with tabs is a legitimate configuration, not a mislabelled tsv -- the format
# decides the extension and the reader, the delimiter decides the bytes.
dimension.delimiter.values = comma, tab, semicolon, pipe
dimension.delimiter.default = comma
dimension.delimiter.default.tsv = tab
dimension.delimiter.binds = fixture
dimension.delimiter.read_key = delimiter
dimension.delimiter.applies_to = csv, tsv
dimension.delimiter.value.comma = ,
# Written as the two-character escape \\t, not a literal tab: Properties would turn a literal \\t into a
# real tab and the contract parser trims every value, so the character would vanish and the dimension
# would silently render with an empty delimiter. delimiterChar decodes the escape.
# The escape survives the whole path because it is also JSON's escape: injectSetting writes the spelling
# into the WITH clause verbatim, so `\\t` reaches the reader as a real tab after the JSON is parsed.
# Verified for all four values -- writer char and reader char agree, tab included (both U+0009).
dimension.delimiter.value.tab = \\t
dimension.delimiter.value.semicolon = ;
dimension.delimiter.value.pipe = |

# The other two thirds of the parsing grammar. delimiter says where a field ends; quote says how a field
# that CONTAINS the boundary is protected, and escape says how it is protected when quoting is not in use.
# Each is a setting the reader accepts, so a fixture must be writable in whatever the vector announces --
# rendering with a hard-coded quote while telling the reader `quote=\'` produces bytes that parse cleanly
# and mean something else, which is the failure with no symptom.
#
# quote only bites in the QUOTED dialect and escape only in ESCAPED, so both interact with text_mode; both
# also interact with delimiter, since the character being protected is the one they protect it from.
dimension.quote.values = double, single
dimension.quote.default = double
dimension.quote.binds = fixture
dimension.quote.read_key = quote
dimension.quote.applies_to = csv, tsv
dimension.quote.value.double = "
dimension.quote.value.single = '

dimension.escape.values = backslash, tilde
dimension.escape.default = backslash
dimension.escape.binds = fixture
dimension.escape.read_key = escape
dimension.escape.applies_to = csv, tsv
dimension.escape.value.backslash = \\
dimension.escape.value.tilde = ~
dimension.header_row.values = true, false
dimension.header_row.default = true
dimension.header_row.binds = fixture
dimension.header_row.read_key = header_row
dimension.header_row.applies_to = csv, tsv
dimension.schema_resolution.values = union_by_name, first_file_wins, strict
dimension.schema_resolution.default = union_by_name
dimension.schema_resolution.binds = directive
dimension.schema_resolution.key = schema_resolution
# schema_mode: only declared_closed reaches DECLARED provenance in the reader. The two declared_*
# values differ by the `dynamic` flag the injected mappings carry -- declared_open emits
# dynamic:true, declared_closed dynamic:false -- and ExternalSourceResolver.isDeclaredSchema
# requires Dynamic.FALSE. So declared_open keeps SchemaProvenance.INFERRED and positional
# binding: it is mappings-with-inference-overlay, NOT a declared schema, whatever its name
# suggests. Both still differ from `inferred` (a mappings object is present and validated), so
# all three values are distinct configurations -- but a reader who assumes both declared_* values
# exercise declared provenance will mis-attribute any result that turns on it.
dimension.schema_mode.values = inferred, declared_open, declared_closed
dimension.schema_mode.default = inferred
dimension.schema_mode.binds = directive
# No scalar WITH key expresses this: declared_open/declared_closed are the presence and shape of the
# 'mappings' object, whose content is the dataset's own schema. So the value cannot be a constant in
# this file -- the suite supplies it from the dataset it is reading.
# The value rides the reserved `mappings` key; its CONTENT is the dataset's own schema, so `derived`
# stays alongside the key rather than instead of it. declared_open sends dynamic:true with the
# declarable columns and lets the reader infer the rest; declared_closed sends dynamic:false, which
# demands every column be declared and therefore only works where every column IS declarable.
dimension.schema_mode.key = mappings
dimension.schema_mode.derived = dataset_schema
dimension.datetime_format.values = default, custom
dimension.datetime_format.default = default
dimension.datetime_format.binds = directive
dimension.datetime_format.key = datetime_format
# 'custom' must still parse the fixture bytes, so it is a different SPELLING of the same instant
# grammar rather than a different grammar -- this varies the directive path, not the data.
dimension.datetime_format.value.custom = strict_date_optional_time
dimension.datetime_format.applies_to = csv, tsv, ndjson
dimension.path_shape.values = exact, glob, comma_list
dimension.path_shape.default = exact
# Not fixture-bound: the same files on disk are reached by a literal path, a glob or a comma list,
# so what varies is how the resolver is asked, not what was written.
dimension.path_shape.binds = resolver
dimension.partition_detection.values = auto, hive, template, none
dimension.partition_detection.default = auto
dimension.partition_detection.binds = directive
dimension.partition_detection.key = partition_detection
# 'template' does not stand on its own: it requires a partition_path, and the template that path
# carries describes the layout on disk, so no constant here can supply it. Found by the generated
# suite -- the dataset registration is rejected with a clear message, which is correct behaviour.
dimension.partition_detection.derived.template = partition_path
dimension.storage_scheme.values = s3, gs, wasbs, http, file
dimension.storage_scheme.default = s3
dimension.storage_scheme.binds = backend
# Declared rather than inferred by convention: this is exactly the correspondence that rots when
# a backend is renamed and nothing points at the old name any more.
dimension.storage_scheme.backend.s3 = S3
dimension.storage_scheme.backend.gs = GCS
dimension.storage_scheme.backend.wasbs = AZURE
dimension.storage_scheme.backend.http = HTTP
dimension.storage_scheme.backend.file = LOCAL
# Which backend actually exhibits each capability. Total by construction: a partial map would read
# as 'these have a backend and the rest do not', which is a forgotten line wearing a decision's face.
dimension.auth_mode.values = anonymous, auto, static_credentials, federated_identity, managed_identity
dimension.auth_mode.default = anonymous
dimension.auth_mode.binds = backend
dimension.text_codec.values = none, gzip, zstd, bzip2, brotli, lz4, snappy
dimension.text_codec.default = none
dimension.text_codec.binds = fixture
dimension.text_codec.applies_to = csv, tsv, ndjson
# The extension a codec appends to the format token. The vector regime picks ONE canonical extension
# per codec; the matrix's multi-extension coverage (.zst and .zstd, .bz and .bz2) stays the compressed
# suites' job, because that is an axis about the reader's suffix dispatch, not about the vector.
dimension.text_codec.ext.gzip = gz
dimension.text_codec.ext.zstd = zst
dimension.text_codec.ext.bzip2 = bz2
dimension.text_codec.ext.lz4 = lz4
dimension.text_codec.ext.snappy = snappy
dimension.parquet_codec.values = uncompressed, snappy, gzip, zstd, lz4_raw, lz4_legacy
dimension.parquet_codec.default = uncompressed
dimension.parquet_codec.binds = fixture
dimension.parquet_codec.applies_to = parquet
dimension.error_mode.values = fail_fast, skip_row, null_field
dimension.error_mode.default = fail_fast
dimension.error_mode.binds = directive
dimension.error_mode.key = error_mode
dimension.distribution.values = adaptive, coordinator_only, round_robin, weighted_round_robin
dimension.distribution.default = adaptive
dimension.distribution.binds = pragma
dimension.distribution.key = external_distribution
dimension.cluster_size.values = single, multi
dimension.cluster_size.default = single
dimension.cluster_size.binds = cluster
dimension.direct_block.values = on, off
dimension.direct_block.default = on
dimension.direct_block.binds = cluster
dimension.direct_block.applies_to = csv, tsv


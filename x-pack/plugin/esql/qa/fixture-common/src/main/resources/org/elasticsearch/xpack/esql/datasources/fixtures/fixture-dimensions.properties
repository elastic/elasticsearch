# The verdict above stays `independent` and stays true: the two DO act at different stages of the read
# path. What follows is not a read-path interaction, it is a registration defect, and the distinction is
# the reason this is a value_disjoint with a `bug:` reason rather than a re-verdict.
#
# A `?` glob plus any format-specific setting fails PUT /_query/dataset with "cannot determine format":
# FileDataSourceValidator.extractObjectName truncates the object key at the first `?`, applying URL
# query-string semantics to an object-store key, which deletes the extension before format inference
# runs. datetime_format is a format-specific key, so the pair is unconstructible.
#
# Global rather than per-format, because the pair is unconstructible wherever it can be formed:
# datetime_format applies_to csv, tsv and ndjson, and on any of them a glob dataset carrying it hits the
# defect. Measured on ndjson before it was declared -- 715 failures across three nightly shards, every one
# carrying both values and nothing else in common. On csv and tsv the crossing filter would catch it too
# (datetime_format is on format_specific_keys), so this declaration is the statement of record and the
# filter is the belt.
#
# NOT a blanket glob exclusion. ndjson globs fine on its own -- the pull-request tier runs about 1,524
# glob cases green -- and csv and tsv now generate 398 and 376 glob vectors each. Blanket-excluding any of
# them would delete all of that.
#
# Deleting these two lines is the verification when #1841 is fixed.
pair.dataset.datetime_format.layout.path_shape.value_disjoint = custom:glob
pair.dataset.datetime_format.layout.path_shape.value_disjoint.why = bug: elastic/esql-planning#1841 -- CRUD truncates the object key \
    at the `?`, so a glob dataset carrying a format-specific setting cannot be registered

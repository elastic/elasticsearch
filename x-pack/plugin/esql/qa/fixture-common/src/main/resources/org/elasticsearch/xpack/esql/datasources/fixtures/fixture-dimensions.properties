# --- typed absences -------------------------------------------------------------------------------
# Every cell below is off its effective default and cannot be reached by any named vector today. The
# audit fails the build on an absence that is not declared here, and equally on an entry whose cell
# HAS become reachable -- so deleting an entry is how a seam's arrival gets verified.
#
# "Reachable" means a vector can select it. Several values below are exercised every day by the
# hand-configured suites; that is not the same claim, and the wording says which is which.

# Backends: the blob fixtures serve anonymously. Nothing local enforces a credential, so a vector
# asking for one would pass for the wrong reason -- the read would succeed with no auth performed.
dimension.auth_mode.gap.auto = gap: no fixture backend enforces credentials, so an auth vector cannot be distinguished from anonymous
dimension.auth_mode.gap.static_credentials = gap: same -- needs a fixture that rejects unauthenticated reads before this can assert anything
dimension.auth_mode.rule.federated_identity = rule: needs a cloud identity-provider endpoint; no local fixture can impersonate one
dimension.auth_mode.rule.managed_identity = rule: needs a cloud instance-metadata endpoint; no local fixture can impersonate one

# Clusters: these are node settings, so a vector cannot pin them per query -- each value needs its own
# configured cluster, and the vector has to select the cluster rather than the request.
dimension.cluster_size.gap.multi = gap: the multi-node suite exists but no vector routes to it
dimension.direct_block.gap.off = gap: a node-level setting; needs its own cluster before a vector can select it

# Pragmas: distribution has a declared key and no seam that applies it. The key alone is deliberately
# not enough -- see FixtureContractAudit.PRAGMA_SEAM_WIRED.

# ORC fixtures are generated for every layout and 360 ORC vectors derive, but no ORC vector suite
# consumes them. Declared rather than left to look like coverage because the directory is full.

# Resolver seam: the same bytes asked for a different way. Not wired yet.
# comma_list stays absent, and for a reason that is not "unwired": a one-element comma list resolves
# identically to exact, so on the standalone templates the vector regime reads it would assert nothing.
# It is meaningful only where a template names several files, which needs the multifile layouts to be
# vector-selectable first.
dimension.path_shape.rule.comma_list = rule: a one-element comma list is indistinguishable from exact, and standalone templates name one file

# A `?` glob cannot be registered on the text formats: FileDataSourceValidator.extractObjectName truncates
# the object key at the first `?`, applying URL query semantics to an object-store key, so the extension is
# gone before format inference runs. The error only fires when a format-specific setting is present, which
# on csv/tsv is nearly always (delimiter, mode, multi_value_syntax, trim_spaces ...). Measured: 3,528 csv
# and 768 tsv failures, every one carrying path_shape=glob. ndjson and parquet keep the shape -- parquet
# registers no format-specific keys at all since elastic/elasticsearch#157868.
# This is a defect, not a gap and not a rule: nobody has to build anything, and nothing about the product
# says a glob may not carry an extension. It is unreachable until the issue is fixed, and the citation is
# what distinguishes "blocked on a known defect" from "nobody got to it".
dimension.path_shape.bug.glob.csv = bug: elastic/esql-planning#1841 -- CRUD truncates the object key at the \
    `?`, so a glob dataset carrying any format-specific setting fails registration with "cannot determine format"
dimension.path_shape.bug.glob.tsv = bug: elastic/esql-planning#1841 -- CRUD truncates the object key at the \
    `?`, so a glob dataset carrying any format-specific setting fails registration with "cannot determine format"

# ORC's cell is not blocked by the defect above. It registers no format-specific config keys at all --
# OrcDataSourcePlugin declares FormatSpec.of("orc", ".orc"), whose key set is empty -- so #1841 has nothing
# to truncate, which puts ORC in parquet's position rather than csv's. The cell was previously declared a
# rule on the grounds that no suite consumed ORC vectors; OrcVectorSpecIT consumes them now, so the reason
# no longer holds and the shape is served.

# Fixture dialects: no generator renders a non-default text dialect. csv fixtures are written quoted and
# tsv plain, and nothing writes the other spellings -- so these are absent bytes, not absent wiring.
# Per-format on purpose: quoted IS the default for csv, so this absence exists only on tsv. A bare
# entry would be declaring the baseline missing, which the parser rejects outright.
# csv renders these now; tsv does not, because TsvFixtureGenerator has no --vector-variants mode yet.
# Per-format rather than bare, so the csv half stays deleted and the tsv half stays visible -- a bare
# entry would have to be re-added wholesale and would hide that csv already works.
# csv RENDERS headerless bytes -- the generator writes them and they are correct. What is missing is a
# spec that can read them: a headerless CSV synthesizes col0..colN, so every existing case naming emp_no
# or gender fails to resolve, which is the reader behaving correctly. Covering this cell needs a spec
# written against synthesized names, not more generation. Bytes without a reader is exactly the ORC
# situation, and a capability row here would claim coverage nothing can exercise.
dimension.header_row.rule.false.csv = rule: csv-headerless pins header_row in its own dataset directive and asserts against the synthesized col0..colN names, so the behaviour is covered directly; a vector pinning it would be filtered by directivePins on that spec and would name columns no other spec's expectations have
dimension.header_row.gap.false.tsv = gap: csv-headerless is a CSV-only spec and tsv has no counterpart, so nothing asserts against synthesized col0..colN names on tsv. Unlike the csv cell this is a genuine gap -- someone must write the spec, not merely wire a vector
# The bracket data DOES exist -- employees.csv is written with bracket multi-values and the suites read
# it. What is missing is a vector that can select the dialect, which is a different claim.

# Text codecs: gzip/zstd/bzip2 variants are produced at fixture-load time and the compressed SUITES run
# them every build. They are absent from the VECTOR regime only.
dimension.text_codec.rule.brotli = rule: the available brotli library decompresses only, so no fixture can be written

# Parquet codecs: four are generated and run by the compressed parquet suites; lz4_legacy is written by
# nothing at all, which is why it is a different sentence.
dimension.parquet_codec.gap.lz4_legacy = gap: no generator writes this codec at all, in any suite

# Pairings for `delimiter`. Interacting where one dimension changes what the other means: the delimiter
# is the field boundary, so anything that also decides where a field starts or how many fields a row has
# is entangled with it. Everything else acts elsewhere in the read path.
pair.auth_mode.delimiter = independent
pair.auth_mode.delimiter.why = verified: the two act at different stages of the read path and neither feeds the other
pair.cluster_size.delimiter = independent
pair.cluster_size.delimiter.why = verified: the two act at different stages of the read path and neither feeds the other
pair.datetime_format.delimiter = independent
pair.datetime_format.delimiter.why = verified: the two act at different stages of the read path and neither feeds the other
pair.delimiter.direct_block = independent
pair.delimiter.direct_block.why = verified: the two act at different stages of the read path and neither feeds the other
pair.delimiter.distribution = independent
pair.delimiter.distribution.why = verified: the two act at different stages of the read path and neither feeds the other
pair.delimiter.error_mode = interacting
pair.delimiter.error_mode.why = the delimiter decides how many fields a row yields, and the field count is what the row-width check tests, so it decides which rows reach the error policy
pair.delimiter.format = interacting
pair.delimiter.format.why = the effective default differs per format (comma on csv, tab on tsv), so the format decides this dimension's baseline
pair.delimiter.header_row = interacting
pair.delimiter.header_row.why = the header line is split by the same delimiter as the data, so the delimiter decides the column names as well as the values
pair.delimiter.mv_syntax = interacting
pair.delimiter.mv_syntax.why = a bracketed multi-value holds the delimiter as ordinary text ("[alpha,beta]" under a comma delimiter), so the pair decides whether a row splits into the declared number of fields at all
pair.delimiter.parquet_codec = independent
pair.delimiter.parquet_codec.why = verified: the two act at different stages of the read path and neither feeds the other
pair.delimiter.partition_detection = independent
pair.delimiter.partition_detection.why = verified: the two act at different stages of the read path and neither feeds the other
pair.delimiter.path_shape = independent
pair.delimiter.path_shape.why = verified: the two act at different stages of the read path and neither feeds the other
pair.delimiter.schema_mode = interacting
pair.delimiter.schema_mode.why = a declared schema fixes the expected column count while the delimiter fixes the produced one, and the two are compared against each other
pair.delimiter.schema_resolution = independent
pair.delimiter.schema_resolution.why = verified: the two act at different stages of the read path and neither feeds the other
pair.delimiter.storage_scheme = independent
pair.delimiter.storage_scheme.why = verified: the two act at different stages of the read path and neither feeds the other
pair.delimiter.text_codec = independent
pair.delimiter.text_codec.why = verified: the two act at different stages of the read path and neither feeds the other
pair.delimiter.text_mode = interacting
pair.delimiter.text_mode.why = quoting exists precisely to protect a value containing the delimiter, so which character is the delimiter decides what must be quoted


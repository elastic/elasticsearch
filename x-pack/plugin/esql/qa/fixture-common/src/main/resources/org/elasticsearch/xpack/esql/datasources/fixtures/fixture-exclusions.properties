# 1970-01-01T00:00:00.000000002Z (2 nanoseconds) instead of ...00.002Z (2 milliseconds). The
# half of the pair already declared date_nanos reads correctly, so it is the millis-to-nanos
# conversion that is missing, not the type. Same reconciliation path as the cases above.
# ----------------------------------------------------------------------------------------------
exclude.parquet-rs.external-multifile-temporal.temporalWidensToMinMax = bug: @widening-date-date-nanos
exclude.parquet-rs.external-multifile-temporal.temporalWidensToFilteredMinMax = bug: @widening-date-date-nanos
exclude.parquet-rs.external-multifile-type-drift.typeDriftFilterIsStringComparison = bug: the reconciliation cast to keyword is \
  never applied, so the widened column stays an int and the string comparison matches nothing -- \
  "Expected more data but no more entries found". Same missing-cast cause as \
  typeDriftWidensToKeyword and typeDriftExtremaAreLexicographic, NOT the date_nanos rescale.


# ----------------------------------------------------------------------------------------------
# Found by promoting external-hive-partitioned-shadow.csv-spec from Parquet-local to shared: the case
# had never run outside Parquet. NOT an NDJSON defect -- Java Parquet fails identically given a file
# whose footer genuinely lacks the column. NDJSON is simply the only format here whose files can
# express whole-file absence, so it is the only suite that trips it on these fixtures.
# ----------------------------------------------------------------------------------------------
exclude.ndjson.external-hive-partitioned-shadow.noneStopsTheColumnSubstitution = bug: @split-discovery-drops-whole-file

exclude.ndjson.external-multifile-resolution.strictAggregateByGender = rule: @strict-resolution-rejects-divergent

# ----------------------------------------------------------------------------------------------
# The compressed NDJSON suite carries the same STRICT-resolution rules as the uncompressed one:
# compression does not change which schemas reconcile, so an entry that holds for ndjson holds for
# every codec of it. (The six SchemaAdaptingIterator entries this block once described were deleted
# in e054259 -- the defect they named was fixed, and the compressed suite had inherited them by
# copying a pre-fix list.)
# ----------------------------------------------------------------------------------------------
exclude.ndjson-compressed.external-multifile-resolution.strictCount = rule: @strict-resolution-rejects-divergent
exclude.ndjson-compressed.external-multifile-resolution.strictFilterAndSort = rule: @strict-resolution-rejects-divergent
exclude.ndjson-compressed.external-multifile-resolution.strictSalaryStats = rule: @strict-resolution-rejects-divergent
exclude.ndjson-compressed.external-multifile-resolution.strictAggregateByGender = rule: @strict-resolution-rejects-divergent

# The compressed suite carries its own token, so the same defect needs its own entries. Both point at the
# shared reasons above rather than restating them.
exclude.ndjson-compressed.external-hive-partitioned-shadow.noneStopsTheColumnSubstitution = bug: @split-discovery-drops-whole-file
exclude.ndjson-compressed.external-multifile-temporal.temporalWidensToMinMax = bug: @ndjson-inference-no-date-nanos
exclude.ndjson-compressed.external-multifile-temporal.temporalWidensToFilteredMinMax = bug: @ndjson-inference-no-date-nanos

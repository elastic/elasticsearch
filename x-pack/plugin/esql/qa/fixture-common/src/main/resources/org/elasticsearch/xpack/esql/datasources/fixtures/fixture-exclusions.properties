# Found by promoting external-hive-partitioned-shadow.csv-spec from Parquet-local to shared: the case
# had never run outside Parquet. NOT an NDJSON defect -- Java Parquet fails identically given a file
# whose footer genuinely lacks the column. NDJSON is simply the only format here whose files can
# express whole-file absence, so it is the only suite that trips it on these fixtures.
# ----------------------------------------------------------------------------------------------
exclude.ndjson.noneStopsTheColumnSubstitution = bug: elastic/esql-planning#1791 -- split discovery drops \
  a whole file whose schema shares no column with the query's projection (FileSplitProvider, \
  skipIfNoColumnOverlap), so the ten default-partition rows are never read and form no null group: 90 of \
  100 rows are accounted for. The sibling case passes because partition detection supplies the column \
  from the path, so every file overlaps the projection.

exclude.ndjson.strictCount = rule: STRICT resolution rejects the divergent-schema fixture at resolution time.
exclude.ndjson.strictFilterAndSort = rule: STRICT resolution rejects the divergent-schema fixture at resolution time.
exclude.ndjson.strictSalaryStats = rule: STRICT resolution rejects the divergent-schema fixture at resolution time.
# ----------------------------------------------------------------------------------------------
# Found by promoting external-hive-partitioned-shadow.csv-spec from Parquet-local to shared: the case
# had never run outside Parquet. ORC, Parquet and TSV all return the null group; NDJSON alone does not.
# ----------------------------------------------------------------------------------------------
exclude.ndjson.noneStopsTheColumnSubstitution = bug: elastic/esql-planning#1791 -- an NDJSON record that \
  OMITS a property is excluded from STATS ... BY that property instead of grouping as null, so the ten \
  rows in the default partition go missing and 90 of 100 rows are accounted for. The sibling case in the \
  same spec passes here because it reads the partition key from the path rather than the physical column.

exclude.ndjson.strictAggregateByGender = rule: STRICT resolution rejects the divergent-schema fixture at resolution time.

# ----------------------------------------------------------------------------------------------
# The compressed NDJSON suite carries the same STRICT-resolution rules as the uncompressed one:
# compression does not change which schemas reconcile, so an entry that holds for ndjson holds for
# every codec of it. (The six SchemaAdaptingIterator entries this block once described were deleted
# in e054259 -- the defect they named was fixed, and the compressed suite had inherited them by
# copying a pre-fix list.)
# ----------------------------------------------------------------------------------------------
exclude.ndjson-compressed.strictCount = rule: STRICT resolution rejects the divergent-schema fixture at resolution time, so these \
  cases cannot run against it -- the rejection is the correct behaviour, not a defect.
exclude.ndjson-compressed.strictFilterAndSort = rule: STRICT resolution rejects the divergent-schema fixture at resolution time, so these \
  cases cannot run against it -- the rejection is the correct behaviour, not a defect.
exclude.ndjson-compressed.strictSalaryStats = rule: STRICT resolution rejects the divergent-schema fixture at resolution time, so these \
  cases cannot run against it -- the rejection is the correct behaviour, not a defect.
exclude.ndjson-compressed.strictAggregateByGender = rule: STRICT resolution rejects the divergent-schema fixture at resolution time, so these \
  cases cannot run against it -- the rejection is the correct behaviour, not a defect.

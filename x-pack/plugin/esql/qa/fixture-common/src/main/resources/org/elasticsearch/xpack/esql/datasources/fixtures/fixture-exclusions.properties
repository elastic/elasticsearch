# ----------------------------------------------------------------------------------------------
# Widening `date` to `date_nanos` does not RESCALE: the millis value 2 comes back as
# 1970-01-01T00:00:00.000000002Z (2 nanoseconds) instead of ...00.002Z (2 milliseconds). The
# half of the pair already declared date_nanos reads correctly, so it is the millis-to-nanos
# conversion that is missing, not the type. Same reconciliation path as the cases above.
# ----------------------------------------------------------------------------------------------
exclude.parquet-rs.temporalWidensToMinMax = bug: Widening `date` to `date_nanos` does not RESCALE: the millis value 2 comes back as \
  1970-01-01T00:00:00.000000002Z (2 nanoseconds) instead of ...00.002Z (2 milliseconds). The half \
  of the pair already declared date_nanos reads correctly, so it is the millis-to-nanos conversion \
  that is missing, not the type. Same reconciliation path as the cases above.
exclude.parquet-rs.temporalWidensToFilteredMinMax = bug: Widening `date` to `date_nanos` does not RESCALE: the millis value 2 comes back as \
  1970-01-01T00:00:00.000000002Z (2 nanoseconds) instead of ...00.002Z (2 milliseconds). The half \
  of the pair already declared date_nanos reads correctly, so it is the millis-to-nanos conversion \
  that is missing, not the type. Same reconciliation path as the cases above.
exclude.parquet-rs.typeDriftFilterIsStringComparison = bug: the reconciliation cast to keyword is \
  never applied, so the widened column stays an int and the string comparison matches nothing -- \
  "Expected more data but no more entries found". Same missing-cast cause as \
  typeDriftWidensToKeyword and typeDriftExtremaAreLexicographic, NOT the date_nanos rescale.

# ----------------------------------------------------------------------------------------------
# parquet-rs binds columns across files by physical POSITION rather than by name, so a glob
# whose files carry the same columns in different order reads the wrong column: the reversed
# file's leading r:double is taken as the unified schema's leading p:integer and the query
# fails with "Expected [INT] but was [DOUBLE]". The fixture gives its columns distinct types
# precisely so this cannot pass silently. The Java Parquet, ORC, NDJSON, CSV and TSV readers
# all pass these cases. Re-enable once parquet-rs reconciles cross-file column order by name.
# ----------------------------------------------------------------------------------------------
exclude.parquet-rs.parquetPermThreeColumnReorder = bug: parquet-rs binds columns across files by physical POSITION rather than by name, so a glob whose \
  files carry the same columns in different order reads the wrong column: the reversed file's \
  leading r:double is taken as the unified schema's leading p:integer and the query fails with \
  "Expected [INT] but was [DOUBLE]". The fixture gives its columns distinct types precisely so \
  this cannot pass silently. The Java Parquet, ORC, NDJSON, CSV and TSV readers all pass these \
  cases. Re-enable once parquet-rs reconciles cross-file column order by name.

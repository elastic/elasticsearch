#
# What we are NOT testing, and why.
#
# A spec case runs on every suite that loads its file. An entry here takes it away from one suite,
# and every entry says why. Before this file the same information lived in five separate Java sets
# -- ParquetFormatSpecIT, ParquetRsFormatSpecIT, OrcFormatSpecIT, NdJsonFormatSpecIT and
# NdJsonCompressedFormatSpecIT -- so nobody could answer "what are we not testing?" without reading
# all five, and it was easy to work in this area for a long time without knowing two of them existed.
#
# Each suite still enforces its own exclusions; it now reads them from here instead of holding its
# own list. Making membership itself declarative -- so a suite runs everything unless excluded,
# rather than only what it names -- is the remaining half, tracked separately.
#
# Valid suite tokens. An exclusion naming anything else is rejected at load: a typo silently creates
# a phantom suite whose entries never apply to any test, which looks exactly like a working exclusion.
suites = csv, tsv, ndjson, ndjson-compressed, orc, parquet, parquet-rs, iceberg

# Format:
#   exclude.<suite>.<caseName> = <kind>: <why>
#
# <suite> is the format token: parquet, parquet-rs, orc, ndjson, ndjson-compressed.
# <kind> is one of:
#   bug  -- a defect. The case is right and the reader is wrong. Deleting the entry is the fix's
#           verification. Name the symptom so nobody has to re-derive it.
#   rule -- the suite cannot express the case at all. Permanent; nothing to fix.
#
# NOT yet enforced: a key naming a case no spec declares still does nothing silently. Catching that
# needs the list of cases a suite actually loaded, which lives in the suites rather than here. Until
# it is wired, an entry whose case was renamed or fixed rots quietly -- which is exactly how six
# ndjson-compressed entries outlived by three months the defect they named.
#

# ----------------------------------------------------------------------------------------------
# Filtering a column that schema reconciliation widened to keyword pushes the comparison down
# and evaluates it against the file's PRE-widening type, so in the file where `code` is
# declared integer the pushdown holds a Number while the literal is a BytesRef and the cast
# fails with a 500 (ParquetPushedExpressions.evaluateComparison). Reading and aggregating the
# same widened column both work -- only the pushed filter fails -- and ORC passes this case
# against the same rows. Re-enable once a pushed comparison is evaluated against the
# reconciled column type rather than the per-file declared type.
# ----------------------------------------------------------------------------------------------
exclude.parquet.typeDriftFilterIsStringComparison = bug: Filtering a column that schema reconciliation widened to keyword pushes the comparison down and \
  evaluates it against the file's PRE-widening type, so in the file where `code` is declared \
  integer the pushdown holds a Number while the literal is a BytesRef and the cast fails with a \
  500 (ParquetPushedExpressions.evaluateComparison). Reading and aggregating the same widened \
  column both work -- only the pushed filter fails -- and ORC passes this case against the same \
  rows. Re-enable once a pushed comparison is evaluated against the reconciled column type rather \
  than the per-file declared type.


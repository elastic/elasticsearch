# ----------------------------------------------------------------------------------------------
# The mixed-temporal pair declares one file `date` and the other `date_nanos`, and ORC cannot
# round-trip the nanos half: OrcFormatReader maps TIMESTAMP and TIMESTAMP_INSTANT to DATETIME
# and has no DATE_NANOS mapping. OrcFixtureGenerator therefore refuses the type rather than
# writing it as a string, and the fixture matrix declares that cell absent -- so these cases
# have no data to read here. Reader work, not fixture work; re-enable when ORC gains
# DATE_NANOS.
# ----------------------------------------------------------------------------------------------
exclude.orc.temporalWidensToMinMax = rule: The mixed-temporal pair declares one file `date` and the other `date_nanos`, and ORC cannot \
  round-trip the nanos half: OrcFormatReader maps TIMESTAMP and TIMESTAMP_INSTANT to DATETIME and \
  has no DATE_NANOS mapping. OrcFixtureGenerator therefore refuses the type rather than writing it \
  as a string, and the fixture matrix declares that cell absent -- so these cases have no data to \
  read here. Reader work, not fixture work; re-enable when ORC gains DATE_NANOS.
exclude.orc.temporalWidensToFilteredMinMax = rule: The mixed-temporal pair declares one file `date` and the other `date_nanos`, and ORC cannot \
  round-trip the nanos half: OrcFormatReader maps TIMESTAMP and TIMESTAMP_INSTANT to DATETIME and \

# unknown parquet column [job_positions] referenced in projection (reported in the schema as
# "element")
# ----------------------------------------------------------------------------------------------

# ----------------------------------------------------------------------------------------------
# unknown parquet column [salary_change] referenced in projection (reported in the schema as
# "element")

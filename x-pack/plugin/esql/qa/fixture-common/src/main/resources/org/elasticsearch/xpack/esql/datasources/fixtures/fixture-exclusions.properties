# ----------------------------------------------------------------------------------------------
# TODO: parquet-rs OrdinalBytesRefBlock validity buffer is not 8-byte padded per the Arrow
# columnar spec; AbstractArrowBufBlock.areAllValuesNull reads it as a long and throws
# IndexOutOfBoundsException. Both the multi-key PackedValuesBlockHash path and the single-key
# BytesRefBlockHash path (line 77) call areAllValuesNull, so any STATS ... BY <keyword> on a
# multi-file glob fails with "index: 0, length: 8 (expected: range(0, N))". Single-file STATS
# BY tests pass only because the standalone parquet-rs output happens to allocate a buffer >= 8
# bytes. Re-enable once the parquet-rs reader pads validity buffers correctly.
# ----------------------------------------------------------------------------------------------

# ----------------------------------------------------------------------------------------------
# parquet-rs does not reconcile schemas across a multi-file glob, in two ways that share a
# cause. It resolves a projection against ONE file's schema, so a column present only in the
# other file is rejected outright ("unknown parquet column [city] ... Known columns name, age,
# score") instead of null-filling. And it does not apply the reconciliation cast, so a column
# the unified schema widened comes back as its per-file type -- integer where long was
# expected, integer where keyword was expected -- surfacing as an IntArrowBufBlock that cannot
# be cast to BytesRefBlock, and as a string comparison matching nothing. Not every aggregate
# escapes: ubnUnionKeepsAllRows (COUNT) and ubnWidenedColumnAggregates (MIN/MAX) both pass,
# but typeDriftExtremaAreLexicographic does not, because its extrema come back as the wrong
# block type. The Java Parquet and ORC readers pass all of these, and NDJSON passes every one
# it runs. CSV runs its own twin specs rather than these files, so it is not evidence either
# way for the typeDrift cases. Re-enable once parquet-rs reconciles across files.
# ----------------------------------------------------------------------------------------------

# ----------------------------------------------------------------------------------------------
# Widening `date` to `date_nanos` does not RESCALE: the millis value 2 comes back as
# 1970-01-01T00:00:00.000000002Z (2 nanoseconds) instead of ...00.002Z (2 milliseconds). The
# half of the pair already declared date_nanos reads correctly, so it is the millis-to-nanos
# conversion that is missing, not the type. Same reconciliation path as the cases above.
# ----------------------------------------------------------------------------------------------

# ----------------------------------------------------------------------------------------------
# parquet-rs binds columns across files by physical POSITION rather than by name, so a glob
# whose files carry the same columns in different order reads the wrong column: the reversed
# file's leading r:double is taken as the unified schema's leading p:integer and the query
# fails with "Expected [INT] but was [DOUBLE]". The fixture gives its columns distinct types
# precisely so this cannot pass silently. The Java Parquet, ORC, NDJSON, CSV and TSV readers
# all pass these cases. Re-enable once parquet-rs reconciles cross-file column order by name.
# ----------------------------------------------------------------------------------------------

# ----------------------------------------------------------------------------------------------
# Nested STRUCT subfield projection (external-nested-struct.csv-spec) is implemented by the
# Java parquet reader only; parquet-rs does not yet flatten struct schemas.
# ----------------------------------------------------------------------------------------------

# ----------------------------------------------------------------------------------------------
# A LIST leaf reached through a STRUCT (e.g. answers.text where answers is struct<text:
# list<...>>) is bound by its flattened logical name only by the Java parquet reader; parquet-
# rs does not yet flatten struct schemas, so the leaf resolves to no column descriptor and
# reads as all-null (COUNT returns 0, values/min/max are null). Re-enable once parquet-rs
# binds list-under-struct leaves by their flattened name in both the read and aggregate-
# statistics paths.
# ----------------------------------------------------------------------------------------------

# ----------------------------------------------------------------------------------------------
# The mixed-temporal pair declares one file `date` and the other `date_nanos`, and ORC cannot
# round-trip the nanos half: OrcFormatReader maps TIMESTAMP and TIMESTAMP_INSTANT to DATETIME
# and has no DATE_NANOS mapping. OrcFixtureGenerator therefore refuses the type rather than
# writing it as a string, and the fixture matrix declares that cell absent -- so these cases
# have no data to read here. Reader work, not fixture work; re-enable when ORC gains
# DATE_NANOS.
# ----------------------------------------------------------------------------------------------
exclude.orc.external-multifile-temporal.temporalWidensToMinMax = bug: @mixed-temporal-pair-declares
exclude.orc.external-multifile-temporal.temporalWidensToFilteredMinMax = bug: @mixed-temporal-pair-declares

# ----------------------------------------------------------------------------------------------
# STRICT resolution rejects the divergent-schema fixture at resolution time.
# ----------------------------------------------------------------------------------------------
exclude.ndjson.external-multifile-resolution.strictCount = rule: @strict-resolution-rejects-divergent
exclude.ndjson.external-multifile-resolution.strictFilterAndSort = rule: @strict-resolution-rejects-divergent
exclude.ndjson.external-multifile-resolution.strictSalaryStats = rule: @strict-resolution-rejects-divergent
# ----------------------------------------------------------------------------------------------
# Surfaced by routing external-multifile-temporal.csv-spec to NDJSON for the first time. NDJSON infers
# its schema, and the inferrer's type set stops at DATETIME, so the mixed-temporal pair cannot widen to
# DATE_NANOS -- the decode path supports the type, only inference never produces it.
# ----------------------------------------------------------------------------------------------

# ----------------------------------------------------------------------------------------------
# Found by promoting external-hive-partitioned-shadow.csv-spec from Parquet-local to shared: the case
# had never run outside Parquet. NOT an NDJSON defect -- Java Parquet fails identically given a file
# whose footer genuinely lacks the column. NDJSON is simply the only format here whose files can
# express whole-file absence, so it is the only suite that trips it on these fixtures.
# ----------------------------------------------------------------------------------------------

exclude.ndjson.external-multifile-resolution.strictAggregateByGender = rule: @strict-resolution-rejects-divergent

# ----------------------------------------------------------------------------------------------
# The compressed NDJSON suite carries the same STRICT-resolution rules as the uncompressed one:
# compression does not change which schemas reconcile, so an entry that holds for ndjson holds for
# every codec of it. (The six SchemaAdaptingIterator entries this block once described were deleted
# in e054259 -- the defect they named was fixed, and the compressed suite had inherited them by
# copying a pre-fix list.)
# ----------------------------------------------------------------------------------------------
exclude.ndjson-compressed.external-multifile-resolution.strictCount = rule: @strict-resolution-rejects-divergent
exclude.ndjson-compressed.external-multifile-resolution.strictFilterAndSort = rule: @strict-resolution-rejects-divergent
exclude.ndjson-compressed.external-multifile-resolution.strictSalaryStats = rule: @strict-resolution-rejects-divergent
exclude.ndjson-compressed.external-multifile-resolution.strictAggregateByGender = rule: @strict-resolution-rejects-divergent

# The compressed suite carries its own token, so the same defect needs its own entries. Both point at the
# shared reasons above rather than restating them.

# Vector-qualified: these cases pass under every other configuration and fail only when a vector pins
# schema_resolution=strict. An unqualified exclusion would disable them under all 27 vectors and quietly
# discard the 21 that pass, which is coverage lost to bookkeeping rather than to a defect.

# parquet-rs is out of scope by decision (user, 2026-08-28): the reader is not a target, so its defects
# are not owed a fix and its exclusions are rules rather than untracked bugs. Recorded as a decision, not
# a silence -- if parquet-rs returns to scope these become bugs again and each needs a filed issue.

# A dialect fixture is a typed-value RE-RENDER, not a copy of the authored bytes, so byte-level details
# of the original do not survive it: alignment padding is gone (the parser consumed it), and in QUOTED
# mode a null and an empty string are both written as an empty field, because QUOTED has no spelling to
# tell them apart -- ESCAPED writes \N precisely because it does. Cases asserting those details are
# therefore unrunnable on a re-rendered tree. This is a property of the approach, not a defect in the
# reader, so it is a rule: nothing is owed a fix. It IS a real limit on what the dialect seam can cover,
# and closing it would need line-faithful rendering, which cannot also change the dialect.
reason.rerender-drops-authored-byte-detail = rule: dialect fixtures are re-rendered from typed values, so \
    alignment padding and the null-versus-empty distinction of the authored bytes are not preserved; a case \
    asserting either cannot run against them.
# Padding is lost by EVERY re-rendered slug, not only the dialect ones -- the parser consumes it before
# any dialect decision is made. So this case is unrunnable on the brackets tree too.

# A declared schema is NOT a no-op even when it declares exactly what the canonical header says. The
# header spells some columns `text`, and inference cannot produce TEXT -- it yields KEYWORD for the same
# bytes. So declaring the header faithfully changes the column type, and a case whose expected block was
# written against inferred types legitimately disagrees. Measured: [title] KEYWORD != TEXT.
# Rule, not bug: the reader is right, the declaration is faithful, and the two simply describe different
# things. What it costs is real and worth naming -- these cases cannot exercise the schema_mode seam.
reason.declared-schema-changes-inferred-types = rule: declaring the canonical header's own types changes \
    columns inference reads differently (notably text, which inference never produces), so a case pinning \
    inferred types cannot run under a declared schema.
exclude.parquet-vector.external-multivalue.topSnippetsFunction@schema_mode.declared_open = rule: @declared-schema-changes-inferred-types
exclude.parquet-vector.external-multivalue.scoreFunction@schema_mode.declared_open = rule: @declared-schema-changes-inferred-types
exclude.parquet-vector.external-multivalue.externalRerankBooks@schema_mode.declared_open = rule: @declared-schema-changes-inferred-types
exclude.parquet-vector.external-hive-partitioned-shadow.shadowedColumnSubstitutionAndWarning@schema_mode.declared_open = rule: @declared-schema-collides-with-partition-column
exclude.parquet-vector.parquet-partition-detection.shadowedColumnSubstitutionAndWarning@schema_mode.declared_open = rule: @declared-schema-collides-with-partition-column

# ORC meets the same two rules as parquet-vector, verified from its own runs rather than assumed from
# the shared case names: scoreFunction, topSnippetsFunction and externalRerankBooks all fail
# KEYWORD != TEXT on [title] (text is the type inference never produces), and the shadow case returns
# the partition-key collision 400. The full parquet-vector set is mirrored.
#
# externalRerankBooks was withheld on the first pass because it had not failed -- but that run was
# killed partway and simply never reached it. Absence of a failure in a truncated run is not evidence
# the case passes, which is exactly the reading that withheld it.
exclude.orc-vector.external-multivalue.scoreFunction@schema_mode.declared_open = rule: @declared-schema-changes-inferred-types
exclude.orc-vector.external-multivalue.topSnippetsFunction@schema_mode.declared_open = rule: @declared-schema-changes-inferred-types
exclude.orc-vector.external-multivalue.externalRerankBooks@schema_mode.declared_open = rule: @declared-schema-changes-inferred-types
exclude.orc-vector.external-hive-partitioned-shadow.shadowedColumnSubstitutionAndWarning@schema_mode.declared_open = rule: @declared-schema-collides-with-partition-column

# The hive_shadow layout buckets `employees` by `languages` and derives `languages` back as a partition
# column from the directory names (layout.hive_shadow.partition_column). A declared schema is built from
# the canonical header, which also carries `languages` -- so the declaration necessarily redeclares a
# column the partitioning derives, and the reader refuses rather than pick a winner. Refusing is right:
# the two values come from different places and silently preferring either is how a shadowed column
# becomes a wrong answer. The case exists precisely to pin the shadowing behaviour, so it cannot also be
# the case that declares a schema over it.
reason.declared-schema-collides-with-partition-column = rule: a declared schema redeclares the column \
    hive partitioning derives from the directory names, and the reader refuses the collision.

# The reader requires quoting to delimit a bracketed multi-value, so `brackets` and a non-quoting dialect
# are mutually exclusive by the reader's own rule, not by anything this harness chose. csv never met it:
# csv defaults to quoted. tsv defaults to plain, so tsv is the first format where a vector can pin a
# dialect that the case's own multi_value_syntax contradicts.
reason.brackets-requires-quoting = rule: multi_value_syntax [brackets] requires quoting, so a case \
    declaring brackets cannot run under a vector pinning a non-quoting text_mode.

exclude.tsv-vector.external-hive-partitioned-shadow.shadowedColumnSubstitutionAndWarning@schema_mode.declared_open = rule: @declared-schema-collides-with-partition-column
exclude.tsv-vector.tsv-multivalue.tsvScalarWithBracketsParsesSame@text_mode.escaped = rule: @brackets-requires-quoting

# Keyed on the mode rather than the delimiter because the mode is what is broken: in escaped mode the
# data-row field split does not consult the escape character, so a backslash-escaped delimiter inside a
# field is treated as a field boundary and the row comes back too wide. Only semicolon actually trips
# this case today -- its User-Agent value is the one field carrying the delimiter byte -- but an
# exclusion may carry a single condition, and naming `delimiter.semicolon` would point at the data
# rather than at the defect. Deleting this entry is the verification when #1880 is fixed.
exclude.csv-vector.csv-multivalue.csvScalarWithNoneParses@text_mode.escaped = bug: elastic/esql-planning#1880 -- escaped mode splits data rows at a backslash-escaped delimiter (header split, record segmentation and value decode all honour it; the data-row split does not), so the row is reported wider than the schema and the query fails with a column-count 400

# Arrived with the main merge (#157115) and was swept into the vector suites by the /csv-*.csv-spec glob.
# Its premise is the fixture's DEFAULT materialization: mv_sample's row is `1,[alpha,beta,gamma],10`, and
# with a comma delimiter and multi_value_syntax=none the brackets are not multivalue syntax, so the row
# over-splits to five fields against three declared columns and skip_row drops it. Under any vector that
# moves the delimiter, or changes how the generator WRITES the brackets, the row is well-formed and both
# rows survive -- the case is not wrong, its premise simply is not true off the default dialect.
#
# Unconditional rather than keyed on one dimension: it fails under delimiter, escape, quote and text_mode
# alike, and an exclusion carries a single condition. The behaviour stays covered where it is meaningful,
# in the base csv suite, which runs this spec at the default dialect. The file's own header says it holds
# "cases that depend on the CSV materialization of the fixture" -- which is exactly what vectors vary.
#
# Its sibling strictDeclaredSchemaDoesNotImplyTrimming is deliberately NOT excluded here: it already
# carries a narrower exclusion of its own (@rerendered.true, below) and passes under every other vector,
# so a file-level exclusion would retire coverage that works.
exclude.csv-vector.csv-only-declared-dialect.strictDeclaredSchemaKeepsRowWidthValidation = rule: @materialization-dependent-row-width
exclude.tsv-vector.csv-only-declared-dialect.strictDeclaredSchemaKeepsRowWidthValidation = rule: @materialization-dependent-row-width
reason.materialization-dependent-row-width = rule: the case asserts a row-width rejection that only occurs \
    when the delimiter is a comma and the brackets are written unquoted, which is the default dialect; a \
    vector that varies the dialect makes the same row well-formed.

# elastic/elasticsearch#158262 ("Bound declared CSV/TSV rows by the file's header width") made the
# declared-schema path reject an over-wide row instead of silently misbinding it -- the fix for
# elastic/esql-planning#1842. The rejection is correct and the values now match: only the surviving row
# comes back. What does not match is the WARNING. The declared path words it "CSV row has [N] columns but
# the FILE'S HEADER defines [M] columns"; the inferred path words the same rejection "...but SCHEMA
# defines [M] columns". A csv-spec declares one warning text, and this case runs on both paths, so it
# cannot declare a text that satisfies both.
#
# Excluded only under declared_closed, which is the arm whose wording changed. The case keeps its
# coverage everywhere else, including the inferred path it was written for.
exclude.csv-vector.csv-multivalue.csvNoneOnMultiValueDataFailsColumnMismatch@schema_mode.declared_closed = rule: @declared-row-width-warning-wording
exclude.tsv-vector.csv-multivalue.csvNoneOnMultiValueDataFailsColumnMismatch@schema_mode.declared_closed = rule: @declared-row-width-warning-wording
reason.declared-row-width-warning-wording = rule: the declared-schema row-width rejection (#158262) warns \
    with different wording than the inferred path's, and a spec declares one warning text.

# A declared schema is built from the canonical header. A headerless source has no header to build one
# from -- its columns are synthesized col0..colN -- so every declared name is absent from the source and
# the reader says exactly that: "declared columns not found in the source: [avg_worked_seconds, ...]".
# The two are mutually exclusive by construction, and the error is the correct one to raise.
reason.declared-schema-has-no-headerless-source = rule: a declared schema names the canonical header's \
    columns, which a headerless source does not have -- its columns are synthesized col0..colN.
exclude.csv-vector.csv-headerless.headerRowFalse@schema_mode.declared_open = rule: @declared-schema-has-no-headerless-source
exclude.csv-vector.csv-headerless.headerRowFalseWithCustomPrefix@schema_mode.declared_open = rule: @declared-schema-has-no-headerless-source

# ndjson meets the same two declared-schema rules parquet does, on the same four cases. The entries are
# per-suite because each vector suite routes its own spec set, so a rule proven on one format still has
# to be stated for the next -- the alternative, inheriting exclusions across suites, is how a case ends
# up skipped in a suite nobody wrote the exclusion for.
exclude.ndjson-vector.external-multivalue.topSnippetsFunction@schema_mode.declared_open = rule: @declared-schema-changes-inferred-types
exclude.ndjson-vector.external-multivalue.scoreFunction@schema_mode.declared_open = rule: @declared-schema-changes-inferred-types
exclude.ndjson-vector.external-multivalue.externalRerankBooks@schema_mode.declared_open = rule: @declared-schema-changes-inferred-types
exclude.ndjson-vector.external-hive-partitioned-shadow.shadowedColumnSubstitutionAndWarning@schema_mode.declared_open = rule: @declared-schema-collides-with-partition-column

# esql-planning#1791 is FIXED (elastic/elasticsearch#157965): the zero-overlap file is scheduled again,
# and the shared spec's expected values -- including the 10 rows under `null` -- now match exactly. What
# it cannot match is the warning. Only NDJSON can reach this state: it omits absent fields entirely, so
# the __HIVE_DEFAULT_PARTITION__ file contains no `languages` key at all, while every CSV file names the
# column in its header and Parquet/ORC keep it in the schema. Reading that file therefore emits
# SkipWarnings.absentDeclaredColumnMessage on ndjson and on no other format, and a shared spec asserts
# warnings exhaustively -- declaring it here would red every other format that routes this spec.
# The fixed behaviour is NOT left untested: ndjson-sparse-columns.csv-spec pins it, warning included.
reason.shared-spec-cannot-carry-ndjson-only-warning = rule: only NDJSON can hold a file missing the \
    column entirely, so only NDJSON emits the absent-column warning, and a shared spec cannot declare a \
    warning the other formats never emit. Covered instead by ndjson-sparse-columns.csv-spec.
exclude.ndjson.external-hive-partitioned-shadow.noneStopsTheColumnSubstitution = rule: @shared-spec-cannot-carry-ndjson-only-warning
exclude.ndjson-compressed.external-hive-partitioned-shadow.noneStopsTheColumnSubstitution = rule: @shared-spec-cannot-carry-ndjson-only-warning

# esql-planning#1798 is FIXED (elastic/elasticsearch#157883) and inference now produces DATE_NANOS -- but
# only when a value actually needs it. The discriminator is value-based: a non-zero sub-millisecond
# component has no lossless `datetime` reading, so it forces nanos, and nothing else does. The fixture
# cannot trigger it: parquet_temporal_b.csv declares `ts:date_nanos` with the epoch-nanos values 9000000
# and 8000000, which are exactly 9ms and 8ms. Whole milliseconds. The column has never carried a value
# that distinguishes date_nanos from date, so the spec's DATE_NANOS expectation asks for a type the data
# does not justify, and the read correctly returns DATETIME.
# This is a CORPUS gap, not a product defect and not a permanent rule: give the fixture one sub-millisecond
# value and these cases become reachable. That change moves the expected extrema in every suite routing
# external-multifile-temporal.csv-spec, which is why it is its own piece of work rather than a one-liner.
reason.temporal-fixture-has-no-sub-millisecond-value = rule: the date_nanos fixture column holds only \
    whole-millisecond values (9000000, 8000000 epoch nanos), so value-based inference correctly yields \
    DATETIME and the spec's DATE_NANOS expectation is unreachable until the fixture gains sub-ms precision.
exclude.ndjson.external-multifile-temporal.temporalWidensToMinMax = rule: @temporal-fixture-has-no-sub-millisecond-value
exclude.ndjson.external-multifile-temporal.temporalWidensToFilteredMinMax = rule: @temporal-fixture-has-no-sub-millisecond-value
exclude.ndjson-compressed.external-multifile-temporal.temporalWidensToMinMax = rule: @temporal-fixture-has-no-sub-millisecond-value
exclude.ndjson-compressed.external-multifile-temporal.temporalWidensToFilteredMinMax = rule: @temporal-fixture-has-no-sub-millisecond-value

# STRICT resolution over hive-partitioned NDJSON. This replaces the old citation of esql-planning#1823,
# which is FIXED (elastic/elasticsearch#158110) and was a different defect: strict compared same-sized
# schemas by POSITION instead of by name. Name-based comparison landed, and these cases still fail --
# correctly -- because the size check precedes the by-name path and the sizes genuinely differ.
#
# The cause is NDJSON's own shape. It omits a key whose value is null rather than carrying an empty
# column, so the lang=__HIVE_DEFAULT_PARTITION__ file holds 19 columns where the lang=1 reference file
# holds 23. Measured, from the reader's own message: "expected 23 columns (from reference file [...]),
# but found 19". Strict resolution exists to reject exactly that, and the hint it emits points at
# union_by_name, which is the setting for this data. No other format can reach the state: a CSV header
# names every column even when every value is null.
#
# So this is a property of strict + sparse NDJSON, not a defect, and not specific to hive partitioning --
# the vector suite is simply the first thing to cross strict with a corpus whose files differ in width.
reason.strict-rejects-sparse-ndjson-partitions = rule: NDJSON omits null-valued keys, so a partition \
    file carries fewer columns than the reference file and strict resolution correctly rejects the \
    mismatch; union_by_name is the setting for this data.
exclude.ndjson-vector.external-hive-partitioned.hivePartitionNotAndFilter@schema_resolution.strict = rule: @strict-rejects-sparse-ndjson-partitions
exclude.ndjson-vector.external-hive-partitioned.hivePartitionNotOrFilter@schema_resolution.strict = rule: @strict-rejects-sparse-ndjson-partitions
exclude.ndjson-vector.external-hive-partitioned.hivePartitionOrNonPartitionFilter@schema_resolution.strict = rule: @strict-rejects-sparse-ndjson-partitions
exclude.ndjson-vector.external-hive-partitioned.hivePartitionStatsByLang@schema_resolution.strict = rule: @strict-rejects-sparse-ndjson-partitions
exclude.ndjson-vector.external-hive-partitioned.hivePartitionStatsByLangAndGender@schema_resolution.strict = rule: @strict-rejects-sparse-ndjson-partitions
exclude.ndjson-vector.external-hive-partitioned.hivePartitionWhereEquals@schema_resolution.strict = rule: @strict-rejects-sparse-ndjson-partitions
exclude.ndjson-vector.external-hive-partitioned.hivePartitionWhereIsNotNull@schema_resolution.strict = rule: @strict-rejects-sparse-ndjson-partitions
exclude.ndjson-vector.external-hive-partitioned.hivePartitionWhereIsNull@schema_resolution.strict = rule: @strict-rejects-sparse-ndjson-partitions
exclude.ndjson-vector.external-hive-partitioned-shadow.shadowedColumnSubstitutionAndWarning@schema_resolution.strict = rule: @strict-rejects-sparse-ndjson-partitions
exclude.ndjson-vector.ndjson-sparse-columns.sparsePartitionFileIsReadAndWarnsForTheAbsentColumn@schema_resolution.strict = rule: @strict-rejects-sparse-ndjson-partitions

# csv-vector meets the partition-collision rule the other three vector suites already declare. It was
# missing only because csv had no vector pinning schema_mode against the hive_shadow layout until the
# delimiter dimension widened the crossing -- the rule was always true here, nothing asserted it.
exclude.csv-vector.external-hive-partitioned-shadow.shadowedColumnSubstitutionAndWarning@schema_mode.declared_open = rule: @declared-schema-collides-with-partition-column

# Collapsed from per-slot entries. The property is that the case asserts authored byte detail --
# trailing padding, or the difference between an absent field and an empty one -- which no
# re-rendered tree preserves. WHICH slot caused the re-render is irrelevant, and enumerating them
# meant every new byte-changing dimension silently needed another entry per case: adding delimiter
# produced 45 failures across exactly these cases, for a rule already declared against text_mode
# and mv_syntax. `rerendered` is derived by the suite from the fixture base it actually reads.
exclude.csv-vector.csv-only-declared-dialect.strictDeclaredSchemaDoesNotImplyTrimming@rerendered.true = rule: @rerender-drops-authored-byte-detail
exclude.csv-vector.csv-multivalue.csvScalarWithBracketsParsesSame@rerendered.true = rule: @rerender-drops-authored-byte-detail
exclude.csv-vector.csv-multivalue.mvExpandFromSplit@rerendered.true = rule: @rerender-drops-authored-byte-detail
exclude.csv-vector.csv-multivalue.csvNoneOnMultiValueDataFailsColumnMismatch@rerendered.true = rule: @rerender-drops-authored-byte-detail

#
# What we are NOT testing, and why.
#
# A spec case runs on every suite that loads its file. An entry here takes it away from one suite,
# and every entry says why. Before this file the same information lived in five separate Java sets
# -- ParquetFormatSpecIT, ParquetRsFormatSpecIT, OrcFormatSpecIT, NdJsonFormatSpecIT and
# NdJsonCompressedFormatSpecIT -- so nobody could answer "what are we not testing?" without reading
# all five, and it was easy to work in this area for a long time without knowing two of them existed.
#
# Each suite still enforces its own exclusions; it now reads them from here instead of holding its
# own list. Making membership itself declarative -- so a suite runs everything unless excluded,
# rather than only what it names -- is the remaining half, tracked separately.
#
# Valid suite tokens. An exclusion naming anything else is rejected at load: a typo silently creates
# a phantom suite whose entries never apply to any test, which looks exactly like a working exclusion.
suites = csv, tsv, csv-compressed, tsv-compressed, ndjson, ndjson-compressed, orc, parquet, \
  parquet-compressed, parquet-compressed-multifile, parquet-rs, iceberg, distributed

# Format:
#   exclude.<suite>.<caseName> = <kind>: <why>
#
# <suite> is the format token: parquet, parquet-rs, orc, ndjson, ndjson-compressed.
# <kind> is one of:
#   bug  -- a defect. The case is right and the reader is wrong. Deleting the entry is the fix's
#           verification. Name the symptom so nobody has to re-derive it.
#   rule -- the suite cannot express the case at all. Permanent; nothing to fix.
#
# NOT yet enforced: a key naming a case no spec declares still does nothing silently. Catching that
# needs the list of cases a suite actually loaded, which lives in the suites rather than here. Until
# it is wired, an entry whose case was renamed or fixed rots quietly -- which is exactly how six
# ndjson-compressed entries outlived by three months the defect they named.
#

# ----------------------------------------------------------------------------------------------
# Filtering a column that schema reconciliation widened to keyword pushes the comparison down
# and evaluates it against the file's PRE-widening type, so in the file where `code` is
# declared integer the pushdown holds a Number while the literal is a BytesRef and the cast
# fails with a 500 (ParquetPushedExpressions.evaluateComparison). Reading and aggregating the
# same widened column both work -- only the pushed filter fails -- and ORC passes this case
# against the same rows. Re-enable once a pushed comparison is evaluated against the
# reconciled column type rather than the per-file declared type.
# ----------------------------------------------------------------------------------------------
# ---------------------------------------------------------------------------------------------------
# SHARED REASONS. One defect usually disables several cases; repeating its paragraph per case meant N
# verbatim copies that drift the moment one of them is corrected. An entry whose reason is @name
# resolves to the declaration below, and an unknown @name fails at load.
# ---------------------------------------------------------------------------------------------------
reason.split-discovery-drops-whole-file = elastic/esql-planning#1791 -- split discovery drops a whole file whose \
  schema shares no column with the query's projection (FileSplitProvider, skipIfNoColumnOverlap), so the ten \
  default-partition rows are never read and form no null group: 90 of 100 rows are accounted for. The sibling case \
  passes because partition detection supplies the column from the path, so every file overlaps the projection.
reason.ndjson-inference-no-date-nanos = elastic/esql-planning#1798 -- NdJsonSchemaInferrer never infers DATE_NANOS, \
  so the mixed-temporal column resolves to DATETIME and the union-by-name widening under test cannot happen: \
  "Different column type for column [lo] (DATE_NANOS != DATETIME)". Deleting this takes more than the inferrer fix: \
  the fixture's date_nanos values are whole milliseconds and NdJsonFixtureGenerator.formatDateNanos trims trailing \
  zeros, so the generated strings carry no sub-millisecond digits for any precision-based inferrer to see -- see \
  the issue's fix sketch.
reason.list-leaf-reached-through = A LIST leaf reached through a STRUCT (e.g. answers.text where answers is \
  struct<text: list<...>>) is bound by its flattened logical name only by the Java parquet reader; parquet-rs does \
  not yet flatten struct schemas, so the leaf resolves to no column descriptor and reads as all-null (COUNT returns \
  0, values/min/max are null). Re-enable once parquet-rs binds list-under- struct leaves by their flattened name in \
  both the read and aggregate-statistics paths.
reason.mixed-temporal-pair-declares = The mixed-temporal pair declares one file `date` and the other `date_nanos`, \
  and ORC cannot round-trip the nanos half: OrcFormatReader maps TIMESTAMP and TIMESTAMP_INSTANT to DATETIME and \
  has no DATE_NANOS mapping. OrcFixtureGenerator therefore refuses the type rather than writing it as a string, and \
  the fixture matrix declares that cell absent -- so these cases have no data to read here. Reader work, not \
  fixture work; re-enable when ORC gains DATE_NANOS.
reason.nested-struct-subfield-projection = Nested STRUCT subfield projection (external-nested-struct.csv-spec) is \
  implemented by the Java parquet reader only; parquet-rs does not yet flatten struct schemas.
reason.parquet-binds-columns-across = parquet-rs binds columns across files by physical POSITION rather than by \
  name, so a glob whose files carry the same columns in different order reads the wrong column: the reversed file's \
  leading r:double is taken as the unified schema's leading p:integer and the query fails with "Expected [INT] but \
  was [DOUBLE]". The fixture gives its columns distinct types precisely so this cannot pass silently. The Java \
  Parquet, ORC, NDJSON, CSV and TSV readers all pass these cases. Re-enable once parquet-rs reconciles cross-file \
  column order by name.
reason.parquet-does-reconcile-schemas = parquet-rs does not reconcile schemas across a multi-file glob, in two ways \
  that share a cause. It resolves a projection against ONE file's schema, so a column present only in the other \
  file is rejected outright ("unknown parquet column [city] ... Known columns name, age, score") instead of \
  null-filling. And it does not apply the reconciliation cast, so a column the unified schema widened comes back as \
  its per-file type -- integer where long was expected, integer where keyword was expected -- surfacing as an \
  IntArrowBufBlock that cannot be cast to BytesRefBlock, and as a string comparison matching nothing. Not every \
  aggregate escapes: ubnUnionKeepsAllRows (COUNT) and ubnWidenedColumnAggregates (MIN/MAX) both pass, but \
  typeDriftExtremaAreLexicographic does not, because its extrema come back as the wrong block type. The Java \
  Parquet and ORC readers pass all of these, and NDJSON passes every one it runs. CSV runs its own twin specs \
  rather than these files, so it is not evidence either way for the typeDrift cases. Re-enable once parquet-rs \
  reconciles across files.
reason.strict-resolution-rejects-divergent = STRICT resolution rejects the divergent-schema fixture at resolution \
  time, so these cases cannot run against it -- the rejection is the correct behaviour, not a defect.
reason.todo-parquet-ordinalbytesrefblock-validity = TODO: parquet-rs OrdinalBytesRefBlock validity buffer is not \
  8-byte padded per the Arrow columnar spec; AbstractArrowBufBlock.areAllValuesNull reads it as a long and throws \
  IndexOutOfBoundsException. Both the multi-key PackedValuesBlockHash path and the single-key BytesRefBlockHash \
  path (line 77) call areAllValuesNull, so any STATS … BY <keyword> on a multi- file glob fails with "index: 0, \
  length: 8 (expected: range(0, N))". Single-file STATS BY tests pass only because the standalone parquet-rs output \
  happens to allocate a buffer ≥ 8 bytes. Re- enable once the parquet-rs reader pads validity buffers correctly.
reason.unknown-parquet-column-positions = unknown parquet column [job_positions] referenced in projection (reported \
  in the schema as "element")
reason.widening-date-date-nanos = Widening `date` to `date_nanos` does not RESCALE: the millis value 2 comes back \
  as 1970-01-01T00:00:00.000000002Z (2 nanoseconds) instead of ...00.002Z (2 milliseconds). The half of the pair \
  already declared date_nanos reads correctly, so it is the millis-to-nanos conversion that is missing, not the \
  type. Same reconciliation path as the cases above.

exclude.parquet.external-multifile-type-drift.typeDriftFilterIsStringComparison = bug: Filtering a column that schema reconciliation widened to keyword pushes the comparison down and \
  evaluates it against the file's PRE-widening type, so in the file where `code` is declared \
  integer the pushdown holds a Number while the literal is a BytesRef and the cast fails with a \
  500 (ParquetPushedExpressions.evaluateComparison). Reading and aggregating the same widened \
  column both work -- only the pushed filter fails -- and ORC passes this case against the same \
  rows. Re-enable once a pushed comparison is evaluated against the reconciled column type rather \
  than the per-file declared type.


#
# The fixture matrix: which datasets exist in which formats, declared once.
#
# Read at configuration time by every esql-datasource-*/qa/build.gradle to decide which
# generation tasks to register, and at run time by AbstractExternalSourceSpecTestCase to
# resolve a {{template}} to a path. One declaration, two consumers, so the set a module
# generates and the set the suites look for cannot drift apart.
#
# A dataset exists in every format unless something prevents it. "*" says exactly that,
# and it is the value you want: add a sixth format tomorrow and every "*" dataset is
# materialised in it without editing this file. Naming formats explicitly opts OUT, so a
# restriction has to be argued for -- every restricted entry carries a .reason, and the
# build fails if one is missing.
#
# A .reason is one of two kinds, and they are not the same thing:
#   rule -- the format cannot carry the data. Nothing to fix; this cell will never exist.
#   gap  -- nobody has propagated it yet. This IS work, and the reason says so.
#

#
# The format axis. Adding a format here is all it takes for every "*" dataset to be
# materialised in it -- that is the point of declaring datasets rather than formats.
#
# ---------------------------------------------------------------------------------------------------
# CODECS -- two axes, deliberately kept apart.
#
# A TEXT codec is a file EXTENSION: employees.csv.gz is a gzip-wrapped csv, and the reader picks the
# decompressor from the suffix. A PARQUET codec is INTERNAL block compression: the file is still
# employees.parquet and the codec is recorded in its footer. Fusing them into one list would put two
# different things on one axis -- the file's name versus the file's insides.
#
# bzip2 is outside the GA text-format codec surface (uncompressed/gzip/zstd) and is rejected on release
# builds, so bz2/bz carry snapshot_only and the suites drop them when Build.current().isSnapshot() is
# false. See elastic/esql-planning#938.
# ---------------------------------------------------------------------------------------------------
codec.text = gz, zst, zstd, bz2, bz
codec.text.snapshot_only = bz2, bz
codec.parquet = snappy, gzip, zstd, lz4raw

# The multifile parquet suite runs a subset: the layout it exercises is about cross-file reconciliation,
# not about codec coverage, so two codecs prove the glob reads mixed-codec files without paying for four.
codec.parquet.suite.parquet-compressed-multifile = gzip, zstd

# ---------------------------------------------------------------------------------------------------
# SPEC ROUTING -- which csv-spec files each suite loads, declared once and read by TWO consumers: the
# suite's ParametersFactory, and checkFixtureCoverage.
#
# One source is the point. While these lived as hand-written filename lists in the suites, the coverage
# gate had to approximate them by scanning directories, and a spec sitting in a scanned directory that
# no suite loaded still counted as a consumer. That is not hypothetical: promoting the hive_shadow spec
# made the csv column pass the gate while zero shadow cases ran on any CSV suite.
#
# Patterns are classpath globs, resolved by AbstractExternalSourceSpecTestCase.classpathResources.
# ---------------------------------------------------------------------------------------------------
# A suite HAS a format; it is not one. parquet-rs is a READER over parquet files, and the compressed
# suites are codec variants -- none of them are members of the format axis. The coverage gate routes specs
# by suite token and resolves per-format layout overrides by this format, which are different questions
# that were briefly conflated: keying a source override on 'parquet-rs' was correctly rejected as naming
# a format that does not exist.
suite.csv.format = csv
suite.tsv.format = tsv
suite.ndjson.format = ndjson
suite.ndjson-compressed.format = ndjson
suite.orc.format = orc
suite.parquet.format = parquet
suite.parquet-rs.format = parquet
suite.iceberg.format = parquet

suite.csv.specs = /csv-*.csv-spec, /external-declared-schema.csv-spec, /external-heavy-aggregates.csv-spec, \
  /external-hive-partitioned-shadow.csv-spec, \
  /external-multifile-perm.csv-spec, /external-multifile-resolution.csv-spec, \
  /external-multifile-temporal.csv-spec
suite.tsv.specs = /csv-basic.csv-spec, /csv-declared-schema.csv-spec, /csv-declared-schema-multifile.csv-spec, \
  /tsv-multivalue.csv-spec, /external-declared-schema.csv-spec, /external-heavy-aggregates.csv-spec, \
  /external-multifile.csv-spec, /external-multifile-resolution.csv-spec, /external-hive-partitioned.csv-spec, \
  /external-hive-partitioned-payload.csv-spec, /external-hive-partitioned-shadow.csv-spec, \
  /external-multifile-perm.csv-spec, /external-multifile-ubn.csv-spec, /external-multifile-ubn-widening.csv-spec, \
  /external-multifile-type-drift.csv-spec, /external-multifile-temporal.csv-spec
suite.ndjson.specs = /external-basic.csv-spec, /ndjson-declared-schema.csv-spec, /external-declared-schema.csv-spec, \
  /external-heavy-aggregates.csv-spec, /external-multifile.csv-spec, /external-multifile-resolution.csv-spec, \
  /external-hive-partitioned.csv-spec, /external-hive-partitioned-shadow.csv-spec, /external-multifile-perm.csv-spec, \
  /external-multifile-ubn.csv-spec, /external-multifile-type-drift.csv-spec, /external-multivalue.csv-spec, \
  /external-multifile-temporal.csv-spec
suite.orc.specs = /external-*.csv-spec
# A glob is the right default, but it cannot know that one spec belongs to a different suite. Declared
# here rather than assumed away at run time: the shared suites used to register all 43 ClickBench cases and
# then assumeFalse every one of them, which is a skip no gate can see and no reader can count. Whole-file
# exclusions are meant to be rare and this is the only one -- a spec whose fixtures a different suite owns.
suite.orc.specs.exclude = external-clickbench
suite.orc.specs.exclude.reason = rule: ClickBench fixtures are built and resolved by ClickBenchParquetSpecIT, \
  which owns the dataset download; the shared suites cannot resolve the {{clickbench}} template at all.
suite.parquet.specs.exclude = external-clickbench
suite.parquet.specs.exclude.reason = rule: same as orc -- owned by ClickBenchParquetSpecIT.
suite.parquet-rs.specs.exclude = external-clickbench
suite.parquet-rs.specs.exclude.reason = rule: same as orc -- owned by ClickBenchParquetSpecIT.
suite.parquet.specs = /external-*.csv-spec, /parquet-*.csv-spec
suite.parquet-rs.specs = /external-*.csv-spec
suite.ndjson-compressed.specs = /external-basic.csv-spec, /external-declared-schema.csv-spec, \
  /external-multifile.csv-spec, /external-multifile-resolution.csv-spec, /external-multivalue.csv-spec, \
  /ndjson-declared-schema.csv-spec, \
  /external-hive-partitioned.csv-spec, /external-hive-partitioned-shadow.csv-spec, \
  /external-multifile-perm.csv-spec, /external-multifile-ubn.csv-spec, \
  /external-multifile-type-drift.csv-spec, /external-multifile-temporal.csv-spec
# Iceberg reaches its table through EXTERNAL ... WITH format iceberg rather than FROM <dataset>, so it is
# outside the shared-spec regime by construction. Its routing is declared anyway: an undeclared suite is
# indistinguishable from one nobody got round to.
suite.iceberg.specs = /iceberg-basic.csv-spec
suite.iceberg.outside_shared_specs = rule: Iceberg reaches its table through EXTERNAL ... WITH format \
  iceberg rather than FROM <dataset>, so the shared specs cannot address it. Note IcebergSpecIT is also \
  disabled wholesale by a class-level @AwaitsFix, which is an exclusion carrying no product bug -- tracked \
  separately, not by this declaration.
# Flight is a gRPC TRANSPORT, not a file format, so it is not a member of the format axis and the shared
# specs -- which are about how bytes on disk are read -- do not apply. Declared so the registry is complete
# and its absence is a statement rather than an oversight.
suite.flight.specs = /external-grpc.csv-spec
suite.flight.outside_shared_specs = rule: gRPC is a transport; the shared specs exercise on-disk formats.

# The compressed suites. Each is a suite in its own right, not a variant of the format it decodes: it
# carries a codec, routes its own spec set, and therefore needs its own exclusion token. Inheriting the
# base format's token instead -- which is what these did -- resolves an exclusion lookup to ANOTHER
# suite's set, so an `exclude.parquet.*` entry would silently also disable the case under
# parquet-compressed with nothing reporting it. ndjson-compressed already worked this way; these now
# match it rather than being the exception nobody noticed.
suite.csv-compressed.format = csv
suite.csv-compressed.specs = /csv-basic.csv-spec, /csv-declared-schema.csv-spec, \
  /external-declared-schema.csv-spec, /csv-declared-schema-multifile.csv-spec, \
  /csv-headerless.csv-spec, /csv-multifile.csv-spec, /csv-multifile-resolution.csv-spec, \
  /csv-multivalue.csv-spec, /csv-only-declared-dialect.csv-spec
suite.tsv-compressed.format = tsv
suite.tsv-compressed.specs = /csv-basic.csv-spec, /csv-declared-schema.csv-spec, \
  /external-declared-schema.csv-spec, /csv-declared-schema-multifile.csv-spec, \
  /external-multifile.csv-spec, /external-multifile-resolution.csv-spec, /tsv-multivalue.csv-spec
suite.parquet-compressed.format = parquet
suite.parquet-compressed.specs = /external-basic.csv-spec, /external-multivalue.csv-spec
suite.parquet-compressed-multifile.format = parquet
suite.parquet-compressed-multifile.specs = /external-multifile.csv-spec, /external-multifile-resolution.csv-spec

# The multi-node suite reads Parquet fixtures over a distributed cluster: same specs, different topology.
# Its routing is declared here for the same reason as everything else -- a spec list living in the suite
# is a list no gate and no report can see.
suite.distributed.format = parquet
suite.distributed.specs = /external-basic.csv-spec, /external-multivalue.csv-spec

formats = csv, tsv, ndjson, orc, parquet


# ---------------------------------------------------------------------------------------------------
# WRITE DIALECT -- how a dataset's canonical CSV encodes multi-values, and therefore how a text reader
# must be configured to read the fixtures generated from it.
#
# This is a property of the AUTHORED DATA, not a preference: employees.csv carries bracket multi-values
# on every one of its 100 rows, so an RFC-4180 reader splitting on commas misaligns every column. It is
# declared here rather than injected globally because `none` is the default real users get -- switching
# every read to `brackets` to make specs pass would silently retire the default's coverage.
#
# Linted against the data by checkFixtureDialect: a declaration that disagrees with the file fails.
# ---------------------------------------------------------------------------------------------------
dataset.employees.write_dialect = brackets
dataset.books.write_dialect = brackets
dataset.nested_events.write_dialect = brackets
dataset.mv_sample.write_dialect = brackets
dataset.web_logs.write_dialect = none
dataset.employees_no_mv.write_dialect = none
dataset.uint32_pushdown.write_dialect = none
dataset.uint64_pushdown.write_dialect = none
dataset.null_batch_keyword.write_dialect = none
dataset.apps.write_dialect = none

dataset.employees = *
dataset.web_logs = *
dataset.books = *
dataset.employees_no_mv = *

dataset.nested_events = orc, parquet
dataset.nested_events.reason = rule: dotted columns (event.action, event.outcome) are nested \
  groups. CSV, TSV and NDJSON have no nested representation -- a dotted header there is just \
  a flat column name, which tests something else entirely.

dataset.uint32_pushdown = parquet
dataset.uint32_pushdown.reason = rule: uint32/uint16 are Parquet logical types with no text \
  form, so the columns cannot round-trip through a text format.

dataset.uint64_pushdown = parquet
dataset.uint64_pushdown.reason = rule: uint64 has no text form, same as uint32_pushdown.


# Added by main's Parquet late-materialization filter fix (#157587). The data itself -- long plus two
# keyword columns with nulls -- is representable in every format; the restriction is about CONSUMERS,
# not capability. Its only reader is parquet-null-batch-keyword.csv-spec, a Parquet-local regression
# spec for an all-null predicate batch in the late-materialization filter, a code path no other reader
# has. Declaring it `*` would generate four fixtures nothing reads.
dataset.null_batch_keyword = parquet
dataset.null_batch_keyword.reason = gap: the data is format-agnostic, but the only consumer is the \
  Parquet-local late-materialization regression spec; no other format has a reader for it yet.
dataset.apps = csv, tsv
dataset.apps.reason = rule: the version column is the point of this dataset, and only a format \
  that names the declared type can carry it. CSV and TSV both write a typed header the reader maps to \
  VERSION. Parquet, ORC and NDJSON have no version type, so the column would be written as text and \
  infer back as keyword -- the same values with the wrong comparison semantics. Those three generators \
  refuse it rather than write that silently.
#
# The TSV cell is generated but nothing reads it yet: {{apps}} is named only by
# csv-nullability.csv-spec, which the TSV suite does not load. Recorded so the cell is not mistaken
# for coverage -- a TSV twin of that spec, or listing it, is what would make it real.

dataset.mv_sample = csv, tsv
dataset.mv_sample.reason = gap: multi-value tags have a native representation in every \
  target format (NDJSON arrays, Parquet and ORC LIST), so this belongs everywhere. It was \
  written with the bracket syntax the text generators share and never propagated.

#
# Layouts: which directory a fixture layout lives in.
#
# A {{template}} ending in _<layout> resolves to that layout's directory; one with no layout
# suffix is a standalone single file named after the dataset. The longest suffix wins, so
# _multifile_split is not read as _multifile.
#
# Generators write into these directories and the suites glob them. That is the entire
# negotiation between the two sides, and it used to be spelled out separately in each --
# which is how 'hive' ended up as the one layout whose directory name differs from its
# suffix, visible here as data instead of as a special case in the resolver.
#
# glob defaults to "*"; standalone is the reserved name meaning "the file is <dataset>.<format>".
#
layout.standalone.dir = standalone
layout.multifile.dir = multifile
layout.multifile_split.dir = multifile_split
layout.multifile_ubn.dir = multifile_ubn
layout.multifile_perm.dir = multifile_perm
layout.multifile_temporal.dir = multifile_temporal
layout.multifile_type_drift.dir = multifile_type_drift
layout.hive.dir = hive-partitioned
layout.hive.glob = **/*
# A hive tree whose partition key deliberately COLLIDES with a same-named payload column, so the
# reader has to decide which wins. Its directory is a sibling of the ordinary hive tree, and its
# suffix is longer, which is why longest-suffix-first matters: employees_hive_shadow must not be
# read as the plain hive layout.
layout.hive_shadow.dir = hive-partitioned-shadow
layout.hive_shadow.glob = **/*

#
# What each layout is built FROM.
#
# The authored layouts are file PAIRS that deliberately disagree with each other -- that
# disagreement is the whole point of the layout, so its meaning lives in its sources rather
# than in any dataset name. (A glob layout ignores the dataset half of a template: a spec says
# {{employees_multifile_ubn}} and gets multifile_ubn/*.<format>, whatever the files are called.)
#
# Two source sets exist for the union-by-name and type-drift layouts, for different reasons.
#
# For type-drift the multifile_* pair carries an UNTYPED header, so a reader's sampler has to
# infer the drift rather than being told about it; the parquet_* pair declares the two types
# outright. Only CSV still reads the untyped pair -- TSV stamps a type on every column it writes
# and NDJSON quotes every value of an untyped column, so neither could exhibit inferred drift.
#
# For union-by-name both pairs are fully typed and their second files are byte-identical; the
# parquet_* first file simply carries one extra column (score:double). Formats read whichever
# pair their existing cases were written against.
#
# Where only one set exists, every format uses it.
#
layout.multifile.sources = multifile_a_anchor, multifile_b_other
layout.multifile.sources.tsv =
layout.multifile.sources.tsv.reason = rule: the pair is HEADERLESS -- its first line is data, and the \
  layout exists to prove the anchor file's inferred schema wins when no header names the columns. \
  TsvFixtureGenerator always writes a typed header, so a TSV copy cannot be headerless and the \
  property is unrepresentable.
layout.multifile.sources.ndjson =
layout.multifile.sources.ndjson.reason = rule: the pair is headerless, and NDJSON names every field in \
  every record. Converting it promotes the first data row to field names, which is not the fixture.
layout.multifile.sources.orc =
layout.multifile.sources.orc.reason = rule: the pair is headerless; ORC carries a schema with column \
  names, so a headerless layout has no meaning in it.
layout.multifile.sources.parquet =
layout.multifile.sources.parquet.reason = rule: the pair is headerless; Parquet carries a schema with \
  column names, so a headerless layout has no meaning in it.
layout.multifile_ubn.sources = multifile_ubn_a, multifile_ubn_b
layout.multifile_ubn.sources.orc = parquet_ubn_a, parquet_ubn_b
layout.multifile_ubn.sources.parquet = parquet_ubn_a, parquet_ubn_b
layout.multifile_type_drift.sources = multifile_type_drift_a, multifile_type_drift_b
layout.multifile_type_drift.sources.orc = parquet_type_drift_a, parquet_type_drift_b
layout.multifile_type_drift.sources.tsv = parquet_type_drift_a, parquet_type_drift_b
layout.multifile_type_drift.sources.ndjson = parquet_type_drift_a, parquet_type_drift_b
layout.multifile_type_drift.sources.parquet = parquet_type_drift_a, parquet_type_drift_b
layout.multifile_temporal.sources = parquet_temporal_a, parquet_temporal_b
layout.multifile_temporal.sources.orc =
layout.multifile_temporal.sources.orc.reason = gap: OrcFormatReader maps TIMESTAMP and \
  TIMESTAMP_INSTANT to DATETIME and has no DATE_NANOS mapping at all, so ORC cannot round-trip the \
  date_nanos half of this deliberately mixed-temporal pair. The generator now refuses the type \
  outright rather than writing it as a string. This is reader work, not generator work.
layout.multifile_perm.sources = parquet_perm_a, parquet_perm_b

#
# The derived layouts are built by re-laying-out one dataset rather than by authoring files.
#
# Hive buckets on `languages` but names the partition directory `lang`: the payload column
# stays in the file and the partition column is path-derived and injected by the reader, so
# sharing a name would collide.
#
layout.multifile_split.derived_from = employees
layout.hive.derived_from = employees
layout.hive.bucket_by = languages
layout.hive.partition_column = lang

# The shadow tree buckets by the same column it names the partition after, so the partition key and a
# real payload column collide and the reader has to decide which wins. Declaring bucket_by and
# partition_column here is what puts it in the partitioned-layout set; before this it was generated by
# a hand-written task in the Parquet build, which is why it was the one layout the declaration did not
# own -- the same shape as the defect this PR opens with.
layout.hive_shadow.derived_from = employees
layout.hive_shadow.bucket_by = languages
layout.hive_shadow.partition_column = languages

#
# How many files a split layout produces. Seven call sites pass this number today, one of
# them as a bare integer and one buried behind a codec argument, which is exactly why it
# belongs here rather than in each of them.
#
layout.split.parts = 3

#
# The fixture matrix: which datasets exist in which formats, declared once.
#
# Read at configuration time by every esql-datasource-*/qa/build.gradle to decide which
# generation tasks to register, and at run time by AbstractExternalSourceSpecTestCase to
# resolve a {{template}} to a path. One declaration, two consumers, so the set a module
# generates and the set the suites look for cannot drift apart.
#
# A dataset exists in every format unless something prevents it. "*" says exactly that,
# and it is the value you want: add a sixth format tomorrow and every "*" dataset is
# materialised in it without editing this file. Naming formats explicitly opts OUT, so a
# restriction has to be argued for -- every restricted entry carries a .reason, and the
# build fails if one is missing.
#
# A .reason is one of two kinds, and they are not the same thing:
#   rule -- the format cannot carry the data. Nothing to fix; this cell will never exist.
#   gap  -- nobody has propagated it yet. This IS work, and the reason says so.
#

#
# The format axis. Adding a format here is all it takes for every "*" dataset to be
# materialised in it -- that is the point of declaring datasets rather than formats.
#
formats = csv, tsv, ndjson, orc, parquet

dataset.employees = *
dataset.web_logs = *
dataset.books = *
dataset.employees_no_mv = *

dataset.nested_events = orc, parquet
dataset.nested_events.reason = rule: dotted columns (event.action, event.outcome) are nested \
  groups. CSV, TSV and NDJSON have no nested representation -- a dotted header there is just \
  a flat column name, which tests something else entirely.

dataset.uint32_pushdown = parquet
dataset.uint32_pushdown.reason = rule: uint32/uint16 are Parquet logical types with no text \
  form, so the columns cannot round-trip through a text format.

dataset.uint64_pushdown = parquet
dataset.uint64_pushdown.reason = rule: uint64 has no text form, same as uint32_pushdown.

dataset.apps = csv
dataset.apps.reason = gap: nothing about the version type stops the other formats carrying \
  it; it was materialised for CSV and never propagated.

dataset.mv_sample = csv, tsv
dataset.mv_sample.reason = gap: multi-value tags have a native representation in every \
  target format (NDJSON arrays, Parquet and ORC LIST), so this belongs everywhere. It was \
  written with the bracket syntax the text generators share and never propagated.

#
# Layouts: which directory a fixture layout lives in.
#
# A {{template}} ending in _<layout> resolves to that layout's directory; one with no layout
# suffix is a standalone single file named after the dataset. The longest suffix wins, so
# _multifile_split is not read as _multifile.
#
# Generators write into these directories and the suites glob them. That is the entire
# negotiation between the two sides, and it used to be spelled out separately in each --
# which is how 'hive' ended up as the one layout whose directory name differs from its
# suffix, visible here as data instead of as a special case in the resolver.
#
# glob defaults to "*"; standalone is the reserved name meaning "the file is <dataset>.<format>".
#
layout.standalone.dir = standalone
layout.multifile.dir = multifile
layout.multifile_split.dir = multifile_split
layout.multifile_ubn.dir = multifile_ubn
layout.multifile_perm.dir = multifile_perm
layout.multifile_temporal.dir = multifile_temporal
layout.multifile_type_drift.dir = multifile_type_drift
layout.hive.dir = hive-partitioned
layout.hive.glob = **/*

#
# What each layout is built FROM.
#
# The authored layouts are file PAIRS that deliberately disagree with each other -- that
# disagreement is the whole point of the layout, so its meaning lives in its sources rather
# than in any dataset name. (A glob layout ignores the dataset half of a template: a spec says
# {{employees_multifile_ubn}} and gets multifile_ubn/*.<format>, whatever the files are called.)
#
# Two source sets exist for the union-by-name and type-drift layouts because they test
# different things: the multifile_* pair carries an untyped header, so a text format's sampler
# has to infer and the test exercises that inference, while the parquet_* pair carries declared
# types. Formats that read a schema use the latter. Where only one set exists, every format
# uses it.
#
layout.multifile.sources = multifile_a_anchor, multifile_b_other
layout.multifile.sources.tsv =
layout.multifile.sources.tsv.reason = rule: the pair is HEADERLESS -- its first line is data, and the \
  layout exists to prove the anchor file's inferred schema wins when no header names the columns. \
  TsvFixtureGenerator always writes a typed header, so a TSV copy cannot be headerless and the \
  property is unrepresentable.
layout.multifile.sources.ndjson =
layout.multifile.sources.ndjson.reason = rule: the pair is headerless, and NDJSON names every field in \
  every record. Converting it promotes the first data row to field names, which is not the fixture.
layout.multifile.sources.orc =
layout.multifile.sources.orc.reason = rule: the pair is headerless; ORC carries a schema with column \
  names, so a headerless layout has no meaning in it.
layout.multifile.sources.parquet =
layout.multifile.sources.parquet.reason = rule: the pair is headerless; Parquet carries a schema with \
  column names, so a headerless layout has no meaning in it.
layout.multifile_ubn.sources = multifile_ubn_a, multifile_ubn_b
layout.multifile_ubn.sources.orc = parquet_ubn_a, parquet_ubn_b
layout.multifile_ubn.sources.parquet = parquet_ubn_a, parquet_ubn_b
layout.multifile_type_drift.sources = multifile_type_drift_a, multifile_type_drift_b
layout.multifile_type_drift.sources.orc = parquet_type_drift_a, parquet_type_drift_b
layout.multifile_type_drift.sources.tsv = parquet_type_drift_a, parquet_type_drift_b
layout.multifile_type_drift.sources.ndjson = parquet_type_drift_a, parquet_type_drift_b
layout.multifile_type_drift.sources.parquet = parquet_type_drift_a, parquet_type_drift_b
layout.multifile_temporal.sources = parquet_temporal_a, parquet_temporal_b
layout.multifile_temporal.sources.orc =
layout.multifile_temporal.sources.orc.reason = gap: the pair is deliberately mixed-temporal, and \
  OrcFixtureGenerator has no date_nanos case -- it falls through to varchar, so the column is \
  written as a string. The ORC reader has no DATE_NANOS mapping either (TIMESTAMP maps to \
  DATETIME), so the fixture would be wrong on both sides. Blocked on the same generator type \
  divergence as the ndjson cell below.
layout.multifile_temporal.sources.ndjson =
layout.multifile_temporal.sources.ndjson.reason = gap: the pair is deliberately mixed-temporal -- \
  one file declares ts:date, the other ts:date_nanos -- and NdJsonFixtureGenerator has no date_nanos \
  case, so it falls through to the string writer and throws. Generating only the date half would be \
  worse than generating neither, since a glob over one file is not the mixed-temporal test. Blocked \
  on making the generators agree on the declared type set.
layout.multifile_perm.sources = parquet_perm_a, parquet_perm_b

#
# The derived layouts are built by re-laying-out one dataset rather than by authoring files.
#
# Hive buckets on `languages` but names the partition directory `lang`: the payload column
# stays in the file and the partition column is path-derived and injected by the reader, so
# sharing a name would collide.
#
layout.multifile_split.derived_from = employees
layout.hive.derived_from = employees
layout.hive.bucket_by = languages
layout.hive.partition_column = lang

#
# How many files a split layout produces. Seven call sites pass this number today, one of
# them as a bare integer and one buried behind a codec argument, which is exactly why it
# belongs here rather than in each of them.
#
layout.split.parts = 3

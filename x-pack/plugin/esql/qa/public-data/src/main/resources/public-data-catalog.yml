gaps:
  - id: https-provider-backup-only
    reason: >
      No HTTPS in the active runs by decision; every HTTPS variant (ClickBench mirror, NYC TLC,
      GH Archive) is an inert backup entry. The HTTP datasource read path keeps its coverage in
      the existing per-dimension ITs.
    cells: [provider=https]
  - id: gcs-azure-providers-unsupported
    reason: >
      The esql-datasource-gcs/-azure plugins and feature flags exist, but the type gcs/azure
      data-source definitions are not usable yet (product decision). Modelled in the catalog so
      activation is a catalog edit; GH Archive (GCS) and Overture (Azure) are the intended first
      corpora when support lands.
    cells: [provider=gcs, provider=azure]
  - id: layouts-pending-phases-1-3
    reason: >
      Every layout except WIDE_SINGLE_ROW_GROUP is covered as of Phase 3 (SKEWED_SHARDS via the
      BTC era skew). The intended widerg carrier was Common Crawl's columnar index, but that
      bucket denies ALL anonymous S3 access (403 on GET/HEAD/LIST; HTTPS-CDN-only - catalogued as
      a backup entry), and no other anonymously-readable public corpus with few-huge-row-groups
      Parquet has been identified (Overture parts carry 256 row groups each).
    cells: [layout=wide_single_row_group]
  - id: mixed-schema-glob-union-assertion
    reason: >
      The real mixed-schema glob (all 10 CSE processed CSVs: 80-col LF files unioned with the
      84-col CRLF file) does NOT fail - observed live, ES|QL unions by name and discloses
      per-column widening in warnings, which is the "coherent union" arm of the acceptable
      behaviours and rules out an expect_failure case. Freezing the union's expected tables
      (nulls for the 4 extra columns across 8 files, widened types) needs its own workload and
      an oracle mirror of union-by-name semantics: deferred to Phase 2, tracked here so the cell
      is not silently unasserted.
    cells: []
  - id: ghcnd-by-year-exact-tables-impossible
    reason: >
      The GHCN-D by_year trees (csv, csv.gz AND parquet alike) are rebuilt nightly: NOAA's own
      readme-by_year.txt says "updated daily for the entire period of record", 1763/1800/1850/1950/
      2024/2025 all carry the previous night's Last-Modified, and 2024.csv was observed moving from
      1336374349 to 1336374356 bytes a day apart. Exact frozen expected tables over this tree are
      therefore impossible, and no re-proposal should assume otherwise. What IS covered: 1750.csv
      is the tree's one frozen object (skipped by the rebuild because its dates predate GHCN-D) and
      carries exact tables as ghcnd-by-year-1750; 2024.csv carries the large-uncompressed-text
      shape as ghcnd-by-year-2024 under assertion_mode invariant with volatile pins. What remains
      uncovered: exact row-level assertions at by_year scale, and the parquet/by_year tree
      (same volatility, and parquet x nested_hive is already covered by ghcnd-parquet-8st).
    cells: []
  - id: vpc-flow-logs-real-data
    reason: >
      No anonymously readable public bucket of genuine AWS VPC flow logs exists (verified via web
      search and direct probes). CSE-CIC-IDS2018 stands in as the real dirty-security-logs corpus
      in Phase 1; VPC flow-log format/layout coverage stays synthetic in
      ExternalCsvHivePartitionedIT.
    cells: []

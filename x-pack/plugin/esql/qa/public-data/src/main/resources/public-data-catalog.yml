# The public-data catalog: the single machine-readable description of what the suite covers.
# Every entry points at REAL, publicly-published objects on REAL object stores, pinned by
# HEAD/LIST metadata only. Adding a corpus = one entry here + one public-<corpus>.csv-spec.
# Structure is validated offline by CatalogValidator (unit tests + validatePublicDataCatalog).
version: 1
corpora:
  - id: clickbench
    title: ClickBench web analytics hits (full public corpus)
    registry_url: https://github.com/ClickHouse/ClickBench
    license: CC BY-NC-SA 4.0 (Yandex.Metrica sample dataset terms)
    description: >
      The 99,997,497-row ClickBench corpus in the public clickhouse-public-datasets bucket,
      immutable since 2022-06-25. One logical corpus in multiple formats and layouts: the
      format x codec x layout cross the matrix needs, at full scale, over real S3 latency.
    kind: workload
    scale: huge
    quality: clean
    workload: public-clickbench.csv-spec
    variants:
      # The reference variant: the exact bytes the oracle read at authoring time.
      - provider: s3
        format: parquet
        codec: snappy
        layout: single_file
        partitioning: none
        region: eu-central-1
        resource: "s3://clickhouse-public-datasets/hits_compatible/hits.parquet"
        data_source_settings:
          auth: anonymous
          region: eu-central-1
        tags: [reference]
        notes: 13.76 GiB single Parquet object, SNAPPY column chunks, 105 columns.
        pin:
          method: HEAD
          verified_at: 2026-08-14T16:21:54Z
          object_count: 1
          total_bytes: 14779976446
          samples:
            - key: "hits_compatible/hits.parquet"
              etag: "6b028bb94eecf0ff4e6cde62a0f8fa48-829"
              size: 14779976446
      # Same rows sharded into 100 Parquet objects: S3 listing makes UNIFORM_SHARDS a real
      # layout for this corpus (glob + ListObjectsV2), not a blocked cell.
      - provider: s3
        format: parquet
        codec: snappy
        layout: uniform_shards
        partitioning: none
        region: eu-central-1
        resource: "s3://clickhouse-public-datasets/hits_compatible/athena_partitioned/hits_*.parquet"
        data_source_settings:
          auth: anonymous
          region: eu-central-1
        notes: 100 shards, 33-363 MB each, 13.73 GiB total; identical logical rows to the reference.
        pin:
          method: LIST
          verified_at: 2026-08-14T16:21:54Z
          object_count: 100
          total_bytes: 14737666736
          samples:
            - key: "hits_compatible/athena_partitioned/hits_0.parquet"
              etag: "843c108848a3929260d44588b39ec1b6-6"
              size: 122446530
            - key: "hits_compatible/athena_partitioned/hits_99.parquet"
              etag: "589519c50a3277092c1ed2df16b17d30-9"
              size: 160289383
      # The large-compressed-text case elastic/esql-planning#1650 calls out: 15.5 GiB gzip CSV,
      # non-seekable, headerless, re-read in full by every query. Load-bearing but trimmed: the
      # query_subset still covers all four read shapes without re-transferring 43 x 15.5 GiB.
      # EventTime/EventDate hold formatted date strings in this export (unlike the Parquet
      # epoch numbers), so the subset avoids them and the declared schema types them keyword.
      - provider: s3
        format: csv
        codec: gzip
        layout: single_file
        partitioning: none
        region: eu-central-1
        resource: "s3://clickhouse-public-datasets/hits_compatible/hits.csv.gz"
        data_source_settings:
          auth: anonymous
          region: eu-central-1
        dataset_settings:
          header_row: false
        query_subset: [q01_countHits, q02_countAdvEngineIdNonzero, q13_statsSearchPhraseCount, q20_filterUserid, q26_sortSearchPhraseAsc, q44_limitUseridNeedle]
        notes: >
          Headerless CSV export of the same rows. With header_row false the reader synthesizes
          col0..col104 names and declared columns bind BY NAME, so every declared column carries
          a path rename onto its positional colN (without paths, all declared columns read null
          and warn 'not present in some source files').

            count=4617295; distinct(id)=6920; count(element=PRCP)=2187477; count(element=TMIN)=865465;
            count(element=TMAX)=840783; count(element=SNOW)=488570; count(element=SNWD)=172230;
            avg(TMAX)/10=17.43; avg(PRCP)/10=2.0; top-station=USC00245685(2130); year=1900 -- reproduced

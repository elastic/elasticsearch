          9.8KB-176KB (~18x, reflecting organic early-network growth) -- a meaningfully different shape from
          this catalog's other multi-file variants (clickbench_parquet_shards' 5 *equal*-size shards;
          ghcn_1900_parquet_hive's ~38 near-uniform shards). Every aggregate was computed by DuckDB reading

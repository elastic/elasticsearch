          cross-validated. Pinned by content_signature, not ETag: HEAD on the representative shard shows
          Last-Modified 2026-02-18 -- recent, despite 2009's data being logically immutable -- indicating
          AWS's own export pipeline periodically rewrites historical partitions wholesale (the same
          instability class as ghcn_d, just on a much longer cycle); the etag/size_bytes below are only the
          as-observed values at capture time, logged (not asserted) by PinValidator for this strategy.
        pin:

      - id: ghcn_tmax_1900_1902_hive
        spec: "/specs/ghcn-tmax-single-level-hive.csv-spec"
        format: PARQUET
        codec: SNAPPY
        provider: S3
        region: "us-east-1"
        resource: "s3://noaa-ghcn-pds/parquet/by_year/YEAR=1900/ELEMENT=TMAX/*.snappy.parquet,s3://noaa-ghcn-pds/parquet/by_year/YEAR=1901/ELEMENT=TMAX/*.snappy.parquet,s3://noaa-ghcn-pds/parquet/by_year/YEAR=1902/ELEMENT=TMAX/*.snappy.parquet"
        pin_check_uri: "s3://noaa-ghcn-pds/parquet/by_year/YEAR=1900/ELEMENT=TMAX/3cf0bb866a3a4815ab42e12119943b64_0.snappy.parquet"
        settings:
          hive_partitioning: true
        partition_layout: HIVE_PARTITIONED

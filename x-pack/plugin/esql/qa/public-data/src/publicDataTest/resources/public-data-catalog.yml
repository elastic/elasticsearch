# The catalog for the public-data ES|QL suite (elastic/esql-planning#1650). Every `resource` below is an
# already-public object the upstream publisher exposes today, over plain HTTPS or (anonymous) S3 -- never a
# transcoded, mirrored, or re-uploaded copy. See PublicDataCatalog/SourceVariant/PinInfo for the full field
# semantics and PublicDataCatalogValidator for the offline rules this file must satisfy.
#
# Onboarding the remaining public-data sources is tracked separately (elastic/esql-planning#1650,
# "onboard-sources").
sources:
  - id: clickbench
    display_name: "ClickBench hits"
    homepage: "https://github.com/ClickHouse/ClickBench"
    license: "Apache-2.0 (benchmark suite); source data documented at https://clickhouse.com/docs/getting-started/example-datasets/metrica"
    query_provenance: >-
      Adapted from ClickBench's own 43-query SQL suite (https://github.com/ClickHouse/ClickBench/blob/main/clickhouse/queries.sql),
      translated to ES|QL. This is a distinct query set from the reduced-corpus
      x-pack/plugin/esql/qa/testFixtures/src/main/resources/external-clickbench.csv-spec fixture, which
      already exercises a different subset of the same SQL suite against a local, checked-in fixture.
    variants:
      - id: clickbench_parquet_single
        spec: "/specs/clickbench-parquet-single.csv-spec"
        format: PARQUET
        codec: SNAPPY
        provider: HTTPS
        resource: "https://datasets.clickhouse.com/hits_compatible/athena_partitioned/hits_1.parquet"
        partition_layout: SINGLE_FILE
        scale: MEDIUM
        cross_validated: true
        notes: >-
          One of the 100 Athena-partitioned shards ClickBench itself publishes for Presto/Athena/Spark
          benchmarking; 1,000,000 rows. Pin captured via HTTP HEAD 2026-08-10; upstream Last-Modified is
          2022-07-03 and unchanged since (a static benchmark corpus, not daily-refreshed), so PinStrategy.ETAG
          is safe here. Expected results established via a transient DuckDB `read_parquet(...)` run directly
          against this pinned object (range-reads only; SNAPPY, single row group per shard, confirmed via
          `parquet_metadata()`), never a local copy.
        pin:
          etag: "\"1f5da68e097309811a675c849491ac48-9\""
          size_bytes: 174965044
          captured_at: "2026-08-10T00:00:00Z"
      - id: clickbench_parquet_shards
        spec: "/specs/clickbench-parquet-shards.csv-spec"
        format: PARQUET
        codec: SNAPPY
        provider: HTTPS
        resource: "https://datasets.clickhouse.com/hits_compatible/athena_partitioned/hits_{1..5}.parquet"
        pin_check_uri: "https://datasets.clickhouse.com/hits_compatible/athena_partitioned/hits_1.parquet"
        partition_layout: UNIFORM_SHARDS
        scale: MEDIUM
        cross_validated: true
        notes: >-
          5 of the 100 Athena-partitioned shards (hits_1..hits_5.parquet), addressed via the runner's
          `{1..5}` brace-range glob syntax; 5,000,000 rows total. Same static corpus/pin reasoning as
          clickbench_parquet_single; pin_check_uri HEAD-checks only the first shard as a representative
          (re-verifying all 5 would need 5 HEADs, still metadata-only but not worth the extra requests for a
          static corpus). Expected results established via a transient DuckDB
          `read_parquet([<the 5 URLs>])` run directly against the 5 pinned objects (range-reads only), never
          a local copy.
        pin:
          etag: "\"1f5da68e097309811a675c849491ac48-9\""
          size_bytes: 174965044
          object_count: 5
          captured_at: "2026-08-10T00:00:00Z"
      - id: clickbench_csv_gzip
        spec: "/specs/clickbench-gzip.csv-spec"
        format: CSV
        codec: GZIP
        provider: HTTPS
        resource: "https://datasets.clickhouse.com/hits_compatible/hits.csv.gz"
        settings:
          header_row: false
        partition_layout: SINGLE_FILE
        scale: LARGE
        cross_validated: false

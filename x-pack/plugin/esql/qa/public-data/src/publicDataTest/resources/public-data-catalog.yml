          etag: "\"911314689e54e249da844bf787cb1e59\""
          size_bytes: 20086801
          captured_at: "2026-08-11T00:00:00Z"
          strategy: CONTENT_SIGNATURE
          content_signature: >-
            count=4617295; distinct(station)=6920; count(element=PRCP)=2187477;
            count(element=TMIN)=865465; count(element=TMAX)=840783; count(element=SNOW)=488570;
            count(element=SNWD)=172230; avg(TMAX)/10=17.43; avg(PRCP)/10=2.0;
            top-station=USC00245685(2130) -- reproduced exactly by an independent DuckDB run against

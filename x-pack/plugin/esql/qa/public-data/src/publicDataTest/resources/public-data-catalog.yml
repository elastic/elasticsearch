          headerless CSV, whole-object gzip; 20MB, well under the ~500MB bounded-fetch allowance (plan
          section 6), so unlike ClickBench's gzip variants this one is independently cross-validated: DuckDB
          materialized the full object once and every aggregate came from that in-memory table. Pinned by
          content_signature, not ETAG: GHCN-D's pipeline wholesale-regenerates every year's export nightly
          (confirmed -- this object's Last-Modified was hours old at pin time), so ETag/size would false-
          positive on drift constantly even though 1900's actual data cannot change. The etag/size_bytes
          below are only the as-observed values at capture time, logged (not asserted) by PinValidator for
          this strategy.

test-admin:
  cluster:
    - all
  indices:
    - names: '*'
      privileges: [ all ]
  run_as:
    - '*'

into_read_only:
  cluster:
    - cluster:monitor/main
  indices:
    - names: ['into-existing']
      privileges:
        - read

# Can write to the destination, and so may be told what a bulk would also reveal
into_writer:
  cluster:
    - cluster:monitor/main
  indices:
    - names: ['into-existing', 'into-missing']
      privileges:
        - create_doc
        - auto_configure
    # ES|QL needs some read privilege to run at all; it is on an unrelated index so the writer has no read access to a destination
    - names: ['into-unrelated']
      privileges:
        - read

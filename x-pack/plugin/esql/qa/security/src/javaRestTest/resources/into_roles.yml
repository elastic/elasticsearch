# All cluster rights, all operations on all indices, and the right to run as any user
test-admin:
  cluster:
    - all
  indices:
    - names: '*'
      privileges: [ all ]
  run_as:
    - '*'

# Writes with the write privilege alone: no maintenance, no create_index, nothing that refreshes or manages an index
into_write:
  cluster: []
  indices:
    - names: [ 'src' ]
      privileges: [ read ]
    - names: [ 'dst', 'dst-strict' ]
      privileges: [ write ]

# Creates documents, but may not overwrite them or create an index
into_create_doc:
  cluster: []
  indices:
    - names: [ 'src' ]
      privileges: [ read ]
    - names: [ 'dst', 'tmpl-*' ]
      privileges: [ create_doc ]

into_read_only:
  cluster: []
  indices:
    - names: [ 'src', 'dst', 'dst-strict' ]
      privileges: [ read ]

# May read the source and nothing else
into_no_access:
  cluster: []
  indices:
    - names: [ 'src' ]
      privileges: [ read ]

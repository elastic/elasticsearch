apply plugin: 'java'
apply plugin: 'elasticsearch.internal-java-rest-test'
apply plugin: org.elasticsearch.gradle.internal.precommit.CheckstylePrecommitPlugin
apply plugin: org.elasticsearch.gradle.internal.precommit.ForbiddenApisPrecommitPlugin
apply plugin: org.elasticsearch.gradle.internal.precommit.ForbiddenPatternsPrecommitPlugin
apply plugin: org.elasticsearch.gradle.internal.precommit.FilePermissionsPrecommitPlugin
apply plugin: org.elasticsearch.gradle.internal.precommit.LoggerUsagePrecommitPlugin
apply plugin: org.elasticsearch.gradle.internal.precommit.TestingConventionsPrecommitPlugin

description = 'Checks that the official Apache Arrow clients (Python, Node.js) can read ES|QL Arrow responses'

dependencies {
  // Runs the Arrow clients in Docker containers
  javaRestTestImplementation project(':test:fixtures:arrow-interop-fixture')
  javaRestTestImplementation project(':test:fixtures:testcontainer-utils')
  javaRestTestRuntimeOnly "org.slf4j:slf4j-simple:${versions.slf4j}"
}

tasks.named('javaRestTest') {
  // Docker availability is only checked by a JUnit rule, which skips the whole suite when Docker is missing. Gradle
  // must not reuse such a skipped run as an up-to-date result once Docker is available.
  outputs.upToDateWhen { false }
  usesDefaultDistribution(
    "ES|QL plus the field types under test (spatial, analytics histograms and t-digest, unsigned_long, version, aggregate_metric_double) are x-pack modules; the default distribution avoids maintaining that list of modules and their dependencies here"
  )
}

import org.elasticsearch.gradle.testclusters.StandaloneRestIntegTestTask

apply plugin: 'java'
apply plugin: 'elasticsearch.internal-java-rest-test'
apply plugin: 'elasticsearch.internal-yaml-rest-test'
// Necessary to use tests in Serverless
apply plugin: 'elasticsearch.internal-test-artifact'
apply plugin: org.elasticsearch.gradle.internal.precommit.CheckstylePrecommitPlugin
apply plugin: org.elasticsearch.gradle.internal.precommit.ForbiddenApisPrecommitPlugin
apply plugin: org.elasticsearch.gradle.internal.precommit.ForbiddenPatternsPrecommitPlugin
apply plugin: org.elasticsearch.gradle.internal.precommit.FilePermissionsPrecommitPlugin
apply plugin: org.elasticsearch.gradle.internal.precommit.LoggerUsagePrecommitPlugin
apply plugin: org.elasticsearch.gradle.internal.precommit.TestingConventionsPrecommitPlugin
dependencies {
  javaRestTestImplementation project(xpackModule('esql:qa:testFixtures'))
  javaRestTestImplementation project(xpackModule('esql:qa:server'))
  javaRestTestImplementation project(xpackModule('esql:tools'))
  javaRestTestImplementation project(xpackModule('esql'))
  yamlRestTestImplementation project(xpackModule('esql:qa:server'))
  yamlRestTestImplementation(testArtifact(project(":modules:ip-location")))

  javaRestTestImplementation project(':libs:arrow')
  javaRestTestImplementation(testArtifact(project(":modules:ip-location")))

  clusterPlugins project(':plugins:mapper-size')
  clusterPlugins project(':plugins:mapper-murmur3')
  clusterPlugins project(':x-pack:plugin:inference:qa:test-service-plugin')
  clusterPlugins project(xpackModule('esql-datasource-csv'))
  clusterPlugins project(xpackModule('esql-datasource-ndjson'))
  clusterPlugins project(xpackModule('esql-datasource-http'))
  clusterPlugins project(xpackModule('esql-datasource-s3'))
}

// csvSpecTest: hand-coded IT classes for the csv-spec test suite. Shares the javaRestTest
// cluster dependencies but runs in a separate csvSpecTests task against its own cluster.
sourceSets {
    csvSpecTest
}
configurations.csvSpecTestCompileClasspath.extendsFrom(configurations.javaRestTestCompileClasspath)
configurations.csvSpecTestRuntimeClasspath.extendsFrom(configurations.javaRestTestRuntimeClasspath)
dependencies {
    csvSpecTestImplementation(sourceSets.javaRestTest.output)
}

restResources {
  restApi {
    include '_common', 'bulk', 'get', 'indices', 'esql', 'xpack', 'enrich', 'cluster', 'capabilities', 'index', 'search'
  }
  restTests {
    includeXpack 'esql'
  }
}

tasks.named('javaRestTest') {
  usesDefaultDistribution("to be triaged")
  maxParallelForks = 1
  jvmArgs('--add-opens=java.base/java.nio=ALL-UNNAMED')
}

// The whole csv-spec suite runs in ONE JVM against ONE shared cluster. EsqlSpecTestCase groups execution by
// category and swaps the cluster's data when the category changes, so a bare "FROM *" is scoped to a category
// and views exist only for the views category — without paying for a cluster per category.
// Granularity: run one file with --tests "*<File>IT", one test by adding -Dtests.method="test {csv-spec:<file>.<test>}".
def csvSpecTests = tasks.register('csvSpecTests', StandaloneRestIntegTestTask) {
  usesDefaultDistribution("to be triaged")
  maxParallelForks = 1
  jvmArgs('--add-opens=java.base/java.nio=ALL-UNNAMED')
  testClassesDirs = sourceSets.csvSpecTest.output.classesDirs
  classpath = sourceSets.csvSpecTest.runtimeClasspath
}
tasks.named('check').configure { dependsOn csvSpecTests }

// Security variant: the same suite against a cluster with xpack security enabled and the REST client
// authenticated as a superuser (see Clusters.java / ESRestTestCase.restClientSettings()). Not wired to check.
tasks.register('javaRestTestSecure', StandaloneRestIntegTestTask) {
  usesDefaultDistribution("to be triaged")
  maxParallelForks = 1
  jvmArgs('--add-opens=java.base/java.nio=ALL-UNNAMED')
  testClassesDirs = sourceSets.csvSpecTest.output.classesDirs
  classpath = sourceSets.csvSpecTest.runtimeClasspath
  filter {
    includeTestsMatching 'org.elasticsearch.xpack.esql.qa.single_node.*'
  }
  systemProperty 'tests.cluster.security.enabled', 'true'
  systemProperty 'tests.rest.cluster.username', 'test-admin'
  systemProperty 'tests.rest.cluster.password', 'x-pack-test-password'
}

tasks.named('yamlRestTest') {
  usesDefaultDistribution("to be triaged")
  maxParallelForks = 1
}

// Runs only the CSV spec suite — used by the dedicated releaseTestCheckEsqlQa1 CI job.
tasks.register('releaseTestCheckCsvSpec') {
  group = 'Verification'
  description = 'Runs csvSpecTests against a release distribution.'
  dependsOn csvSpecTests
}

// Runs only the two REST test variants — used by the releaseTestCheckEsqlQa3 CI job.
// csvSpecTests is excluded here; it runs in its own job via releaseTestCheckCsvSpec.
tasks.register('releaseTestCheckRest') {
  group = 'Verification'
  description = 'Runs the REST test suites against a release distribution.'
  dependsOn 'javaRestTest', 'yamlRestTest'
}


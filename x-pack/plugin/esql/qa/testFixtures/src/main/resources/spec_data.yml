  # 'views' list (absent = no views). Index/view lists already include every index/view matched by a
  # file's prefix wildcard (e.g. 'employees*'), so wildcards resolve the same as in production. A bare
  # 'FROM *' is category-scoped: it matches exactly the indices this category loads.

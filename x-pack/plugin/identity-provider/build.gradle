import org.elasticsearch.gradle.internal.AbstractDependenciesTask

apply plugin: 'elasticsearch.internal-es-plugin'
apply plugin: 'elasticsearch.internal-cluster-test'
esplugin {
  name = 'x-pack-identity-provider'
  description = 'Elasticsearch Expanded Pack Plugin - Identity Provider'
  classname = 'org.elasticsearch.xpack.idp.IdentityProviderPlugin'
  extendedPlugins = ['x-pack-core']
}

base {
  archivesName = 'x-pack-identity-provider'
}

dependencies {
  compileOnly project(path: xpackModule('core'))

  // the following are all SAML dependencies - might as well download the whole internet
  api "org.opensaml:opensaml-core-api:${versions.opensaml}"
  api "org.opensaml:opensaml-core-impl:${versions.opensaml}"
  api "org.opensaml:opensaml-saml-api:${versions.opensaml}"
  api "org.opensaml:opensaml-saml-impl:${versions.opensaml}"
  api "org.opensaml:opensaml-messaging-api:${versions.opensaml}"
  api "org.opensaml:opensaml-messaging-impl:${versions.opensaml}"
  api project(path: ':x-pack:libs:es-opensaml-security-api', configuration: 'shadow')
  api "org.opensaml:opensaml-security-impl:${versions.opensaml}"
  api "org.opensaml:opensaml-profile-api:${versions.opensaml}"
  api "org.opensaml:opensaml-profile-impl:${versions.opensaml}"
  api "org.opensaml:opensaml-xmlsec-api:${versions.opensaml}"
  api "org.opensaml:opensaml-xmlsec-impl:${versions.opensaml}"
  api "org.opensaml:opensaml-soap-api:${versions.opensaml}"
  api "org.opensaml:opensaml-soap-impl:${versions.opensaml}"
  api "org.opensaml:opensaml-storage-api:${versions.opensaml}"
  api "org.opensaml:opensaml-storage-impl:${versions.opensaml}"
  api "net.shibboleth:shib-support:9.2.3"
  api "net.shibboleth:shib-security:9.2.3"
  api "net.shibboleth:shib-networking:9.2.3"
  api "net.shibboleth:shib-velocity:9.2.3"
  api "com.google.code.findbugs:jsr305:3.0.2"
  api "org.apache.santuario:xmlsec:3.0.6"
  api "io.dropwizard.metrics:metrics-core:4.2.39"
  // cryptacular is embedded in the es-opensaml-security-api shadow jar (with a FIPS-safe CertUtil patch)

  // provided by x-pack-core
  compileOnly "org.slf4j:slf4j-api:${versions.slf4j}"
  api "org.apache.httpcomponents.client5:httpclient5:${versions.httpclient5}"
  api "org.apache.httpcomponents.core5:httpcore5:${versions.httpcore5}"
  api "org.apache.httpcomponents.client5:httpclient5-cache:${versions.httpclient5}"
  runtimeOnly 'com.google.guava:guava:33.0.0-jre'
  runtimeOnly 'com.google.guava:failureaccess:1.0.2'
  runtimeOnly "commons-codec:commons-codec:${versions.commonscodec}"

  testImplementation "org.elasticsearch:mocksocket:${versions.mocksocket}"
  testImplementation(testArtifact(project(xpackModule('core'))))
  // So that we can extend LocalStateCompositeXPackPlugin
  testImplementation(testArtifact(project(xpackModule('security'))))
  testImplementation project(':modules:lang-mustache')
  internalClusterTestImplementation project(":modules:analysis-common")

}

tasks.withType(AbstractDependenciesTask).configureEach {
  mapping from: /shib-.*|opensaml-.*/, to: 'shibboleth'
  mapping from: /http.*/, to: 'httpclient'
  mapping from: /bc.*/, to: 'bouncycastle'
  mapping from: /failureaccess.*/, to: 'guava'
}

tasks.named("forbiddenPatterns").configure {
  exclude '**/*.key'
  exclude '**/*.p12'
  exclude '**/*.der'
  exclude '**/*.zip'
}

// classes are missing, e.g. com.ibm.icu.lang.UCharacter
tasks.named("thirdPartyAudit").configure {
    ignoreMissingClasses(
        // SAML dependencies
        // [missing classes] Some cli utilities that we don't use depend on these missing JCommander classes
        'com.beust.jcommander.JCommander',
        'com.beust.jcommander.converters.BaseConverter',
        // [missing classes] Shibboleth + OpenSAML have servlet support that we don't use
        'jakarta.servlet.Filter',
        'jakarta.servlet.FilterChain',
        'jakarta.servlet.FilterConfig',
        'jakarta.servlet.ServletContext',
        'jakarta.servlet.ServletRequest',
        'jakarta.servlet.ServletResponse',
        'jakarta.servlet.http.Cookie',
        'jakarta.servlet.http.HttpServletRequest',
        'jakarta.servlet.http.HttpServletResponse',
        'jakarta.servlet.http.HttpSession',
        // [missing classes] Shibboleth + OpenSAML have velocity support that we don't use
        'org.apache.velocity.VelocityContext',
        'org.apache.velocity.app.VelocityEngine',
        'org.apache.velocity.context.Context',
        'org.apache.velocity.runtime.resource.loader.StringResourceLoader',
        'org.apache.velocity.runtime.resource.util.StringResourceRepository',
        // [missing classes] OpenSAML storage and HttpClient cache have optional memcache support
        'net.spy.memcached.CASResponse',
        'net.spy.memcached.CASValue',
        'net.spy.memcached.MemcachedClient',
        'net.spy.memcached.MemcachedClientIF',
        'net.spy.memcached.CachedData',
        'net.spy.memcached.internal.BulkFuture',
        'net.spy.memcached.internal.BulkGetFuture',
        'net.spy.memcached.internal.GetFuture',
        'net.spy.memcached.internal.OperationFuture',
        'net.spy.memcached.transcoders.Transcoder',
        // [missing classes] HttpClient5 optional compression codecs (Netty/brotli/zstd)
        'com.aayushatharva.brotli4j.decoder.DecoderJNI$Status',
        'com.aayushatharva.brotli4j.decoder.DecoderJNI$Wrapper',
        'com.aayushatharva.brotli4j.encoder.Encoder$Mode',
        'com.aayushatharva.brotli4j.encoder.EncoderJNI$Operation',
        'com.aayushatharva.brotli4j.encoder.EncoderJNI$Wrapper',
        'com.github.luben.zstd.ZstdDecompressCtx',
        'com.github.luben.zstd.ZstdDirectBufferCompressingStream',
        'org.apache.commons.compress.compressors.CompressorStreamFactory',
        // [missing classes] HttpClient5 optional TLS provider
        'org.conscrypt.Conscrypt',
        // [missing classes] HttpClient5-cache optional ehcache v3 backend
        'org.ehcache.Cache',
        // [missing classes] Bouncycastle classes still referenced by shib-security / opensaml-xmlsec
        // (bcpkix-jdk18on excluded from classpath; shadow jar is excluded from thirdPartyAudit)
        'org.bouncycastle.asn1.ASN1Encodable',
        'org.bouncycastle.asn1.ASN1InputStream',
        'org.bouncycastle.asn1.ASN1ObjectIdentifier',
        'org.bouncycastle.asn1.x509.AlgorithmIdentifier',
        'org.bouncycastle.asn1.x509.Extension',
        'org.bouncycastle.asn1.x509.GeneralNames',
        'org.bouncycastle.asn1.x509.SubjectPublicKeyInfo',
        'org.bouncycastle.cert.X509v3CertificateBuilder',
        'org.bouncycastle.cert.jcajce.JcaX509CertificateConverter',
        'org.bouncycastle.cert.jcajce.JcaX509ExtensionUtils',
        'org.bouncycastle.crypto.Digest',
        'org.bouncycastle.crypto.agreement.kdf.ConcatenationKDFGenerator',
        'org.bouncycastle.openssl.jcajce.JcaPEMWriter',
        'org.bouncycastle.operator.jcajce.JcaContentSignerBuilder',
    )

  ignoreViolations(
    // Guava uses internal java api: sun.misc.Unsafe
    'com.google.common.hash.LittleEndianByteArray$UnsafeByteArray',
    'com.google.common.hash.LittleEndianByteArray$UnsafeByteArray$1',
    'com.google.common.hash.LittleEndianByteArray$UnsafeByteArray$2',
    'com.google.common.hash.Striped64',
    'com.google.common.hash.Striped64$1',
    'com.google.common.hash.Striped64$Cell',
    'com.google.common.cache.Striped64',
    'com.google.common.cache.Striped64$1',
    'com.google.common.cache.Striped64$Cell',
    'com.google.common.primitives.UnsignedBytes$LexicographicalComparatorHolder$UnsafeComparator',
    'com.google.common.primitives.UnsignedBytes$LexicographicalComparatorHolder$UnsafeComparator$1',
    'com.google.common.util.concurrent.AbstractFuture$UnsafeAtomicHelper',
    'com.google.common.util.concurrent.AbstractFuture$UnsafeAtomicHelper$1',
  )
}

tasks.named("thirdPartyAudit").configure {
  ignoreMissingClasses(
    // [missing classes] xmlsec 3.0.6 moved from javax.xml.bind to jakarta.xml.bind (JAXB 3)
    'jakarta.xml.bind.JAXBContext',
    'jakarta.xml.bind.JAXBElement',
    'jakarta.xml.bind.JAXBException',
    'jakarta.xml.bind.Unmarshaller',
    'jakarta.xml.bind.UnmarshallerHandler',
    // [missing classes] OpenSAML storage has an optional JSON-backed storage impl (jakarta namespace in 5.x)
    'jakarta.json.Json',
    'jakarta.json.JsonNumber',
    'jakarta.json.JsonObject',
    'jakarta.json.JsonReader',
    'jakarta.json.JsonValue$ValueType',
    'jakarta.json.JsonValue',
    'jakarta.json.stream.JsonGenerator',
    // [missing classes] OpenSAML core-impl optional metrics JSON reporting support
    'com.fasterxml.jackson.databind.ObjectMapper',
    'com.fasterxml.jackson.databind.ObjectWriter',
    'com.fasterxml.jackson.databind.SerializationFeature',
  )
}

addQaCheckDependencies(project)

if (buildParams.inFipsJvm) {
  // We don't support the IDP in FIPS-140 mode, so no need to run tests
  tasks.named("test").configure { enabled = false }
}

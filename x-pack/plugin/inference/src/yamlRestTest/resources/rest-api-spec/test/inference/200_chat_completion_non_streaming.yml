---
"Non-streaming chat completion returns a single JSON response":
  - do:
      inference.put:
        task_type: chat_completion
        inference_id: test-non-streaming-cc
        body:
          service: streaming_completion_test_service
          service_settings:
            model: test-model
            api_key: test-key

  - do:
      inference.inference:
        task_type: chat_completion
        inference_id: test-non-streaming-cc
        body:
          messages:
            - role: user
              content: hello world

  - match: { object: "chat.completion" }
  - match: { model: "test-model" }
  - is_true: id
  - is_true: choices
  - match: { choices.0.index: 0 }
  - match: { choices.0.message.role: "assistant" }
  - match: { choices.0.message.content: "HELLO WORLD" }
  - match: { choices.0.finish_reason: "stop" }
  - match: { usage.completion_tokens: 1 }
  - match: { usage.prompt_tokens: 1 }
  - match: { usage.total_tokens: 2 }

---
"Non-streaming chat completion reports errors in the OpenAI error shape":
  # TransportUnifiedCompletionInferenceAction wraps every failure in a UnifiedChatCompletionException, so an unknown inference_id is
  # enough to exercise the error path. The response must carry the same {"error":{"code","message","type"}} body as the _stream route
  # rather than Elasticsearch's standard error envelope.
  - do:
      catch: missing
      inference.inference:
        task_type: chat_completion
        inference_id: does-not-exist
        body:
          messages:
            - role: user
              content: hello world

  - match: { error.code: "not_found" }
  - match: { error.type: "resource_not_found_exception" }
  - is_true: error.message
  - is_false: error.root_cause

                oversample: 3
  - match: { error.reason: "/.*does\\snot\\sapply\\sto\\san\\sunquantized\\s\\[hnsw\\]\\sfield.*/" }

---
"A rescore_vector is accepted on quantized hnsw fields":
  - do:
      knn_eval:

---
"visit_percentage is rejected on hnsw":
  - do:
      catch: bad_request
      knn_eval:
        index: hnsw_plain
        body:
          field: emb
          k: 5
          query_source:
            from: docs
            size: 5
          knn_settings:
            - visit_percentage: 5
  - match: { error.reason: "/\\[visit_percentage\\]\\sapplies\\sonly\\sto\\sbbq_disk.*/" }


---
"An omitted baseline on a plain hnsw field is the deepest beam, not exact":
  - do:
      knn_eval:
        index: hnsw_plain
        body:
          field: emb
          k: 5
          query_source:
            from: docs
            size: 10
            seed: 42
          knn_settings:
            - num_candidates: 5
            - num_candidates: 12

  - match: { baseline.num_candidates: 1000 }
  - match: { baseline_vector_ops_kind: full_precision_visit }
  - match: { index_info.hnsw_plain.hnsw_early_termination: true }
  - is_false: baseline.exact
  - is_false: baseline.rescore_vector
  - length: { results: 2 }
  - length: { failures: 0 }
  # 12 documents all fit in a beam of 12: the whole corpus is visited
  - match: { results.1.recall: 1.0 }
  - gte: { results.0.recall: 0.0 }
  - lte: { results.0.recall: 1.0 }

---
"visit_percentage is rejected on a graph field":
  - do:
      catch: bad_request
      knn_eval:
        index: hnsw_plain
        body:
          field: emb
          k: 5
          query_source:
            from: docs
            size: 5
            seed: 42
          knn_settings:
            - visit_percentage: 5
  - match: { error.reason: "/\\[visit_percentage\\]\\sapplies\\sonly\\sto\\sbbq_disk.*/" }

---
"Caller supplied query vectors get the same default baseline":
  - do:
      knn_eval:
        index: hnsw_plain
        body:
          field: emb
          k: 5
          query_source:
            from: vectors
            vectors:
              - id: q1
                query_vector: [-0.3523, -0.6983, 0.3019, -0.8551, 0.0718, -0.2686, -0.884, 0.0149, -0.925, -0.1327, -0.8603, -0.8186, -0.151, 0.6537, -0.7524, -0.5535, 0.2549, 0.8954, 0.1542, -0.2066, 0.9525, -0.9068, 0.7169, -0.4208, -0.7115, -0.7644, -0.383, 0.6323, -0.6385, 0.1632, 0.2778, -0.2552, 0.0955, -0.8744, -0.8808, -0.5881, 0.3608, -0.1448, -0.3717, 0.1711, -0.0936, -0.4005, 0.5888, 0.398, -0.5118, 0.1488, 0.0504, 0.7503, 0.4589, -0.4241, 0.9603, -0.7639, -0.1638, 0.5143, -0.696, -0.0221, -0.9216, 0.3364, 0.5291, 0.1461, 0.751, -0.3725, 0.3906, 0.1887]
          knn_settings:
            - num_candidates: 12

  - match: { baseline.num_candidates: 1000 }
  - length: { failures: 0 }
  - match: { results.0.recall: 1.0 }

---
"A candidate deeper than the default baseline needs an explicit baseline":
  - do:
      catch: bad_request
      knn_eval:
        index: hnsw_plain
        body:
          field: emb
          k: 5
          query_source:
            from: docs
            size: 5
            seed: 42
          knn_settings:
            - num_candidates: 1001
  - match: { error.reason: "/.*searches\\sdeeper\\sthan\\sthe\\sbaseline.*beam\\s\\[1001\\].*\\[1000\\].*/" }

  - do:
      knn_eval:
        index: hnsw_plain
        body:
          field: emb
          k: 5
          query_source:
            from: docs
            size: 5
            seed: 42
          baseline:
            num_candidates: 2000
          knn_settings:
            - num_candidates: 1001
  - length: { results: 1 }
  - length: { failures: 0 }

  # the default beam is 100 * k above the 1000 floor; k stays below the 12 documents less the sampled one
  - do:
      knn_eval:
        index: hnsw_plain
        body:
          field: emb
          k: 11
          query_source:
            from: docs
            size: 5
            seed: 42
          knn_settings:
            - num_candidates: 1100
  - match: { baseline.num_candidates: 1100 }
  - length: { failures: 0 }

---
"An explicit baseline on an hnsw field is used as given":
  - do:
      knn_eval:
        index: hnsw_plain
        body:
          field: emb
          k: 5
          query_source:
            from: docs
            size: 5
            seed: 42
          baseline:
            num_candidates: 12
          knn_settings:
            - num_candidates: 5

  - match: { baseline.num_candidates: 12 }
  - length: { results: 1 }
  - length: { failures: 0 }

---
"visit_percentage is rejected in the baseline of a graph field":
  - do:
      catch: bad_request
      knn_eval:
        index: hnsw_plain
        body:
          field: emb
          k: 5
          query_source:
            from: docs
            size: 5
            seed: 42
          baseline:
            visit_percentage: 20
          knn_settings:
            - num_candidates: 5
  - match: { error.reason: "/.*applies\\sonly\\sto\\sbbq_disk.*in\\sthe\\sbaseline.*/" }

---
"A candidate with a wider beam than the baseline is rejected":
  - do:
      catch: bad_request
      knn_eval:
        index: hnsw_plain
        body:
          field: emb
          k: 5
          query_source:
            from: docs
            size: 5
            seed: 42
          baseline:
            num_candidates: 10
          knn_settings:
            - num_candidates: 20
  - match: { error.reason: "/.*searches\\sdeeper\\sthan\\sthe\\sbaseline.*beam\\s\\[20\\].*\\[10\\].*/" }

---
"An empty settings entry searches with the default num_candidates":
  - do:
      knn_eval:
        index: hnsw_plain
        body:
          field: emb
          k: 5
          query_source:
            from: docs
            size: 5
            seed: 42
          knn_settings:
            - {}

  - length: { results: 1 }
  - length: { failures: 0 }

  # 40 documents all fit in a beam of 40: the whole corpus is visited
  - match: { results.1.recall: 1.0 }
  - gte: { results.0.recall: 0.0 }
  - lte: { results.0.recall: 1.0 }

---
"An omitted baseline on int8_hnsw rescores at full precision":
  - do:
      knn_eval:
        index: hnsw_int8
        body:
          field: emb
          k: 5
          query_source:
            from: docs
            size: 10
            seed: 42
          knn_settings:
            # 6 * 8 covers all 40 documents, so every one is rescored at full precision
            - num_candidates: 40
              rescore_vector:
                oversample: 8

  - match: { baseline.num_candidates: 9999 }
  - match: { baseline.rescore_vector.oversample: 100.0 }
  - is_false: baseline.visit_percentage
  - length: { failures: 0 }
  - match: { results.0.recall: 1.0 }
  - gt: { results.0.vector_ops: 0 }


      indices.create:
        index: hnsw_no_early_termination
        body:
          settings:
            index:
              number_of_shards: 1
              dense_vector.hnsw_enable_early_termination: false
          mappings:
            properties:
              emb:
                type: dense_vector
                dims: 64
                index: true
                similarity: l2_norm
                index_options:
                  type: hnsw
  - do:
      catch: bad_request
      knn_eval:
        index: hnsw_no_early_termination,hnsw_plain
        body:
          field: emb
          k: 5
          query_source:
            from: docs
            size: 5
          knn_settings:
            - num_candidates: 20
  - match: { error.reason: "/.*different\\s\\[index.dense_vector.hnsw_enable_early_termination\\]\\svalues.*/" }

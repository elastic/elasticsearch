---
"Two graph index types cannot be evaluated together":
  - do:
      indices.create:
        index: plain_idx
        body:
          settings:
            index:
              number_of_shards: 1
          mappings:
            properties:
              emb:
                type: dense_vector
                dims: 64
                index: true
                similarity: l2_norm
                index_options:
                  type: hnsw
  - do:
      indices.create:
        index: int8_idx
        body:
          settings:
            index:
              number_of_shards: 1
          mappings:
            properties:
              emb:
                type: dense_vector
                dims: 64
                index: true
                similarity: l2_norm
                index_options:
                  type: int8_hnsw
  - do:
      catch: bad_request
      knn_eval:
        index: plain_idx,int8_idx
        body:
          field: emb
          k: 5
          query_source:
            from: docs
            size: 5
            seed: 42
          knn_settings:
            - num_candidates: 12
  - match: { error.reason: "/.*resolves\\sdifferently\\sacross\\sindices.*/" }

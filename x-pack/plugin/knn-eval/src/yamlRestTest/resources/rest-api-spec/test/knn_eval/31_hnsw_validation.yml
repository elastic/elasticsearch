---
"Flat index types are rejected":
  - do:
      indices.create:
        index: flat_idx
        body:
          settings:
            index:
              number_of_shards: 1
          mappings:
            properties:
              emb:
                type: dense_vector
                dims: 64
                index: true
                similarity: l2_norm
                index_options:
                  type: flat
  - do:
      catch: bad_request
      knn_eval:
        index: flat_idx
        body:
          field: emb
          k: 5
          query_source:
            from: docs
            size: 5
            seed: 42
          knn_settings:
            - num_candidates: 12
  - match: { error.reason: "/.*must\\suse\\s\\[index_options.type\\]\\sof.*found\\s\\[flat\\].*/" }

---
"A bbq_disk index and an hnsw index cannot be evaluated together":
  - requires:
      cluster_features: "mapper.bbq_disk_support"
      reason: "bbq_disk index_options"
  - do:
      indices.create:
        index: disk_idx
        body:
          settings:
            index:
              number_of_shards: 1
          mappings:
            properties:
              emb:
                type: dense_vector
                dims: 64
                index: true
                similarity: l2_norm
                index_options:
                  type: bbq_disk
  - do:
      indices.create:
        index: hnsw_idx
        body:
          settings:
            index:
              number_of_shards: 1
          mappings:
            properties:
              emb:
                type: dense_vector
                dims: 64
                index: true
                similarity: l2_norm
                index_options:
                  type: hnsw
  - do:
      catch: bad_request
      knn_eval:
        index: disk_idx,hnsw_idx
        body:
          field: emb
          k: 5
          query_source:
            from: docs
            size: 5
            seed: 42
          knn_settings:
            - num_candidates: 12
  - match: { error.reason: "/.*resolves\\sdifferently\\sacross\\sindices.*/" }


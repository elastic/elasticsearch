---
setup:
  - requires:
      test_runner_features: [ capabilities ]
      capabilities:
        - method: PUT
          path: /{index}
          capabilities: [ columnar_index_modes ]
      reason: "columnar index modes required to reproduce sorting gaps"

---
teardown:
  - do:
      indices.delete:
        index: test-collapse-columnar
        ignore_unavailable: true
  - do:
      indices.delete:
        index: test-composite-columnar
        ignore_unavailable: true

---
# Muted in muted-tests.yml: collapse groups by ordinal and columnar keyword doc values are BINARY,
# so the search fails with "unexpected doc values type BINARY".
# Tracked by https://github.com/elastic/elasticsearch/issues/158753
"field collapse on columnar keyword field":
  - do:
      indices.create:
        index: test-collapse-columnar
        body:
          settings:
            index.mode: columnar
            index.number_of_shards: 1
          mappings:
            properties:
              "@timestamp":
                type: date
              host.name:
                type: keyword

  - do:
      index:
        index: test-collapse-columnar
        body:
          "@timestamp": "2024-01-01T00:00:00Z"
          host.name: "host-a"

  - do:
      index:
        index: test-collapse-columnar
        body:
          "@timestamp": "2024-01-02T00:00:00Z"
          host.name: "host-b"

  - do:
      index:
        index: test-collapse-columnar
        refresh: true
        body:
          "@timestamp": "2024-01-03T00:00:00Z"
          host.name: "host-c"

  - do:
      search:
        index: test-collapse-columnar
        body:
          collapse:
            field: host.name
          sort:
            - "@timestamp": desc
          size: 10

  - match: { hits.total.value: 3 }
  - length: { hits.hits: 3 }

---
"composite aggregation after on keyword index sorted columnar field":
  - do:
      indices.create:
        index: test-composite-columnar
        body:
          settings:
            index.mode: columnar
            index.number_of_shards: 1
            index.sort.field: kw
            index.sort.order: asc
          mappings:
            properties:
              kw:
                type: keyword

  - do:
      index:
        index: test-composite-columnar
        body:
          kw: "kw-a"

  - do:
      index:
        index: test-composite-columnar
        body:
          kw: "kw-b"

  - do:
      index:
        index: test-composite-columnar
        refresh: true
        body:
          kw: "kw-c"

  - do:
      search:
        index: test-composite-columnar
        body:
          size: 0
          aggregations:
            kw_terms:
              composite:
                size: 1
                sources:
                  - kw:
                      terms:
                        field: kw

  - match: { aggregations.kw_terms.buckets.0.key.kw: "kw-a" }

  - do:
      search:
        index: test-composite-columnar
        body:
          size: 0
          aggregations:
            kw_terms:
              composite:
                size: 1
                after:
                  kw: "kw-a"
                sources:
                  - kw:
                      terms:
                        field: kw

  - match: { aggregations.kw_terms.buckets.0.key.kw: "kw-b" }

---
# The index sorts a document by its smallest value, but a composite terms source makes a bucket of each of its values, so
# a multi-valued sort field must not let the aggregation skip or stop early on the index order: ["kw-a", "kw-z"] sorts
# first and still holds the last bucket.
"composite aggregation after on multi-valued keyword index sorted columnar field":
  - do:
      indices.create:
        index: test-composite-columnar-multi
        body:
          settings:
            index.mode: columnar
            index.number_of_shards: 1
            index.sort.field: kw
            index.sort.order: asc
          mappings:
            properties:
              kw:
                type: keyword

  - do:
      bulk:
        index: test-composite-columnar-multi
        refresh: true
        body:
          - index: {}
          - kw: [ "kw-a", "kw-z" ]
          - index: {}
          - kw: "kw-b"
          - index: {}
          - kw: "kw-c"

  - do:
      search:
        index: test-composite-columnar-multi
        body:
          size: 0
          aggregations:
            kw_terms:
              composite:
                size: 2
                sources:
                  - kw:
                      terms:
                        field: kw

  - length: { aggregations.kw_terms.buckets: 2 }
  - match: { aggregations.kw_terms.buckets.0.key.kw: "kw-a" }
  - match: { aggregations.kw_terms.buckets.1.key.kw: "kw-b" }

  - do:
      search:
        index: test-composite-columnar-multi
        body:
          size: 0
          aggregations:
            kw_terms:
              composite:
                size: 2
                after:
                  kw: "kw-b"
                sources:
                  - kw:
                      terms:
                        field: kw

  - length: { aggregations.kw_terms.buckets: 2 }
  - match: { aggregations.kw_terms.buckets.0.key.kw: "kw-c" }
  - match: { aggregations.kw_terms.buckets.0.doc_count: 1 }
  - match: { aggregations.kw_terms.buckets.1.key.kw: "kw-z" }
  - match: { aggregations.kw_terms.buckets.1.doc_count: 1 }

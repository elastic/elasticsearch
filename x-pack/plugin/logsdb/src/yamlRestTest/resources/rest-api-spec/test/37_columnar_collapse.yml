---
"collapse rejects a multi valued columnar keyword field":
  - do:
      indices.create:
        index: test-collapse-multi
        body:
          settings:
            index.mode: columnar
            index.number_of_shards: 1
            index.number_of_replicas: 0
          mappings:
            properties:
              "@timestamp":
                type: date
              host.name:
                type: keyword

  - do:
      index:
        index: test-collapse-multi
        refresh: true
        body:
          "@timestamp": "2024-01-01T00:00:00Z"
          host.name: [ "host-a", "host-b" ]

  - do:
      catch: /the grouping field must be single valued/
      search:
        index: test-collapse-multi
        body:
          collapse:
            field: host.name
          sort:
            - "@timestamp": asc
          size: 10


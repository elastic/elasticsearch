---
setup:
  - requires:
      test_runner_features: [ capabilities ]
      capabilities:
        - method: PUT
          path: /{index}
          capabilities: [ columnar_index_modes ]
      reason: "columnar index modes required to write binary keyword doc values"

---
teardown:
  - do:
      indices.delete:
        index: test-collapse-*
        ignore_unavailable: true

---
"collapse on a columnar keyword field":
  - do:
      indices.create:
        index: test-collapse-payload
        body:
          settings:
            index.mode: columnar
            index.number_of_shards: 1
            index.number_of_replicas: 0
          mappings:
            properties:
              "@timestamp":
                type: date
              host.name:
                type: keyword

  - do:
      bulk:
        index: test-collapse-payload
        refresh: true
        body:
          - { "index": { } }
          - { "@timestamp": "2024-01-01T00:00:00Z", "host.name": "host-a" }
          - { "index": { } }
          - { "@timestamp": "2024-01-02T00:00:00Z", "host.name": "host-b" }
          - { "index": { } }
          - { "@timestamp": "2024-01-03T00:00:00Z", "host.name": "host-a" }

  - do:
      search:
        index: test-collapse-payload
        body:
          collapse:
            field: host.name
          sort:
            - "@timestamp": asc
          size: 10

  - match: { hits.total.value: 3 }
  - length: { hits.hits: 2 }
  - match: { hits.hits.0.fields.host\.name.0: "host-a" }
  - match: { hits.hits.1.fields.host\.name.0: "host-b" }


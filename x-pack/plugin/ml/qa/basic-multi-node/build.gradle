apply plugin: 'elasticsearch.internal-java-rest-test'

dependencies {
  javaRestTestImplementation(project(':modules:lang-mustache'))
}

tasks.named("javaRestTest").configure {
  usesDefaultDistribution("ml basic multi node tests require the ml plugin and the trial license from the default distribution")
  // Both IT classes share a single 3-node cluster (see Clusters#CLUSTER), mirroring the single cluster the
  // legacy testClusters setup created for this task. A shared cluster requires serial execution.
  maxParallelForks = 1
}

if (buildParams.inFipsJvm){
  // Test clusters run with security disabled
  tasks.named("javaRestTest").configure{enabled = false }
}

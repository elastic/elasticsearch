import org.elasticsearch.gradle.Version
import org.elasticsearch.gradle.VersionProperties

apply plugin: 'elasticsearch.internal-yaml-rest-test'

dependencies {
  yamlRestTestImplementation project(':x-pack:qa')
}

Version ccsCompatVersion = new Version(VersionProperties.getElasticsearchVersion().getMajor(), VersionProperties.getElasticsearchVersion().getMinor() - 1, 0)

restResources {
  restApi {
    include '_common', 'bulk', 'indices', 'cluster', 'search', 'security', 'ml'
  }
}

tasks.named("yamlRestTest").configure {
  usesDefaultDistribution("ML cross-cluster tests require security and a trial license from the default distribution")
  usesBwcDistribution(ccsCompatVersion)
  systemProperty 'tests.ccs_compat_version', ccsCompatVersion.toString()
}

version: ${xpack.oteldata.template.version}
_meta:
  description: Default settings for OpenTelemetry metrics and exemplars data streams
  managed: true
template:
  settings:
    index:
      time_series:
        # Cluster the time series of each metric by resource in the index sort order and the codec's tsid partitions,
        # see IndexSettings#TIME_SERIES_TSID_PREFIXED_DIMENSIONS. Exemplars must use the same value as metrics so that
        # an exemplar gets the tsid of the time series it belongs to.
        tsid_prefixed_dimensions: ["resource.attributes.*"]

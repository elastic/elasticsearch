---
version: ${xpack.oteldata.template.version}
_meta:
  description: Mappings for Universal Profiling events OTel data stream
  managed: true
template:
  settings:
    mode: logsdb
    index:
      number_of_shards: 4
      auto_expand_replicas: "0-1"
      max_result_window: 150000
      refresh_interval: 10s
      routing.allocation.include._tier_preference: data_hot
    codec: best_compression
  mappings:
    dynamic: false
    dynamic_templates:
      - resource_attributes_as_keyword:
          path_match: "resource.attributes.*"
          match_mapping_type: string
          mapping:
            type: keyword
            index: false
    properties:
      "@timestamp":
        type: date_nanos
        format: strict_date_optional_time_nanos||epoch_second
      Stacktrace.id:
        type: keyword
        index: false
      Stacktrace.count:
        type: short
        index: false
      Stacktrace.sampling_frequency:
        type: long
        index: false
      resource:
        properties:
          attributes:
            type: passthrough
            dynamic: true
            priority: 40
            properties:
              host.id:
                type: keyword
              host.name:
                type: keyword
              host.ip:
                type: ip
              k8s.namespace.name:
                type: keyword
              k8s.pod.name:
                type: keyword
              container.name:
                type: keyword
              container.id:
                type: keyword
              service.name:
                type: keyword
              process.executable.name:
                type: keyword
              thread.name:
                type: keyword
              os.version:
                type: keyword
      process.thread.name:
        type: alias
        path: resource.attributes.thread.name
      orchestrator.resource.name:
        type: alias
        path: resource.attributes.k8s.pod.name

---
version: ${xpack.oteldata.template.version}
_meta:
  description: Mappings for eBPF Profiler events OTel data stream
  managed: true
template:
  settings:
    mode: logsdb
    index:
      number_of_shards: 4
      auto_expand_replicas: "0-1"
      max_result_window: 150000
      refresh_interval: 10s
      sort:
        field:
          - resource.attributes.k8s.namespace.name
          - resource.attributes.k8s.pod.name
          - resource.attributes.service.name
          - resource.attributes.host.name
          - resource.attributes.container.name
          - resource.attributes.process.executable.name
          - resource.attributes.thread.name
          - "@timestamp"
        order:
          - asc
          - asc
          - asc
          - asc
          - asc
          - asc
          - asc
          - desc
      routing.allocation.include._tier_preference: data_hot
    codec: best_compression
  mappings:
    dynamic: false
    dynamic_templates:
      - resource_attributes_as_keyword:
          path_match: "resource.attributes.*"
          match_mapping_type: string
          mapping:
            type: keyword
            index: false
    properties:
      "@timestamp":
        type: date_nanos
        format: strict_date_optional_time_nanos||epoch_second
      stacktrace.id:
        type: keyword
        index: false
      count:
        type: short
        index: false
      sampling_frequency:
        type: long
        index: false
      resource:
        properties:
          attributes:
            type: passthrough
            dynamic: true
            priority: 40
            properties:
              host.id:
                type: keyword
                index: false
              host.name:
                type: keyword
                index: false
              host.ip:
                type: ip
                index: false
              k8s.namespace.name:
                type: keyword
                index: false
              k8s.pod.name:
                type: keyword
                index: false
              container.name:
                type: keyword
                index: false
              container.id:
                type: keyword
                index: false
              service.name:
                type: keyword
                index: false
              process.executable.name:
                type: keyword
                index: false
              thread.name:
                type: keyword
                index: false
              os.version:
                type: keyword
                index: false
      # Aliases for ECS field names used in queries so TransportGetStackTracesAction needs no OTel branching
      Stacktrace.id:
        type: alias
        path: stacktrace.id
      Stacktrace.sampling_frequency:
        type: alias
        path: sampling_frequency
      process.thread.name:
        type: alias
        path: resource.attributes.thread.name
      orchestrator.resource.name:
        type: alias
        path: resource.attributes.k8s.pod.name

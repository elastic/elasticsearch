---
version: ${xpack.oteldata.template.version}
_meta:
  description: Mappings for eBPF Profiler executables OTel data stream
  managed: true
template:
  settings:
    index:
      auto_expand_replicas: "0-1"
      refresh_interval: 10s
      routing.allocation.include._tier_preference: data_hot
      mapping:
        source:
          mode: synthetic
  mappings:
    dynamic: false
    properties:
      "@timestamp":
        type: date
        format: epoch_second
      resource:
        properties:
          attributes:
            type: passthrough
            dynamic: true
            priority: 40
            properties:
              process.executable.build_id.htlhash:
                type: keyword
                index: true
              process.executable.name:
                type: keyword
                index: false

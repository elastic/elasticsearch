---
version: ${xpack.oteldata.template.version}
index_patterns: ["profiling-stackframes.otel-*"]
priority: 100
data_stream: {}
allow_auto_create: true
_meta:
  description: OTel data stream template for eBPF Profiler stackframes
  managed: true
composed_of:
  - profiling-stackframes-otel@mappings
  - profiling-stackframes-otel@custom
ignore_missing_component_templates:
  - profiling-stackframes-otel@custom
template:
  lifecycle:
    data_retention: 60d

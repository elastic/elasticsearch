---
version: ${xpack.oteldata.template.version}
index_patterns: ["profiling-stacktraces.otel-default*"]
priority: 100
data_stream: {}
allow_auto_create: true
_meta:
  description: OTel data stream template for Universal Profiling stacktraces
  managed: true
composed_of:
  - profiling-stacktraces-otel@mappings
  - profiling-stacktraces-otel@custom
ignore_missing_component_templates:
  - profiling-stacktraces-otel@custom
template:
  lifecycle:
    data_retention: 60d

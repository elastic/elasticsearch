---
version: ${xpack.oteldata.template.version}
index_patterns: ["traces-browser.otel-*"]
priority: 130
data_stream: {}
allow_auto_create: true
_meta:
  description: OpenTelemetry browser traces sorted by service and session
  managed: true
composed_of:
  - traces@mappings
  - traces@settings
  - otel@mappings
  - otel@settings
  - traces-otel@mappings
  - semconv-resource-to-ecs@mappings
  - traces@custom
  - traces-otel@custom
  - ecs@mappings
ignore_missing_component_templates:
  - traces@custom
  - traces-otel@custom
template:
  settings:
    index:
      sort:
        field: [ "resource.attributes.service.name", "attributes.session.id", "@timestamp" ]
        order: [ "asc", "asc", "desc" ]
  mappings:
    properties:
      data_stream.type:
        type: constant_keyword
        value: traces

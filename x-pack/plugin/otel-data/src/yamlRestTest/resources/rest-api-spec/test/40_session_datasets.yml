---
setup:
  - do:
      cluster.health:
        wait_for_events: languid

---
"logs browser uses session sorting and preserves OTel mappings":
  - do:
      indices.create_data_stream:
        name: logs-browser.otel-default
  - do:
      indices.get_data_stream:
        name: logs-browser.otel-default
  - match: { data_streams.0.template: "logs-browser.otel@template" }
  - set: { data_streams.0.indices.0.index_name: backing_index }
  - do:
      indices.get_settings:
        index: $backing_index
  - match: { .$backing_index.settings.index.mode: logsdb }
  - match: { .$backing_index.settings.index.sort.field: ["resource.attributes.service.name", "attributes.session.id", "@timestamp"] }
  - match: { .$backing_index.settings.index.sort.order: ["asc", "asc", "desc"] }
  - do:
      field_caps:
        index: logs-browser.otel-default
        fields: ["resource.attributes.service.name", "attributes.session.id"]
  - match: { fields.resource\.attributes\.service\.name.keyword.type: keyword }
  - match: { fields.attributes\.session\.id.keyword.type: keyword }
  - do:
      bulk:
        index: logs-browser.otel-default
        refresh: true
        body:
          - create: {}
          - '{"@timestamp":"2026-01-01T00:00:00Z","resource":{"attributes":{"service.name":"app"}},"attributes":{"session.id":"session-1","http.response.body.size":42}}'
          - create: {}
          - '{"@timestamp":"2026-01-01T00:00:01Z","resource":{"attributes":{"service.name":"app"}},"attributes":{"session.id":"session-1","http.response.body.size":43}}'
          - create: {}
          - '{"@timestamp":"2026-01-01T00:00:02Z"}'
  - is_false: errors
  - do:
      search:
        index: logs-browser.otel-default
        body:
          query:
            term:
              attributes.session.id: session-1
          sort: [{ "@timestamp": desc }]
          fields: ["service.name", "session.id", "http.response.body.bytes"]
          aggs:
            sessions:
              composite:
                sources:
                  - service:
                      terms:
                        field: resource.attributes.service.name
                        order: asc
                  - session:
                      terms:
                        field: attributes.session.id
                        order: asc
  - match: { hits.total.value: 2 }
  - match: { hits.hits.0.fields.service\.name: ["app"] }
  - match: { hits.hits.0.fields.session\.id: ["session-1"] }
  - match: { hits.hits.0.fields.http\.response\.body\.bytes: [43] }
  - length: { aggregations.sessions.buckets: 1 }
  - match: { aggregations.sessions.buckets.0.key: { service: app, session: session-1 } }
  - match: { aggregations.sessions.buckets.0.doc_count: 2 }


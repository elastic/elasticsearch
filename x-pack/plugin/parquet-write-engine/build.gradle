tasks.withType(JavaCompile).configureEach {
  options.compilerArgs << '-Xlint:-classfile'
}

tasks.named("test").configure {
  // The local Parquet files are not Lucene files, and the store asserts that it knows the extension of every file that it opens.
  systemProperty 'es.allow_unknown_lucene_file_extensions', 'true'
  // Needed for Arrow's direct memory access, which the Parquet reader plugin uses (same as esql-datasource-parquet)
  jvmArgs('--add-opens=java.base/java.nio=ALL-UNNAMED')
}

tasks.named("internalClusterTest").configure {
  systemProperty 'es.allow_unknown_lucene_file_extensions', 'true'
  jvmArgs('--add-opens=java.base/java.nio=ALL-UNNAMED')
  // Local file:// access is on by default in snapshot builds; in release builds the local flag is off unless it is enabled here.
  systemProperty 'es.esql_external_datasources_local_feature_flag_enabled', 'true'
  // Data sources require the project encryption key feature (the ES|QL plugin fails fast otherwise).
  systemProperty 'es.project_encryption_key_feature_flag_enabled', 'true'
}

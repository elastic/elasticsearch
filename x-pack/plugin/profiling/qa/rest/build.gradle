apply plugin: 'elasticsearch.internal-yaml-rest-test'

restResources {
  restApi {
    include '_common', 'bulk', 'cluster', 'indices', 'search', 'profiling'
  }
  restTests {
    // The profiling/*.yml sources live in the aggregate :x-pack:plugin module; pull them in
    // here so they run in this dedicated suite instead of the monolithic XPackRestIT.
    includeXpack 'profiling'
  }
}

tasks.named('yamlRestTest') {
  usesDefaultDistribution("profiling yaml rest tests require the default distribution")
}

---
version: ${xpack.prometheus.template.version}
_meta:
  description: Default mappings for the Prometheus metric exemplars index template installed by x-pack
  managed: true
template:
  mappings:
    properties:
      data_stream.type:
        type: constant_keyword
        value: exemplars
      value:
        type: double
      labels:
        type: passthrough
        priority: 10
        time_series_dimension: true
        properties:
          __name__:
            type: keyword
      metric_name:
        type: alias
        path: labels.__name__
      exemplar_labels:
        type: passthrough
        priority: 30

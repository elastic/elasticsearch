---
version: ${xpack.prometheus.template.version}
_meta:
  description: Default mappings for Prometheus metrics index template installed by x-pack
  managed: true
template:
  mappings:
    properties:
      data_stream.type:
        type: constant_keyword
        value: metrics
      # Similar to the OTel mappings, Prometheus metrics also get a passthrough namespace for metrics.
      # This ensures that dots in field names are no issues (metrics.foo and metrics.foo.bar can both be ingested)
      metrics:
        type: passthrough
        priority: 20
    dynamic_templates:
      - counter:
          path_match: [ "metrics.*_sum", "metrics.*_count", "metrics.*_total", "metrics.*_bucket" ]
          mapping:
            type: double
            time_series_metric: counter
      - gauge:
          path_match: [ "metrics.*" ]
          mapping:
            type: double
            time_series_metric: gauge

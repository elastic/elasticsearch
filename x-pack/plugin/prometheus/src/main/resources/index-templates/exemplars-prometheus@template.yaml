---
version: ${xpack.prometheus.template.version}
index_patterns: ["exemplars-*.prometheus-*"]
priority: 140
data_stream: {}
allow_auto_create: true
_meta:
  description: Default Prometheus metric exemplars template installed by x-pack
  managed: true
# Exemplar data streams reuse the metrics mappings so that their time series dimensions
# match the corresponding metrics data stream. The additional metric_name dimension identifies the
# metric associated with the value field.
composed_of:
  - exemplars@settings
  - labels-prometheus@mappings
  - prometheus@settings
  - exemplars-prometheus@mappings
  - exemplars@custom
  - exemplars-prometheus@custom
ignore_missing_component_templates:
  - exemplars@custom
  - exemplars-prometheus@custom
template:
  settings:
    index:
      mode: time_series

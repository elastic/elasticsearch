apply plugin: 'elasticsearch.internal-es-plugin'
apply plugin: 'elasticsearch.internal-cluster-test'
apply plugin: 'elasticsearch.internal-yaml-rest-test'

esplugin {
  name = 'rank-vectors'
  description = 'Rank vectors in search.'
  classname = 'org.elasticsearch.xpack.rank.vectors.RankVectorsPlugin'
  extendedPlugins = ['x-pack-core', 'lang-painless']
}

dependencies {
  compileOnly project(path: xpackModule('core'))
  compileOnly(project(':modules:lang-painless:spi'))
  compileOnly project(':libs:simdvec')

  testImplementation(testArtifact(project(xpackModule('core'))))
  testImplementation(testArtifact(project(':server')))
  testImplementation project(':x-pack:plugin:diskbbq')
  internalClusterTestImplementation project(':modules:rest-root')
  clusterModules project(':x-pack:plugin:diskbbq')
}

restResources {
  restApi {
    include '_common', 'cluster', 'indices', 'index', 'get', 'search', 'rank_vectors_eval', 'tasks'
  }
}

testClusters.configureEach {
  setting 'xpack.license.self_generated.type', 'trial'
}

apply plugin: 'elasticsearch.build'
apply plugin: 'com.gradleup.shadow'

base {
  archivesName = 'elasticsearch-security-cli-bc'
}

dependencies {
  compileOnly project(":server")
  implementation "org.bouncycastle:bcpkix-jdk18on:${versions.bouncycastle}"
  implementation "org.bouncycastle:bcprov-jdk18on:${versions.bouncycastle}"
  implementation "org.bouncycastle:bcutil-jdk18on:${versions.bouncycastle}"
}

tasks.named("dependencyLicenses").configure {
  mapping from: /bc.*/, to: 'bouncycastle'
}

tasks.named("shadowJar").configure {
  relocate 'org.bouncycastle', 'shadow.org.bouncycastle'
}

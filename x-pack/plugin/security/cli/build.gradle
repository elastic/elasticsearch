import org.elasticsearch.gradle.internal.precommit.CheckForbiddenApisTask

apply plugin: 'elasticsearch.build'

base {
  archivesName = 'elasticsearch-security-cli'
}

configurations {
  // The Bouncy Castle FIPS provider jar that FIPS deployments add to lib/, which ShadedBouncyCastleTests puts on the parent class
  // loader of the tool. Not part of any compile or runtime class path. Same version as in elasticsearch.fips.gradle.
  bcFipsJar
}

dependencies {
  compileOnly project(":server")
  compileOnly project(path: xpackModule('core'))
  implementation project(path: "bc", configuration: 'shadow')
  testImplementation("com.google.jimfs:jimfs:${versions.jimfs}") {
    // this is provided by the runtime classpath, from the security project
    exclude group: "com.google.guava", module: "guava"
  }
  testRuntimeOnly "com.google.guava:guava:${versions.jimfs_guava}"
  testImplementation project(":test:framework")
  testImplementation(testArtifact(project(xpackModule('core'))))

  testImplementation "org.bouncycastle:bcpkix-jdk18on:${versions.bouncycastle}"
  testImplementation "org.bouncycastle:bcprov-jdk18on:${versions.bouncycastle}"
  testImplementation "org.bouncycastle:bcutil-jdk18on:${versions.bouncycastle}"

  bcFipsJar 'org.bouncycastle:bc-fips:2.0.2'
}

tasks.named("forbiddenPatterns").configure {
  exclude '**/*.p12'
  exclude '**/*.jks'
}

tasks.named("test").configure {
  environment 'HOSTNAME', 'dummy.test.hostname' // some tests rely on this being set, which it always is for the code running in main
  inputs.files(configurations.bcFipsJar).withNormalizer(ClasspathNormalizer)
  nonInputProperties.systemProperty 'tests.bcfips.jar', "${-> configurations.bcFipsJar.singleFile}"
}

if (buildParams.inFipsJvm) {
  tasks.named("test").configure {
    enabled = false
  }
  tasks.named("jarHell").configure {
    enabled = false
  }
  // Forbiden APIs non-portable checks fail because bouncy castle classes being used from the FIPS JDK since those are
  // not part of the Java specification - all of this is as designed, so we have to relax this check for FIPS.
  tasks.withType(CheckForbiddenApisTask).configureEach {
    configureBundledSignaturesFromDefaults {
      remove 'jdk-non-portable'
    }
  }
}

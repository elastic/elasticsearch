import org.elasticsearch.gradle.testclusters.StandaloneRestIntegTestTask

dependencies {
  javaRestTestImplementation project(':x-pack:plugin:core')
  javaRestTestImplementation(testArtifact(project(xpackModule('core'))))
}

// The tests read the `tests.ssl.enabled` system property to determine whether the
// cluster (and the clients connecting to it) should be configured with SSL, so the
// same test classes run once against a plain cluster and once against an SSL-enabled
// cluster (see SqlSecurityTestCluster).
tasks.named("javaRestTest").configure {
  usesDefaultDistribution("SQL Security tests require security module")
  systemProperty 'tests.ssl.enabled', 'false'
}

tasks.register("javaRestTestWithSsl", StandaloneRestIntegTestTask) {
  usesDefaultDistribution("SQL Security tests require security module")
  testClassesDirs = sourceSets.javaRestTest.output.classesDirs
  classpath = sourceSets.javaRestTest.runtimeClasspath
  systemProperty 'tests.ssl.enabled', 'true'
  // Do not attempt to form a cluster in a FIPS JVM, as doing so with a JKS keystore will fail.
  // TODO Revisit this when SQL CLI client can handle key/certificate instead of only Keystores.
  // https://github.com/elastic/elasticsearch/issues/32306
  buildParams.withFipsEnabledOnly(it)
}

tasks.named('check').configure {
  dependsOn 'javaRestTestWithSsl'
}

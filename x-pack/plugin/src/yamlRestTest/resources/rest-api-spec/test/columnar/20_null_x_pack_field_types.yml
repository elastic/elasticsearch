setup:
  - requires:
      test_runner_features: [ capabilities ]
      capabilities:
        - method: PUT
          path: /{index}
          capabilities: [ columnar_index_modes ]
      cluster_features: [ "mapper.columnar.bare_null_is_absence" ]
      reason: "columnar index mode and bare null handling required"

  - do:
      indices.create:
        index: test
        body:
          settings:
            index.mode: columnar
            index.number_of_shards: 1
            index.mapping.source.mode: synthetic
          mappings:
            properties:
              ulg:
                type: unsigned_long
              wld:
                type: wildcard
              ver:
                type: version

  - do:
      bulk:
        index: test
        refresh: true
        body:
          - '{ "index": { "_id": "value" } }'
          - '{ "ulg": 1, "wld": "a", "ver": "1.0.0" }'
          - '{ "index": { "_id": "null_in_array" } }'
          - '{ "ulg": [null], "wld": [null], "ver": [null] }'
          - '{ "index": { "_id": "only_nulls" } }'
          - '{ "ulg": [null, null], "wld": [null, null], "ver": [null, null] }'
          - '{ "index": { "_id": "mixed" } }'
          - '{ "ulg": [1, null, 2], "wld": ["a", null, "b"], "ver": ["1.0.0", null, "2.0.0"] }'
          - '{ "index": { "_id": "bare_null" } }'
          - '{ "ulg": null, "wld": null, "ver": null }'
          - '{ "index": { "_id": "empty_array" } }'
          - '{ "ulg": [], "wld": [], "ver": [] }'
          - '{ "index": { "_id": "missing" } }'
          - '{ "other": "c" }'
          - '{ "index": { "_id": "leading_null" } }'
          - '{ "ulg": [null, 1], "wld": [null, "a"], "ver": [null, "1.0.0"] }'
          - '{ "index": { "_id": "trailing_null" } }'
          - '{ "ulg": [1, null], "wld": ["a", null], "ver": ["1.0.0", null] }'
          - '{ "index": { "_id": "both_ends_null" } }'
          - '{ "ulg": [null, 1, null], "wld": [null, "a", null], "ver": [null, "1.0.0", null] }'

---
exists matches only documents with a non-null value on an unsigned_long field:
  - do:
      search:
        index: test
        body:
          query: { exists: { field: ulg } }
          sort: [ _doc ]
          track_total_hits: true
          _source: false

  - match: { hits.total.value: 5 }
  - length: { hits.hits: 5 }
  - match: { hits.hits.0._id: value }
  - match: { hits.hits.1._id: mixed }
  - match: { hits.hits.2._id: leading_null }
  - match: { hits.hits.3._id: trailing_null }
  - match: { hits.hits.4._id: both_ends_null }

  - do:
      count:
        index: test
        body:
          query: { exists: { field: ulg } }

  - match: { count: 5 }

  - do:
      count:
        index: test
        body:
          query: { bool: { must_not: { exists: { field: ulg } } } }

  - match: { count: 5 }

---
exists matches only documents with a non-null value on a wildcard field:
  - skip:
      awaits_fix: "https://github.com/elastic/elasticsearch/issues/165909"
      reason: "string exists matches documents that hold only nulls (proposed contract)"

  - do:
      search:
        index: test
        body:
          query: { exists: { field: wld } }
          sort: [ _doc ]
          track_total_hits: true
          _source: false

  - match: { hits.total.value: 5 }
  - length: { hits.hits: 5 }
  - match: { hits.hits.0._id: value }
  - match: { hits.hits.1._id: mixed }
  - match: { hits.hits.2._id: leading_null }
  - match: { hits.hits.3._id: trailing_null }
  - match: { hits.hits.4._id: both_ends_null }

  - do:
      count:
        index: test
        body:
          query: { exists: { field: wld } }

  - match: { count: 5 }

  - do:
      count:
        index: test
        body:
          query: { bool: { must_not: { exists: { field: wld } } } }

  - match: { count: 5 }

---
exists matches only documents with a non-null value on a version field:
  - do:
      search:
        index: test
        body:
          query: { exists: { field: ver } }
          sort: [ _doc ]
          track_total_hits: true
          _source: false

  - match: { hits.total.value: 5 }
  - length: { hits.hits: 5 }
  - match: { hits.hits.0._id: value }
  - match: { hits.hits.1._id: mixed }
  - match: { hits.hits.2._id: leading_null }
  - match: { hits.hits.3._id: trailing_null }
  - match: { hits.hits.4._id: both_ends_null }

  - do:
      count:
        index: test
        body:
          query: { exists: { field: ver } }

  - match: { count: 5 }

  - do:
      count:
        index: test
        body:
          query: { bool: { must_not: { exists: { field: ver } } } }

  - match: { count: 5 }

---
value_count and missing aggregations treat documents with only nulls as having no value:
  - do:
      search:
        index: test
        body:
          size: 0
          aggs:
            values_ulg: { value_count: { field: ulg } }
            without_ulg: { missing: { field: ulg } }
            values_wld: { value_count: { field: wld } }
            without_wld: { missing: { field: wld } }
            values_ver: { value_count: { field: ver } }
            without_ver: { missing: { field: ver } }

  - match: { aggregations.values_ulg.value: 6 }
  - match: { aggregations.without_ulg.doc_count: 5 }
  - match: { aggregations.values_wld.value: 6 }
  - match: { aggregations.without_wld.doc_count: 5 }
  - match: { aggregations.values_ver.value: 6 }
  - match: { aggregations.without_ver.doc_count: 5 }

---
synthetic source drops the null elements of an unsigned_long field:
  - skip:
      awaits_fix: "https://github.com/elastic/elasticsearch/issues/165909"
      reason: "synthetic source keeps null array elements today, and the proposed rule drops them at indexing"

  - do:
      search:
        index: test
        body:
          query: { match_all: {} }
          sort: [ _doc ]
          _source: ulg

  - length: { hits.hits: 10 }
  - match: { hits.hits.0._source.ulg: 1 }
  - match: { hits.hits.1._source: {} }
  - match: { hits.hits.2._source: {} }
  - match: { hits.hits.3._source.ulg: [1, 2] }
  - match: { hits.hits.4._source: {} }
  - match: { hits.hits.5._source: {} }
  - match: { hits.hits.6._source: {} }
  - match: { hits.hits.7._source.ulg: 1 }
  - match: { hits.hits.8._source.ulg: 1 }
  - match: { hits.hits.9._source.ulg: 1 }

---
synthetic source drops the null elements of a wildcard field:
  - skip:
      awaits_fix: "https://github.com/elastic/elasticsearch/issues/165909"
      reason: "synthetic source keeps null array elements today, and the proposed rule drops them at indexing"

  - do:
      search:
        index: test
        body:
          query: { match_all: {} }
          sort: [ _doc ]
          _source: wld

  - length: { hits.hits: 10 }
  - match: { hits.hits.0._source.wld: "a" }
  - match: { hits.hits.1._source: {} }
  - match: { hits.hits.2._source: {} }
  - match: { hits.hits.3._source.wld: ["a", "b"] }
  - match: { hits.hits.4._source: {} }
  - match: { hits.hits.5._source: {} }
  - match: { hits.hits.6._source: {} }
  - match: { hits.hits.7._source.wld: "a" }
  - match: { hits.hits.8._source.wld: "a" }
  - match: { hits.hits.9._source.wld: "a" }

---
synthetic source drops the null elements of a version field:
  - do:
      search:
        index: test
        body:
          query: { match_all: {} }
          sort: [ _doc ]
          _source: ver

  - length: { hits.hits: 10 }
  - match: { hits.hits.0._source.ver: "1.0.0" }
  - match: { hits.hits.1._source: {} }
  - match: { hits.hits.2._source: {} }
  - match: { hits.hits.3._source.ver: ["1.0.0", "2.0.0"] }
  - match: { hits.hits.4._source: {} }
  - match: { hits.hits.5._source: {} }
  - match: { hits.hits.6._source: {} }
  - match: { hits.hits.7._source.ver: "1.0.0" }
  - match: { hits.hits.8._source.ver: "1.0.0" }
  - match: { hits.hits.9._source.ver: "1.0.0" }

---
every document of the bulk requests is indexed:
  - do:
      search:
        index: test
        body:
          size: 0
          track_total_hits: true

  - match: { hits.total.value: 10 }

setup:
  - requires:
      test_runner_features: [ capabilities ]
      capabilities:
        - method: PUT
          path: /{index}
          capabilities: [ columnar_index_modes ]
      reason: "columnar index modes are required"

---
"index creation rejects enabled false on the root object":
  - do:
      catch: bad_request
      indices.create:
        index: test_root_disabled
        body:
          settings:
            index.mode: columnar
          mappings:
            enabled: false
  - match: { error.root_cause.0.type: mapper_parsing_exception }
  - match: { error.root_cause.0.reason: "/\\[enabled\\]\\scannot\\sbe\\sset\\sto\\s\\[false\\]\\son\\sthe\\sroot\\sobject.*/" }

  - do:
      indices.exists:
        index: test_root_disabled
  - is_false: ''

---
"index creation accepts the root object when enabled is not false":
  - do:
      indices.create:
        index: test_root_enabled
        body:
          settings:
            index.mode: columnar
          mappings:
            properties:
              host.name:
                type: keyword

  - do:
      indices.exists:
        index: test_root_enabled
  - is_true: ''

---
"composable index template rejects enabled false on the root object":
  - do:
      catch: bad_request
      indices.put_index_template:
        name: test_root_disabled_template
        body:
          index_patterns: [ "test_root_disabled_template_*" ]
          template:
            settings:
              index.mode: columnar
            mappings:
              enabled: false
  - match: { error.caused_by.caused_by.type: mapper_parsing_exception }
  - match: { error.caused_by.caused_by.reason: "/\\[enabled\\]\\scannot\\sbe\\sset\\sto\\s\\[false\\]\\son\\sthe\\sroot\\sobject.*/" }

  - do:
      catch: missing
      indices.get_index_template:
        name: test_root_disabled_template

---
"composable index template composed from a component template rejects enabled false on the root object":
  # The component template has no index.mode of its own, so it is accepted on its own. The mapping is only
  # rejected once it is composed into an index template that resolves to a columnar index mode.
  - do:
      cluster.put_component_template:
        name: test_root_disabled_component
        body:
          template:
            mappings:
              enabled: false

  - do:
      catch: bad_request
      indices.put_index_template:
        name: test_root_disabled_composed_template
        body:
          index_patterns: [ "test_root_disabled_composed_*" ]
          composed_of: [ test_root_disabled_component ]
          template:
            settings:
              index.mode: columnar
  - match: { error.caused_by.caused_by.type: mapper_parsing_exception }
  - match: { error.caused_by.caused_by.reason: "/\\[enabled\\]\\scannot\\sbe\\sset\\sto\\s\\[false\\]\\son\\sthe\\sroot\\sobject.*/" }

  - do:
      cluster.delete_component_template:
        name: test_root_disabled_component

setup:
  - requires:
      test_runner_features: [ capabilities, contains ]
      capabilities:
        - method: PUT
          path: /{index}
          capabilities: [ columnar_index_modes ]
      cluster_features: [ "mapper.columnar.bare_null_is_absence" ]
      reason: "columnar index modes and bare null handling required"

  - do:
      indices.create:
        index: test_vectordb_columnar_row
        body:
          settings:
            index.mode: vectordb_columnar
            index.number_of_shards: 1
            index.mapping.source.mode: synthetic
            index.batch_indexing: false
          mappings:
            properties:
              '@timestamp':
                type: date
              text:
                type: text

  - do:
      bulk:
        index: test_vectordb_columnar_row
        refresh: true
        body:
          - '{ "index": { "_id": "value" } }'
          - '{"@timestamp": "2026-01-01T00:00:01.000Z", "text": "a"}'
          - '{ "index": { "_id": "null_in_array" } }'
          - '{"@timestamp": "2026-01-01T00:00:02.000Z", "text": [null]}'
          - '{ "index": { "_id": "only_nulls" } }'
          - '{"@timestamp": "2026-01-01T00:00:03.000Z", "text": [null, null]}'
          - '{ "index": { "_id": "mixed" } }'
          - '{"@timestamp": "2026-01-01T00:00:04.000Z", "text": ["a", null, "b"]}'
          - '{ "index": { "_id": "bare_null" } }'
          - '{"@timestamp": "2026-01-01T00:00:05.000Z", "text": null}'
          - '{ "index": { "_id": "empty_array" } }'
          - '{"@timestamp": "2026-01-01T00:00:06.000Z", "text": []}'
          - '{ "index": { "_id": "missing" } }'
          - '{"@timestamp": "2026-01-01T00:00:07.000Z"}'
          - '{ "index": { "_id": "leading_null" } }'
          - '{"@timestamp": "2026-01-01T00:00:08.000Z", "text": [null, "a"]}'
          - '{ "index": { "_id": "trailing_null" } }'
          - '{"@timestamp": "2026-01-01T00:00:09.000Z", "text": ["a", null]}'
          - '{ "index": { "_id": "both_ends_null" } }'
          - '{"@timestamp": "2026-01-01T00:00:10.000Z", "text": [null, "a", null]}'

---
exists matches only documents with a non-null value on a text field in vectordb_columnar with row indexing:
  - skip:
      awaits_fix: "https://github.com/elastic/elasticsearch/issues/165909"
      reason: "exists matches a document that holds only nulls on this type (proposed contract in #165909)"

  - do:
      search:
        index: test_vectordb_columnar_row
        body:
          query: { exists: { field: text } }
          sort: [ { "@timestamp": asc } ]
          track_total_hits: true
          _source: false

  - match: { hits.total.value: 5 }
  - length: { hits.hits: 5 }
  - match: { hits.hits.0._id: value }
  - match: { hits.hits.1._id: mixed }
  - match: { hits.hits.2._id: leading_null }
  - match: { hits.hits.3._id: trailing_null }
  - match: { hits.hits.4._id: both_ends_null }

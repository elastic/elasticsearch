setup:
  - requires:
      test_runner_features: [ capabilities ]
      capabilities:
        - method: PUT
          path: /{index}
          capabilities: [ columnar_index_modes ]
      cluster_features: [ "mapper.columnar.bare_null_is_absence" ]
      reason: "columnar index modes and bare null handling required"

  - do:
      indices.create:
        index: test_columnar
        body:
          settings:
            index.mode: columnar
            index.number_of_shards: 1
            index.mapping.source.mode: synthetic
          mappings:
            properties:
              '@timestamp':
                type: date
              f:
                type: flattened
              dv:
                type: dense_vector
                dims: 3
              sv:
                type: sparse_vector
              ck:
                type: constant_keyword
                value: a

  - do:
      bulk:
        index: test_columnar
        refresh: true
        body:
          - '{ "index": { "_id": "value" } }'
          - '{"@timestamp": "2026-01-01T00:00:01.000Z", "f": {"k": "a"}}'
          - '{ "index": { "_id": "key_null" } }'
          - '{"@timestamp": "2026-01-01T00:00:02.000Z", "f": {"k": null}}'
          - '{ "index": { "_id": "key_array_null" } }'
          - '{"@timestamp": "2026-01-01T00:00:03.000Z", "f": {"k": [null]}}'
          - '{ "index": { "_id": "key_nulls" } }'
          - '{"@timestamp": "2026-01-01T00:00:04.000Z", "f": {"k": [null, null]}}'
          - '{ "index": { "_id": "key_mixed" } }'
          - '{"@timestamp": "2026-01-01T00:00:05.000Z", "f": {"k": ["a", null, "b"]}}'
          - '{ "index": { "_id": "key_leading_null" } }'
          - '{"@timestamp": "2026-01-01T00:00:06.000Z", "f": {"k": [null, "a"]}}'
          - '{ "index": { "_id": "nested_null" } }'
          - '{"@timestamp": "2026-01-01T00:00:07.000Z", "f": {"k": {"x": null}}}'
          - '{ "index": { "_id": "nested_mixed" } }'
          - '{"@timestamp": "2026-01-01T00:00:08.000Z", "f": {"k": {"x": ["a", null]}}}'
          - '{ "index": { "_id": "bare_null" } }'
          - '{"@timestamp": "2026-01-01T00:00:09.000Z", "f": null}'
          - '{ "index": { "_id": "empty_object" } }'
          - '{"@timestamp": "2026-01-01T00:00:10.000Z", "f": {}}'
          - '{ "index": { "_id": "missing" } }'
          - '{"@timestamp": "2026-01-01T00:00:11.000Z"}'
          - '{ "index": { "_id": "vectors" } }'
          - '{"@timestamp": "2026-01-01T00:00:12.000Z", "dv": [1.0, 2.0, 3.0], "sv": {"a": 1.0}, "ck": "a"}'

  - do:
      indices.create:
        index: test_logsdb_columnar
        body:
          settings:
            index.mode: logsdb_columnar
            index.number_of_shards: 1
            index.mapping.source.mode: synthetic
          mappings:
            properties:
              '@timestamp':
                type: date
              f:
                type: flattened
              dv:
                type: dense_vector
                dims: 3
              sv:
                type: sparse_vector
              ck:
                type: constant_keyword
                value: a

  - do:
      bulk:
        index: test_logsdb_columnar
        refresh: true
        body:
          - '{ "index": { "_id": "value" } }'
          - '{"@timestamp": "2026-01-01T00:00:01.000Z", "f": {"k": "a"}}'
          - '{ "index": { "_id": "key_null" } }'
          - '{"@timestamp": "2026-01-01T00:00:02.000Z", "f": {"k": null}}'
          - '{ "index": { "_id": "key_array_null" } }'
          - '{"@timestamp": "2026-01-01T00:00:03.000Z", "f": {"k": [null]}}'
          - '{ "index": { "_id": "key_nulls" } }'
          - '{"@timestamp": "2026-01-01T00:00:04.000Z", "f": {"k": [null, null]}}'
          - '{ "index": { "_id": "key_mixed" } }'
          - '{"@timestamp": "2026-01-01T00:00:05.000Z", "f": {"k": ["a", null, "b"]}}'
          - '{ "index": { "_id": "key_leading_null" } }'
          - '{"@timestamp": "2026-01-01T00:00:06.000Z", "f": {"k": [null, "a"]}}'
          - '{ "index": { "_id": "nested_null" } }'
          - '{"@timestamp": "2026-01-01T00:00:07.000Z", "f": {"k": {"x": null}}}'
          - '{ "index": { "_id": "nested_mixed" } }'
          - '{"@timestamp": "2026-01-01T00:00:08.000Z", "f": {"k": {"x": ["a", null]}}}'
          - '{ "index": { "_id": "bare_null" } }'
          - '{"@timestamp": "2026-01-01T00:00:09.000Z", "f": null}'
          - '{ "index": { "_id": "empty_object" } }'
          - '{"@timestamp": "2026-01-01T00:00:10.000Z", "f": {}}'
          - '{ "index": { "_id": "missing" } }'
          - '{"@timestamp": "2026-01-01T00:00:11.000Z"}'

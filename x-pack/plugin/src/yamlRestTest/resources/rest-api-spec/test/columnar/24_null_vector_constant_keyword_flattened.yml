          - '{"@timestamp": "2026-01-01T00:00:10.000Z", "f": {}}'
          - '{ "index": { "_id": "missing" } }'
          - '{"@timestamp": "2026-01-01T00:00:11.000Z"}'
          - '{ "index": { "_id": "vectors" } }'

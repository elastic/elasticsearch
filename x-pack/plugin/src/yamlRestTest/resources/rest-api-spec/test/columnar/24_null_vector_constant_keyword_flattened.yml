          - '{ "index": { "_id": "key_null" } }'
          - '{"@timestamp": "2026-01-01T00:00:02.000Z", "f": {"k": null}}'
          - '{ "index": { "_id": "key_array_null" } }'
          - '{"@timestamp": "2026-01-01T00:00:03.000Z", "f": {"k": [null]}}'
          - '{ "index": { "_id": "key_nulls" } }'
          - '{"@timestamp": "2026-01-01T00:00:04.000Z", "f": {"k": [null, null]}}'
          - '{ "index": { "_id": "key_mixed" } }'
          - '{"@timestamp": "2026-01-01T00:00:05.000Z", "f": {"k": ["a", null, "b"]}}'
          - '{ "index": { "_id": "key_leading_null" } }'
          - '{"@timestamp": "2026-01-01T00:00:06.000Z", "f": {"k": [null, "a"]}}'

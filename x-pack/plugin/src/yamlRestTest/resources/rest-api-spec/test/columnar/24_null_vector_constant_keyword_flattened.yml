---
exists matches only documents with a non-null value on a flattened field in every strict columnar mode:
  - skip:
      awaits_fix: "https://github.com/elastic/elasticsearch/issues/165909"
      reason: "exists on the flattened field matches documents whose keys hold only nulls (proposed contract in #165909)"

  - do:
      search:
        index: test_columnar
        body:
          query: { exists: { field: f } }
          sort: [ { "@timestamp": asc } ]
          size: 20
          track_total_hits: true
          _source: false

  - match: { hits.total.value: 4 }
  - length: { hits.hits: 4 }
  - match: { hits.hits.0._id: value }
  - match: { hits.hits.1._id: key_mixed }
  - match: { hits.hits.2._id: key_leading_null }
  - match: { hits.hits.3._id: nested_mixed }

  - do:
      search:
        index: test_logsdb_columnar
        body:
          query: { exists: { field: f } }
          sort: [ { "@timestamp": asc } ]
          size: 20
          track_total_hits: true
          _source: false

  - match: { hits.total.value: 4 }
  - length: { hits.hits: 4 }
  - match: { hits.hits.0._id: value }
  - match: { hits.hits.1._id: key_mixed }
  - match: { hits.hits.2._id: key_leading_null }
  - match: { hits.hits.3._id: nested_mixed }

  - do:
      search:
        index: test_vectordb_columnar
        body:
          query: { exists: { field: f } }
          sort: [ { "@timestamp": asc } ]
          size: 20
          track_total_hits: true
          _source: false

  - match: { hits.total.value: 4 }
  - length: { hits.hits: 4 }
  - match: { hits.hits.0._id: value }
  - match: { hits.hits.1._id: key_mixed }
  - match: { hits.hits.2._id: key_leading_null }
  - match: { hits.hits.3._id: nested_mixed }


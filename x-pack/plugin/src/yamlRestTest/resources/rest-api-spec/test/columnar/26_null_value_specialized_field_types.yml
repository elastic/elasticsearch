setup:
  - requires:
      test_runner_features: [ capabilities, contains ]
      capabilities:
        - method: PUT
          path: /{index}
          capabilities: [ columnar_index_modes ]
      cluster_features: [ "mapper.columnar.bare_null_is_absence" ]
      reason: "columnar index modes and bare null handling required"

  - do:
      indices.create:
        index: test_columnar
        body:
          settings:
            index.mode: columnar
            index.number_of_shards: 1
            index.mapping.source.mode: synthetic
          mappings:
            properties:
              '@timestamp':
                type: date
              scaled_float:
                type: scaled_float
                scaling_factor: 100
                null_value: 9.5
              unsigned_long:
                type: unsigned_long
                null_value: 9

  - do:
      bulk:
        index: test_columnar
        refresh: true
        body:
          - '{ "index": { "_id": "value" } }'
          - '{"@timestamp": "2026-01-01T00:00:01.000Z", "scaled_float": 1.5, "unsigned_long": 1}'
          - '{ "index": { "_id": "bare_null" } }'
          - '{"@timestamp": "2026-01-01T00:00:02.000Z", "scaled_float": null, "unsigned_long": null}'
          - '{ "index": { "_id": "null_in_array" } }'
          - '{"@timestamp": "2026-01-01T00:00:03.000Z", "scaled_float": [null], "unsigned_long": [null]}'
          - '{ "index": { "_id": "value_then_null" } }'
          - '{"@timestamp": "2026-01-01T00:00:04.000Z", "scaled_float": [1.5, null], "unsigned_long": [1, null]}'
          - '{ "index": { "_id": "null_then_value" } }'
          - '{"@timestamp": "2026-01-01T00:00:05.000Z", "scaled_float": [null, 1.5], "unsigned_long": [null, 1]}'

  - do:
      indices.create:
        index: test_logsdb_columnar
        body:
          settings:
            index.mode: logsdb_columnar
            index.number_of_shards: 1
            index.mapping.source.mode: synthetic
          mappings:
            properties:
              '@timestamp':
                type: date
              scaled_float:
                type: scaled_float
                scaling_factor: 100
                null_value: 9.5
              unsigned_long:
                type: unsigned_long
                null_value: 9

  - do:
      bulk:
        index: test_logsdb_columnar
        refresh: true
        body:
          - '{ "index": { "_id": "value" } }'
          - '{"@timestamp": "2026-01-01T00:00:01.000Z", "scaled_float": 1.5, "unsigned_long": 1}'
          - '{ "index": { "_id": "bare_null" } }'
          - '{"@timestamp": "2026-01-01T00:00:02.000Z", "scaled_float": null, "unsigned_long": null}'
          - '{ "index": { "_id": "null_in_array" } }'
          - '{"@timestamp": "2026-01-01T00:00:03.000Z", "scaled_float": [null], "unsigned_long": [null]}'
          - '{ "index": { "_id": "value_then_null" } }'
          - '{"@timestamp": "2026-01-01T00:00:04.000Z", "scaled_float": [1.5, null], "unsigned_long": [1, null]}'
          - '{ "index": { "_id": "null_then_value" } }'
          - '{"@timestamp": "2026-01-01T00:00:05.000Z", "scaled_float": [null, 1.5], "unsigned_long": [null, 1]}'

  - do:
      indices.create:
        index: test_vectordb_columnar
        body:
          settings:
            index.mode: vectordb_columnar
            index.number_of_shards: 1
            index.mapping.source.mode: synthetic
          mappings:
            properties:
              '@timestamp':
                type: date
              scaled_float:
                type: scaled_float
                scaling_factor: 100
                null_value: 9.5
              unsigned_long:
                type: unsigned_long
                null_value: 9

  - do:
      bulk:
        index: test_vectordb_columnar
        refresh: true
        body:
          - '{ "index": { "_id": "value" } }'
          - '{"@timestamp": "2026-01-01T00:00:01.000Z", "scaled_float": 1.5, "unsigned_long": 1}'
          - '{ "index": { "_id": "bare_null" } }'
          - '{"@timestamp": "2026-01-01T00:00:02.000Z", "scaled_float": null, "unsigned_long": null}'
          - '{ "index": { "_id": "null_in_array" } }'
          - '{"@timestamp": "2026-01-01T00:00:03.000Z", "scaled_float": [null], "unsigned_long": [null]}'
          - '{ "index": { "_id": "value_then_null" } }'
          - '{"@timestamp": "2026-01-01T00:00:04.000Z", "scaled_float": [1.5, null], "unsigned_long": [1, null]}'
          - '{ "index": { "_id": "null_then_value" } }'
          - '{"@timestamp": "2026-01-01T00:00:05.000Z", "scaled_float": [null, 1.5], "unsigned_long": [null, 1]}'

  - do:
      indices.create:
        index: test_columnar_stored
        body:
          settings:
            index.mode: columnar
            index.number_of_shards: 1
            index.mapping.source.mode: columnar_stored
          mappings:
            properties:
              '@timestamp':
                type: date
              scaled_float:
                type: scaled_float
                scaling_factor: 100
                null_value: 9.5
              unsigned_long:
                type: unsigned_long
                null_value: 9

  - do:
      bulk:
        index: test_columnar_stored
        refresh: true
        body:
          - '{ "index": { "_id": "value" } }'
          - '{"@timestamp": "2026-01-01T00:00:01.000Z", "scaled_float": 1.5, "unsigned_long": 1}'
          - '{ "index": { "_id": "bare_null" } }'
          - '{"@timestamp": "2026-01-01T00:00:02.000Z", "scaled_float": null, "unsigned_long": null}'
          - '{ "index": { "_id": "null_in_array" } }'
          - '{"@timestamp": "2026-01-01T00:00:03.000Z", "scaled_float": [null], "unsigned_long": [null]}'
          - '{ "index": { "_id": "value_then_null" } }'
          - '{"@timestamp": "2026-01-01T00:00:04.000Z", "scaled_float": [1.5, null], "unsigned_long": [1, null]}'
          - '{ "index": { "_id": "null_then_value" } }'
          - '{"@timestamp": "2026-01-01T00:00:05.000Z", "scaled_float": [null, 1.5], "unsigned_long": [null, 1]}'

---
exists matches a document whose null is replaced by null_value on a scaled_float field in every strict columnar mode:
  - do:
      search:
        index: test_columnar
        body:
          query: { exists: { field: scaled_float } }
          sort: [ { "@timestamp": asc } ]
          size: 20
          track_total_hits: true
          _source: false

  - match: { hits.total.value: 5 }
  - length: { hits.hits: 5 }
  - match: { hits.hits.0._id: value }
  - match: { hits.hits.1._id: bare_null }
  - match: { hits.hits.2._id: null_in_array }
  - match: { hits.hits.3._id: value_then_null }
  - match: { hits.hits.4._id: null_then_value }

  - do:
      search:
        index: test_logsdb_columnar

              '@timestamp':
                type: date
              keyword:
                type: keyword
              text:
                type: text
              wildcard:
                type: wildcard
              ip:
                type: ip
              boolean:
                type: boolean
              byte:
                type: byte
              short:
                type: short
              integer:
                type: integer
              long:
                type: long
              half_float:
                type: half_float
              float:
                type: float
              double:
                type: double
              date:
                type: date
              date_nanos:
                type: date_nanos

  - do:
      bulk:
        index: test_columnar
        refresh: true
        body:
          - '{ "index": { "_id": "unsorted_duplicates_with_nulls" } }'

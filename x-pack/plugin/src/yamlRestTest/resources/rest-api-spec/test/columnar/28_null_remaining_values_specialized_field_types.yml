---
every document of the bulk requests is indexed:
  - do:
      search:
        index: test_columnar
        body:
          size: 0
          track_total_hits: true

  - match: { hits.total.value: 1 }

  - do:
      search:
        index: test_logsdb_columnar
        body:
          size: 0
          track_total_hits: true

  - match: { hits.total.value: 1 }

  - do:
      search:
        index: test_vectordb_columnar
        body:
          size: 0

setup:
  - requires:
      test_runner_features: [ capabilities ]
      capabilities:
        - method: PUT
          path: /{index}
          capabilities: [ columnar_index_modes ]
      cluster_features: [ "mapper.columnar.bare_null_is_absence" ]
      reason: "columnar index mode and bare null handling required"

  - do:
      indices.create:
        index: synthetic_source
        body:
          settings:
            index.mode: columnar
            index.number_of_shards: 1
            index.mapping.source.mode: synthetic
          mappings:
            properties:
              wd:
                type: wildcard
              ver:
                type: version
              ul:
                type: unsigned_long
              pt:
                type: pattern_text
              other:
                type: keyword

  - do:
      indices.create:
        index: stored_source
        body:
          settings:
            index.mode: columnar
            index.number_of_shards: 1
            index.mapping.source.mode: columnar_stored
          mappings:
            properties:
              wd:
                type: wildcard
              ver:
                type: version
              ul:
                type: unsigned_long
              pt:
                type: pattern_text
              other:
                type: keyword

  - do:
      bulk:
        index: synthetic_source
        refresh: true
        body:
          - '{ "index": { "_id": "value" } }'
          - '{"wd": "a", "ver": "1.0.0", "ul": 1, "pt": "a"}'
          - '{ "index": { "_id": "null_in_array" } }'
          - '{"wd": [null], "ver": [null], "ul": [null], "pt": [null]}'
          - '{ "index": { "_id": "only_nulls" } }'
          - '{"wd": [null, null], "ver": [null, null], "ul": [null, null]}'
          - '{ "index": { "_id": "mixed" } }'
          - '{"wd": ["a", null, "b"], "ver": ["1.0.0", null, "2.0.0"], "ul": [1, null, 2]}'
          - '{ "index": { "_id": "bare_null" } }'
          - '{"wd": null, "ver": null, "ul": null, "pt": null}'
          - '{ "index": { "_id": "empty_array" } }'
          - '{"wd": [], "ver": [], "ul": [], "pt": []}'
          - '{ "index": { "_id": "missing" } }'
          - '{"other": "c"}'
          - '{ "index": { "_id": "leading_null" } }'
          - '{"wd": [null, "a"], "ver": [null, "1.0.0"], "ul": [null, 1], "pt": [null, "a"]}'
          - '{ "index": { "_id": "trailing_null" } }'
          - '{"wd": ["a", null], "ver": ["1.0.0", null], "ul": [1, null], "pt": ["a", null]}'
          - '{ "index": { "_id": "both_ends_null" } }'
          - '{"wd": [null, "a", null], "ver": [null, "1.0.0", null], "ul": [null, 1, null]}'

  - do:
      bulk:
        index: stored_source
        refresh: true
        body:
          - '{ "index": { "_id": "value" } }'
          - '{"wd": "a", "ver": "1.0.0", "ul": 1, "pt": "a"}'
          - '{ "index": { "_id": "null_in_array" } }'
          - '{"wd": [null], "ver": [null], "ul": [null], "pt": [null]}'
          - '{ "index": { "_id": "only_nulls" } }'
          - '{"wd": [null, null], "ver": [null, null], "ul": [null, null]}'
          - '{ "index": { "_id": "mixed" } }'
          - '{"wd": ["a", null, "b"], "ver": ["1.0.0", null, "2.0.0"], "ul": [1, null, 2]}'
          - '{ "index": { "_id": "bare_null" } }'
          - '{"wd": null, "ver": null, "ul": null, "pt": null}'
          - '{ "index": { "_id": "empty_array" } }'
          - '{"wd": [], "ver": [], "ul": [], "pt": []}'
          - '{ "index": { "_id": "missing" } }'
          - '{"other": "c"}'
          - '{ "index": { "_id": "leading_null" } }'
          - '{"wd": [null, "a"], "ver": [null, "1.0.0"], "ul": [null, 1], "pt": [null, "a"]}'
          - '{ "index": { "_id": "trailing_null" } }'
          - '{"wd": ["a", null], "ver": ["1.0.0", null], "ul": [1, null], "pt": ["a", null]}'
          - '{ "index": { "_id": "both_ends_null" } }'
          - '{"wd": [null, "a", null], "ver": [null, "1.0.0", null], "ul": [null, 1, null]}'

---
columnar_stored returns the same source as synthetic for wildcard, version, unsigned_long and pattern_text:
  - do:
      search:
        index: synthetic_source
        filter_path: hits.hits._source
        body:
          query: { match_all: {} }
          sort: [ _doc ]

  - length: { hits.hits: 10 }
  - set: { hits.hits: synthetic_sources }

  - do:
      search:
        index: stored_source
        filter_path: hits.hits._source
        body:
          query: { match_all: {} }
          sort: [ _doc ]

  - match: { hits.hits: $synthetic_sources }

---
columnar_stored drops the null elements of wildcard, version, unsigned_long and pattern_text:
  - skip:
      awaits_fix: "https://github.com/elastic/elasticsearch/issues/165909"
      reason: "columnar_stored keeps null array elements today"

  - do:
      search:
        index: stored_source
        filter_path: hits.hits._source
        body:
          query: { match_all: {} }
          sort: [ _doc ]

  - match:
      hits.hits:
        - _source: { wd: a, ver: "1.0.0", ul: 1, pt: a }
        - _source: {}
        - _source: {}
        - _source: { wd: [ a, b ], ver: [ "1.0.0", "2.0.0" ], ul: [ 1, 2 ] }
        - _source: {}
        - _source: {}
        - _source: { other: c }
        - _source: { wd: a, ver: "1.0.0", ul: 1, pt: a }
        - _source: { wd: a, ver: "1.0.0", ul: 1, pt: a }
        - _source: { wd: a, ver: "1.0.0", ul: 1 }

---
every document of the bulk requests is indexed:
  - do:
      search:
        index: synthetic_source
        body:
          size: 0
          track_total_hits: true

  - match: { hits.total.value: 10 }

  - do:
      search:
        index: stored_source
        body:
          size: 0
          track_total_hits: true

  - match: { hits.total.value: 10 }

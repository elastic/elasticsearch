---
# A type that ES|QL doesn't support is a type of a union that a cast doesn't convert: the cast is null in the indices that map it.
setup:
  - requires:
      capabilities:
        - method: POST
          path: /_query
          parameters: [ ]
          capabilities: [ lenient_cast ]
      reason: "fields with unsupported types in a union were unsupported"
      test_runner_features: [ capabilities, warnings_regex, contains ]
  - do:
      indices.create:
        index: lenient_long
        body:
          mappings:
            properties:
              value:
                type: long
  - do:
      indices.create:
        index: lenient_rank
        body:
          mappings:
            properties:
              value:
                type: rank_feature
  - do:
      bulk:
        refresh: true
        body:
          - { "index": { "_index": "lenient_long" } }
          - { "value": 5 }
          - { "index": { "_index": "lenient_rank" } }
          - { "value": 3 }

---
"cast of a union with an unsupported type":
  - do:
      warnings_regex:
        - "Field \\[value\\] of type \\[rank_feature\\] in \\[lenient_rank\\] cannot be converted to \\[KEYWORD\\] and will be null in those indices\\."
      esql.query:
        body:
          query: 'FROM lenient_long, lenient_rank METADATA _index | EVAL x = value::keyword | SORT _index | KEEP _index, x | LIMIT 10'
  - match: { columns: [ { name: _index, type: keyword }, { name: x, type: keyword } ] }
  - match: { values: [ [ "lenient_long", "5" ], [ "lenient_rank", null ] ] }

---
"a union with an unsupported type is unsupported without a cast":
  - do:
      catch: bad_request
      esql.query:
        body:
          query: 'FROM lenient_long, lenient_rank | EVAL x = value + 1 | LIMIT 10'
  - match: { status: 400 }
  - match: { error.type: verification_exception }
  - contains: { error.reason: 'Cannot use field [value] with unsupported type [rank_feature]' }

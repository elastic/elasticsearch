---
setup:
  - requires:
      capabilities:
        - method: GET
          path: /_query/view
          capabilities: [view_index_abstraction]
      test_runner_features: capabilities
      reason: "ES|QL views introduced"

  - do:
      indices.create:
        index: test
        body:
          mappings:
            properties:
              content:
                type: keyword
              color:
                type: keyword
              animal:
                type: keyword
              id:
                type: integer
  - do:
      bulk:
        index: "test"
        refresh: true
        body:
          - { "index": { } }
          - { "content": "This is a brown fox", "color": "brown", "animal": "fox", "id": 1 }
          - { "index": { } }
          - { "content": "This is a brown dog", "color": "brown", "animal": "dog", "id": 2 }
          - { "index": { } }
          - { "content": "This dog is really white", "color": "white", "animal": "dog", "id": 3 }
          - { "index": { } }
          - { "content": "The dog is brown but this document is very very long", "color": "brown", "animal": "dog", "id": 4 }
          - { "index": { } }
          - { "content": "There is also a white cat", "color": "white", "animal": "cat", "id": 5 }
          - { "index": { } }
          - { "content": "The quick brown fox jumps over the lazy dog", "color": "brown", "animal": "dog", "id": 6 }

---
"query-view-with-metadata-index":
  - requires:
      capabilities:
        - method: POST
          path: /_query
          capabilities: [views_metadata_behavior_changes]
      test_runner_features: capabilities
      reason: "METADATA _index on a view returns the view name"

  - do:
      esql.put_view:
        name: dogs
        body:
          query: 'FROM test | WHERE animal == "dog"'

  - do:
      esql.query:
        body:
          query: 'FROM dogs METADATA _index | STATS count = COUNT() BY _index | LIMIT 10'

  - match: { columns.0.name: "count" }
  - match: { columns.1.name: "_index" }
  - length: { values: 1 }
  - match: { values.0: [4, "dogs"] }

---
"query-view-and-index-with-metadata-index":
  - requires:
      capabilities:
        - method: POST
          path: /_query
          capabilities: [views_metadata_behavior_changes]
      test_runner_features: capabilities
      reason: "METADATA _index on a view returns the view name"

  - do:
      esql.put_view:
        name: dogs
        body:
          query: 'FROM test | WHERE animal == "dog"'

  - do:
      esql.query:
        body:
          query: 'FROM test, dogs METADATA _index | STATS count = COUNT() BY _index | SORT _index | LIMIT 10'

  - match: { columns.0.name: "count" }
  - match: { columns.1.name: "_index" }
  - length: { values: 2 }
  - match: { values.0: [4, "dogs"] }
  - match: { values.1: [6, "test"] }

---
"query-nested-view-with-metadata-index":
  - requires:
      capabilities:
        - method: POST
          path: /_query
          capabilities: [views_metadata_behavior_changes]
      test_runner_features: capabilities
      reason: "METADATA _index on nested views returns the outermost view name"

  - do:
      esql.put_view:
        name: dogs
        body:
          query: 'FROM test | WHERE animal == "dog"'

  - do:
      esql.put_view:
        name: brown_dogs
        body:
          query: 'FROM dogs | WHERE color == "brown"'

  - do:
      esql.query:
        body:
          query: 'FROM brown_dogs METADATA _index | STATS count = COUNT() BY _index | LIMIT 10'

  - match: { columns.0.name: "count" }
  - match: { columns.1.name: "_index" }
  - length: { values: 1 }
  - match: { values.0: [3, "brown_dogs"] }

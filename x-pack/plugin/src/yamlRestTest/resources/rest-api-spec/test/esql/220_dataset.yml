---
setup:
  - requires:
      capabilities:
        - method: GET
          path: /_query/dataset
          capabilities: [data_sources]
      test_runner_features: capabilities
      reason: "ES|QL dataset CRUD API"

---
teardown:
  # Safety-net cleanup for the dataset-region-accepted test. Uses ignore: 404 because the
  # resources are only created by that one test; every other test case in this file leaves
  # them absent, so the deletes are no-ops there.
  - do:
      esql.delete_dataset:
        name: events_eu
        ignore: 404
  - do:
      esql.delete_data_source:
        name: ds_for_region_test
        ignore: 404

---
"get-empty":
  - do:
      esql.get_dataset: { }

  - match: { datasets: [] }

---
"invalid-dataset-names":
  # Name must be lowercase.
  - do:
      catch: /invalid dataset name/
      esql.put_dataset:
        name: "MyDataset"
        body:
          data_source: parent
          resource: "s3://x/"

  # Name must not contain invalid characters.
  - do:
      catch: /invalid dataset name/
      esql.put_dataset:
        name: "bad#name"
        body:
          data_source: parent
          resource: "s3://x/"

  # Whitespace-only name — validate() short-circuits with "name is missing" before the
  # invalid-char / lowercase checks, so the assertion differs.
  - do:
      catch: /dataset name is missing/
      esql.put_dataset:
        name: " "
        body:
          data_source: parent
          resource: "s3://x/"

  # Leading underscore is reserved for dot-indices / hidden names.
  - do:
      catch: /invalid dataset name/
      esql.put_dataset:
        name: "_leading"
        body:
          data_source: parent
          resource: "s3://x/"

---
"missing-data-source":
  - do:
      catch: /Required \[data_source\]/
      esql.put_dataset:
        name: ds
        body:
          resource: "s3://x/"
          settings: { }

---
"missing-resource":
  - do:
      catch: /Required \[resource\]/
      esql.put_dataset:
        name: ds
        body:
          data_source: parent

---
"parent-data-source-not-found":
  # Data-source-side PUT requires a loaded validator plugin, so we can't create a parent here.
  # This exercises the dispatch-time parent lookup failure: dataset PUT with a non-existent parent
  # surfaces a 404 (ResourceNotFoundException) without reaching the validator dispatch path.
  - do:
      catch: missing
      esql.put_dataset:
        name: ds
        body:
          data_source: parent_does_not_exist
          resource: "s3://x/"
          settings: { }

---
"mappings-unknown-keys-rejected":
  # The declared-mapping vocabulary is strict: keys outside the deliberate index-mapping subset are
  # rejected at parse time (before any cluster interaction), naming the offending key.
  - requires:
      capabilities:
        - method: PUT
          path: /_query/dataset/{name}
          capabilities: [dataset_declared_schema]
      test_runner_features: capabilities
      reason: "declared mappings block on datasets"

  # Unknown mappings-level key (core mapping keys outside our subset are rejected too, e.g. runtime).
  - do:
      catch: /unknown mappings field \[runtime\]/
      esql.put_dataset:
        name: ds
        body:
          data_source: parent
          resource: "s3://x/*.csv"
          mappings:
            dynamic: "true"
            runtime: { }

  # _id supports only [path].
  - do:
      catch: /unknown \[_id\] field \[type\]; only \[path\] is supported/
      esql.put_dataset:
        name: ds
        body:
          data_source: parent
          resource: "s3://x/*.csv"
          mappings:
            _id: { type: keyword }

  # Field parameters outside {type, path, format} are rejected (index-mapping params we don't model).
  - do:
      catch: /\[analyzer\]/
      esql.put_dataset:
        name: ds
        body:
          data_source: parent
          resource: "s3://x/*.csv"
          mappings:
            properties:
              msg: { type: keyword, analyzer: standard }

  # Unknown dynamic value: only true/false (the read-applicable subset of the index-mapping enum).
  - do:
      catch: /unknown dynamic value \[strict\]/
      esql.put_dataset:
        name: ds
        body:
          data_source: parent
          resource: "s3://x/*.csv"
          mappings:
            dynamic: "strict"

---
"dataset-region-accepted":
  # region is an S3-specific dataset key. A dataset PUT with region in settings must return HTTP 200
  # — the historic rejection ("unknown setting [region]") must not recur.
  - requires:
      capabilities:
        - method: PUT
          path: /_query/dataset/{name}
          capabilities: [dataset_region]
      test_runner_features: capabilities
      reason: "region accepted on dataset PUT"

  - do:
      esql.put_data_source:
        name: ds_for_region_test
        body:
          type: s3
          settings:
            auth: anonymous

  - do:
      esql.put_dataset:
        name: events_eu
        body:
          data_source: ds_for_region_test
          resource: "s3://my-eu-bucket/events/*.parquet"
          settings:
            format: parquet
            region: eu-west-1

  - do:
      esql.get_dataset:
        name: events_eu

  - match: { datasets.0.settings.region: eu-west-1 }

  - do:
      esql.delete_dataset:
        name: events_eu
        ignore: 404

  - do:
      esql.delete_data_source:
        name: ds_for_region_test
        ignore: 404

---
"delete-missing":
  - do:
      catch: missing
      esql.delete_dataset:
        name: ghost

---
"get-missing":
  # Concrete-name miss -> 404. Wildcard miss -> 200 [].
  - do:
      catch: missing
      esql.get_dataset:
        name: ghost

  - do:
      esql.get_dataset:
        name: "no_match_*"

  - match: { datasets: [] }

---
"cluster-state-visibility":
  # DatasetMetadata.context() includes API, so datasets do appear under metadata.esql_dataset when
  # they exist. Deleting all datasets leaves metadata.esql_dataset present with an empty map, which
  # is harmless — datasets carry no credentials. We do NOT assert is_false on metadata.esql_dataset
  # here because a previous test in this file may have left that empty object behind.
  #
  # The security-sensitive assertion is the data-source side: DataSourceMetadata.context() excludes
  # API, so even a populated esql_datasource must never surface here.
  - do:
      cluster.state: { }

  - is_false: metadata.esql_datasource

---
"mappings-validator-rejections":
  # Semantic validator rejections (DeclaredSchemaValidator) run inside validatePutDataset, after the parent data
  # source is resolved — so create one, then assert an undeclarable type and a [format] on a non-date column are
  # both rejected with an actionable message.
  - requires:
      capabilities:
        - method: PUT
          path: /_query/dataset/{name}
          capabilities: [dataset_declared_schema]
      test_runner_features: capabilities
      reason: "declared mappings validation"

  - do:
      esql.put_data_source:
        name: parent
        body:
          type: s3
          settings:
            auth: anonymous

  - do:
      catch: /unsupported declared type \[geo_point\] for column \[g\]/
      esql.put_dataset:
        name: ds
        body:
          data_source: parent
          resource: "s3://x/*.csv"
          mappings:
            properties:
              g: { type: geo_point }

  # The message tail differs across versions (a 9.5 node says "[date] columns"; a node with date_nanos
  # declarable says "[date] and [date_nanos] columns"), and this suite also runs mixed-cluster, where the
  # request may land on either. Assert only the version-stable prefix — what is being pinned is that a
  # `format` on a non-temporal column is rejected, not the wording of the list. The exact message is
  # asserted in DeclaredSchemaValidatorTests, which runs against one known version.
  - do:
      catch: /\[format\] on column \[msg\] is only supported on \[date\]/
      esql.put_dataset:
        name: ds
        body:
          data_source: parent
          resource: "s3://x/*.csv"
          mappings:
            properties:
              msg: { type: keyword, format: "yyyy-MM-dd" }

  # NOTE: `format` validation on a declared date_nanos column is deliberately NOT asserted here. This suite also
  # runs mixed-cluster, where the PUT may land on a node that predates date_nanos being declarable and so answers
  # "unsupported declared type [date_nanos]" instead — a version-dependent assert this runner cannot make. It is
  # covered where the version is known: DeclaredSchemaValidatorTests (the exact message) and FromDatasetIT (a real
  # PUT + real read).

  - do:
      esql.delete_data_source:
        name: parent

---
"declared-text-is-rejected":
  # Its own section rather than an arm of "mappings-validator-rejections", because `requires` is section-scoped:
  # putting this capability there would skip that section's existing pins on any node lacking it. The gate matters
  # in the mixed-cluster run, where a node without the capability accepts the declaration and answers 200.
  - requires:
      capabilities:
        - method: PUT
          path: /_query/dataset/{name}
          capabilities: [dataset_text_type_not_declarable]
      test_runner_features: capabilities
      reason: "text is not a declarable dataset column type"

  - do:
      esql.put_data_source:
        name: parent
        body:
          type: s3
          settings:
            auth: anonymous

  # One regex over the whole message: the rejection names the column and the route, since the supported-type list
  # alone does not say where an analyzed column comes from.
  - do:
      catch: /unsupported declared type \[text\] for column \[msg\].+apply TO_TEXT in the query/
      esql.put_dataset:
        name: ds
        body:
          data_source: parent
          resource: "s3://x/*.csv"
          mappings:
            properties:
              msg: { type: text }

  - do:
      esql.delete_data_source:
        name: parent

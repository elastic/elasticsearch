---
setup:
  - requires:
      test_runner_features: allowed_warnings_regex
  - do:
      bulk:
        index: "test"
        refresh: true
        body:
          - { "index": { } }
          - { "@timestamp": "2023-10-23T13:55:01.543Z", "agent": "chrome", "response_time": 42, "ip": "82.170.213.79" }
          - { "index": { } }
          - { "@timestamp": "2023-10-23T13:55:01.544Z", "agent": "firefox", "response_time": 99, "ip": "82.170.213.80" }

---
pipe position lists fields:
  - do:
      allowed_warnings_regex:
        - "No limit defined, adding default limit of \\[.*\\]"
      esql.suggestions:
        body:
          query: "FROM test | KEEP agent, response_time\n"
          cursor: { utf16: 37 }

  - exists: fields
  - length: { warnings: 0 }

---
field name slot after WHERE:
  - do:
      allowed_warnings_regex:
        - "No limit defined, adding default limit of \\[.*\\]"
      esql.suggestions:
        body:
          query: "FROM test | WHERE response_time > 10"
          cursor: { utf16: 18 }

  - exists: fields
  - length: { warnings: 0 }

---
cursor inside a WHERE equality literal on an ip field does not choke:
  - do:
      allowed_warnings_regex:
        - "No limit defined, adding default limit of \\[.*\\]"
      esql.suggestions:
        body:
          query: "FROM test | WHERE ip == \"\""
          cursor: { utf16: 25 }

  - exists: fields
  - length: { warnings: 0 }

---
field name slot after IP_LOCATION lists dotted output fields:
  - do:
      allowed_warnings_regex:
        - "No limit defined, adding default limit of \\[.*\\]"
      esql.suggestions:
        body:
          # KEEP g.* (rather than one dotted field) keeps every IP_LOCATION output field in
          # scope for the assertions below even after column pruning.
          query: "FROM test\n| IP_LOCATION g = ip\n| KEEP g.*"
          cursor: { utf16: 39 }

  - exists: fields
  - length: { warnings: 0 }
  - match: { fields.g\.country_iso_code.type: "keyword" }
  - match: { fields.g\.city_name.type: "keyword" }

---
multiline query via block scalar:
  - do:
      allowed_warnings_regex:
        - "No limit defined, adding default limit of \\[.*\\]"
      esql.suggestions:
        body:
          # cursor is right after "chr" on line 2 (inside the string literal)
          query: |
            FROM test
            | WHERE agent == "chr"
            | KEEP agent
          cursor: { utf16: 31 }

  - exists: fields
  - length: { warnings: 0 }

---
hot tier keyword equality samples values:
  - do:
      indices.create:
        index: test_keyword_values
        body:
          mappings:
            properties:
              k:
                type: keyword
  - do:
      bulk:
        index: "test_keyword_values"
        refresh: true
        body:
          - { "index": { } }
          - { "k": "alpha" }
          - { "index": { } }
          - { "k": "alpha" }
          - { "index": { } }
          - { "k": "beta" }

  - do:
      allowed_warnings_regex:
        - "No limit defined, adding default limit of \\[.*\\]"
      esql.suggestions:
        body:
          # cursor sits inside the empty string literal, right after the opening quote
          query: "FROM test_keyword_values | WHERE k == \"\""
          cursor: { utf16: 39 }
          include_sample_values: true

  - exists: fields
  - exists: fields.k.values
  - match: { warnings: ["hot_only"] }

---
cursor accepts a utf8 byte offset on non-ascii content:
  - do:
      allowed_warnings_regex:
        - "No limit defined, adding default limit of \\[.*\\]"
      esql.suggestions:
        body:
          # "caf\u00e9" is 5 bytes in utf-8 (the \u00e9 is 2 bytes); cursor lands right after it.
          query: "FROM test | WHERE agent == \"caf\u00e9\""
          cursor: { utf8: 33 }

  - exists: fields

---
cursor accepts a code point offset on non-ascii content:
  - do:
      allowed_warnings_regex:
        - "No limit defined, adding default limit of \\[.*\\]"
      esql.suggestions:
        body:
          # "caf\u00e9" is 4 code points; cursor lands right after it (same position utf16 would use here,
          # since \u00e9 is in the Basic Multilingual Plane).
          query: "FROM test | WHERE agent == \"caf\u00e9\""
          cursor: { codepoint: 32 }

  - exists: fields

---
cursor object with no unit is rejected:
  - do:
      catch: bad_request
      esql.suggestions:
        body:
          query: "FROM test"
          cursor: { }

---
cursor object with multiple units is rejected:
  - do:
      catch: bad_request
      esql.suggestions:
        body:
          query: "FROM test"
          cursor: { utf8: 1, utf16: 2 }

---
cursor object with unknown unit is rejected:
  - do:
      catch: bad_request
      esql.suggestions:
        body:
          query: "FROM test"
          cursor: { byte: 1 }

---
crlf line ending is not collapsed:
  - do:
      allowed_warnings_regex:
        - "No limit defined, adding default limit of \\[.*\\]"
      esql.suggestions:
        body:
          # cursor is right after the \r on line 1, before the \n that starts line 2.
          query: "FROM test\r\n| WHERE response_time > 10"
          cursor: { utf16: 10 }

  - exists: fields

---
missing query is rejected:
  - do:
      catch: bad_request
      esql.suggestions:
        body:
          cursor: { utf16: 0 }

---
cursor out of range is rejected:
  - do:
      catch: bad_request
      esql.suggestions:
        body:
          query: "FROM test"
          cursor: { utf16: 999 }

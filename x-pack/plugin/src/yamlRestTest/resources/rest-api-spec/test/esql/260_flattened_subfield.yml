---
setup:
  - requires:
      test_runner_features: [ capabilities, contains ]
      capabilities:
        - method: POST
          path: /_query
          parameters: []
          capabilities: [ optional_fields_v5, flattened_datatype ]
      reason: "Loading a subfield of a flattened field when unmapped_fields=load"
  - do:
      indices.create:
        index: index1
        body:
          mappings:
            dynamic: false
            properties:
              foo:
                type: flattened
  - do:
      indices.create:
        index: index2
        body:
          mappings:
            dynamic: false
            properties:
              foo.bar:
                type: flattened
  - do:
      indices.create:
        index: index3
        body:
          mappings:
            dynamic: false
            properties:
              foo:
                type: keyword
  - do:
      indices.create:
        index: index4
        body:
          mappings:
            dynamic: false
            properties:
              foo.bar:
                type: keyword
  - do:
      indices.create:
        index: index5
        body:
          mappings:
            dynamic: false
            properties:
              foo:
                type: flattened
              bar:
                properties:
                  baz:
                    type: flattened

---
'loading subfield of flattened 1':
  - skip:
      capabilities:
        - method: POST
          path: /_query
          parameters: []
          capabilities: [ flattened_subfields ]
      reason: "A subfield of a flattened field is a keyword field of its own"
  - do:
      catch: bad_request
      esql.query:
        body:
          # [foo] is flattened in index1
          query: 'SET unmapped_fields="load"; FROM index1 | KEEP foo.a'
  - match: { status: 400 }
  - match: { error.type: verification_exception }
  - contains: { error.reason: 'Found 1 problem' }
  - contains: { error.reason: 'line 1:48: Loading subfield [foo.a] when parent [foo] is of flattened field type is not supported with unmapped_fields="load"' }


---
# [category.raw] is a keyword multi-field in [kw] and a key of the flattened [category] in [flat], so it is a keyword
# column that each index reads with what it has. [category] itself is text in one index and flattened in the other.
setup:
  - requires:
      test_runner_features: [ capabilities ]
      capabilities:
        - method: POST
          path: /_query
          parameters: []
          capabilities: [ flattened_keys ]
      reason: "A name under a flattened field is a field"
  - do:
      indices.create:
        index: kw
        body:
          settings:
            number_of_shards: 1
          mappings:
            properties:
              category:
                type: text
                fields:
                  raw:
                    type: keyword
  - do:
      indices.create:
        index: flat
        body:
          settings:
            number_of_shards: 1
          mappings:
            properties:
              category:
                type: flattened
  - do:
      bulk:
        refresh: true
        body:
          - { "index": { "_index": "kw" } }
          - { "category": "alpha" }
          - { "index": { "_index": "flat" } }
          - { "category": { "raw": "alpha" } }
          - { "index": { "_index": "flat" } }
          - { "category": { "other": "x" } }

---
'no filter':
  - do:
      esql.query:
        body:
          query: 'FROM kw,flat METADATA _index | KEEP _index, category.raw | SORT _index, category.raw | LIMIT 10'
  - match: { columns.1: { name: category.raw, type: keyword } }
  - match: { values: [ [ "flat", "alpha" ], [ "flat", null ], [ "kw", "alpha" ] ] }

---
'the root is a type conflict':
  - do:
      esql.query:
        body:
          query: 'FROM kw,flat | KEEP category | LIMIT 1'
  - match: { columns.0.name: category }
  - match: { columns.0.type: unsupported }
  - match: { columns.0.original_types: [ flattened, text ] }

---
'filters':
  - do:
      esql.query:
        body:
          query: 'FROM kw,flat METADATA _index | WHERE category.raw LIKE "*lph*" | KEEP _index, category.raw | SORT _index | LIMIT 10'
  - match: { values: [ [ "flat", "alpha" ], [ "kw", "alpha" ] ] }
  - do:
      esql.query:
        body:
          query: 'FROM kw,flat METADATA _index | WHERE NOT category.raw LIKE "*test*" | KEEP _index, category.raw | SORT _index | LIMIT 10'
  - match: { values: [ [ "flat", "alpha" ], [ "kw", "alpha" ] ] }
  - do:
      esql.query:
        body:
          query: 'FROM kw,flat METADATA _index | WHERE category.raw RLIKE "a.*" | KEEP _index, category.raw | SORT _index | LIMIT 10'
  - match: { values: [ [ "flat", "alpha" ], [ "kw", "alpha" ] ] }
  - do:
      esql.query:
        body:
          query: 'FROM kw,flat METADATA _index | WHERE STARTS_WITH(category.raw, "al") | KEEP _index, category.raw | SORT _index | LIMIT 10'
  - match: { values: [ [ "flat", "alpha" ], [ "kw", "alpha" ] ] }
  - do:
      esql.query:
        body:
          query: 'FROM kw,flat METADATA _index | WHERE ENDS_WITH(category.raw, "ha") | KEEP _index, category.raw | SORT _index | LIMIT 10'
  - match: { values: [ [ "flat", "alpha" ], [ "kw", "alpha" ] ] }
  - do:
      esql.query:
        body:
          query: 'FROM kw,flat METADATA _index | WHERE CONTAINS(category.raw, "lph") | KEEP _index, category.raw | SORT _index | LIMIT 10'
  - match: { values: [ [ "flat", "alpha" ], [ "kw", "alpha" ] ] }
  - do:
      esql.query:
        body:
          query: 'FROM kw,flat METADATA _index | WHERE category.raw == "alpha" | KEEP _index, category.raw | SORT _index | LIMIT 10'
  - match: { values: [ [ "flat", "alpha" ], [ "kw", "alpha" ] ] }
  - do:
      esql.query:
        body:
          query: 'FROM kw,flat METADATA _index | WHERE category.raw != "beta" | KEEP _index, category.raw | SORT _index | LIMIT 10'
  - match: { values: [ [ "flat", "alpha" ], [ "kw", "alpha" ] ] }
  - do:
      esql.query:
        body:
          query: 'FROM kw,flat METADATA _index | WHERE category.raw IN ("alpha", "x") | KEEP _index, category.raw | SORT _index | LIMIT 10'
  - match: { values: [ [ "flat", "alpha" ], [ "kw", "alpha" ] ] }
  - do:
      esql.query:
        body:
          query: 'FROM kw,flat METADATA _index | WHERE category.raw >= "a" | KEEP _index, category.raw | SORT _index | LIMIT 10'
  - match: { values: [ [ "flat", "alpha" ], [ "kw", "alpha" ] ] }

---
'nulls':
  - do:
      esql.query:
        body:
          query: 'FROM kw,flat METADATA _index | WHERE category.raw IS NOT NULL | KEEP _index, category.raw | SORT _index | LIMIT 10'
  - match: { values: [ [ "flat", "alpha" ], [ "kw", "alpha" ] ] }
  - do:
      esql.query:
        body:
          query: 'FROM kw,flat METADATA _index | WHERE category.raw IS NULL | KEEP _index, category.raw | LIMIT 10'
  - match: { values: [ [ "flat", null ] ] }

---
'count':
  - do:
      esql.query:
        body:
          query: 'FROM kw,flat | STATS c = COUNT(category.raw) | LIMIT 1'
  - match: { values: [ [ 2 ] ] }

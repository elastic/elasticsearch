---
# The lookup index of a LOOKUP JOIN brings in the keys of its flattened fields, but a key never shadows a mapped field.
setup:
  - requires:
      test_runner_features: [ capabilities ]
      capabilities:
        - method: POST
          path: /_query
          parameters: []
          capabilities: [ flattened_keys, flattened_keys_from_lookup_and_enrich, join_lookup_v12 ]
      reason: "A name under a flattened field is a field"
  - do:
      indices.create:
        index: lk
        body:
          settings:
            index.mode: lookup
          mappings:
            properties:
              k:
                type: keyword
              attrs:
                type: flattened
  - do:
      indices.create:
        index: main_kw
        body:
          mappings:
            properties:
              k:
                type: keyword
              attrs.bar:
                type: keyword
  - do:
      bulk:
        refresh: true
        body:
          - { "index": { "_index": "lk" } }
          - { "k": "x", "attrs": { "bar": "L", "baz": "L" } }
          - { "index": { "_index": "main_kw" } }
          - { "k": "x", "attrs": { "bar": "M" } }

---
'a key only the lookup index holds':
  - do:
      esql.query:
        body:
          query: 'FROM main_kw | LOOKUP JOIN lk ON k | KEEP attrs.baz | LIMIT 10'
  - match: { columns: [ { name: attrs.baz, type: keyword } ] }
  - match: { values: [ [ "L" ] ] }

---
'a key never shadows a mapped field':
  - do:
      esql.query:
        body:
          query: 'FROM main_kw | LOOKUP JOIN lk ON k | KEEP attrs.bar, attrs.baz | LIMIT 10'
  - match: { columns: [ { name: attrs.bar, type: keyword }, { name: attrs.baz, type: keyword } ] }
  - match: { values: [ [ "M", "L" ] ] }

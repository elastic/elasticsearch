---
# A key only the lookup index of a LOOKUP JOIN holds is not a column.
setup:
  - requires:
      test_runner_features: [ capabilities ]
      capabilities:
        - method: POST
          path: /_query
          parameters: []
          capabilities: [ flattened_keys, join_lookup_v12 ]
      reason: "A name under a flattened field is a field"
  - do:
      indices.create:
        index: lk
        body:
          settings:
            index.mode: lookup
          mappings:
            properties:
              k:
                type: keyword
              attrs:
                type: flattened
  - do:
      indices.create:
        index: main_kw
        body:
          mappings:
            properties:
              k:
                type: keyword
              attrs.bar:
                type: keyword
  - do:
      bulk:
        refresh: true
        body:
          - { "index": { "_index": "lk" } }
          - { "k": "x", "attrs": { "bar": "L", "baz": "L" } }
          - { "index": { "_index": "main_kw" } }
          - { "k": "x", "attrs": { "bar": "M" } }

---
'a key only the lookup index holds is not a column':
  - do:
      catch: bad_request
      esql.query:
        body:
          query: 'FROM main_kw | LOOKUP JOIN lk ON k | KEEP attrs.baz | LIMIT 10'
  - match: { error.type: verification_exception }
  - match: { error.reason: "/(?s).*Unknown.column.\\[attrs.baz\\].*/" }

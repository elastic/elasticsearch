---
# Keys of maps: what a query does not return, and what it rejects. See MapKeys for the contract.
setup:
  - requires:
      test_runner_features: [ capabilities ]
      capabilities:
        - method: POST
          path: /_query
          parameters: []
          capabilities: [ flattened_keys_follow_maps ]
      reason: "keys follow maps"
  - do:
      indices.create:
        index: flat
        body:
          mappings:
            properties:
              id:
                type: keyword
              attrs:
                type: flattened
  - do:
      bulk:
        refresh: true
        body:
          - { "index": { "_index": "flat" } }
          - { "id": "1", "attrs": { "host": "a", "env": "prod" } }
          - { "index": { "_index": "flat" } }
          - { "id": "2", "attrs": { "host": "c" } }

---
'reading a key in an expression does not create a column':
  - do:
      esql.query:
        body:
          query: 'FROM flat | WHERE attrs.host == "a" | LIMIT 10'
  - length: { columns: 2 }
  - length: { values: 1 }

---
'KEEP of the map alone closes it':
  - do:
      catch: bad_request
      esql.query:
        body:
          query: 'FROM flat | KEEP id, attrs | WHERE attrs.host == "a" | LIMIT 10'
  - match: { error.type: verification_exception }
  - match: { error.reason: "/(?s).*Unknown.column.\\[attrs.host\\].*/" }

---
'DROP of the map names one node, its children stay':
  - do:
      esql.query:
        body:
          query: 'FROM flat | DROP attrs | WHERE attrs.host == "a" | LIMIT 10'
  - length: { columns: 1 }
  - length: { values: 1 }

---
'DROP of the tree removes the children':
  - do:
      catch: bad_request
      esql.query:
        body:
          query: 'FROM flat | DROP attrs* | WHERE attrs.host == "a" | LIMIT 10'
  - match: { error.type: verification_exception }
  - match: { error.reason: "/(?s).*Unknown.column.\\[attrs.host\\].*/" }

---
'a key that a DROP names is no longer readable':
  - do:
      catch: bad_request
      esql.query:
        body:
          query: 'FROM flat | DROP attrs.host | WHERE attrs.host == "a" | LIMIT 10'
  - match: { error.type: verification_exception }
  - match: { error.reason: "/(?s).*Unknown.column.\\[attrs.host\\].*/" }

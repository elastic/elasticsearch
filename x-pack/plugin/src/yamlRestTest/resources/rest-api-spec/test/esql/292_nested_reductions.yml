# Contract for nested_reductions_design.docx (12 November 2026).
# nested_reductions stays unadvertised. A capability skip is not a passing feature test.
# To execute these cases, start the node with -Desql.nested_reductions.test_execution=true.
# Error substrings are proposed categories.
# One wrapper produces one completed Boolean/scalar for every input row, including join/branch copies.
# Confirmed choices: empty/all-null SUM = null; a selection tie may return either maximum-key candidate.
# On a data node, child values come from doc values, like an ordinary field. A reduction reads _source instead
# after a coordinator step, when a child field has no doc values, or with the nested_loader pragma set to source.
---
setup:
- requires:
    test_runner_features:
    - capabilities
    - contains
    - allowed_warnings_regex
    capabilities:
    - method: POST
      path: /_query
      parameters: []
      capabilities:
      - nested_reductions
    reason: "Completed per-parent nested reductions; capability stays unadvertised unless -Desql.nested_reductions.test_execution=true"
- do:
    indices.create:
      index: nr_orders
      body:
        settings:
          number_of_shards: 1
          number_of_replicas: 0
        mappings:
          dynamic: strict
          properties:
            order_id:
              type: keyword
            revenue:
              type: long
            region:
              type: keyword
            items:
              type: nested
              properties:
                sku:
                  type: keyword
                category:
                  type: keyword
                price:
                  type: long
                quantity:
                  type: long
                details:
                  properties:
                    color:
                      type: keyword
            events:
              type: nested
              properties:
                start:
                  type: long
                end:
                  type: long
- do:
    bulk:
      refresh: true
      body:
      - index:
          _index: nr_orders
          _id: a
      - order_id: a
        revenue: 1000
        region: west
        items:
        - sku: bookcheap
          category: book
          price: 10
          quantity: 3
          details:
            color: blue
        - sku: game
          category: game
          price: 40
          quantity: 5
          details:
            color: red
        events:
        - start: 20
          end: 10
      - index:
          _index: nr_orders
          _id: b
      - order_id: b
        revenue: 200
        region: east
        items:
        - sku: bb
          category: book
          price: 70
          quantity: 2
        - sku: gb
          category: game
          price: 90
          quantity: 2
        events:
        - start: 1
          end: 2
      - index:
          _index: nr_orders
          _id: c
      - order_id: c
        revenue: 300
        region: west
        items:
        - sku: sparsebook
          category: book
          price: 9
        - sku: cgame
          category: game
          price: 3
          quantity: 2
        - sku: zero
          category: book
          price: 4
          quantity: 0
      - index:
          _index: nr_orders
          _id: d
      - order_id: d
        revenue: 400
        region: east
        items:
        - sku: dup
          category: book
          price: 1
          quantity: 2
        - sku: dup
          category: book
          price: 1
          quantity: 2
      - index:
          _index: nr_orders
          _id: e
      - order_id: e
        revenue: 500
        region: west
        items: []
      - index:
          _index: nr_orders
          _id: f
      - order_id: f
        revenue: 600
        region: east
        items: null
      - index:
          _index: nr_orders
          _id: g
      - order_id: g
        revenue: 700
        region: west
      - index:
          _index: nr_orders
          _id: h
      - order_id: h
        revenue: 800
        region: east
        items:
        - sku: allnull
          category: book
          quantity: 2
        - sku: allnull2
          category: game
          price: null
          quantity: null
      - index:
          _index: nr_orders
          _id: i
      - order_id: i
        revenue: 900
        region: west
        items:
        - sku: z
          category: game
          price: 0
          quantity: 99
        - sku: negative
          category: book
          price: -2
          quantity: 3
        events:
        - start: 9
          end: 3
      - index:
          _index: nr_orders
          _id: j
      - order_id: j
        revenue: 100
        region: east
        items:
        - sku: tie_a
          category: book
          price: 5
          quantity: 1
        - sku: tie_b
          category: game
          price: 5
          quantity: 2
# The runner cannot match inside setup. A failed bulk request still fails setup;
# item-level errors:true is covered by the parent-count assertions below.
---
existence respects sibling correlation:
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM nr_orders | WHERE NESTED_ANY(items.category == "book" AND items.price > 80) | KEEP order_id | SORT order_id | LIMIT
          100
- match:
    columns:
    - name: order_id
      type: keyword
- match:
    values: []
---
independent wrappers may match different children:
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM nr_orders | WHERE NESTED_ANY(items.category == "book") AND NESTED_ANY(items.price > 80) | KEEP order_id | SORT order_id
          | LIMIT 100
- match:
    columns:
    - name: order_id
      type: keyword
- match:
    values:
    - - b
---
one object satisfies conjunction:
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM nr_orders | WHERE NESTED_ANY(items.category == "book" AND items.price > 60) | KEEP order_id | SORT order_id | LIMIT
          100
- match:
    columns:
    - name: order_id
      type: keyword
- match:
    values:
    - - b
---
one field cannot equal two different values:
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM nr_orders | WHERE NESTED_ANY(items.sku == "bookcheap" AND items.sku == "game") | KEEP order_id | SORT order_id | LIMIT
          100
- match:
    columns:
    - name: order_id
      type: keyword
- match:
    values: []
---
arithmetic predicate uses one child:
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM nr_orders | WHERE NESTED_ANY(items.price * items.quantity > 100) | KEEP order_id | SORT order_id | LIMIT 100
- match:
    columns:
    - name: order_id
      type: keyword
- match:
    values:
    - - a
    - - b
---
parent AND stays outside scope:
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM nr_orders | WHERE revenue > 500 AND NESTED_ANY(items.price > 0) | KEEP order_id | SORT order_id | LIMIT 100
- match:
    columns:
    - name: order_id
      type: keyword
- match:
    values:
    - - a
---
parent OR preserves unmatched parents:
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM nr_orders | WHERE revenue > 750 OR NESTED_ANY(items.price > 50) | KEEP order_id | SORT order_id | LIMIT 100
- match:
    columns:
    - name: order_id
      type: keyword
- match:
    values:
    - - a
    - - b
    - - h
    - - i
---
outer NOT sees false for empty or unknown-only scope:
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM nr_orders | WHERE NOT NESTED_ANY(items.price > 50) | KEEP order_id | SORT order_id | LIMIT 100
- match:
    columns:
    - name: order_id
      type: keyword
- match:
    values:
    - - a
    - - c
    - - d
    - - e
    - - f
    - - g
    - - h
    - - i
    - - j
---
inner NOT retains ordinary null semantics:
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM nr_orders | WHERE NESTED_ANY(NOT (items.price > 50)) | KEEP order_id | SORT order_id | LIMIT 100
- match:
    columns:
    - name: order_id
      type: keyword
- match:
    values:
    - - a
    - - c
    - - d
    - - i
    - - j
---
NOT around parent AND does not lose parents:
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM nr_orders | WHERE NOT (revenue > 750 AND NESTED_ANY(items.price > 50)) | KEEP order_id | SORT order_id | LIMIT 100
- match:
    columns:
    - name: order_id
      type: keyword
- match:
    values:
    - - a
    - - b
    - - c
    - - d
    - - e
    - - f
    - - g
    - - h
    - - i
    - - j
---
OR inside scope stays inside one object:
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM nr_orders | WHERE NESTED_ANY(items.category == "book" AND (items.price > 60 OR items.quantity == 3)) | KEEP order_id
          | SORT order_id | LIMIT 100
- match:
    columns:
    - name: order_id
      type: keyword
- match:
    values:
    - - a
    - - b
    - - i
---
ordinary object descendants stay in child scope:
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM nr_orders | WHERE NESTED_ANY(items.details.color == "blue" AND items.price > 30) | KEEP order_id | SORT order_id | LIMIT
          100
- match:
    columns:
    - name: order_id
      type: keyword
- match:
    values: []
---
independent nested paths have independent reductions:
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM nr_orders | WHERE NESTED_ANY(items.price > 0) AND NESTED_ANY(events.end < events.start) | KEEP order_id | SORT order_id
          | LIMIT 100
- match:
    columns:
    - name: order_id
      type: keyword
- match:
    values:
    - - a
---
existence EVAL returns one Boolean per parent:
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM nr_orders | EVAL hit = NESTED_ANY(items.price > 0) | KEEP order_id, hit | SORT order_id
    allowed_warnings_regex:
    - "No limit defined, adding default limit of \\[1000\\]"
- match:
    columns:
    - name: order_id
      type: keyword
    - name: hit
      type: boolean
- match:
    values:
    - - a
      - true
    - - b
      - true
    - - c
      - true
    - - d
      - true
    - - e
      - false
    - - f
      - false
    - - g
      - false
    - - h
      - false
    - - i
      - false
    - - j
      - true
---
many matching children count their parent once:
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM nr_orders | WHERE NESTED_ANY(items.price * items.quantity > 100) | STATS parents = COUNT(*), total_revenue = SUM(revenue)
    allowed_warnings_regex:
    - "No limit defined, adding default limit of \\[1000\\]"
- match:
    columns:
    - name: parents
      type: long
    - name: total_revenue
      type: long
- match:
    values:
    - - 2
      - 1200
---
per parent SUM returns scalar and preserves every parent:
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM nr_orders | EVAL item_total = NESTED_ANY(SUM(items.price * items.quantity)) | KEEP order_id, item_total | SORT order_id
    allowed_warnings_regex:
    - "No limit defined, adding default limit of \\[1000\\]"
- match:
    columns:
    - name: order_id
      type: keyword
    - name: item_total
      type: long
- match:
    values:
    - - a
      - 230
    - - b
      - 320
    - - c
      - 6
    - - d
      - 4
    - - e
      - null
    - - f
      - null
    - - g
      - null
    - - h
      - null
    - - i
      - -6
    - - j
      - 15
---
duplicate children contribute twice:
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM nr_orders | WHERE order_id == "d" | EVAL item_total = NESTED_ANY(SUM(items.price * items.quantity)) | KEEP item_total
    allowed_warnings_regex:
    - "No limit defined, adding default limit of \\[1000\\]"
- match:
    columns:
    - name: item_total
      type: long
- match:
    values:
    - - 4
---
missing quantity cannot shift later contribution:
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM nr_orders | WHERE order_id == "c" | EVAL item_total = NESTED_ANY(SUM(items.price * items.quantity)) | KEEP item_total
    allowed_warnings_regex:
    - "No limit defined, adding default limit of \\[1000\\]"
- match:
    columns:
    - name: item_total
      type: long
- match:
    values:
    - - 6
---
zero and negative contributions are not omitted:
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM nr_orders | WHERE order_id == "i" | EVAL item_total = NESTED_ANY(SUM(items.price * items.quantity)) | KEEP item_total
    allowed_warnings_regex:
    - "No limit defined, adding default limit of \\[1000\\]"
- match:
    columns:
    - name: item_total
      type: long
- match:
    values:
    - - -6
---
empty null missing and all-null SUM are null:
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM nr_orders | WHERE order_id IN ("e","f","g","h") | EVAL item_total = NESTED_ANY(SUM(items.price * items.quantity)) |
          KEEP order_id, item_total | SORT order_id
    allowed_warnings_regex:
    - "No limit defined, adding default limit of \\[1000\\]"
- match:
    columns:
    - name: order_id
      type: keyword
    - name: item_total
      type: long
- match:
    values:
    - - e
      - null
    - - f
      - null
    - - g
      - null
    - - h
      - null
---
literal arithmetic is allowed inside aggregate scope:
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM nr_orders | EVAL item_total = NESTED_ANY(SUM(items.price * items.quantity * 2)) | KEEP order_id, item_total | SORT order_id
    allowed_warnings_regex:
    - "No limit defined, adding default limit of \\[1000\\]"
- match:
    columns:
    - name: order_id
      type: keyword
    - name: item_total
      type: long
- match:
    values:
    - - a
      - 460
    - - b
      - 640
    - - c
      - 12
    - - d
      - 8
    - - e
      - null
    - - f
      - null
    - - g
      - null
    - - h
      - null
    - - i
      - -12
    - - j
      - 30
---
ordinary SUM and COUNT see parent rows after reduction:
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM nr_orders | EVAL item_total = NESTED_ANY(SUM(items.price * items.quantity)) | STATS combined = SUM(item_total), parents
          = COUNT(*), present = COUNT(item_total), total_revenue = SUM(revenue)
    allowed_warnings_regex:
    - "No limit defined, adding default limit of \\[1000\\]"
- match:
    columns:
    - name: combined
      type: long
    - name: parents
      type: long
    - name: present
      type: long
    - name: total_revenue
      type: long
- match:
    values:
    - - 569
      - 10
      - 6
      - 5500
---
completed scalar survives rename and projection:
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM nr_orders | EVAL total = NESTED_ANY(SUM(items.price * items.quantity)) | RENAME total AS subtotal | KEEP order_id, subtotal
          | EVAL doubled = subtotal * 2 | KEEP order_id, doubled | SORT order_id
    allowed_warnings_regex:
    - "No limit defined, adding default limit of \\[1000\\]"
- match:
    columns:
    - name: order_id
      type: keyword
    - name: doubled
      type: long
- match:
    values:
    - - a
      - 460
    - - b
      - 640
    - - c
      - 12
    - - d
      - 8
    - - e
      - null
    - - f
      - null
    - - g
      - null
    - - h
      - null
    - - i
      - -12
    - - j
      - 30
---
scalar reducer can feed ordinary WHERE comparison:
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM nr_orders | WHERE NESTED_ANY(SUM(items.price * items.quantity)) > 100 | KEEP order_id | SORT order_id | LIMIT 100
- match:
    columns:
    - name: order_id
      type: keyword
- match:
    values:
    - - a
    - - b
---
LIMIT applies to parents and does not truncate child SUM:
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM nr_orders | SORT order_id | LIMIT 1 | EVAL item_total = NESTED_ANY(SUM(items.price * items.quantity)) | KEEP order_id,
          item_total
- match:
    columns:
    - name: order_id
      type: keyword
    - name: item_total
      type: long
- match:
    values:
    - - a
      - 230
---
selection returns value from maximum-price child:
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM nr_orders | WHERE order_id IN ("a","b","c","d","i") | EVAL selected_sku = NESTED_ANY(LAST(items.sku, items.price)) |
          KEEP order_id, selected_sku | SORT order_id
    allowed_warnings_regex:
    - "No limit defined, adding default limit of \\[1000\\]"
- match:
    columns:
    - name: order_id
      type: keyword
    - name: selected_sku
      type: keyword
- match:
    values:
    - - a
      - game
    - - b
      - gb
    - - c
      - sparsebook
    - - d
      - dup
    - - i
      - z
---
selection ties must return a maximum-key candidate:
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM nr_orders | WHERE order_id == "j" | EVAL selected_sku = NESTED_ANY(LAST(items.sku, items.price)) | EVAL valid = selected_sku
          IN ("tie_a","tie_b") | KEEP valid
    allowed_warnings_regex:
    - "No limit defined, adding default limit of \\[1000\\]"
- match:
    columns:
    - name: valid
      type: boolean
- match:
    values:
    - - true
---
selection preserves parents without objects:
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM nr_orders | WHERE order_id IN ("e","f","g") | EVAL selected_sku = NESTED_ANY(LAST(items.sku, items.price)) | KEEP order_id,
          selected_sku | SORT order_id
    allowed_warnings_regex:
    - "No limit defined, adding default limit of \\[1000\\]"
- match:
    columns:
    - name: order_id
      type: keyword
    - name: selected_sku
      type: keyword
- match:
    values:
    - - e
      - null
    - - f
      - null
    - - g
      - null
---
selection preserves numeric result type:
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM nr_orders | WHERE order_id IN ("a","c","i") | EVAL selected = NESTED_ANY(LAST(items.price, items.price)) | KEEP order_id,
          selected | SORT order_id
    allowed_warnings_regex:
    - "No limit defined, adding default limit of \\[1000\\]"
- match:
    columns:
    - name: order_id
      type: keyword
    - name: selected
      type: long
- match:
    values:
    - - a
      - 40
    - - c
      - 9
    - - i
      - 0
---
multiple wrappers attach one result each:
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM nr_orders | WHERE order_id == "a" | EVAL item_total = NESTED_ANY(SUM(items.price * items.quantity)), selected = NESTED_ANY(LAST(items.sku,
          items.price)), hit = NESTED_ANY(items.price > 20) | KEEP order_id, item_total, selected, hit
    allowed_warnings_regex:
    - "No limit defined, adding default limit of \\[1000\\]"
- match:
    columns:
    - name: order_id
      type: keyword
    - name: item_total
      type: long
    - name: selected
      type: keyword
    - name: hit
      type: boolean
- match:
    values:
    - - a
      - 230
      - game
      - true
---
columnar response exposes scalar cells:
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM nr_orders | WHERE order_id IN ("a","e") | EVAL total = NESTED_ANY(SUM(items.price * items.quantity)), hit = NESTED_ANY(items.price
          > 20) | KEEP order_id, total, hit | SORT order_id
        columnar: true
    allowed_warnings_regex:
    - "No limit defined, adding default limit of \\[1000\\]"
- match:
    columns:
    - name: order_id
      type: keyword
    - name: total
      type: long
    - name: hit
      type: boolean
- match:
    values:
    - - a
      - e
    - - 230
      - null
    - - true
      - false
---
child multivalue comparison keeps scalar warnings:
- do:
    index:
      index: nr_orders
      id: m
      refresh: true
      body:
        order_id: m
        revenue: 50
        region: west
        items:
        - sku: multi
          price:
          - 2
          - 3
          quantity: 2
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM nr_orders | WHERE order_id == "m" | EVAL hit = NESTED_ANY(items.price > 0) | KEEP hit
    allowed_warnings_regex:
    - ".*single-value function encountered multi-value.*"
    - "Line .*: evaluation of \\[.*\\] failed, treating result as null\\. Only first 20 failures recorded\\."
    - "No limit defined, adding default limit of \\[1000\\]"
- match:
    columns:
    - name: hit
      type: boolean
- match:
    values:
    - - false
---
multivalue arithmetic is not zipped:
- do:
    index:
      index: nr_orders
      id: m
      refresh: true
      body:
        order_id: m
        revenue: 50
        region: west
        items:
        - sku: multi
          price:
          - 2
          - 3
          quantity: 2
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM nr_orders | WHERE order_id == "m" | EVAL total = NESTED_ANY(SUM(items.price * items.quantity)) | KEEP total
    allowed_warnings_regex:
    - ".*single-value function encountered multi-value.*"
    - "Line .*: evaluation of \\[.*\\] failed, treating result as null\\. Only first 20 failures recorded\\."
    - "No limit defined, adding default limit of \\[1000\\]"
- match:
    columns:
    - name: total
      type: long
- match:
    values:
    - - null
---
direct SUM consumes ordinary numeric multivalues:
- do:
    index:
      index: nr_orders
      id: m
      refresh: true
      body:
        order_id: m
        revenue: 50
        region: west
        items:
        - sku: multi
          price:
          - 2
          - 3
          quantity: 2
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM nr_orders | WHERE order_id == "m" | EVAL total = NESTED_ANY(SUM(items.price)) | KEEP total
    allowed_warnings_regex:
    - "No limit defined, adding default limit of \\[1000\\]"
- match:
    columns:
    - name: total
      type: long
- match:
    values:
    - - 5
---
double reduction reports double response type:
- do:
    indices.create:
      index: nr_float
      body:
        settings:
          number_of_shards: 1
          number_of_replicas: 0
        mappings:
          dynamic: strict
          properties:
            order_id:
              type: keyword

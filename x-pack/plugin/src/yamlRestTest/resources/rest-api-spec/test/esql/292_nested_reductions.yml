---
NESTED is not a function:
- do:
    catch: bad_request
    esql.query:
      body:
        query: FROM nr_orders | EVAL total = NESTED(SUM(items.price)) | LIMIT 1
- match:
    error.type: parsing_exception
- contains:
    error.reason: "NESTED is not a function, use NESTED_ANY or NESTED_JSON instead"

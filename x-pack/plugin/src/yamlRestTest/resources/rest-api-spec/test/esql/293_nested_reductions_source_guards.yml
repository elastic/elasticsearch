# Indexed evidence for the source-backed loader's closed failures.
# These cases must keep failing until a mapper-aware loader reproduces the same values.
# Execute with -Desql.nested_reductions.test_execution=true. A capability skip is not a pass.
---
setup:
- requires:
    test_runner_features:
    - capabilities
    - contains
    capabilities:
    - method: POST
      path: /_query
      parameters: []
      capabilities:
      - nested_reductions
    reason: "Completed per-parent nested reductions; capability stays unadvertised unless -Desql.nested_reductions.test_execution=true"

---
synthetic source is rejected:
- do:
    indices.create:
      index: nr_synthetic
      body:
        settings:
          index.mapping.source.mode: synthetic
          number_of_shards: 1
          number_of_replicas: 0
        mappings:
          properties:
            items:
              type: nested
              properties:
                price:
                  type: long
- do:
    catch: bad_request
    esql.query:
      allow_partial_results: false
      body:
        query: FROM nr_synthetic | EVAL total = NESTED(SUM(items.price)) | KEEP total | LIMIT 10
- contains:
    error.reason: stored, unfiltered

---
filtered source is rejected:
- do:
    indices.create:
      index: nr_filtered
      body:
        settings:
          number_of_shards: 1
          number_of_replicas: 0
        mappings:
          _source:
            excludes:
            - revenue
          properties:
            revenue:
              type: long
            items:
              type: nested
              properties:
                price:
                  type: long
- do:
    catch: bad_request
    esql.query:
      allow_partial_results: false
      body:
        query: FROM nr_filtered | EVAL total = NESTED(SUM(items.price)) | KEEP total | LIMIT 10
- contains:
    error.reason: stored, unfiltered

---
scaled float nested values are rejected:
- do:
    indices.create:
      index: nr_scaled

      body:
        query: FROM nr_null_value | WHERE NESTED(items.sku == "book") | KEEP _id | LIMIT 10
- contains:
    error.reason: null_value

---
alias inside a nested object is rejected:
- do:
    indices.create:
      index: nr_alias
      body:
        settings:
          number_of_shards: 1
          number_of_replicas: 0
        mappings:
          properties:
            items:
              type: nested
              properties:
                price:
                  type: long
                price_alias:
                  type: alias
                  path: items.price
- do:
    catch: bad_request
    esql.query:
      allow_partial_results: false
      body:
        query: FROM nr_alias | EVAL total = NESTED(SUM(items.price_alias)) | KEEP total | LIMIT 10
- contains:
    error.reason: aliases or multifields


---
setup:
  - requires:
      test_runner_features: [ capabilities, allowed_warnings_regex ]
      capabilities:
        - method: POST
          path: /_query
          parameters: [ ]
          capabilities: [ optional_fields_load_all_single_source_column, optional_fields_load_all_column_from_shard, optional_fields_load_all_v2 ]
      reason: "under SET unmapped_fields=\"load_all\", a source field that is null, [] or [null] contributes nothing to the _unmapped_fields object"

  # dynamic:false keeps every field but id unmapped no matter what the documents write to it, so those are only ever discoverable
  # by reading _source on the data node - which is the path this test is about.
  - do:
      indices.create:
        index: load-all-valueless
        body:
          mappings:
            dynamic: false
            properties:
              id:
                type: keyword

  - do:
      indices.create:
        index: load-all-valueless-mixed
        body:
          mappings:
            dynamic: false
            properties:
              id:
                type: keyword

  - do:
      indices.create:
        index: load-all-valueless-nested
        body:
          mappings:
            dynamic: false
            properties:
              id:
                type: keyword

  - do:
      indices.create:
        index: load-all-array-nulls
        body:
          mappings:
            dynamic: false
            properties:
              id:
                type: keyword

  # Every way a document can mention specific_unmapped_field without saying anything about it, plus one document that omits it.
  - do:
      bulk:
        index: load-all-valueless
        refresh: true
        body:
          - { "index": { } }
          - { "id": "1", "specific_unmapped_field": null }
          - { "index": { } }
          - { "id": "2", "specific_unmapped_field": [ ] }
          - { "index": { } }
          - { "id": "3", "specific_unmapped_field": [ null ] }
          - { "index": { } }
          - { "id": "4", "specific_unmapped_field": [ null, [ ], [ null ] ] }
          - { "index": { } }
          - { "id": "5" }

  # The same documents plus one that does carry a value, so here the column exists and the valueless documents fall into it.
  - do:
      bulk:
        index: load-all-valueless-mixed
        refresh: true
        body:
          - { "index": { } }
          - { "id": "1", "specific_unmapped_field": null }
          - { "index": { } }
          - { "id": "2", "specific_unmapped_field": [ ] }
          - { "index": { } }
          - { "id": "3", "specific_unmapped_field": [ null ] }
          - { "index": { } }
          - { "id": "4" }
          - { "index": { } }
          - { "id": "5", "specific_unmapped_field": "present" }

  # Objects and arrays of objects whose every leaf is nully. Elasticsearch would map nully_object and nully_object.inga as objects
  # and nothing at all for their leaves; document 3 is the one object with something in it.
  - do:
      bulk:
        index: load-all-valueless-nested
        refresh: true
        body:
          - { "index": { } }
          - { "id": "1", "nully_array_of_objects": [ { "foo": null }, { "bar": [ ] } ] }
          - { "index": { } }
          - { "id": "2", "nully_object": { "baz": [ null ], "inga": { } } }
          - { "index": { } }
          - { "id": "3", "object_with_a_value": { "baz": "world" } }

  - do:
      bulk:
        index: load-all-array-nulls
        refresh: true
        body:
          - { "index": { } }
          - { "id": "1", "tags": [ null, "web", null ] }
          - { "index": { } }
          - { "id": "2", "tags": [ "web", "api" ] }

  - do:
      indices.create:
        index: nully-valueless-synthetic
        body:
          settings:
            index:
              mapping:
                source:
                  mode: synthetic
          mappings:
            dynamic: false
            properties:
              id:
                type: keyword

  - do:
      bulk:
        index: nully-valueless-synthetic
        refresh: true
        body:
          - { "index": { } }
          - { "id": "1", "specific_unmapped_field": null }
          - { "index": { } }
          - { "id": "2", "specific_unmapped_field": [ ] }
          - { "index": { } }
          - { "id": "3", "specific_unmapped_field": [ null ] }
          - { "index": { } }
          - { "id": "4" }

  - do:
      indices.create:
        index: nully-valueless-mixed-synthetic
        body:
          settings:
            index:
              mapping:
                source:
                  mode: synthetic
          mappings:
            dynamic: false
            properties:
              id:
                type: keyword

  - do:
      bulk:
        index: nully-valueless-mixed-synthetic
        refresh: true
        body:
          - { "index": { } }
          - { "id": "1", "specific_unmapped_field": null }
          - { "index": { } }
          - { "id": "2", "specific_unmapped_field": [ ] }
          - { "index": { } }
          - { "id": "3", "specific_unmapped_field": [ null ] }
          - { "index": { } }
          - { "id": "4" }
          - { "index": { } }
          - { "id": "5", "specific_unmapped_field": "present" }

  - do:
      indices.create:
        index: nully-nested-synthetic
        body:
          settings:
            index:
              mapping:
                source:
                  mode: synthetic
          mappings:
            dynamic: false
            properties:
              id:
                type: keyword

  - do:
      bulk:
        index: nully-nested-synthetic
        refresh: true
        body:
          - { "index": { } }
          - { "id": "1", "nully_array_of_objects": [ { "foo": null }, { "bar": [ ] } ] }
          - { "index": { } }
          - { "id": "2", "nully_object": { "baz": [ null ], "inga": { } } }
          - { "index": { } }
          - { "id": "3", "object_with_a_value": { "baz": "world" } }

  - do:
      indices.create:
        index: nully-drop-null-cols
        body:
          mappings:
            dynamic: false
            properties:
              id:
                type: keyword

  - do:
      bulk:
        index: nully-drop-null-cols
        refresh: true
        body:
          - { "index": { } }
          - { "id": "1", "nully_field": null }
          - { "index": { } }
          - { "id": "2", "nully_field": [ ] }
          - { "index": { } }
          - { "id": "3", "nully_field": [ null ] }
          - { "index": { } }
          - { "id": "4" }
          - { "index": { } }
          - { "id": "5", "real_field": "value" }

---
'valueless unmapped field contributes nothing, so the whole column is null':
  - do:
      allowed_warnings_regex:
        - "No limit defined, adding default limit of \\[.*\\]"
      esql.query:
        body:
          query: 'SET unmapped_fields="load_all"; FROM load-all-valueless | SORT id'
  - length: { columns: 2 }
  - match: { columns.0.name: id }
  - match: { columns.0.type: keyword }
  - match: { columns.1.name: _unmapped_fields }
  - match: { columns.1.type: _source }
  - length: { values: 5 }
  - match: { values.0: [ "1", null ] }
  - match: { values.1: [ "2", null ] }
  - match: { values.2: [ "3", null ] }
  - match: { values.3: [ "4", null ] }
  - match: { values.4: [ "5", null ] }

---
'explicitly kept valueless unmapped field is a null column':
  - do:
      allowed_warnings_regex:
        - "No limit defined, adding default limit of \\[.*\\]"
      esql.query:
        body:
          query: 'SET unmapped_fields="load_all"; FROM load-all-valueless | KEEP specific_unmapped_field'
  - length: { columns: 1 }
  - match: { columns.0.name: specific_unmapped_field }
  - match: { columns.0.type: keyword }
  - match: { values.0: [ null ] }
  - match: { values.1: [ null ] }
  - match: { values.2: [ null ] }
  - match: { values.3: [ null ] }
  - match: { values.4: [ null ] }

---
'valueless values are absent from the object another document filled':
  - do:
      allowed_warnings_regex:
        - "No limit defined, adding default limit of \\[.*\\]"
      esql.query:
        body:
          query: 'SET unmapped_fields="load_all"; FROM load-all-valueless-mixed | SORT id'
  - length: { columns: 2 }
  - match: { columns.0.name: id }
  - match: { columns.1.name: _unmapped_fields }
  - match: { columns.1.type: _source }
  - match: { values.0: [ "1", null ] }
  - match: { values.1: [ "2", null ] }
  - match: { values.2: [ "3", null ] }
  - match: { values.3: [ "4", null ] }
  - match: { values.4: [ "5", { specific_unmapped_field: present } ] }

---
'one index with a value and one without share the single column':
  - do:
      allowed_warnings_regex:
        - "No limit defined, adding default limit of \\[.*\\]"
      esql.query:
        body:
          query: 'SET unmapped_fields="load_all"; FROM load-all-valueless,load-all-valueless-mixed'
  - length: { columns: 2 }
  - match: { columns.0.name: id }
  - match: { columns.1.name: _unmapped_fields }
  - match: { columns.1.type: _source }
  - length: { values: 10 }

---
'nully objects and arrays of objects contribute nothing':
  - do:
      allowed_warnings_regex:
        - "No limit defined, adding default limit of \\[.*\\]"
      esql.query:
        body:
          query: 'SET unmapped_fields="load_all"; FROM load-all-valueless-nested | SORT id'
  # Only the object that has something in it appears, under its flattened dotted name.
  - length: { columns: 2 }
  - match: { columns.0.name: id }
  - match: { columns.1.name: _unmapped_fields }
  - match: { columns.1.type: _source }
  - match: { values.0: [ "1", null ] }
  - match: { values.1: [ "2", null ] }
  - match: { values.2: [ "3", { object_with_a_value.baz: world } ] }

---
'nulls are stripped from an array that is kept':
  - do:
      allowed_warnings_regex:
        - "No limit defined, adding default limit of \\[.*\\]"
      esql.query:
        body:
          query: 'SET unmapped_fields="load_all"; FROM load-all-array-nulls | SORT id'
  - length: { columns: 2 }
  - match: { columns.1.name: _unmapped_fields }
  - match: { values.0: [ "1", { tags: web } ] }
  - match: { values.1: [ "2", { tags: [ "web", "api" ] } ] }

---
'nully valueless field under synthetic source contributes nothing':
  - do:
      esql.query:
        body:
          query: 'SET unmapped_fields="load_all"; FROM nully-valueless-synthetic | SORT id | LIMIT 10'
  - length: { columns: 2 }
  - match: { columns.0.name: id }
  - match: { columns.0.type: keyword }
  - match: { columns.1.name: _unmapped_fields }
  - match: { columns.1.type: _source }
  - length: { values: 4 }
  - match: { values.0: [ "1", null ] }
  - match: { values.1: [ "2", null ] }
  - match: { values.2: [ "3", null ] }
  - match: { values.3: [ "4", null ] }

---
'nully documents are absent from the object another synthetic-source document fills':
  - do:
      esql.query:
        body:
          query: 'SET unmapped_fields="load_all"; FROM nully-valueless-mixed-synthetic | SORT id | LIMIT 10'
  - length: { columns: 2 }
  - match: { columns.0.name: id }
  - match: { columns.1.name: _unmapped_fields }
  - match: { columns.1.type: _source }
  - match: { values.0: [ "1", null ] }
  - match: { values.1: [ "2", null ] }
  - match: { values.2: [ "3", null ] }
  - match: { values.3: [ "4", null ] }
  - match: { values.4: [ "5", { specific_unmapped_field: present } ] }

---
'nully objects under synthetic source contribute nothing':
  - do:
      esql.query:
        body:
          query: 'SET unmapped_fields="load_all"; FROM nully-nested-synthetic | SORT id | LIMIT 10'
  - length: { columns: 2 }
  - match: { columns.0.name: id }
  - match: { columns.1.name: _unmapped_fields }
  - match: { columns.1.type: _source }
  - match: { values.0: [ "1", null ] }
  - match: { values.1: [ "2", null ] }
  - match: { values.2: [ "3", { object_with_a_value.baz: world } ] }

---
'drop_null_columns false does not surface LOAD_ALL suppressed nully field':
  - do:
      esql.query:
        drop_null_columns: false
        body:
          query: 'SET unmapped_fields="load_all"; FROM nully-drop-null-cols | SORT id | LIMIT 10'
  # nully_field never appears in the object because LOAD_ALL suppressed it; only real_field does.
  - length: { columns: 2 }
  - match: { columns.0.name: id }
  - match: { columns.1.name: _unmapped_fields }
  - match: { columns.1.type: _source }
  - match: { values.0: [ "1", null ] }
  - match: { values.1: [ "2", null ] }
  - match: { values.2: [ "3", null ] }
  - match: { values.3: [ "4", null ] }
  - match: { values.4: [ "5", { real_field: value } ] }

---
'drop_null_columns true keeps the single column because one row has a value':
  - do:
      esql.query:
        drop_null_columns: true
        body:
          query: 'SET unmapped_fields="load_all"; FROM nully-drop-null-cols | SORT id | LIMIT 10'
  - length: { all_columns: 2 }
  - match: { all_columns.0.name: id }
  - match: { all_columns.1.name: _unmapped_fields }
  # _unmapped_fields has a non-null value in doc 5, so it survives drop_null_columns.
  - length: { columns: 2 }
  - match: { columns.0.name: id }
  - match: { columns.1.name: _unmapped_fields }
  - match: { values.4: [ "5", { real_field: value } ] }

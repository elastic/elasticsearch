---
setup:
  - requires:
      test_runner_features: [ capabilities, allowed_warnings_regex ]
      capabilities:
        - method: POST
          path: /_query
          parameters: [ ]
          capabilities: [ optional_fields_load_all_v2 ]
      reason: "under SET unmapped_fields=\"load_all\", a source field that is null, [] or [null] everywhere expands into no column"

  # dynamic:false keeps every field but id unmapped no matter what the documents write to it, so those are only ever discoverable
  # by reading _source on the data node - which is the path this test is about.
  - do:
      indices.create:
        index: load-all-valueless
        body:
          mappings:
            dynamic: false
            properties:
              id:
                type: keyword

  - do:
      indices.create:
        index: load-all-valueless-mixed
        body:
          mappings:
            dynamic: false
            properties:
              id:
                type: keyword

  - do:
      indices.create:
        index: load-all-valueless-nested
        body:
          mappings:
            dynamic: false
            properties:
              id:
                type: keyword

  - do:
      indices.create:
        index: load-all-array-nulls
        body:
          mappings:
            dynamic: false
            properties:
              id:
                type: keyword

  # Every way a document can mention specific_unmapped_field without saying anything about it, plus one document that omits it.
  - do:
      bulk:
        index: load-all-valueless
        refresh: true
        body:
          - { "index": { } }
          - { "id": "1", "specific_unmapped_field": null }
          - { "index": { } }
          - { "id": "2", "specific_unmapped_field": [ ] }
          - { "index": { } }
          - { "id": "3", "specific_unmapped_field": [ null ] }
          - { "index": { } }
          - { "id": "4", "specific_unmapped_field": [ null, [ ], [ null ] ] }
          - { "index": { } }
          - { "id": "5" }

  # The same documents plus one that does carry a value, so here the column exists and the valueless documents fall into it.
  - do:
      bulk:
        index: load-all-valueless-mixed
        refresh: true
        body:
          - { "index": { } }
          - { "id": "1", "specific_unmapped_field": null }
          - { "index": { } }
          - { "id": "2", "specific_unmapped_field": [ ] }
          - { "index": { } }
          - { "id": "3", "specific_unmapped_field": [ null ] }
          - { "index": { } }
          - { "id": "4" }
          - { "index": { } }
          - { "id": "5", "specific_unmapped_field": "present" }

  # Objects and arrays of objects whose every leaf is nully. Elasticsearch would map nully_object and nully_object.inga as objects
  # and nothing at all for their leaves; document 3 is the one object with something in it.
  - do:
      bulk:
        index: load-all-valueless-nested
        refresh: true
        body:
          - { "index": { } }
          - { "id": "1", "nully_array_of_objects": [ { "foo": null }, { "bar": [ ] } ] }
          - { "index": { } }
          - { "id": "2", "nully_object": { "baz": [ null ], "inga": { } } }
          - { "index": { } }
          - { "id": "3", "object_with_a_value": { "baz": "world" } }

  - do:
      bulk:
        index: load-all-array-nulls
        refresh: true
        body:
          - { "index": { } }
          - { "id": "1", "tags": [ null, "web", null ] }
          - { "index": { } }
          - { "id": "2", "tags": [ "web", "api" ] }

  - do:
      indices.create:
        index: nully-valueless-synthetic
        body:
          settings:
            index:
              mapping:
                source:
                  mode: synthetic
          mappings:
            dynamic: false
            properties:
              id:
                type: keyword

  - do:
      bulk:
        index: nully-valueless-synthetic
        refresh: true
        body:
          - { "index": { } }
          - { "id": "1", "specific_unmapped_field": null }
          - { "index": { } }
          - { "id": "2", "specific_unmapped_field": [ ] }
          - { "index": { } }
          - { "id": "3", "specific_unmapped_field": [ null ] }
          - { "index": { } }
          - { "id": "4" }

  - do:
      indices.create:
        index: nully-valueless-mixed-synthetic
        body:
          settings:
            index:
              mapping:
                source:
                  mode: synthetic
          mappings:
            dynamic: false
            properties:
              id:
                type: keyword

  - do:
      bulk:
        index: nully-valueless-mixed-synthetic
        refresh: true
        body:
          - { "index": { } }
          - { "id": "1", "specific_unmapped_field": null }
          - { "index": { } }
          - { "id": "2", "specific_unmapped_field": [ ] }
          - { "index": { } }
          - { "id": "3", "specific_unmapped_field": [ null ] }
          - { "index": { } }
          - { "id": "4" }
          - { "index": { } }
          - { "id": "5", "specific_unmapped_field": "present" }

  - do:
      indices.create:
        index: nully-nested-synthetic
        body:
          settings:
            index:
              mapping:
                source:
                  mode: synthetic
          mappings:
            dynamic: false
            properties:
              id:
                type: keyword

  - do:
      bulk:
        index: nully-nested-synthetic
        refresh: true
        body:
          - { "index": { } }
          - { "id": "1", "nully_array_of_objects": [ { "foo": null }, { "bar": [ ] } ] }
          - { "index": { } }
          - { "id": "2", "nully_object": { "baz": [ null ], "inga": { } } }
          - { "index": { } }
          - { "id": "3", "object_with_a_value": { "baz": "world" } }

  - do:
      indices.create:
        index: nully-drop-null-cols
        body:
          mappings:
            dynamic: false
            properties:
              id:
                type: keyword

  - do:
      bulk:
        index: nully-drop-null-cols
        refresh: true
        body:
          - { "index": { } }
          - { "id": "1", "nully_field": null }
          - { "index": { } }
          - { "id": "2", "nully_field": [ ] }
          - { "index": { } }
          - { "id": "3", "nully_field": [ null ] }
          - { "index": { } }
          - { "id": "4" }
          - { "index": { } }
          - { "id": "5", "real_field": "value" }

---
'valueless unmapped field expands into no column':
  - do:
      allowed_warnings_regex:
        - "No limit defined, adding default limit of \\[.*\\]"
      esql.query:
        body:
          query: 'SET unmapped_fields="load_all"; FROM load-all-valueless | SORT id'
  - length: { columns: 1 }
  - match: { columns.0.name: id }
  - match: { columns.0.type: keyword }
  - length: { values: 5 }

---
'explicitly kept valueless unmapped field is a null column':
  - do:
      allowed_warnings_regex:
        - "No limit defined, adding default limit of \\[.*\\]"
      esql.query:
        body:
          query: 'SET unmapped_fields="load_all"; FROM load-all-valueless | KEEP specific_unmapped_field'
  - length: { columns: 1 }
  - match: { columns.0.name: specific_unmapped_field }
  - match: { columns.0.type: keyword }
  - match: { values.0: [ null ] }
  - match: { values.1: [ null ] }
  - match: { values.2: [ null ] }
  - match: { values.3: [ null ] }
  - match: { values.4: [ null ] }

---
'valueless values are null in a column another document filled':
  - do:
      allowed_warnings_regex:
        - "No limit defined, adding default limit of \\[.*\\]"
      esql.query:
        body:
          query: 'SET unmapped_fields="load_all"; FROM load-all-valueless-mixed | SORT id'
  - length: { columns: 2 }
  - match: { columns.0.name: id }
  - match: { columns.1.name: specific_unmapped_field }
  - match: { columns.1.type: keyword }
  - match: { values.0: [ "1", null ] }
  - match: { values.1: [ "2", null ] }
  - match: { values.2: [ "3", null ] }
  - match: { values.3: [ "4", null ] }
  - match: { values.4: [ "5", "present" ] }

---
'a column one index brings into existence still covers the valueless index':
  - do:
      allowed_warnings_regex:
        - "No limit defined, adding default limit of \\[.*\\]"
      esql.query:
        body:
          query: 'SET unmapped_fields="load_all"; FROM load-all-valueless,load-all-valueless-mixed'
  - length: { columns: 2 }
  - match: { columns.0.name: id }
  - match: { columns.1.name: specific_unmapped_field }
  - match: { columns.1.type: keyword }
  - length: { values: 10 }

---
'nully objects and arrays of objects expand into no column':
  - do:
      allowed_warnings_regex:
        - "No limit defined, adding default limit of \\[.*\\]"
      esql.query:
        body:
          query: 'SET unmapped_fields="load_all"; FROM load-all-valueless-nested | SORT id'
  # Only the object that has something in it earns a column.
  - length: { columns: 2 }
  - match: { columns.0.name: id }
  - match: { columns.1.name: object_with_a_value.baz }
  - match: { columns.1.type: keyword }
  - match: { values.0: [ "1", null ] }
  - match: { values.1: [ "2", null ] }
  - match: { values.2: [ "3", "world" ] }

---
'nulls are stripped from an array that is kept':
  - do:
      allowed_warnings_regex:
        - "No limit defined, adding default limit of \\[.*\\]"
      esql.query:
        body:
          query: 'SET unmapped_fields="load_all"; FROM load-all-array-nulls | SORT id'
  - length: { columns: 2 }
  - match: { columns.1.name: tags }
  - match: { values.0: [ "1", "web" ] }
  - match: { values.1: [ "2", ["web", "api"] ] }

---
'nully valueless field under synthetic source expands into no column':
  - do:
      esql.query:
        body:
          query: 'SET unmapped_fields="load_all"; FROM nully-valueless-synthetic | SORT id | LIMIT 10'
  - length: { columns: 1 }
  - match: { columns.0.name: id }
  - match: { columns.0.type: keyword }
  - length: { values: 4 }

---
'nully documents are null in a column another synthetic-source document fills':
  - do:
      esql.query:
        body:
          query: 'SET unmapped_fields="load_all"; FROM nully-valueless-mixed-synthetic | SORT id | LIMIT 10'
  - length: { columns: 2 }
  - match: { columns.0.name: id }
  - match: { columns.1.name: specific_unmapped_field }
  - match: { columns.1.type: keyword }
  - match: { values.0: [ "1", null ] }
  - match: { values.1: [ "2", null ] }
  - match: { values.2: [ "3", null ] }
  - match: { values.3: [ "4", null ] }
  - match: { values.4: [ "5", "present" ] }

---
'nully objects under synthetic source expand into no column':
  - do:
      esql.query:
        body:
          query: 'SET unmapped_fields="load_all"; FROM nully-nested-synthetic | SORT id | LIMIT 10'
  - length: { columns: 2 }
  - match: { columns.0.name: id }
  - match: { columns.1.name: object_with_a_value.baz }
  - match: { columns.1.type: keyword }
  - match: { values.0: [ "1", null ] }
  - match: { values.1: [ "2", null ] }
  - match: { values.2: [ "3", "world" ] }

---
'drop_null_columns false does not surface LOAD_ALL suppressed nully field':
  - do:
      esql.query:
        drop_null_columns: false
        body:
          query: 'SET unmapped_fields="load_all"; FROM nully-drop-null-cols | SORT id | LIMIT 10'
  # Only id and real_field appear; nully_field is absent because LOAD_ALL suppressed it.
  - length: { columns: 2 }
  - match: { columns.0.name: id }
  - match: { columns.1.name: real_field }
  - match: { columns.1.type: keyword }
  - match: { values.0: [ "1", null ] }
  - match: { values.1: [ "2", null ] }
  - match: { values.2: [ "3", null ] }
  - match: { values.3: [ "4", null ] }
  - match: { values.4: [ "5", "value" ] }

---
'drop_null_columns true shows LOAD_ALL suppressed nully field absent from all_columns':
  - do:
      esql.query:
        drop_null_columns: true
        body:
          query: 'SET unmapped_fields="load_all"; FROM nully-drop-null-cols | SORT id | LIMIT 10'
  # all_columns: every column the query produced — id and real_field only; nully_field was never produced.
  - length: { all_columns: 2 }
  - match: { all_columns.0.name: id }
  - match: { all_columns.1.name: real_field }
  # columns: subset with at least one non-null value — both id and real_field qualify (real_field has "value" in doc 5).
  - length: { columns: 2 }
  - match: { columns.0.name: id }
  - match: { columns.1.name: real_field }
  - match: { values.4: [ "5", "value" ] }

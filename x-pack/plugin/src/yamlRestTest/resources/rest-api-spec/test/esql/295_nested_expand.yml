      esql.query:
        body:
          query: 'FROM ne_attrs_long, ne_attrs_flattened | NESTED_EXPAND items | KEEP items.attrs.score | SORT items.attrs.score | LIMIT 10'
  - length: { values: 2 }
  - match: { values.0: [7] }
  - match: { values.1: [null] }
  - do:
      esql.query:
        body:
          query: 'FROM ne_attrs_keyword, ne_attrs_flattened | NESTED_EXPAND items | KEEP items.attrs.score | SORT items.attrs.score | LIMIT 10'
  - length: { values: 2 }
  - match: { values.0: ["7"] }
  - match: { values.1: [null] }

---
"An object in one index and a leaf of the same name in another give a column each":
  - do:
      indices.create:
        index: ne_code_leaf
        body:
          settings:
            number_of_shards: 1
          mappings:
            properties:
              items:
                type: nested
                properties:
                  code:
                    type: keyword
  - do:
      indices.create:
        index: ne_code_object
        body:
          settings:
            number_of_shards: 1
          mappings:
            properties:
              items:
                type: nested
                properties:
                  code:
                    properties:
                      label:
                        type: keyword
  - do:
      bulk:
        refresh: true
        body:
          - { "index": { "_index": "ne_code_leaf", "_id": "1" } }
          - { "items": [ { "code": "x" } ] }
          - { "index": { "_index": "ne_code_object", "_id": "1" } }
          - { "items": [ { "code": { "label": "y" } } ] }
  - do:
      esql.query:
        body:
          query: 'FROM ne_code_leaf, ne_code_object | NESTED_EXPAND items | KEEP items.code, items.code.label | SORT items.code | LIMIT 10'
  - length: { values: 2 }
  - match: { values.0: ["x", null] }
  - match: { values.1: [null, "y"] }
  - do:
      esql.query:
        body:
          query: 'FROM ne_code_leaf, ne_code_object | NESTED_EXPAND items | WHERE items.code == "x" | KEEP items.code, items.code.label | LIMIT 10'
  - length: { values: 1 }
  - match: { values.0: ["x", null] }

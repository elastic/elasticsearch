# Contract for NESTED_EXPAND.
# nested_expand stays unadvertised. A capability skip is not a passing feature test.
# To execute these cases, start the node with -Desql.nested_reductions.test_execution=true.
# Error substrings are proposed categories.
# NESTED_EXPAND <nested field> turns one parent row into one row per object of that nested field.
# Parent columns repeat on every row. The child fields become ordinary columns named by their full path.
# A parent with no objects (empty, null or missing) keeps one row whose child columns are null, as MV_EXPAND does.
# The expansion runs on the data nodes, so it can't follow a command that runs on the coordinator, such as a LIMIT.
# Child values come from doc values, like an ordinary field. The expansion reads _source instead when a child field has
# no doc values. The nested_loader pragma (index by default, or source) can force _source.
---
setup:
- requires:
    test_runner_features:
    - capabilities
    - contains
    - allowed_warnings_regex
    capabilities:
    - method: POST
      path: /_query
      parameters: []
      capabilities:
      - nested_expand
    reason: "Nested expansion; capability stays unadvertised unless -Desql.nested_reductions.test_execution=true"
- do:
    indices.create:
      index: ne_orders
      body:
        settings:
          number_of_shards: 1
          number_of_replicas: 0
        mappings:
          dynamic: strict
          properties:
            order_id:
              type: keyword
            region:
              type: keyword
            items:
              type: nested
              properties:
                sku:
                  type: keyword
                category:
                  type: keyword
                price:
                  type: long
                quantity:
                  type: long
                tags:
                  type: keyword
                details:
                  properties:
                    color:
                      type: keyword
            events:
              type: nested
              properties:
                start:
                  type: long
                end:
                  type: long
- do:
    bulk:
      refresh: true
      body:
      - index:
          _index: ne_orders
          _id: a
      - order_id: a
        region: west
        items:
        - sku: a1
          category: book
          price: 10
          quantity: 3
          tags:
          - new
          - sale
          details:
            color: blue
        - sku: a2
          category: game
          price: 40
          quantity: 5
          details:
            color: red
        events:
        - start: 20
          end: 10
      - index:
          _index: ne_orders
          _id: b
      - order_id: b
        region: east
        items:
        - sku: b1
          category: book
          price: 70
          quantity: 2
        - sku: b2
          category: game
          price: 90
          quantity: 2
        events:
        - start: 1
          end: 2
        - start: 3
          end: 4
      - index:
          _index: ne_orders
          _id: c
      - order_id: c
        region: west
        items:
        - sku: c1
          category: book
          price: 9
        - sku: c2
          category: game
          price: 3
          quantity: 2
      - index:
          _index: ne_orders
          _id: d
      - order_id: d
        region: east
        items:
        - sku: dup
          price: 1
          quantity: 2
        - sku: dup
          price: 1
          quantity: 2
      - index:
          _index: ne_orders
          _id: e
      - order_id: e
        region: west
        items: []
      - index:
          _index: ne_orders
          _id: f
      - order_id: f
        region: east
        items: null
      - index:
          _index: ne_orders
          _id: g
      - order_id: g
        region: west

---
one row per object repeats the parent columns:
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM ne_orders | NESTED_EXPAND items | KEEP order_id, region, items.sku, items.price, items.quantity
          | SORT order_id, items.sku | LIMIT 100
- match:
    columns:
    - name: order_id
      type: keyword
    - name: region
      type: keyword
    - name: items.sku
      type: keyword
    - name: items.price
      type: long
    - name: items.quantity
      type: long
- match:
    values:
    - [a, west, a1, 10, 3]
    - [a, west, a2, 40, 5]
    - [b, east, b1, 70, 2]
    - [b, east, b2, 90, 2]
    - [c, west, c1, 9, null]
    - [c, west, c2, 3, 2]
    - [d, east, dup, 1, 2]
    - [d, east, dup, 1, 2]
    - [e, west, null, null, null]
    - [f, east, null, null, null]
    - [g, west, null, null, null]

---
without KEEP only the parent and expanded columns are returned:
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM ne_orders | NESTED_EXPAND items | SORT order_id, items.sku | LIMIT 1
- match:
    columns:
    - name: order_id
      type: keyword
    - name: region
      type: keyword
    - name: items.category
      type: keyword
    - name: items.details.color
      type: keyword
    - name: items.price
      type: long
    - name: items.quantity
      type: long
    - name: items.sku
      type: keyword
    - name: items.tags
      type: keyword
- match:
    values:
    - [a, west, book, blue, 10, 3, a1, [new, sale]]

---
parents without objects keep one row:
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM ne_orders | NESTED_EXPAND items | STATS rows = COUNT(*), skus = COUNT(items.sku) BY order_id | SORT order_id
    allowed_warnings_regex:
    - "No limit defined, adding default limit of \\[1000\\]"
- match:
    columns:
    - name: rows
      type: long
    - name: skus
      type: long
    - name: order_id
      type: keyword
- match:
    values:
    - [2, 2, a]
    - [2, 2, b]
    - [2, 2, c]
    - [2, 2, d]
    - [1, 0, e]
    - [1, 0, f]
    - [1, 0, g]

---
expanded fields filter and compute like ordinary fields:
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM ne_orders | NESTED_EXPAND items | WHERE items.category == "book" AND items.price > 9
          | EVAL amount = items.price * items.quantity | KEEP order_id, items.sku, amount | SORT order_id
    allowed_warnings_regex:
    - "No limit defined, adding default limit of \\[1000\\]"
- match:
    columns:
    - name: order_id
      type: keyword
    - name: items.sku
      type: keyword
    - name: amount
      type: long
- match:
    values:
    - [a, a1, 30]
    - [b, b1, 140]

---
one row keeps its own object's fields together:
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM ne_orders | NESTED_EXPAND items | WHERE items.category == "game" AND items.price > 50 | KEEP order_id, items.sku
    allowed_warnings_regex:
    - "No limit defined, adding default limit of \\[1000\\]"
- match:
    values:
    - [b, b2]

---
stats over expanded rows agree with the nested reduction:
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM ne_orders | EVAL nested_total = NESTED(SUM(items.price * items.quantity)) | NESTED_EXPAND items
          | STATS total = SUM(items.price * items.quantity), nested_total = MAX(nested_total) BY order_id | SORT order_id
    allowed_warnings_regex:
    - "No limit defined, adding default limit of \\[1000\\]"
- match:
    columns:
    - name: total
      type: long
    - name: nested_total
      type: long
    - name: order_id
      type: keyword
- match:
    values:
    - [230, 230, a]
    - [320, 320, b]
    - [6, 6, c]
    - [4, 4, d]
    - [null, null, e]
    - [null, null, f]
    - [null, null, g]

---
child scalar array stays a multivalue:
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM ne_orders | NESTED_EXPAND items | WHERE items.sku == "a1" | KEEP items.tags
    allowed_warnings_regex:
    - "No limit defined, adding default limit of \\[1000\\]"
- match:
    columns:
    - name: items.tags
      type: keyword
- match:
    values:
    - - [new, sale]

---
object descendants become columns:
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM ne_orders | WHERE order_id == "a" | NESTED_EXPAND items | KEEP items.sku, items.details.color | SORT items.sku
    allowed_warnings_regex:
    - "No limit defined, adding default limit of \\[1000\\]"
- match:
    columns:
    - name: items.sku
      type: keyword
    - name: items.details.color
      type: keyword
- match:
    values:
    - [a1, blue]
    - [a2, red]

---
expanded columns follow full-path order:
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM ne_orders | WHERE order_id == "a" | NESTED_EXPAND items | KEEP items.* | SORT items.sku
    allowed_warnings_regex:
    - "No limit defined, adding default limit of \\[1000\\]"
- match:
    columns:
    - name: items.category
      type: keyword
    - name: items.details.color
      type: keyword
    - name: items.price
      type: long
    - name: items.quantity
      type: long
    - name: items.sku
      type: keyword
    - name: items.tags
      type: keyword
- match:
    values:
    - [book, blue, 10, 3, a1, [new, sale]]
    - [game, red, 40, 5, a2, null]

---
expanded fields rename like ordinary fields:
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM ne_orders | WHERE order_id == "a" | NESTED_EXPAND items | RENAME items.sku AS sku | KEEP sku | SORT sku
    allowed_warnings_regex:
    - "No limit defined, adding default limit of \\[1000\\]"
- match:
    columns:
    - name: sku
      type: keyword
- match:
    values:
    - [a1]
    - [a2]

---
limit after expansion counts expanded rows:
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM ne_orders | WHERE order_id == "a" OR order_id == "b" | NESTED_EXPAND items | SORT items.sku | LIMIT 3 | KEEP items.sku
- match:
    values:
    - [a1]
    - [a2]
    - [b1]

---
expansion after a limit is rejected:
# The data nodes can't tell which expanded rows belong to the parents the limit keeps.
- do:
    catch: bad_request
    esql.query:
      allow_partial_results: false
      body:
        query: FROM ne_orders | SORT order_id | LIMIT 1 | NESTED_EXPAND items | SORT items.sku | KEEP order_id, items.sku
- match:
    error.type: verification_exception
- contains:
    error.reason: NESTED_EXPAND must run on the data nodes

---
document metadata repeats on every expanded row:
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM ne_orders METADATA _id | WHERE order_id == "b" | NESTED_EXPAND items | KEEP _id, items.sku | SORT items.sku
    allowed_warnings_regex:
    - "No limit defined, adding default limit of \\[1000\\]"
- match:
    values:
    - [b, b1]
    - [b, b2]

---
two nested fields expand to every combination:
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM ne_orders | WHERE order_id == "b" | NESTED_EXPAND items | NESTED_EXPAND events | KEEP items.sku, events.start
          | SORT items.sku, events.start
    allowed_warnings_regex:
    - "No limit defined, adding default limit of \\[1000\\]"
- match:
    columns:
    - name: items.sku
      type: keyword
    - name: events.start
      type: long
- match:
    values:
    - [b1, 1]
    - [b1, 3]
    - [b2, 1]
    - [b2, 3]

---
another nested field still reduces on each expanded row:
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM ne_orders | WHERE order_id == "b" | NESTED_EXPAND items | EVAL spans = NESTED(SUM(events.end - events.start))
          | KEEP items.sku, spans | SORT items.sku
    allowed_warnings_regex:
    - "No limit defined, adding default limit of \\[1000\\]"
- match:
    columns:
    - name: items.sku
      type: keyword
    - name: spans
      type: long
- match:
    values:
    - [b1, 2]
    - [b2, 2]

---
expansion on the data node reads doc values like an ordinary field:
- do:
    indices.create:
      index: ne_tags
      body:
        settings:
          number_of_shards: 1
          number_of_replicas: 0
        mappings:
          dynamic: strict
          properties:
            id:
              type: keyword
            items:
              type: nested
              properties:
                tags:
                  type: keyword
- do:
    bulk:
      refresh: true
      body:
      - index:
          _index: ne_tags
          _id: x
      - id: x
        items:
        - tags: [sale, new, sale]
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM ne_tags | NESTED_EXPAND items | KEEP items.tags | LIMIT 10
- match:
    values:
    - [[new, sale]]
# Only _index is loaded: every child field has doc values, so _source is not.
- match: { values_loaded: 1 }

---
the source loader pragma reads source order on the data node:
- do:
    indices.create:
      index: ne_tags
      body:
        settings:
          number_of_shards: 1
          number_of_replicas: 0
        mappings:
          dynamic: strict
          properties:
            id:
              type: keyword
            items:
              type: nested
              properties:
                tags:
                  type: keyword
- do:
    bulk:
      refresh: true
      body:
      - index:
          _index: ne_tags
          _id: x
      - id: x
        items:
        - tags: [sale, new, sale]
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM ne_tags | NESTED_EXPAND items | KEEP items.tags | LIMIT 10
        pragma:
          nested_loader: source
- match:
    values:
    - [[sale, new, sale]]
- match: { values_loaded: 2 }

---
expansion after a limit without a sort is rejected:
- do:
    catch: bad_request
    esql.query:
      allow_partial_results: false
      body:
        query: FROM ne_orders | LIMIT 1 | NESTED_EXPAND items | KEEP items.sku
- match:
    error.type: verification_exception
- contains:
    error.reason: NESTED_EXPAND must run on the data nodes

---
a child field without doc values makes the expansion read source:
- do:
    indices.create:
      index: ne_text
      body:
        settings:
          number_of_shards: 1
          number_of_replicas: 0
        mappings:
          dynamic: strict
          properties:
            id:
              type: keyword
            items:
              type: nested
              properties:
                tags:
                  type: keyword
                note:
                  type: text
- do:
    bulk:
      refresh: true
      body:
      - index:
          _index: ne_text
          _id: x
      - id: x
        items:
        - tags: [sale, new, sale]
          note: hello
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM ne_text | NESTED_EXPAND items | KEEP items.tags, items.note | LIMIT 10
- match:
    values:
    - [[sale, new, sale], hello]

---
ordinary keyword field cannot be expanded:
- do:
    catch: bad_request
    esql.query:
      allow_partial_results: false
      body:
        query: FROM ne_orders | NESTED_EXPAND region
- match:
    error.type: verification_exception
- contains:
    error.reason: mapped nested field

---
object field inside a nested field cannot be expanded:
- do:
    catch: bad_request
    esql.query:
      allow_partial_results: false
      body:
        query: FROM ne_orders | NESTED_EXPAND items.details
- match:
    error.type: verification_exception
- contains:
    error.reason: mapped nested field

---
unknown field cannot be expanded:
- do:
    catch: bad_request
    esql.query:
      allow_partial_results: false
      body:
        query: FROM ne_orders | NESTED_EXPAND nothing
- match:
    error.type: verification_exception
- contains:
    error.reason: Unknown column [nothing]

---
expression is not a field name:
- do:
    catch: bad_request
    esql.query:
      allow_partial_results: false
      body:
        query: FROM ne_orders | NESTED_EXPAND items.price * 2
- match:
    error.type: parsing_exception

---
string literal is not a field name:
- do:
    catch: bad_request
    esql.query:
      allow_partial_results: false
      body:
        query: FROM ne_orders | NESTED_EXPAND "items"
- match:
    error.type: parsing_exception

---
expanded field is no longer nested:
- do:
    catch: bad_request
    esql.query:
      allow_partial_results: false
      body:
        query: FROM ne_orders | NESTED_EXPAND items | NESTED_EXPAND items
- match:
    error.type: verification_exception
- contains:
    error.reason: mapped nested field

---
nested reduction cannot read an expanded field:
- do:
    catch: bad_request
    esql.query:
      allow_partial_results: false
      body:
        query: FROM ne_orders | NESTED_EXPAND items | EVAL total = NESTED(SUM(items.price)) | KEEP total
- match:
    error.type: verification_exception
- contains:
    error.reason: mapped nested field

---
expansion needs the source rows:
- do:
    catch: bad_request
    esql.query:
      allow_partial_results: false
      body:
        query: FROM ne_orders | STATS c = COUNT(*) BY order_id | NESTED_EXPAND items
- match:
    error.type: verification_exception
- contains:
    error.reason: Unknown column [items]

---
synthetic source is rejected when reading source:
- do:
    indices.create:
      index: ne_synthetic
      body:
        settings:
          index.mapping.source.mode: synthetic
          number_of_shards: 1
          number_of_replicas: 0
        mappings:
          properties:
            items:
              type: nested
              properties:
                price:
                  type: long
- do:
    catch: bad_request
    esql.query:
      allow_partial_results: false
      body:
        query: FROM ne_synthetic | NESTED_EXPAND items | KEEP items.price | LIMIT 10
        pragma:
          nested_loader: source
- contains:
    error.reason: stored, unfiltered

---
synthetic source expands doc values on the data node:
- do:
    indices.create:
      index: ne_synthetic
      body:
        settings:
          index.mapping.source.mode: synthetic
          number_of_shards: 1
          number_of_replicas: 0
        mappings:
          properties:
            items:
              type: nested
              properties:
                price:
                  type: long
- do:
    bulk:
      refresh: true
      body:
      - index:
          _index: ne_synthetic
          _id: "1"
      - items:
        - price: 10
        - price: 20
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM ne_synthetic | NESTED_EXPAND items | KEEP items.price | SORT items.price | LIMIT 10
- match:
    values:
    - [10]
    - [20]

---
a path nested in one index and an object in another cannot be expanded:
- do:
    indices.create:
      index: ne_object
      body:
        settings:
          number_of_shards: 1
          number_of_replicas: 0
        mappings:
          dynamic: strict
          properties:
            items:
              properties:
                price:
                  type: long
- do:
    bulk:
      refresh: true
      body:
      - index:
          _index: ne_object
          _id: o
      - items:
        - price: 3
- do:
    catch: bad_request
    esql.query:
      allow_partial_results: false
      body:
        query: FROM ne_orders,ne_object | NESTED_EXPAND items | KEEP items.price | LIMIT 10
- match:
    error.type: verification_exception
- contains:
    error.reason: "[items] is [nested] in [ne_orders] but [object] in [ne_object]"

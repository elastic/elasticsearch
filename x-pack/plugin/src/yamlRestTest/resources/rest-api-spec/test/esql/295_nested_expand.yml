        body:
          settings:
            number_of_shards: 1
          mappings:
            _source:
              excludes: [ "items.skip" ]
            properties:
              id:
                type: keyword
              items:
                type: nested
                properties:
                  note:
                    type: text
                  skip:
                    type: keyword
  - do:
      bulk:
        refresh: true
        body:
          - { "index": { "_index": "ne_filtered", "_id": "1" } }
          - { "id": "1", "items": [ { "skip": "x" }, { "note": "b" }, { "note": "c" } ] }
  - do:
      allowed_warnings_regex:

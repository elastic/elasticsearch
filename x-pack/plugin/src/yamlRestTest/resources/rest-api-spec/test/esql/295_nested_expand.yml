setup:
  - requires:
      test_runner_features: [capabilities, allowed_warnings_regex]
      capabilities:
        - method: POST
          path: /_query
          parameters: []
          capabilities: [nested_expand]
      reason: "NESTED_EXPAND is snapshot-only"
  - do:
      indices.create:
        index: nested_expand
        body:
          settings:
            number_of_shards: 1
          mappings:
            properties:
              id:
                type: keyword
              items:
                type: nested
                properties:
                  sku:
                    type: keyword
                  qty:
                    type: long
  - do:
      bulk:
        refresh: true
        body:
          - { "index": { "_index": "nested_expand", "_id": "1" } }
          - { "id": "1", "items": [ { "sku": "a", "qty": 1 }, { "sku": "b", "qty": 2 } ] }
          - { "index": { "_index": "nested_expand", "_id": "2" } }
          - { "id": "2", "items": [] }
  - do:
      indices.create:
        index: ne_orders
        body:
          settings:
            number_of_shards: 1
          mappings:
            properties:
              id:
                type: keyword
  - do:
      indices.create:
        index: ne_orders_items
        body:
          settings:
            number_of_shards: 1
          mappings:
            properties:
              id:
                type: keyword
              items:
                type: nested
                properties:
                  qty:
                    type: long
  - do:
      indices.create:
        index: ne_lookup_items
        body:
          settings:
            index:
              mode: lookup
          mappings:
            properties:
              id:
                type: keyword
              items:
                type: nested
                properties:
                  qty:
                    type: long
  - do:
      indices.create:
        index: ne_lookup_note
        body:
          settings:
            index:
              mode: lookup
          mappings:
            properties:
              id:
                type: keyword
              note:
                type: keyword
  - do:
      indices.create:
        index: ne_runtime
        body:
          settings:
            number_of_shards: 1
          mappings:
            runtime:
              items.calculated:
                type: long
                script:
                  source: "emit(doc['parent_value'].value)"
            properties:
              parent_value:
                type: long
              items:
                type: nested
                properties:
                  qty:
                    type: long
  - do:
      indices.create:
        index: ne_empty
        body:
          settings:
            number_of_shards: 1
          mappings:
            properties:
              id:
                type: keyword
              items:
                type: nested
                dynamic: false
  - do:
      indices.create:
        index: ne_long
        body:
          settings:
            number_of_shards: 1
          mappings:
            properties:
              x:
                type: long
              items:
                type: nested
                properties:
                  qty:
                    type: long
  - do:
      indices.create:
        index: ne_kw
        body:
          settings:
            number_of_shards: 1
          mappings:
            properties:
              x:
                type: keyword
              items:
                type: nested
                properties:
                  qty:
                    type: long
  - do:
      indices.create:
        index: ne_nested_x
        body:
          settings:
            number_of_shards: 1
          mappings:
            properties:
              x:
                type: nested
                properties:
                  y:
                    type: keyword
              items:
                type: nested
                properties:
                  qty:
                    type: long
  - do:
      bulk:
        refresh: true
        body:
          - { "index": { "_index": "ne_orders", "_id": "a" } }
          - { "id": "a" }
          - { "index": { "_index": "ne_orders_items", "_id": "a" } }
          - { "id": "a", "items": [ { "qty": 1 }, { "qty": 2 } ] }
          - { "index": { "_index": "ne_lookup_items", "_id": "a" } }
          - { "id": "a", "items": [ { "qty": 1 }, { "qty": 2 } ] }
          - { "index": { "_index": "ne_lookup_note", "_id": "a" } }
          - { "id": "a", "note": "n" }
          - { "index": { "_index": "ne_runtime", "_id": "a" } }
          - { "parent_value": 5, "items": [ { "qty": 1 }, { "qty": 2 } ] }
          - { "index": { "_index": "ne_empty", "_id": "a" } }
          - { "id": "a", "items": [ {}, {} ] }
          - { "index": { "_index": "ne_empty", "_id": "b" } }
          - { "id": "b", "items": [] }
          - { "index": { "_index": "ne_long", "_id": "a" } }
          - { "x": 7, "items": [ { "qty": 1 } ] }
          - { "index": { "_index": "ne_kw", "_id": "b" } }
          - { "x": "8", "items": [ { "qty": 1 } ] }
          - { "index": { "_index": "ne_nested_x", "_id": "c" } }
          - { "x": [ { "y": "z" } ], "items": [ { "qty": 1 } ] }

---
"Fan out one row per nested object, keeping a null row for an empty parent":
  - do:
      allowed_warnings_regex:
        - "No limit defined, adding default limit of \\[.*\\]"
      esql.query:
        body:
          query: 'FROM nested_expand | NESTED_EXPAND items | KEEP id, items.sku, items.qty | SORT id, items.sku'
  - match: { columns.0.name: "id" }
  - match: { columns.1.name: "items.sku" }
  - match: { columns.2.name: "items.qty" }
  - length: { values: 3 }
  - match: { values.0: ["1", "a", 1] }
  - match: { values.1: ["1", "b", 2] }
  - match: { values.2: ["2", null, null] }

---
"A query without NESTED_EXPAND does not expose nested fields":
  - do:
      catch: /Unknown column \[items.sku\]/
      esql.query:
        body:
          query: 'FROM nested_expand | KEEP id, items.sku'

---
"NESTED_EXPAND of an unknown field reports the unknown column":
  - do:
      catch: /Unknown column \[missing\]/
      esql.query:
        body:
          query: 'FROM nested_expand | NESTED_EXPAND missing'

---
"NESTED_EXPAND of a non-nested field fails":
  - do:
      catch: /requires a mapped nested field, not \[id\]/
      esql.query:
        body:
          query: 'FROM nested_expand | NESTED_EXPAND id'

---
"NESTED_EXPAND cannot follow a coordinator pipeline breaker":
  - do:
      catch: /must run on the data nodes/
      esql.query:
        body:
          query: 'FROM nested_expand | LIMIT 1 | NESTED_EXPAND items'

---
"NESTED_EXPAND cannot read a collection owned by a LOOKUP JOIN index":
  - do:
      catch: /cannot read \[items\] from a LOOKUP JOIN index/
      esql.query:
        body:
          query: 'FROM ne_orders | LOOKUP JOIN ne_lookup_items ON id | NESTED_EXPAND items | WHERE items.qty > 0 | KEEP id, items.qty'

---
"NESTED_EXPAND of the driving index still runs after a LOOKUP JOIN":
  - do:
      esql.query:
        body:
          query: 'FROM ne_orders_items | LOOKUP JOIN ne_lookup_note ON id | NESTED_EXPAND items | KEEP id, items.qty, note | SORT items.qty | LIMIT 10'
  - length: { values: 2 }
  - match: { values.0: ["a", 1, "n"] }
  - match: { values.1: ["a", 2, "n"] }

---
"A runtime field under a nested name stays on the parent document":
  - do:
      esql.query:
        body:
          query: 'FROM ne_runtime | NESTED_EXPAND items | KEEP items.qty | SORT items.qty | LIMIT 10'
  - length: { values: 2 }
  - match: { values.0: [1] }
  - match: { values.1: [2] }
  - do:
      esql.query:
        body:
          query: 'FROM ne_runtime | NESTED_EXPAND items | KEEP items.qty, items.calculated | SORT items.qty | LIMIT 10'
  - length: { values: 2 }
  - match: { values.0: [1, 5] }
  - match: { values.1: [2, 5] }

---
"A nested collection with no leaf mappings still expands one row per child":
  - do:
      esql.query:
        body:
          query: 'FROM ne_empty | NESTED_EXPAND items | KEEP id | SORT id | LIMIT 10'
  - length: { values: 3 }
  - match: { values.0: ["a"] }
  - match: { values.1: ["a"] }
  - match: { values.2: ["b"] }

---
"A nested field hidden by NESTED_EXPAND does not block a cast of the ordinary field":
  - do:
      allowed_warnings_regex:
        - "No limit defined, adding default limit of \\[.*\\]"
      esql.query:
        body:
          query: 'FROM ne_long, ne_kw, ne_nested_x | NESTED_EXPAND items | EVAL v = x::long | KEEP v, x* | STATS min = MIN(v), max = MAX(v), rows = COUNT(*)'
  - match: { values.0: [7, 8, 3] }

---
"NESTED_EXPAND fails on a child that another index nests under a different collection":
  - do:
      indices.create:
        index: ne_scope_object
        body:
          mappings:
            properties:
              items:
                type: nested
                properties:
                  sub:
                    properties:
                      v:
                        type: keyword
  - do:
      indices.create:
        index: ne_scope_nested
        body:
          mappings:
            properties:
              items:
                type: nested
                properties:
                  sub:
                    type: nested
                    properties:
                      v:
                        type: keyword
  - do:
      catch: '/NESTED_EXPAND cannot read \[items\.sub(\.v)?\]: its nested path is/'
      esql.query:
        body:
          query: 'FROM ne_scope_object, ne_scope_nested | NESTED_EXPAND items | KEEP items.sub.v'

---
"A source-only runtime field under a nested name reads the parent's synthetic source":
  - do:
      indices.create:
        index: ne_runtime_synthetic
        body:
          settings:
            number_of_shards: 1
            index:
              mapping.source.mode: synthetic
          mappings:
            runtime:
              items.calc:
                type: long
            properties:
              items:
                type: nested
                dynamic: false
                properties:
                  qty:
                    type: long
  - do:
      indices.create:
        index: ne_runtime_stored
        body:
          settings:
            number_of_shards: 1
          mappings:
            runtime:
              items.calc:
                type: long
            properties:
              items:
                type: nested
                dynamic: false
                properties:
                  qty:
                    type: long
  - do:
      bulk:
        refresh: true
        body:
          - { "index": { "_index": "ne_runtime_synthetic", "_id": "a" } }
          - { "items": [ { "qty": 1, "calc": 3 }, { "qty": 2, "calc": 4 } ] }
          - { "index": { "_index": "ne_runtime_stored", "_id": "a" } }
          - { "items": [ { "qty": 1, "calc": 3 }, { "qty": 2, "calc": 4 } ] }
  - do:
      esql.query:
        body:
          query: 'FROM ne_runtime_synthetic | NESTED_EXPAND items | KEEP items.qty, items.calc | SORT items.qty | LIMIT 10'
  - length: { values: 2 }
  - match: { values.0: [1, [3, 4]] }
  - match: { values.1: [2, [3, 4]] }
  # The same field over stored _source reads the same values
  - do:
      esql.query:
        body:
          query: 'FROM ne_runtime_stored | NESTED_EXPAND items | KEEP items.qty, items.calc | SORT items.qty | LIMIT 10'
  - length: { values: 2 }
  - match: { values.0: [1, [3, 4]] }
  - match: { values.1: [2, [3, 4]] }

---
"LIMIT BY after NESTED_EXPAND limits the expanded rows":
  - requires:
      test_runner_features: [capabilities]
      capabilities:
        - method: POST
          path: /_query
          parameters: []
          capabilities: [esql_limit_by]
      reason: "LIMIT BY is snapshot-only"
  - do:
      esql.query:
        body:
          query: 'FROM nested_expand | NESTED_EXPAND items | LIMIT 1 BY id | KEEP id | SORT id | LIMIT 10'
  - length: { values: 2 }
  - match: { values.0: ["1"] }
  - match: { values.1: ["2"] }

---
"A child column shadows an earlier column of the same name":
  - do:
      esql.query:
        body:
          query: 'FROM nested_expand | EVAL items.qty = 100 | NESTED_EXPAND items | KEEP id, items.qty | SORT id, items.qty | LIMIT 10'
  - length: { columns: 2 }
  - match: { columns.0.name: "id" }
  - match: { columns.1.name: "items.qty" }
  - length: { values: 3 }
  - match: { values.0: ["1", 1] }
  - match: { values.1: ["1", 2] }
  - match: { values.2: ["2", null] }

---
"An unsupported child type only fails when a query reads it":
  - do:
      indices.create:
        index: ne_geo
        body:
          settings:
            number_of_shards: 1
          mappings:
            properties:
              items:
                type: nested
                properties:
                  qty:
                    type: long
                  loc:
                    type: geo_point
  - do:
      bulk:
        refresh: true
        body:
          - { "index": { "_index": "ne_geo", "_id": "a" } }
          - { "items": [ { "qty": 1, "loc": "POINT (1 2)" } ] }
  - do:
      esql.query:
        body:
          query: 'FROM ne_geo | NESTED_EXPAND items | KEEP items.qty | LIMIT 10'
  - match: { values.0: [1] }
  - do:
      catch: /NESTED_EXPAND does not support child type \[GEO_POINT\] for \[items\.loc\]/
      esql.query:
        body:
          query: 'FROM ne_geo | NESTED_EXPAND items | KEEP items.qty, items.loc | LIMIT 10'

---
"An implicit HIGHLIGHT borrows the WHERE before NESTED_EXPAND":
  - requires:
      test_runner_features: [capabilities]
      capabilities:
        - method: POST
          path: /_query
          parameters: []
          capabilities: [highlight_mapping_analyzer]
      reason: "implicit HIGHLIGHT is snapshot-only"
  - do:
      indices.create:
        index: ne_text
        body:
          settings:
            number_of_shards: 1
          mappings:
            properties:
              content:
                type: text
              items:
                type: nested
                properties:
                  qty:
                    type: long
  - do:
      bulk:
        refresh: true
        body:
          - { "index": { "_index": "ne_text", "_id": "a" } }
          - { "content": "the quick fox", "items": [ { "qty": 1 }, { "qty": 2 } ] }
  - do:
      esql.query:
        body:
          query: 'FROM ne_text | WHERE MATCH(content, "fox") | NESTED_EXPAND items | HIGHLIGHT | KEEP items.qty, highlight_content | SORT items.qty | LIMIT 10'
  - length: { values: 2 }
  - match: { values.0: [1, "the quick <em>fox</em>"] }
  - match: { values.1: [2, "the quick <em>fox</em>"] }

---
"A flattened key under a nested object is not an ordinary column":
  - requires:
      test_runner_features: [capabilities]
      capabilities:
        - method: POST
          path: /_query
          parameters: []
          capabilities: [flattened_keys]
      reason: "flattened keys are behind a feature flag"
  - do:
      indices.create:
        index: ne_flattened
        body:
          settings:
            number_of_shards: 1
          mappings:
            properties:
              items:
                type: nested
                properties:
                  qty:
                    type: long
                  attrs:
                    type: flattened
              other:
                type: nested
                properties:
                  attrs:
                    type: flattened
  - do:
      bulk:
        refresh: true
        body:
          - { "index": { "_index": "ne_flattened", "_id": "a" } }
          - { "items": [ { "qty": 1, "attrs": { "color": "red" } } ], "other": [ { "attrs": { "size": "L" } } ] }
  - do:
      catch: /Unknown column \[items\.attrs\.color\]/
      esql.query:
        body:
          query: 'FROM ne_flattened | NESTED_EXPAND items | KEEP items.qty, items.attrs.color | LIMIT 10'
  # Nor is one of another nested collection, which this query does not expand
  - do:
      catch: /Unknown column \[other\.attrs\.size\]/
      esql.query:
        body:
          query: 'FROM ne_flattened | NESTED_EXPAND items | KEEP items.qty, other.attrs.size | LIMIT 10'

---
"A column of the query named _doc does not replace the document NESTED_EXPAND reads":
  - do:
      esql.query:
        body:
          query: 'FROM nested_expand | EVAL _doc = CONCAT(id, "-user") | NESTED_EXPAND items | KEEP _doc, items.qty | SORT items.qty | LIMIT 10'
  - match: { columns.0.name: "_doc" }
  - match: { columns.0.type: "keyword" }
  - length: { values: 3 }
  - match: { values.0: ["1-user", 1] }
  - match: { values.1: ["1-user", 2] }
  - match: { values.2: ["2-user", null] }
  # A column of a LOOKUP JOIN named _doc
  - do:
      esql.query:
        body:
          query: 'FROM ne_orders_items | LOOKUP JOIN ne_lookup_note ON id | RENAME note AS _doc | NESTED_EXPAND items | KEEP _doc, items.qty | SORT items.qty | LIMIT 10'
  - length: { values: 2 }
  - match: { values.0: ["n", 1] }
  - match: { values.1: ["n", 2] }

---
"Expanding two nested fields in turn gives every pair of their objects":
  - do:
      indices.create:
        index: ne_two
        body:
          settings:
            number_of_shards: 1
          mappings:
            properties:
              id:
                type: keyword
              items:
                type: nested
                properties:
                  sku:
                    type: keyword
              events:
                type: nested
                properties:
                  start:
                    type: long
  - do:
      bulk:
        refresh: true
        body:
          - { "index": { "_index": "ne_two", "_id": "a" } }
          - { "id": "a", "items": [ { "sku": "a1" }, { "sku": "a2" } ], "events": [ { "start": 1 }, { "start": 3 } ] }
          - { "index": { "_index": "ne_two", "_id": "b" } }
          - { "id": "b", "items": [ { "sku": "b1" } ], "events": [] }
          - { "index": { "_index": "ne_two", "_id": "c" } }
          - { "id": "c" }
  - do:
      esql.query:
        body:
          query: 'FROM ne_two | NESTED_EXPAND items | NESTED_EXPAND events | KEEP id, items.sku, events.start | SORT id, items.sku, events.start | LIMIT 10'
  - match: { columns.1.name: "items.sku" }
  - match: { columns.2.name: "events.start" }
  - match: { columns.2.type: "long" }
  - length: { values: 6 }
  - match: { values.0: ["a", "a1", 1] }
  - match: { values.1: ["a", "a1", 3] }
  - match: { values.2: ["a", "a2", 1] }
  - match: { values.3: ["a", "a2", 3] }
  - match: { values.4: ["b", "b1", null] }
  - match: { values.5: ["c", null, null] }
  # The order of the expansions does not change the rows
  - do:
      esql.query:
        body:
          query: 'FROM ne_two | NESTED_EXPAND events | NESTED_EXPAND items | KEEP id, items.sku, events.start | SORT id, items.sku, events.start | LIMIT 10'
  - length: { values: 6 }
  - match: { values.0: ["a", "a1", 1] }
  - match: { values.3: ["a", "a2", 3] }
  - match: { values.4: ["b", "b1", null] }
  - match: { values.5: ["c", null, null] }
  # Fields of the collection not yet expanded are still not ordinary columns
  - do:
      catch: /Unknown column \[events\.start\]/
      esql.query:
        body:
          query: 'FROM ne_two | NESTED_EXPAND items | KEEP items.sku, events.start'
  # An expanded collection is no longer a nested field
  - do:
      catch: /requires a mapped nested field, not \[items\]/
      esql.query:
        body:
          query: 'FROM ne_two | NESTED_EXPAND items | NESTED_EXPAND items'

---
"unmapped_fields LOAD cannot load an unmapped name in a nested field":
  - requires:
      test_runner_features: [capabilities]
      capabilities:
        - method: POST
          path: /_query
          parameters: []
          capabilities: [optional_fields_fix_load_partially_mapped]
      reason: "SET unmapped_fields=load"
  - do:
      indices.create:
        index: ne_unmapped
        body:
          settings:
            number_of_shards: 1
          mappings:
            dynamic: false
            properties:
              items:
                type: nested
                dynamic: false
                properties:
                  qty:
                    type: long
  - do:
      bulk:
        refresh: true
        body:
          - { "index": { "_index": "ne_unmapped", "_id": "a" } }
          - { "note": "p", "items": [ { "qty": 1, "extra": "x" }, { "qty": 2, "extra": "y" } ] }
  # The row's _source has the values of every object, so loading the name would not give each child its own
  - do:
      catch: /unmapped_fields cannot load \[items\.extra\] in the nested field \[items\]/
      esql.query:
        body:
          query: 'SET unmapped_fields="load"; FROM ne_unmapped | NESTED_EXPAND items | KEEP items.qty, items.extra'
  - do:
      catch: /unmapped_fields cannot load \[items\.extra\] in the nested field \[items\]/
      esql.query:
        body:
          query: 'SET unmapped_fields="load"; FROM ne_unmapped | EVAL e = items.extra | NESTED_EXPAND items | KEEP items.qty, e'
  # An unmapped name outside the nested field still loads
  - do:
      esql.query:
        body:
          query: 'SET unmapped_fields="load"; FROM ne_unmapped | NESTED_EXPAND items | KEEP items.qty, note | SORT items.qty | LIMIT 10'
  - length: { values: 2 }
  - match: { values.0: [1, "p"] }
  - match: { values.1: [2, "p"] }

# NESTED_ANY(<aggregate> BY <child fields>) groups each parent's nested objects like STATS ... BY and returns one keyword
# per parent holding a JSON object: one level per key, sorted by key, the aggregate at the bottom. Children with a null
# key are left out; a parent without grouped children gets null. A multivalued key counts once per value, as in STATS.
# Grouped reductions read doc values only, never _source.
# Execute with -Desql.nested_reductions.test_execution=true. A capability skip is not a pass.
---
setup:
- requires:
    test_runner_features:
    - capabilities
    - contains
    capabilities:
    - method: POST
      path: /_query
      parameters: []
      capabilities:
      - nested_reductions
    reason: "Completed per-parent nested reductions; capability stays unadvertised unless -Desql.nested_reductions.test_execution=true"
- do:
    indices.create:
      index: ng_orders
      body:
        settings:
          number_of_shards: 1
          number_of_replicas: 0
        mappings:
          dynamic: strict
          properties:
            order_id:
              type: keyword
            region:
              type: keyword
            items:
              type: nested
              properties:
                user:
                  type: keyword
                category:
                  type: keyword
                price:
                  type: long
                tags:
                  type: keyword
- do:
    bulk:
      refresh: true
      body:
      - index:
          _index: ng_orders
          _id: a
      - order_id: a
        region: west
        items:
        - { user: bob, category: book, price: 10 }
        - { user: bob, category: game, price: 20 }
        - { user: james, category: book, price: 5 }
      - index:
          _index: ng_orders
          _id: b
      - order_id: b
        region: east
        items:
        - { user: james, category: pen, price: 3, tags: [x, y] }
        - { user: james, category: pen }
      - index:
          _index: ng_orders
          _id: c
      - order_id: c
        region: west
        items: []
      - index:
          _index: ng_orders
          _id: d
      - order_id: d
        region: east
      - index:
          _index: ng_orders
          _id: e
      - order_id: e
        region: west
        items:
        - { category: book, price: 7 }

---
count by one key:
- do:
    esql.query:
      body:
        query: FROM ng_orders | EVAL by_user = NESTED_ANY(COUNT(*) BY items.user) | KEEP order_id, by_user | SORT order_id | LIMIT 10
- match:
    columns:
    - name: order_id
      type: keyword
    - name: by_user
      type: keyword
- match:
    values:
    - [a, '{"bob":2,"james":1}']
    - [b, '{"james":2}']
    - [c, null]
    - [d, null]
    - [e, null]

---
sum by two keys nests one level per key:
- do:
    esql.query:
      body:
        query: FROM ng_orders | EVAL spend = NESTED_ANY(SUM(items.price) BY items.user, items.category) | KEEP order_id, spend | SORT order_id
          | LIMIT 10
- match:
    values:
    - [a, '{"bob":{"book":10,"game":20},"james":{"book":5}}']
    - [b, '{"james":{"pen":3}}']
    - [c, null]
    - [d, null]
    - [e, null]

---
count of a field, min and max by key:
- do:
    esql.query:
      body:
        query: FROM ng_orders | WHERE order_id IN ("a", "b") | EVAL n = NESTED_ANY(COUNT(items.price) BY items.user), lo = NESTED_ANY(MIN(items.price)
          BY items.user), hi = NESTED_ANY(MAX(items.price) BY items.user) | KEEP order_id, n, lo, hi | SORT order_id | LIMIT 10
- match:
    values:
    - [a, '{"bob":2,"james":1}', '{"bob":10,"james":5}', '{"bob":20,"james":5}']
    - [b, '{"james":1}', '{"james":3}', '{"james":3}']

---
a multivalued key counts once per value:
- do:
    esql.query:
      body:
        query: FROM ng_orders | WHERE order_id == "b" | EVAL by_tag = NESTED_ANY(COUNT(*) BY items.tags) | KEEP by_tag | LIMIT 10
- match:
    values:
    - ['{"x":1,"y":1}']

---
one group can be read back with JSON_EXTRACT:
- do:
    esql.query:
      body:
        query: FROM ng_orders | WHERE order_id == "a" | EVAL by_user = NESTED_ANY(COUNT(*) BY items.user) | EVAL bob = JSON_EXTRACT(by_user,
          "bob") | KEEP bob | LIMIT 10
- match:
    values:
    - ["2"]

---
grouped reductions run below sort and limit:
- do:
    esql.query:
      body:
        query: FROM ng_orders | SORT order_id | LIMIT 1 | EVAL by_user = NESTED_ANY(COUNT(*) BY items.user) | KEEP by_user
- match:
    values:
    - ['{"bob":2,"james":1}']

---
BY is only allowed inside NESTED_ANY:
- do:
    catch: bad_request
    esql.query:
      body:
        query: FROM ng_orders | EVAL x = MV_COUNT(order_id BY region) | LIMIT 10
- match:
    error.type: parsing_exception
- contains:
    error.reason: "BY is only allowed inside NESTED_ANY"

---
a grouping key must be inside the nested scope:
- do:
    catch: bad_request
    esql.query:
      body:
        query: FROM ng_orders | EVAL x = NESTED_ANY(COUNT(*) BY region) | LIMIT 10
- match:
    error.type: verification_exception
- contains:
    error.reason: "outside the nested scope"

---
a grouping key must be a child field:
- do:
    catch: bad_request
    esql.query:
      body:
        query: FROM ng_orders | EVAL x = NESTED_ANY(COUNT(*) BY TO_UPPER(items.user)) | LIMIT 10
- match:
    error.type: verification_exception
- contains:
    error.reason: "NESTED_ANY BY requires child fields"

---
grouping supports COUNT, SUM, MIN and MAX:
- do:
    catch: bad_request
    esql.query:
      body:
        query: FROM ng_orders | EVAL x = NESTED_ANY(AVG(items.price) BY items.user) | LIMIT 10
- match:
    error.type: verification_exception
- contains:
    error.reason: "NESTED_ANY BY supports COUNT, SUM, MIN and MAX"

---
grouping requires an aggregate:
- do:
    catch: bad_request
    esql.query:
      body:
        query: FROM ng_orders | EVAL x = NESTED_ANY(items.price > 0 BY items.user) | LIMIT 10
- match:
    error.type: verification_exception
- contains:
    error.reason: "NESTED_ANY BY supports COUNT, SUM, MIN and MAX"

---
grouped reductions never read _source:
- do:
    catch: bad_request
    esql.query:
      body:
        query: FROM ng_orders | EVAL by_user = NESTED_ANY(COUNT(*) BY items.user) | KEEP by_user | LIMIT 10
        pragma:
          nested_loader: source
- contains:
    error.reason: "NESTED_ANY BY reads doc values only"

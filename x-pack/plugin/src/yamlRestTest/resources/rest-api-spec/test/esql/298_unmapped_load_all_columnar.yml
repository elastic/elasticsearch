---
setup:
  - requires:
      test_runner_features: [ capabilities ]
      capabilities:
        - method: POST
          path: /_query
          parameters: [ ]
          capabilities: [ optional_fields_load_all_single_source_column, optional_fields_load_all_column_from_shard, optional_fields_load_all_v2 ]
      reason: >
        Columnar index mode (index.mode=columnar) is a 9.5+ tech preview feature.
        optional_fields_load_all_v2 post-dates 9.5. In strict columnar mode the generic
        _ignored_source is disabled and dynamic:false is rejected, so a columnar index keeps
        no unmapped field for LOAD_ALL to recover at query time.

  # Standard mode (default), dynamic:false, foo mapped. bar is unmapped and lands in _source.
  - do:
      indices.create:
        index: unmapped-idx-std
        body:
          mappings:
            dynamic: false
            properties:
              foo:
                type: keyword

  - do:
      index:
        index: unmapped-idx-std
        id: "1"
        refresh: true
        body:
          foo: "a1"
          bar: "b1"

  # Columnar mode, dynamic:strict, bar mapped. foo is absent.
  - do:
      indices.create:
        index: unmapped-idx-col
        body:
          settings:
            index:
              mode: columnar
          mappings:
            dynamic: strict
            properties:
              bar:
                type: keyword

  - do:
      index:
        index: unmapped-idx-col
        id: "1"
        refresh: true
        body:
          bar: "b2"

---
teardown:
  - do:
      indices.delete:
        index: unmapped-idx-std,unmapped-idx-col
        ignore_unavailable: true

---
'standard leg loads unmapped from source, columnar leg yields null':
  # LOAD_ALL reads bar from unmapped-idx-std (standard, keeps full _source) but finds no foo in
  # unmapped-idx-col (strict columnar, keeps no unmapped field). The cross-index result
  # proves the boundary: b1 flows from the standard leg, foo from the columnar leg is null.
  - do:
      esql.query:
        body:
          query: 'SET unmapped_fields="LOAD_ALL"; FROM unmapped-idx-std, unmapped-idx-col METADATA _index | SORT foo NULLS LAST, bar NULLS LAST | LIMIT 5'
  - length: { columns: 4 }
  - match: { columns.0.name: bar }
  - match: { columns.0.type: keyword }
  - match: { columns.1.name: foo }
  - match: { columns.1.type: keyword }
  - match: { columns.2.name: _index }
  - match: { columns.2.type: keyword }
  - match: { columns.3.name: _unmapped_fields }
  - match: { columns.3.type: _source }
  # bar and foo are each mapped in one of the indices, so neither is left over for the _unmapped_fields object.
  - match: { values.0: [ "b1", "a1", "unmapped-idx-std", null ] }
  - match: { values.1: [ "b2", null, "unmapped-idx-col", null ] }

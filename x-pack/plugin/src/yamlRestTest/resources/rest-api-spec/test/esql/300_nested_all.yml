# NESTED_ALL(<predicate>) is true when the predicate is true for every nested object: true with no objects, and false when the
# predicate is false or null for any of them. In WHERE it runs in Lucene as NOT nested(NOT predicate). NESTED_ANY and NESTED_ALL
# take predicates only; reductions such as SUM go in NESTED.
# Execute with -Desql.nested_reductions.test_execution=true. A capability skip is not a pass.
---
setup:
- requires:
    test_runner_features:
    - capabilities
    - contains
    capabilities:
    - method: POST
      path: /_query
      parameters: []
      capabilities:
      - nested_reductions
    reason: "Completed per-parent nested reductions; capability stays unadvertised unless -Desql.nested_reductions.test_execution=true"
- do:
    indices.create:
      index: na_orders
      body:
        settings:
          number_of_shards: 1
          number_of_replicas: 0
        mappings:
          dynamic: strict
          properties:
            id:
              type: keyword
            items:
              type: nested
              properties:
                price:
                  type: long
                sku:
                  type: keyword
- do:
    bulk:
      refresh: true
      body:
      - index:
          _index: na_orders
          _id: a
      - id: a
        items:
        - { price: 20, sku: book }
        - { price: 30, sku: pen }
      - index:
          _index: na_orders
          _id: b
      - id: b
        items:
        - { price: 20, sku: book }
        - { price: 5, sku: pen }
      - index:
          _index: na_orders
          _id: c
      - id: c
      - index:
          _index: na_orders
          _id: d
      - id: d
        items: []
      - index:
          _index: na_orders
          _id: e
      - id: e
        items:
        - { price: 20, sku: book }
        - { sku: cup }

---
every nested object matches:
- do:
    esql.query:
      body:
        query: FROM na_orders | EVAL cheap = NESTED_ALL(items.price > 10) | KEEP id, cheap | SORT id | LIMIT 10
- match:
    columns:
    - name: id
      type: keyword
    - name: cheap
      type: boolean
- match:
    values:
    - [a, true]
    - [b, false]
    - [c, true]
    - [d, true]
    - [e, false]

---
the source loader gives the same answer:
- do:
    esql.query:
      body:
        query: FROM na_orders | EVAL cheap = NESTED_ALL(items.price > 10) | KEEP id, cheap | SORT id | LIMIT 10
        pragma:
          nested_loader: source
- match:
    values:
    - [a, true]
    - [b, false]
    - [c, true]
    - [d, true]
    - [e, false]

---
the filter is pushed to Lucene:
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM na_orders | WHERE NESTED_ALL(items.price > 10) | KEEP id | SORT id | LIMIT 10
- match:
    values:
    - [a]
    - [c]
    - [d]
- match: { documents_found: 3 }

---
an untranslatable predicate filters in memory:
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM na_orders | WHERE NESTED_ALL(items.price + 1 > 11) | KEEP id | SORT id | LIMIT 10
- match:
    values:
    - [a]
    - [c]
    - [d]
- match: { documents_found: 5 }

---
some nested object does not match:
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM na_orders | WHERE NOT NESTED_ALL(items.price > 10) | KEEP id | SORT id | LIMIT 10
- match:
    values:
    - [b]
    - [e]

---
a named collection:
- do:
    esql.query:
      allow_partial_results: false
      body:
        query: FROM na_orders | WHERE NESTED_ALL(items, items.sku != "pen") | KEEP id | SORT id | LIMIT 10
- match:
    values:
    - [c]
    - [d]
    - [e]
- match: { documents_found: 3 }

---
NESTED_ALL takes a predicate:
- do:
    catch: bad_request
    esql.query:
      body:
        query: FROM na_orders | EVAL x = NESTED_ALL(SUM(items.price)) | LIMIT 1
- contains:
    error.reason: "NESTED_ALL takes a predicate; use NESTED for a reduction such as SUM"

---
NESTED_ANY takes a predicate:
- do:
    catch: bad_request
    esql.query:
      body:
        query: FROM na_orders | EVAL x = NESTED_ANY(SUM(items.price)) | LIMIT 1
- contains:
    error.reason: "NESTED_ANY takes a predicate; use NESTED for a reduction such as SUM"

---
a value is not a predicate:
- do:
    catch: bad_request
    esql.query:
      body:
        query: FROM na_orders | EVAL x = NESTED_ALL(items.price) | LIMIT 1
- contains:
    error.reason: "NESTED_ALL requires a predicate, not [items.price]"

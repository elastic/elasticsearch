---
setup:
  - requires:
      test_runner_features: [ capabilities, allowed_warnings_regex ]
      capabilities:
        - method: POST
          path: /_query
          parameters: [ ]
          capabilities: [ optional_fields_load_all_single_source_column, optional_fields_load_all_v2 ]
      reason: >
        LOAD_ALL returns the discovered leaves as one flattened JSON object, keeping the JSON scalar type of each value and
        turning an array into a JSON array, so the JSON *shape* of a value in _source, not the type it would have been
        mapped to, decides the output. These shapes cannot be written in a
        csv-spec data file: CsvTestsDataLoader#toJson quotes any non-numeric cell, so a JSON boolean, an
        exponent-form double or a negative zero is unreachable there.
        Every query here deliberately avoids naming a discovered field. An all-literal KEEP makes
        UnmappedFieldsPattern NONE (see UnmappedFieldsPattern#forKeep), which switches discovery off
        entirely and leaves the values to be served by the LOAD demand path that unmapped_fields="load"
        shares - so a literal KEEP would test the wrong half of the feature. Wildcards and bare projections
        keep the pattern non-NONE.
        The stored and synthetic indices carry identical documents so the two source modes can be asserted
        to agree: under synthetic source these values survive only because _ignored_source keeps the raw
        XContent of a dynamic:false field verbatim.

  - do:
      indices.create:
        index: la_values_stored
        body:
          mappings:
            dynamic: false
            properties:
              id:
                type: keyword

  - do:
      indices.create:
        index: la_values_synth
        body:
          settings:
            index:
              mapping:
                source:
                  mode: synthetic
          mappings:
            dynamic: false
            properties:
              id:
                type: keyword

  - do:
      bulk:
        refresh: true
        body:
          - { "index": { "_index": "la_values_stored", "_id": "1" } }
          - {
              "id": "1",
              "b_true": true,
              "b_false": false,
              "i_small": 7,
              "i_long": 3000000000,
              "i_huge": 18446744073709551615,
              "d_one": 1.0,
              "d_frac": 1.5,
              "d_exp": 1.0e3,
              "d_neg_zero": -0.0,
              "d_precise": 1.2345678901234567,
              "s_num": "7",
              "s_bool": "true"
            }
          - { "index": { "_index": "la_values_synth", "_id": "1" } }
          - {
              "id": "1",
              "b_true": true,
              "b_false": false,
              "i_small": 7,
              "i_long": 3000000000,
              "i_huge": 18446744073709551615,
              "d_one": 1.0,
              "d_frac": 1.5,
              "d_exp": 1.0e3,
              "d_neg_zero": -0.0,
              "d_precise": 1.2345678901234567,
              "s_num": "7",
              "s_bool": "true"
            }

  # Key-name edge cases kept in their own index so that one surprising key cannot take the value-rendering
  # tests down with it.
  - do:
      indices.create:
        index: la_keys
        body:
          mappings:
            dynamic: false
            properties:
              id:
                type: keyword

  - do:
      bulk:
        refresh: true
        body:
          - { "index": { "_index": "la_keys", "_id": "1" } }
          - { "id": "1", "dot.path": "literal", "dot": { "path": "nested" } }
          - { "index": { "_index": "la_keys", "_id": "2" } }
          - { "id": "2", "l1": { "l2": { "l3": { "l4": { "l5": "deep" } } } } }
          - { "index": { "_index": "la_keys", "_id": "3" } }
          - { "id": "3", "mixed": [ "scalar", { "sub": "from_object" } ] }
          - { "index": { "_index": "la_keys", "_id": "4" } }
          - { "id": "4", "Case": "upper", "case": "lower", "wild*card": "star", "with space": "spaced" }

---
teardown:
  - do:
      indices.delete:
        index: la_values_stored,la_values_synth,la_keys
        ignore_unavailable: true

---
'JSON scalar shapes keep their JSON type (stored source)':
  - do:
      esql.query:
        body:
          query: 'SET unmapped_fields="LOAD_ALL"; FROM la_values_stored | LIMIT 5'
  - length: { columns: 2 }
  - match: { columns.0.name: id }
  - match: { columns.1.name: _unmapped_fields }
  - match: { columns.1.type: _source }
  - match: { values.0.0: "1" }
  - match: { values.0.1.b_false: false }
  - match: { values.0.1.b_true: true }
  - match: { values.0.1.d_exp: 1000.0 }
  - match: { values.0.1.d_frac: 1.5 }
  - match: { values.0.1.d_neg_zero: -0.0 }
  - match: { values.0.1.d_one: 1.0 }
  - match: { values.0.1.d_precise: 1.2345678901234567 }
  - match: { values.0.1.i_huge: 18446744073709551615 }
  - match: { values.0.1.i_long: 3000000000 }
  - match: { values.0.1.i_small: 7 }
  # A JSON string stays a string even when it looks like a number or a boolean.
  - match: { values.0.1.s_bool: "true" }
  - match: { values.0.1.s_num: "7" }

---
'JSON scalar shapes are identical from synthetic source':
  # Same document, synthetic source. The values are only reachable because dynamic:false routes them to
  # _ignored_source, which stores the raw XContent - so no mapper normalisation (boolean coercion, date
  # formatting, scaled_float rounding) can get between _source and the output here.
  - do:
      esql.query:
        body:
          query: 'SET unmapped_fields="LOAD_ALL"; FROM la_values_synth | LIMIT 5'
  - length: { columns: 2 }
  - match: { values.0.0: "1" }
  - match: { values.0.1.b_false: false }
  - match: { values.0.1.b_true: true }
  - match: { values.0.1.d_exp: 1000.0 }
  - match: { values.0.1.d_frac: 1.5 }
  - match: { values.0.1.d_neg_zero: -0.0 }
  - match: { values.0.1.d_one: 1.0 }
  - match: { values.0.1.d_precise: 1.2345678901234567 }
  - match: { values.0.1.i_huge: 18446744073709551615 }
  - match: { values.0.1.i_long: 3000000000 }
  - match: { values.0.1.i_small: 7 }
  - match: { values.0.1.s_bool: "true" }
  - match: { values.0.1.s_num: "7" }

---
'a literal dotted key and the nested form of the same path merge into one array value':
  - do:
      allowed_warnings_regex:
        - "No limit defined, adding default limit of \\[.*\\]"

      esql.query:
        body:
          query: 'SET unmapped_fields="LOAD_ALL"; FROM la_keys | WHERE id == "1"'
  - length: { columns: 2 }
  - length: { values: 1 }
  - match: { columns.0.name: id }
  - match: { columns.1.name: _unmapped_fields }
  - match: { columns.1.type: _source }
  - match: { values.0.0: "1" }
  - match: { values.0.1: { dot.path: [ nested, literal ] } }

---
'five levels of nesting flatten to one dotted leaf':
  - do:
      allowed_warnings_regex:
        - "No limit defined, adding default limit of \\[.*\\]"

      esql.query:
        body:
          query: 'SET unmapped_fields="LOAD_ALL"; FROM la_keys | WHERE id == "2" | KEEP id, l1.*'
  - length: { columns: 2 }
  - match: { columns.1.name: _unmapped_fields }
  - match: { columns.1.type: _source }
  - match: { values.0: [ "2", { l1.l2.l3.l4.l5: deep } ] }

---
'an array of one scalar and one object yields the parent and a dotted leaf in the same object':
  - do:
      allowed_warnings_regex:
        - "No limit defined, adding default limit of \\[.*\\]"

      esql.query:
        body:
          query: 'SET unmapped_fields="LOAD_ALL"; FROM la_keys | WHERE id == "3" | KEEP id, mixed*'
  - length: { columns: 2 }
  - match: { columns.1.name: _unmapped_fields }
  - match: { columns.1.type: _source }
  - match: { values.0: [ "3", { mixed: scalar, mixed.sub: from_object } ] }

---
'keys differing only by case stay distinct, and a wildcard character in a key is matched literally':
  - do:
      allowed_warnings_regex:
        - "No limit defined, adding default limit of \\[.*\\]"

      esql.query:
        body:
          query: 'SET unmapped_fields="LOAD_ALL"; FROM la_keys | WHERE id == "4"'
  - length: { columns: 2 }
  - match: { columns.0.name: id }
  - match: { columns.1.name: _unmapped_fields }
  - match: { values.0: [ "4", { Case: upper, case: lower, "wild*card": star, "with space": spaced } ] }

# Outside the nested functions, a field under a nested object is an ordinary multivalued column holding the values of all of
# the parent's objects, like a field under a plain object. The nested functions and NESTED_EXPAND are the only places where it
# means one value per object. The nested object itself is not a column.
---
setup:
- requires:
    test_runner_features:
    - capabilities
    - allowed_warnings_regex
    - warnings
    capabilities:
    - method: POST
      path: /_query
      parameters: []
      capabilities:
      - nested_flattened_leaves
    reason: "Fields under a nested object read as flattened multivalued columns"
- do:
    indices.create:
      index: nf_nested
      body:
        settings:
          number_of_shards: 1
          number_of_replicas: 0
        mappings:
          dynamic: strict
          properties:
            id:
              type: keyword
            items:
              type: nested
              properties:
                price:
                  type: long
                sku:
                  type: keyword
- do:
    indices.create:
      index: nf_object
      body:
        settings:
          number_of_shards: 1
          number_of_replicas: 0
        mappings:
          dynamic: strict
          properties:
            id:
              type: keyword
            items:
              properties:
                price:
                  type: long
                sku:
                  type: keyword
- do:
    bulk:
      refresh: true
      body:
      - index:
          _index: nf_nested
          _id: a
      - id: a
        items:
        - { price: 10, sku: x }
        - { price: 20, sku: y }
      - index:
          _index: nf_nested
          _id: b
      - id: b
        items:
        - { price: 5, sku: z }
      - index:
          _index: nf_nested
          _id: c
      - id: c
      - index:
          _index: nf_object
          _id: d
      - id: d
        items: { price: 7, sku: w }

---
leaves are multivalued columns:
- do:
    esql.query:
      body:
        query: FROM nf_nested | KEEP id, items.price, items.sku | SORT id | LIMIT 10
- match: { columns.1.name: items.price }
- match: { columns.1.type: long }
- match: { columns.2.name: items.sku }
- match: { columns.2.type: keyword }
- match:
    values:
    - [a, [10, 20], [x, y]]
    - [b, 5, z]
    - [c, null, null]

---
wildcard includes the leaves but not the nested object:
- do:
    esql.query:
      body:
        query: FROM nf_nested | SORT id | LIMIT 10
- length: { columns: 3 }
- match: { columns.0.name: id }
- match: { columns.1.name: items.price }
- match: { columns.2.name: items.sku }

---
the nested object is not a column:
- do:
    catch: /Unknown column \[items\]/
    esql.query:
      body:
        query: FROM nf_nested | KEEP items

---
equality reads the children rather than the parent:
- do:
    allowed_warnings_regex:
    - "Line 1:.*: evaluation of \\[.*\\] failed, treating result as null. Only first 20 failures recorded."
    - "Line 1:.*: java.lang.IllegalArgumentException: single-value function encountered multi-value"
    esql.query:
      body:
        query: FROM nf_nested | WHERE items.sku == "z" | KEEP id | LIMIT 10
- match:
    values:
    - [b]

---
is not null reads the children:
- do:
    esql.query:
      body:
        query: FROM nf_nested | WHERE items.price IS NOT NULL | KEEP id | SORT id | LIMIT 10
- match:
    values:
    - [a]
    - [b]

---
sort reads the children:
- do:
    esql.query:
      body:
        query: FROM nf_nested | SORT items.price ASC NULLS LAST, id | KEEP id | LIMIT 10
- match:
    values:
    - [b]
    - [a]
    - [c]

---
count alone counts every child value:
- do:
    allowed_warnings_regex:
    - "No limit defined, adding default limit of \\[.*\\]"
    esql.query:
      body:
        query: FROM nf_nested | STATS c = COUNT(items.price)
- match:
    values:
    - [3]

---
aggregates read every child value:
- do:
    allowed_warnings_regex:
    - "No limit defined, adding default limit of \\[.*\\]"
    esql.query:
      body:
        query: FROM nf_nested | STATS c = COUNT(items.price), s = SUM(items.price), lo = MIN(items.price), hi = MAX(items.price)
- match:
    values:
    - [3, 35, 5, 20]

---
grouping by a leaf groups by each child value:
- do:
    esql.query:
      body:
        query: FROM nf_nested | STATS n = COUNT(*) BY items.sku | SORT items.sku | LIMIT 10
- match:
    values:
    - [1, x]
    - [1, y]
    - [1, z]
    - [1, null]

---
a path nested in one index and an object in another:
- do:
    esql.query:
      body:
        query: FROM nf_nested, nf_object | KEEP id, items.price | SORT id | LIMIT 10
- match: { columns.1.type: long }
- match:
    values:
    - [a, [10, 20]]
    - [b, 5]
    - [c, null]
    - [d, 7]
- do:
    allowed_warnings_regex:
    - "Line 1:.*: evaluation of \\[.*\\] failed, treating result as null. Only first 20 failures recorded."
    - "Line 1:.*: java.lang.IllegalArgumentException: single-value function encountered multi-value"
    esql.query:
      body:
        query: FROM nf_nested, nf_object | WHERE items.price == 5 OR items.price == 7 | KEEP id | SORT id | LIMIT 10
- match:
    values:
    - [b]
    - [d]
- do:
    allowed_warnings_regex:
    - "No limit defined, adding default limit of \\[.*\\]"
    esql.query:
      body:
        query: FROM nf_nested, nf_object | STATS c = COUNT(items.price), s = SUM(items.price)
- match:
    values:
    - [4, 42]

---
nested functions read the same column one value per child:
- requires:
    capabilities:
    - method: POST
      path: /_query
      parameters: []
      capabilities:
      - nested_reductions
    reason: "Capability stays unadvertised unless -Desql.nested_reductions.test_execution=true"
- do:
    esql.query:
      body:
        query: |
          FROM nf_nested
          | EVAL total = NESTED(SUM(items.price)), cheap = NESTED_ANY(items.price < 8)
          | KEEP id, total, cheap, items.price
          | SORT id
          | LIMIT 10
- match:
    values:
    - [a, 30, false, [10, 20]]
    - [b, 5, true, 5]
    - [c, null, false, null]

---
NESTED_EXPAND turns the flattened column into one value per row:
- requires:
    capabilities:
    - method: POST
      path: /_query
      parameters: []
      capabilities:
      - nested_expand
    reason: "Capability stays unadvertised unless -Desql.nested_reductions.test_execution=true"
- do:
    esql.query:
      body:
        query: FROM nf_nested | NESTED_EXPAND items | KEEP id, items.price, items.sku | SORT id, items.price | LIMIT 10
- match:
    values:
    - [a, 10, x]
    - [a, 20, y]
    - [b, 5, z]
    - [c, null, null]

---
include_in_root reads each child value once:
# include_in_root copies the child values onto the parent document. Reading both, or pushing a query or a count down
# to the parent, would count them twice.
- do:
    indices.create:
      index: nf_root
      body:
        settings:
          number_of_shards: 1
          number_of_replicas: 0
        mappings:
          dynamic: strict
          properties:
            id:
              type: keyword
            items:
              type: nested
              include_in_root: true
              properties:
                price:
                  type: long
- do:
    bulk:
      refresh: true
      body:
      - index:
          _index: nf_root
          _id: r
      - id: r
        items:
        - { price: 100 }
        - { price: 101 }
- do:
    esql.query:
      body:
        query: FROM nf_root, nf_object | KEEP id, items.price | SORT id | LIMIT 10
- match:
    values:
    - [d, 7]
    - [r, [100, 101]]
- do:
    allowed_warnings_regex:
    - "No limit defined, adding default limit of \\[.*\\]"
    esql.query:
      body:
        query: FROM nf_root, nf_object | STATS c = COUNT(items.price), s = SUM(items.price)
- match: { values: [[3, 208]] }
- do:
    allowed_warnings_regex:
    - "No limit defined, adding default limit of \\[.*\\]"
    esql.query:
      body:
        query: FROM nf_root, nf_object | STATS c = COUNT(items.price)
- match: { values: [[3]] }
- do:
    allowed_warnings_regex:
    - "No limit defined, adding default limit of \\[.*\\]"
    - "Line 1:.*: evaluation of \\[.*\\] failed, treating result as null. Only first 20 failures recorded."
    - "Line 1:.*: java.lang.IllegalArgumentException: single-value function encountered multi-value"
    esql.query:
      body:
        query: FROM nf_root, nf_object | WHERE items.price == 7 OR items.price IS NULL | KEEP id
- match: { values: [[d]] }

---
a deep path under a nested object:
- do:
    indices.create:
      index: nf_deep
      body:
        settings:
          number_of_shards: 1
          number_of_replicas: 0
        mappings:
          dynamic: strict
          properties:
            a:
              type: nested
              properties:
                b:
                  properties:
                    c:
                      type: long
- do:
    bulk:
      refresh: true
      body:
      - index:
          _index: nf_deep
      - a:
        - { b: { c: 1 } }
        - { b: { c: 2 } }
- do:
    esql.query:
      body:
        query: FROM nf_deep | KEEP a.b.c | LIMIT 10
- match: { values: [[[1, 2]]] }

---
a nested object inside a nested object:
- do:
    indices.create:
      index: nf_double
      body:
        settings:
          number_of_shards: 1
          number_of_replicas: 0
        mappings:
          dynamic: strict
          properties:
            outer:
              type: nested
              properties:
                tag:
                  type: keyword
                inner:
                  type: nested
                  properties:
                    v:
                      type: long
- do:
    bulk:
      refresh: true
      body:
      - index:
          _index: nf_double
      - outer:
        - { tag: p, inner: [ { v: 1 }, { v: 2 } ] }
        - { tag: q, inner: [ { v: 3 } ] }
- do:
    esql.query:
      body:
        query: FROM nf_double | KEEP outer.tag, outer.inner.v | LIMIT 10
- match: { values: [[[p, q], [1, 2, 3]]] }

---
a leaf the children can't be read for is null with a warning:
# The child documents are read from doc values, which text fields don't have. A cast across a type conflict is converted
# as it is loaded, which the child values are not.
- do:
    indices.create:
      index: nf_text
      body:
        settings:
          number_of_shards: 1
          number_of_replicas: 0
        mappings:
          dynamic: strict
          properties:
            items:
              type: nested
              properties:
                note:
                  type: text
- do:
    indices.create:
      index: nf_int
      body:
        settings:
          number_of_shards: 1
          number_of_replicas: 0
        mappings:
          dynamic: strict
          properties:
            id:
              type: keyword
            items:
              properties:
                price:
                  type: integer
- do:
    bulk:
      refresh: true
      body:
      - index:
          _index: nf_text
      - items:
        - { note: hello }
      - index:
          _index: nf_int
          _id: e
      - id: e
        items: { price: 3 }
- do:
    warnings:
    - "Field [items.note] cannot be retrieved, it is unsupported or not indexed; returning null"
    esql.query:
      body:
        query: FROM nf_text | KEEP items.note | LIMIT 10
- match: { values: [[null]] }
- do:
    warnings:
    - "Field [items.price] cannot be retrieved, it is unsupported or not indexed; returning null"
    esql.query:
      body:
        query: FROM nf_nested, nf_int | EVAL p = items.price::long | KEEP id, p | SORT id | LIMIT 10
- match:
    values:
    - [a, null]
    - [b, null]
    - [c, null]
    - [e, 3]
# Without a cast the conflict is unsupported, which is null everywhere, the nested index included.
- do:
    esql.query:
      body:
        query: FROM nf_nested, nf_int | KEEP id, items.price | SORT id | LIMIT 10
- match: { columns.1.type: unsupported }
- match:
    values:
    - [a, null]
    - [b, null]
    - [c, null]
    - [e, null]

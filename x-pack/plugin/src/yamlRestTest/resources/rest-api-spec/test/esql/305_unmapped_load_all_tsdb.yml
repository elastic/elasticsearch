---
setup:
  - requires:
      test_runner_features: [ capabilities, contains ]
      capabilities:
        - method: POST
          path: /_query
          parameters: [ ]
          capabilities: [ optional_fields_load_all_v2 ]
      reason: >
        index.mode=time_series defaults _source to synthetic and, like logsdb, leaves isStrictColumnar() false -
        so a dynamic:false field survives in _ignored_source and LOAD_ALL can recover it

  - do:
      indices.create:
        index: la_tsdb
        body:
          settings:
            index:
              mode: time_series
              routing_path: [ dim ]
              time_series:
                start_time: "2024-01-01T00:00:00Z"
                end_time: "2024-01-02T00:00:00Z"
          mappings:
            dynamic: false
            properties:
              "@timestamp":
                type: date
              dim:
                type: keyword
                time_series_dimension: true
              gauge:
                type: long
                time_series_metric: gauge

  - do:
      indices.create:
        index: la_tsdb_stored
        body:
          settings:
            index:
              mode: time_series
              routing_path: [ dim ]
              time_series:
                start_time: "2024-01-01T00:00:00Z"
                end_time: "2024-01-02T00:00:00Z"
              mapping:
                source:
                  mode: stored
          mappings:
            dynamic: false
            properties:
              "@timestamp":
                type: date
              dim:
                type: keyword
                time_series_dimension: true
              gauge:
                type: long
                time_series_metric: gauge

  - do:
      bulk:
        refresh: true
        body:
          - { "index": { "_index": "la_tsdb" } }
          - { "@timestamp": "2024-01-01T12:00:00.000Z", "dim": "d1", "gauge": 11, "extra_dim": "e1", "labels": { "az": "eu-1" }, "samples": [ 3, 1, 3 ] }
          - { "index": { "_index": "la_tsdb" } }
          - { "@timestamp": "2024-01-01T13:00:00.000Z", "dim": "d2", "gauge": 22, "extra_dim": "e2", "labels": { "az": "eu-2" }, "samples": [ 4 ] }
          - { "index": { "_index": "la_tsdb_stored" } }
          - { "@timestamp": "2024-01-01T12:00:00.000Z", "dim": "d1", "gauge": 11, "extra_dim": "e1", "labels": { "az": "eu-1" }, "samples": [ 3, 1, 3 ] }
          - { "index": { "_index": "la_tsdb_stored" } }
          - { "@timestamp": "2024-01-01T13:00:00.000Z", "dim": "d2", "gauge": 22, "extra_dim": "e2", "labels": { "az": "eu-2" }, "samples": [ 4 ] }

---
teardown:
  - do:
      indices.delete:
        index: la_tsdb,la_tsdb_stored
        ignore_unavailable: true

---
'tsdb: dynamic:false fields are recovered from _ignored_source under synthetic source':
  - do:
      esql.query:
        body:
          query: 'SET unmapped_fields="LOAD_ALL"; FROM la_tsdb | KEEP dim, extra_dim*, labels.*, samples* | SORT dim | LIMIT 5'
  - length: { columns: 4 }
  - match: { columns.0.name: dim }
  - match: { columns.0.type: keyword }
  - match: { columns.1.name: extra_dim }
  - match: { columns.1.type: keyword }
  - match: { columns.2.name: labels.az }
  - match: { columns.3.name: samples }
  - match: { values.0: [ "d1", "e1", "eu-1", [ "3", "1", "3" ] ] }
  - match: { values.1: [ "d2", "e2", "eu-2", "4" ] }

---
'tsdb with stored source agrees with tsdb with synthetic source':
  - do:
      esql.query:
        body:
          query: 'SET unmapped_fields="LOAD_ALL"; FROM la_tsdb_stored | KEEP dim, extra_dim*, labels.*, samples* | SORT dim | LIMIT 5'
  - length: { columns: 4 }
  - match: { values.0: [ "d1", "e1", "eu-1", [ "3", "1", "3" ] ] }
  - match: { values.1: [ "d2", "e2", "eu-2", "4" ] }

---
'tsdb: a dimension keeps its keyword type and a metric keeps its long type alongside discovered columns':
  # The mapped columns must be untouched by discovery: dim stays a dimension keyword and gauge stays a long,
  # while extra_dim - which looks like a dimension but was never mapped as one - is a plain discovered keyword.
  - do:
      esql.query:
        body:
          query: 'SET unmapped_fields="LOAD_ALL"; FROM la_tsdb | SORT dim | LIMIT 5'
  - length: { columns: 6 }
  - match: { columns.0.name: "@timestamp" }
  - match: { columns.0.type: date }
  - match: { columns.1.name: dim }
  - match: { columns.1.type: keyword }
  - match: { columns.2.name: gauge }
  - match: { columns.2.type: long }
  - match: { columns.3.name: extra_dim }
  - match: { columns.3.type: keyword }
  - match: { columns.4.name: labels.az }
  - match: { columns.4.type: keyword }
  - match: { columns.5.name: samples }
  - match: { columns.5.type: keyword }

---
'tsdb: STATS over a discovered column':
  # Under LOAD_ALL a top-level STATS makes the pattern NONE, so the discovered column has to be demanded by
  # name for the aggregation to see it at all
  - do:
      esql.query:
        body:
          query: 'SET unmapped_fields="LOAD_ALL"; FROM la_tsdb | STATS n = COUNT(*), g = SUM(gauge) BY labels.az | SORT `labels.az` | LIMIT 10'
  - length: { columns: 3 }
  - match: { columns.0.name: n }
  - match: { columns.1.name: g }
  - match: { columns.2.name: labels.az }
  - match: { columns.2.type: keyword }
  - match: { values.0: [ 1, 11, "eu-1" ] }
  - match: { values.1: [ 1, 22, "eu-2" ] }

---
'the TS command is rejected under LOAD_ALL even though FROM over the same tsdb index works':
  # A plain FROM over a time_series index yields a standard-mode relation, which is why every test above passes;
  # the TS command yields a TIME_SERIES relation and is refused.
  - do:
      catch: bad_request
      esql.query:
        body:
          query: 'SET unmapped_fields="LOAD_ALL"; TS la_tsdb | STATS m = MAX(gauge) BY dim | SORT dim | LIMIT 10'
  - match: { error.type: verification_exception }
  - contains: { error.reason: "unmapped_fields=\"LOAD_ALL\" only supports the FROM, KEEP, DROP, RENAME, EVAL, WHERE, SORT, LIMIT, STATS, INLINE STATS, LOOKUP JOIN, ENRICH and FORK commands" }

setup:
  - requires:
      test_runner_features: [capabilities, allowed_warnings_regex]
      capabilities:
        - method: POST
          path: /_query
          parameters: []
          capabilities: [fn_nested_any, nested_expand]
      reason: "NESTED_ANY is snapshot-only"
  - do:
      indices.create:
        index: nested_any
        body:
          settings:
            number_of_shards: 1
          mappings:
            properties:
              id:
                type: keyword
              items:
                type: nested
                properties:
                  sku:
                    type: keyword
                  qty:
                    type: long
              events:
                type: nested
                properties:
                  kind:
                    type: keyword
  - do:
      bulk:
        refresh: true
        body:
          - { "index": { "_index": "nested_any", "_id": "1" } }
          - { "id": "1", "items": [ { "sku": "a", "qty": 1 }, { "sku": "b", "qty": 2 } ], "events": [ { "kind": "ship" } ] }
          - { "index": { "_index": "nested_any", "_id": "2" } }
          - { "id": "2", "items": [], "events": [] }
          - { "index": { "_index": "nested_any", "_id": "3" } }
          - { "id": "3", "items": [ { "sku": "c", "qty": 1 } ], "events": [ { "kind": "cancel" } ] }

---
"NESTED_ANY rejects a non-boolean":
  - do:
      catch: bad_request
      esql.query:
        body:
          query: 'FROM nested_any | EVAL x = NESTED_ANY(items.qty) | KEEP id, x'
  - match: { error.reason: "/(?s).*first\\sargument\\sof\\s\\[NESTED_ANY\\(items.qty\\)\\]\\smust\\sbe\\s\\[boolean\\].*/" }

---
"NESTED_ANY rejects fields from two nested paths":
  - do:
      catch: bad_request
      esql.query:
        body:
          query: 'FROM nested_any | WHERE NESTED_ANY(items.sku == "a" AND events.kind == "ship") | KEEP id'
  - match: { error.reason: "/(?s).*NESTED_ANY\\srequires\\sone\\snested\\spath.*/" }

---
"NESTED_ANY cannot follow STATS":
  - do:
      catch: bad_request
      esql.query:
        body:
          query: 'FROM nested_any | STATS c = COUNT(*) | WHERE NESTED_ANY(items.sku == "a") | KEEP c'
  - match: { error.reason: "/(?s).*cannot\\sfollow.*/" }

---
"NESTED_ANY reads a mapped child of any type like a column":
  - do:
      indices.create:
        index: nested_any_types
        body:
          settings:
            number_of_shards: 1
          mappings:
            properties:
              id:
                type: keyword
              items:
                type: nested
                properties:
                  g: { type: geo_point }
                  dn: { type: date_nanos }
                  ul: { type: unsigned_long }
                  ver: { type: version }
                  f: { type: float }
                  hf: { type: half_float }
                  sf: { type: scaled_float, scaling_factor: 100 }
                  d: { type: date }
                  ip: { type: ip }
                  b: { type: boolean }
  - do:
      bulk:
        refresh: true
        body:
          - { "index": { "_index": "nested_any_types", "_id": "1" } }
          - { "id": "1", "items": [ { "g": "1.0,1.0", "dn": "2021-01-01T00:00:00Z", "ul": 10, "ver": "2.0.0", "f": 2.5, "hf": 2.5, "sf": 2.5, "d": "2021-01-01T00:00:00Z", "ip": "10.0.0.1", "b": true } ] }
          - { "index": { "_index": "nested_any_types", "_id": "2" } }
          - { "id": "2", "items": [ { "g": "50.0,50.0", "dn": "2019-01-01T00:00:00Z", "ul": 1, "ver": "0.5.0", "f": 0.5, "hf": 0.5, "sf": 0.5, "d": "2019-01-01T00:00:00Z", "ip": "192.168.0.1", "b": false } ] }
  - match: { errors: false }
  - do:
      allowed_warnings_regex:
        - "No limit defined, adding default limit of \\[.*\\]"
      esql.query:
        body:
          query: >
            FROM nested_any_types
            | EVAL has_g = NESTED_ANY(ST_DISTANCE(items.g, TO_GEOPOINT("POINT(1 1)")) < 1000),
                   has_dn = NESTED_ANY(items.dn > TO_DATE_NANOS("2020-01-01T00:00:00Z")),
                   has_ul = NESTED_ANY(items.ul > TO_UNSIGNED_LONG(5)),
                   has_ver = NESTED_ANY(items.ver > TO_VERSION("1.0.0")),
                   has_f = NESTED_ANY(items.f > 1.5),
                   has_hf = NESTED_ANY(items.hf > 1.5),
                   has_sf = NESTED_ANY(items.sf > 1.5),
                   has_d = NESTED_ANY(items.d > TO_DATETIME("2020-01-01T00:00:00Z")),
                   has_ip = NESTED_ANY(CIDR_MATCH(items.ip, "10.0.0.0/8")),
                   has_b = NESTED_ANY(items.b)
            | KEEP id, has_g, has_dn, has_ul, has_ver, has_f, has_hf, has_sf, has_d, has_ip, has_b
            | SORT id
  - match:
      values:
        - ["1", true, true, true, true, true, true, true, true, true, true]
        - ["2", false, false, false, false, false, false, false, false, false, false]

---
"NESTED_ANY reads small numeric children as integer like a top-level field":
  - do:
      indices.create:
        index: nested_any_small
        body:
          settings:
            number_of_shards: 1
          mappings:
            properties:
              id:
                type: keyword
              ts:
                type: short
              tb:
                type: byte
              items:
                type: nested
                properties:
                  s:
                    type: short
                  b:
                    type: byte
  - do:
      bulk:
        refresh: true
        body:
          - { "index": { "_index": "nested_any_small", "_id": "1" } }
          - { "id": "1", "ts": 5, "tb": 5, "items": [ { "s": 5, "b": 5 } ] }
          - { "index": { "_index": "nested_any_small", "_id": "2" } }
          - { "id": "2", "ts": 1, "tb": 1, "items": [ { "s": 1, "b": 1 } ] }
  - match: { errors: false }
  - do:
      allowed_warnings_regex:
        - "No limit defined, adding default limit of \\[.*\\]"
      esql.query:
        body:
          query: 'FROM nested_any_small | WHERE ts > 2 AND tb > 2 | KEEP id, ts, tb | SORT id'
  - match: { columns.1.type: "integer" }
  - match: { columns.2.type: "integer" }
  - match: { values: [["1", 5, 5]] }
  - do:
      allowed_warnings_regex:
        - "No limit defined, adding default limit of \\[.*\\]"
      esql.query:
        body:
          query: 'FROM nested_any_small | EVAL has_s = NESTED_ANY(items.s > 2), has_b = NESTED_ANY(items.b > 2) | KEEP id, has_s, has_b | SORT id'
  - match: { values: [["1", true, true], ["2", false, false]] }
  - do:
      allowed_warnings_regex:
        - "No limit defined, adding default limit of \\[.*\\]"
      esql.query:
        body:
          query: 'FROM nested_any_small | NESTED_EXPAND items | WHERE items.s > 2 | KEEP id, items.s, items.b | SORT id'
  - match: { columns.1.type: "integer" }
  - match: { columns.2.type: "integer" }
  - match: { values: [["1", 5, 5]] }

---
"NESTED_ANY resolves a child mapped with different types through a cast":
  - do:
      indices.create:
        index: nested_any_conflict_a
        body:
          settings:
            number_of_shards: 1
          mappings:
            properties:
              id:
                type: keyword
              items:
                type: nested
                properties:
                  v:
                    type: integer
  - do:
      indices.create:
        index: nested_any_conflict_b
        body:
          settings:
            number_of_shards: 1
          mappings:
            properties:
              id:
                type: keyword
              items:
                type: nested
                properties:
                  v:
                    type: keyword
  - do:
      bulk:
        refresh: true
        body:
          - { "index": { "_index": "nested_any_conflict_a", "_id": "1" } }
          - { "id": "1", "items": [ { "v": 1 }, { "v": 9 } ] }
          - { "index": { "_index": "nested_any_conflict_a", "_id": "2" } }
          - { "id": "2", "items": [ { "v": 5 } ] }
          - { "index": { "_index": "nested_any_conflict_b", "_id": "3" } }
          - { "id": "3", "items": [ { "v": "1" } ] }
          - { "index": { "_index": "nested_any_conflict_b", "_id": "4" } }
          - { "id": "4", "items": [ { "v": "7" } ] }
  - match: { errors: false }
  - do:
      allowed_warnings_regex:
        - "No limit defined, adding default limit of \\[.*\\]"
      esql.query:
        body:
          query: 'FROM nested_any_conflict_* | WHERE NESTED_ANY(TO_LONG(items.v) == 1) | KEEP id | SORT id'
  - match: { values: [["1"], ["3"]] }
  - do:
      allowed_warnings_regex:
        - "No limit defined, adding default limit of \\[.*\\]"
      esql.query:
        body:
          query: 'FROM nested_any_conflict_* | EVAL big = NESTED_ANY(TO_LONG(items.v) > 6) | KEEP id, big | SORT id'
  - match: { values: [["1", true], ["2", false], ["3", false], ["4", true]] }
  - do:
      catch: bad_request
      esql.query:
        body:
          query: 'FROM nested_any_conflict_* | WHERE NESTED_ANY(items.v == 1) | KEEP id'
  - match: { error.reason: "/(?s).*Cannot\\suse\\sfield\\s\\[items\\.v\\]\\sdue\\sto\\sambiguities.*/" }

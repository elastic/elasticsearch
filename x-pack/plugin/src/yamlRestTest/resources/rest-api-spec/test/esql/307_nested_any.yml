setup:
  - requires:
      test_runner_features: [capabilities, allowed_warnings_regex]
      capabilities:
        - method: POST
          path: /_query
          parameters: []
          capabilities: [fn_nested_any]
      reason: "NESTED_ANY is snapshot-only"
  - do:
      indices.create:
        index: nested_any
        body:
          settings:
            number_of_shards: 1
          mappings:
            properties:
              id:
                type: keyword
              items:
                type: nested
                properties:
                  sku:
                    type: keyword
                  qty:
                    type: long
              events:
                type: nested
                properties:
                  kind:
                    type: keyword
  - do:
      bulk:
        refresh: true
        body:
          - { "index": { "_index": "nested_any", "_id": "1" } }
          - { "id": "1", "items": [ { "sku": "a", "qty": 1 }, { "sku": "b", "qty": 2 } ], "events": [ { "kind": "ship" } ] }
          - { "index": { "_index": "nested_any", "_id": "2" } }
          - { "id": "2", "items": [], "events": [] }
          - { "index": { "_index": "nested_any", "_id": "3" } }
          - { "id": "3", "items": [ { "sku": "c", "qty": 1 } ], "events": [ { "kind": "cancel" } ] }

---
"NESTED_ANY keeps a parent when any child matches":
  - do:
      allowed_warnings_regex:
        - "No limit defined, adding default limit of \\[.*\\]"
      esql.query:
        body:
          query: 'FROM nested_any | WHERE NESTED_ANY(items.sku == "a") | KEEP id | SORT id'
  - match: { columns.0.name: "id" }
  - length: { values: 1 }
  - match: { values.0: ["1"] }

---
"NESTED_ANY is false when the parent has no nested objects":
  - do:
      allowed_warnings_regex:
        - "No limit defined, adding default limit of \\[.*\\]"
      esql.query:
        body:
          query: 'FROM nested_any | EVAL hit = NESTED_ANY(items.qty > 1) | KEEP id, hit | SORT id'
  - match: { columns.0.name: "id" }
  - match: { columns.1.name: "hit" }
  - length: { values: 3 }
  - match: { values.0: ["1", true] }
  - match: { values.1: ["2", false] }
  - match: { values.2: ["3", false] }

---
"AND inside NESTED_ANY matches one child":
  - do:
      allowed_warnings_regex:
        - "No limit defined, adding default limit of \\[.*\\]"
      esql.query:
        body:
          query: 'FROM nested_any | WHERE NESTED_ANY(items.sku == "a" AND items.qty > 1) | KEEP id | SORT id'
  - length: { values: 0 }

---
"AND inside NESTED_ANY matches when one child satisfies both":
  - do:
      allowed_warnings_regex:
        - "No limit defined, adding default limit of \\[.*\\]"
      esql.query:
        body:
          query: 'FROM nested_any | WHERE NESTED_ANY(items.sku == "b" AND items.qty > 1) | KEEP id | SORT id'
  - length: { values: 1 }
  - match: { values.0: ["1"] }

---
"Two NESTED_ANY calls match different children of one parent":
  - do:
      allowed_warnings_regex:
        - "No limit defined, adding default limit of \\[.*\\]"
      esql.query:
        body:
          query: 'FROM nested_any | WHERE NESTED_ANY(items.sku == "a") AND NESTED_ANY(items.qty > 1) | KEEP id | SORT id'
  - length: { values: 1 }
  - match: { values.0: ["1"] }

---
"NOT NESTED_ANY keeps parents with no match":
  - do:
      allowed_warnings_regex:
        - "No limit defined, adding default limit of \\[.*\\]"
      esql.query:
        body:
          query: 'FROM nested_any | WHERE NOT NESTED_ANY(items.sku == "a") | KEEP id | SORT id'
  - length: { values: 2 }
  - match: { values.0: ["2"] }
  - match: { values.1: ["3"] }

---
"NESTED_ANY of a collection is true when the parent has any object":
  - do:
      allowed_warnings_regex:
        - "No limit defined, adding default limit of \\[.*\\]"
      esql.query:
        body:
          query: 'FROM nested_any | EVAL hit = NESTED_ANY(items, true) | KEEP id, hit | SORT id'
  - length: { values: 3 }
  - match: { values.0: ["1", true] }
  - match: { values.1: ["2", false] }
  - match: { values.2: ["3", true] }

---
"NESTED_ANY rejects a non-boolean":
  - do:
      catch: /NESTED_ANY requires a predicate/
      esql.query:
        body:
          query: 'FROM nested_any | EVAL x = NESTED_ANY(items.qty) | KEEP id, x'

---
"NESTED_ANY rejects fields from two nested paths":
  - do:
      catch: /NESTED_ANY requires one nested path/
      esql.query:
        body:
          query: 'FROM nested_any | WHERE NESTED_ANY(items.sku == "a" AND events.kind == "ship") | KEEP id'

---
"NESTED_ANY cannot follow STATS":
  - do:
      catch: /cannot follow/
      esql.query:
        body:
          query: 'FROM nested_any | STATS c = COUNT(*) | WHERE NESTED_ANY(items.sku == "a") | KEEP c'

---
"NESTED_ANY reads a mapped child of any type like a column":
  - do:
      indices.create:
        index: nested_any_types
        body:
          settings:
            number_of_shards: 1
          mappings:
            properties:
              id:
                type: keyword
              items:
                type: nested
                properties:
                  g: { type: geo_point }
                  dn: { type: date_nanos }
                  ul: { type: unsigned_long }
                  ver: { type: version }
                  f: { type: float }
                  hf: { type: half_float }
                  sf: { type: scaled_float, scaling_factor: 100 }
                  d: { type: date }
                  ip: { type: ip }
                  b: { type: boolean }
  - do:
      bulk:
        refresh: true
        body:
          - { "index": { "_index": "nested_any_types", "_id": "1" } }
          - { "id": "1", "items": [ { "g": "1.0,1.0", "dn": "2021-01-01T00:00:00Z", "ul": 10, "ver": "2.0.0", "f": 2.5, "hf": 2.5, "sf": 2.5, "d": "2021-01-01T00:00:00Z", "ip": "10.0.0.1", "b": true } ] }
          - { "index": { "_index": "nested_any_types", "_id": "2" } }
          - { "id": "2", "items": [ { "g": "50.0,50.0", "dn": "2019-01-01T00:00:00Z", "ul": 1, "ver": "0.5.0", "f": 0.5, "hf": 0.5, "sf": 0.5, "d": "2019-01-01T00:00:00Z", "ip": "192.168.0.1", "b": false } ] }
  - do:
      allowed_warnings_regex:
        - "No limit defined, adding default limit of \\[.*\\]"
      esql.query:
        body:
          query: >
            FROM nested_any_types
            | WHERE NESTED_ANY(ST_DISTANCE(items.g, TO_GEOPOINT("POINT(1 1)")) < 1000)
              AND NESTED_ANY(items.dn > TO_DATE_NANOS("2020-01-01T00:00:00Z"))
              AND NESTED_ANY(items.ul > TO_UNSIGNED_LONG(5))
              AND NESTED_ANY(items.ver > TO_VERSION("1.0.0"))
              AND NESTED_ANY(items.f > 1.5)
              AND NESTED_ANY(items.hf > 1.5)
              AND NESTED_ANY(items.sf > 1.5)
              AND NESTED_ANY(items.d > TO_DATETIME("2020-01-01T00:00:00Z"))
              AND NESTED_ANY(CIDR_MATCH(items.ip, "10.0.0.0/8"))
              AND NESTED_ANY(items.b)
            | KEEP id
            | SORT id
  - match: { values: [["1"]] }

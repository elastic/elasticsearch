  - do:
      allowed_warnings_regex:
        - ".*"
      esql.query:
        body:
          query: 'FROM nested_any_outer | WHERE NESTED_ANY(items.qty > lim) | KEEP id | SORT id'
  - match: { values: [["1"]] }
  - do:
      allowed_warnings_regex:
        - ".*"
      esql.query:
        body:
          query: 'FROM nested_any_outer | NESTED_EXPAND items | WHERE items.qty > lim | STATS c = COUNT(*) BY id | KEEP id | SORT id'
  - match: { values: [["1"]] }


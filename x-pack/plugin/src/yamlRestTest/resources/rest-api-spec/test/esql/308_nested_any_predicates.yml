---
"a nested predicate over the collection may use a parent field":
  - do:
      allowed_warnings_regex:
        - "No limit defined, adding default limit of \\[.*\\]"
      esql.query:
        body:
          query: 'FROM nested_any_shapes | NESTED_EXPAND items | WHERE items.qty >= n | STATS c = COUNT(*) BY id | KEEP id | SORT id'
  - is_true: values.0.0
  - set: { values: expanded }
  - do:
      allowed_warnings_regex:
        - "No limit defined, adding default limit of \\[.*\\]"
      esql.query:
        body:
          query: 'FROM nested_any_shapes | WHERE NESTED_ANY(items, items.qty >= n) | KEEP id | SORT id'
  - match: { values: $expanded }

---
"a nested predicate may use two parent expressions":
  - do:
      allowed_warnings_regex:
        - "No limit defined, adding default limit of \\[.*\\]"
      esql.query:
        body:
          query: 'FROM nested_any_shapes | NESTED_EXPAND items | WHERE items.qty >= n AND items.qty <= n + 3 | STATS c = COUNT(*) BY id | KEEP id | SORT id'
  - is_true: values.0.0
  - set: { values: expanded }
  - do:
      allowed_warnings_regex:
        - "No limit defined, adding default limit of \\[.*\\]"
      esql.query:
        body:

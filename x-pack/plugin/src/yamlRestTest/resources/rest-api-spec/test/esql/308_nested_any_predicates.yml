setup:
  - requires:
      test_runner_features: [capabilities, allowed_warnings_regex]
      capabilities:
        - method: POST
          path: /_query
          parameters: []
          capabilities: [fn_nested_any]
      reason: "NESTED_ANY is snapshot-only"
  - do:
      indices.create:
        index: nested_any_parity
        body:
          settings:
            number_of_shards: 2
            number_of_replicas: 0
          mappings:
            properties:
              id: { type: keyword }
              s: { type: keyword }
              t: { type: text }
              i: { type: integer }
              l: { type: long }
              dbl: { type: double }
              dt: { type: date }
              ip: { type: ip }
              b: { type: boolean }
              x: { type: keyword }
              sip: { type: keyword }
              items:
                type: nested
                properties:
                  s: { type: keyword }
                  sip: { type: keyword }
                  t: { type: text }
                  i: { type: integer }
                  l: { type: long }
                  dbl: { type: double }
                  dt: { type: date }
                  ip: { type: ip }
                  b: { type: boolean }
                  x: { type: keyword }
  - do:
      indices.create:
        index: nested_any_shapes
        body:
          settings:
            number_of_shards: 2
            number_of_replicas: 0
          mappings:
            properties:
              id: { type: keyword }
              n: { type: long }
              top: { type: keyword }
              items:
                type: nested
                properties:
                  sku: { type: keyword }
                  qty: { type: long }
                  tags: { type: keyword }
                  flag: { type: boolean }
  - do:
      bulk:
        refresh: true
        body:
          - { "index": { "_index": "nested_any_parity", "_id": "1" } }
          - { "id": "1", "s": "alpha", "t": "hello world", "i": 1, "l": 1, "dbl": 1.2, "dt": "2021-01-01T00:00:00Z", "ip": "10.0.0.1", "b": true, "x": "k", "sip": "10.0.0.1", "items": [ { "s": "alpha", "t": "hello world", "i": 1, "l": 1, "dbl": 1.2, "dt": "2021-01-01T00:00:00Z", "ip": "10.0.0.1", "b": true, "x": "k", "sip": "10.0.0.1" } ] }
          - { "index": { "_index": "nested_any_parity", "_id": "2" } }
          - { "id": "2", "s": "beta", "t": "goodbye world", "i": 2, "l": 5, "dbl": 1.8, "dt": "2021-03-15T00:00:00Z", "ip": "10.0.0.9", "b": false, "x": "k", "sip": "10.0.0.9", "items": [ { "s": "beta", "t": "goodbye world", "i": 2, "l": 5, "dbl": 1.8, "dt": "2021-03-15T00:00:00Z", "ip": "10.0.0.9", "b": false, "x": "k", "sip": "10.0.0.9" } ] }
          - { "index": { "_index": "nested_any_parity", "_id": "3" } }
          - { "id": "3", "s": "gamma", "t": "hello there", "i": 3, "l": 3, "dbl": 2.5, "dt": "2022-06-01T00:00:00Z", "ip": "192.168.1.1", "b": true, "x": "k", "sip": "192.168.1.1", "items": [ { "s": "gamma", "t": "hello there", "i": 3, "l": 3, "dbl": 2.5, "dt": "2022-06-01T00:00:00Z", "ip": "192.168.1.1", "b": true, "x": "k", "sip": "192.168.1.1" } ] }
          - { "index": { "_index": "nested_any_parity", "_id": "4" } }
          - { "id": "4", "s": "delta", "t": "farewell", "i": 4, "l": 2, "dbl": 0.5, "dt": "2020-12-31T23:59:59Z", "ip": "172.16.0.1", "b": false, "x": "k", "sip": "172.16.0.1", "items": [ { "s": "delta", "t": "farewell", "i": 4, "l": 2, "dbl": 0.5, "dt": "2020-12-31T23:59:59Z", "ip": "172.16.0.1", "b": false, "x": "k", "sip": "172.16.0.1" } ] }
          - { "index": { "_index": "nested_any_parity", "_id": "5" } }
          - { "id": "5", "x": "z", "items": [ { "x": "z" } ] }
          - { "index": { "_index": "nested_any_parity", "_id": "6" } }
          - { "id": "6", "s": "", "x": "k", "items": [ { "s": "", "x": "k" } ] }
          - { "index": { "_index": "nested_any_shapes", "_id": "1" } }
          - {"id": "1", "n": 1, "top": ["p", "q"], "items": [{"sku": "a", "qty": 1, "tags": ["x", "y"], "flag": [true, false]}, {"sku": "b", "qty": 2}]}
          - { "index": { "_index": "nested_any_shapes", "_id": "2" } }
          - {"id": "2", "n": 2, "top": "p", "items": [{"qty": 5}]}
          - { "index": { "_index": "nested_any_shapes", "_id": "3" } }
          - {"id": "3", "n": 3, "top": "q", "items": [{"sku": "a", "qty": 9, "tags": "x", "flag": true}]}
          - { "index": { "_index": "nested_any_shapes", "_id": "4" } }
          - {"id": "4", "n": 4, "top": "p", "items": []}
          - { "index": { "_index": "nested_any_shapes", "_id": "5" } }
          - {"id": "5", "n": 5, "top": "q", "items": [{"sku": "b", "qty": 3}]}
          - { "index": { "_index": "nested_any_shapes", "_id": "6" } }
          - {"id": "6", "n": 6, "top": "p", "items": [{"sku": "a", "qty": 4, "flag": false}, {"sku": "c", "qty": 7}]}

---
"a keyword equality predicate selects the same rows as on a top-level field":
  - do:
      allowed_warnings_regex:
        - "No limit defined, adding default limit of \\[.*\\]"
      esql.query:
        body:
          query: 'FROM nested_any_parity | WHERE s == "alpha" | KEEP id | SORT id'
  - is_true: values.0.0
  - set: { values: top_level }
  - do:
      allowed_warnings_regex:
        - "No limit defined, adding default limit of \\[.*\\]"
      esql.query:
        body:
          query: 'FROM nested_any_parity | WHERE NESTED_ANY(items.s == "alpha") | KEEP id | SORT id'
  - match: { values: $top_level }


              id: { type: keyword }
              lim: { type: long }
              items:
                type: nested
                properties:
                  qty: { type: long }
  - do:
      bulk:
        refresh: true
        body:
          - { "index": { "_index": "nested_any_outer", "_id": "1" } }
          - { "id": "1", "lim": 5, "items": [ { "qty": 1 }, { "qty": 9 } ] }
          - { "index": { "_index": "nested_any_outer", "_id": "2" } }
          - { "id": "2", "items": [ { "qty": 9 } ] }
          - { "index": { "_index": "nested_any_outer", "_id": "3" } }

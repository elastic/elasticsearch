# WHERE NESTED_ANY(<predicate>) runs in Lucene as a nested query when the predicate translates, so only parents with a matching
# child leave the index: documents_found counts them. Otherwise the predicate filters in memory and every parent is read.
setup:
  - requires:
      test_runner_features: [capabilities, allowed_warnings_regex]
      capabilities:
        - method: POST
          path: /_query
          parameters: []
          capabilities: [fn_nested_any, documents_found_and_values_loaded]
      reason: "NESTED_ANY is snapshot-only"
  - do:
      indices.create:
        index: na_push
        body:
          settings:
            number_of_shards: 1
            number_of_replicas: 0
          mappings:
            dynamic: strict
            properties:
              id: { type: keyword }
              items:
                type: nested
                properties:
                  price: { type: long }
                  qty: { type: long }
                  sku: { type: keyword }
  - do:
      bulk:
        refresh: true
        body:
          - { "index": { "_index": "na_push", "_id": "a" } }
          - { "id": "a", "items": [ { "price": 20, "qty": 2, "sku": "book" }, { "price": 5, "qty": 1, "sku": "pen" } ] }
          - { "index": { "_index": "na_push", "_id": "b" } }
          - { "id": "b", "items": [ { "price": 1, "qty": 1, "sku": "book" } ] }
          - { "index": { "_index": "na_push", "_id": "c" } }
          - { "id": "c" }
          - { "index": { "_index": "na_push", "_id": "d" } }
          - { "id": "d", "items": [ { "price": 20, "qty": 1, "sku": "cup" } ] }

---
"a nested predicate is pushed to Lucene":
  - do:
      esql.query:
        allow_partial_results: false
        body:
          query: 'FROM na_push | WHERE NESTED_ANY(items.price > 10) | KEEP id | SORT id | LIMIT 10'
  - match:
      values:
      - ["a"]
      - ["d"]
  - match: { documents_found: 2 }

---
"a pushed conjunction matches within one nested object":
  - do:
      esql.query:
        allow_partial_results: false
        body:
          query: 'FROM na_push | WHERE NESTED_ANY(items.price > 10 AND items.qty == 1) | KEEP id | SORT id | LIMIT 10'
  - match:
      values:
      - ["d"]
  - match: { documents_found: 1 }

---
"a pushed keyword predicate":
  - do:
      esql.query:
        allow_partial_results: false
        body:
          query: 'FROM na_push | WHERE NESTED_ANY(items.sku == "book") | KEEP id | SORT id | LIMIT 10'
  - match:
      values:
      - ["a"]
      - ["b"]
  - match: { documents_found: 2 }

---
"a nested predicate is pushed beside a parent filter":
  - do:
      esql.query:
        allow_partial_results: false
        body:
          query: 'FROM na_push | WHERE id != "d" AND NESTED_ANY(items.price > 10) | KEEP id | SORT id | LIMIT 10'
  - match:
      values:
      - ["a"]
  - match: { documents_found: 1 }

---
"two nested predicates are both pushed":
  - do:
      esql.query:
        allow_partial_results: false
        body:
          query: 'FROM na_push | WHERE NESTED_ANY(items.price > 10) AND NESTED_ANY(items.sku == "pen") | KEEP id | SORT id | LIMIT 10'
  - match:
      values:
      - ["a"]
  - match: { documents_found: 1 }

---
"a pushed predicate leaves an untranslatable one to run in memory":
  - do:
      esql.query:
        allow_partial_results: false
        body:
          query: 'FROM na_push | WHERE NESTED_ANY(items.price > 10) AND NESTED_ANY(items.price + items.qty >= 21) | KEEP id | SORT id | LIMIT 10'
  - match:
      values:
      - ["a"]
      - ["d"]
  - match: { documents_found: 2 }

---
"an untranslatable nested predicate filters in memory":
  - do:
      esql.query:
        allow_partial_results: false
        body:
          query: 'FROM na_push | WHERE NESTED_ANY(items.price + items.qty >= 21) | KEEP id | SORT id | LIMIT 10'
  - match:
      values:
      - ["a"]
      - ["d"]
  - match: { documents_found: 4 }

---
"a negated nested predicate is pushed":
  - do:
      esql.query:
        allow_partial_results: false
        body:
          query: 'FROM na_push | WHERE NOT NESTED_ANY(items.price > 10) | KEEP id | SORT id | LIMIT 10'
  - match:
      values:
      - ["b"]
      - ["c"]
  - match: { documents_found: 2 }

---
"a nested predicate in a disjunction filters in memory":
  - do:
      esql.query:
        allow_partial_results: false
        body:
          query: 'FROM na_push | WHERE id == "b" OR NESTED_ANY(items.price > 10) | KEEP id | SORT id | LIMIT 10'
  - match:
      values:
      - ["a"]
      - ["b"]
      - ["d"]
  - match: { documents_found: 4 }

---
"any child at all is pushed":
  - do:
      esql.query:
        allow_partial_results: false
        body:
          query: 'FROM na_push | WHERE NESTED_ANY(items, true) | KEEP id | SORT id | LIMIT 10'
  - match:
      values:
      - ["a"]
      - ["b"]
      - ["d"]
  - match: { documents_found: 3 }

---
"a nested existence predicate matches the child fields":
  - do:
      indices.create:
        index: na_push_exists
        body:
          settings:
            number_of_shards: 1
            number_of_replicas: 0
          mappings:
            dynamic: strict
            properties:
              id: { type: keyword }
              items:
                type: nested
                properties:
                  price: { type: long }
                  qty: { type: long }
  - do:
      bulk:
        refresh: true
        body:
          - { "index": { "_index": "na_push_exists", "_id": "mixed" } }
          - { "id": "mixed", "items": [ { "price": 1 }, { "qty": 1 } ] }
          - { "index": { "_index": "na_push_exists", "_id": "priced" } }
          - { "id": "priced", "items": [ { "price": 2 } ] }
          - { "index": { "_index": "na_push_exists", "_id": "unpriced" } }
          - { "id": "unpriced", "items": [ { "qty": 1 } ] }
          - { "index": { "_index": "na_push_exists", "_id": "empty" } }
          - { "id": "empty" }
  - do:
      esql.query:
        allow_partial_results: false
        body:
          query: 'FROM na_push_exists | WHERE NESTED_ANY(items.price IS NOT NULL) | KEEP id | SORT id | LIMIT 10'
  - match: { values: [["mixed"], ["priced"]] }
  - do:
      esql.query:
        allow_partial_results: false
        body:
          query: 'FROM na_push_exists | WHERE NESTED_ANY(items.price IS NULL) | KEEP id | SORT id | LIMIT 10'
  - match: { values: [["mixed"], ["unpriced"]] }

---
"a nested keyword with a normalizer filters in memory":
  - do:
      indices.create:
        index: na_push_normalized
        body:
          settings:
            number_of_shards: 1
            number_of_replicas: 0
            analysis:
              normalizer:
                lower:
                  type: custom
                  filter: [lowercase]
          mappings:
            dynamic: strict
            properties:
              id: { type: keyword }
              items:
                type: nested
                properties:
                  sku: { type: keyword, normalizer: lower }
  - do:
      bulk:
        refresh: true
        body:
          - { "index": { "_index": "na_push_normalized", "_id": "n1" } }
          - { "id": "n1", "items": [ { "sku": "a" } ] }
  - do:
      esql.query:
        allow_partial_results: false
        body:
          query: 'FROM na_push_normalized | WHERE NESTED_ANY(items.sku == "A") | KEEP id | LIMIT 10'
  - length: { values: 0 }
  - do:
      esql.query:
        allow_partial_results: false
        body:
          query: 'FROM na_push_normalized | WHERE NESTED_ANY(items.sku > "B") | KEEP id | LIMIT 10'
  - match: { values: [["n1"]] }


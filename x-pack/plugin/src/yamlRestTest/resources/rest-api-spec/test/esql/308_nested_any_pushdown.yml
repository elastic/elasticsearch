---
"a query parameter inside the predicate is a constant, so it is pushed":
  - do:
      esql.query:
        allow_partial_results: false
        body:
          query: 'FROM na_push | WHERE NESTED_ANY(items.sku == ?sku) | KEEP id | SORT id | LIMIT 10'
          params: [{"sku": "book"}]
  - match: { values: [["a"], ["b"]] }
  - match: { documents_found: 2 }

---
"a constant expression inside the predicate is folded and pushed":
  - do:
      esql.query:
        allow_partial_results: false
        body:
          query: 'FROM na_push | WHERE NESTED_ANY(items.sku == CONCAT("bo", "ok") AND items.price > 2 * 5) | KEEP id | SORT id | LIMIT 10'
  - match: { values: [["a"]] }
  - match: { documents_found: 1 }

---
"a nested predicate in EVAL is evaluated against the nested query":
  - do:
      esql.query:
        allow_partial_results: false
        body:
          query: 'FROM na_push | EVAL h = NESTED_ANY(items.price > 10), s = NESTED_ANY(items.sku == "pen") | KEEP id, h, s | SORT id | LIMIT 10'
  - match: { values: [["a", true, true], ["b", false, false], ["c", false, false], ["d", true, false]] }

---
"a nested predicate in EVAL still reads the children when the shards cannot query them":
  - do:
      indices.create:
        index: na_push_normalized_eval
        body:
          settings:
            number_of_shards: 1
            number_of_replicas: 0
            analysis:
              normalizer:
                lower:
                  type: custom
                  filter: [lowercase]
          mappings:
            dynamic: strict
            properties:
              id: { type: keyword }
              items:
                type: nested
                properties:
                  sku: { type: keyword, normalizer: lower }
  - do:
      bulk:
        refresh: true
        body:
          - { "index": { "_index": "na_push_normalized_eval", "_id": "n1" } }
          - { "id": "n1", "items": [ { "sku": "a" } ] }
  - do:
      esql.query:
        allow_partial_results: false
        body:
          query: 'FROM na_push_normalized_eval | EVAL h = NESTED_ANY(items.sku == "A") | KEEP id, h | LIMIT 10'
  - match: { values: [["n1", false]] }

---
"a runtime field under a nested path reads the parent document, so the predicate is not pushed":
  - do:
      indices.create:
        index: na_runtime
        body:
          settings:
            number_of_shards: 1
            number_of_replicas: 0
          mappings:
            runtime:
              items.calculated:
                type: long
                script:
                  source: "emit(doc['parent_value'].value)"
            properties:
              id: { type: keyword }
              parent_value: { type: long }
              items:
                type: nested
                properties:
                  qty: { type: long }
  - do:
      bulk:
        refresh: true
        body:
          - { "index": { "_index": "na_runtime", "_id": "a" } }
          - { "id": "a", "parent_value": 5, "items": [ { "qty": 1 }, { "qty": 2 } ] }
          - { "index": { "_index": "na_runtime", "_id": "b" } }
          - { "id": "b", "parent_value": 7, "items": [ { "qty": 3 } ] }
  - do:
      esql.query:
        allow_partial_results: false
        body:
          query: 'FROM na_runtime | WHERE NESTED_ANY(items.calculated == 5) | KEEP id | SORT id | LIMIT 10'
  - match: { values: [["a"]] }

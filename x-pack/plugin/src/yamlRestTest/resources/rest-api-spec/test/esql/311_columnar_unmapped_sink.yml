---
setup:
  - requires:
      test_runner_features: [ capabilities, allowed_warnings ]
      capabilities:
        - method: PUT
          path: /{index}
          capabilities: [ columnar_index_modes, dynamic_flattened ]
      reason: "columnar index modes and the flattened _unmapped sink are required"

  - do:
      indices.create:
        index: test_mapped
        body:
          settings:
            index.mode: columnar
          mappings:
            dynamic: flattened
            properties:
              mapped:
                type: long

  - do:
      index:
        index: test_mapped
        id: "1"
        refresh: true
        body:
          mapped: 42
          bare: "bare-value"

---
"the sink is not a column":
  # ES|QL resolves columns through field_caps and skips metadata fields, so the sink is not a column.
  - do:
      esql.query:
        body:
          query: 'FROM test_mapped | LIMIT 10'
  - length: { columns: 1 }
  - match: { columns.0.name: mapped }
  - match: { values.0.0: 42 }

  - do:
      catch: '/Unknown column \[_unmapped\]/'
      esql.query:
        body:
          query: 'FROM test_mapped | KEEP _unmapped'

  # Loading the sink's own name as an unmapped field returns null, as for _ignored_source: its field type has no block loader.
  # The warning is only allowed, not required: it is a raw header warning, which ES|QL drops when the shard is on another node.
  - do:
      allowed_warnings:
        - "Field [_unmapped] cannot be retrieved, it is unsupported or not indexed; returning null"
      esql.query:
        body:
          query: 'SET unmapped_fields="load"; FROM test_mapped | KEEP _unmapped | LIMIT 10'
  - match: { columns.0.name: _unmapped }
  - match: { values.0.0: null }

---
"absorbed names are unknown columns":
  - do:
      catch: '/Unknown column \[bare\]/'
      esql.query:
        body:
          query: 'FROM test_mapped | KEEP bare'

  # An absorbed key addressed through the sink's name does not resolve either: loading it as an unmapped field finds nothing.
  - do:
      esql.query:
        body:
          query: 'SET unmapped_fields="load"; FROM test_mapped | KEEP _unmapped.bare | LIMIT 10'
  - match: { columns.0.name: _unmapped.bare }
  - match: { values.0.0: null }

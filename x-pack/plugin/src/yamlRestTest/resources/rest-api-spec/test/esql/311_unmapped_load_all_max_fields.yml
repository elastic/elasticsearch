teardown:
  - do:
      indices.delete:
        index: la_max
        ignore_unavailable: true

---
'only the alphabetically first 1000 discovered fields are columns':
  - do:
      warnings:
        - 'unmapped_fields="LOAD_ALL" found more than [1000] fields in _source; only the first [1000] in alphabetical order are returned. Use KEEP or DROP to select the others.'
      esql.query:
        body:
          query: 'SET unmapped_fields="LOAD_ALL"; FROM la_max | SORT id | LIMIT 10'
  - length: { columns: 1001 }
  - length: { values: 2 }
  - match: { columns.0.name: id }
  - match: { columns.1.name: f0000 }
  - match: { columns.500.name: f0499 }
  - match: { columns.1000.name: f0999 }
  # f0000 is only in the first document, f0999 only in the second.
  - match: { values.0.0: "0" }
  - match: { values.0.1: "0" }
  - match: { values.0.1000: null }
  - match: { values.1.0: "1" }
  - match: { values.1.1: null }
  - match: { values.1.1000: "999" }

---
'KEEP reaches a field past the cap':
  # The pattern is applied before the cap, so f1000 is returned although it would be the 1001st discovered field.
  - do:
      esql.query:
        body:
          query: 'SET unmapped_fields="LOAD_ALL"; FROM la_max | KEEP id, f1* | SORT id | LIMIT 10'
  - length: { columns: 2 }
  - match: { columns.0.name: id }
  - match: { columns.1.name: f1000 }
  - match: { values.0: [ "0", null ] }
  - match: { values.1: [ "1", "1000" ] }

---
'DROP applies before the cap':
  # f000* removes f0000 - f0009, so only 991 fields are discovered: all of them are returned, with no warning, f1000 included.
  - do:
      esql.query:
        body:
          query: 'SET unmapped_fields="LOAD_ALL"; FROM la_max | DROP f000* | SORT id | LIMIT 10'
  - length: { columns: 992 }
  - match: { columns.0.name: id }
  - match: { columns.1.name: f0010 }
  - match: { columns.991.name: f1000 }
  - match: { values.0.1: "10" }
  - match: { values.0.991: null }
  - match: { values.1.1: null }
  - match: { values.1.991: "1000" }

---
'a field replaced by EVAL does not count towards the cap':
  # EVAL makes f0000 a column of the query rather than a discovered field, so 1000 fields are discovered (f0001 - f1000): exactly
  # the cap, with no warning.
  - do:
      esql.query:
        body:
          query: 'SET unmapped_fields="LOAD_ALL"; FROM la_max | EVAL f0000 = "foo" | SORT id | LIMIT 10'
  - length: { columns: 1002 }
  - match: { columns.0.name: id }
  - match: { columns.1.name: f0001 }
  - match: { columns.1000.name: f1000 }
  - match: { columns.1001.name: f0000 }
  - match: { values.0.1001: "foo" }
  - match: { values.1.1000: "1000" }
  - match: { values.1.1001: "foo" }

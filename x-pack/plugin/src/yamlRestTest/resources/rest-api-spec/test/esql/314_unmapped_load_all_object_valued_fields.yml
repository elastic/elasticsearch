---
setup:
  - requires:
      test_runner_features: [ capabilities ]
      capabilities:
        - method: POST
          path: /_query
          parameters: [ ]
          capabilities: [ optional_fields_load_all_single_source_column, optional_fields_load_all_column_from_shard, optional_fields_nothing_below_mapped_fields ]
      reason: >
        The keys of a mapped field whose type takes an object as its value are part of that value. They are not
        discovered, whatever the shape of the query and whatever else the shard holds: _unmapped_fields stays null.

  - do:
      indices.create:
        index: object-valued
        body:
          mappings:
            dynamic: false
            properties:
              id:
                type: keyword
              span:
                type: integer_range
              code:
                type: keyword
                ignore_above: 4
  - do:
      index:
        index: object-valued
        id: "1"
        refresh: true
        body:
          id: "1"
          span:
            gte: 1
            lt: 5

---
teardown:
  - do:
      indices.delete:
        index: object-valued
        ignore_unavailable: true

---
'the keys of a range are not discovered whatever the query':
  - do:
      esql.query:
        body:
          query: 'SET unmapped_fields="LOAD_ALL"; FROM object-valued | LIMIT 5'
  - length: { columns: 4 }
  - match: { columns.0.name: code }
  - match: { columns.1.name: id }
  - match: { columns.2.name: span }
  - match: { columns.3.name: _unmapped_fields }
  - is_false: values.0.3

  - do:
      esql.query:
        body:
          query: 'SET unmapped_fields="LOAD_ALL"; FROM object-valued | WHERE id == "1" | LIMIT 5'
  - length: { columns: 4 }
  - is_false: values.0.3

  - do:
      esql.query:
        body:
          query: 'SET unmapped_fields="LOAD_ALL"; FROM object-valued | SORT id | LIMIT 5'
  - length: { columns: 4 }
  - match: { columns.0.name: code }
  - match: { columns.1.name: id }
  - match: { columns.2.name: span }
  - match: { columns.3.name: _unmapped_fields }
  - is_false: values.0.3

  - do:
      esql.query:
        body:
          query: 'SET unmapped_fields="LOAD_ALL"; FROM object-valued | KEEP id, span* | LIMIT 5'
  - length: { columns: 3 }
  - match: { columns.0.name: id }
  - match: { columns.1.name: span }
  - match: { columns.2.name: _unmapped_fields }
  - is_false: values.0.2

---
'the keys of a range are not discovered once the shard holds an ignored value':
  # The value of "code" is too long to be indexed, which the shard records in _ignored.
  - do:
      index:
        index: object-valued
        id: "2"
        refresh: true
        body:
          id: "2"
          code: "0123456789"

  - do:
      esql.query:
        body:
          query: 'SET unmapped_fields="LOAD_ALL"; FROM object-valued | WHERE id == "1" | LIMIT 5'
  - length: { columns: 4 }
  - match: { columns.0.name: code }
  - match: { columns.1.name: id }
  - match: { columns.2.name: span }
  - match: { columns.3.name: _unmapped_fields }
  - is_false: values.0.3
  - length: { values: 1 }

  - do:
      esql.query:
        body:
          query: 'SET unmapped_fields="LOAD_ALL"; FROM object-valued | SORT id | LIMIT 5'
  - length: { columns: 4 }
  - length: { values: 2 }
  - is_false: values.0.3
  - is_false: values.1.3

---
'the keys of a range stay out next to unmapped fields':
  - do:
      index:
        index: object-valued
        id: "3"
        refresh: true
        body:
          id: "3"
          span:
            gte: 2
            lt: 7
          labels:
            team: search
            tier: 1
          note: hello

  - do:
      esql.query:
        body:
          query: 'SET unmapped_fields="LOAD_ALL"; FROM object-valued | SORT id | LIMIT 5'
  - length: { columns: 4 }
  - match: { columns.3.name: _unmapped_fields }
  - length: { values: 2 }
  - is_false: values.0.3
  - match: { values.1.1: "3" }
  - length: { values.1.3: 3 }
  - match: { values.1.3.labels\.team: search }
  - match: { values.1.3.labels\.tier: 1 }
  - match: { values.1.3.note: hello }

  - do:
      esql.query:
        body:
          query: 'SET unmapped_fields="LOAD_ALL"; FROM object-valued | WHERE id == "3" | KEEP id, span*, labels* | LIMIT 5'
  - length: { columns: 3 }
  - match: { columns.2.name: _unmapped_fields }
  - length: { values.0.2: 2 }
  - match: { values.0.2.labels\.team: search }
  - match: { values.0.2.labels\.tier: 1 }

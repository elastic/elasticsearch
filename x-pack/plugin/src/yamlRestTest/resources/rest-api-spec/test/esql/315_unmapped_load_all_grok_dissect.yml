---
setup:
  - requires:
      test_runner_features: [ capabilities ]
      capabilities:
        - method: POST
          path: /_query
          parameters: [ ]
          capabilities: [ optional_fields_load_all_single_source_column, optional_fields_load_all_grok_dissect ]
      reason: GROK and DISSECT under unmapped_fields="LOAD_ALL" require the single-column layout and the grok_dissect capability.

  - do:
      indices.create:
        index: la_grok
        body:
          mappings:
            dynamic: false
            properties:
              id:
                type: long
              msg:
                type: keyword

  - do:
      bulk:
        refresh: true
        body:
          - { "index": { "_index": "la_grok", "_id": "1" } }
          - { "id": 1, "msg": "alpha one", "note": "beta two", "tag": "t1" }
          - { "index": { "_index": "la_grok", "_id": "2" } }
          - { "id": 2, "msg": "gamma three", "note": "delta four", "tag": "t2" }

---
teardown:
  - do:
      indices.delete:
        index: la_grok
        ignore_unavailable: true

---
'GROK on a mapped field adds named columns':
  - do:
      esql.query:
        body:
          query: 'SET unmapped_fields="LOAD_ALL"; FROM la_grok | GROK msg "%{WORD:w1} %{WORD:w2}" | KEEP id, w1, w2 | SORT id | LIMIT 10'
  - length: { columns: 3 }
  - match: { columns.0.name: id }
  - match: { columns.1.name: w1 }
  - match: { columns.1.type: keyword }
  - match: { columns.2.name: w2 }
  - match: { values: [ [ 1, alpha, one ], [ 2, gamma, three ] ] }

---
'DISSECT reads an unmapped field by name':
  - do:
      esql.query:
        body:
          query: 'SET unmapped_fields="LOAD_ALL"; FROM la_grok | DISSECT note "%{d1} %{d2}" | KEEP id, d1, d2 | SORT id | LIMIT 10'
  - length: { columns: 3 }
  - match: { columns.0.name: id }
  - match: { columns.1.name: d1 }
  - match: { columns.2.name: d2 }
  - match: { values: [ [ 1, beta, two ], [ 2, delta, four ] ] }

---
'a GROK output column shadows the unmapped leaf of the same name':
  - do:
      esql.query:
        body:
          query: 'SET unmapped_fields="LOAD_ALL"; FROM la_grok | GROK msg "%{WORD:tag} %{WORD:rest}" | SORT id | LIMIT 10'
  - length: { columns: 5 }
  - match: { columns.0.name: id }
  - match: { columns.1.name: msg }
  - match: { columns.2.name: _unmapped_fields }
  - match: { columns.3.name: rest }
  - match: { columns.4.name: tag }
  - match: { values.0: [ 1, "alpha one", { note: "beta two" }, one, alpha ] }
  - match: { values.1: [ 2, "gamma three", { note: "delta four" }, three, gamma ] }

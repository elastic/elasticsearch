---
setup:
  - requires:
      test_runner_features: [ capabilities ]
      capabilities:
        - method: POST
          path: /_query
          parameters: [ ]
          capabilities: [ optional_fields_load_all_single_source_column, optional_fields_load_all_mv_expand ]
      reason: MV_EXPAND under unmapped_fields="LOAD_ALL" requires the single-column layout and the mv_expand capability.

  - do:
      indices.create:
        index: la_mv
        body:
          mappings:
            dynamic: false
            properties:
              id:
                type: long
              msg:
                type: keyword

  - do:
      bulk:
        refresh: true
        body:
          - { "index": { "_index": "la_mv", "_id": "1" } }
          - { "id": 1, "msg": "hello world", "note": "keep1", "codes": [ "a", "b" ] }
          - { "index": { "_index": "la_mv", "_id": "2" } }
          - { "id": 2, "msg": "foo bar", "note": "keep2", "codes": [ "c" ] }

---
teardown:
  - do:
      indices.delete:
        index: la_mv
        ignore_unavailable: true

---
'MV_EXPAND resolves an unmapped field by name and expands it into rows':
  - do:
      esql.query:
        body:
          query: 'SET unmapped_fields="LOAD_ALL"; FROM la_mv | MV_EXPAND codes | KEEP id, codes | SORT id, codes | LIMIT 10'
  - length: { columns: 2 }
  - match: { columns.0.name: id }
  - match: { columns.1.name: codes }
  - match: { columns.1.type: keyword }
  - match: { values: [ [ 1, a ], [ 1, b ], [ 2, c ] ] }

---
'MV_EXPAND promotes the unmapped field out of _unmapped_fields and repeats the rest':
  - do:
      esql.query:
        body:
          query: 'SET unmapped_fields="LOAD_ALL"; FROM la_mv | MV_EXPAND codes | SORT id, codes | LIMIT 10'
  - length: { columns: 4 }
  - match: { columns.0.name: id }
  - match: { columns.1.name: msg }
  - match: { columns.2.name: codes }
  - match: { columns.3.name: _unmapped_fields }
  - match: { values.0: [ 1, "hello world", a, { note: keep1 } ] }
  - match: { values.1: [ 1, "hello world", b, { note: keep1 } ] }
  - match: { values.2: [ 2, "foo bar", c, { note: keep2 } ] }

---
'MV_EXPAND of a mapped multivalued column repeats the whole _unmapped_fields object':
  - do:
      esql.query:
        body:
          query: 'SET unmapped_fields="LOAD_ALL"; FROM la_mv | WHERE id == 1 | EVAL pair = MV_APPEND(msg, TO_UPPER(msg)) | MV_EXPAND pair | SORT pair | LIMIT 10'
  - length: { columns: 4 }
  - match: { columns.0.name: id }
  - match: { columns.1.name: msg }
  - match: { columns.2.name: _unmapped_fields }
  - match: { columns.3.name: pair }
  - match: { values.0: [ 1, "hello world", { note: keep1, codes: [ a, b ] }, "HELLO WORLD" ] }
  - match: { values.1: [ 1, "hello world", { note: keep1, codes: [ a, b ] }, "hello world" ] }

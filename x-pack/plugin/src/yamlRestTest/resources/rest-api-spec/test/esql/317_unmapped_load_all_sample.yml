---
setup:
  - requires:
      test_runner_features: [ capabilities ]
      capabilities:
        - method: POST
          path: /_query
          parameters: [ ]
          capabilities: [ optional_fields_load_all_single_source_column, optional_fields_load_all_sample ]
      reason: SAMPLE under unmapped_fields="LOAD_ALL" requires the single-column layout and the sample capability.

  - do:
      indices.create:
        index: la_sample
        body:
          mappings:
            dynamic: false
            properties:
              id:
                type: long

  - do:
      bulk:
        refresh: true
        body:
          - { "index": { "_index": "la_sample", "_id": "1" } }
          - { "id": 1, "note": "a" }
          - { "index": { "_index": "la_sample", "_id": "2" } }
          - { "id": 2, "note": "b" }

---
teardown:
  - do:
      indices.delete:
        index: la_sample
        ignore_unavailable: true

---
'SAMPLE carries _unmapped_fields through on the surviving rows':
  - do:
      esql.query:
        body:
          query: 'SET unmapped_fields="LOAD_ALL"; FROM la_sample | SAMPLE .9999999999999999 | SORT id | LIMIT 10'
  - length: { columns: 2 }
  - match: { columns.0.name: id }
  - match: { columns.1.name: _unmapped_fields }
  - match: { values.0: [ 1, { note: a } ] }
  - match: { values.1: [ 2, { note: b } ] }

---
'SAMPLE composes with WHERE and a KEEP that names an unmapped field':
  - do:
      esql.query:
        body:
          query: 'SET unmapped_fields="LOAD_ALL"; FROM la_sample | SAMPLE .9999999999999999 | WHERE id == 1 | KEEP id, note | LIMIT 10'
  - length: { columns: 2 }
  - match: { columns.0.name: id }
  - match: { columns.1.name: note }
  - match: { columns.1.type: keyword }
  - match: { values: [ [ 1, a ] ] }

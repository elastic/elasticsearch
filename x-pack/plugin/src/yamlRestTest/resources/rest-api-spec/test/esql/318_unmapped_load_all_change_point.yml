---
setup:
  - requires:
      test_runner_features: [ capabilities, contains ]
      capabilities:
        - method: POST
          path: /_query
          parameters: [ ]
          capabilities: [ optional_fields_load_all_single_source_column, optional_fields_load_all_change_point, change_point ]
      reason: "CHANGE_POINT is only allowed under unmapped_fields=\"LOAD_ALL\" with this capability"

  - do:
      indices.create:
        index: la_change_point
        body:
          mappings:
            dynamic: false
            properties:
              id:
                type: long
              value:
                type: long

  - do:
      bulk:
        refresh: true
        body:
          - { "index": { "_index": "la_change_point", "_id": "1" } }
          - { "id": 1, "value": 10, "uvalue": "5", "note": "a" }

---
teardown:
  - do:
      indices.delete:
        index: la_change_point
        ignore_unavailable: true

---
'CHANGE_POINT over an unmapped value is rejected because unmapped fields load as keyword':
  - do:
      catch: bad_request
      esql.query:
        body:
          query: 'SET unmapped_fields="LOAD_ALL"; FROM la_change_point | CHANGE_POINT uvalue ON id'
  - match: { status: 400 }
  - match: { error.type: verification_exception }
  - contains: { error.reason: 'CHANGE_POINT only supports numeric values, found expression [uvalue] type [KEYWORD]' }

---
'CHANGE_POINT cannot read the _unmapped_fields column':
  - do:
      catch: bad_request
      esql.query:
        body:
          query: 'SET unmapped_fields="LOAD_ALL"; FROM la_change_point | KEEP id, note* | CHANGE_POINT _unmapped_fields ON id'
  - match: { status: 400 }
  - match: { error.type: verification_exception }
  - contains: { error.reason: 'Unknown column [_unmapped_fields]' }

---
setup:
  - requires:
      test_runner_features: [ capabilities, contains ]
      capabilities:
        - method: POST
          path: /_query
          parameters: [ ]
          capabilities: [ optional_fields_load_all_single_source_column, optional_fields_load_all_compound_output_limit_by_dedup, ip_location_command, uri_parts_command, registered_domain_command, user_agent_command, esql_limit_by ]
      reason: "These commands are only allowed under unmapped_fields=\"LOAD_ALL\" with this capability"

  - do:
      indices.create:
        index: la_misuse2
        body:
          mappings:
            dynamic: false
            properties:
              id:
                type: keyword

  - do:
      bulk:
        refresh: true
        body:
          - { "index": { "_index": "la_misuse2", "_id": "1" } }
          - { "id": "1", "note": "beta two" }

---
teardown:
  - do:
      indices.delete:
        index: la_misuse2
        ignore_unavailable: true

---
'URI_PARTS cannot read the _unmapped_fields column':
  - do:
      catch: bad_request
      esql.query:
        body:
          query: 'SET unmapped_fields="LOAD_ALL"; FROM la_misuse2 | KEEP id, note*, addr | URI_PARTS p = _unmapped_fields'
  - match: { status: 400 }
  - match: { error.type: verification_exception }
  - contains: { error.reason: 'Unknown column [_unmapped_fields]' }


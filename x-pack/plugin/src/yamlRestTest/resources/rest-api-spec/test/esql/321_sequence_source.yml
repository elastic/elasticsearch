---
setup:
  - requires:
      test_runner_features: [ capabilities ]
      capabilities:
        - method: POST
          path: /_query
          parameters: [ ]
          capabilities: [ sequence_command, sequence_light_provenance ]
      reason: "Requires native SEQUENCE with light provenance"

  - do:
      indices.create:
        index: sequence-source-http-a
        body:
          settings: { number_of_shards: 1, number_of_replicas: 0, index.mapping.source.mode: stored }
          mappings:
            dynamic: false
            properties:
              "@timestamp": { type: date_nanos }
              key: { type: keyword }
              payload: { type: keyword }
              number: { type: long }
  - do:
      indices.create:
        index: sequence-source-http-b
        body:
          settings: { number_of_shards: 1, number_of_replicas: 0, index.mapping.source.mode: stored }
          mappings:
            dynamic: false
            properties:
              "@timestamp": { type: date_nanos }
              key: { type: keyword }
              payload: { type: keyword }
  - do:
      bulk:
        refresh: true
        body:
          - { index: { _index: sequence-source-http-a, _id: A } }
          - { "@timestamp": "2026-09-25T21:14:51.389000000Z", key: shared, payload: first, number: 9007199254740993,
              unused: { array: [duplicate, null, duplicate], object: {nested: [{value: one}, {value: two}]}, explicit_null: null } }
          - { index: { _index: sequence-source-http-b, _id: B } }
          - { "@timestamp": "2026-09-25T21:14:51.389000001Z", key: shared, payload: second, explicit_null: null }

---
"Removed RETURN MATCHES has a clear authoring error":
  - do:
      catch: bad_request
      esql.query:
        body:
          query: >-
            SEQUENCE BY key WITHIN 30s PRIMARY 1
            (FROM sequence-source-http-a), (FROM sequence-source-http-b)
            | KEEP key | LIMIT 1 | RETURN MATCHES
  - match: { error.type: parsing_exception }
  - match: { error.reason: "/(?-x)line [0-9]+:[0-9]+: RETURN MATCHES was removed; use .* MEMBER.*/" }

---
"Explicit primary source keeps ordinary JSON objects":
  - do:
      esql.query:
        body:
          query: >-
            SEQUENCE BY key WITHIN 30s PRIMARY 1
            (FROM sequence-source-http-a METADATA _source), (FROM sequence-source-http-b)
            | KEEP key, _source | LIMIT 1
  - length: { columns: 2 }
  - match: { columns.1.name: _source }
  - match: { columns.1.type: _source }
  - match:
      values:
        - - shared
          - { "@timestamp": "2026-09-25T21:14:51.389000000Z", key: shared, payload: first, number: 9007199254740993,
              unused: { array: [duplicate, null, duplicate], object: {nested: [{value: one}, {value: two}]}, explicit_null: null } }
  - is_false: sequences

---
"Ordinary provenance identifies the exact matched documents":
  - do:
      esql.query:
        body:
          query: >-
            SEQUENCE BY key WITHIN 30s PRIMARY 2
            (FROM sequence-source-http-a), (FROM sequence-source-http-b)
            | EVAL evidence = MV_SORT(sequence_provenance)
            | KEEP key, evidence | LIMIT 1
  - length: { columns: 2 }
  - match: { columns.1.name: evidence }
  - match: { columns.1.type: keyword }
  - match:
      values:
        - - shared
          - - '{"stage":1,"index":"sequence-source-http-a","id":"A"}'
            - '{"stage":2,"index":"sequence-source-http-b","id":"B"}'
  - is_false: sequences

      - id: b
        items:
        - { note: ciao, note2: hey, sku: z, mot: m3, kw: k3, num: 3 }
      - index:
          _index: sb_nested_columnar
      - id: a
        items:
        - { note: hello, note2: hi, sku: x, mot: m1, kw: k1, num: 1 }
        - { note: bye, note2: yo, sku: y, mot: m2, kw: k2, num: 2 }
      - index:

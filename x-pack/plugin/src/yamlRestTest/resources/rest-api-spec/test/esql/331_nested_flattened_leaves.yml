            id:
              type: keyword
            items:
              properties:
                note:
                  type: text
                kw:
                  type: keyword
                  doc_values: false
                price:
                  type: long
- do:
    bulk:
      refresh: true
      body:
      - index:
          _index: fs_excl_nested
      - id: a
        items:
        - { note: only }
        - { price: 5 }
        - { note: n3, kw: k3, price: 3 }
      - index:
          _index: fs_excl_object
      - id: a
        items:
        - { note: only }
        - { price: 5 }
        - { note: n3, kw: k3, price: 3 }
      - index:
          _index: fs_incl_nested
      - id: a
        items:
        - { note: only }
        - { price: 5 }
        - { note: n3, kw: k3, price: 3 }
      - index:
          _index: fs_incl_object
      - id: a

---
a field read from a filtered _source is null under a nested object:
# Filtering _source as it is stored drops the objects it empties, so the stored _source no longer tells which object each child
# document was indexed from. A field read from it is null with a warning, rather than another object's value or a failed shard.
# Doc values are read from the child documents themselves, and a disabled _source has nothing to read.
- do:
    indices.create:
      index: fs_excl_nested
      body:
        settings:
          number_of_shards: 1
          number_of_replicas: 0
        mappings:
          _source:
            excludes: [items.note]
          dynamic: strict
          properties:
            id:
              type: keyword
            items:
              type: nested
              properties:
                note:
                  type: text
                kw:
                  type: keyword
                  doc_values: false
                price:
                  type: long
- do:
    indices.create:
      index: fs_excl_object
      body:
        settings:
          number_of_shards: 1
          number_of_replicas: 0
        mappings:
          _source:
            excludes: [items.note]
          dynamic: strict
          properties:
            id:
              type: keyword
            items:
              properties:
                note:
                  type: text
                kw:
                  type: keyword
                  doc_values: false
                price:
                  type: long
- do:
    indices.create:
      index: fs_incl_nested
      body:
        settings:
          number_of_shards: 1
          number_of_replicas: 0
        mappings:
          _source:
            includes: [id, items.kw]
          dynamic: strict
          properties:
            id:
              type: keyword
            items:
              type: nested
              properties:
                note:
                  type: text
                kw:
                  type: keyword
                  doc_values: false
                price:
                  type: long
- do:
    indices.create:
      index: fs_incl_object
      body:
        settings:
          number_of_shards: 1
          number_of_replicas: 0
        mappings:
          _source:
            includes: [id, items.kw]
          dynamic: strict
          properties:
            id:
              type: keyword
            items:
              properties:
                note:
                  type: text
                kw:
                  type: keyword
                  doc_values: false
                price:
                  type: long
- do:
    indices.create:
      index: fs_off_nested
      body:
        settings:
          number_of_shards: 1
          number_of_replicas: 0
        mappings:
          _source:
            enabled: false
          dynamic: strict
          properties:
            id:
              type: keyword
            items:
              type: nested
              properties:
                note:
                  type: text
                kw:
                  type: keyword
                  doc_values: false
                price:

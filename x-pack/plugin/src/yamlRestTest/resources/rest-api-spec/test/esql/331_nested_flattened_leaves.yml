        - { note: only }
        - { price: 5 }
        - { note: n3, kw: k3, price: 3 }
      - index:
          _index: fs_off_object
      - id: a
        items:
        - { note: only }
        - { price: 5 }
        - { note: n3, kw: k3, price: 3 }
- do:
    warnings:
    - "Field [items.note] cannot be retrieved from the filtered _source of index [fs_excl_nested]; returning null"
    - "Field [items.kw] cannot be retrieved from the filtered _source of index [fs_excl_nested]; returning null"
    - "Field [items.note] cannot be retrieved from the filtered _source of index [fs_incl_nested]; returning null"
    - "Field [items.kw] cannot be retrieved from the filtered _source of index [fs_incl_nested]; returning null"
    esql.query:

- do:
    esql.query:
      body:
        query: "FROM sb_* METADATA _index | EVAL note = MV_SORT(items.note), note2 = MV_SORT(items.note2), raw = MV_SORT(items.note2.raw), sku = MV_SORT(items.sku), skutext = MV_SORT(items.sku.text), mot = MV_SORT(items.mot), kw = MV_SORT(items.kw), nodv = MV_SORT(items.kw.nodv), num = MV_SORT(items.num) | KEEP _index, id, note, note2, raw, sku, skutext, mot, kw, nodv, num | SORT _index, id DESC | LIMIT 20"
- match:
    values:
    - [sb_nested_columnar, b, ciao, hey, hey, z, z, m3, k3, k3, 3]
    - [sb_nested_columnar, a, [bye, hello], [hi, yo], [hi, yo], [x, y], [x, y], [m1, m2], [k1, k2], [k1, k2], [1, 2]]

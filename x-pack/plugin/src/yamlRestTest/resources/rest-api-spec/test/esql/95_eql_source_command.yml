setup:
  - requires:
      test_runner_features: [capabilities, allowed_warnings, allowed_warnings_regex, warnings, warnings_regex]
      capabilities:
        - method: POST
          path: /_query
          parameters: [method, path, parameters, capabilities]
          capabilities: [eql_command, eql_command_metadata]
      reason: "EQL source command (with METADATA) is snapshot-only, gated on the eql_command capabilities"

  - do:
      indices.create:
        index: eql_events
        body:
          settings:
            number_of_shards: 1
          mappings:
            properties:
              "@timestamp": { type: date }
              event:
                properties:
                  category: { type: keyword }
              message: { type: keyword }

  - do:
      bulk:
        index: eql_events
        refresh: true
        body:
          - { "index": { "_id": "1" } }
          - { "@timestamp": "2024-01-01T00:00:01Z", "event": { "category": "process" }, "message": "start" }
          - { "index": { "_id": "2" } }
          - { "@timestamp": "2024-01-01T00:00:02Z", "event": { "category": "process" }, "message": "run" }
          - { "index": { "_id": "3" } }
          - { "@timestamp": "2024-01-01T00:00:03Z", "event": { "category": "network" }, "message": "connect" }

  - do:
      indices.create:
        index: eql_pairs
        body:
          settings:
            number_of_shards: 1
          mappings:
            properties:
              "@timestamp": { type: date }
              event:
                properties:
                  category: { type: keyword }
              pid: { type: long }

  - do:
      bulk:
        index: eql_pairs
        refresh: true
        body:
          - { "index": { "_id": "p1" } }
          - { "@timestamp": "2024-01-01T00:00:01Z", "event": { "category": "process" }, "pid": 1 }
          - { "index": { "_id": "n1" } }
          - { "@timestamp": "2024-01-01T00:00:02Z", "event": { "category": "network" }, "pid": 1 }
          - { "index": { "_id": "p2" } }
          - { "@timestamp": "2024-01-01T00:00:03Z", "event": { "category": "process" }, "pid": 2 }
          - { "index": { "_id": "n2" } }
          - { "@timestamp": "2024-01-01T00:00:04Z", "event": { "category": "network" }, "pid": 2 }
          - { "index": { "_id": "p3" } }
          - { "@timestamp": "2024-01-01T00:00:05Z", "event": { "category": "process" }, "pid": 3 }
          - { "index": { "_id": "n3" } }
          - { "@timestamp": "2024-01-01T00:00:06Z", "event": { "category": "network" }, "pid": 3 }
          - { "index": { "_id": "p4" } }
          - { "@timestamp": "2024-01-01T00:00:07Z", "event": { "category": "process" }, "pid": 4 }
          - { "index": { "_id": "n4" } }
          - { "@timestamp": "2024-01-01T00:00:08Z", "event": { "category": "network" }, "pid": 4 }
          - { "index": { "_id": "p5" } }
          - { "@timestamp": "2024-01-01T00:00:09Z", "event": { "category": "process" }, "pid": 5 }
          - { "index": { "_id": "n5" } }
          - { "@timestamp": "2024-01-01T00:00:10Z", "event": { "category": "network" }, "pid": 5 }
          - { "index": { "_id": "p6" } }
          - { "@timestamp": "2024-01-01T00:00:11Z", "event": { "category": "process" }, "pid": 6 }
          - { "index": { "_id": "n6" } }
          - { "@timestamp": "2024-01-01T00:00:12Z", "event": { "category": "network" }, "pid": 6 }
          - { "index": { "_id": "p7" } }
          - { "@timestamp": "2024-01-01T00:00:13Z", "event": { "category": "process" }, "pid": 7 }
          - { "index": { "_id": "n7" } }
          - { "@timestamp": "2024-01-01T00:00:14Z", "event": { "category": "network" }, "pid": 7 }
          - { "index": { "_id": "p8" } }
          - { "@timestamp": "2024-01-01T00:00:15Z", "event": { "category": "process" }, "pid": 8 }
          - { "index": { "_id": "n8" } }
          - { "@timestamp": "2024-01-01T00:00:16Z", "event": { "category": "network" }, "pid": 8 }
          - { "index": { "_id": "p9" } }
          - { "@timestamp": "2024-01-01T00:00:17Z", "event": { "category": "process" }, "pid": 9 }
          - { "index": { "_id": "n9" } }
          - { "@timestamp": "2024-01-01T00:00:18Z", "event": { "category": "network" }, "pid": 9 }
          - { "index": { "_id": "p10" } }
          - { "@timestamp": "2024-01-01T00:00:19Z", "event": { "category": "process" }, "pid": 10 }
          - { "index": { "_id": "n10" } }
          - { "@timestamp": "2024-01-01T00:00:20Z", "event": { "category": "network" }, "pid": 10 }
          - { "index": { "_id": "p11" } }
          - { "@timestamp": "2024-01-01T00:00:21Z", "event": { "category": "process" }, "pid": 11 }
          - { "index": { "_id": "n11" } }
          - { "@timestamp": "2024-01-01T00:00:22Z", "event": { "category": "network" }, "pid": 11 }
          - { "index": { "_id": "p12" } }
          - { "@timestamp": "2024-01-01T00:00:23Z", "event": { "category": "process" }, "pid": 12 }
          - { "index": { "_id": "n12" } }
          - { "@timestamp": "2024-01-01T00:00:24Z", "event": { "category": "network" }, "pid": 12 }

  - do:
      indices.create:
        index: eql_join_keys
        body:
          settings:
            number_of_shards: 1
          mappings:
            properties:
              "@timestamp": { type: date }
              event:
                properties:
                  category: { type: keyword }
              pid: { type: long }
              join_keys: { type: keyword }

  - do:
      bulk:
        index: eql_join_keys
        refresh: true
        body:
          - { "index": { "_id": "p1" } }
          - { "@timestamp": "2024-01-01T00:00:01Z", "event": { "category": "process" }, "pid": 1, "join_keys": "mapped-p1" }
          - { "index": { "_id": "n1" } }
          - { "@timestamp": "2024-01-01T00:00:02Z", "event": { "category": "network" }, "pid": 1, "join_keys": "mapped-n1" }

---
"Event query renders METADATA _source through the REST layer":
  - do:
      allowed_warnings:
        - "No limit defined, adding default limit of [1000]"
      allowed_warnings_regex:
        - '.*EQL query used the default size of \[10\] matches.*'
      esql.query:
        body:
          query: 'EQL eql_events "process where true" METADATA _id, _source | KEEP _id, _source | SORT _id'
  - match: { columns.0.name: _id }
  - match: { columns.0.type: keyword }
  - match: { columns.1.name: _source }
  - match: { columns.1.type: _source }
  - length: { values: 2 }
  - match:
      values.0.0: "1"
  - match:
      values.0.1:
        "@timestamp": "2024-01-01T00:00:01Z"
        event:
          category: process
        message: start

---
"Sequence query prepends the synthetic columns":
  - do:
      allowed_warnings:
        - "No limit defined, adding default limit of [1000]"
      allowed_warnings_regex:
        - '.*EQL query used the default size of \[10\] matches.*'
      esql.query:
        body:
          query: 'EQL eql_events "sequence [process where message == \"start\"] [process where message == \"run\"]" | KEEP _sequence, _sequence_stage, join_keys'
  - match: { columns.0.name: _sequence }
  - match: { columns.0.type: long }
  - match: { columns.1.name: _sequence_stage }
  - match: { columns.1.type: integer }
  - match: { columns.2.name: join_keys }
  - match: { columns.2.type: keyword }
  - length: { values: 2 }
  - match: { values.0.0: 0 }
  - match: { values.0.1: 0 }
  - match: { values.1.0: 0 }
  - match: { values.1.1: 1 }

---
"Sequence query returns at most the default size of matches":
  - requires:
      capabilities:
        - method: POST
          path: /_query
          parameters: [method, path, parameters, capabilities]
          capabilities: [eql_command_size_independent_of_limit]
      reason: "the size comes only from WITH, defaulting to EQL's 10"
  - do:
      allowed_warnings:
        - "No limit defined, adding default limit of [1000]"
      warnings_regex:
        - '.*EQL query used the default size of \[10\] matches.*'
      esql.query:
        body:
          query: 'EQL eql_pairs "sequence by pid [process where true] [network where true]" | STATS events = COUNT(*), sequences = COUNT_DISTINCT(_sequence)'
  - match: { values: [[20, 10]] }

  - do:
      allowed_warnings:
        - "No limit defined, adding default limit of [1000]"
      esql.query:
        body:
          query: 'EQL eql_pairs "sequence by pid [process where true] [network where true]" WITH {"size": 4} | STATS events = COUNT(*), sequences = COUNT_DISTINCT(_sequence)'
  - match: { values: [[8, 4]] }

---
"Sequence LIMIT cuts a match part-way":
  - requires:
      capabilities:
        - method: POST
          path: /_query
          parameters: [method, path, parameters, capabilities]
          capabilities: [eql_command_size_independent_of_limit]
      reason: "LIMIT only trims rows, so it keeps the first rows of the last 10 sequences"
  - do:
      warnings_regex:
        - '.*EQL query used the default size of \[10\] matches.*'
      esql.query:
        body:
          query: 'EQL eql_pairs "sequence by pid [process where true] [network where true]" | LIMIT 3 | KEEP _sequence, _sequence_stage, join_keys'
  - match: { values: [[0, 0, "3"], [0, 1, "3"], [1, 0, "4"]] }

  - do:
      warnings_regex:
        - '.*EQL query used the default size of \[10\] matches.*'
      esql.query:
        body:
          query: 'EQL eql_pairs "sequence by pid [process where true] [network where true]" WITH {"result_position": "head"} | LIMIT 3 | KEEP _sequence, _sequence_stage, join_keys'
  - match: { values: [[0, 0, "1"], [0, 1, "1"], [1, 0, "2"]] }

---
"An EQL view that uses the default size warns with the view name":
  - requires:
      capabilities:
        - method: GET
          path: /_query/view
          capabilities: [view_index_abstraction]
        - method: POST
          path: /_query
          parameters: [method, path, parameters, capabilities]
          capabilities: [eql_command_size_independent_of_limit]
      reason: "the default size warning of an EQL source inside a view names the view"
  - do:
      esql.put_view:
        name: eql_process_view
        body:
          query: 'EQL eql_events "process where true"'

  - do:
      allowed_warnings:
        - "No limit defined, adding default limit of [1000]"
      warnings_regex:
        - 'Line 1:1 \(in view \[eql_process_view\]\): EQL query used the default size of \[10\] matches\..*'
      esql.query:
        body:
          query: 'FROM eql_process_view | KEEP message | SORT message'
  - match: { values: [["run"], ["start"]] }

  - do:
      esql.delete_view:
        name: eql_process_view

---
"A mapped field named like a sequence column is shadowed by it":
  - requires:
      capabilities:
        - method: POST
          path: /_query
          parameters: [method, path, parameters, capabilities]
          capabilities: [eql_command_errors_and_shadowed_fields, fn_json_extract]
      reason: "the EQL command's column wins over a mapped field of the same name, with a warning"
  - do:
      allowed_warnings:
        - "No limit defined, adding default limit of [1000]"
      warnings:
        - "Line 1:1: Mapped field [join_keys] is shadowed by the EQL command's column of the same name; read it with FROM, or with JSON_EXTRACT on METADATA _source if the document stores it"
      esql.query:
        body:
          query: 'EQL eql_join_keys "sequence by pid [process where true] [network where true]" METADATA _source WITH {"size": 1} | EVAL mapped = JSON_EXTRACT(_source, "join_keys") | KEEP _sequence_stage, join_keys, mapped | SORT _sequence_stage'
  - match: { columns.1.name: join_keys }
  - match: { columns.1.type: keyword }
  - match: { values: [[0, "1", "mapped-p1"], [1, "1", "mapped-n1"]] }

  - do:
      allowed_warnings:
        - "No limit defined, adding default limit of [1000]"
      esql.query:
        body:
          query: 'EQL eql_join_keys "process where true" WITH {"size": 1} | KEEP join_keys'
  - match: { columns.0.type: keyword }
  - match: { values: [["mapped-p1"]] }

---
"An EQL view that shadows a mapped field warns with the view name":
  - requires:
      capabilities:
        - method: GET
          path: /_query/view
          capabilities: [view_index_abstraction]
        - method: POST
          path: /_query
          parameters: [method, path, parameters, capabilities]
          capabilities: [eql_command_errors_and_shadowed_fields]
      reason: "the warning of an EQL source inside a view names the view, not the view definition"
  - do:
      esql.put_view:
        name: eql_join_keys_view
        body:
          query: 'EQL eql_join_keys "sequence by pid [process where true] [network where true]" WITH {"size": 1}'

  - do:
      allowed_warnings:
        - "No limit defined, adding default limit of [1000]"
      warnings:
        - "Line 1:1 (in view [eql_join_keys_view]): Mapped field [join_keys] is shadowed by the EQL command's column of the same name; read it with FROM, or with JSON_EXTRACT on METADATA _source if the document stores it"
      esql.query:
        body:
          query: 'FROM eql_join_keys_view | KEEP _sequence_stage, join_keys | SORT _sequence_stage'
  - match: { values: [[0, "1"], [1, "1"]] }

  - do:
      esql.delete_view:
        name: eql_join_keys_view

---
"A view is not a valid EQL target":
  - requires:
      capabilities:
        - method: GET
          path: /_query/view
          capabilities: [view_index_abstraction]
        - method: POST
          path: /_query
          parameters: [method, path, parameters, capabilities]
          capabilities: [eql_command_errors_and_shadowed_fields]
      reason: "a view named as the EQL target gets its own error that points to FROM"
  - do:
      esql.put_view:
        name: eql_target_view
        body:
          query: 'FROM eql_events'

  - do:
      catch: bad_request
      esql.query:
        body:
          query: 'EQL eql_target_view "process where true"'
  - match: { error.type: verification_exception }
  - match: { error.reason: "/.*Views.are.not.supported.in.EQL.command,.found.view\\(s\\).\\[eql_target_view\\];.use.FROM.eql_target_view.instead.*/" }

  - do:
      catch: bad_request
      esql.query:
        body:
          query: 'EQL eql_events,eql_target_view "process where true"'
  - match: { error.type: verification_exception }
  - match: { error.reason: "/.*Views.are.not.supported.in.EQL.command,.found.view\\(s\\).\\[eql_target_view\\];.use.FROM.eql_target_view.instead.*/" }

  - do:
      esql.delete_view:
        name: eql_target_view

---
"An error the EQL engine finds at run time is located in both queries":
  - requires:
      capabilities:
        - method: POST
          path: /_query
          parameters: [method, path, parameters, capabilities]
          capabilities: [eql_command_errors_and_shadowed_fields]
      reason: "an EQL engine error gives the EQL command's position and labels its own as in the EQL query"
  - do:
      catch: bad_request
      esql.query:
        body:
          query: 'EQL eql_events "process where nope == 1"'
  - match: { error.type: verification_exception }
  - match: { error.reason: "/^line.1:1:.EQL.query.failed:.line.1:15.of.the.EQL.query:.Unknown.column.\\[nope\\].*/" }
  - match: { error.root_cause.0.type: verification_exception }
  - match: { error.root_cause.0.reason: "/^line.1:1:.EQL.query.failed:.line.1:15.of.the.EQL.query:.Unknown.column.\\[nope\\].*/" }

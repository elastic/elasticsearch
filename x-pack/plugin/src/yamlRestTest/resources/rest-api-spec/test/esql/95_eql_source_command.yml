          - { "index": { "_id": "n11" } }
          - { "@timestamp": "2024-01-01T00:00:22Z", "event": { "category": "network" }, "pid": 11 }
          - { "index": { "_id": "p12" } }
          - { "@timestamp": "2024-01-01T00:00:23Z", "event": { "category": "process" }, "pid": 12 }
          - { "index": { "_id": "n12" } }
          - { "@timestamp": "2024-01-01T00:00:24Z", "event": { "category": "network" }, "pid": 12 }

---
"Event query renders METADATA _source through the REST layer":
  - do:
      allowed_warnings:
        - "No limit defined, adding default limit of [1000]"
      allowed_warnings_regex:
        - '.*EQL query used the default size of \[10\] matches.*'
      esql.query:
        body:
          query: 'EQL eql_events "process where true" METADATA _id, _source | KEEP _id, _source | SORT _id'
  - match: { columns.0.name: _id }
  - match: { columns.0.type: keyword }
  - match: { columns.1.name: _source }
  - match: { columns.1.type: _source }
  - length: { values: 2 }
  - match:
      values.0.0: "1"
  - match:
      values.0.1:
        "@timestamp": "2024-01-01T00:00:01Z"
        event:
          category: process
        message: start

---
"Sequence query prepends the synthetic columns":
  - do:
      allowed_warnings:
        - "No limit defined, adding default limit of [1000]"
      allowed_warnings_regex:
        - '.*EQL query used the default size of \[10\] matches.*'
      esql.query:
        body:
          query: 'EQL eql_events "sequence [process where message == \"start\"] [process where message == \"run\"]" | KEEP _sequence, _sequence_stage, join_keys'
  - match: { columns.0.name: _sequence }
  - match: { columns.0.type: long }
  - match: { columns.1.name: _sequence_stage }
  - match: { columns.1.type: integer }
  - match: { columns.2.name: join_keys }
  - match: { columns.2.type: keyword }
  - length: { values: 2 }
  - match: { values.0.0: 0 }
  - match: { values.0.1: 0 }
  - match: { values.1.0: 0 }
  - match: { values.1.1: 1 }

---
"Sequence query returns at most the default size of matches":
  - requires:
      capabilities:
        - method: POST
          path: /_query
          parameters: [method, path, parameters, capabilities]
          capabilities: [eql_command_size_independent_of_limit]
      reason: "the size comes only from WITH, defaulting to EQL's 10"
  - do:
      allowed_warnings:
        - "No limit defined, adding default limit of [1000]"
      warnings_regex:
        - '.*EQL query used the default size of \[10\] matches.*'
      esql.query:
        body:
          query: 'EQL eql_pairs "sequence by pid [process where true] [network where true]" | STATS events = COUNT(*), sequences = COUNT_DISTINCT(_sequence)'
  - match: { values: [[20, 10]] }

  - do:
      allowed_warnings:
        - "No limit defined, adding default limit of [1000]"
      esql.query:
        body:
          query: 'EQL eql_pairs "sequence by pid [process where true] [network where true]" WITH {"size": 4} | STATS events = COUNT(*), sequences = COUNT_DISTINCT(_sequence)'
  - match: { values: [[8, 4]] }

---
"Sequence LIMIT cuts a match part-way":
  - requires:
      capabilities:
        - method: POST
          path: /_query
          parameters: [method, path, parameters, capabilities]
          capabilities: [eql_command_size_independent_of_limit]
      reason: "LIMIT only trims rows, so it keeps the first rows of the last 10 sequences"
  - do:
      warnings_regex:
        - '.*EQL query used the default size of \[10\] matches.*'
      esql.query:
        body:
          query: 'EQL eql_pairs "sequence by pid [process where true] [network where true]" | LIMIT 3 | KEEP _sequence, _sequence_stage, join_keys'
  - match: { values: [[0, 0, "3"], [0, 1, "3"], [1, 0, "4"]] }

  - do:
      warnings_regex:
        - '.*EQL query used the default size of \[10\] matches.*'
      esql.query:
        body:
          query: 'EQL eql_pairs "sequence by pid [process where true] [network where true]" WITH {"result_position": "head"} | LIMIT 3 | KEEP _sequence, _sequence_stage, join_keys'
  - match: { values: [[0, 0, "1"], [0, 1, "1"], [1, 0, "2"]] }

---
"An EQL view that uses the default size warns with the view name":
  - requires:
      capabilities:
        - method: GET
          path: /_query/view
          capabilities: [view_index_abstraction]
        - method: POST
          path: /_query
          parameters: [method, path, parameters, capabilities]
          capabilities: [eql_command_size_independent_of_limit]
      reason: "the default size warning of an EQL source inside a view names the view"
  - do:
      esql.put_view:
        name: eql_process_view
        body:
          query: 'EQL eql_events "process where true"'

  - do:
      allowed_warnings:
        - "No limit defined, adding default limit of [1000]"
      warnings_regex:
        - '.*\(in view \[eql_process_view\]\): EQL query used the default size of \[10\] matches.*'
      esql.query:
        body:
          query: 'FROM eql_process_view | KEEP message | SORT message'
  - match: { values: [["run"], ["start"]] }

  - do:
      esql.delete_view:
        name: eql_process_view

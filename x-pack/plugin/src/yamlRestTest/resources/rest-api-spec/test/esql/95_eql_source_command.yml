setup:
  - requires:
      test_runner_features: [capabilities, allowed_warnings]
      capabilities:
        - method: POST
          path: /_query
          parameters: [method, path, parameters, capabilities]
          capabilities: [eql_command, eql_command_metadata]
      reason: "EQL source command (with METADATA) is snapshot-only, gated on the eql_command capabilities"

  - do:
      indices.create:
        index: eql_events
        body:
          settings:
            number_of_shards: 1
          mappings:
            properties:
              "@timestamp": { type: date }
              event:
                properties:
                  category: { type: keyword }
              message: { type: keyword }

  - do:
      bulk:
        index: eql_events
        refresh: true
        body:
          - { "index": { "_id": "1" } }
          - { "@timestamp": "2024-01-01T00:00:01Z", "event": { "category": "process" }, "message": "start" }
          - { "index": { "_id": "2" } }
          - { "@timestamp": "2024-01-01T00:00:02Z", "event": { "category": "process" }, "message": "run" }
          - { "index": { "_id": "3" } }
          - { "@timestamp": "2024-01-01T00:00:03Z", "event": { "category": "network" }, "message": "connect" }

---
"Event query renders METADATA _source through the REST layer":
  - do:
      allowed_warnings:
        - "No limit defined, adding default limit of [1000]"
      esql.query:
        body:
          query: 'EQL eql_events "process where true" METADATA _id, _source | KEEP _id, _source | SORT _id'
  - match: { columns.0.name: _id }
  - match: { columns.0.type: keyword }
  - match: { columns.1.name: _source }
  - match: { columns.1.type: _source }
  - length: { values: 2 }
  - match:
      values.0.0: "1"
  - match:
      values.0.1:
        "@timestamp": "2024-01-01T00:00:01Z"
        event:
          category: process
        message: start

---
"Sequence query prepends the synthetic columns":
  - do:
      allowed_warnings:
        - "No limit defined, adding default limit of [1000]"
      esql.query:
        body:
          query: 'EQL eql_events "sequence [process where message == \"start\"] [process where message == \"run\"]" | KEEP _sequence, _sequence_stage, join_keys'
  - match: { columns.0.name: _sequence }
  - match: { columns.0.type: long }
  - match: { columns.1.name: _sequence_stage }
  - match: { columns.1.type: integer }
  - match: { columns.2.name: join_keys }
  - match: { columns.2.type: keyword }
  - length: { values: 2 }
  - match: { values.0.0: 0 }
  - match: { values.0.1: 0 }
  - match: { values.1.0: 0 }
  - match: { values.1.1: 1 }

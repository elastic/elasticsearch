setup:
  - requires:
      test_runner_features: [capabilities, allowed_warnings, allowed_warnings_regex, warnings_regex]
      capabilities:
        - method: POST
          path: /_query
          parameters: [method, path, parameters, capabilities]
          capabilities: [eql_command, eql_command_metadata]
      reason: "EQL source command (with METADATA) is snapshot-only, gated on the eql_command capabilities"

  - do:
      indices.create:
        index: eql_events
        body:
          settings:
            number_of_shards: 1
          mappings:
            properties:
              "@timestamp": { type: date }
              event:
                properties:
                  category: { type: keyword }
              message: { type: keyword }

  - do:
      bulk:
        index: eql_events
        refresh: true
        body:
          - { "index": { "_id": "1" } }
          - { "@timestamp": "2024-01-01T00:00:01Z", "event": { "category": "process" }, "message": "start" }
          - { "index": { "_id": "2" } }
          - { "@timestamp": "2024-01-01T00:00:02Z", "event": { "category": "process" }, "message": "run" }
          - { "index": { "_id": "3" } }
          - { "@timestamp": "2024-01-01T00:00:03Z", "event": { "category": "network" }, "message": "connect" }

  - do:
      indices.create:
        index: eql_pairs
        body:
          settings:
            number_of_shards: 1
          mappings:
            properties:
              "@timestamp": { type: date }
              event:
                properties:
                  category: { type: keyword }
              pid: { type: long }

  - do:
      bulk:
        index: eql_pairs
        refresh: true
        body:
          - { "index": { "_id": "p1" } }
          - { "@timestamp": "2024-01-01T00:00:01Z", "event": { "category": "process" }, "pid": 1 }
          - { "index": { "_id": "n1" } }
          - { "@timestamp": "2024-01-01T00:00:02Z", "event": { "category": "network" }, "pid": 1 }
          - { "index": { "_id": "p2" } }
          - { "@timestamp": "2024-01-01T00:00:03Z", "event": { "category": "process" }, "pid": 2 }
          - { "index": { "_id": "n2" } }
          - { "@timestamp": "2024-01-01T00:00:04Z", "event": { "category": "network" }, "pid": 2 }
          - { "index": { "_id": "p3" } }
          - { "@timestamp": "2024-01-01T00:00:05Z", "event": { "category": "process" }, "pid": 3 }
          - { "index": { "_id": "n3" } }
          - { "@timestamp": "2024-01-01T00:00:06Z", "event": { "category": "network" }, "pid": 3 }
          - { "index": { "_id": "p4" } }
          - { "@timestamp": "2024-01-01T00:00:07Z", "event": { "category": "process" }, "pid": 4 }
          - { "index": { "_id": "n4" } }
          - { "@timestamp": "2024-01-01T00:00:08Z", "event": { "category": "network" }, "pid": 4 }
          - { "index": { "_id": "p5" } }
          - { "@timestamp": "2024-01-01T00:00:09Z", "event": { "category": "process" }, "pid": 5 }
          - { "index": { "_id": "n5" } }
          - { "@timestamp": "2024-01-01T00:00:10Z", "event": { "category": "network" }, "pid": 5 }
          - { "index": { "_id": "p6" } }
          - { "@timestamp": "2024-01-01T00:00:11Z", "event": { "category": "process" }, "pid": 6 }
          - { "index": { "_id": "n6" } }
          - { "@timestamp": "2024-01-01T00:00:12Z", "event": { "category": "network" }, "pid": 6 }
          - { "index": { "_id": "p7" } }
          - { "@timestamp": "2024-01-01T00:00:13Z", "event": { "category": "process" }, "pid": 7 }
          - { "index": { "_id": "n7" } }
          - { "@timestamp": "2024-01-01T00:00:14Z", "event": { "category": "network" }, "pid": 7 }
          - { "index": { "_id": "p8" } }
          - { "@timestamp": "2024-01-01T00:00:15Z", "event": { "category": "process" }, "pid": 8 }
          - { "index": { "_id": "n8" } }
          - { "@timestamp": "2024-01-01T00:00:16Z", "event": { "category": "network" }, "pid": 8 }
          - { "index": { "_id": "p9" } }
          - { "@timestamp": "2024-01-01T00:00:17Z", "event": { "category": "process" }, "pid": 9 }
          - { "index": { "_id": "n9" } }
          - { "@timestamp": "2024-01-01T00:00:18Z", "event": { "category": "network" }, "pid": 9 }
          - { "index": { "_id": "p10" } }
          - { "@timestamp": "2024-01-01T00:00:19Z", "event": { "category": "process" }, "pid": 10 }
          - { "index": { "_id": "n10" } }
          - { "@timestamp": "2024-01-01T00:00:20Z", "event": { "category": "network" }, "pid": 10 }

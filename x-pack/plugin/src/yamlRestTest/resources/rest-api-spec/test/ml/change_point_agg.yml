---
"Test change_point agg simple":

  - do:
      search:
        index: store
        size: 0
        body: >
          {
            "aggs": {
              "date": {
                "date_histogram": {
                  "field": "time",
                  "fixed_interval": "1s"
                },
                "aggs": {
                  "min": {
                    "min": {
                      "field": "cost"
                    }
                  }
                }
              },
              "change_point": {
                "change_point": {
                  "buckets_path": "date>min"
                }
              }
            }
          }
  - is_true: aggregations.change_point.type.trend_change
  - is_true: aggregations.change_point.type.trend_change.p_value
  - is_true: aggregations.change_point.type.trend_change.r_value

---
"Test change_point with missing buckets_path":

  - do:
      catch: /Required \[buckets_path\]/
      search:
        index: store
        size: 0
        body: >
          {
            "aggs": {
              "date": {
                "date_histogram": {
                  "field": "time",
                  "fixed_interval": "1s"
                },
                "aggs": {
                  "avg": {
                    "avg": {
                      "field": "cost"
                    }
                  }
                }
              },
              "change_point": {
                "change_point": {
                }
              }
            }
          }

---
"Test change_point with bad buckets_path":

  - do:
      catch: /No aggregation found for path \[foo\]/
      search:
        index: store
        size: 0
        body: >
          {
            "aggs": {
              "date": {
                "date_histogram": {
                  "field": "time",
                  "fixed_interval": "1s"
                },
                "aggs": {
                  "avg": {
                    "avg": {
                      "field": "cost"
                    }
                  }
                }
              },
              "change_point": {
                "change_point": {
                  "buckets_path": "foo"
                }
              }
            }
          }
---
"Test change_point with too few buckets":

  - do:
      search:
        index: empty-store
        size: 0
        body: >
          {
            "aggs": {
              "date": {
                "date_histogram": {
                  "field": "time",
                  "fixed_interval": "1s"
                },
                "aggs": {
                  "min": {
                    "min": {
                      "field": "cost"
                    }
                  }
                }
              },
              "change_point": {
                "change_point": {
                  "buckets_path": "date"
                }
              }
            }
          }
  - is_true: aggregations.change_point.type.indeterminable
---
"Test change_point honors gap_policy over sparse buckets":

  - do:
      search:
        index: index-sparse-errors
        size: 0
        body: >
          {
            "aggs": {
              "errors_per_minute": {
                "date_histogram": {
                  "field": "time",
                  "fixed_interval": "1m",
                  "min_doc_count": 0,
                  "extended_bounds": { "min": "2026-01-01T00:00:00Z", "max": "2026-01-01T00:29:00Z" }
                },
                "aggs": {
                  "error_count": {
                    "sum": {
                      "field": "errors"
                    }
                  }
                }
              },
              "over_metric_default": {
                "change_point": {
                  "buckets_path": "errors_per_minute>error_count"
                }
              },
              "over_metric_keep_values": {
                "change_point": {
                  "buckets_path": "errors_per_minute>error_count",
                  "gap_policy": "keep_values"
                }
              },
              "over_metric_insert_zeros": {
                "change_point": {
                  "buckets_path": "errors_per_minute>error_count",
                  "gap_policy": "insert_zeros"
                }
              },
              "over_count": {
                "change_point": {
                  "buckets_path": "errors_per_minute>_count"
                }
              }
            }
          }
  # Only 8 of the 30 one-minute buckets hold a document. The default policy drops the other 22,
  # leaving fewer values than the detector needs.
  - is_true: aggregations.over_metric_default.type.indeterminable
  # Both of these keep the empty buckets, whose sum reports a real, finite 0.0.
  - is_true: aggregations.over_metric_keep_values.type
  - is_false: aggregations.over_metric_keep_values.type.indeterminable
  - is_true: aggregations.over_metric_insert_zeros.type
  - is_false: aggregations.over_metric_insert_zeros.type.indeterminable
  # _count is never treated as missing, so it worked before the fix and must keep working.
  - is_true: aggregations.over_count.type
  - is_false: aggregations.over_count.type.indeterminable
---
"Test change_point with terms":
  - do:
      search:
        index: store
        size: 0
        body: >
          {
            "aggs": {
              "terms": {
                 "terms": {
                   "field": "kind"
                 },
                 "aggs": {
                    "date": {
                      "date_histogram": {
                        "field": "time",
                        "fixed_interval": "1s"
                      },
                      "aggs": {
                        "min": {
                          "min": {
                            "field": "cost"
                          }
                        }
                      }
                    },
                    "change_point": {
                      "change_point": {
                        "buckets_path": "date>min"
                      }
                    }
                 }
              }
            }
          }
  - is_true: aggregations.terms.buckets.0.change_point.type.trend_change
  - is_true: aggregations.terms.buckets.0.change_point.type.trend_change.p_value
  - is_true: aggregations.terms.buckets.0.change_point.type.trend_change.r_value
  - is_false: aggregations.terms.buckets.1.change_point.type.trend_change
  - is_false: aggregations.terms.buckets.1.change_point.type.trend_change.p_value
  - is_false: aggregations.terms.buckets.1.change_point.type.trend_change.r_value

  - do:
      search:
        index: store
        size: 0
        body: >
          {
            "aggs": {
              "terms": {
                 "terms": {
                   "field": "kind"
                 },
                 "aggs": {
                    "date": {
                      "date_histogram": {
                        "field": "time",
                        "fixed_interval": "1s"
                      },
                      "aggs": {
                        "min": {
                          "min": {
                            "field": "cost"
                          }
                        }
                      }
                    },
                    "change_point": {
                      "change_point": {
                        "buckets_path": "date>min"
                      }
                    },
                    "select": {
                      "bucket_selector": {
                        "buckets_path": {"p_value": "change_point.p_value"},
                        "script": "params.p_value < 0.5"
                      }
                    }
                 }
              }
            }
          }
  - length: {aggregations.terms.buckets: 1}
  - is_true: aggregations.terms.buckets.0.change_point.type.trend_change
  - is_true: aggregations.terms.buckets.0.change_point.type.trend_change.p_value
  - is_true: aggregations.terms.buckets.0.change_point.type.trend_change.r_value

  - do:
      search:
        index: store
        size: 0
        body: >
          {
            "aggs": {
              "terms": {
                 "terms": {
                   "field": "kind"
                 },
                 "aggs": {
                    "date": {
                      "date_histogram": {
                        "field": "time",
                        "fixed_interval": "1s"
                      },
                      "aggs": {
                        "min": {
                          "min": {
                            "field": "cost"
                          }
                        }
                      }
                    },
                    "change_point": {
                      "change_point": {
                        "buckets_path": "date>min"
                      }
                    },
                    "sort": {
                      "bucket_sort": {
                        "sort": [{"change_point.p_value": {"order": "desc"}}]
                      }
                    }
                 }
              }
            }
          }
  - length: {aggregations.terms.buckets: 2}
  - is_false: aggregations.terms.buckets.0.change_point.type.trend_change
  - is_false: aggregations.terms.buckets.0.change_point.type.trend_change.p_value
  - is_false: aggregations.terms.buckets.0.change_point.type.trend_change.r_value
  - is_true: aggregations.terms.buckets.1.change_point.type.trend_change
  - is_true: aggregations.terms.buckets.1.change_point.type.trend_change.p_value
  - is_true: aggregations.terms.buckets.1.change_point.type.trend_change.r_value

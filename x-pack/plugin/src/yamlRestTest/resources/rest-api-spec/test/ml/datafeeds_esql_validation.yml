setup:
  - requires:
      test_runner_features: [capabilities, headers]
      capabilities:
        - method: PUT
          path: /_ml/datafeeds/{datafeed_id}
          capabilities: [ ml_datafeed_esql_query ]
        - method: POST
          path: /_query
          parameters: [ ]
          capabilities: [ describe_command ]
      reason: "ES|QL datafeeds validate their query with DESCRIBE"

  - do:
      indices.create:
        index: esql-feed-data
        body:
          mappings:
            properties:
              "@timestamp":
                type: date
              event_time:
                type: date
              host:
                type: keyword

  - do:
      headers:
        Authorization: "Basic eF9wYWNrX3Jlc3RfdXNlcjp4LXBhY2stdGVzdC1wYXNzd29yZA==" # run as x_pack_rest_user, i.e. the test setup superuser
      ml.put_job:
        job_id: esql-feed-job
        body: >
          {
            "analysis_config": {
              "bucket_span": "1h",
              "detectors": [{"function": "count"}]
            },
            "data_description": {
              "time_field": "@timestamp"
            }
          }

---
"Test put ES|QL datafeed with a mapped time column":
  - do:
      headers:
        Authorization: "Basic eF9wYWNrX3Jlc3RfdXNlcjp4LXBhY2stdGVzdC1wYXNzd29yZA=="
      ml.put_datafeed:
        datafeed_id: esql-feed-mapped
        body: >
          {
            "job_id": "esql-feed-job",
            "esql_query": "FROM esql-feed-data | KEEP @timestamp, host",
            "source_time_field": "@timestamp",
            "grouping_interval": "1h",
            "delayed_data_check_config": {"enabled": false}
          }
  - match: { datafeed_id: "esql-feed-mapped" }

---
"Test put ES|QL datafeed with a time column bucketed from the source time field":
  - do:
      headers:
        Authorization: "Basic eF9wYWNrX3Jlc3RfdXNlcjp4LXBhY2stdGVzdC1wYXNzd29yZA=="
      ml.put_datafeed:
        datafeed_id: esql-feed-bucket
        body: >
          {
            "job_id": "esql-feed-job",
            "esql_query": "FROM esql-feed-data | STATS c = COUNT(*) BY @timestamp = BUCKET(@timestamp, 1 hour)",
            "source_time_field": "@timestamp",
            "grouping_interval": "1h",
            "delayed_data_check_config": {"enabled": false}
          }
  - match: { datafeed_id: "esql-feed-bucket" }


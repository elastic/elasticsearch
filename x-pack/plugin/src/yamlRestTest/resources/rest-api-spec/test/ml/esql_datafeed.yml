setup:
  - requires:
      capabilities:
        - method: PUT
          path: /_ml/datafeeds/{datafeed_id}
          capabilities: [ ml_datafeed_esql_query ]
      test_runner_features: [ capabilities, headers, warnings_regex ]
      reason: "ES|QL datafeeds are behind the esql_datafeeds feature flag, which is off in release builds"

  - do:
      indices.create:
        index: index-esql-datafeed-lifecycle
        body:
          mappings:
            properties:
              time:
                type: date
              value:
                type: double

  - do:
      index:
        index: index-esql-datafeed-lifecycle
        id: "1"
        body: >
          {"time": "1970-01-01T00:00:01Z", "value": 1.0}

  - do:
      index:
        index: index-esql-datafeed-lifecycle
        id: "2"
        body: >
          {"time": "1970-01-01T00:00:02Z", "value": 2.0}

  - do:
      index:
        index: index-esql-datafeed-lifecycle
        id: "3"
        body: >
          {"time": "1970-01-01T00:00:03Z", "value": 3.0}

  - do:
      indices.refresh:
        index: index-esql-datafeed-lifecycle

  - do:
      headers:
        Authorization: "Basic eF9wYWNrX3Jlc3RfdXNlcjp4LXBhY2stdGVzdC1wYXNzd29yZA==" # run as x_pack_rest_user, i.e. the test setup superuser
      ml.put_job:
        job_id: esql-datafeed-lifecycle-job
        body: >
          {
            "analysis_config": {
              "bucket_span": "1h",
              "detectors": [{"function": "count"}]
            },
            "data_description": {
              "time_field": "time",
              "time_format": "epoch_ms"
            }
          }

  - do:
      headers:
        Authorization: "Basic eF9wYWNrX3Jlc3RfdXNlcjp4LXBhY2stdGVzdC1wYXNzd29yZA==" # run as x_pack_rest_user, i.e. the test setup superuser
      ml.put_datafeed:
        datafeed_id: esql-datafeed-lifecycle-datafeed
        body: >
          {
            "job_id": "esql-datafeed-lifecycle-job",
            "delayed_data_check_config": {"enabled": false},
            "source_time_field": "time",
            "grouping_interval": "1h",
            "esql_query": "FROM index-esql-datafeed-lifecycle | KEEP time, value"
          }

---
"Test ES|QL datafeed validation and STATS BUCKET preview":
  - do:
      catch: /source_time_field/
      ml.put_datafeed:
        datafeed_id: esql-datafeed-missing-source-time
        body: >
          {
            "job_id": "esql-datafeed-lifecycle-job",
            "grouping_interval": "1h",
            "esql_query": "FROM index-esql-datafeed-lifecycle | KEEP time, value"
          }

  - do:
      catch: /grouping_interval/
      ml.put_datafeed:
        datafeed_id: esql-datafeed-missing-grouping-interval
        body: >
          {
            "job_id": "esql-datafeed-lifecycle-job",
            "source_time_field": "time",
            "esql_query": "FROM index-esql-datafeed-lifecycle | KEEP time, value"
          }

  - do:
      catch: /failed to parse field \[grouping_interval\]/
      ml.put_datafeed:
        datafeed_id: esql-datafeed-calendar-grouping-interval
        body: >
          {
            "job_id": "esql-datafeed-lifecycle-job",
            "source_time_field": "time",
            "grouping_interval": "1w",
            "esql_query": "FROM index-esql-datafeed-lifecycle | KEEP time, value"
          }

  - do:
      ml.put_job:
        job_id: esql-datafeed-mismatched-grouping-interval-job
        body: >
          {
            "analysis_config": {
              "bucket_span": "1h",
              "detectors": [{"function": "count"}]
            },
            "data_description": {
              "time_field": "time",
              "time_format": "epoch_ms"
            }
          }

  - do:
      catch: /must equal the job bucket_span/
      ml.put_datafeed:
        datafeed_id: esql-datafeed-mismatched-grouping-interval
        body: >
          {
            "job_id": "esql-datafeed-mismatched-grouping-interval-job",
            "delayed_data_check_config": {"enabled": false},
            "source_time_field": "time",
            "grouping_interval": "2h",
            "esql_query": "FROM index-esql-datafeed-lifecycle | KEEP time, value"
          }

  - do:
      catch: /do not support remote cluster sources.*\[remote_cluster:index-esql-datafeed-lifecycle\]/
      ml.put_datafeed:
        datafeed_id: esql-datafeed-remote-cluster-source
        body: >
          {
            "job_id": "esql-datafeed-lifecycle-job",
            "delayed_data_check_config": {"enabled": false},
            "source_time_field": "time",
            "grouping_interval": "1h",
            "esql_query": "FROM index-esql-datafeed-lifecycle,remote_cluster:index-esql-datafeed-lifecycle | KEEP time, value"
          }

  - do:
      ml.put_job:
        job_id: esql-datafeed-stats-bucket-job
        body: >
          {
            "analysis_config": {
              "bucket_span": "1h",
              "detectors": [{"function": "count"}]
            },
            "data_description": {
              "time_field": "time",
              "time_format": "epoch_ms"
            }
          }

  - do:
      ml.put_datafeed:
        datafeed_id: esql-datafeed-stats-bucket
        body: >
          {
            "job_id": "esql-datafeed-stats-bucket-job",
            "delayed_data_check_config": {"enabled": false},
            "source_time_field": "time",
            "grouping_interval": "1h",
            "esql_query": "FROM index-esql-datafeed-lifecycle | STATS value = AVG(value) BY time = BUCKET(time, 1 hour)"
          }

  - do:
      ml.preview_datafeed:
        datafeed_id: esql-datafeed-stats-bucket
        start: 0
        end: 4000
  - length: { $body: 1 }
  - match: { 0.time: 0 }
  - match: { 0.value: 2.0 }

  - do:
      ml.put_job:
        job_id: esql-datafeed-source-time-field-alias-job
        body: >
          {
            "analysis_config": {
              "bucket_span": "1h",
              "detectors": [{"function": "count"}]
            },
            "data_description": {
              "time_field": "bucket",
              "time_format": "epoch_ms"
            }
          }

  - do:
      catch: /source_time_field \[bucket\]/
      ml.put_datafeed:
        datafeed_id: esql-datafeed-source-time-field-alias
        body: >
          {
            "job_id": "esql-datafeed-source-time-field-alias-job",
            "delayed_data_check_config": {"enabled": false},
            "source_time_field": "bucket",
            "grouping_interval": "1h",
            "esql_query": "FROM index-esql-datafeed-lifecycle | STATS value = AVG(value) BY bucket = BUCKET(time, 1 hour)"
          }

---
"Test ES|QL datafeed lifecycle APIs":
  - do:
      ml.get_datafeeds:
        datafeed_id: esql-datafeed-lifecycle-datafeed
  - match: { datafeeds.0.esql_query: "FROM index-esql-datafeed-lifecycle | KEEP time, value" }

  - do:
      catch: /Recreate ES\|QL datafeed \[esql-datafeed-lifecycle-datafeed\] to change/
      ml.update_datafeed:
        datafeed_id: esql-datafeed-lifecycle-datafeed
        body: >
          {
            "esql_query": "FROM index-esql-datafeed-lifecycle | KEEP time"
          }

  - do:
      catch: /Recreate ES\|QL datafeed \[esql-datafeed-lifecycle-datafeed\] to change/
      ml.update_datafeed:
        datafeed_id: esql-datafeed-lifecycle-datafeed
        body: >
          {
            "query": {"match_all": {}}
          }

  - do:
      catch: /Recreate ES\|QL datafeed \[esql-datafeed-lifecycle-datafeed\] to change/
      ml.update_datafeed:
        datafeed_id: esql-datafeed-lifecycle-datafeed
        body: >
          {
            "indices": ["another-index"]
          }

  - do:
      catch: /Recreate ES\|QL datafeed \[esql-datafeed-lifecycle-datafeed\] to change/
      ml.update_datafeed:
        datafeed_id: esql-datafeed-lifecycle-datafeed
        body: >
          {
            "aggregations": {"max_value": {"max": {"field": "value"}}}
          }

  - do:
      catch: /Recreate ES\|QL datafeed \[esql-datafeed-lifecycle-datafeed\] to change/
      ml.update_datafeed:
        datafeed_id: esql-datafeed-lifecycle-datafeed
        body: >
          {
            "aggs": {"max_value": {"max": {"field": "value"}}}
          }

  - do:
      catch: /script_fields cannot be used in combination with esql_query/
      ml.update_datafeed:
        datafeed_id: esql-datafeed-lifecycle-datafeed
        body: >
          {
            "script_fields": {"copied_value": {"script": "doc['value'].value"}}
          }

  - do:
      catch: /Recreate ES\|QL datafeed \[esql-datafeed-lifecycle-datafeed\] to change/
      ml.update_datafeed:
        datafeed_id: esql-datafeed-lifecycle-datafeed
        body: >
          {
            "runtime_mappings": {"runtime_value": {"type": "long"}}
          }

  - do:
      catch: /Recreate ES\|QL datafeed \[esql-datafeed-lifecycle-datafeed\] to change/
      ml.update_datafeed:
        datafeed_id: esql-datafeed-lifecycle-datafeed
        body: >
          {
            "scroll_size": 2000
          }

  - do:
      catch: /Recreate ES\|QL datafeed \[esql-datafeed-lifecycle-datafeed\] to change/
      ml.update_datafeed:
        datafeed_id: esql-datafeed-lifecycle-datafeed
        body: >
          {
            "indices_options": {"ignore_unavailable": true}
          }

  - do:
      ml.update_datafeed:
        datafeed_id: esql-datafeed-lifecycle-datafeed
        body: >
          {
            "query_delay": "5m",
            "frequency": "2h",
            "max_empty_searches": 7,
            "chunking_config": {"mode": "manual", "time_span": "1h"},
            "delayed_data_check_config": {"enabled": false, "check_window": "2h"}
          }
  - match: { query_delay: "5m" }
  - match: { frequency: "2h" }
  - match: { max_empty_searches: 7 }
  - match: { chunking_config.mode: "manual" }
  - match: { chunking_config.time_span: "1h" }
  - match: { delayed_data_check_config.enabled: false }
  - match: { delayed_data_check_config.check_window: "2h" }

  - do:
      catch: /query cannot be used in combination with esql_query/
      ml.put_datafeed:
        datafeed_id: esql-datafeed-dsl-mix
        body: >
          {
            "job_id": "esql-datafeed-lifecycle-job",
            "source_time_field": "time",
            "grouping_interval": "1h",
            "esql_query": "FROM index-esql-datafeed-lifecycle | KEEP time, value",
            "query": {"match_all": {}}
          }

  - do:
      catch: /aggregations cannot be used in combination with esql_query/
      ml.put_datafeed:
        datafeed_id: esql-datafeed-dsl-aggregations
        body: >
          {
            "job_id": "esql-datafeed-lifecycle-job",
            "source_time_field": "time",
            "grouping_interval": "1h",
            "esql_query": "FROM index-esql-datafeed-lifecycle | KEEP time, value",
            "aggregations": {"max_value": {"max": {"field": "value"}}}
          }

  - do:
      catch: /script_fields cannot be used in combination with esql_query/
      ml.put_datafeed:
        datafeed_id: esql-datafeed-dsl-script-fields
        body: >
          {
            "job_id": "esql-datafeed-lifecycle-job",
            "source_time_field": "time",
            "grouping_interval": "1h",
            "esql_query": "FROM index-esql-datafeed-lifecycle | KEEP time, value",
            "script_fields": {"copied_value": {"script": "doc['value'].value"}}
          }

  - do:
      catch: /runtime_mappings cannot be used in combination with esql_query/
      ml.put_datafeed:
        datafeed_id: esql-datafeed-dsl-runtime-mappings
        body: >
          {
            "job_id": "esql-datafeed-lifecycle-job",
            "source_time_field": "time",
            "grouping_interval": "1h",
            "esql_query": "FROM index-esql-datafeed-lifecycle | KEEP time, value",
            "runtime_mappings": {"runtime_value": {"type": "long"}}
          }

  - do:
      catch: /scroll_size cannot be used in combination with esql_query/
      ml.put_datafeed:
        datafeed_id: esql-datafeed-dsl-scroll-size
        body: >
          {
            "job_id": "esql-datafeed-lifecycle-job",
            "source_time_field": "time",
            "grouping_interval": "1h",
            "esql_query": "FROM index-esql-datafeed-lifecycle | KEEP time, value",
            "scroll_size": 2000
          }

  - do:
      catch: /indices cannot be used in combination with esql_query/
      ml.put_datafeed:
        datafeed_id: esql-datafeed-dsl-indices
        body: >
          {
            "job_id": "esql-datafeed-lifecycle-job",
            "indices": ["index-esql-datafeed-lifecycle"],
            "source_time_field": "time",
            "grouping_interval": "1h",
            "esql_query": "FROM index-esql-datafeed-lifecycle | KEEP time, value"
          }

  - do:
      ml.preview_datafeed:
        datafeed_id: esql-datafeed-lifecycle-datafeed
        start: 0
        end: 4000
  - length: { $body: 3 }
  - match: { 0.time: 1000 }
  - match: { 0.value: 1.0 }
  - match: { 1.time: 2000 }
  - match: { 1.value: 2.0 }
  - match: { 2.time: 3000 }
  - match: { 2.value: 3.0 }

  - do:
      ml.open_job:
        job_id: esql-datafeed-lifecycle-job

  - do:
      ml.start_datafeed:
        datafeed_id: esql-datafeed-lifecycle-datafeed
        start: now
  - match: { started: true }

  - do:
      ml.get_datafeed_stats:
        datafeed_id: esql-datafeed-lifecycle-datafeed
  - match: { datafeeds.0.state: started }

  - do:
      ml.stop_datafeed:
        datafeed_id: esql-datafeed-lifecycle-datafeed
  - match: { stopped: true }

  - do:
      ml.get_datafeed_stats:
        datafeed_id: esql-datafeed-lifecycle-datafeed
  - match: { datafeeds.0.state: stopped }

  - do:
      ml.get_datafeeds:
        datafeed_id: esql-datafeed-lifecycle-datafeed
  - match: { datafeeds.0.esql_query: "FROM index-esql-datafeed-lifecycle | KEEP time, value" }

  - do:
      ml.close_job:
        job_id: esql-datafeed-lifecycle-job
  - match: { closed: true }

---
"Test ES|QL datafeed parser-based validation":
  - do:
      ml.put_job:
        job_id: esql-datafeed-limit-stats-job
        body: >
          {
            "analysis_config": {
              "bucket_span": "1h",
              "summary_count_field_name": "doc_count",
              "detectors": [{"function": "count"}]
            },
            "data_description": {"time_field": "time", "time_format": "epoch_ms"}
          }

  - do:
      catch: bad_request
      ml.put_datafeed:
        datafeed_id: esql-datafeed-invalid-query
        body: >
          {
            "job_id": "esql-datafeed-limit-stats-job",
            "source_time_field": "time",
            "grouping_interval": "1h",
            "esql_query": "FROM index-esql-datafeed-lifecycle | WHERE"
          }

  - do:
      catch: /require the UTC time zone. The esql_query sets time_zone to \[Europe\/Berlin\]/
      ml.put_datafeed:
        datafeed_id: esql-datafeed-time-zone
        body: >
          {
            "job_id": "esql-datafeed-limit-stats-job",
            "source_time_field": "time",
            "grouping_interval": "1h",
            "esql_query": "SET time_zone = \"Europe/Berlin\"; FROM index-esql-datafeed-lifecycle | KEEP time, value"
          }

  - do:
      catch: /refers to remote cluster \[remote_cluster\]/
      ml.put_datafeed:
        datafeed_id: esql-datafeed-remote-in-subquery
        body: >
          {
            "job_id": "esql-datafeed-limit-stats-job",
            "source_time_field": "time",
            "grouping_interval": "1h",
            "esql_query": "FROM (FROM remote_cluster:index-esql-datafeed-lifecycle | KEEP time, value)"
          }

  - do:
      catch: /require a FROM or TS source command in esql_query/
      ml.put_datafeed:
        datafeed_id: esql-datafeed-row-source
        body: >
          {
            "job_id": "esql-datafeed-limit-stats-job",
            "source_time_field": "time",
            "grouping_interval": "1h",
            "esql_query": "ROW time = 1, value = 1.0"
          }

  - do:
      catch: /do not support SET project_routing/
      ml.put_datafeed:
        datafeed_id: esql-datafeed-project-routing
        body: >
          {
            "job_id": "esql-datafeed-limit-stats-job",
            "source_time_field": "time",
            "grouping_interval": "1h",
            "esql_query": "SET project_routing = \"_alias:*\"; FROM index-esql-datafeed-lifecycle | KEEP time, value"
          }

  - do:
      catch: /refers to remote cluster \[remote_cluster\]/
      ml.put_datafeed:
        datafeed_id: esql-datafeed-remote-in-comment-prefix
        body: >
          {
            "job_id": "esql-datafeed-limit-stats-job",
            "source_time_field": "time",
            "grouping_interval": "1h",
            "esql_query": "/* outer /* nested */ */ FROM remote_cluster:index-esql-datafeed-lifecycle | KEEP time, value"
          }

  - do:
      warnings_regex:
        - ".*applies a LIMIT before an aggregation.*"
      ml.put_datafeed:
        datafeed_id: esql-datafeed-limit-stats
        body: >
          {
            "job_id": "esql-datafeed-limit-stats-job",
            "delayed_data_check_config": {"enabled": false},
            "source_time_field": "time",
            "grouping_interval": "1h",
            "esql_query": "FROM index-esql-datafeed-lifecycle // trailing comment\n| LIMIT 500 | STATS doc_count = COUNT(*) BY time = BUCKET(time, 1 hour)"
          }

  - do:
      ml.preview_datafeed:
        datafeed_id: esql-datafeed-limit-stats
        start: 0
        end: 7200000
  - length: { $body: 1 }
  - match: { 0.time: 0 }
  - match: { 0.doc_count: 3 }

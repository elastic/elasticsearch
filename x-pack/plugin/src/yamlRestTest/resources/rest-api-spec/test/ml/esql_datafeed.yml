setup:
  - requires:
      capabilities:
        - method: PUT
          path: /_ml/datafeeds/{datafeed_id}
          capabilities: [ ml_datafeed_esql_query ]
      test_runner_features: [ capabilities, headers ]
      reason: "ES|QL datafeeds are behind the esql_datafeeds feature flag, which is off in release builds"

  - do:
      indices.create:
        index: index-esql-datafeed-lifecycle
        body:
          mappings:
            properties:
              time:
                type: date
              value:
                type: double

  - do:
      index:
        index: index-esql-datafeed-lifecycle
        id: "1"
        body: >
          {"time": "1970-01-01T00:00:01Z", "value": 1.0}

  - do:
      index:
        index: index-esql-datafeed-lifecycle
        id: "2"
        body: >
          {"time": "1970-01-01T00:00:02Z", "value": 2.0}

  - do:
      index:
        index: index-esql-datafeed-lifecycle
        id: "3"
        body: >
          {"time": "1970-01-01T00:00:03Z", "value": 3.0}

  - do:
      indices.refresh:
        index: index-esql-datafeed-lifecycle

  - do:
      headers:
        Authorization: "Basic eF9wYWNrX3Jlc3RfdXNlcjp4LXBhY2stdGVzdC1wYXNzd29yZA==" # run as x_pack_rest_user, i.e. the test setup superuser
      ml.put_job:
        job_id: esql-datafeed-lifecycle-job
        body: >
          {
            "analysis_config": {
              "bucket_span": "1h",
              "detectors": [{"function": "count"}]
            },
            "data_description": {
              "time_field": "time",
              "time_format": "epoch_ms"
            }
          }

  - do:
      headers:
        Authorization: "Basic eF9wYWNrX3Jlc3RfdXNlcjp4LXBhY2stdGVzdC1wYXNzd29yZA==" # run as x_pack_rest_user, i.e. the test setup superuser
      ml.put_datafeed:
        datafeed_id: esql-datafeed-lifecycle-datafeed
        body: >
          {
            "job_id": "esql-datafeed-lifecycle-job",
            "delayed_data_check_config": {"enabled": false},
            "source_time_field": "time",
            "grouping_interval": "1h",
            "esql_query": "FROM index-esql-datafeed-lifecycle | KEEP time, value"
          }

---
"Test ES|QL datafeed validation and STATS BUCKET preview":
  - do:
      catch: /source_time_field/
      ml.put_datafeed:
        datafeed_id: esql-datafeed-missing-source-time
        body: >
          {
            "job_id": "esql-datafeed-lifecycle-job",
            "grouping_interval": "1h",
            "esql_query": "FROM index-esql-datafeed-lifecycle | KEEP time, value"
          }

  - do:
      catch: /grouping_interval/
      ml.put_datafeed:
        datafeed_id: esql-datafeed-missing-grouping-interval
        body: >
          {
            "job_id": "esql-datafeed-lifecycle-job",
            "source_time_field": "time",
            "esql_query": "FROM index-esql-datafeed-lifecycle | KEEP time, value"
          }

  - do:
      catch: /calendar intervals such as 1w or 1M are not supported/
      ml.put_datafeed:
        datafeed_id: esql-datafeed-calendar-grouping-interval
        body: >
          {
            "job_id": "esql-datafeed-lifecycle-job",
            "source_time_field": "time",
            "grouping_interval": "1w",
            "esql_query": "FROM index-esql-datafeed-lifecycle | KEEP time, value"
          }

  - do:
      ml.put_job:
        job_id: esql-datafeed-mismatched-grouping-interval-job
        body: >
          {
            "analysis_config": {
              "bucket_span": "1h",
              "detectors": [{"function": "count"}]
            },
            "data_description": {
              "time_field": "time",
              "time_format": "epoch_ms"
            }
          }

  - do:
      catch: /must equal the job bucket_span/
      ml.put_datafeed:
        datafeed_id: esql-datafeed-mismatched-grouping-interval
        body: >
          {
            "job_id": "esql-datafeed-mismatched-grouping-interval-job",
            "delayed_data_check_config": {"enabled": false},
            "source_time_field": "time",
            "grouping_interval": "2h",
            "esql_query": "FROM index-esql-datafeed-lifecycle | KEEP time, value"
          }

  - do:
      catch: bad_request
      ml.put_datafeed:
        datafeed_id: esql-datafeed-remote-cluster-source
        body: >
          {
            "job_id": "esql-datafeed-lifecycle-job",
            "delayed_data_check_config": {"enabled": false},
            "source_time_field": "time",
            "grouping_interval": "1h",
            "esql_query": "FROM index-esql-datafeed-lifecycle,remote_cluster:index-esql-datafeed-lifecycle | KEEP time, value"
          }

  - do:
      catch: /do not support remote cluster sources in this release.*\[remote_cluster:index-esql-datafeed-lifecycle\]/
      ml.put_datafeed:
        datafeed_id: esql-datafeed-remote-cluster-source
        body: >
          {
            "job_id": "esql-datafeed-lifecycle-job",
            "delayed_data_check_config": {"enabled": false},
            "source_time_field": "time",
            "grouping_interval": "1h",
            "esql_query": "FROM index-esql-datafeed-lifecycle,remote_cluster:index-esql-datafeed-lifecycle | KEEP time, value"
          }

  - do:
      ml.put_job:
        job_id: esql-datafeed-stats-bucket-job
        body: >
          {
            "analysis_config": {
              "bucket_span": "1h",
              "detectors": [{"function": "count"}]
            },
            "data_description": {
              "time_field": "time",
              "time_format": "epoch_ms"
            }
          }

  - do:
      ml.put_datafeed:
        datafeed_id: esql-datafeed-stats-bucket
        body: >
          {
            "job_id": "esql-datafeed-stats-bucket-job",
            "delayed_data_check_config": {"enabled": false},
            "source_time_field": "time",
            "grouping_interval": "1h",
            "esql_query": "FROM index-esql-datafeed-lifecycle | STATS value = AVG(value) BY time = BUCKET(time, 1 hour)"
          }

  - do:
      ml.preview_datafeed:
        datafeed_id: esql-datafeed-stats-bucket
        start: 0
        end: 4000
  - length: { $body: 1 }
  - match: { 0.time: 0 }
  - match: { 0.value: 2.0 }

  - do:
      ml.put_job:
        job_id: esql-datafeed-source-time-field-alias-job
        body: >
          {
            "analysis_config": {
              "bucket_span": "1h",
              "detectors": [{"function": "count"}]
            },
            "data_description": {
              "time_field": "bucket",
              "time_format": "epoch_ms"
            }
          }

  - do:
      catch: /source_time_field \[bucket\]/
      ml.put_datafeed:
        datafeed_id: esql-datafeed-source-time-field-alias
        body: >
          {
            "job_id": "esql-datafeed-source-time-field-alias-job",
            "delayed_data_check_config": {"enabled": false},
            "source_time_field": "bucket",
            "grouping_interval": "1h",
            "esql_query": "FROM index-esql-datafeed-lifecycle | STATS value = AVG(value) BY bucket = BUCKET(time, 1 hour)"
          }


setup:
  - requires:
      cluster_features: [ "rank_vectors" ]
      reason: "requires rank_vectors feature"
---
"Test create multi-vector field":
  - do:
      indices.create:
        index: test
        body:
          mappings:
            properties:
              vector1:
                type: rank_vectors
                dims: 3
  - do:
      index:
        index: test
        id: "1"
        body:
          vector1: [[2, -1, 1]]
  - do:
      index:
        index: test
        id: "2"
        body:
          vector1: [[2, -1, 1], [3, 4, 5]]
  - do:
      index:
        index: test
        id: "3"
        body:
          vector1: [[2, -1, 1], [3, 4, 5], [6, 7, 8]]
  - do:
      indices.refresh: {}
---
"Test create dynamic dim multi-vector field":
  - do:
      indices.create:
        index: test
        body:
          mappings:
            properties:
              name:
                type: keyword
              vector1:
                type: rank_vectors
  - do:
      index:
        index: test
        id: "1"
        body:
          vector1: [[2, -1, 1]]
  - do:
      index:
        index: test
        id: "2"
        body:
          vector1: [[2, -1, 1], [3, 4, 5]]
  - do:
      index:
        index: test
        id: "3"
        body:
          vector1: [[2, -1, 1], [3, 4, 5], [6, 7, 8]]
  - do:
      cluster.health:
        wait_for_events: languid

  # verify some other dimension will fail
  - do:
      catch: bad_request
      index:
        index: test
        id: "4"
        body:
          vector1: [[2, -1, 1], [3, 4, 5], [6, 7, 8, 9]]
---
"Test dynamic dim mismatch fails multi-vector field":
  - do:
      indices.create:
        index: test
        body:
          mappings:
            properties:
              vector1:
                type: rank_vectors
  - do:
      catch: bad_request
      index:
        index: test
        id: "1"
        body:
          vector1: [[2, -1, 1], [2]]
---
"Test static dim mismatch fails multi-vector field":
  - do:
      indices.create:
        index: test
        body:
          mappings:
            properties:
              vector1:
                type: rank_vectors
                dims: 3
  - do:
      catch: bad_request
      index:
        index: test
        id: "1"
        body:
          vector1: [[2, -1, 1], [2]]
---
"Test poorly formatted multi-vector field":
  - do:
      indices.create:
        index: poorly_formatted_vector
        body:
          mappings:
            properties:
              vector1:
                type: rank_vectors
                dims: 3
  - do:
      catch: bad_request
      index:
        index: poorly_formatted_vector
        id: "1"
        body:
          vector1: [[[2, -1, 1]]]
  - do:
      catch: bad_request
      index:
        index: poorly_formatted_vector
        id: "1"
        body:
          vector1: [[2, -1, 1], [[2, -1, 1]]]
---
"Updating dim to null is not allowed":
  - requires:
      cluster_features: "mapper.npe_on_dims_update_fix"
      reason: "dims update fix"
  - do:
      indices.create:
        index: test_index

  - do:
      indices.put_mapping:
        index: test_index
        body:
          properties:
            embedding:
              type: rank_vectors
              dims: 4
  - do:
      catch: bad_request
      indices.put_mapping:
        index: test_index
        body:
          properties:
            embedding:
              type: rank_vectors
---
"Test empty vector array is rejected":
  - requires:
      cluster_features: [ "mapper.rank_vectors.empty_array_rejected" ]
      reason: "empty rank_vectors arrays are rejected at index time"
  - do:
      indices.create:
        index: empty_vector
        body:
          mappings:
            properties:
              vector1:
                type: rank_vectors
                dims: 3
  - do:
      catch: /requires at least one vector/
      index:
        index: empty_vector
        id: "1"
        body:
          vector1: []

  # a null value is still the way to say "this document has no vector"
  - do:
      index:
        index: empty_vector
        id: "2"
        body:
          vector1: null
  - do:
      indices.refresh: {}
  - do:
      search:
        index: empty_vector
        body:
          query:
            exists:
              field: vector1
  - match: { hits.total.value: 0 }
---
"Encoded vectors without dims are rejected":
  - requires:
      cluster_features: [ "mapper.dense_vector.encoded_vector_requires_dims" ]
      reason: "encoded vectors require dims to be set on new indices"
  - do:
      indices.create:
        index: encoded_no_dims
        body:
          mappings:
            properties:
              vector_float:
                type: rank_vectors
                element_type: float
              vector_bfloat16:
                type: rank_vectors
                element_type: bfloat16
              vector_byte:
                type: rank_vectors
                element_type: byte
              vector_bit:
                type: rank_vectors
                element_type: bit

  # [2.0, -1.0, 1.0] - is encoded as 'QAAAAL+AAAA/gAAA'
  - do:
      catch: /Field \[vector_float\] of type \[rank_vectors\] has no \[dims\] and cannot infer them from an encoded vector/
      index:
        index: encoded_no_dims
        id: "1"
        body:
          vector_float: ["QAAAAL+AAAA/gAAA"]

  # a vector given as an array of numbers first doesn't make the encoded one acceptable
  - do:
      catch: /Field \[vector_float\] of type \[rank_vectors\] has no \[dims\] and cannot infer them from an encoded vector/
      index:
        index: encoded_no_dims
        id: "1"
        body:
          vector_float: [[2.0, -1.0, 1.0], "QAAAAL+AAAA/gAAA"]

  # [1.5, 2.0, -3.25, 4.0] as bfloat16 - is encoded as 'P8BAAMBQQIA='
  - do:
      catch: /Field \[vector_bfloat16\] of type \[rank_vectors\] has no \[dims\] and cannot infer them from an encoded vector/
      index:
        index: encoded_no_dims
        id: "1"
        body:
          vector_bfloat16: ["P8BAAMBQQIA="]

  # [-128, 127, 10, 11] - is encoded in hex as '807f0a0b'
  - do:
      catch: /Field \[vector_byte\] of type \[rank_vectors\] has no \[dims\] and cannot infer them from an encoded vector/
      index:
        index: encoded_no_dims
        id: "1"
        body:
          vector_byte: ["807f0a0b"]

  # the 4 bytes [-128, 127, 10, 0] as a 32-bit vector - is encoded as 'gH8KAA=='
  - do:
      catch: /Field \[vector_bit\] of type \[rank_vectors\] has no \[dims\] and cannot infer them from an encoded vector/
      index:
        index: encoded_no_dims
        id: "1"
        body:
          vector_bit: ["gH8KAA=="]

  - do:
      indices.get_mapping:
        index: encoded_no_dims

  - is_false: encoded_no_dims.mappings.properties.vector_float.dims
  - is_false: encoded_no_dims.mappings.properties.vector_bfloat16.dims
  - is_false: encoded_no_dims.mappings.properties.vector_byte.dims
  - is_false: encoded_no_dims.mappings.properties.vector_bit.dims
---
"Encoded vectors are accepted once dims are inferred from arrays":
  - requires:
      cluster_features: [ "mapper.dense_vector.encoded_vector_requires_dims" ]
      reason: "encoded vectors require dims to be set on new indices"
  - do:
      indices.create:
        index: encoded_array_dims
        body:
          settings:
            number_of_shards: 1
            index.mapping.exclude_source_vectors: true
          mappings:
            properties:
              vector_float:
                type: rank_vectors
                element_type: float
              vector_bfloat16:
                type: rank_vectors
                element_type: bfloat16
              vector_byte:
                type: rank_vectors
                element_type: byte
              vector_bit:
                type: rank_vectors
                element_type: bit

  - do:
      index:
        index: encoded_array_dims
        id: "1"
        body:
          vector_float: [[3.0, 4.0, 5.0]]
          vector_bfloat16: [[3.0, 4.0, 5.0]]
          vector_byte: [[64, -10, -30]]
          vector_bit: [[64, -10, -30]]

  - do:
      cluster.health:
        wait_for_events: languid

  # [2.0, -1.0, 1.0] - is encoded as 'QAAAAL+AAAA/gAAA' in float32 and 'QAC/gD+A' in bfloat16
  # [-128, 127, 10] - is encoded in hex as '807f0a' and in base64 as 'gH8K'
  - do:
      index:
        index: encoded_array_dims
        id: "2"
        body:
          vector_float: ["QAAAAL+AAAA/gAAA"]
          vector_bfloat16: ["QAC/gD+A"]
          vector_byte: ["807f0a"]
          vector_bit: ["gH8K"]

  - do:
      indices.get_mapping:
        index: encoded_array_dims

  - match: { encoded_array_dims.mappings.properties.vector_float.dims: 3 }
  - match: { encoded_array_dims.mappings.properties.vector_bfloat16.dims: 3 }
  - match: { encoded_array_dims.mappings.properties.vector_byte.dims: 3 }
  - match: { encoded_array_dims.mappings.properties.vector_bit.dims: 24 }

  - do:
      get:
        index: encoded_array_dims
        id: "2"
        _source_exclude_vectors: false

  - match: { _source.vector_float: [[2.0, -1.0, 1.0]] }
  - match: { _source.vector_bfloat16: [[2.0, -1.0, 1.0]] }
  - match: { _source.vector_byte: [[-128, 127, 10]] }
  - match: { _source.vector_bit: [[-128, 127, 10]] }

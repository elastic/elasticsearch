setup:
  - requires:
      cluster_features: [ "rank_vectors" ]
      reason: "requires rank_vectors feature"
  - skip:
      features: headers

  - do:
      indices.create:
        index: missing-values-index
        body:
          settings:
            number_of_shards: 1
          mappings:
            properties:
              name:
                type: keyword
              vector:
                type: rank_vectors
                dims: 3

  - do:
      index:
        index: missing-values-index
        id: "1"
        body:
          name: has-vector
          vector: [[1, 2, 3], [4, 5, 6]]

  - do:
      index:
        index: missing-values-index
        id: "2"
        body:
          name: no-vector

  - do:
      indices.refresh: {}
---
"Test max-sim scoring fails when a document has no vector":
  - do:
      catch: bad_request
      headers:
        Content-Type: application/json
      search:
        index: missing-values-index
        body:
          query:
            script_score:
              query: { match_all: {} }
              script:
                source: "maxSimDotProduct(params.query_vector, 'vector')"
                params:
                  query_vector: [[1, 1, 1]]

  - do:
      catch: bad_request
      headers:
        Content-Type: application/json
      search:
        index: missing-values-index
        body:
          query:
            script_score:
              query: { match_all: {} }
              script:
                source: "maxSimInvHamming(params.query_vector, 'vector')"
                params:
                  query_vector: [[1, 1, 1]]
---
"Test max-sim scoring with an exists filter":
  - skip:
      features: close_to

  # max over the document's vectors: [1,2,3] -> 6, [4,5,6] -> 15
  - do:
      headers:
        Content-Type: application/json
      search:
        index: missing-values-index
        rest_total_hits_as_int: true
        body:
          query:
            script_score:
              query:
                exists:
                  field: vector
              script:
                source: "maxSimDotProduct(params.query_vector, 'vector')"
                params:
                  query_vector: [[1, 1, 1]]

  - match: { hits.total: 1 }
  - match: { hits.hits.0._id: "1" }
  - close_to: { hits.hits.0._score: { value: 15.0, error: 0.01 } }
---
"Test max-sim scoring with a size guard":
  - skip:
      features: close_to

  # the pattern documented for vector functions: guard the call with the doc values size
  - do:
      headers:
        Content-Type: application/json
      search:
        index: missing-values-index
        rest_total_hits_as_int: true
        body:
          query:
            script_score:
              query: { match_all: {} }
              script:
                source: "doc['vector'].size() == 0 ? 0 : maxSimDotProduct(params.query_vector, 'vector')"
                params:
                  query_vector: [[1, 1, 1]]

  - match: { hits.total: 2 }
  - match: { hits.hits.0._id: "1" }
  - close_to: { hits.hits.0._score: { value: 15.0, error: 0.01 } }
  - match: { hits.hits.1._id: "2" }
  - close_to: { hits.hits.1._score: { value: 0.0, error: 0.01 } }
---
"Test doc values report a missing vector as empty":
  - skip:
      features: close_to

  - do:
      headers:
        Content-Type: application/json
      search:
        index: missing-values-index
        rest_total_hits_as_int: true
        body:
          sort: [ { name: asc } ]
          script_fields:
            vector_count:
              script:
                source: "doc['vector'].size()"

  - match: { hits.total: 2 }
  - match: { hits.hits.0._id: "1" }
  - match: { hits.hits.0.fields.vector_count: [2] }
  - match: { hits.hits.1._id: "2" }
  - match: { hits.hits.1.fields.vector_count: [0] }

setup:
  - requires:
      cluster_features: ["mapper.ash_quantization_type_support"]
      reason: Needs ASH quantization_type support
  - skip:
      features: "headers"
  - do:
      indices.create:
        index: ash_test
        body:
          settings:
            index:
              number_of_shards: 1
          mappings:
            properties:
              vector:
                type: dense_vector
                dims: 64
                index: true
                similarity: max_inner_product
                index_options:
                  type: bbq_disk
                  quantization_type: ash

  - do:
      index:
        index: ash_test
        id: "1"
        body:
          vector: [0.077,  0.32 , -0.205,  0.63 ,  0.032,  0.201,  0.167, -0.313,
                   0.176,  0.531, -0.375,  0.334, -0.046,  0.078, -0.349,  0.272,
                   0.307, -0.083,  0.504,  0.255, -0.404,  0.289, -0.226, -0.132,

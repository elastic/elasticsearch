setup:
  - requires:
      test_runner_features: [ headers ]
      cluster_features: [ "mapper.source.mode_from_index_setting" ]
      reason: "Source mode configured through index setting"

  - do:
      indices.create:
        index: fls_stored
        body:
          mappings:
            properties:
              name:
                type: keyword
              labels:
                type: flattened

  - do:
      indices.create:
        index: fls_synthetic
        body:
          settings:
            index:
              mapping.source.mode: synthetic
          mappings:
            properties:
              name:
                type: keyword
              labels:
                type: flattened

  - do:
      bulk:
        refresh: true
        body:
          - '{"create": { "_index": "fls_stored" }}'
          - '{"name": "A", "labels": {"env": "prod", "secret": "hunter2"}}'
          - '{"create": { "_index": "fls_synthetic" }}'
          - '{"name": "A", "labels": {"env": "prod", "secret": "hunter2"}}'

---
"Except a key: partial access hides the keyed storage, stored _source keeps the other keys":
  - do:
      security.create_api_key:
        body:
          name: "fls-except-key"
          role_descriptors:
            index_access:
              indices:
                - names: [ "fls_*" ]
                  privileges: [ "read", "view_index_metadata" ]
                  field_security:
                    grant: [ "*" ]
                    except: [ "labels.secret" ]
  - set: { encoded: credentials }

  - do:
      headers:
        Authorization: "ApiKey ${credentials}"
      search:
        index: fls_stored
  - match: { hits.hits.0._source.name: A }
  - match: { hits.hits.0._source.labels.env: prod }
  - is_false: hits.hits.0._source.labels.secret

  - do:
      headers:
        Authorization: "ApiKey ${credentials}"
      search:
        index: fls_synthetic
  - match: { hits.hits.0._source.name: A }
  - is_false: hits.hits.0._source.labels

  - do:
      headers:
        Authorization: "ApiKey ${credentials}"
      search:
        index: fls_*
        body:
          query:
            term:
              labels.env: prod
  - match: { hits.total.value: 0 }

  - do:
      headers:
        Authorization: "ApiKey ${credentials}"
      search:
        index: fls_*
        body:
          query:
            term:
              labels.secret: hunter2
  - match: { hits.total.value: 0 }

  - do:
      headers:
        Authorization: "ApiKey ${credentials}"
      search:
        index: fls_*
        body:
          query:
            term:
              labels: hunter2
  - match: { hits.total.value: 0 }

  - do:
      headers:
        Authorization: "ApiKey ${credentials}"
      search:
        index: fls_*
        body:
          size: 0
          aggs:
            envs:
              terms:
                field: labels.env
  - length: { aggregations.envs.buckets: 0 }

  - do:
      headers:
        Authorization: "ApiKey ${credentials}"
      search:
        index: fls_*
        body:
          _source: false
          docvalue_fields: [ "labels.env" ]
  - match: { hits.total.value: 2 }
  - is_false: hits.hits.0.fields
  - is_false: hits.hits.1.fields

  - do:
      headers:
        Authorization: "ApiKey ${credentials}"
      field_caps:
        index: fls_*
        fields: "labels*"
  - match: { fields.labels.flattened.type: flattened }

  - do:
      headers:
        Authorization: "ApiKey ${credentials}"
      indices.get_mapping:
        index: fls_stored
  - match: { fls_stored.mappings.properties.labels.type: flattened }

---
"Except the field: every key is hidden":
  - do:
      security.create_api_key:
        body:
          name: "fls-except-field"
          role_descriptors:
            index_access:
              indices:
                - names: [ "fls_*" ]
                  privileges: [ "read", "view_index_metadata" ]
                  field_security:
                    grant: [ "*" ]
                    except: [ "labels" ]
  - set: { encoded: credentials }

  - do:
      headers:
        Authorization: "ApiKey ${credentials}"
      search:
        index: fls_*
  - match: { hits.total.value: 2 }
  - match: { hits.hits.0._source.name: A }
  - is_false: hits.hits.0._source.labels
  - is_false: hits.hits.1._source.labels

  - do:
      headers:
        Authorization: "ApiKey ${credentials}"
      search:
        index: fls_*
        body:
          query:
            term:
              labels.env: prod
  - match: { hits.total.value: 0 }

  - do:
      headers:
        Authorization: "ApiKey ${credentials}"
      search:
        index: fls_*
        body:
          query:
            term:
              labels: prod
  - match: { hits.total.value: 0 }

  - do:
      headers:
        Authorization: "ApiKey ${credentials}"
      search:
        index: fls_*
        body:
          size: 0
          aggs:
            envs:
              terms:
                field: labels.env
  - length: { aggregations.envs.buckets: 0 }

  - do:
      headers:
        Authorization: "ApiKey ${credentials}"
      search:
        index: fls_*
        body:
          _source: false
          docvalue_fields: [ "labels.env" ]
  - is_false: hits.hits.0.fields
  - is_false: hits.hits.1.fields

  - do:
      headers:
        Authorization: "ApiKey ${credentials}"
      field_caps:
        index: fls_*
        fields: "labels*"
  - is_false: fields.labels

  - do:
      headers:
        Authorization: "ApiKey ${credentials}"
      indices.get_mapping:
        index: fls_stored
  - is_false: fls_stored.mappings.properties.labels

---
"Grant a key: partial access lists the field and keeps the key in stored _source":
  - do:
      security.create_api_key:
        body:
          name: "fls-grant-key"
          role_descriptors:
            index_access:
              indices:
                - names: [ "fls_*" ]
                  privileges: [ "read", "view_index_metadata" ]
                  field_security:
                    grant: [ "name", "labels.env" ]
  - set: { encoded: credentials }

  - do:
      headers:
        Authorization: "ApiKey ${credentials}"
      search:
        index: fls_stored
  - match: { hits.hits.0._source.name: A }
  - match: { hits.hits.0._source.labels.env: prod }
  - is_false: hits.hits.0._source.labels.secret

  - do:
      headers:
        Authorization: "ApiKey ${credentials}"
      search:
        index: fls_synthetic
  - match: { hits.hits.0._source.name: A }
  - is_false: hits.hits.0._source.labels

  - do:
      headers:
        Authorization: "ApiKey ${credentials}"
      search:
        index: fls_*
        body:
          query:
            term:
              labels.env: prod
  - match: { hits.total.value: 0 }

  - do:
      headers:
        Authorization: "ApiKey ${credentials}"
      search:
        index: fls_*
        body:
          query:
            term:
              labels: prod
  - match: { hits.total.value: 0 }

  - do:
      headers:
        Authorization: "ApiKey ${credentials}"
      search:
        index: fls_*
        body:
          _source: false
          docvalue_fields: [ "labels.env" ]
  - is_false: hits.hits.0.fields
  - is_false: hits.hits.1.fields

  - do:
      headers:
        Authorization: "ApiKey ${credentials}"
      field_caps:
        index: fls_*
        fields: "labels*"
  - match: { fields.labels.flattened.type: flattened }

  - do:
      headers:
        Authorization: "ApiKey ${credentials}"
      indices.get_mapping:
        index: fls_stored
  - match: { fls_stored.mappings.properties.labels.type: flattened }

---
"Grant the field: every key is visible":
  - do:
      security.create_api_key:
        body:
          name: "fls-grant-field"
          role_descriptors:
            index_access:
              indices:
                - names: [ "fls_*" ]
                  privileges: [ "read", "view_index_metadata" ]
                  field_security:
                    grant: [ "name", "labels" ]
  - set: { encoded: credentials }

  - do:
      headers:
        Authorization: "ApiKey ${credentials}"
      search:
        index: fls_stored
  - match: { hits.hits.0._source.labels.env: prod }
  - match: { hits.hits.0._source.labels.secret: hunter2 }

  - do:
      headers:
        Authorization: "ApiKey ${credentials}"
      search:
        index: fls_synthetic
  - match: { hits.hits.0._source.labels.env: prod }
  - match: { hits.hits.0._source.labels.secret: hunter2 }

  - do:
      headers:
        Authorization: "ApiKey ${credentials}"
      search:
        index: fls_*
        body:
          query:
            term:
              labels.secret: hunter2
  - match: { hits.total.value: 2 }

  - do:
      headers:
        Authorization: "ApiKey ${credentials}"
      search:
        index: fls_*
        body:
          query:
            term:
              labels: hunter2
  - match: { hits.total.value: 2 }

  - do:
      headers:
        Authorization: "ApiKey ${credentials}"
      search:
        index: fls_*
        body:
          size: 0
          aggs:
            envs:
              terms:
                field: labels.env
  - length: { aggregations.envs.buckets: 1 }
  - match: { aggregations.envs.buckets.0.key: prod }
  - match: { aggregations.envs.buckets.0.doc_count: 2 }

  - do:
      headers:
        Authorization: "ApiKey ${credentials}"
      search:
        index: fls_*
        body:
          _source: false
          docvalue_fields: [ "labels.env" ]
  - match: { hits.hits.0.fields.labels\.env.0: prod }
  - match: { hits.hits.1.fields.labels\.env.0: prod }

  - do:
      headers:
        Authorization: "ApiKey ${credentials}"
      field_caps:
        index: fls_*
        fields: "labels*"
  - match: { fields.labels.flattened.type: flattened }

---
"Grant every key: the field is fully visible, including root queries":
  - do:
      security.create_api_key:
        body:
          name: "fls-grant-keys"
          role_descriptors:
            index_access:
              indices:
                - names: [ "fls_*" ]
                  privileges: [ "read", "view_index_metadata" ]
                  field_security:
                    grant: [ "name", "labels.*" ]
  - set: { encoded: credentials }

  - do:
      headers:
        Authorization: "ApiKey ${credentials}"
      search:
        index: fls_synthetic
  - match: { hits.hits.0._source.labels.env: prod }
  - match: { hits.hits.0._source.labels.secret: hunter2 }

  - do:
      headers:
        Authorization: "ApiKey ${credentials}"
      search:
        index: fls_*
        body:
          query:

---
setup:
  - skip:
      features: headers

  - requires:
      capabilities:
        - method: PUT
          path: /_security/service/{namespace}/{service}
          capabilities: [user_managed_service_accounts]
      test_runner_features: capabilities
      reason: "User-managed service accounts are unavailable in multi-project clusters"

  - do:
      cluster.health:
        wait_for_status: yellow

  - do:
      security.put_role:
        name: "delegated_ingest_reader"
        body: >
          {
            "cluster": ["monitor"]
          }

  - do:
      security.put_role:
        name: "delegated_alert_writer"
        body: >
          {
            "cluster": ["manage_own_api_key"]
          }

  - do:
      security.put_role:
        name: "delegated_unlisted"
        body: >
          {
            "cluster": ["manage_security"]
          }

  - do:
      security.put_role:
        name: "service_account_delegate"
        body: >
          {
            "global": {
              "service_account": {
                "manage": {
                  "names": ["apps/delegated_*"],
                  "roles": ["delegated_ingest_reader", "delegated_alert_writer"]
                }
              }
            }
          }

  - do:
      security.put_user:
        username: "sa_delegate"
        body: >
          {
            "password": "x-pack-test-password",
            "roles": ["service_account_delegate"]
          }

---
teardown:
  - do:
      security.delete_service_token:
        namespace: apps
        service: delegated_worker
        name: delegated-token
        ignore: 404

  - do:
      security.delete_user_managed_service_account:
        namespace: apps
        service: delegated_worker
        force: true
        ignore: 404

  - do:
      security.delete_user_managed_service_account:
        namespace: batch
        service: delegated_worker
        force: true
        ignore: 404

  - do:
      security.delete_user:
        username: "sa_delegate"
        ignore: 404

  - do:
      security.delete_user:
        username: "sa_pattern_delegate"
        ignore: 404

  - do:
      security.delete_role:
        name: "service_account_pattern_delegate"
        ignore: 404

  - do:
      security.delete_role:
        name: "service_account_delegate"
        ignore: 404

  - do:
      security.delete_role:
        name: "delegated_unlisted"
        ignore: 404

  - do:
      security.delete_role:
        name: "delegated_alert_writer"
        ignore: 404

  - do:
      security.delete_role:
        name: "delegated_ingest_reader"
        ignore: 404

---
"Test the service account manage privilege round-trips through the role API":
  - do:
      security.get_role:
        name: "service_account_delegate"
  - match: { service_account_delegate.global.service_account.manage.names: ["apps/delegated_*"] }
  - match: { service_account_delegate.global.service_account.manage.roles: ["delegated_ingest_reader", "delegated_alert_writer"] }

---
"Test a delegate writes named accounts with listed roles":
  - do:
      headers:
        Authorization: "Basic c2FfZGVsZWdhdGU6eC1wYWNrLXRlc3QtcGFzc3dvcmQ=" # sa_delegate
      security.put_user_managed_service_account:
        namespace: apps
        service: delegated_worker
        body: >
          {
            "roles": ["delegated_ingest_reader"]
          }
  - match: { created: true }

  - do:
      headers:
        Authorization: "Basic c2FfZGVsZWdhdGU6eC1wYWNrLXRlc3QtcGFzc3dvcmQ=" # sa_delegate
      security.put_user_managed_service_account:
        namespace: apps
        service: delegated_worker
        body: >
          {
            "roles": ["delegated_ingest_reader", "delegated_alert_writer"],
            "enabled": false
          }
  - match: { created: false }

  - do:
      headers:
        Authorization: "Basic c2FfZGVsZWdhdGU6eC1wYWNrLXRlc3QtcGFzc3dvcmQ=" # sa_delegate
      security.put_user_managed_service_account:
        namespace: apps
        service: delegated_worker
        body: >
          {
            "roles": []
          }
  - match: { created: false }

---
"Test a delegate cannot assign an unlisted role":
  - do:
      catch: forbidden
      headers:
        Authorization: "Basic c2FfZGVsZWdhdGU6eC1wYWNrLXRlc3QtcGFzc3dvcmQ=" # sa_delegate
      security.put_user_managed_service_account:
        namespace: apps
        service: delegated_worker
        body: >
          {
            "roles": ["delegated_ingest_reader", "delegated_unlisted"]
          }

  - do:
      security.put_user_managed_service_account:
        namespace: apps
        service: delegated_worker
        body: >
          {
            "roles": ["delegated_ingest_reader", "delegated_unlisted"]
          }
  - match: { created: true }

  # The request replaces the account, so an unlisted role the account already holds cannot be kept...
  - do:
      catch: forbidden
      headers:
        Authorization: "Basic c2FfZGVsZWdhdGU6eC1wYWNrLXRlc3QtcGFzc3dvcmQ=" # sa_delegate
      security.put_user_managed_service_account:
        namespace: apps
        service: delegated_worker
        body: >
          {
            "roles": ["delegated_ingest_reader", "delegated_unlisted"],
            "enabled": false
          }

  # ...but it can be removed.
  - do:
      headers:
        Authorization: "Basic c2FfZGVsZWdhdGU6eC1wYWNrLXRlc3QtcGFzc3dvcmQ=" # sa_delegate
      security.put_user_managed_service_account:
        namespace: apps
        service: delegated_worker
        body: >
          {
            "roles": ["delegated_ingest_reader"]
          }
  - match: { created: false }

---
"Test a delegate cannot write accounts outside the named ones":
  - do:
      catch: forbidden
      headers:
        Authorization: "Basic c2FfZGVsZWdhdGU6eC1wYWNrLXRlc3QtcGFzc3dvcmQ=" # sa_delegate
      security.put_user_managed_service_account:
        namespace: batch
        service: delegated_worker
        body: >
          {
            "roles": ["delegated_ingest_reader"]
          }

---
"Test a delegate creates and deletes tokens for the named accounts":
  - do:
      headers:
        Authorization: "Basic c2FfZGVsZWdhdGU6eC1wYWNrLXRlc3QtcGFzc3dvcmQ=" # sa_delegate
      security.put_user_managed_service_account:
        namespace: apps
        service: delegated_worker
        body: >
          {
            "roles": ["delegated_ingest_reader"]
          }
  - match: { created: true }

  - do:
      headers:
        Authorization: "Basic c2FfZGVsZWdhdGU6eC1wYWNrLXRlc3QtcGFzc3dvcmQ=" # sa_delegate
      security.create_service_token:
        namespace: apps
        service: delegated_worker
        name: delegated-token
  - is_true: created
  - set: { "token.value": delegated_service_token }

  - do:
      headers:
        Authorization: Bearer ${delegated_service_token}
      security.authenticate: {}
  - match: { username: "apps/delegated_worker" }
  - match: { roles: ["delegated_ingest_reader"] }

  - do:
      headers:
        Authorization: "Basic c2FfZGVsZWdhdGU6eC1wYWNrLXRlc3QtcGFzc3dvcmQ=" # sa_delegate
      security.delete_service_token:
        namespace: apps
        service: delegated_worker
        name: delegated-token
  - match: { found: true }

  - do:
      catch: unauthorized
      headers:
        Authorization: Bearer ${delegated_service_token}
      security.authenticate: {}

  - do:
      security.put_user_managed_service_account:
        namespace: batch
        service: delegated_worker
        body: >
          {
            "roles": ["delegated_ingest_reader"]
          }
  - match: { created: true }

  - do:
      catch: forbidden
      headers:
        Authorization: "Basic c2FfZGVsZWdhdGU6eC1wYWNrLXRlc3QtcGFzc3dvcmQ=" # sa_delegate
      security.create_service_token:
        namespace: batch
        service: delegated_worker
        name: delegated-token

  - do:
      catch: forbidden
      headers:
        Authorization: "Basic c2FfZGVsZWdhdGU6eC1wYWNrLXRlc3QtcGFzc3dvcmQ=" # sa_delegate
      security.delete_service_token:
        namespace: batch
        service: delegated_worker
        name: delegated-token

  - do:
      catch: forbidden
      headers:
        Authorization: "Basic c2FfZGVsZWdhdGU6eC1wYWNrLXRlc3QtcGFzc3dvcmQ=" # sa_delegate
      security.create_service_token:
        namespace: elastic
        service: fleet-server
        name: delegated-token

---
"Test tokens are created whatever roles a named account holds":
  # Roles are checked when an account is written, so an account that an administrator gave a role outside the grant
  # still gets a token: the names are what bound the delegate's tokens.
  - do:
      security.put_user_managed_service_account:
        namespace: apps
        service: delegated_worker
        body: >
          {
            "roles": ["delegated_unlisted"]
          }
  - match: { created: true }

  - do:
      headers:
        Authorization: "Basic c2FfZGVsZWdhdGU6eC1wYWNrLXRlc3QtcGFzc3dvcmQ=" # sa_delegate
      security.create_service_token:
        namespace: apps
        service: delegated_worker
        name: delegated-token
  - is_true: created

---
"Test a delegate lists token names and deletes the named accounts":
  # The account and its token come from an administrator: listing is how the delegate learns a name it never saw.
  - do:
      security.put_user_managed_service_account:
        namespace: apps
        service: delegated_worker
        body: >
          {
            "roles": ["delegated_unlisted"]
          }
  - match: { created: true }

  - do:
      security.create_service_token:
        namespace: apps
        service: delegated_worker
        name: delegated-token
  - is_true: created

  - do:
      headers:
        Authorization: "Basic c2FfZGVsZWdhdGU6eC1wYWNrLXRlc3QtcGFzc3dvcmQ=" # sa_delegate
      security.get_service_credentials:
        namespace: apps
        service: delegated_worker
  - match: { "service_account": "apps/delegated_worker" }
  - match: { "count": 1 }
  - match: { "tokens": { "delegated-token": {} } }

  - do:
      headers:
        Authorization: "Basic c2FfZGVsZWdhdGU6eC1wYWNrLXRlc3QtcGFzc3dvcmQ=" # sa_delegate
      security.delete_service_token:
        namespace: apps
        service: delegated_worker
        name: delegated-token
  - match: { found: true }

  # Deleting goes by name, whatever roles the account holds.
  - do:
      headers:
        Authorization: "Basic c2FfZGVsZWdhdGU6eC1wYWNrLXRlc3QtcGFzc3dvcmQ=" # sa_delegate
      security.delete_user_managed_service_account:
        namespace: apps
        service: delegated_worker
  - match: { found: true }

  - do:
      security.put_user_managed_service_account:
        namespace: batch
        service: delegated_worker
        body: >
          {
            "roles": ["delegated_ingest_reader"]
          }
  - match: { created: true }

  - do:
      catch: forbidden
      headers:
        Authorization: "Basic c2FfZGVsZWdhdGU6eC1wYWNrLXRlc3QtcGFzc3dvcmQ=" # sa_delegate
      security.get_service_credentials:
        namespace: batch
        service: delegated_worker

  - do:
      catch: forbidden
      headers:
        Authorization: "Basic c2FfZGVsZWdhdGU6eC1wYWNrLXRlc3QtcGFzc3dvcmQ=" # sa_delegate
      security.delete_user_managed_service_account:
        namespace: batch
        service: delegated_worker

---
"Test a delegate never lists built-in account tokens":
  - do:
      security.put_role:
        name: "service_account_pattern_delegate"
        body: >
          {
            "global": {
              "service_account": {
                "manage": {
                  "names": ["*"],
                  "roles": ["delegated_ingest_reader"]
                }
              }
            }
          }

  - do:
      security.put_user:
        username: "sa_pattern_delegate"
        body: >
          {
            "password": "x-pack-test-password",
            "roles": ["service_account_pattern_delegate"]
          }

  - do:
      catch: forbidden
      headers:
        Authorization: "Basic c2FfcGF0dGVybl9kZWxlZ2F0ZTp4LXBhY2stdGVzdC1wYXNzd29yZA==" # sa_pattern_delegate
      security.get_service_credentials:
        namespace: elastic
        service: fleet-server

---
"Test a delegate reads only the named accounts":
  - do:
      security.put_user_managed_service_account:
        namespace: apps
        service: delegated_worker
        body: >
          {
            "roles": ["delegated_ingest_reader"]
          }
  - match: { created: true }

  - do:
      security.put_user_managed_service_account:
        namespace: batch
        service: delegated_worker
        body: >
          {
            "roles": ["delegated_ingest_reader"]
          }
  - match: { created: true }

  - do:
      headers:
        Authorization: "Basic c2FfZGVsZWdhdGU6eC1wYWNrLXRlc3QtcGFzc3dvcmQ=" # sa_delegate
      security.get_service_accounts:
        namespace: apps
        service: delegated_worker
  - length: { '': 1 }
  - match: { "apps/delegated_worker.type": "user_managed" }
  - match: { "apps/delegated_worker.roles": ["delegated_ingest_reader"] }

  # An account outside the named ones reads as absent rather than forbidden, as listing never names it.
  - do:
      headers:
        Authorization: "Basic c2FfZGVsZWdhdGU6eC1wYWNrLXRlc3QtcGFzc3dvcmQ=" # sa_delegate
      security.get_service_accounts:
        namespace: batch
        service: delegated_worker
  - length: { '': 0 }

  # Listing omits built-in accounts, so an unscoped listing, which reports only built-in accounts, is empty...
  - do:
      headers:
        Authorization: "Basic c2FfZGVsZWdhdGU6eC1wYWNrLXRlc3QtcGFzc3dvcmQ=" # sa_delegate
      security.get_service_accounts: {}
  - length: { '': 0 }

  # ...and it omits the accounts outside the named ones.
  - do:
      headers:
        Authorization: "Basic c2FfZGVsZWdhdGU6eC1wYWNrLXRlc3QtcGFzc3dvcmQ=" # sa_delegate
      security.get_service_accounts:
        type: "built_in,user_managed"
  - length: { '': 1 }
  - match: { "apps/delegated_worker.type": "user_managed" }

  # The total of a query counts only the named accounts.
  - do:
      headers:
        Authorization: "Basic c2FfZGVsZWdhdGU6eC1wYWNrLXRlc3QtcGFzc3dvcmQ=" # sa_delegate
      security.query_service_accounts:
        body: >
          {
            "query": { "term": { "roles": "delegated_ingest_reader" } }
          }
  - match: { total: 1 }
  - match: { count: 1 }
  - match: { service_accounts.0.username: "apps/delegated_worker" }

  - do:
      security.query_service_accounts:
        body: >
          {
            "query": { "term": { "roles": "delegated_ingest_reader" } }
          }
  - match: { total: 2 }

---
"Test a delegate assigns the roles a role pattern matches":
  - do:
      security.put_role:
        name: "service_account_pattern_delegate"
        body: >
          {
            "global": {
              "service_account": {
                "manage": {
                  "names": ["apps/delegated_*"],
                  "roles": ["delegated_*_*"]
                }
              }
            }
          }

  - do:
      security.put_user:
        username: "sa_pattern_delegate"
        body: >
          {
            "password": "x-pack-test-password",
            "roles": ["service_account_pattern_delegate"]
          }

  - do:
      headers:
        Authorization: "Basic c2FfcGF0dGVybl9kZWxlZ2F0ZTp4LXBhY2stdGVzdC1wYXNzd29yZA==" # sa_pattern_delegate
      security.put_user_managed_service_account:
        namespace: apps
        service: delegated_worker
        body: >
          {
            "roles": ["delegated_ingest_reader", "delegated_alert_writer"]
          }
  - match: { created: true }

  # delegated_unlisted has no second underscore, so the pattern does not match it.
  - do:
      catch: forbidden
      headers:
        Authorization: "Basic c2FfcGF0dGVybl9kZWxlZ2F0ZTp4LXBhY2stdGVzdC1wYXNzd29yZA==" # sa_pattern_delegate
      security.put_user_managed_service_account:
        namespace: apps
        service: delegated_worker
        body: >
          {
            "roles": ["delegated_ingest_reader", "delegated_unlisted"]
          }

  - do:
      security.get_role:
        name: "service_account_pattern_delegate"
  - match: { service_account_pattern_delegate.global.service_account.manage.roles: ["delegated_*_*"] }

---
"time_series usage":
  - requires:
      test_runner_features: allowed_warnings
      reason: "the index template overlaps with the global template"

  - do: {xpack.usage: {}}
  - match: { time_series.available: true }
  - match: { time_series.enabled: true }
  - match: { time_series.data_stream_count: 0 }
  - match: { time_series.num_docs: 0 }
  - match: { time_series.size_in_bytes: 0 }

  # A standalone time series index contributes to the doc stats, but not to the data stream counters
  - do:
      indices.create:
        index: standalone-tsdb
        body:
          settings:
            index:
              mode: time_series
              routing_path: [metricset]
              number_of_shards: 1
              number_of_replicas: 0
              time_series:
                start_time: 2021-04-28T00:00:00Z
                end_time: 2021-04-29T00:00:00Z
          mappings:
            properties:
              "@timestamp":
                type: date
              metricset:
                type: keyword
                time_series_dimension: true
              value:
                type: long
  - do:
      bulk:
        index: standalone-tsdb
        refresh: true
        body:
          - '{"index": {}}'
          - '{"@timestamp": "2021-04-28T18:50:04.467Z", "metricset": "pod", "value": 1}'
          - '{"index": {}}'
          - '{"@timestamp": "2021-04-28T18:50:24.467Z", "metricset": "pod", "value": 2}'

  - do: {xpack.usage: {}}
  - match: { time_series.available: true }
  - match: { time_series.data_stream_count: 0 }
  - match: { time_series.num_docs: 2 }
  - gt:    { time_series.size_in_bytes: 0 }

  # A time series data stream is counted, and its docs are added to the doc stats
  - do:
      allowed_warnings:
        - "index template [tsdb-usage-template] has index patterns [k8s-usage*] matching patterns from existing older templates [global] with patterns (global => [*]); this template [tsdb-usage-template] will take precedence during new index creation"
      indices.put_index_template:
        name: tsdb-usage-template
        body:
          index_patterns: [k8s-usage*]
          data_stream: {}
          template:
            settings:
              index:
                mode: time_series
                routing_path: [metricset]
                number_of_shards: 1
                number_of_replicas: 0
                time_series:
                  start_time: 2021-04-28T00:00:00Z
                  end_time: 2021-04-29T00:00:00Z
            mappings:
              properties:
                "@timestamp":
                  type: date
                metricset:
                  type: keyword
                  time_series_dimension: true
                value:
                  type: long
  - do:
      bulk:
        index: k8s-usage
        refresh: true
        body:
          - '{"create": {}}'
          - '{"@timestamp": "2021-04-28T18:50:04.467Z", "metricset": "pod", "value": 1}'
          - '{"create": {}}'
          - '{"@timestamp": "2021-04-28T18:50:24.467Z", "metricset": "pod", "value": 2}'
          - '{"create": {}}'
          - '{"@timestamp": "2021-04-28T18:50:44.467Z", "metricset": "pod", "value": 3}'

  - do: {xpack.usage: {}}
  - match: { time_series.available: true }
  - match: { time_series.data_stream_count: 1 }
  - match: { time_series.index_count: 1 }
  - match: { time_series.num_docs: 5 }
  - gt:    { time_series.size_in_bytes: 0 }

  # A plain standard-mode index must not affect the time series counters
  - do:
      indices.create:
        index: test_standard
  - do:
      bulk:
        index: test_standard
        refresh: true
        body:
          - '{"index": {}}'
          - '{"@timestamp": "2021-04-28T18:51:04.467Z", "metricset": "pod", "value": 4}'

  - do: {xpack.usage: {}}
  - match: { time_series.data_stream_count: 1 }
  - match: { time_series.index_count: 1 }
  - match: { time_series.num_docs: 5 }

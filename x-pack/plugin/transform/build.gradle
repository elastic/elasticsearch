import org.elasticsearch.gradle.Version
import org.elasticsearch.gradle.VersionProperties

apply plugin: 'elasticsearch.internal-es-plugin'
apply plugin: 'elasticsearch.internal-cluster-test'
apply plugin: 'elasticsearch.internal-yaml-rest-test'
esplugin {
  name = 'transform'
  description = 'A plugin to transform data'
  classname ='org.elasticsearch.xpack.transform.Transform'
  extendedPlugins = ['x-pack-core']
}

dependencies {
  compileOnly project(":server")
  compileOnly project(path: xpackModule('core'))

  testImplementation(testArtifact(project(xpackModule('core'))))
  testImplementation project(path: xpackModule('analytics'))
  testImplementation project(path: ':modules:aggregations')
  testImplementation project(path: xpackModule('spatial'))
  testImplementation project(":test:x-content")

  internalClusterTestImplementation project(":modules:reindex")

  yamlRestTestImplementation project(':test:yaml-rest-runner')
  yamlRestTestImplementation(testArtifact(project(xpackModule('core'))))
}

restResources {
  restApi {
    include '*'
  }
}

artifacts {
  restXpackTests(new File(projectDir, "src/yamlRestTest/resources/rest-api-spec/test"))
}

// The remote cluster in the multi-cluster tests runs the previous minor, not the minimum wire compatible version (7.17.x on this branch)
Version ccsCompatVersion = new Version(VersionProperties.getElasticsearchVersion().getMajor(), VersionProperties.getElasticsearchVersion().getMinor() - 1, 0)

tasks.named('yamlRestTest') {
  usesDefaultDistribution("transform yaml rest tests require the default distribution")
  usesBwcDistribution(ccsCompatVersion)
  systemProperty 'tests.ccs_compat_version', ccsCompatVersion.toString()
}

addQaCheckDependencies(project)

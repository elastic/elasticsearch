apply plugin: 'elasticsearch.internal-es-plugin'
apply plugin: 'elasticsearch.internal-yaml-rest-test'
apply plugin: 'elasticsearch.internal-cluster-test'
apply plugin: 'elasticsearch.internal-heap-pressure-test'

esplugin {
  name = 'wildcard'
  description = 'A plugin for a keyword field type with efficient wildcard search'
  classname = 'org.elasticsearch.xpack.wildcard.Wildcard'
  extendedPlugins = ['x-pack-core', 'lang-painless']
}

base {
  archivesName = 'x-pack-wildcard'
}

dependencies {
  compileOnly project(':modules:lang-painless:spi')
  compileOnly project(path: xpackModule('core'))
  testImplementation(testArtifact(project(xpackModule('core'))))

  heapPressureTestImplementation project(':test:framework')
  heapPressureTestImplementation project(':test:test-clusters')
  // The pausable field the heap pressure tests use to hold requests in flight.
  clusterModules project(':test:external-modules:test-pausable-field')
}

tasks.named('heapPressureTest') {
  usesDefaultDistribution("wildcard field type is an x-pack module, only shipped in the default distribution")
}

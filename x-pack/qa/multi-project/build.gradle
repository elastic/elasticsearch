subprojects {
  apply plugin: 'elasticsearch.java'
  apply plugin: 'elasticsearch.bwc-test'

  group = 'org.elasticsearch.qa.multi-project'

  // Captured at configuration time: the configuration cache detaches onlyIf closures from the build script.
  def isSnapshotBuild = buildParams.snapshotBuild
  tasks.named { it == "javaRestTest" || it == "yamlRestTest" }.configureEach {
    it.onlyIf("snapshot build") { isSnapshotBuild }
  }
}

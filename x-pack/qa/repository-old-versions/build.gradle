import org.elasticsearch.gradle.Version
import org.elasticsearch.gradle.testclusters.StandaloneRestIntegTestTask

apply plugin: 'elasticsearch.internal-testclusters'
apply plugin: 'elasticsearch.internal-yaml-rest-test'

dependencies {
  yamlRestTestImplementation project(':test:fixtures:old-elasticsearch-container')
}

restResources {
  restApi {
    include '_common', 'search'
  }
  restTests {
    includeCore 'search/390_doc_values_search.yml'
  }
}

interface Injected {
  @Inject
  FileSystemOperations getFs()
}

// Disable the default yamlRestTest task — per-version tasks below drive the suite
tasks.named("yamlRestTest") {
  enabled = false
}

int currentMajorVersion = org.elasticsearch.gradle.VersionProperties.elasticsearchVersion.major
assert (currentMajorVersion - 2) == 7 : "add archive BWC tests for major version " + (currentMajorVersion - 2)

for (String versionString : ['5.0.0', '5.6.16', '6.0.0', '6.8.20']) {
  Version version = Version.fromString(versionString)
  String versionNoDots = version.toString().replace('.', '_')
  String repoLocation = "${buildDir}/cluster/shared/repo/${versionNoDots}"

  tasks.register("yamlRestTest#${versionNoDots}", StandaloneRestIntegTestTask) {
    testClassesDirs = sourceSets.yamlRestTest.output.classesDirs
    classpath = sourceSets.yamlRestTest.runtimeClasspath
    usesDefaultDistribution("Tests use x-pack security, searchable snapshots, and source-only repository features")
    def injected = project.objects.newInstance(Injected)

    doFirst {
      injected.getFs().delete { d ->
        d.delete(repoLocation)
      }
      new File(repoLocation).mkdirs()
    }

    systemProperty 'tests.es.version', version.toString()
    nonInputProperties.systemProperty "tests.repo.location", repoLocation
  }

  tasks.named("check").configure {
    dependsOn "yamlRestTest#${versionNoDots}"
  }
}

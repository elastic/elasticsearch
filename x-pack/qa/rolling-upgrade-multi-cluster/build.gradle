import org.elasticsearch.gradle.testclusters.StandaloneRestIntegTestTask

apply plugin: 'elasticsearch.internal-java-rest-test'
apply plugin: 'elasticsearch.bwc-test'

// Each suite is parameterized over the upgrade states and an earlier state sets up the cluster state a later one asserts on,
// so a state that passed must still run when a later state is retried.
smartRetry.pruneIndividualTests.set(false)

dependencies {
  javaRestTestImplementation project(':x-pack:qa')
}

buildParams.bwcVersions.withWireCompatible { bwcVersion, baseName ->
  tasks.register(bwcTaskName(bwcVersion), StandaloneRestIntegTestTask) {
    usesBwcDistribution(bwcVersion)
    systemProperty("tests.upgrade_from_version", bwcVersion.toString().replace('-SNAPSHOT', ''))
    maxParallelForks = 1
    if (System.getProperty("tests.timeoutSuite") == null) {
      // CcrRollingUpgradeIT boots two 3-node clusters and performs up to 6 rolling
      // node restarts in one suite; under CI contention this leaves too little
      // margin against the 1,200,000ms (20min) default. See #163301, #163266, #160284.
      systemProperty("tests.timeoutSuite", "1800000!")
    }
  }
}

// Security is explicitly disabled, do not run tests in FIPS mode
tasks.withType(Test).configureEach {
  buildParams.withFipsEnabledOnly(it)
}